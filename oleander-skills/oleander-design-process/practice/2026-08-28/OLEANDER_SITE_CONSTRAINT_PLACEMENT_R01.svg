<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / SITE CONSTRAINT → PLACEMENT + ORIENTATION</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">场地条件必须改变建筑放置与朝向；不能只停在“现状分析”图层</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic community workshop · NTS · exercise assumptions only · no code / grading / accessibility / engineering claim</text>
<rect x="88" y="208" width="1744" height="120" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="242" font-size="11.5" font-weight="700" fill="#8B5D46">EVIDENCE / SITE INPUT</text><text x="116" y="268" font-size="12.5" fill="#29332F">West = public arrival；East = service road。</text><text x="116" y="291" font-size="12.5" fill="#29332F">North-center = existing grove to retain in exercise.</text>
<text x="562" y="242" font-size="11.5" font-weight="700" fill="#7D654B">INFERENCE</text><text x="562" y="268" font-size="12.5" fill="#29332F">centered object can force public/service crossing</text><text x="562" y="291" font-size="12.5" fill="#29332F">and consume the strongest existing site element.</text>
<text x="1008" y="242" font-size="11.5" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text><text x="1008" y="268" font-size="12.5" fill="#29332F">public arrival + delivery happen together;</text><text x="1008" y="291" font-size="12.5" fill="#29332F">grove remains non-build zone in the exercise.</text>
<text x="1452" y="242" font-size="11.5" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1452" y="268" font-size="12.5" fill="#29332F">separate arrival ownership;</text><text x="1452" y="291" font-size="12.5" fill="#29332F">shift / rotate mass around retained site condition.</text></g>
<g font-family="Arial,sans-serif" font-size="10.5" fill="#59615F"><circle cx="118" cy="360" r="7" fill="#849A77"/><text x="132" y="364">existing grove + exercise retain-zone (NTS)</text><line x1="390" y1="360" x2="423" y2="360" stroke="#315D57" stroke-width="4"/><text x="431" y="364">public</text><line x1="500" y1="360" x2="533" y2="360" stroke="#8B5D46" stroke-width="4"/><text x="541" y="364">service</text></g>
<rect x="88" y="390" width="548" height="510" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="120" y="432" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · CENTERED OBJECT</text><text x="120" y="462" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13.5" fill="#59615F">先放“完整体量”，再把西侧 public 与东侧 service 接上。</text>
<rect x="126" y="490" width="470" height="282" rx="16" fill="#F7F3EA"/><rect x="142" y="508" width="438" height="246" rx="10" fill="none" stroke="#B9B2A6" stroke-width="2"/><circle cx="350" cy="548" r="58" fill="none" stroke="#849A77" stroke-width="2.5" stroke-dasharray="7 6" opacity=".85"/><g fill="#849A77" opacity=".88"><circle cx="320" cy="544" r="22"/><circle cx="352" cy="532" r="24"/><circle cx="382" cy="548" r="20"/><circle cx="346" cy="562" r="19"/></g><rect x="250" y="574" width="226" height="114" rx="12" fill="#C7C1B6" stroke="#5E6662" stroke-width="3"/><path d="M142 668 H250" stroke="#315D57" stroke-width="5"/><path d="M580 630 H476" stroke="#8B5D46" stroke-width="5"/><path d="M206 668 C300 636 384 634 520 630" stroke="#315D57" stroke-width="3" opacity=".55"/><path d="M536 630 C450 650 374 652 272 668" stroke="#8B5D46" stroke-width="3" opacity=".55"/><circle cx="374" cy="644" r="25" fill="none" stroke="#914F3D" stroke-width="3"/><text x="298" y="736" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#914F3D">crossing retained in site layout</text><text x="120" y="806" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#7D4A3A">GROVE-OFF → centered mass only works by deleting a given site condition.</text><text x="120" y="832" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#7D4A3A">SIMULTANEOUS ARRIVAL → public/service share the same approach field.</text><rect x="120" y="856" width="484" height="28" rx="8" fill="#F7F3EA"/><text x="140" y="875" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.2" fill="#7D4A3A">ROOT · site analysis exists, but placement does not respond to it.</text>
<rect x="686" y="390" width="612" height="510" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="718" y="432" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · SHIFTED BAR + TWO-SIDED ACCESS</text><text x="718" y="462" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13.5" fill="#59615F">体量向南移并转为 east–west bar；grove 留在前场，public/service 各占一侧。</text><rect x="724" y="490" width="538" height="282" rx="16" fill="#F7F3EA"/><rect x="740" y="508" width="506" height="246" rx="10" fill="none" stroke="#B9B2A6" stroke-width="2"/><circle cx="950" cy="550" r="60" fill="none" stroke="#849A77" stroke-width="2.5" stroke-dasharray="7 6" opacity=".85"/><g fill="#849A77" opacity=".88"><circle cx="916" cy="548" r="22"/><circle cx="950" cy="534" r="24"/><circle cx="984" cy="550" r="20"/><circle cx="950" cy="568" r="19"/></g><rect x="826" y="624" width="324" height="76" rx="10" fill="#C7C1B6" stroke="#5E6662" stroke-width="3"/><path d="M740 660 H826" stroke="#315D57" stroke-width="5"/><path d="M1246 660 H1150" stroke="#8B5D46" stroke-width="5"/><path d="M800 660 C816 612 852 582 896 566" fill="none" stroke="#315D57" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M1208 660 H1152" stroke="#8B5D46" stroke-width="3"/><text x="754" y="730" font-family="Arial,sans-serif" font-size="10.5" fill="#315D57">WEST / PUBLIC</text><text x="1138" y="730" font-family="Arial,sans-serif" font-size="10.5" fill="#8B5D46">EAST / SERVICE</text><text x="718" y="806" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#315D57">LABEL-OFF → grove / mass / two access edges remain geometrically distinct.</text><text x="718" y="832" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#315D57">SIMULTANEOUS ARRIVAL → public and delivery do not share the same approach line.</text><rect x="718" y="856" width="548" height="28" rx="8" fill="#F7F3EA"/><text x="738" y="875" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.2" fill="#315D57">CONSEQUENCE · site condition changes placement, orientation and access ownership.</text>
<rect x="1348" y="390" width="484" height="510" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="1380" y="432" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · COURTYARD AROUND GROVE</text><text x="1380" y="462" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13.5" fill="#59615F">grove 被保留为中心，但 service 仍借公共环路到达东侧。</text><rect x="1384" y="490" width="416" height="282" rx="16" fill="#F7F3EA"/><rect x="1400" y="508" width="384" height="246" rx="10" fill="none" stroke="#B9B2A6" stroke-width="2"/><path d="M1430 542 H1754 V714 H1430 Z M1510 578 H1674 V674 H1510 Z" fill="#D0CBC1" fill-rule="evenodd" stroke="#5E6662" stroke-width="3"/><circle cx="1592" cy="620" r="58" fill="none" stroke="#849A77" stroke-width="2.5" stroke-dasharray="7 6" opacity=".85"/><g fill="#849A77" opacity=".9"><circle cx="1560" cy="616" r="20"/><circle cx="1592" cy="604" r="22"/><circle cx="1622" cy="620" r="18"/><circle cx="1592" cy="638" r="18"/></g><path d="M1400 690 H1470 C1540 690 1600 704 1670 704" stroke="#315D57" stroke-width="5" fill="none"/><path d="M1784 548 H1722 C1702 548 1690 590 1690 624 C1690 668 1660 704 1610 704" stroke="#8B5D46" stroke-width="5" fill="none"/><circle cx="1646" cy="704" r="23" fill="none" stroke="#8A6941" stroke-width="3"/><text x="1510" y="736" font-family="Arial,sans-serif" font-size="10.5" fill="#8A6941">shared ring still carries service conflict</text><text x="1380" y="806" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#8A6941">SERVICE ATTACK → delivery enters the shared public ring before reaching east side.</text><text x="1380" y="832" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#8A6941">REPAIR → viable if service edge becomes independent.</text><rect x="1380" y="856" width="420" height="28" rx="8" fill="#F7F3EA"/><text x="1400" y="875" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.2" fill="#59615F">preserving an object does not resolve every site relation.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="986" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#18211F">SITE→PLACEMENT TEST</text><text x="88" y="1012" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14.5" fill="#59615F">Remove labels and facade treatment: access ownership, retained condition and mass placement must still encode the site relation.</text><text x="88" y="1044" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no real survey, topography, traffic study, tree assessment, grading, drainage, accessibility, code, structure or site approval is proven.</text>
