<g id="ROW_01"><rect x="72" y="300" width="1656" height="275" class="soft"/>
<text x="100" y="340" class="viewtitle">E-01 / NETWORK SOURCE</text><text x="100" y="366" class="tx">Source map shows a branched route network.</text><text x="100" y="389" class="sm">SOURCE-GROUNDED · confidence HIGH</text><g transform="translate(145 445)"><circle cx="0" cy="40" r="5" fill="#17201e"/><circle cx="105" cy="0" r="5" fill="#17201e"/><circle cx="190" cy="58" r="5" fill="#17201e"/><circle cx="300" cy="20" r="5" fill="#17201e"/><line x1="0" y1="40" x2="105" y2="0" class="strong"/><line x1="105" y1="0" x2="190" y2="58" class="strong"/><line x1="105" y1="0" x2="300" y2="20" class="strong"/></g>
<path d="M535 438 H620" class="arrow"/><path d="M620 438 l-11 -7 m11 7 l-11 7" class="arrow"/>
<text x="665" y="340" class="viewtitle">F-01 / ROUTE IS NOT LINEAR</text><text x="665" y="366" class="tx">Decision load concentrates at junctions, not every node.</text><text x="665" y="389" class="sm">INFERENCE FROM E-01</text><g transform="translate(705 455)"><line x1="0" y1="22" x2="300" y2="22" class="guide"/><circle cx="150" cy="22" r="33" fill="none" stroke="#8b684f" stroke-width="2.5"/><path d="M150 22 L285 -28 M150 22 L285 78" class="infer"/></g>
