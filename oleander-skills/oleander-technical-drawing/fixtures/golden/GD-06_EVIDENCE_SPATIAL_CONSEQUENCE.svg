<text x="1210" y="340" class="viewtitle">D-01 / PRIORITIZE JUNCTION READABILITY</text><text x="1210" y="366" class="tx">Route / Return before optional interpretation.</text><text x="1210" y="389" class="sm">DESIGN DECISION · source network unchanged</text><path d="M1245 474 H1650" class="decision"/><circle cx="1448" cy="474" r="30" fill="#f4f1e9" stroke="#4d6285" stroke-width="3"/><text x="1428" y="479" class="label">ROUTE</text><text x="1210" y="535" class="label">PRIMARY CHAIN / 3-SECOND READ</text></g>
