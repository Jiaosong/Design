<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.t1{font-size:28px;font-weight:700}.t2{font-size:15px;font-weight:700}.tx{font-size:12px}.sm{font-size:10px;fill:#666}.card{fill:#fff;stroke:#c9c9c4;stroke-width:1.5}.ev{fill:#f1f3f2;stroke:#5f746c}.find{fill:#f7f4ef;stroke:#8a6c55}.dec{fill:#f0f2f6;stroke:#586b8a}.arrow{stroke:#777;stroke-width:1.5;fill:none}.base{stroke:#aaa;stroke-width:1;fill:none}.strong{stroke:#222;stroke-width:3;fill:none}.infer{stroke:#8a6c55;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.decision{stroke:#586b8a;stroke-width:2.5;fill:none}</style>
<rect width="1800" height="1200" fill="#fff"/>
<text x="80" y="72" class="t1">GD-06 / EVIDENCE → SPATIAL FINDING → DESIGN CONSEQUENCE</text><text x="80" y="100" class="sm">Analysis reasoning fixture · every consequence must preserve traceable source and truth state · no unsupported conclusion title</text>
<g id="COLUMN_HEADERS"><rect x="80" y="145" width="500" height="55" class="ev"/><rect x="650" y="145" width="500" height="55" class="find"/><rect x="1220" y="145" width="500" height="55" class="dec"/><text x="105" y="178" class="t2">01 / EVIDENCE</text><text x="675" y="178" class="t2">02 / SPATIAL FINDING</text><text x="1245" y="178" class="t2">03 / DESIGN CONSEQUENCE</text></g>
<g id="ROW_01">
<rect x="80" y="230" width="500" height="205" class="card"/><text x="105" y="262" class="t2">E-01 / NETWORK SOURCE</text><text x="105" y="288" class="tx">Observed/source map shows a branched route network.</text><text x="105" y="312" class="sm">Truth: SOURCE-GROUNDED · confidence: HIGH</text><g transform="translate(120 330)"><circle cx="0" cy="40" r="5" fill="#222"/><circle cx="100" cy="0" r="5" fill="#222"/><circle cx="180" cy="55" r="5" fill="#222"/><circle cx="260" cy="20" r="5" fill="#222"/><line x1="0" y1="40" x2="100" y2="0" class="strong"/><line x1="100" y1="0" x2="180" y2="55" class="strong"/><line x1="100" y1="0" x2="260" y2="20" class="strong"/></g>
<rect x="650" y="230" width="500" height="205" class="card"/><text x="675" y="262" class="t2">F-01 / ROUTE IS NOT LINEAR</text><text x="675" y="288" class="tx">Navigation decisions concentrate at junctions, not at every node.</text><text x="675" y="312" class="sm">Truth: INFERENCE FROM E-01</text><g transform="translate(700 342)"><line x1="0" y1="30" x2="290" y2="30" class="base"/><circle cx="145" cy="30" r="28" fill="none" stroke="#8a6c55" stroke-width="2"/><path d="M145 30 L260 -15 M145 30 L260 75" class="infer"/></g>
<rect x="1220" y="230" width="500" height="205" class="card"/><text x="1245" y="262" class="t2">D-01 / PRIORITIZE JUNCTION READABILITY</text><text x="1245" y="288" class="tx">Put route/return information before optional interpretation.</text><text x="1245" y="312" class="sm">State: DESIGN DECISION · does not change source network</text><g transform="translate(1270 350)"><path d="M0 30 H290" class="decision"/><circle cx="145" cy="30" r="24" fill="#fff" stroke="#586b8a" stroke-width="2"/><text x="120" y="35" class="sm">ROUTE</text></g>
<path d="M580 332 H640" class="arrow"/><path d="M640 332 l-10 -6 m10 6 l-10 6" class="arrow"/><path d="M1150 332 H1210" class="arrow"/><path d="M1210 332 l-10 -6 m10 6 l-10 6" class="arrow"/>
</g>
<g id="ROW_02">
<rect x="80" y="465" width="500" height="205" class="card"/><text x="105" y="497" class="t2">E-02 / OPEN VIEW WINDOW</text><text x="105" y="523" class="tx">Source image/geometry supports a broad outward view at one segment.</text><text x="105" y="547" class="sm">Truth: SOURCE-BOUND · field exactness OPEN</text><path d="M125 610 L300 545 L470 620 Z" fill="#e1e9e6" stroke="#5f746c" stroke-width="1.5"/>
<rect x="650" y="465" width="500" height="205" class="card"/><text x="675" y="497" class="t2">F-02 / PAUSE CAN USE EXISTING SPATIAL RELIEF</text><text x="675" y="523" class="tx">A pause function can sit where the view already opens.</text><text x="675" y="547" class="sm">Truth: DESIGN INFERENCE · verify capacity/safety</text><line x1="705" y1="615" x2="1080" y2="560" class="base"/><rect x="820" y="560" width="140" height="48" fill="#fff" stroke="#8a6c55" stroke-width="1.5"/>
<rect x="1220" y="465" width="500" height="205" class="card"/><text x="1245" y="497" class="t2">D-02 / ADD NO NEW DOMINANT OBJECT</text><text x="1245" y="523" class="tx">Use edge/rest logic; keep landscape as first read.</text><text x="1245" y="547" class="sm">State: DESIGN DECISION · FIELD safety/geometry remains open</text><line x1="1270" y1="615" x2="1650" y2="560" class="strong"/><line x1="1400" y1="596" x2="1510" y2="580" class="decision"/><circle cx="1450" cy="548" r="8" fill="#222"/><line x1="1450" y1="556" x2="1450" y2="590" class="strong"/>
<path d="M580 567 H640" class="arrow"/><path d="M640 567 l-10 -6 m10 6 l-10 6" class="arrow"/><path d="M1150 567 H1210" class="arrow"/><path d="M1210 567 l-10 -6 m10 6 l-10 6" class="arrow"/>
</g>
<g id="ROW_03">
<rect x="80" y="700" width="500" height="205" class="card"/><text x="105" y="732" class="t2">E-03 / UNKNOWN SUBGRADE + DRAINAGE</text><text x="105" y="758" class="tx">Remote evidence cannot close local soil/water conditions.</text><text x="105" y="782" class="sm">Truth: FIELD OPEN · confidence on unknown: HIGH</text><path d="M125 850 C220 815 300 865 410 830" class="infer"/><text x="125" y="882" class="sm">FIELD VERIFY zone</text>
<rect x="650" y="700" width="500" height="205" class="card"/><text x="675" y="732" class="t2">F-03 / FOUNDATION CANNOT BE FINALIZED REMOTELY</text><text x="675" y="758" class="tx">Only support relationship and bounded concept may be drawn.</text><text x="675" y="782" class="sm">Truth: LIMIT / CONSTRAINT</text><rect x="810" y="820" width="150" height="40" fill="#fff" stroke="#8a6c55" stroke-dasharray="5 4"/>
<rect x="1220" y="700" width="500" height="205" class="card"/><text x="1245" y="732" class="t2">D-03 / CONTINUE DESIGN WITH VERIFY SLOT</text><text x="1245" y="758" class="tx">Show recommended relation + sensitivity + FIELD/engineer closure.</text><text x="1245" y="782" class="sm">State: PROVISIONAL TECHNICAL EXPLANATION</text><rect x="1270" y="820" width="360" height="48" fill="#fff" stroke="#586b8a" stroke-width="1.5"/><text x="1290" y="850" class="tx">RECOMMENDATION → SENSITIVITY → VERIFY</text>
<path d="M580 802 H640" class="arrow"/><path d="M640 802 l-10 -6 m10 6 l-10 6" class="arrow"/><path d="M1150 802 H1210" class="arrow"/><path d="M1210 802 l-10 -6 m10 6 l-10 6" class="arrow"/>
</g>
<g id="TRACEABILITY_FOOTER"><rect x="80" y="945" width="1640" height="165" fill="#fafaf8" stroke="#ccc"/><text x="105" y="975" class="t2">TRACEABILITY RULE</text><text x="105" y="1002" class="tx">Every FINDING must name its Evidence ID. Every DESIGN CONSEQUENCE must name the finding it responds to. A missing link is an analysis failure.</text><text x="105" y="1028" class="tx">Evidence absence is not repaired with a stronger visual. UNKNOWN remains visible; assumptions cannot be rendered with the same authority as source-grounded geometry.</text><text x="105" y="1058" class="sm">Boundary with oleander-data-viz: quantities, distributions, time series and statistical uncertainty remain data-viz; this fixture governs spatial/design reasoning diagrams.</text><text x="105" y="1086" class="sm">Fixture ID: GD-06 · Required groups: ROW_01 / ROW_02 / ROW_03 / TRACEABILITY_FOOTER · Status: GOLDEN CANDIDATE / independent review required</text></g>
</svg>