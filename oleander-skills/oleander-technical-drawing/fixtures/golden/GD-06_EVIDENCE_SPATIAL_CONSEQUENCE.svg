<text x="100" y="655" class="label">E-02 · OPEN VIEW WINDOW</text><text x="100" y="678" class="tx">Source image / geometry supports broad outward view.</text><path d="M120 785 L300 705 L505 800 Z" fill="#d6e3df" stroke="#4f7168" stroke-width="1.5"/>
<text x="665" y="655" class="label">F-02 · USE EXISTING SPATIAL RELIEF</text><text x="665" y="678" class="tx">Pause can sit where the view already opens.</text><text x="665" y="701" class="sm">DESIGN INFERENCE · capacity / safety verify</text><line x1="705" y1="790" x2="1050" y2="720" class="guide"/><rect x="810" y="730" width="150" height="46" fill="#f4f1e9" stroke="#8b684f" stroke-width="1.5"/>
<text x="1210" y="655" class="label">D-02 · NO NEW DOMINANT OBJECT</text><text x="1210" y="678" class="tx">Use edge/rest logic; landscape remains first read.</text><text x="1210" y="701" class="sm">FIELD SAFETY / GEOMETRY OPEN</text><line x1="1245" y1="790" x2="1665" y2="720" class="strong"/><line x1="1400" y1="764" x2="1515" y2="745" class="decision"/><circle cx="1455" cy="715" r="7" fill="#17201e"/><line x1="1455" y1="722" x2="1455" y2="758" class="strong"/></g>
<g id="ROW_03"><line x1="72" y1="838" x2="1728" y2="838" class="hair"/>
<text x="100" y="875" class="label">E-03 · UNKNOWN SUBGRADE + DRAINAGE</text><text x="100" y="898" class="sm">FIELD OPEN · remote evidence cannot close local soil/water.</text><path d="M105 930 C220 900 320 940 470 905" class="open"/>
<text x="665" y="875" class="label">F-03 · FOUNDATION CANNOT BE FINALIZED REMOTELY</text><text x="665" y="898" class="sm">LIMIT / CONSTRAINT · relationship only.</text><rect x="825" y="918" width="155" height="35" fill="none" stroke="#8b684f" stroke-dasharray="6 5"/>
<text x="1210" y="875" class="label">D-03 · CONTINUE WITH VERIFY SLOT</text><text x="1210" y="898" class="sm">PROVISIONAL TECHNICAL EXPLANATION</text><path d="M1230 935 H1640" class="decision"/><text x="1270" y="926" class="tx">RECOMMENDATION → SENSITIVITY → VERIFY</text></g>
<g id="TRACEABILITY_FOOTER"><text x="72" y="1038" class="cap">TRACEABILITY / NEAR READ</text><text x="72" y="1066" class="tx">Every FINDING names evidence. Every DESIGN CONSEQUENCE names the finding it responds to. Missing links are analysis failures.</text><text x="72" y="1090" class="sm">UNKNOWN cannot be repaired by stronger graphics. Boundary: quantitative distributions/time series/statistical uncertainty remain oleander-data-viz.</text><text x="72" y="1125" class="label">GOLDEN CANDIDATE · independent visual review required</text><text x="1728" y="1125" class="sm" text-anchor="end">GD-06 · REV B · 2026-08-17</text></g>
