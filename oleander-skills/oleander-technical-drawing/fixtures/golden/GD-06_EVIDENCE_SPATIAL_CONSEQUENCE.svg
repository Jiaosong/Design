<g id="HIERARCHY_FRAME"><line x1="72" y1="54" x2="1728" y2="54" class="hair"/><line x1="72" y1="1000" x2="1728" y2="1000" class="hair"/></g>
<text x="72" y="88" class="cap">GD-06 · ANALYSIS REASONING · EVIDENCE → FINDING → CONSEQUENCE</text><text x="1728" y="88" class="sm" text-anchor="end">TRACEABLE VECTOR LOGIC · NO UNSUPPORTED CONCLUSION TITLE</text>
<g id="PRIMARY_CLAIM"><text x="72" y="150" class="claim">EVIDENCE MUST SURVIVE THE DESIGN CONCLUSION.</text><text x="72" y="178" class="tx">The dominant chain is E-01 → F-01 → D-01; supporting cases remain visible without becoming nine equal cards.</text></g>
