<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17201e}.cap{font-size:11px;font-weight:700;letter-spacing:2px;fill:#68716c}.claim{font-size:36px;font-weight:700}.viewtitle{font-size:15px;font-weight:700}.label{font-size:12px;font-weight:700}.tx{font-size:11px}.sm{font-size:9.5px;fill:#707773}.paper{fill:#f4f1e9}.ev{fill:#4f7168}.find{fill:#8b684f}.dec{fill:#4d6285}.hair{stroke:#c6c9c3;stroke-width:1}.guide{stroke:#b9bdb7;stroke-width:1;fill:none}.strong{stroke:#17201e;stroke-width:3.5;fill:none}.infer{stroke:#8b684f;stroke-width:1.8;fill:none;stroke-dasharray:6 5}.decision{stroke:#4d6285;stroke-width:3;fill:none}.arrow{stroke:#6e7772;stroke-width:1.4;fill:none}.soft{fill:#ecebe4}.open{stroke:#915844;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
