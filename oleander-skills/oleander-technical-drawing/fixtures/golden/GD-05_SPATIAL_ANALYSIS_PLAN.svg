<g id="HIERARCHY_FRAME"><line x1="72" y1="54" x2="1728" y2="54" class="hair"/><line x1="1295" y1="132" x2="1295" y2="970" class="hair"/><line x1="72" y1="1000" x2="1728" y2="1000" class="hair"/></g>
<text x="72" y="88" class="cap">GD-05 · SPATIAL ANALYSIS · SOURCE / EVIDENCE / INFERENCE / DECISION</text><text x="1728" y="88" class="sm" text-anchor="end">LOCKED TRAINING GEOMETRY · NOT GEOREFERENCED · NOT A STATISTICAL CHART</text>
<g id="PRIMARY_CLAIM"><text x="72" y="148" class="claim">KEEP THE JUNCTION LEGIBLE.</text><text x="72" y="176" class="tx">The source route already carries the spatial spine; the design decision clarifies the junction without inventing a new network.</text></g>
<g id="ANALYSIS_BASE"><rect x="72" y="215" width="1185" height="742" rx="4" class="fieldbg"/><text x="98" y="250" class="cap">DOMINANT SPATIAL FIELD · 3S = ROUTE + JUNCTION · 30S = EVIDENCE + CONSTRAINT</text>
