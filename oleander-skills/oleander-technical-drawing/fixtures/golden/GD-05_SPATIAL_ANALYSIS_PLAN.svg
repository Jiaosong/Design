<g id="TRUTH_STATE_MARKERS"><text x="98" y="910" class="sm">SOURCE = solid / EVIDENCE = bounded fill / INFERENCE = dashed / DECISION = blue line + ID · UNKNOWN remains FIELD OPEN.</text><text x="98" y="934" class="sm">Overlay styling may clarify reading order; it may not distort source geometry to strengthen the conclusion.</text></g></g>
<g id="ANNOTATION_RAIL"><rect x="1320" y="132" width="408" height="838" class="rail"/><text x="1348" y="176" class="cap">ANNOTATION RAIL</text>
<g id="ANALYSIS_CONCLUSION"><text x="1348" y="220" class="viewtitle">30-SECOND TRACE</text><text x="1348" y="258" class="label">01 · SOURCE SPINE</text><text x="1348" y="280" class="tx">Existing route geometry already organizes movement.</text><text x="1348" y="330" class="label">02 · DECISION-LOAD JUNCTION</text><text x="1348" y="352" class="tx">The junction is the point where route reading must win.</text><text x="1348" y="402" class="label">03 · OPEN VIEW / NO FORCED STOP</text><text x="1348" y="424" class="tx">Pause can use the existing opening without a dominant object.</text><text x="1348" y="474" class="label">04 · STEEPER BAND</text><text x="1348" y="496" class="tx">Constraint argues against added occupation.</text></g>
<line x1="1348" y1="540" x2="1700" y2="540" class="hair"/>
<g id="ANALYSIS_LEGEND"><text x="1348" y="578" class="viewtitle">TRUTH / SEMANTIC KEY</text><line x1="1348" y1="618" x2="1415" y2="618" class="route"/><text x="1432" y="623" class="tx">SOURCE ROUTE</text><rect x="1348" y="650" width="66" height="26" class="view"/><text x="1432" y="669" class="tx">EVIDENCE</text><rect x="1348" y="692" width="66" height="26" class="risk"/><text x="1432" y="711" class="tx">CONSTRAINT</text><line x1="1348" y1="748" x2="1415" y2="748" class="infer"/><text x="1432" y="753" class="tx">INFERENCE</text><line x1="1348" y1="792" x2="1415" y2="792" class="decision"/><text x="1432" y="797" class="tx">DESIGN DECISION</text><text x="1348" y="852" class="sm">Position / stroke / pattern establish hierarchy before color.</text><text x="1348" y="876" class="sm">Quantitative magnitude routes to oleander-data-viz.</text></g></g>
