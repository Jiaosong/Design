<line x1="96" y1="960" x2="1824" y2="960" stroke="#BDB6A8" stroke-width="2"/><text x="96" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="300" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">A minimum-size page is incomplete unless it also shows the asset handoff that preserves recognition on both sides of the threshold.</text><text x="96" y="1045" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Proxy mark only; does not alter or replace C04 Stone Seal Geometry Authority. Physical sizes remain proof-open.</text>
