<text x="96" y="174" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#69706D">C04 CH14 P03 current decisions · Primary 180px · Mark 48px · Micro 24–32px CANDIDATE · training-only diagnostic</text>
