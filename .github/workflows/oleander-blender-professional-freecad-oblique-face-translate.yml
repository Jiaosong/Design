name: OLEANDER Blender Professional FreeCAD Oblique Face Translate

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-oblique-face-translate.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-oblique-face-translate.yml"

permissions:
  contents: read

jobs:
  oblique-planar-face-translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR: /tmp/oleander-oblique-face-translate
      PROBE: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile oblique face translate probe source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "${PROBE}"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path("oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate.py")
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("OLEANDER_OBLIQUE_FACE_TRANSLATE_SOURCE=PASS")
          PY

      - name: Download and verify FreeCAD 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "/tmp/${FREECAD_APPIMAGE}" \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-oblique-face-translate-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version

      - name: Execute oblique planar BRep ReShape probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}"
          cat > /tmp/oleander_oblique_face_translate_runner.py <<PY
          import runpy
          import traceback
          print("OLEANDER_OBLIQUE_FACE_TRANSLATE_WRAPPER=START", flush=True)
          try:
              runpy.run_path(r"${GITHUB_WORKSPACE}/${PROBE}", run_name="__main__")
          except BaseException as exc:
              print("OLEANDER_OBLIQUE_FACE_TRANSLATE_WRAPPER_EXCEPTION=" + repr(exc), flush=True)
              traceback.print_exc()
              raise
          print("OLEANDER_OBLIQUE_FACE_TRANSLATE_WRAPPER=PASS", flush=True)
          PY
          python3 -m py_compile /tmp/oleander_oblique_face_translate_runner.py
          /tmp/squashfs-root/usr/bin/freecadcmd /tmp/oleander_oblique_face_translate_runner.py \
            2>&1 | tee /tmp/oleander-oblique-face-translate.log
          grep -F 'OLEANDER_OBLIQUE_FACE_TRANSLATE_WRAPPER=PASS' /tmp/oleander-oblique-face-translate.log
          grep -F 'OLEANDER_FREECAD_OBLIQUE_FACE_TRANSLATE=' /tmp/oleander-oblique-face-translate.log
          grep -F '"schema": "OLEANDER_FREECAD_OBLIQUE_FACE_TRANSLATE_v0.1"' /tmp/oleander-oblique-face-translate.log
          grep -F '"status": "PASS"' /tmp/oleander-oblique-face-translate.log
          grep -F '"selector_miss": "PASS"' /tmp/oleander-oblique-face-translate.log
          test -s "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}/oleander_oblique_face_translate.FCStd"
          test -s "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}/oleander_oblique_face_translate_R001.step"
          test -s "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}/oleander_oblique_face_translate_R002.step"
          test -s "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}/oleander_oblique_face_translate_display.json"
          test -s "${OLEANDER_OBLIQUE_FACE_TRANSLATE_DIR}/oleander_oblique_face_translate_manifest.json"

      - name: Download official Blender 5.1.2 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          sha256sum --check blender-selected.sha256
          tar -xf "${BLENDER_ARCHIVE}"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Read oblique derivatives in Blender and reopen
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_oblique_face_translate_blender_readback.py \
            2>&1 | tee /tmp/oleander-oblique-face-translate-blender.log
          grep -F 'OLEANDER_OBLIQUE_FACE_TRANSLATE_BLENDER_READBACK=' /tmp/oleander-oblique-face-translate-blender.log
          grep -F '"status": "PASS"' /tmp/oleander-oblique-face-translate-blender.log
          grep -F '"blender": "DISPLAY_DERIVATIVE_ONLY"' /tmp/oleander-oblique-face-translate-blender.log

      - name: Record bounded oblique face-translation evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Bounded Oblique Planar Face Translate'
            echo '- FreeCAD 1.1.3 / OCCT 7.8.1 remains authoritative; Blender 5.1.2 is display-only.'
            echo '- Semantic local +X face is re-resolved from its transformed world normal after dimensional and yaw changes.'
            echo '- R001 yaw +30 deg and R002 yaw -25 deg ensure the selected face is not aligned to world X/Y/Z.'
            echo '- Each target translates 5 mm strictly in its own tangent plane and target + four adjacent faces are rebuilt through BRepTools_ReShape.'
            echo '- Valid single-solid topology and source volume are preserved; opposite face center and area remain unchanged.'
            echo '- Zero, normal-component, >20 mm, and selector-miss cases fail before accepted mutation.'
            echo '- FCStd + R001/R002 STEP persist; Blender reads two DISPLAY_DERIVATIVE_ONLY tessellations and reopens the .blend.'
            echo '- Does NOT prove arbitrary 3D-oriented planar edits, nonplanar edits, arbitrary rotate/push-pull, persistent topology naming, or P0-B PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
