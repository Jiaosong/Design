name: OLEANDER CAD Tangent Absorb Patch

on:
  push:
    branches:
      - feat/oleander-blender-cad-tangent-move-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-cad-tangent-absorb-nonworkflow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-cad-tangent-move-v01-20260910
          fetch-depth: 0
      - name: Absorb Tangent into existing validation owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('oleander-skills/oleander-3d-pipeline/blender_runtime')
          service = root / 'tests/professional/freecad_cad_direct_edit_service.py'
          stage3 = root / 'tests/validate_stage3_direct.py'
          integration = root / 'tests/professional/probe_cad_direct_edit_integration.py'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          service_text = service.read_text(encoding='utf-8')
          old_doc = '''\"\"\"Bounded FreeCAD/OCCT executor for OLEANDER CAD direct-edit requests.\n\nThis is a process-sidecar service under the existing CAD Sidecar Integration\nsurface. It executes exactly one bounded operation: FACE_NORMAL_MOVE on the\nuniquely re-resolved +Z planar top face of a rectangular prismatic single solid.\nIt never persists FaceN/EdgeN ordinals and returns HOLD, with no released output\nartifacts, when semantic face resolution is missing or ambiguous.\n\nThis is not general push/pull, persistent topological naming, or P0-B parity.\n\"\"\"'''
          new_doc = '''\"\"\"Bounded FreeCAD/OCCT executor for OLEANDER CAD direct-edit requests.\n\nThis process-sidecar service remains under the existing CAD Sidecar Integration\nsurface. It executes two bounded operations on an unmodified rectangular-prism\nsingle solid: FACE_NORMAL_MOVE on the uniquely re-resolved +Z four-edge top face,\nand FACE_TANGENT_MOVE on a uniquely re-resolved +X/+Y/+Z axis-aligned four-edge\nface with a non-zero in-plane translation no longer than 20 mm. It never persists\nFaceN/EdgeN ordinals and returns HOLD, with no released output artifacts, when\nsemantic face resolution is missing or ambiguous.\n\nThis is not general push/pull, general or oblique planar-face translation,\npersistent topological naming, or P0-B parity.\n\"\"\"'''
          service_text = replace_once(service_text, old_doc, new_doc, 'service docstring')
          service.write_text(service_text, encoding='utf-8')

          stage_text = stage3.read_text(encoding='utf-8')
          old_stage_doc = '''This validates deterministic direct dimensions, linear duplication, bounded\nface-normal move, and bounded Blender-native face-tangent move in a real Blender\nprocess. CAD_NATIVE normal move may prepare its governed sidecar intent; CAD_NATIVE\ntangent move must fail closed until the shared sidecar absorbs that operation.\nThis does not establish general CAD/B-Rep push-pull, persistent topological naming,\nengineering, field, manufacturing, constructability, or design authority.'''
          new_stage_doc = '''This validates deterministic direct dimensions, linear duplication, bounded\nface-normal move, and bounded face-tangent move in a real Blender process. Both\nCAD_NATIVE normal and tangent entrypoints may prepare governed sidecar intents while\nleaving Blender display geometry unchanged; authoritative B-Rep execution is proved\nseparately by the professional CAD-sidecar integration surface. This does not\nestablish general CAD/B-Rep push-pull, general planar translation, persistent\ntopological naming, engineering, field, manufacturing, constructability, or design\nauthority.'''
          stage_text = replace_once(stage_text, old_stage_doc, new_stage_doc, 'stage3 docstring')

          old_tangent_block = '''    # CAD tangent move is intentionally not silently routed through the normal-move\n    # sidecar contract. Until the shared contract is expanded, it must fail closed\n    # and leave the display derivative unchanged. Blender's Python operator API\n    # raises RuntimeError when an operator reports ERROR before CANCELLED, so that\n    # exception is the expected failure surface and is asserted explicitly.\n    cad_tangent_before = mesh_vertex_snapshot(cad_face)\n    select_top_face_for_intent(cad_face)\n    cad_tangent_error = None\n    try:\n        bpy.ops.oleander.direct_face_tangent_move(u_mm=5.0, v_mm=0.0)\n    except RuntimeError as exc:\n        cad_tangent_error = str(exc)\n    assert_true(\n        cad_tangent_error is not None\n        and \"no absorbed shared-runtime route for CAD_NATIVE\" in cad_tangent_error,\n        \"CAD_NATIVE tangent move must expose the bounded fail-closed operator error\",\n    )\n    bpy.ops.object.mode_set(mode=\"OBJECT\")\n    bpy.context.view_layer.update()\n    assert_true(mesh_vertex_snapshot(cad_face) == cad_tangent_before, \"failed CAD tangent route must not mutate display geometry\")\n    assert_true(\n        cad_face.get(\"oleander_last_direct_operation\") == \"CAD_DIRECT_EDIT_INTENT\",\n        \"failed CAD tangent route must not overwrite the previous validated normal-move intent state\",\n    )\n'''
          new_tangent_block = '''    # CAD tangent entrypoint now prepares a governed FACE_TANGENT_MOVE sidecar\n    # intent. The Stage 3 runtime still does not execute B-Rep mutation itself.\n    cad_tangent_before = mesh_vertex_snapshot(cad_face)\n    select_top_face_for_intent(cad_face)\n    cad_tangent_move = bpy.ops.oleander.direct_face_tangent_move(u_mm=5.0, v_mm=0.0)\n    assert_true(\"FINISHED\" in cad_tangent_move, \"CAD_NATIVE Face Tangent Move must prepare an intent\")\n    bpy.ops.object.mode_set(mode=\"OBJECT\")\n    bpy.context.view_layer.update()\n    assert_true(mesh_vertex_snapshot(cad_face) == cad_tangent_before, \"CAD tangent intent must not mutate display geometry\")\n    assert_true(\n        cad_face.get(\"oleander_cad_direct_edit_state\") == \"PENDING_SIDECAR\"\n        and cad_face.get(\"oleander_direct_authority_route\") == \"CAD_NATIVE\",\n        \"CAD tangent edit must remain pending specialist-sidecar execution\",\n    )\n    raw_tangent_intent = cad_face[\"oleander_cad_direct_edit_intent\"]\n    tangent_intent = json.loads(raw_tangent_intent)\n    assert_true(tangent_intent[\"operation\"] == \"FACE_TANGENT_MOVE\", \"CAD tangent intent operation must be explicit\")\n    assert_true(\n        tangent_intent[\"parameters\"][\"translation_local_mm\"] == [5.0, 0.0, 0.0],\n        \"CAD tangent intent must normalize U/V provenance into local-mm translation\",\n    )\n    assert_true(\n        tangent_intent[\"parameters\"][\"u_mm\"] == 5.0\n        and tangent_intent[\"parameters\"][\"v_mm\"] == 0.0,\n        \"CAD tangent intent must retain interaction U/V provenance\",\n    )\n    assert_true(\n        cad_face[\"oleander_cad_direct_edit_intent_sha256\"]\n        == hashlib.sha256(raw_tangent_intent.encode(\"utf-8\")).hexdigest(),\n        \"CAD tangent intent must carry deterministic SHA identity\",\n    )\n'''
          stage_text = replace_once(stage_text, old_tangent_block, new_tangent_block, 'stage3 tangent block')
          stage_text = replace_once(
              stage_text,
              '            \"cad_native_tangent_move_fail_closed_expected_operator_error\",\n            \"cad_native_tangent_move_no_display_mutation\",',
              '            \"cad_native_tangent_intent_routing\",\n            \"cad_native_tangent_move_no_display_mutation\",\n            \"cad_native_tangent_uv_translation_normalization\",',
              'stage3 checks',
          )
          stage_text = replace_once(
              stage_text,
              '        \"expected_failure_cases\": {\n            \"cad_native_tangent_move_without_absorbed_sidecar_route\": \"PASS\",\n        },',
              '        \"expected_failure_cases\": {},',
              'stage3 expected failure map',
          )
          stage3.write_text(stage_text, encoding='utf-8')

          integration_text = integration.read_text(encoding='utf-8')
          integration_text = replace_once(
              integration_text,
              'import bmesh\nimport copy\nimport json\nimport os\nimport pathlib\nimport sys\n',
              'import bmesh\nimport copy\nimport importlib.util\nimport json\nimport os\nimport pathlib\nimport subprocess\nimport sys\n',
              'integration imports',
          )
          helper = r'''\n\ndef run_tangent_authoritative_integration() -> None:\n    \"\"\"Reuse the existing CAD-sidecar runner state for bounded Tangent execution.\"\"\"\n    probe_path = SCRIPT.with_name(\"probe_cad_direct_tangent_integration.py\")\n    spec = importlib.util.spec_from_file_location(\"oleander_cad_direct_tangent_probe\", probe_path)\n    if spec is None or spec.loader is None:\n        raise RuntimeError(\"unable to load CAD tangent integration probe\")\n    tangent_probe = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(tangent_probe)\n\n    tangent_probe.prepare()\n    freecadcmd = pathlib.Path(\"/tmp/squashfs-root/usr/bin/freecadcmd\")\n    service = SCRIPT.with_name(\"freecad_cad_direct_edit_service.py\")\n    check(freecadcmd.is_file(), \"tangent_freecadcmd_available\")\n    check(service.is_file(), \"tangent_sidecar_service_available\")\n\n    requests = {\n        \"success\": tangent_probe.SUCCESS_REQUEST,\n        \"missing\": tangent_probe.MISSING_REQUEST,\n        \"ambiguous\": tangent_probe.AMBIGUOUS_REQUEST,\n    }\n    for name, request_path in requests.items():\n        out_dir = ROOT / f\"tangent_direct_{name}\"\n        out_dir.mkdir(parents=True, exist_ok=True)\n        env = os.environ.copy()\n        env[\"OLEANDER_CAD_DIRECT_REQUEST\"] = str(request_path)\n        env[\"OLEANDER_CAD_DIRECT_DIR\"] = str(out_dir)\n        completed = subprocess.run(\n            [str(freecadcmd), str(service)],\n            env=env,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.STDOUT,\n            text=True,\n            check=False,\n        )\n        print(completed.stdout, end=\"\")\n        check(completed.returncode == 0, f\"tangent_{name}_freecad_process\")\n        check((out_dir / \"cad_direct_edit_response.json\").is_file(), f\"tangent_{name}_response_exists\")\n\n    tangent_probe.readback()\n    check(tangent_probe.REOPEN.is_file(), \"tangent_blender_save_reopen_artifact\")\n    checks.append(\"cad_native_tangent_authoritative_integration\")\n'''.replace('\\n', '\n')
          integration_text = replace_once(
              integration_text,
              '\n\ndef readback() -> None:\n',
              helper + '\n\ndef readback() -> None:\n',
              'integration tangent helper insertion',
          )
          integration_text = replace_once(
              integration_text,
              '    result_payload = {\n        \"schema\": \"OLEANDER_CAD_DIRECT_EDIT_INTEGRATION_READBACK_v0.2\",',
              '    run_tangent_authoritative_integration()\n\n    result_payload = {\n        \"schema\": \"OLEANDER_CAD_DIRECT_EDIT_INTEGRATION_READBACK_v0.3\",',
              'integration tangent execution call',
          )
          integration_text = replace_once(
              integration_text,
              '        \"non_claims\": [\"general_brep_push_pull\", \"persistent_topological_naming\", \"P0_B_DIRECT_BREP_PASS\", \"default_environment_promotion\", \"engineering_approval\", \"manufacturing_release\", \"field_truth\"],',
              '        \"non_claims\": [\"general_brep_push_pull\", \"general_planar_face_translation\", \"oblique_face_execution\", \"persistent_topological_naming\", \"P0_B_DIRECT_BREP_PASS\", \"P0_G_MODELING_INTERACTION_PASS\", \"default_environment_promotion\", \"engineering_approval\", \"manufacturing_release\", \"field_truth\"],',
              'integration nonclaims',
          )
          integration.write_text(integration_text, encoding='utf-8')

          print('OLEANDER_CAD_TANGENT_ABSORB_PATCH=PASS')
          PY

          python3 -m py_compile \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/freecad_cad_direct_edit_service.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_direct.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_cad_direct_edit_integration.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_cad_direct_tangent_integration.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/professional_adapter/cad_sidecar.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/oleander_blender/direct_model.py

          git config user.name "OLEANDER Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/freecad_cad_direct_edit_service.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_direct.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_cad_direct_edit_integration.py
          git diff --cached --check
          git commit -m "test(blender): absorb CAD tangent execution into existing owners"
          git push origin HEAD:feat/oleander-blender-cad-tangent-move-v01-20260910
