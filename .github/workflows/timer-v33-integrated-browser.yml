name: Timer v3.3 Integrated Browser Gate

on:
  workflow_dispatch:
    inputs:
      draft_release_tag:
        description: "Optional GitHub transport tag holding the audited v3.3 package"
        required: true
        type: string
        default: "timer-v3.3-audited-staging"
      asset_name:
        description: "Exact audited ZIP asset name"
        required: true
        type: string
        default: "OLEANDER_Zhizuo_TimerLightBasin_v3.3_AUDITED_POSTERLOCK_2026-08-10.zip"

permissions:
  contents: read

jobs:
  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANIFEST: website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json
      QA_DIR: test-results/timer-v33-integrated
      STAGE_DIR: test-results/timer-v33-stage
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve authenticated draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_DIR" "$STAGE_DIR"
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$STAGE_DIR/releases.json"

          python3 - "$DRAFT_RELEASE_TAG" "$ASSET_NAME" "$STAGE_DIR/releases.json" "$STAGE_DIR/selection.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          tag, asset_name, releases_path, selection_path, output_path = sys.argv[1:]
          releases = json.loads(pathlib.Path(releases_path).read_text())
          matches = [r for r in releases if r.get('draft') is True and r.get('tag_name') == tag]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one draft release with tag {tag!r}; found {len(matches)}')
          release = matches[0]
          assets = [a for a in release.get('assets', []) if a.get('name') == asset_name]
          if len(assets) != 1:
              raise SystemExit(f'Expected exactly one asset {asset_name!r}; found {len(assets)}')
          asset = assets[0]
          selection = {
              'transport': 'github-draft-release',
              'release_id': release['id'],
              'release_tag': tag,
              'release_draft': release['draft'],
              'asset_id': asset['id'],
              'asset_name': asset['name'],
              'asset_size': asset.get('size'),
              'asset_digest': asset.get('digest'),
              'asset_api_url': asset['url']
          }
          pathlib.Path(selection_path).write_text(json.dumps(selection, indent=2) + '\n')
          with open(output_path, 'a', encoding='utf-8') as handle:
              handle.write(f"asset_api_url={asset['url']}\n")
          print(json.dumps(selection, indent=2))
          PY
        id: release

      - name: Download GitHub transport copy
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_API_URL: ${{ steps.release.outputs.asset_api_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ASSET_API_URL" \
            -o "$STAGE_DIR/$ASSET_NAME"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install browser QA dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run shared authority package + Chromium/WebGL gate
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          TIMER_V33_MANIFEST: ${{ env.MANIFEST }}
          TIMER_V33_QA_OUT: ${{ env.QA_DIR }}
          TIMER_V33_STAGE_DIR: ${{ env.STAGE_DIR }}
          TIMER_V33_BASE_URL: http://127.0.0.1:4173/index.html
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-timer-v33-authority-gate.sh "$STAGE_DIR/$ASSET_NAME"

      - name: Record transport provenance
        if: always()
        shell: bash
        run: |
          cp "$STAGE_DIR/selection.json" "$QA_DIR/staging-selection.json" 2>/dev/null || true

      - name: Upload integrated QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-v33-integrated-browser
          path: ${{ env.QA_DIR }}/
          if-no-files-found: warn
          retention-days: 14
