name: OLEANDER Blender Surface System v1.21 Source Adapter

on:
  pull_request:
    paths:
      - '90-shared/toolchains/blender-surface-system/v1.21.0/**'
      - '00-governance/control-plane/tests/test_blender_surface_system_v121_source_adapter.py'
      - '00-governance/control-plane/tests/test_oleander_3d_pipeline_skill_contract.py'
      - '00-governance/control-plane/tests/test_oleander_3d_pipeline_receipt_validator.py'
      - '90-shared/toolchains/modeling-worker/v0.13/G1_SURFACE_SOURCE_CONTEXT_BINDING_v1.json'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '06-practice/2026/2026-08-17-ip03-blender-source-context-adapter-v1.21/**'
      - '.github/workflows/oleander-blender-surface-system-v1-21-source-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-authority-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 / Node 24
        with:
          fetch-depth: 1

      - name: Validate adapter and refined 3D Skill contracts
        run: |
          set -euo pipefail
          python3 -m unittest 00-governance/control-plane/tests/test_blender_surface_system_v121_source_adapter.py -v
          python3 -m unittest 00-governance/control-plane/tests/test_oleander_3d_pipeline_skill_contract.py -v
          python3 -m unittest 00-governance/control-plane/tests/test_oleander_3d_pipeline_receipt_validator.py -v
          python3 -m py_compile oleander-skills/oleander-3d-pipeline/tools/validate_receipt.py
          python3 -m json.tool 90-shared/toolchains/blender-surface-system/v1.21.0/SOURCE_AUTHORITY_ADAPTER_CONTRACT_v1.21.0.json >/dev/null
          python3 -m json.tool 90-shared/toolchains/modeling-worker/v0.13/G1_SURFACE_SOURCE_CONTEXT_BINDING_v1.json >/dev/null
          python3 -m json.tool oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_AUTHORITY_DIAGNOSTIC_CONTRACT_v1.json >/dev/null
          python3 -m json.tool oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_SCHEMAS_v1.json >/dev/null
          python3 -m json.tool oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_TEMPLATES_v1.json >/dev/null
          python3 -m json.tool oleander-skills/oleander-3d-pipeline/evals/evals.json >/dev/null

      - name: Emit refined 3D Skill contract receipt
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.21.0"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          skill_path = root / "oleander-skills/oleander-3d-pipeline/SKILL.md"
          contract_path = root / "oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_AUTHORITY_DIAGNOSTIC_CONTRACT_v1.json"
          receipt_schema_path = root / "oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_SCHEMAS_v1.json"
          receipt_templates_path = root / "oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_TEMPLATES_v1.json"
          receipt_validator_path = root / "oleander-skills/oleander-3d-pipeline/tools/validate_receipt.py"
          evals_path = root / "oleander-skills/oleander-3d-pipeline/evals/evals.json"
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          receipt_schemas = json.loads(receipt_schema_path.read_text(encoding="utf-8"))
          receipt_templates = json.loads(receipt_templates_path.read_text(encoding="utf-8"))
          evals = json.loads(evals_path.read_text(encoding="utf-8"))
          coverage = sorted({section for item in evals["evals"] for section in item["sections"]})

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              "status": "PASS",
              "skill": contract["skill"],
              "contract_schema": contract["schema"],
              "contract_version": contract["version"],
              "receipt_schema": receipt_schemas["schema"],
              "receipt_schema_version": receipt_schemas["version"],
              "section_count": len(contract["section_contracts"]),
              "receipt_schema_section_count": len(receipt_schemas["sections"]),
              "receipt_template_section_count": len(receipt_templates["templates"]),
              "receipt_validator": str(receipt_validator_path),
              "required_execution_fields": contract["section_execution_fields"],
              "eval_count": len(evals["evals"]),
              "section_coverage": coverage,
              "critical_multi_eval_sections": [3, 4, 5, 9, 13, 14, 15],
              "hashes": {
                  "SKILL.md": digest(skill_path),
                  "BLENDER_3D_AUTHORITY_DIAGNOSTIC_CONTRACT_v1.json": digest(contract_path),
                  "BLENDER_3D_RECEIPT_SCHEMAS_v1.json": digest(receipt_schema_path),
                  "BLENDER_3D_RECEIPT_TEMPLATES_v1.json": digest(receipt_templates_path),
                  "validate_receipt.py": digest(receipt_validator_path),
                  "evals.json": digest(evals_path),
              },
              "does_not_prove": [
                  "DESIGN_KEEP",
                  "MAIN_KEEP",
                  "CLASS_A",
                  "FIELD_VALIDATION",
                  "ENGINEERING_VALIDITY",
                  "MANUFACTURING_READINESS"
              ],
          }
          assert receipt["section_count"] == 15, receipt
          assert receipt["receipt_schema_section_count"] == 15, receipt
          assert receipt["receipt_template_section_count"] == 15, receipt
          assert contract["receipt_schema_path"].endswith("BLENDER_3D_RECEIPT_SCHEMAS_v1.json"), contract
          assert receipt["section_coverage"] == list(range(1, 16)), receipt
          assert receipt["eval_count"] >= 15, receipt
          out = Path("out/OLEANDER_Blender_Surface_System_v1.21.0/SKILL_CONTRACT_RECEIPT.json")
          out.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("OLEANDER_3D_SKILL_CONTRACT_PASS", receipt["hashes"]["SKILL.md"])
          print("OLEANDER_3D_RECEIPT_VALIDATOR_BOUND", receipt["hashes"]["validate_receipt.py"])
          PY

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          ACTUAL="$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version

      - name: Run Blender-native sparse Source adapter smoke
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.21.0"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender -b \
            --python 90-shared/toolchains/blender-surface-system/v1.21.0/smoke_source_authority_adapter.py \
            -- \
            --adapter 90-shared/toolchains/blender-surface-system/v1.21.0/source_authority_adapter.py \
            --contract 90-shared/toolchains/blender-surface-system/v1.21.0/SOURCE_AUTHORITY_ADAPTER_CONTRACT_v1.21.0.json \
            --binding 90-shared/toolchains/modeling-worker/v0.13/G1_SURFACE_SOURCE_CONTEXT_BINDING_v1.json \
            --out "$OUT"

      - name: Validate Blender receipt, Skill receipt and persistence artifact
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.21.0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("out/OLEANDER_Blender_Surface_System_v1.21.0")
          receipt = json.loads((out / "SOURCE_ADAPTER_SMOKE_RECEIPT.json").read_text(encoding="utf-8"))
          skill = json.loads((out / "SKILL_CONTRACT_RECEIPT.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS", receipt
          assert receipt["source_object_count"] == 6, receipt
          assert receipt["context_binding"]["status"] == "PASS", receipt
          assert all(receipt["context_binding"]["checks"].values()), receipt
          assert receipt["source_owner"] == "MODELING_WORKER_v0.13", receipt
          assert receipt["source_unchanged_during_diagnostic"]["status"] == "PASS", receipt
          assert receipt["controlled_edit_detected"] is True, receipt
          assert receipt["target_material_slots_preserved"] is True, receipt
          assert receipt["diagnostic_proxy"]["role"] == "DERIVED_DIAGNOSTIC_NOT_AUTHORITY", receipt
          assert receipt["diagnostic_proxy"]["authority"] == "DERIVED_EXECUTION_NOT_AUTHORITY", receipt
          assert receipt["diagnostic_proxy"]["source_snapshot_sha256"] == receipt["source_sha256"], receipt
          assert receipt["restored_source_sha256"] == receipt["source_sha256"], receipt
          assert skill["status"] == "PASS", skill
          assert skill["section_count"] == 15, skill
          assert skill["receipt_schema_section_count"] == 15, skill
          assert skill["receipt_template_section_count"] == 15, skill
          assert skill["section_coverage"] == list(range(1, 16)), skill
          assert skill["eval_count"] >= 15, skill
          assert "BLENDER_3D_RECEIPT_SCHEMAS_v1.json" in skill["hashes"], skill
          assert "BLENDER_3D_RECEIPT_TEMPLATES_v1.json" in skill["hashes"], skill
          assert "validate_receipt.py" in skill["hashes"], skill
          blend = out / "OLEANDER_Blender_Source_Adapter_v1.21.0_SMOKE.blend"
          assert blend.exists() and blend.stat().st_size > 10000, blend
          print("V1_21_SOURCE_ADAPTER_GATE_PASS", receipt["source_sha256"])
          print("V2_3D_SKILL_GATE_PASS", skill["hashes"]["SKILL.md"])
          print("V1_3D_RECEIPT_VALIDATOR_GATE_PASS", skill["hashes"]["validate_receipt.py"])
          PY
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Upload source adapter and Skill evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 / Node 24
        with:
          name: oleander-blender-source-adapter-v1-21-${{ github.run_id }}
          path: out/OLEANDER_Blender_Surface_System_v1.21.0/
          if-no-files-found: error
          retention-days: 14
