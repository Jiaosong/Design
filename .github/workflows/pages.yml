name: Deploy Oleander Website

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Confirm E3 review, rights/provenance, contact/privacy and release approval are complete"
        required: true
        type: boolean
        default: false
      release_note:
        description: "Optional release record or approval reference"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.release_authorized == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record release boundary
        run: |
          echo "release_authorized=${{ inputs.release_authorized }}"
          echo "release_note=${{ inputs.release_note }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
