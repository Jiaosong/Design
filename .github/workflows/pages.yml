name: Deploy Oleander Website

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Confirm E3 review, rights/provenance, contact/privacy and release approval are complete"
        required: true
        type: boolean
        default: false
      release_note:
        description: "Optional release record or approval reference"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.release_authorized == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record release boundary
        env:
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'release_authorized=%s\n' "$RELEASE_AUTHORIZED"
          printf 'release_note=%s\n' "$RELEASE_NOTE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
