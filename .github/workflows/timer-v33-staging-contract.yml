name: Timer v3.3 Staging Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/timer-v33-stage-package.py'
      - 'tests/timer-v33-integrated.mjs'
      - 'tests/run-timer-v33-authority-gate.sh'
      - 'tests/serve-static-root.mjs'
      - 'website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json'
      - '.github/workflows/timer-v33-integrated-browser.yml'
      - '.github/workflows/timer-v33-staged-pages.yml'
      - '.github/workflows/timer-v33-staging-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'tests/timer-v33-stage-package.py'
      - 'tests/timer-v33-integrated.mjs'
      - 'tests/run-timer-v33-authority-gate.sh'
      - 'tests/serve-static-root.mjs'
      - 'website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json'
      - '.github/workflows/timer-v33-integrated-browser.yml'
      - '.github/workflows/timer-v33-staged-pages.yml'
      - '.github/workflows/timer-v33-staging-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile tests/timer-v33-stage-package.py
          node --check tests/timer-v33-integrated.mjs
          node --check tests/serve-static-root.mjs
          bash -n tests/run-timer-v33-authority-gate.sh
          python3 -m json.tool website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json >/dev/null

      - name: Validate locked authority manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json')
          m=json.loads(p.read_text())
          assert m['schema']=='oleander.timer-light-basin.deployment-artifact.v1'
          assert m['version']=='3.3'
          assert m['asset_name']=='OLEANDER_Zhizuo_TimerLightBasin_v3.3_AUDITED_POSTERLOCK_2026-08-10.zip'
          assert m['package_sha256']=='3c8b2aa31f02e0ee71cf5a0309268c492694c0536aa39dcccb6e3ce81f84d387'
          assert m['required_files']['assets/hero_poster.png']=='840aa70cd4a568de2f2f4f294425176762a1d100ec7749fec3d6f4b23cfb0193'
          assert m['required_files']['assets/pbr/timer_100_pbr.glb']=='900e02510ab6b2b5176aa3723dba7981700dc79b5f217dbe481844a534ed7c66'
          assert len(m['required_files'])==18
          assert 'does not assert PR #15 module-level render lock' in m['boundary']['poster_fallback_lock']
          print('official manifest contract: PASS')
          PY

      - name: Validate staged Pages release boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/timer-v33-staged-pages.yml').read_text()
          assert 'authorization-guard:' in text
          assert 'needs: authorization-guard' in text
          guard=text.split('authorization-guard:',1)[1].split('\n  validate-and-deploy:',1)[0]
          assert 'RELEASE_AUTHORIZED:' in guard
          assert 'if [[ "$RELEASE_AUTHORIZED" != "true" ]]' in guard
          assert 'exit 1' in guard, 'unauthorized release must fail closed'
          overlay=text.split('- name: Overlay audited Timer v3.3 package',1)[1].split('\n      - name:',1)[0]
          copy_manifest='cp "$MANIFEST" "$QA_DIR/deployment-artifact-manifest.json"'
          replace_target='rm -rf "$target"'
          assert copy_manifest in overlay
          assert replace_target in overlay
          assert overlay.index(copy_manifest) < overlay.index(replace_target), 'authority manifest must be preserved before target replacement'
          verify=text.index('- name: Verify authority and extract package')
          browser=text.index('- name: Run Timer v3.3 Chromium/WebGL gate')
          deploy=text.index('- name: Deploy to GitHub Pages')
          assert verify < browser < deploy, 'verification and browser gate must precede Pages deployment'
          print('staged Pages authorization/provenance ordering: PASS')
          PY

      - name: Validate workflow input hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflows=[
              Path('.github/workflows/timer-v33-integrated-browser.yml'),
              Path('.github/workflows/timer-v33-staged-pages.yml'),
          ]
          actions_open='$' + '{{'
          actions_close='}' + '}'
          risky_fragments=[
              f'--zip "$STAGE_DIR/{actions_open} inputs.asset_name {actions_close}',
              f'echo "release_authorized={actions_open} inputs.release_authorized {actions_close}',
              f'echo "draft_release_tag={actions_open} inputs.draft_release_tag {actions_close}',
              f'echo "asset_name={actions_open} inputs.asset_name {actions_close}',
              f'echo "release_note={actions_open} inputs.release_note {actions_close}',
          ]
          for path in workflows:
              text=path.read_text()
              for fragment in risky_fragments:
                  assert fragment not in text, f'unsafe inline workflow input in {path}: {fragment}'
          integrated=workflows[0].read_text()
          pages=workflows[1].read_text()
          assert 'bash tests/run-timer-v33-authority-gate.sh "$STAGE_DIR/$ASSET_NAME"' in integrated
          assert '--zip "$STAGE_DIR/$ASSET_NAME"' in pages
          for name in ['RELEASE_AUTHORIZED', 'DRAFT_RELEASE_TAG', 'ASSET_NAME', 'RELEASE_NOTE']:
              assert f'{name}:' in pages
          print('workflow input hardening: PASS')
          PY

      - name: Validate shared authority runner and browser parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runner=Path('tests/run-timer-v33-authority-gate.sh').read_text()
          browser=Path('tests/timer-v33-integrated.mjs').read_text()
          calibration=Path('website/practice/timer-light-basin-v3/calibration/capture.mjs').read_text()
          verify='python3 tests/timer-v33-stage-package.py'
          serve='node tests/serve-static-root.mjs'
          gate='node tests/timer-v33-integrated.mjs'
          assert verify in runner and serve in runner and gate in runner
          assert runner.index(verify) < runner.index(serve) < runner.index(gate), 'verify → serve → browser ordering required'
          for flag in ['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']:
              assert flag in calibration, f'calibration reference missing {flag}'
              assert flag in browser, f'integrated browser must match calibrated launch stability flag {flag}'
          assert 'TIMER_V33_VERIFY_ONLY' in runner
          print('shared authority runner + calibrated browser parity: PASS')
          PY

      - name: Validate integrated browser console gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('tests/timer-v33-integrated.mjs').read_text()
          assert "if (message.type() === 'error') consoleErrors.push(message.text());" in text
          assert "if (consoleErrors.length === 0) pass('console_errors'); else fail('console_errors', consoleErrors.join('\\n'));" in text
          assert 'result.diagnostics.consoleErrors = consoleErrors;' in text
          print('console-error fail gate: PASS')
          PY

      - name: Exercise verifier and shared runner with synthetic audited package
        run: |
          set -euo pipefail
          rm -rf /tmp/timer-v33-contract
          mkdir -p /tmp/timer-v33-contract
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          work=pathlib.Path('/tmp/timer-v33-contract')
          root='SYNTHETIC_TIMER_V33'
          files={
              'index.html': b'<!doctype html><title>synthetic</title>\n',
              'assets/pbr/timer_100_pbr.glb': b'glTF-synthetic-authority\n'
          }
          sums=''.join(f"{hashlib.sha256(data).hexdigest()}  {name}\n" for name,data in files.items()).encode()
          zip_path=work/'synthetic.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for name,data in files.items(): z.writestr(f'{root}/{name}',data)
              z.writestr(f'{root}/SHA256SUMS.txt',sums)
          package_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
              'schema':'oleander.timer-light-basin.deployment-artifact.v1',
              'package_root':root,
              'package_sha256':package_sha,
              'required_files':{name:hashlib.sha256(data).hexdigest() for name,data in files.items()},
              'boundary':{'synthetic':'contract test only'}
          }
          (work/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          TIMER_V33_MANIFEST=/tmp/timer-v33-contract/manifest.json \
          TIMER_V33_QA_OUT=/tmp/timer-v33-contract/qa \
          TIMER_V33_STAGE_DIR=/tmp/timer-v33-contract/stage \
          TIMER_V33_VERIFY_ONLY=true \
          bash tests/run-timer-v33-authority-gate.sh /tmp/timer-v33-contract/synthetic.zip
          test -f /tmp/timer-v33-contract/stage/site/index.html
          test -f /tmp/timer-v33-contract/stage/site/assets/pbr/timer_100_pbr.glb
          python3 - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('/tmp/timer-v33-contract/qa/package-verification.json').read_text())
          assert r['status']=='PASS', r
          assert r['checks']['package_sha256']['status']=='PASS'
          assert r['checks']['required_files']['status']=='PASS'
          assert r['checks']['internal_sha256sums']['status']=='PASS'
          assert r['checks']['extraction']['status']=='PASS'
          print('synthetic shared authority runner: PASS')
          PY
