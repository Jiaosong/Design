name: OLEANDER 3D Porsche V73 Residual Boundary Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-porsche-v73-residual-boundary-diagnostic.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v73.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  v73-residual-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Compile V73
        run: python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v73.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee BLENDER_RUNTIME.txt
      - name: Execute V73 diagnostic-only tolerance A/B
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V73_RESIDUAL_BOUNDARY"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v73.py \
            -- --out "$OUT" --samples 4 --resolution-x 640 --resolution-y 426
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          test -f "$OUT/V73_RESIDUAL_BOUNDARY_STAGNATION_DIAGNOSTIC.json"
      - name: Verify diagnostic non-mutation and classified result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/V73_RESIDUAL_BOUNDARY/V73_RESIDUAL_BOUNDARY_STAGNATION_DIAGNOSTIC.json').read_text())
          assert d['source_mutated'] is False
          assert d['host_unchanged_by_diagnostic'] is True
          assert d['residual_face_count']==2
          assert len(d['diagnostic_copy_tolerance_trials'])==5
          assert all(t['protected_invariants']=='PASS' for t in d['diagnostic_copy_tolerance_trials'])
          assert d['diagnostic_result'] in ('TOLERANCE_SENSITIVE_OPERATOR_CAN_PROGRESS_ON_DIAGNOSTIC_COPY','OPERATOR_STAGNATION_NOT_RESOLVED_BY_TOLERANCE_AB')
          print(json.dumps(d,indent=2))
          PY
      - name: Upload V73 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-v73-residual-boundary-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            out/V73_RESIDUAL_BOUNDARY/
          if-no-files-found: error
          retention-days: 14
