name: OLEANDER Blender Runtime 5.1

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-5-1.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-5-1.yml"

permissions:
  contents: read

jobs:
  blender-5-1-2-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      EXTENSION_PACKAGE: /tmp/oleander_blender_runtime-0.2.0.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download official Blender release and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          test -s blender-selected.sha256
          sha256sum --check blender-selected.sha256
          sha256sum "${BLENDER_ARCHIVE}" | tee /tmp/oleander-blender-archive.sha256

      - name: Extract Blender
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "${BLENDER_ARCHIVE}"
          test -x "blender-${BLENDER_VERSION}-linux-x64/blender"
          "blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Validate and build Blender extension package
        shell: bash
        run: |
          set -euo pipefail
          blender_bin="blender-${BLENDER_VERSION}-linux-x64/blender"
          source_dir="oleander-skills/oleander-3d-pipeline/blender_runtime/oleander_blender"
          "${blender_bin}" --command extension validate "${source_dir}" 2>&1 | tee /tmp/oleander-extension-source-validate.log
          "${blender_bin}" --command extension build --source-dir "${source_dir}" --output-filepath "${EXTENSION_PACKAGE}" 2>&1 | tee /tmp/oleander-extension-build.log
          test -s "${EXTENSION_PACKAGE}"
          "${blender_bin}" --command extension validate "${EXTENSION_PACKAGE}" 2>&1 | tee /tmp/oleander-extension-package-validate.log
          sha256sum "${EXTENSION_PACKAGE}" | tee /tmp/oleander-extension-package.sha256

      - name: Run OLEANDER Stage 2 headless validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage2.py 2>&1 | tee /tmp/oleander-blender-stage2.log
          grep -F 'OLEANDER_STAGE2_VALIDATION=' /tmp/oleander-blender-stage2.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage2.log

      - name: Run OLEANDER Stage 3 Direct Modeling validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_direct.py 2>&1 | tee /tmp/oleander-blender-stage3-direct.log
          grep -F 'OLEANDER_STAGE3_DIRECT_VALIDATION=' /tmp/oleander-blender-stage3-direct.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-direct.log

      - name: Run OLEANDER Stage 3 Direct Feature Stack validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_features.py 2>&1 | tee /tmp/oleander-blender-stage3-features.log
          grep -F 'OLEANDER_STAGE3_FEATURES_VALIDATION=' /tmp/oleander-blender-stage3-features.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-features.log

      - name: Run OLEANDER Stage 3 Feature Editing validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_feature_editing.py 2>&1 | tee /tmp/oleander-blender-stage3-feature-editing.log
          grep -F 'OLEANDER_STAGE3_FEATURE_EDITING_VALIDATION=' /tmp/oleander-blender-stage3-feature-editing.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-feature-editing.log

      - name: Run OLEANDER Stage 3 Relation Kernel validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_relations.py 2>&1 | tee /tmp/oleander-blender-stage3-relations.log
          grep -F 'OLEANDER_STAGE3_RELATION_VALIDATION=' /tmp/oleander-blender-stage3-relations.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-relations.log

      - name: Run OLEANDER Stage 3 Relation Apply validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_relation_apply.py 2>&1 | tee /tmp/oleander-blender-stage3-relation-apply.log
          grep -F 'OLEANDER_STAGE3_RELATION_APPLY_VALIDATION=' /tmp/oleander-blender-stage3-relation-apply.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-relation-apply.log

      - name: Run OLEANDER Stage 3 Measurement / Scale / Ruler validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_measurement.py 2>&1 | tee /tmp/oleander-blender-stage3-measurement.log
          grep -F 'OLEANDER_STAGE3_MEASUREMENT_VALIDATION=' /tmp/oleander-blender-stage3-measurement.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-measurement.log

      - name: Run OLEANDER Stage 3 Angular / Datum / Construction validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_angular_datum.py 2>&1 | tee /tmp/oleander-blender-stage3-angular-datum.log
          grep -F 'OLEANDER_STAGE3_ANGULAR_DATUM_VALIDATION=' /tmp/oleander-blender-stage3-angular-datum.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-angular-datum.log

      - name: Run OLEANDER Stage 3 Precision / Inference validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_precision_inference.py 2>&1 | tee /tmp/oleander-blender-stage3-precision-inference.log
          grep -F 'OLEANDER_STAGE3_PRECISION_INFERENCE_VALIDATION=' /tmp/oleander-blender-stage3-precision-inference.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-precision-inference.log

      - name: Run OLEANDER Stage 3 Inference Engine v2 validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_inference_v2.py 2>&1 | tee /tmp/oleander-blender-stage3-inference-v2.log
          grep -F 'OLEANDER_STAGE3_INFERENCE_V2_VALIDATION=' /tmp/oleander-blender-stage3-inference-v2.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-inference-v2.log

      - name: Run OLEANDER Stage 3 Evaluated Mesh Clearance validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_mesh_clearance.py 2>&1 | tee /tmp/oleander-blender-stage3-mesh-clearance.log
          grep -F 'OLEANDER_STAGE3_MESH_CLEARANCE_VALIDATION=' /tmp/oleander-blender-stage3-mesh-clearance.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-mesh-clearance.log

      - name: Run OLEANDER Stage 3 Surface Diagnostics validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_surface_diagnostics.py 2>&1 | tee /tmp/oleander-blender-stage3-surface-diagnostics.log
          grep -F 'OLEANDER_STAGE3_SURFACE_DIAGNOSTICS_VALIDATION=' /tmp/oleander-blender-stage3-surface-diagnostics.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-surface-diagnostics.log

      - name: Run OLEANDER Stage 3 Design Intent Graph validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_design_intent.py 2>&1 | tee /tmp/oleander-blender-stage3-design-intent.log
          grep -F 'OLEANDER_STAGE3_DESIGN_INTENT_VALIDATION=' /tmp/oleander-blender-stage3-design-intent.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-design-intent.log

      - name: Run OLEANDER Stage 3 Procedural Foundation validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_procedural.py 2>&1 | tee /tmp/oleander-blender-stage3-procedural.log
          grep -F 'OLEANDER_STAGE3_PROCEDURAL_VALIDATION=' /tmp/oleander-blender-stage3-procedural.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-procedural.log

      - name: Record runtime evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Blender Runtime 5.1.2'
            echo '- Source: official Blender.org release archive + official SHA256 manifest.'
            echo '- Extension: source validate + build + built-ZIP validate.'
            echo '- Stage 2: governed core.'
            echo '- Stage 3 Direct / Feature Stack / Feature Editing.'
            echo '- Stage 3 Relation Kernel / Relation Apply.'
            echo '- Stage 3 Measurement / Angular-Datum / Precision-Inference.'
            echo '- Stage 3 Inference v2: parallel/perpendicular/collinear/intersection checks, extension projection, axis lock projection and temporary tracking points.'
            echo '- Stage 3 Mesh Clearance: modifier-aware evaluated triangulated mesh surface distance with witness points and pair budgets.'
            echo '- Stage 3 Surface Diagnostics: evaluated topology, dihedral normal variation, pull-axis orientation and normal-ray thickness diagnostics.'
            echo '- Stage 3 Design Intent Graph: stable typed parameters, bindings, parameter dependencies, failure envelopes, diff and stale propagation; no solver or automatic geometry rebuild.'
            echo '- Stage 3 Procedural Foundation.'
            echo '- Surface diagnostics remain polygonal diagnostics; they are not Class-A/NURBS curvature, moldability or engineering wall-thickness certification.'
            echo '- Design Intent Graph remains metadata/dependency intent state; it is not CAD parametric feature rebuilding or a constraint solver.'
            echo '- Does not prove field truth, engineering approval, manufacturing release, constructability, CAD/Houdini/Class-A equivalence or design PASS.'
            echo ''
            if [ -f /tmp/oleander-blender-archive.sha256 ]; then echo '### Blender archive SHA256'; cat /tmp/oleander-blender-archive.sha256; fi
            if [ -f /tmp/oleander-extension-package.sha256 ]; then echo '### Extension package SHA256'; cat /tmp/oleander-extension-package.sha256; fi
            for item in \
              'Stage 2|/tmp/oleander-blender-stage2.log|OLEANDER_STAGE2_VALIDATION=' \
              'Stage 3 Direct|/tmp/oleander-blender-stage3-direct.log|OLEANDER_STAGE3_DIRECT_VALIDATION=' \
              'Stage 3 Direct Feature Stack|/tmp/oleander-blender-stage3-features.log|OLEANDER_STAGE3_FEATURES_VALIDATION=' \
              'Stage 3 Feature Editing|/tmp/oleander-blender-stage3-feature-editing.log|OLEANDER_STAGE3_FEATURE_EDITING_VALIDATION=' \
              'Stage 3 Relation Kernel|/tmp/oleander-blender-stage3-relations.log|OLEANDER_STAGE3_RELATION_VALIDATION=' \
              'Stage 3 Relation Apply|/tmp/oleander-blender-stage3-relation-apply.log|OLEANDER_STAGE3_RELATION_APPLY_VALIDATION=' \
              'Stage 3 Measurement|/tmp/oleander-blender-stage3-measurement.log|OLEANDER_STAGE3_MEASUREMENT_VALIDATION=' \
              'Stage 3 Angular Datum|/tmp/oleander-blender-stage3-angular-datum.log|OLEANDER_STAGE3_ANGULAR_DATUM_VALIDATION=' \
              'Stage 3 Precision Inference|/tmp/oleander-blender-stage3-precision-inference.log|OLEANDER_STAGE3_PRECISION_INFERENCE_VALIDATION=' \
              'Stage 3 Inference v2|/tmp/oleander-blender-stage3-inference-v2.log|OLEANDER_STAGE3_INFERENCE_V2_VALIDATION=' \
              'Stage 3 Mesh Clearance|/tmp/oleander-blender-stage3-mesh-clearance.log|OLEANDER_STAGE3_MESH_CLEARANCE_VALIDATION=' \
              'Stage 3 Surface Diagnostics|/tmp/oleander-blender-stage3-surface-diagnostics.log|OLEANDER_STAGE3_SURFACE_DIAGNOSTICS_VALIDATION=' \
              'Stage 3 Design Intent Graph|/tmp/oleander-blender-stage3-design-intent.log|OLEANDER_STAGE3_DESIGN_INTENT_VALIDATION=' \
              'Stage 3 Procedural Foundation|/tmp/oleander-blender-stage3-procedural.log|OLEANDER_STAGE3_PROCEDURAL_VALIDATION='
            do
              IFS='|' read -r title file marker <<< "$item"
              if [ -f "$file" ]; then echo "### $title result"; grep -F "$marker" "$file" || true; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
