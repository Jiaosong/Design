name: OLEANDER Blender Runtime 5.1

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-5-1.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-5-1.yml"

permissions:
  contents: read

jobs:
  blender-5-1-2-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      EXTENSION_PACKAGE: /tmp/oleander_blender_runtime-0.2.0.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download official Blender release and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${BLENDER_ARCHIVE}" \
            "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "blender-${BLENDER_VERSION}.sha256" \
            "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          test -s blender-selected.sha256
          sha256sum --check blender-selected.sha256
          sha256sum "${BLENDER_ARCHIVE}" | tee /tmp/oleander-blender-archive.sha256

      - name: Extract Blender
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "${BLENDER_ARCHIVE}"
          test -x "blender-${BLENDER_VERSION}-linux-x64/blender"
          "blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Validate and build Blender extension package
        shell: bash
        run: |
          set -euo pipefail
          blender_bin="blender-${BLENDER_VERSION}-linux-x64/blender"
          source_dir="oleander-skills/oleander-3d-pipeline/blender_runtime/oleander_blender"
          "${blender_bin}" --command extension validate "${source_dir}" \
            2>&1 | tee /tmp/oleander-extension-source-validate.log
          "${blender_bin}" --command extension build \
            --source-dir "${source_dir}" \
            --output-filepath "${EXTENSION_PACKAGE}" \
            2>&1 | tee /tmp/oleander-extension-build.log
          test -s "${EXTENSION_PACKAGE}"
          "${blender_bin}" --command extension validate "${EXTENSION_PACKAGE}" \
            2>&1 | tee /tmp/oleander-extension-package-validate.log
          sha256sum "${EXTENSION_PACKAGE}" | tee /tmp/oleander-extension-package.sha256

      - name: Run OLEANDER Stage 2 headless validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage2.py \
            2>&1 | tee /tmp/oleander-blender-stage2.log
          grep -F 'OLEANDER_STAGE2_VALIDATION=' /tmp/oleander-blender-stage2.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage2.log

      - name: Run OLEANDER Stage 3 Direct Modeling validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_direct.py \
            2>&1 | tee /tmp/oleander-blender-stage3-direct.log
          grep -F 'OLEANDER_STAGE3_DIRECT_VALIDATION=' /tmp/oleander-blender-stage3-direct.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-direct.log

      - name: Run OLEANDER Stage 3 Direct Feature Stack validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_features.py \
            2>&1 | tee /tmp/oleander-blender-stage3-features.log
          grep -F 'OLEANDER_STAGE3_FEATURES_VALIDATION=' /tmp/oleander-blender-stage3-features.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-features.log

      - name: Run OLEANDER Stage 3 Feature Editing validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_feature_editing.py \
            2>&1 | tee /tmp/oleander-blender-stage3-feature-editing.log
          grep -F 'OLEANDER_STAGE3_FEATURE_EDITING_VALIDATION=' /tmp/oleander-blender-stage3-feature-editing.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-feature-editing.log

      - name: Run OLEANDER Stage 3 Relation Kernel validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_relations.py \
            2>&1 | tee /tmp/oleander-blender-stage3-relations.log
          grep -F 'OLEANDER_STAGE3_RELATION_VALIDATION=' /tmp/oleander-blender-stage3-relations.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-relations.log

      - name: Run OLEANDER Stage 3 Procedural Foundation validation
        shell: bash
        run: |
          set -euo pipefail
          "blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background \
            --factory-startup \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_procedural.py \
            2>&1 | tee /tmp/oleander-blender-stage3-procedural.log
          grep -F 'OLEANDER_STAGE3_PROCEDURAL_VALIDATION=' /tmp/oleander-blender-stage3-procedural.log
          grep -F '"status": "PASS"' /tmp/oleander-blender-stage3-procedural.log

      - name: Record runtime evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Blender Runtime 5.1.2'
            echo '- Source: official download.blender.org release archive + official SHA256 manifest.'
            echo '- Extension: source validate + build + built-ZIP validate.'
            echo '- Stage 2: governed core regression including .blend save/reopen persistence.'
            echo '- Stage 3 Direct: metric dimensions + governed linear duplicate.'
            echo '- Stage 3 Direct Features: non-destructive extrude/shell/bevel/mirror/pattern/boolean + feature-history integrity.'
            echo '- Stage 3 Feature Editing: stable-ID edit, suppress/restore, governed reorder, tombstone removal, event log and dependency provenance.'
            echo '- Stage 3 Relation Kernel: check-only driver→driven relations, tolerances, cycle prevention, stale propagation, tombstones and dependency ownership.'
            echo '- Stage 3 Procedural: parameter/constraint metadata + governed Geometry Nodes passthrough probe.'
            echo '- Does not prove field truth, engineering approval, manufacturing release, constructability, solver/CAD/Houdini/Class-A equivalence or design PASS.'
            echo ''
            if [ -f /tmp/oleander-blender-archive.sha256 ]; then
              echo '### Blender archive SHA256'
              cat /tmp/oleander-blender-archive.sha256
            fi
            if [ -f /tmp/oleander-extension-package.sha256 ]; then
              echo '### Extension package SHA256'
              cat /tmp/oleander-extension-package.sha256
            fi
            if [ -f /tmp/oleander-blender-stage2.log ]; then
              echo '### Stage 2 runtime result'
              grep -F 'OLEANDER_STAGE2_VALIDATION=' /tmp/oleander-blender-stage2.log || true
            fi
            if [ -f /tmp/oleander-blender-stage3-direct.log ]; then
              echo '### Stage 3 Direct result'
              grep -F 'OLEANDER_STAGE3_DIRECT_VALIDATION=' /tmp/oleander-blender-stage3-direct.log || true
            fi
            if [ -f /tmp/oleander-blender-stage3-features.log ]; then
              echo '### Stage 3 Direct Feature Stack result'
              grep -F 'OLEANDER_STAGE3_FEATURES_VALIDATION=' /tmp/oleander-blender-stage3-features.log || true
            fi
            if [ -f /tmp/oleander-blender-stage3-feature-editing.log ]; then
              echo '### Stage 3 Feature Editing result'
              grep -F 'OLEANDER_STAGE3_FEATURE_EDITING_VALIDATION=' /tmp/oleander-blender-stage3-feature-editing.log || true
            fi
            if [ -f /tmp/oleander-blender-stage3-relations.log ]; then
              echo '### Stage 3 Relation Kernel result'
              grep -F 'OLEANDER_STAGE3_RELATION_VALIDATION=' /tmp/oleander-blender-stage3-relations.log || true
            fi
            if [ -f /tmp/oleander-blender-stage3-procedural.log ]; then
              echo '### Stage 3 Procedural Foundation result'
              grep -F 'OLEANDER_STAGE3_PROCEDURAL_VALIDATION=' /tmp/oleander-blender-stage3-procedural.log || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
