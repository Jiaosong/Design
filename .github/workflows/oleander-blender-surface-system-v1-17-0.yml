name: OLEANDER Blender Surface System v1.17.0

on:
  push:
    branches: [agent/blender-surface-system-v1-17-0]
    paths:
      - 'practice/2026-08-11-ip03-blender-procedural-surface-system-v1-17/**'
      - 'tools/oleander-blender-surface/v1.17.0/**'
      - '.github/workflows/oleander-blender-surface-system-v1-17-0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-catalog-debug-call-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Reconstruct v1.16.0 canonical builder and v1.17 contract
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/oleander/nodegroups-realworkflows-final-20260811:refs/remotes/origin/legacy-nodegroups-v1
          git show origin/legacy-nodegroups-v1:tools/oleander-nodegroups/build_nodegroups_and_workflows_review2.py.gz.b64 | base64 -d | gzip -d > /tmp/legacy_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/legacy_builder.py'); text=p.read_text(encoding='utf-8')
          mapping={'OL_SHD_C01_ShapeControl_v1':'OL_SHD_ShapeControl_v1','OL_SHD_C03_RepetitionCells_v1':'OL_SHD_RepetitionCells_v1','OL_SHD_C04_WhiteNoiseCell_v1':'OL_SHD_WhiteNoiseCell_v1','OL_SHD_C05_ComposeFields_v1':'OL_SHD_ComposeFields_v1','OL_SHD_C06_SpaceManipulation_v1':'OL_SHD_SpaceManipulation_v1','OL_SHD_C07_WaveField_v1':'OL_SHD_WaveField_v1','OL_SHD_C08_VoronoiField_v1':'OL_SHD_VoronoiField_v1','OL_SHD_C09_GaborField_v1':'OL_SHD_GaborField_v1'}
          for old,new in mapping.items(): text=text.replace(old,new)
          text=text.replace('LIB_VERSION = "1.0"','LIB_VERSION = "1.16.0"').replace('OLEANDER_Procedural_NodeGroups_v1.0.blend','OLEANDER_Blender_Surface_NodeGroups_v1.16.0.blend')
          Path('/tmp/build_v116.py').write_text(text,encoding='utf-8')
          PY
          base64 -d tools/oleander-blender-surface/v1.17.0/SURFACE_CONTRACT_BUNDLE_v1.17.0.json.gz.b64 | gzip -d > /tmp/SURFACE_CONTRACT_BUNDLE_v1.17.0.json
          python3 -m py_compile /tmp/build_v116.py tools/oleander-blender-surface/v1.17.0/build_asset_catalog_bundle.py
          python3 -m json.tool /tmp/SURFACE_CONTRACT_BUNDLE_v1.17.0.json >/dev/null

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          ACTUAL="$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version

      - name: Build canonical v1.16.0 base library
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/base"
          /tmp/blender-5.2.0-linux-x64/blender -b --python /tmp/build_v116.py -- --out "$GITHUB_WORKSPACE/base" --samples 4 --width 640 --height 450
          test -f "$GITHUB_WORKSPACE/base/OLEANDER_Blender_Surface_NodeGroups_v1.16.0.blend"

      - name: Apply Asset Catalog + Debug Contract + Call validation
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.17.0/asset-library"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender -b "$GITHUB_WORKSPACE/base/OLEANDER_Blender_Surface_NodeGroups_v1.16.0.blend" \
            --python tools/oleander-blender-surface/v1.17.0/build_asset_catalog_bundle.py -- \
            --mode apply \
            --bundle /tmp/SURFACE_CONTRACT_BUNDLE_v1.17.0.json \
            --out-dir "$OUT"
          test -f "$OUT/blender_assets.cats.txt"
          test -f "$OUT/OLEANDER_Blender_Surface_Assets_v1.17.0_bundle.blend"

      - name: Reopen and independently verify persisted asset metadata
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.17.0/asset-library"
          /tmp/blender-5.2.0-linux-x64/blender -b "$OUT/OLEANDER_Blender_Surface_Assets_v1.17.0_bundle.blend" \
            --python tools/oleander-blender-surface/v1.17.0/build_asset_catalog_bundle.py -- \
            --mode verify \
            --bundle /tmp/SURFACE_CONTRACT_BUNDLE_v1.17.0.json \
            --out-dir "$OUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/OLEANDER_Blender_Surface_System_v1.17.0/asset-library/ASSET_DEBUG_REOPEN_REPORT.json')
          r=json.loads(p.read_text()); assert r['status']=='PASS', r
          assert len(r['groups'])==8
          print('REOPEN ASSET/DEBUG GATE PASS')
          PY

      - name: Archive contract and call source with artifact
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.17.0"
          mkdir -p "$OUT/contracts"
          cp /tmp/SURFACE_CONTRACT_BUNDLE_v1.17.0.json "$OUT/contracts/"
          sha256sum "$OUT/asset-library/OLEANDER_Blender_Surface_Assets_v1.17.0_bundle.blend" "$OUT/asset-library/blender_assets.cats.txt" > "$OUT/SHA256SUMS.txt"

      - name: Upload v1.17.0 asset-call evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oleander-blender-surface-system-v1-17-0-${{ github.run_id }}
          path: out/OLEANDER_Blender_Surface_System_v1.17.0/
          if-no-files-found: error
          retention-days: 14
