name: C04 App v1.2 Browser Interface Verification

on:
  pull_request:
    paths:
      - '05-cases/c04-qingjiang-stone-book/digital-currentization/app-game-map-v1.2/**'
      - '05-cases/c04-qingjiang-stone-book/systems-engineering-process-exercise/**'
      - 'tests/c04-app-v12-browser.spec.js'
      - 'tests/c04-app-v12.playwright.config.js'
      - '.github/workflows/c04-app-v12-browser.yml'
  push:
    branches: [main]
    paths:
      - '05-cases/c04-qingjiang-stone-book/digital-currentization/app-game-map-v1.2/**'
      - '05-cases/c04-qingjiang-stone-book/systems-engineering-process-exercise/**'
      - 'tests/c04-app-v12-browser.spec.js'
      - 'tests/c04-app-v12.playwright.config.js'
      - '.github/workflows/c04-app-v12-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-browser-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify C04 APP v1.2 browser interface
        run: npx playwright test --config=tests/c04-app-v12.playwright.config.js

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c04-app-v12-browser-failure-evidence
          path: |
            test-results/c04-app-v12/
            playwright-report/c04-app-v12/
          if-no-files-found: warn
          retention-days: 14
