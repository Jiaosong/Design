name: OLEANDER Shared Blender Runner

on:
  workflow_call:
    inputs:
      job_descriptor_path:
        description: Optional repository-relative JSON machine-job descriptor
        required: false
        default: ''
        type: string
      script_path:
        description: Repository-relative Blender Python producer script
        required: false
        default: ''
        type: string
      validation_script_path:
        description: Optional repository-relative Blender Python validation script
        required: false
        default: ''
        type: string
      blend_file:
        description: Optional repository-relative or generated workspace-relative .blend path to reopen
        required: false
        default: ''
        type: string
      output_dir:
        description: Workspace-relative output directory
        required: false
        default: ''
        type: string
      artifact_name:
        description: Uploaded artifact name
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      job_descriptor_path:
        description: Optional repository-relative JSON machine-job descriptor
        required: false
        default: ''
        type: string
      script_path:
        description: Repository-relative Blender Python producer script
        required: false
        default: ''
        type: string
      validation_script_path:
        description: Optional repository-relative Blender Python validation script
        required: false
        default: ''
        type: string
      blend_file:
        description: Optional workspace-relative .blend path to reopen
        required: false
        default: ''
        type: string
      output_dir:
        description: Workspace-relative output directory
        required: false
        default: ''
        type: string
      artifact_name:
        description: Uploaded artifact name
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  blender-job:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve machine job
        id: job
        shell: bash
        env:
          JOB_DESCRIPTOR_PATH: ${{ inputs.job_descriptor_path }}
          INPUT_SCRIPT_PATH: ${{ inputs.script_path }}
          INPUT_VALIDATION_SCRIPT_PATH: ${{ inputs.validation_script_path }}
          INPUT_BLEND_FILE: ${{ inputs.blend_file }}
          INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import PurePosixPath

          descriptor_path = os.environ.get("JOB_DESCRIPTOR_PATH", "").strip()

          if descriptor_path:
              data = json.load(open(descriptor_path, "r", encoding="utf-8"))
              status = str(data.get("status", "")).strip()
              if status not in {"READY", "WAITING_FOR_DESIGN_SCRIPT", "HOLD", "DISABLED"}:
                  raise SystemExit(f"Unsupported machine-job status: {status!r}")
              run_job = status == "READY"
              script_path = str(data.get("script_path", "")).strip()
              validation_script_path = str(data.get("validation_script_path", "")).strip()
              blend_file = str(data.get("blend_file", "")).strip()
              output_dir = str(data.get("output_dir", "")).strip()
              artifact_name = str(data.get("artifact_name", "")).strip()
              job_id = str(data.get("job_id", "")).strip()
              child_item = str(data.get("child_item", "")).strip()
          else:
              status = "READY"
              run_job = True
              script_path = os.environ.get("INPUT_SCRIPT_PATH", "").strip()
              validation_script_path = os.environ.get("INPUT_VALIDATION_SCRIPT_PATH", "").strip()
              blend_file = os.environ.get("INPUT_BLEND_FILE", "").strip()
              output_dir = os.environ.get("INPUT_OUTPUT_DIR", "").strip()
              artifact_name = os.environ.get("INPUT_ARTIFACT_NAME", "").strip()
              job_id = "DIRECT_INPUT"
              child_item = ""

          def safe_rel(label, value, required=False):
              if required and not value:
                  raise SystemExit(f"Missing required {label}")
              if not value:
                  return
              p = PurePosixPath(value)
              if p.is_absolute() or ".." in p.parts:
                  raise SystemExit(f"Unsafe {label}: {value}")
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"Newline forbidden in {label}")

          if descriptor_path:
              safe_rel("job_descriptor_path", descriptor_path, required=True)

          if run_job:
              safe_rel("script_path", script_path, required=True)
              safe_rel("validation_script_path", validation_script_path)
              safe_rel("blend_file", blend_file)
              safe_rel("output_dir", output_dir, required=True)
              if not artifact_name or "\n" in artifact_name or "\r" in artifact_name:
                  raise SystemExit("Missing/unsafe artifact_name")
              if not os.path.isfile(script_path):
                  raise SystemExit(f"Producer script not found: {script_path}")
              if validation_script_path and not os.path.isfile(validation_script_path):
                  raise SystemExit(f"Validation script not found: {validation_script_path}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_job={'true' if run_job else 'false'}\n")
              f.write(f"status={status}\n")
              f.write(f"job_id={job_id}\n")
              f.write(f"child_item={child_item}\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"OLEANDER_SCRIPT_PATH={script_path}\n")
              f.write(f"OLEANDER_VALIDATION_SCRIPT_PATH={validation_script_path}\n")
              f.write(f"OLEANDER_BLEND_FILE={blend_file}\n")
              f.write(f"OLEANDER_OUTPUT_DIR={output_dir}\n")
              f.write(f"OLEANDER_ARTIFACT_NAME={artifact_name}\n")
              if output_dir:
                  f.write(f"OLEANDER_JOB_OUTPUT_DIR={os.path.join(os.environ['GITHUB_WORKSPACE'], output_dir)}\n")
          PY

      - name: Record non-ready machine job
        if: ${{ steps.job.outputs.run_job != 'true' }}
        shell: bash
        run: |
          echo "OLEANDER machine job skipped: status=${{ steps.job.outputs.status }} job=${{ steps.job.outputs.job_id }} child=${{ steps.job.outputs.child_item }}"

      - name: Prepare job output
        if: ${{ steps.job.outputs.run_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLEANDER_JOB_OUTPUT_DIR"

      - name: Preflight Blender 5.2 producer compatibility
        if: ${{ steps.job.outputs.run_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path

          producer = Path(os.environ["OLEANDER_SCRIPT_PATH"])
          validator_raw = os.environ.get("OLEANDER_VALIDATION_SCRIPT_PATH", "").strip()
          validator = Path(validator_raw) if validator_raw else None

          def read_and_parse(path: Path) -> tuple[str, ast.AST]:
              source = path.read_text(encoding="utf-8")
              try:
                  tree = ast.parse(source, filename=str(path))
              except SyntaxError as exc:
                  raise SystemExit(f"Blender producer preflight syntax failure in {path}: {exc}") from exc
              return source, tree

          def dotted_name(node: ast.AST) -> str:
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  prefix = dotted_name(node.value)
                  return f"{prefix}.{node.attr}" if prefix else node.attr
              return ""

          def assignment_targets(tree: ast.AST) -> list[tuple[str, ast.AST]]:
              found: list[tuple[str, ast.AST]] = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          found.append((dotted_name(target), node.value))
                  elif isinstance(node, ast.AnnAssign):
                      found.append((dotted_name(node.target), node.value))
              return found

          _, tree = read_and_parse(producer)
          if validator is not None:
              read_and_parse(validator)

          targets = assignment_targets(tree)
          render_engine_written = any(name.endswith(".render.engine") for name, _ in targets)
          stale_eevee_constant = any(
              isinstance(node, ast.Constant) and node.value == "BLENDER_EEVEE_NEXT"
              for node in ast.walk(tree)
          )

          uses_empty_factory = False
          creates_world = False
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              call_name = dotted_name(node.func)
              if call_name == "bpy.ops.wm.read_factory_settings":
                  for keyword in node.keywords:
                      if keyword.arg == "use_empty" and isinstance(keyword.value, ast.Constant) and keyword.value.value is True:
                          uses_empty_factory = True
              elif call_name == "bpy.data.worlds.new":
                  creates_world = True

          assigns_scene_world = any(name.endswith(".world") for name, _ in targets)
          writes_world_color = any(name.endswith(".world.color") for name, _ in targets)

          problems = []
          if render_engine_written and stale_eevee_constant:
              problems.append(
                  "stale Blender 5.2 render-engine enum BLENDER_EEVEE_NEXT; use the validated 5.2 enum contract"
              )
          if uses_empty_factory and writes_world_color and not (creates_world or assigns_scene_world):
              problems.append(
                  "factory empty startup writes scene.world.color without explicitly creating/binding a World"
              )

          if problems:
              details = "\n - ".join(problems)
              raise SystemExit(f"OLEANDER Blender 5.2 producer preflight failed before runtime download:\n - {details}")

          print(f"OLEANDER Blender 5.2 producer preflight: PASS ({producer})")
          if validator is not None:
              print(f"OLEANDER Blender validation syntax preflight: PASS ({validator})")
          PY

      - name: Install shared Blender runtime libraries
        if: ${{ steps.job.outputs.run_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Resolve OLEANDER Blender shared runtime
        if: ${{ steps.job.outputs.run_job == 'true' }}
        id: blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(bash 90-shared/toolchains/blender-runtime/ensure-blender-5.2.sh)"
          echo "bin=$BLENDER_BIN" >> "$GITHUB_OUTPUT"
          "$BLENDER_BIN" --version | tee blender-version.txt
          grep -F "Blender 5.2.0" blender-version.txt
          grep -F "build hash: fbe6228777e7" blender-version.txt

      - name: Execute Blender producer
        if: ${{ steps.job.outputs.run_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.blender.outputs.bin }}" \
            --background \
            --factory-startup \
            --python-exit-code 2 \
            --python "$OLEANDER_SCRIPT_PATH"

      - name: Native Blender reopen validation
        if: ${{ steps.job.outputs.run_job == 'true' && env.OLEANDER_BLEND_FILE != '' && env.OLEANDER_VALIDATION_SCRIPT_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OLEANDER_BLEND_FILE"
          "${{ steps.blender.outputs.bin }}" \
            --background "$OLEANDER_BLEND_FILE" \
            --python-exit-code 3 \
            --python "$OLEANDER_VALIDATION_SCRIPT_PATH"

      - name: Artifact identity
        if: ${{ steps.job.outputs.run_job == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$OLEANDER_JOB_OUTPUT_DIR"
          find "$OLEANDER_JOB_OUTPUT_DIR" -type f -print0 | sort -z | xargs -0 sha256sum | tee "$OLEANDER_JOB_OUTPUT_DIR/SHA256SUMS.txt"
          test -s "$OLEANDER_JOB_OUTPUT_DIR/SHA256SUMS.txt"

      - name: Upload Blender job artifact
        if: ${{ steps.job.outputs.run_job == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.OLEANDER_ARTIFACT_NAME }}
          path: |
            ${{ env.OLEANDER_OUTPUT_DIR }}/
            blender-version.txt
          if-no-files-found: error
          retention-days: 30
