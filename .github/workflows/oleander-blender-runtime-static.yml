name: OLEANDER Blender Runtime Static

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-static.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-static.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static syntax and contract checks
        run: >-
          python
          oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check.py
