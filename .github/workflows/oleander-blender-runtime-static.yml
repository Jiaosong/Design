name: OLEANDER Blender Runtime Static

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-static.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/**"
      - ".github/workflows/oleander-blender-runtime-static.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Static syntax and seventeen-layer contract checks
        run: >-
          python
          oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_17.py
      - name: Professional parity default-promotion guard
        run: >-
          python
          oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_professional_parity.py
