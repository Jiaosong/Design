name: OLEANDER Blender Runtime Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '00-governance/runtime/**'
      - 'tools/oleander-runtime/**'
      - 'tests/oleander-blender-runtime-contract.py'
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/**'
      - '.github/workflows/oleander-blender-runtime-contract.yml'
  push:
    branches: [main]
    paths:
      - '00-governance/runtime/**'
      - 'tools/oleander-runtime/**'
      - 'tests/oleander-blender-runtime-contract.py'
      - '.github/workflows/oleander-blender-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate shared Blender runtime interface
        run: |
          set -euo pipefail
          python3 -m json.tool 00-governance/runtime/OLEANDER_BLENDER_RUNTIME_v1.0.json >/dev/null
          bash -n tools/oleander-runtime/activate-blender.sh
          bash -n tools/oleander-runtime/blender.sh
          python3 tests/oleander-blender-runtime-contract.py

  automotive-r17-execution-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Stage R05 and R07-R17 dependency chain
        run: |
          set -euo pipefail
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.11/build_automotive_v011_r05.py.gz.b64 | gzip -d > /tmp/build_automotive_v011_r05.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r07.py /tmp/revise_v011_r07.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r08.py /tmp/revise_v011_r08.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r09.py /tmp/revise_v011_r09.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r10.py /tmp/revise_v011_r10.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r11.py /tmp/revise_v011_r11.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r12.py /tmp/revise_v011_r12.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r14.py /tmp/revise_v011_r14.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r15.py /tmp/revise_v011_r15.py
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r16.py.gz.b64 | gzip -d > /tmp/revise_v011_r16.py
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r17.py.gz.b64 | gzip -d > /tmp/revise_v011_r17.py
          python3 -m py_compile /tmp/build_automotive_v011_r05.py /tmp/revise_v011_r07.py /tmp/revise_v011_r08.py /tmp/revise_v011_r09.py /tmp/revise_v011_r10.py /tmp/revise_v011_r11.py /tmp/revise_v011_r12.py /tmp/revise_v011_r14.py /tmp/revise_v011_r15.py /tmp/revise_v011_r16.py /tmp/revise_v011_r17.py
          test "$(sha256sum /tmp/revise_v011_r16.py | awk '{print $1}')" = "01cedf960554f1379529e97bba607db2f6c8f25199f8bf5fc0b07ac097ba14da"
          test "$(sha256sum /tmp/revise_v011_r17.py | awk '{print $1}')" = "259c333fb259658f00339830e7e7ae3b59bc4f8c3ab6c42454f7b7ea2285772f"
          git rev-parse HEAD > /tmp/R17_SOURCE_COMMIT.txt

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Build R17 smooth nested arch curvature
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r17.py -- --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          cp /tmp/R17_SOURCE_COMMIT.txt "$OUT/R17_SOURCE_COMMIT.txt"
          echo 'R17: R16 topology locked; only wheel-zone curvature law changed to nested analytic arch radii with smoothstep contact blending; front/rear termination remains out of scope; M6-M8 blocked' > "$OUT/REVISION_CHAIN.txt"
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: R17 Machine Gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11')
          q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_V011_RECEIPT.json').read_text())
          c=json.loads((out/'MODELING_CONTRACT.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED', q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED', r
          assert c['modeling_stage']=='M5'
          for key in ['source_island_count_one','source_ngon_zero','controlled_triangles_only','source_no_boolean','source_no_subd','four_arch_boundaries','four_fender_crowns','premature_detail_absent','render_matrix']:
              assert q['checks'][key] is True, (key,q)
          assert len(list((out/'renders').glob('*.png')))==12
          print('AUTOMOTIVE v0.11 R17 SMOOTH ARCH MACHINE GATE PASS')
          PY

      - name: Upload R17 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-automotive-v0-11-r17-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11/
          if-no-files-found: error
          retention-days: 14
