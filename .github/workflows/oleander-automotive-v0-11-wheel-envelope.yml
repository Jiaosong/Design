name: OLEANDER Automotive v0.11 Wheel Envelope

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/inspect_v011_wheel_envelope.py'
      - '.github/workflows/oleander-automotive-v0-11-wheel-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stage wheel inspector dependencies
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/build_automotive_v011_r05.py
          test -f /tmp/inspect_v011_wheel_envelope.py
          python3 -m py_compile /tmp/inspect_v011_wheel_envelope.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Inspect exact wheel world envelope
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/WHEEL_ENVELOPE"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/inspect_v011_wheel_envelope.py -- --out "$OUT" --samples 1 --resolution 64
          test -f "$OUT/WHEEL_ENVELOPE.json"
      - name: Upload wheel envelope
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-automotive-v0-11-wheel-envelope-${{ github.run_id }}
          path: out/WHEEL_ENVELOPE/WHEEL_ENVELOPE.json
          if-no-files-found: error
          retention-days: 14
