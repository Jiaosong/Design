name: OLEANDER Modeling Worker v0.13 R4.1 Termination Envelope Batch

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/v0.13/**'
      - '90-shared/toolchains/blender-surface-system/v1.20.0/f1_design_validation_runtime.py'
      - '90-shared/toolchains/blender-surface-system/v1.20.0/CMF_PRESET_CONTRACT_v1.20.0.json'
      - '.github/workflows/oleander-modeling-worker-v0-13-r4-1-termination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-r4-1-termination-envelope:
    name: G1 R4.1 Native Termination Relation → Professional Batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile and validate R4.1 contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_roundtrip.py \
            90-shared/toolchains/modeling-worker/v0.13/g1_r4_1_termination_variants.py
          python3 -m json.tool 90-shared/toolchains/modeling-worker/v0.13/G1_R4_1_TERMINATION_ENVELOPE_VARIANTS.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('90-shared/toolchains/modeling-worker/v0.13/G1_R4_1_TERMINATION_ENVELOPE_VARIANTS.json').read_text())
          assert v['source_object']=='OL_SRC_LOWER_RETURN_PROFILE'
          assert v['source_property']=='termination_envelope_exponent'
          assert v['source_semantics']=='SHARED_CROSS_SECTION_TERMINATION_ENVELOPE'
          assert v['baseline']['termination_envelope_exponent']==0.34
          assert [row['termination_envelope_exponent'] for row in v['variants']]==[0.30,0.26,0.22]
          assert v['locked_relations']['mesh_local_edit']=='FORBIDDEN'
          PY

      - name: Install Blender runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Build Blender-native R2 source with termination relation ownership
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/G1_R2"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender \
            --background \
            --python-exit-code 5 \
            --python 90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_entry.py \
            -- \
            --source 90-shared/toolchains/modeling-worker/v0.13/G1_PRIMARY_CURVE_SOURCE.json \
            --correction 90-shared/toolchains/modeling-worker/v0.13/G1_R2_RELATION_CORRECTION.json \
            --contract 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_EXECUTION_CONTRACT.json \
            --binding 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_SURFACE_BINDING.json \
            --out "$OUT" \
            --resolution 512

      - name: Execute native R4.1 termination relation batch
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/G1_R4_1"; mkdir -p "$OUT/60_OUTPUTS/DIAGNOSTIC"
          /tmp/blender-5.2.0-linux-x64/blender \
            "$GITHUB_WORKSPACE/out/G1_R2/OLEANDER_G1_R2_HandheldShell__BLENDER_EXECUTION__v0_13.blend" \
            --background \
            --python-exit-code 7 \
            --python 90-shared/toolchains/modeling-worker/v0.13/g1_r4_1_termination_variants.py \
            -- \
            --source 90-shared/toolchains/modeling-worker/v0.13/G1_PRIMARY_CURVE_SOURCE.json \
            --r2-correction 90-shared/toolchains/modeling-worker/v0.13/G1_R2_RELATION_CORRECTION.json \
            --confirmed-interface 90-shared/toolchains/modeling-worker/v0.13/G1_R3_CONFIRMED_INTERFACE_RELATION.json \
            --execution-contract 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_EXECUTION_CONTRACT.json \
            --binding 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_SURFACE_BINDING.json \
            --r4-isolation-contract 90-shared/toolchains/modeling-worker/v0.13/G1_R4_TERMINATION_ISOLATION_CONTRACT.json \
            --variants 90-shared/toolchains/modeling-worker/v0.13/G1_R4_1_TERMINATION_ENVELOPE_VARIANTS.json \
            --out "$OUT/60_OUTPUTS/DIAGNOSTIC" \
            --resolution 640

      - name: Verify native relation ownership and visual routing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/G1_R4_1/60_OUTPUTS/DIAGNOSTIC')
          r=json.loads((root/'G1_R4_1_TERMINATION_ENVELOPE_REPORT.json').read_text())
          assert r['status']=='R4_1_NATIVE_TERMINATION_VARIANTS_RENDERED_VISUAL_DECISION_REQUIRED', r['status']
          assert all(r['checks'].values()), r['checks']
          assert r['native_relation_roundtrip']['pass'] is True
          assert r['native_relation_roundtrip']['changed_families']==['LOWER_RETURN_PROFILE']
          assert r['interface_relation_state']=='CONFIRMED_LOCKED'
          assert r['candidate_promotion']=='NOT_RUN'
          assert len(r['variants'])==3
          assert r['visual_candidates']==[row['variant_id'] for row in r['variants']]
          expected=[0.30,0.26,0.22]
          assert [row['termination_envelope_exponent'] for row in r['variants']]==expected
          for row in r['variants']:
              assert row['machine']['pass'] is True, row
              assert all(row['checks'].values()), row['checks']
              assert set(row['renders'])=={'STRIP','GRAZING','ZEBRA'}
              for name in row['renders'].values():
                  assert (root/name).exists(), name
          assert r['visual_decision']=='NOT_RUN_REQUIRES_TERMINATION_STRIP_GRAZING_ZEBRA_REVIEW'
          print('R4_1_NATIVE_RELATION_BATCH_PASS_VISUAL_DECISION_REQUIRED')
          PY

      - name: Upload R4.1 termination artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-modeling-worker-v0-13-g1-r4-1-${{ github.run_id }}
          path: |
            out/G1_R4_1/
            out/G1_R2/OLEANDER_G1_R2_HandheldShell__BLENDER_EXECUTION__v0_13.blend
          if-no-files-found: error
          retention-days: 14

      - name: Boundary
        run: |
          echo 'R4.1 varies only the Blender-native termination_envelope_exponent relation on OL_SRC_LOWER_RETURN_PROFILE.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The property is read back and restored through the native Source roundtrip before professional variants are evaluated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The confirmed R3 interface relation is locked; all meshes remain derived and non-authoritative.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Visual review is required. Candidate Promotion remains NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"
