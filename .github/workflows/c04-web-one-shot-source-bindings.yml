name: C04 Web One-shot Source Bindings

on:
  push:
    branches:
      - agent/c04-web-v1-12-currentize-20260830
    paths:
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/apply_pr465_source_bindings.mjs'
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/C04_APP_V1_6_MY_BOOK_SOURCE_CARRIER.html'
      - '.github/workflows/c04-web-one-shot-source-bindings.yml'

permissions:
  contents: write

jobs:
  apply-source-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/c04-web-v1-12-currentize-20260830

      - name: Apply exact source bindings
        run: node 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/apply_pr465_source_bindings.mjs

      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/c04-web-one-shot-source-bindings.yml 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/index.html 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/styles.css " || \
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/index.html 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/styles.css "

      - name: Commit bounded binding delta
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/index.html 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/styles.css
          git commit -m 'c04: bind Web MY BOOK to App v1.6 source carrier'
          git push origin HEAD:agent/c04-web-v1-12-currentize-20260830
