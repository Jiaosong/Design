name: C04 Web One-shot Effect Bindings

on:
  push:
    branches:
      - agent/c04-web-v1-12-currentize-20260830
    paths:
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/apply_pr465_source_bindings.mjs'

permissions:
  contents: write

jobs:
  apply-effect-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/c04-web-v1-12-currentize-20260830

      - name: Apply bounded effect bindings
        run: node 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/apply_pr465_source_bindings.mjs

      - name: Verify bounded diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/app.js 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/effects.css 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/index.html "

      - name: Commit bounded effect delta
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/index.html \
            05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/app.js \
            05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/effects.css
          git commit -m 'c04: bind narrative effect layer to current Web'
          git push origin HEAD:agent/c04-web-v1-12-currentize-20260830
