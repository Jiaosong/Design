name: Technical Drawing Analysis Evals

on:
  pull_request:
  push:
    branches:
      - main
      - agent/oleander-technical-drawing-v0.1

permissions:
  contents: read

jobs:
  analysis-contracts:
    name: Technical Drawing analysis contracts and translation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate analysis Decision Question contract
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_analysis_contract.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/ANALYSIS-CONTRACT-01_REGISTER.json

      - name: Exercise analysis-contract regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_analysis_contract_regression.py

      - name: Validate question-bound spatial translation
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_spatial_translation.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/SPATIAL-TRANSLATION-01_REGISTER.json

      - name: Exercise spatial-translation regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_spatial_translation_regression.py

      - name: Validate editorial analysis-board contract
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_editorial_analysis_board.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/BOARD-01_REGISTER.json

      - name: Exercise editorial-board regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_editorial_analysis_board_regression.py

      - name: Validate actual-preview review receipt
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_actual_preview_review.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/PREVIEW-REVIEW-01_REGISTER.json

      - name: Exercise actual-preview regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_actual_preview_review_regression.py

      - name: Validate spatial-event node fixture
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_node_semantics.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/NODE-01_SEMANTICS.svg
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/NODE-01_REGISTER.json

      - name: Validate construction-interface node fixture
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_node_semantics.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/NODE-02_INTERFACE.svg
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/NODE-02_INTERFACE_REGISTER.json

      - name: Exercise node-mode regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_node_mode_regression.py

      - name: Validate visual surface treatment fixture
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_visual_surface_treatment.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/VISUAL-SURFACE-01_REGISTER.json

      - name: Exercise visual surface treatment regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_visual_surface_treatment_regression.py

      - name: Validate effect parameter and recipe libraries
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_effect_parameter_library.py
          oleander-skills/oleander-technical-drawing/references/VISUAL_EFFECT_PARAMETER_LIBRARY.json
          oleander-skills/oleander-technical-drawing/recipes/SVG_PROCEDURAL_RECIPES.json
          oleander-skills/oleander-technical-drawing/recipes/MOTION_HANDOFF_RECIPES.json

      - name: Exercise effect parameter library regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_effect_parameter_library_regression.py

      - name: Validate procedural effect and motion recipe register
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/validate_effect_recipe_register.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/EFFECT-RECIPE-01_REGISTER.json
          oleander-skills/oleander-technical-drawing/recipes/SVG_PROCEDURAL_RECIPES.json
          oleander-skills/oleander-technical-drawing/recipes/MOTION_HANDOFF_RECIPES.json

      - name: Exercise effect and motion recipe regressions
        run: python oleander-skills/oleander-technical-drawing/fixtures/reconstruction/validate_effect_recipe_regression.py

      - name: Build procedural SVG effect atlas
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/build_svg_effect_atlas.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/EFFECT-RECIPE-01_REGISTER.json
          /tmp/OLEANDER_EFFECT_RECIPE_ATLAS.svg

      - name: Build native motion recipe smoke demo
        run: >-
          python oleander-skills/oleander-technical-drawing/tools/build_motion_recipe_demo.py
          oleander-skills/oleander-technical-drawing/fixtures/reconstruction/EFFECT-RECIPE-01_REGISTER.json
          /tmp/OLEANDER_MOTION_RECIPE_DEMO.html

      - name: Publish validator boundary
        if: always()
        run: |
          echo '## Technical Drawing Analysis Evals' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces Decision Question, object/scale/time and representation contracts before spatial translation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rejects abstraction that removes task-critical variables unless a named external layer carries them.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces source-carrier precedence, explicit registration class and semantic-to-graphic translation structure.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces analysis-board finding, first-read label budget, dominant-panel binding and declared reading-tempo diversity.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Separates SPATIAL_EVENT nodes from CONSTRUCTION_INTERFACE nodes and validates their different ownership contracts.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Requires actual-preview review receipts for distance/near read and grayscale when color carries semantics.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates gradient/texture/materiality surface contracts: semantic owner, mapped variable when analytical, gradient/texture formation logic, OFF-state attacks and near/mid/far review.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates effect parameter ranges, semantic-owner requirements and Reduced Motion requirements before recipe execution.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Executes parameterized procedural SVG recipe generation and native motion smoke-demo generation from a golden fixture.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Motion handoff recipes stay subordinate to oleander-motion for runtime, accessibility and AR-S10 review.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Machine PASS proves contract consistency only; it does not award Professional Design PASS, material truth, motion quality, KEEP, Engineering PASS, Field PASS or Promotion.' >> "$GITHUB_STEP_SUMMARY"
