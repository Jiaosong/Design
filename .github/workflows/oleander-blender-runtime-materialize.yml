name: OLEANDER Blender Runtime Materialize

on:
  push:
    branches:
      - agent/blender-runtime-bootstrap
    paths:
      - '.github/workflows/oleander-blender-runtime-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Blender 5.2.0 LTS
        shell: bash
        run: |
          set -euo pipefail
          FILE='blender-5.2.0-linux-x64.tar.xz'
          SHA='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          URL1="https://download.blender.org/release/Blender5.2/${FILE}"
          URL2="https://mirror.clarkson.edu/blender/release/Blender5.2/${FILE}"
          curl -fL --retry 3 --retry-delay 2 "$URL1" -o "$FILE" || curl -fL --retry 3 --retry-delay 2 "$URL2" -o "$FILE"
          echo "${SHA}  ${FILE}" | sha256sum -c -
          tar -xJf "$FILE"
          ./blender-5.2.0-linux-x64/blender --version | head -5
          mkdir -p artifact/blender-5.2.0-lts
          cp -a blender-5.2.0-linux-x64/. artifact/blender-5.2.0-lts/
          printf '%s\n' "$SHA" > artifact/blender-5.2.0-lts/RELEASE_ARCHIVE_SHA256.txt

      - name: Upload managed runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: oleander-blender-5.2.0-lts-linux-x64
          path: artifact/blender-5.2.0-lts
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
