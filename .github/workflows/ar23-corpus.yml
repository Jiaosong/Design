name: AR23 Failure Value Corpus

on:
  push:
    branches:
      - research/ar23-corpus-v0.1-20260810
    paths:
      - 'research/baojiajie/ar23_failure_value_official_parquet_v0_7.py'
      - 'research/baojiajie/ar23_failure_value_official_parquet_v0_8.py'
      - '.github/workflows/ar23-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Parquet/HF dependencies
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.24.7' pyarrow

      - name: Acquire official Home and Kitchen Amazon Reviews 23 discovery corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/baojiajie/ar23_failure_value_corpus_v0_8
          python research/baojiajie/ar23_failure_value_official_parquet_v0_8.py \
            --out research/baojiajie/ar23_failure_value_corpus_v0_8 \
            --meta-shards 7 \
            --reservoir-per-product 60 \
            --per-product 60 \
            --max-reviews-per-parent 5

      - name: Show summary
        run: |
          cat research/baojiajie/ar23_failure_value_corpus_v0_8/corpus_summary_v0_7.json
          wc -l research/baojiajie/ar23_failure_value_corpus_v0_8/external_failure_value_corpus_v0_7.jsonl

      - name: Commit compact research outputs to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/baojiajie/ar23_failure_value_corpus_v0_8/
          if git diff --cached --quiet; then
            echo "No corpus output changes to commit."
          else
            git commit -m "research: add official Home and Kitchen AR23 corpus v0.8 [skip ci]"
            git push origin HEAD:research/ar23-corpus-v0.1-20260810
          fi

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: baojiajie-ar23-failure-value-corpus-v0.8
          path: research/baojiajie/ar23_failure_value_corpus_v0_8/
          if-no-files-found: error
          retention-days: 14
