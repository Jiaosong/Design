name: AR23 Failure Value Corpus

on:
  push:
    branches:
      - research/ar23-corpus-v0.1-20260810
    paths:
      - 'research/baojiajie/ar23_failure_value_extract_v0_1.py'
      - '.github/workflows/ar23-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Acquire Amazon Reviews 23 exploratory corpus
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "attempt=$attempt"
            rm -rf research/baojiajie/ar23_failure_value_corpus_v0_1
            if python research/baojiajie/ar23_failure_value_extract_v0_1.py \
              --out research/baojiajie/ar23_failure_value_corpus_v0_1 \
              --hits-per-query 100 \
              --per-category 120; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Show summary
        run: |
          cat research/baojiajie/ar23_failure_value_corpus_v0_1/corpus_summary_v0_1.json
          wc -l research/baojiajie/ar23_failure_value_corpus_v0_1/external_failure_value_corpus_v0_1.jsonl

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: baojiajie-ar23-failure-value-corpus-v0.1
          path: research/baojiajie/ar23_failure_value_corpus_v0_1/
          if-no-files-found: error
          retention-days: 14
