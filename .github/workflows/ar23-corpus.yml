name: AR23 Failure Value Corpus

on:
  push:
    branches:
      - research/ar23-corpus-v0.1-20260810
    paths:
      - 'research/baojiajie/ar23_failure_value_extract_v0_1.py'
      - 'research/baojiajie/ar23_failure_value_shards_v0_2.py'
      - 'research/baojiajie/ar23_failure_value_joined_v0_3.py'
      - '.github/workflows/ar23-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Acquire product-traceable Amazon Reviews 23 discovery corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/baojiajie/ar23_failure_value_corpus_v0_3
          python research/baojiajie/ar23_failure_value_joined_v0_3.py \
            --out research/baojiajie/ar23_failure_value_corpus_v0_3 \
            --hits-per-query 400 \
            --per-product 120 \
            --max-reviews-per-parent 6

      - name: Show summary
        run: |
          cat research/baojiajie/ar23_failure_value_corpus_v0_3/corpus_summary_v0_3.json
          wc -l research/baojiajie/ar23_failure_value_corpus_v0_3/external_failure_value_corpus_v0_3.jsonl

      - name: Commit compact research outputs to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/baojiajie/ar23_failure_value_corpus_v0_3/
          if git diff --cached --quiet; then
            echo "No corpus output changes to commit."
          else
            git commit -m "research: add product-traceable AR23 corpus v0.3 [skip ci]"
            git push origin HEAD:research/ar23-corpus-v0.1-20260810
          fi

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: baojiajie-ar23-failure-value-corpus-v0.3
          path: research/baojiajie/ar23_failure_value_corpus_v0_3/
          if-no-files-found: error
          retention-days: 14
