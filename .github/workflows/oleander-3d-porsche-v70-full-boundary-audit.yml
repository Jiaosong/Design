name: OLEANDER 3D Porsche V70 Full Boundary Audit
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-porsche-v70-full-boundary-audit.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v70.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  v70-full-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Compile V70
        run: python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v70.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee BLENDER_RUNTIME.txt
      - name: Execute V70 audit
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V70_FULL_BOUNDARY_AUDIT"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v70.py \
            -- --out "$OUT" --samples 4 --resolution-x 640 --resolution-y 426
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          test -f "$OUT/V69_DERIVED_BOUNDARY_REFINEMENT_RECEIPT.json"
          test -f "$OUT/V70_FULL_REAR_APERTURE_BOUNDARY_AUDIT.json"
      - name: Verify audit is fail-closed or complete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/V70_FULL_BOUNDARY_AUDIT/V70_FULL_REAR_APERTURE_BOUNDARY_AUDIT.json').read_text())
          assert d['geometry_mutated_by_audit'] is False
          assert d['lateral_boundary_straddle_count']==0
          assert d['audit_result'] in (
              'PASS_COMPLETE_REAR_APERTURE_BOUNDARY_TOPOLOGY_READY_FOR_PREFLIGHT',
              'HOLD_XZ_BOUNDARY_SPLIT_REQUIRED')
          if d['complete_boundary_topology_ready']:
              assert d['xz_boundary_crossing_face_count']==0
          else:
              assert d['xz_boundary_crossing_face_count']>0
          print(json.dumps(d,indent=2))
          PY
      - name: Upload V70 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-v70-full-boundary-audit-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            out/V70_FULL_BOUNDARY_AUDIT/
          if-no-files-found: error
          retention-days: 14
