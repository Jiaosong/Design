name: OLEANDER CAD Bridge Compat Fix

on:
  push:
    branches:
      - feat/oleander-blender-cad-tangent-move-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-cad-bridge-compat-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-cad-tangent-move-v01-20260910
          fetch-depth: 0
      - name: Currentize Normal bridge against operation-specific validator result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_cad_direct_intent_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = 'check(abs(validated["distance_mm"] - 12.5) <= 1e-9, "intent_metric_distance_preserved", checks)'
          new = 'check(abs(validated["operation"]["distance_mm"] - 12.5) <= 1e-9, "intent_metric_distance_preserved", checks)'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy distance result anchor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_cad_direct_intent_bridge.py
          git config user.name "OLEANDER Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_cad_direct_intent_bridge.py
          git diff --cached --check
          git commit -m "test(blender): preserve CAD normal bridge after operation normalization"
          git push origin HEAD:feat/oleander-blender-cad-tangent-move-v01-20260910
