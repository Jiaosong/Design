name: OLEANDER 3D FreeCAD Parametric Native Benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-freecad-parametric-native-benchmark.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-30-freecad-parametric-native-benchmark/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  freecad-parametric-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}

      - name: Validate benchmark script
        run: |
          set -euo pipefail
          python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-freecad-parametric-native-benchmark/run_freecad_parametric_benchmark.py

      - name: Install FreeCAD 1.1.3 stable AppImage
        run: |
          set -euo pipefail
          URL='https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage'
          EXPECTED='3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/FreeCAD.AppImage "$URL"
          test "$(sha256sum /tmp/FreeCAD.AppImage | awk '{print $1}')" = "$EXPECTED"
          chmod +x /tmp/FreeCAD.AppImage
          cd /tmp
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          FREECADCMD="$(find /tmp/squashfs-root -type f \( -name 'FreeCADCmd' -o -name 'freecadcmd' \) | head -n 1)"
          test -n "$FREECADCMD" && test -x "$FREECADCMD"
          echo "FREECADCMD=$FREECADCMD" >> "$GITHUB_ENV"
          "$FREECADCMD" --version | tee "$GITHUB_WORKSPACE/FREECAD_RUNTIME.txt"
          sha256sum /tmp/FreeCAD.AppImage > "$GITHUB_WORKSPACE/FREECAD_DISTRIBUTION_SHA256.txt"

      - name: Execute native parametric build and change sweep
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/FREECAD_PARAMETRIC"; mkdir -p "$OUT"
          OLEANDER_MODE=build OLEANDER_OUT="$OUT" "$FREECADCMD" \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-30-freecad-parametric-native-benchmark/run_freecad_parametric_benchmark.py
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"

      - name: Reopen FCStd and STEP roundtrip
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/FREECAD_PARAMETRIC"
          OLEANDER_MODE=reopen OLEANDER_OUT="$OUT" "$FREECADCMD" \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-30-freecad-parametric-native-benchmark/run_freecad_parametric_benchmark.py

      - name: Validate parametric and exchange receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/FREECAD_PARAMETRIC')
          b=json.loads((out/'BUILD_RECEIPT.json').read_text())
          r=json.loads((out/'REOPEN_RECEIPT.json').read_text())
          assert b['representation']=='PartDesign Body -> AdditiveBox -> SubtractiveCylinder'
          assert set(b['named_parameters'])=={'Length','Width','Thickness','HoleRadius'}
          assert len(b['variants'])==3
          assert all(v['result']['is_valid'] and v['result']['solids']==1 for v in b['variants'])
          assert all(v['volume_relative_error'] < 1e-6 for v in b['variants'])
          assert b['invalid_gate']['executed'] is False
          assert r['native_expression_graph_preserved'] is True
          assert r['step_roundtrip']['solids']>=1
          assert r['step_roundtrip']['volume_relative_error'] < 1e-6
          assert r['step_roundtrip']['parameter_object_preserved'] is False
          assert r['step_roundtrip']['partdesign_body_preserved'] is False
          print(json.dumps({'freecad_native':'PASS','step_roundtrip':'PASS_WITH_PARAMETRIC_HISTORY_LOSS'},indent=2))
          PY

      - name: Hash complete benchmark evidence
        if: always()
        run: |
          set -euo pipefail
          find out -type f -print0 | sort -z | xargs -0 sha256sum > FREECAD_BENCHMARK_SHA256SUMS.txt || true

      - name: Upload FreeCAD native evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-freecad-parametric-native-${{ github.run_id }}
          path: |
            FREECAD_RUNTIME.txt
            FREECAD_DISTRIBUTION_SHA256.txt
            FREECAD_BENCHMARK_SHA256SUMS.txt
            out/
          if-no-files-found: error
          retention-days: 14
