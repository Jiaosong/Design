name: Timer v3.3 Photography Calibration

on:
  push:
    branches:
      - agent/timer-light-basin-v3.3-photography
    paths:
      - 'website/practice/timer-light-basin-v3/calibration/**'
      - 'website/practice/timer-light-basin-v3/render/**'
      - 'website/practice/timer-light-basin-v3/QA_V3.3_PHOTOGRAPHY.md'
      - '.github/workflows/timer-v33-photography-calibration.yml'
  workflow_dispatch:

jobs:
  webgl-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install calibration dependencies
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: npm install --no-audit --no-fund
      - name: Expose render dependencies to parent modules
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: |
          rm -rf ../node_modules
          ln -s calibration/node_modules ../node_modules
          test -d ../node_modules/three
          test -d ../node_modules/postprocessing
      - name: Install Chromium
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: npx playwright install --with-deps chromium
      - name: Start Vite calibration server
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: |
          npm run dev > vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Capture four WebGL gates
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: npm run capture
      - name: Print WebGL manifest
        working-directory: website/practice/timer-light-basin-v3/calibration
        run: cat artifacts/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: timer-v33-photography-calibration
          path: |
            website/practice/timer-light-basin-v3/calibration/artifacts/*.png
            website/practice/timer-light-basin-v3/calibration/artifacts/manifest.json
            website/practice/timer-light-basin-v3/calibration/vite.log
          if-no-files-found: warn
          retention-days: 14
