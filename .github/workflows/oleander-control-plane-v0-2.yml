name: OLEANDER Control Plane v0.2

on:
  pull_request:
    paths:
      - '00-governance/control-plane/**'
      - '00-governance/README.md'
      - '00-governance/oleander-project-flow-v0.3.md'
      - '.github/workflows/oleander-control-plane-v0-2.yml'
  push:
    branches: [main]
    paths:
      - '00-governance/control-plane/**'
      - '.github/workflows/oleander-control-plane-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s 00-governance/control-plane/tests -p 'test_*.py' -v
      - name: Example control card fail-closed check
        run: python 00-governance/control-plane/control_plane.py check 00-governance/control-plane/examples/example-explore.json
      - name: Compile check
        run: python -m py_compile 00-governance/control-plane/control_plane.py
