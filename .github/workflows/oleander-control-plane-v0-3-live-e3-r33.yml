name: OLEANDER Control Plane v0.3｜E3 R3.3 LIVE Scan

on:
  pull_request:
    paths:
      - '00-governance/control-plane/live/modeling-worker-v0.12-e3-r33-contradiction.json'
      - '.github/workflows/oleander-control-plane-v0-3-live-e3-r33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contradiction-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run existing v0.3 semantic/freshness contradiction scan
        run: |
          python 00-governance/control-plane/orchestrator.py contradictions \
            00-governance/control-plane/live/modeling-worker-v0.12-e3-r33-contradiction.json
      - name: Boundary
        run: |
          echo 'This workflow invokes the existing Control Plane v0.3 contradiction scanner. It adds no new Gate and does not authorize Promotion. PASS only allows preparation of an explicit human Promote Review.' >> "$GITHUB_STEP_SUMMARY"
