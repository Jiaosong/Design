name: SP02-R03 Native Grasshopper Definition SDK Runtime — Historical Diagnostic

# Historical diagnostic only.
# Run #31463649333 proved that managed McNeel NuGet assemblies are insufficient:
# GH_Document initialization requires Rhino native rhcommon_c.
# This workflow is deliberately manual-only and MUST NOT be interpreted as a supported SG01 closure path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-native-serialize-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: practice/2026/2026-08-11_SP02-R03_Runtime-Closure-Handoff/native_definition_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Diagnostic notice
        run: |
          Write-Host 'This is a historical diagnostic. Expected boundary: GH_Document requires Rhino native rhcommon_c.'
          Write-Host 'Do not use this workflow to claim SG01, SG00, or CP2 closure.'
      - name: Restore official McNeel SDK
        run: dotnet restore Sp02NativeDefinitionHarness.csproj
      - name: Build native serialization harness
        run: dotnet build Sp02NativeDefinitionHarness.csproj --configuration Release --no-restore
      - name: Hydrate managed McNeel assemblies for diagnostic reproduction
        run: |
          $out = Join-Path (Get-Location) 'bin/Release/net7.0-windows'
          $packageRoots = @(
            (Join-Path $env:USERPROFILE '.nuget/packages/grasshopper/8.32.26160.13001'),
            (Join-Path $env:USERPROFILE '.nuget/packages/rhinocommon/8.32.26160.13001')
          )
          foreach ($root in $packageRoots) {
            if (!(Test-Path $root)) { throw "Missing restored package: $root" }
            Get-ChildItem $root -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $out -Force }
          }
      - name: Reproduce historical boundary — expected to require Rhino native runtime
        continue-on-error: true
        run: dotnet bin/Release/net7.0-windows/Sp02NativeDefinitionHarness.dll
