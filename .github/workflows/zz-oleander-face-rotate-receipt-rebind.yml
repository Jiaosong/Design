name: OLEANDER Face Rotate Receipt Rebind

on:
  push:
    branches:
      - feat/oleander-blender-face-rotate-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-face-rotate-receipt-rebind.yml"

permissions:
  contents: write
  actions: read

jobs:
  rebind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-face-rotate-v01-20260910
          fetch-depth: 0
      - name: Verify referenced successful evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path], text=True, env=os.environ))
          runtime = api('repos/Jiaosong/Design/actions/runs/34462229511')
          assert runtime['status'] == 'completed' and runtime['conclusion'] == 'success'
          assert runtime['head_sha'] == '069d0291e8ce4a4e4d56df6069c2dd3db942ec09'
          rjobs = api('repos/Jiaosong/Design/actions/runs/34462229511/jobs')['jobs']
          rjob = next(j for j in rjobs if j['id'] == 102822483718)
          assert rjob['conclusion'] == 'success'
          sidecar = api('repos/Jiaosong/Design/actions/runs/34461827861')
          assert sidecar['status'] == 'completed' and sidecar['conclusion'] == 'success'
          assert sidecar['head_sha'] == '1a809cad881cdc1348d10b58a7157bbd4a4f52c5'
          sjobs = api('repos/Jiaosong/Design/actions/runs/34461827861/jobs')['jobs']
          sjob = next(j for j in sjobs if j['id'] == 102821200739)
          assert sjob['conclusion'] == 'success'
          print('OLEANDER_FACE_ROTATE_REFERENCED_EVIDENCE=PASS')
          PY
      - name: Rebind consolidated and bridge receipts with static guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, sys

          repo = Path.cwd()
          runtime = repo/'oleander-skills/oleander-3d-pipeline/blender_runtime'
          tests = runtime/'tests'
          sys.path.insert(0, str(tests))
          import static_check as base

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          consolidated_path = runtime/'BLENDER_RUNTIME_REGRESSION_RECEIPT_5_2_LTS_20260905.json'
          bridge_path = runtime/'CAD_DIRECT_INTENT_BRIDGE_RECEIPT_5_2_20260909.json'
          static_path = tests/'static_check_17_consolidated_5_2.py'
          runtime_workflow = repo/'.github/workflows/oleander-blender-runtime-5-2-lts.yml'
          sidecar_workflow = repo/'.github/workflows/oleander-blender-professional-cad-sidecar-integration.yml'
          cad_sidecar = runtime/'professional_adapter/cad_sidecar.py'
          bridge_script = tests/'validate_cad_direct_intent_bridge.py'
          service = tests/'professional/freecad_cad_direct_edit_service.py'
          integration = tests/'professional/probe_cad_direct_edit_integration.py'
          rotate_probe = tests/'professional/probe_cad_direct_rotate_integration.py'

          consolidated = json.loads(consolidated_path.read_text(encoding='utf-8'))
          consolidated.update({
              'validated_at_utc': '2026-09-10T09:44:25Z',
              'pull_request': 518,
              'candidate_head': '069d0291e8ce4a4e4d56df6069c2dd3db942ec09',
              'tested_pr_merge_commit': 'fbdac0bdb4bb960c2bd38e986cc2fe57212e1747',
              'tested_main_base': '120349ab7b21d22d6d69ed3f442dd8c29f6f8aa9',
          })
          consolidated['workflow'] = {
              'name': 'OLEANDER Blender Runtime 5.2 LTS Regression',
              'run_id': 34462229511,
              'job_id': 102822483718,
              'conclusion': 'success',
          }
          consolidated['host'].update({
              'os': 'Ubuntu 24.04.5 LTS',
              'runner_image': 'ubuntu-24.04',
              'blender_version': '5.2.0 LTS',
              'blender_build_hash': 'fbe6228777e7',
          })
          consolidated['extension_package'].update({
              'filename': 'oleander_blender_runtime-5.2-lts.zip',
              'size_bytes': 94296,
              'sha256': '8ae2846ed1c34952dcf45f8aff2adab97f67b787335ecf3e7d6c42f49abda17d',
              'source_manifest_validate': 'PASS',
              'build': 'PASS',
              'built_package_validate': 'PASS',
          })
          for script, record in consolidated['stages'].items():
              record['status'] = 'PASS'
              record['source_fingerprint_sha256'] = base.source_fingerprint((tests/script).resolve())
          for item in (
              'BLENDER_NATIVE_SINGLE_FACE_ROTATE_UV_TANGENT_AXIS_DEG',
              'DIRECT_FACE_ROTATE_DOWNSTREAM_STALE_PROPAGATION',
              'CAD_NATIVE_FACE_ROTATE_INTENT_ROUTING_NO_DISPLAY_MUTATION',
          ):
              if item not in consolidated['validated_bounded_delta']:
                  consolidated['validated_bounded_delta'].append(item)
          for item in (
              'CAD_FACE_ROTATE_DIRECT_EDIT_EXECUTION_WITHIN_RUNTIME_REGRESSION',
              'GENERAL_ARBITRARY_AXIS_FACE_ROTATE',
              'ARBITRARY_PIVOT_FACE_ROTATE',
              'NONPLANAR_FACE_ROTATE_PARITY',
          ):
              if item not in consolidated['non_claims']:
                  consolidated['non_claims'].append(item)
          consolidated['professional_sidecar_evidence'] = {
              'face_rotate': {
                  'status': 'PASS',
                  'scope': 'BOUNDED_CAD_NATIVE_FACE_ROTATE_CENTER_TANGENT_AXIS',
                  'workflow': {
                      'name': 'OLEANDER Blender Professional CAD Sidecar Integration',
                      'run_id': 34461827861,
                      'job_id': 102821200739,
                      'conclusion': 'success',
                      'head_sha': '1a809cad881cdc1348d10b58a7157bbd4a4f52c5',
                  },
                  'host': {'blender_version': '5.2.0 LTS', 'freecad_version': '1.1.3', 'occt_version': '7.8.1'},
                  'operation': {'kind': 'FACE_ROTATE', 'angle_deg': 5.0, 'axis_mode': 'U', 'axis_origin_local_mm': [0.0,0.0,10.0], 'axis_direction_local': [1.0,0.0,0.0]},
                  'resolution': 'RESOLVED_UNIQUE',
                  'execution_state': 'EXECUTED',
                  'result': {'solid_count': 1, 'bbox_mm': [80.0,50.0,12.178893568691453], 'volume_mm3': 39923.89396183491},
                  'artifacts': {
                      'fcstd_sha256': 'f8ece48ce2d649791eb2332bd120de84f003e3470b3d52810d12cb2e19b9b1ac',
                      'step_sha256': '411236de5f17bff7bfeb6c4d70f79e0e4c6848dd876cc9ed5b0ba594cb047daa',
                      'brep_sha256': '520d7f4aa4b7302ecd1469f41eddc783db3a99c219d482590d67535f0f2abb64',
                      'display_derivative_sha256': '7c2df75fc1b673c05c43de4c09aa86b6f227a83cf65b146894e6ab9f7444671f',
                  },
                  'failure_envelope': {'missing': 'HOLD_NO_RELEASE', 'ambiguous': 'HOLD_NO_RELEASE'},
                  'validated_source_blobs': {
                      'professional_adapter/cad_sidecar.py': git_blob_sha(cad_sidecar),
                      'tests/professional/freecad_cad_direct_edit_service.py': git_blob_sha(service),
                      'tests/professional/probe_cad_direct_edit_integration.py': git_blob_sha(integration),
                      'tests/professional/probe_cad_direct_rotate_integration.py': git_blob_sha(rotate_probe),
                      '.github/workflows/oleander-blender-professional-cad-sidecar-integration.yml': git_blob_sha(sidecar_workflow),
                  },
                  'non_claims': ['unrestricted_arbitrary_axis_face_rotate','arbitrary_pivot_placement','nonplanar_face_rotate','persistent_topological_naming','P0_B_DIRECT_BREP_PASS','P0_G_MODELING_INTERACTION_PASS','default_environment_promotion'],
              }
          }
          consolidated['authority_note'] = (
              'Consolidated current-source compatibility evidence for the shared OLEANDER Blender Runtime through PR #518 on canonical Blender 5.2 LTS. '
              'The seventeen-layer Runtime run 34462229511 / job 102822483718 proves BLENDER_NATIVE bounded Face Normal/Tangent/Rotate behavior and CAD_NATIVE intent routing without premature Blender display mutation. '
              'Bounded CAD_NATIVE FACE_ROTATE authoritative execution is separately established by Professional CAD Sidecar run 34461827861 / job 102821200739 using FreeCAD 1.1.3 / OCCT 7.8.1, with RESOLVED_UNIQUE EXECUTED output plus missing/ambiguous HOLD_NO_RELEASE and Blender display-only save/reopen. '
              'This does not promote unrestricted arbitrary-axis rotation, arbitrary pivot placement, nonplanar face rotation, persistent topological naming, P0_B/P0_G, or default-environment eligibility.'
          )
          consolidated_path.write_text(json.dumps(consolidated, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          bridge = json.loads(bridge_path.read_text(encoding='utf-8'))
          bridge.update({
              'validated_at_utc': '2026-09-10T09:44:25Z',
              'pull_request': 518,
              'candidate_head': '069d0291e8ce4a4e4d56df6069c2dd3db942ec09',
              'tested_pr_merge_commit': 'fbdac0bdb4bb960c2bd38e986cc2fe57212e1747',
              'tested_main_base': '120349ab7b21d22d6d69ed3f442dd8c29f6f8aa9',
          })
          bridge['validated_source_blobs'] = {
              'professional_adapter/cad_sidecar.py': git_blob_sha(cad_sidecar),
              'tests/validate_cad_direct_intent_bridge.py': git_blob_sha(bridge_script),
              '.github/workflows/oleander-blender-runtime-5-2-lts.yml': git_blob_sha(runtime_workflow),
          }
          bridge['workflow'].update({'run_id': 34462229511, 'job_id': 102822483718, 'conclusion': 'success'})
          bridge['host'].update({'os':'Ubuntu 24.04.5 LTS','runner_image':'ubuntu-24.04','blender_version':'5.2.0 LTS','blender_build_hash':'fbe6228777e7'})
          bridge['extension_package_observation'].update({'size_bytes':94296,'sha256':'8ae2846ed1c34952dcf45f8aff2adab97f67b787335ecf3e7d6c42f49abda17d'})
          bridge['authority_note'] = (
              'Fresh canonical Blender 5.2 LTS run 34462229511 / job 102822483718 revalidates the strict intent-to-request bridge against the PR #518 cad_sidecar source after FACE_ROTATE response/bind absorption. '
              'The bridge itself remains NOT_EXECUTED; authoritative FACE_ROTATE execution is separate Professional CAD Sidecar evidence 34461827861 / 102821200739.'
          )
          bridge_path.write_text(json.dumps(bridge, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          text = static_path.read_text(encoding='utf-8')
          text = text.replace('EXPECTED_RUN_ID = 34455090728', 'EXPECTED_RUN_ID = 34462229511')
          text = text.replace('EXPECTED_JOB_ID = 102799500469', 'EXPECTED_JOB_ID = 102822483718')
          text = text.replace('EXPECTED_BRIDGE_RUN_ID = 34455090728', 'EXPECTED_BRIDGE_RUN_ID = 34462229511')
          text = text.replace('EXPECTED_BRIDGE_JOB_ID = 102799500469', 'EXPECTED_BRIDGE_JOB_ID = 102822483718')
          delta_anchor = '    "CAD_NATIVE_TANGENT_INTENT_ROUTING_NO_DISPLAY_MUTATION",\n}'
          delta_new = '    "CAD_NATIVE_TANGENT_INTENT_ROUTING_NO_DISPLAY_MUTATION",\n    "BLENDER_NATIVE_SINGLE_FACE_ROTATE_UV_TANGENT_AXIS_DEG",\n    "DIRECT_FACE_ROTATE_DOWNSTREAM_STALE_PROPAGATION",\n    "CAD_NATIVE_FACE_ROTATE_INTENT_ROUTING_NO_DISPLAY_MUTATION",\n}'
          if text.count(delta_anchor) != 1:
              raise SystemExit('Static bounded-delta anchor drifted')
          text = text.replace(delta_anchor, delta_new, 1)
          claim_anchor = '    "CAD_TANGENT_DIRECT_EDIT_EXECUTION_WITHIN_RUNTIME_REGRESSION",\n'
          claim_new = claim_anchor + '    "CAD_FACE_ROTATE_DIRECT_EDIT_EXECUTION_WITHIN_RUNTIME_REGRESSION",\n    "GENERAL_ARBITRARY_AXIS_FACE_ROTATE",\n    "ARBITRARY_PIVOT_FACE_ROTATE",\n    "NONPLANAR_FACE_ROTATE_PARITY",\n'
          if text.count(claim_anchor) != 1:
              raise SystemExit('Static non-claim anchor drifted')
          text = text.replace(claim_anchor, claim_new, 1)
          insert_anchor = '    if not RUNTIME_WORKFLOW.is_file():\n'
          sidecar_guard = '''    face_rotate = (receipt.get("professional_sidecar_evidence") or {}).get("face_rotate") or {}\n    if face_rotate.get("status") != "PASS" or face_rotate.get("scope") != "BOUNDED_CAD_NATIVE_FACE_ROTATE_CENTER_TANGENT_AXIS":\n        base.fail("bounded CAD Face Rotate professional sidecar receipt is not PASS/current")\n    sw = face_rotate.get("workflow") or {}\n    if sw.get("run_id") != 34461827861 or sw.get("job_id") != 102821200739 or sw.get("conclusion") != "success" or sw.get("head_sha") != "1a809cad881cdc1348d10b58a7157bbd4a4f52c5":\n        base.fail("bounded CAD Face Rotate professional workflow evidence mismatch")\n    sh = face_rotate.get("host") or {}\n    if sh.get("blender_version") != "5.2.0 LTS" or sh.get("freecad_version") != "1.1.3" or sh.get("occt_version") != "7.8.1":\n        base.fail("bounded CAD Face Rotate specialist runtime identity mismatch")\n    op = face_rotate.get("operation") or {}\n    if op.get("kind") != "FACE_ROTATE" or op.get("axis_mode") != "U" or abs(float(op.get("angle_deg", 0.0)) - 5.0) > 1e-9:\n        base.fail("bounded CAD Face Rotate operation evidence mismatch")\n    if face_rotate.get("resolution") != "RESOLVED_UNIQUE" or face_rotate.get("execution_state") != "EXECUTED":\n        base.fail("bounded CAD Face Rotate execution/resolution evidence mismatch")\n    if face_rotate.get("failure_envelope") != {"missing": "HOLD_NO_RELEASE", "ambiguous": "HOLD_NO_RELEASE"}:\n        base.fail("bounded CAD Face Rotate HOLD envelope mismatch")\n    ps = face_rotate.get("validated_source_blobs") or {}\n    professional_paths = {\n        "professional_adapter/cad_sidecar.py": base.RUNTIME_ROOT / "professional_adapter" / "cad_sidecar.py",\n        "tests/professional/freecad_cad_direct_edit_service.py": base.RUNTIME_ROOT / "tests" / "professional" / "freecad_cad_direct_edit_service.py",\n        "tests/professional/probe_cad_direct_edit_integration.py": base.RUNTIME_ROOT / "tests" / "professional" / "probe_cad_direct_edit_integration.py",\n        "tests/professional/probe_cad_direct_rotate_integration.py": base.RUNTIME_ROOT / "tests" / "professional" / "probe_cad_direct_rotate_integration.py",\n        ".github/workflows/oleander-blender-professional-cad-sidecar-integration.yml": base.REPO_ROOT / ".github" / "workflows" / "oleander-blender-professional-cad-sidecar-integration.yml",\n    }\n    for key, path in professional_paths.items():\n        if ps.get(key) != git_blob_sha(path):\n            base.fail(f"bounded CAD Face Rotate professional source blob is stale: {key}")\n\n'''
          if text.count(insert_anchor) != 1:
              raise SystemExit('Static sidecar-guard anchor drifted')
          text = text.replace(insert_anchor, sidecar_guard + insert_anchor, 1)
          static_path.write_text(text, encoding='utf-8')
          print('OLEANDER_FACE_ROTATE_RECEIPT_REBIND=PASS')
          PY
          python3 oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_17_consolidated_5_2.py
      - name: Commit rebound evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OLEANDER Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add \
            oleander-skills/oleander-3d-pipeline/blender_runtime/BLENDER_RUNTIME_REGRESSION_RECEIPT_5_2_LTS_20260905.json \
            oleander-skills/oleander-3d-pipeline/blender_runtime/CAD_DIRECT_INTENT_BRIDGE_RECEIPT_5_2_20260909.json \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_17_consolidated_5_2.py
          git diff --cached --quiet && { echo 'receipt rebind produced no delta'; exit 1; }
          git commit -m "test(blender): rebind Face Rotate runtime receipts"
          git push origin HEAD:feat/oleander-blender-face-rotate-v01-20260910
