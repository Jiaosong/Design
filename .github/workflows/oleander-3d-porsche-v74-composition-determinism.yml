name: OLEANDER 3D Porsche V74 Composition Determinism
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-porsche-v74-composition-determinism.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v74.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  v74-composition-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Compile V74
        run: python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v74.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee BLENDER_RUNTIME.txt
      - name: Execute V74 isolated composition probe
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V74_COMPOSITION_DETERMINISM"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v74.py \
            -- --out "$OUT" --samples 4 --resolution-x 640 --resolution-y 426
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          test -f "$OUT/V74_V72_COMPOSITION_DETERMINISM_PROBE.json"
      - name: Require same-head V72 composition match
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/V74_COMPOSITION_DETERMINISM/V74_V72_COMPOSITION_DETERMINISM_PROBE.json').read_text())
          assert d['pre_run_identity_mutation'] is False
          assert d['composition_result']=='PASS_COMPOSED_V72_MATCHES_STANDALONE'
          assert all(d['checks'].values())
          print(json.dumps(d,indent=2))
          PY
      - name: Upload V74 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-v74-composition-determinism-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            out/V74_COMPOSITION_DETERMINISM/
          if-no-files-found: error
          retention-days: 14
