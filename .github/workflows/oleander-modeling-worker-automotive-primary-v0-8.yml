name: OLEANDER Modeling Worker Automotive Primary v0.8

on:
  push:
    branches:
      - 'agent/automotive-primary-surface-v0-8'
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.8-primary/**'
      - '.github/workflows/oleander-modeling-worker-automotive-primary-v0-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-surface-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Reconstruct and validate v0.8 R03/R04 sources
        run: |
          set -euo pipefail
          R03='90-shared/toolchains/modeling-worker/automotive/v0.8-primary/apply_automotive_primary_v0_8_r03.py'
          R04='90-shared/toolchains/modeling-worker/automotive/v0.8-primary/apply_automotive_primary_v0_8_r04.py'
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.8-primary/build_automotive_primary_v0_8.py.gz.b64 | gzip -d > /tmp/build_auto_primary_v08.py
          test "$(git hash-object "$R03")" = "5e4bc14bf3aec09bcc56e4328740b1b101b29234"
          test "$(git hash-object "$R04")" = "384845948781cd3db28358515690070f7efdbf01"
          cp "$R03" /tmp/apply_auto_primary_v08_r03.py
          cp "$R04" /tmp/apply_auto_primary_v08_r04.py
          python3 -m py_compile /tmp/build_auto_primary_v08.py /tmp/apply_auto_primary_v08_r03.py /tmp/apply_auto_primary_v08_r04.py
          test "$(sha256sum /tmp/build_auto_primary_v08.py | awk '{print $1}')" = "5cee2b54e7998b34bdd5d7ea4a029624888ae2bdfd0c08841deaffb3686425f5"

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Materialize R01 working source at preflight quality
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v08-r01"
          mkdir -p "$BASE"
          set +e
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/build_auto_primary_v08.py -- --out "$BASE" --samples 1 --resolution 128
          RC=$?
          set -e
          test "$RC" -eq 5
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v08-r01'/'AUTOMOTIVE_PRIMARY_QA.json').read_text())
          assert [k for k,v in q['checks'].items() if not v]==['height_corridor']
          PY

      - name: Materialize R03 integrated shell at preflight quality
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v08-r01/OLEANDER_Automotive_Primary_Surface_v0.8.blend"
          OUT="$RUNNER_TEMP/v08-r03"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background "$BASE" --python-exit-code 5 --python /tmp/apply_auto_primary_v08_r03.py -- --base-source /tmp/build_auto_primary_v08.py --out "$OUT" --samples 1 --resolution 128
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'v08-r03'/'AUTOMOTIVE_PRIMARY_QA.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED'
          assert q['checks']['single_primary_shell'] is True
          PY

      - name: Apply R04 component articulation and render final diagnostics
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v08-r03/OLEANDER_Automotive_Primary_Surface_v0.8.blend"
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R04"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background "$BASE" --python-exit-code 5 --python /tmp/apply_auto_primary_v08_r04.py -- --base-source /tmp/build_auto_primary_v08.py --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          printf '%s\n' \
            'R01: split body/cabin; visual REVISE' \
            'R02: cabin/glazing parameter refinement; Machine PASS but split-volume hat reading persists' \
            'R03: integrated primary shell; Machine PASS; split-volume defect closed; component articulation weak' \
            'R04: R03 shell LOCKED; explicit windshield / side glass / rear glass / B-pillar M6 components only' \
            > "$OUT/REVISION_CHAIN.txt"

      - name: Validate R04 Machine component gate
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R04"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Primary_Surface_v0.8-R04')
          q=json.loads((out/'AUTOMOTIVE_PRIMARY_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_PRIMARY_RECEIPT.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED', q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED', r
          assert q['revision']=='R04'
          assert len(list((out/'renders').glob('*.png')))==8
          for key in ['primary_shell_present','primary_shell_manifold','glazing_component_count','b_pillar_count','wheel_guides','premature_detail_absent','render_matrix','height_corridor']:
              assert q['checks'][key] is True, (key,q)
          print('AUTOMOTIVE PRIMARY V0.8 R04 MACHINE COMPONENT GATE PASS; VISUAL REVIEW REQUIRED')
          PY
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Upload v0.8 R04 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-modeling-worker-automotive-primary-v0-8-r04-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Primary_Surface_v0.8-R04/
          if-no-files-found: error
          retention-days: 14
