name: OLEANDER Modeling Worker Automotive Primary v0.8

on:
  push:
    branches:
      - 'agent/automotive-primary-surface-v0-8'
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.8-primary/**'
      - '.github/workflows/oleander-modeling-worker-automotive-primary-v0-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-surface-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Reconstruct and validate v0.8 sources
        run: |
          set -euo pipefail
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.8-primary/build_automotive_primary_v0_8.py.gz.b64 | gzip -d > /tmp/build_auto_primary_v08.py
          cp 90-shared/toolchains/modeling-worker/automotive/v0.8-primary/apply_automotive_primary_v0_8_r02.py /tmp/apply_auto_primary_v08_r02.py
          python3 -m py_compile /tmp/build_auto_primary_v08.py /tmp/apply_auto_primary_v08_r02.py
          test "$(sha256sum /tmp/build_auto_primary_v08.py | awk '{print $1}')" = "5cee2b54e7998b34bdd5d7ea4a029624888ae2bdfd0c08841deaffb3686425f5"
          test "$(sha256sum /tmp/apply_auto_primary_v08_r02.py | awk '{print $1}')" = "92d1b285c145b0e44f186589c0098cc020df0088d61172aaae71b77f001c67c1"

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Materialize R01 working source at preflight quality
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v08-r01"
          mkdir -p "$BASE"
          set +e
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/build_auto_primary_v08.py -- --out "$BASE" --samples 1 --resolution 160
          RC=$?
          set -e
          # R01 is expected to return 5 because its height QA used bbox span instead of ground datum.
          test "$RC" -eq 5
          test -f "$BASE/OLEANDER_Automotive_Primary_Surface_v0.8.blend"
          test -f "$BASE/AUTOMOTIVE_PRIMARY_QA.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v08-r01'/'AUTOMOTIVE_PRIMARY_QA.json'
          q=json.loads(p.read_text())
          failed=[k for k,v in q['checks'].items() if not v]
          assert failed==['height_corridor'], failed
          print('R01 audit reproduced: height_corridor is the only machine failure')
          PY

      - name: Apply R02 cabin/glazing revision and render final diagnostics
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v08-r01/OLEANDER_Automotive_Primary_Surface_v0.8.blend"
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R02"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background "$BASE" --python-exit-code 5 --python /tmp/apply_auto_primary_v08_r02.py -- --base-source /tmp/build_auto_primary_v08.py --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          printf '%s\n' \
            'R01: body + cabin primary / machine fail only from height-gate bug / visual cabin REVISE' \
            'R02: BODY PRIMARY + WHEEL HARD POINTS LOCKED; cabin sections + glazing rake + height gate revised' \
            > "$OUT/REVISION_CHAIN.txt"

      - name: Validate R02 Machine and Construction pre-gates
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R02"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Primary_Surface_v0.8-R02')
          q=json.loads((out/'AUTOMOTIVE_PRIMARY_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_PRIMARY_RECEIPT.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED', q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED', r
          assert q['revision']=='R02'
          assert 1.38 <= q['exterior_height_from_ground_m'] <= 1.46
          assert len(list((out/'renders').glob('*.png')))==8
          assert q['checks']['premature_detail_absent'] is True
          assert q['checks']['body_control_ngon_zero'] is True
          assert q['checks']['cabin_control_ngon_zero'] is True
          assert q['checks']['body_final_manifold'] is True
          assert q['checks']['cabin_final_manifold'] is True
          assert (out/'MODELING_CONTRACT.json').exists()
          assert (out/'OLEANDER_Automotive_Primary_Surface_v0.8.blend').exists()
          print('AUTOMOTIVE PRIMARY V0.8 R02 MACHINE/CONSTRUCTION PRE-GATE PASS; VISUAL REVIEW REQUIRED')
          PY
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Upload v0.8 R02 primary-surface evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-modeling-worker-automotive-primary-v0-8-r02-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Primary_Surface_v0.8-R02/
          if-no-files-found: error
          retention-days: 14
