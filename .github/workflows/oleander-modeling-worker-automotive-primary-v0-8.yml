name: OLEANDER Modeling Worker Automotive Primary v0.8

on:
  push:
    branches:
      - 'agent/automotive-primary-surface-v0-8'
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.8-primary/**'
      - '.github/workflows/oleander-modeling-worker-automotive-primary-v0-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-surface-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Reconstruct and validate sources
        run: |
          set -euo pipefail
          base64 -d 90-shared/toolchains/modeling-worker/automotive/v0.8-primary/build_automotive_primary_v0_8.py.gz.b64 | gzip -d > /tmp/base.py
          for pair in \
            'r03.py:5e4bc14bf3aec09bcc56e4328740b1b101b29234' \
            'r05.py:4256b03abcc2418eb6a50d8d29c0b2c9adf3a509' \
            'r07.py:5d6adc0ce68b8a6ec8dd97316ceb2fddcebee1e7'; do
            f="${pair%%:*}"; expected="${pair##*:}"; src="90-shared/toolchains/modeling-worker/automotive/v0.8-primary/apply_automotive_primary_v0_8_${f}"
            test "$(git hash-object "$src")" = "$expected"
            cp "$src" "/tmp/$f"
          done
          python3 -m py_compile /tmp/base.py /tmp/r03.py /tmp/r05.py /tmp/r07.py
          test "$(sha256sum /tmp/base.py | awk '{print $1}')" = '5cee2b54e7998b34bdd5d7ea4a029624888ae2bdfd0c08841deaffb3686425f5'

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz 'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Materialize R01 → R03 → R05 source lineage
        run: |
          set -euo pipefail
          B=/tmp/blender-5.2.0-linux-x64/blender
          mkdir -p "$RUNNER_TEMP/r01" "$RUNNER_TEMP/r03" "$RUNNER_TEMP/r05"
          set +e
          "$B" --background --python-exit-code 5 --python /tmp/base.py -- --out "$RUNNER_TEMP/r01" --samples 1 --resolution 64
          RC=$?
          set -e
          test "$RC" -eq 5
          "$B" --background "$RUNNER_TEMP/r01/OLEANDER_Automotive_Primary_Surface_v0.8.blend" --python-exit-code 5 --python /tmp/r03.py -- --base-source /tmp/base.py --out "$RUNNER_TEMP/r03" --samples 1 --resolution 64
          "$B" --background "$RUNNER_TEMP/r03/OLEANDER_Automotive_Primary_Surface_v0.8.blend" --python-exit-code 5 --python /tmp/r05.py -- --base-source /tmp/base.py --out "$RUNNER_TEMP/r05" --samples 1 --resolution 64
          test -f "$RUNNER_TEMP/r05/OLEANDER_Automotive_Primary_Surface_v0.8.blend"

      - name: Run R07 selective glazing-mask closure
        run: |
          set -euo pipefail
          B=/tmp/blender-5.2.0-linux-x64/blender
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R07";mkdir -p "$OUT"
          START=$(date +%s)
          "$B" --background "$RUNNER_TEMP/r05/OLEANDER_Automotive_Primary_Surface_v0.8.blend" --python-exit-code 5 --python /tmp/r07.py -- --base-source /tmp/base.py --out "$OUT" --resolution 640
          END=$(date +%s);echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          printf '%s\n' \
            'R06 normal diagnostics proved glazing visible after silhouette material-override repair.' \
            'R07 replaces duplicate material slots in place and uses scene-linear relative-red visibility thresholds.' \
            > "$OUT/REVISION_CHAIN.txt"

      - name: Validate R07 diagnostic closure
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Primary_Surface_v0.8-R07"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Primary_Surface_v0.8-R07')
          q=json.loads((out/'AUTOMOTIVE_PRIMARY_QA.json').read_text())
          assert q['status']=='DIAGNOSTIC_PASS', q
          assert q['checks']['side_indices_preserved'] is True
          assert q['checks']['front_indices_preserved'] is True
          assert q['checks']['side_mask_visible'] is True
          assert q['checks']['front_mask_visible'] is True
          print('R07 DIAGNOSTIC CLOSURE PASS',q['side']['red_pixels'],q['front']['red_pixels'])
          PY
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Upload R07 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-modeling-worker-automotive-primary-v0-8-r07-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Primary_Surface_v0.8-R07/
          if-no-files-found: error
          retention-days: 14
