name: OLEANDER Face Rotate Stage B Repair

on:
  push:
    branches:
      - feat/oleander-blender-face-rotate-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-face-rotate-stage-b-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-face-rotate-v01-20260910
          fetch-depth: 0
      - name: Reuse Stage B patch with one narrow duplicate-anchor allowance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/zz-oleander-face-rotate-stage-b.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('Stage B workflow run block is not unique')
          shell = source.split(marker, 1)[1]
          shell = textwrap.dedent(shell)
          old = '''          def replace_once(path, old, new):\n              text = path.read_text(encoding='utf-8')\n              count = text.count(old)\n              if count != 1:\n                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')\n              path.write_text(text.replace(old, new, 1), encoding='utf-8')\n'''
          new = '''          def replace_once(path, old, new):\n              text = path.read_text(encoding='utf-8')\n              count = text.count(old)\n              known_duplicate = (\n                  count == 2\n                  and old.startswith('\\"non_claims\\": [\\"general_brep_push_pull\\", \\"general_planar_face_translation\\", \\"persistent_topological_naming\\"')\n              )\n              if count != 1 and not known_duplicate:\n                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')\n              path.write_text(text.replace(old, new, 1), encoding='utf-8')\n'''
          if shell.count(old) != 1:
              raise SystemExit('Stage B replace_once helper anchor drifted')
          shell = shell.replace(old, new, 1)
          Path('/tmp/oleander-face-rotate-stage-b.sh').write_text(shell, encoding='utf-8')
          PY
          bash /tmp/oleander-face-rotate-stage-b.sh
