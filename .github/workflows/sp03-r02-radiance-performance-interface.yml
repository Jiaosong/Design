name: SP03-R02 Radiance Performance Interface

on:
  push:
    branches:
      - practice/2026-08-11-sp03-r02-light-performance-interface
    paths:
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/input_contract.json'
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/generate_scene.py'
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/convert_rtrace.py'
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/parse_evalglare.py'
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/analyze_results.py'
      - 'practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/run_radiance_gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radiance-performance-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install official LBNL Radiance runtime and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            python3-numpy \
            python3-matplotlib

          python3 -m venv "$HOME/pyradiance-venv"
          "$HOME/pyradiance-venv/bin/pip" install --disable-pip-version-check pyradiance==1.2.4

          PYRAD_BIN=$("$HOME/pyradiance-venv/bin/python" - <<'PY'
          from pyradiance.anci import BINPATH
          print(BINPATH)
          PY
          )
          PYRAD_ROOT=$(dirname "$PYRAD_BIN")
          echo "$PYRAD_BIN" >> "$GITHUB_PATH"
          echo "PYRAD_BIN=$PYRAD_BIN" >> "$GITHUB_ENV"
          if [ -d "$PYRAD_ROOT/lib" ]; then
            echo "RAYPATH=.:$PYRAD_ROOT/lib" >> "$GITHUB_ENV"
          else
            echo "RAYPATH=." >> "$GITHUB_ENV"
          fi

          echo "pyradiance_version=$("$HOME/pyradiance-venv/bin/python" -c 'import pyradiance; print(pyradiance.__version__)')"
          echo "PYRAD_BIN=$PYRAD_BIN"
          for exe in oconv rtrace rpict gensky evalglare; do
            test -x "$PYRAD_BIN/$exe"
            "$PYRAD_BIN/$exe" -version 2>&1 | head -n 2 || true
          done

      - name: Execute real Radiance interface matrix
        run: |
          bash run_radiance_gate.sh

      - name: Assert truth boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('outputs/gate_decision.json').read_text())
          assert g['radiance_runtime_gate']=='PASS', g
          assert g['glare_runtime_gate']=='PASS', g
          assert g['performance_interface_gate']=='PASS', g
          assert g['project_geometry_gate']=='OPEN', g
          assert g['project_material_gate']=='OPEN', g
          assert g['project_sky_time_gate']=='OPEN', g
          assert g['project_program_threshold_gate']=='OPEN', g
          assert g['project_reality_promotion'] is False, g
          assert g['final_artifact_review']=='PENDING', g
          print(json.dumps(g, indent=2))
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp03-r02-radiance-performance-evidence
          path: |
            practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/runtime/
            practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/outputs/
            practice/2026/2026-08-11_SP03-R02_Light-Performance-Interface/input_contract.json
          if-no-files-found: error
          retention-days: 30
