name: OLEANDER Blender Surface System v1.20.0 CMF Lab

on:
  push:
    branches: [agent/blender-surface-system-v1-20-0]
    paths:
      - 'practice/2026-08-11-ip03-blender-cmf-comparison-lab-v1-20/**'
      - 'tools/oleander-blender-surface/v1.20.0/**'
      - '.github/workflows/oleander-blender-surface-system-v1-20-0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmf-comparison-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Reconstruct optimized F1 lab builder
        run: |
          set -euo pipefail
          base64 -d tools/oleander-blender-surface/v1.20.0/build_material_presets_and_cmf_lab.py.gz.b64 | gzip -d > /tmp/build_v120.py
          python3 -m py_compile /tmp/build_v120.py
          python3 -m json.tool tools/oleander-blender-surface/v1.20.0/CMF_PRESET_CONTRACT_v1.20.0.json >/dev/null

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          ACTUAL="$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version

      - name: Run F1 CMF comparison lab
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.20.0"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender -b --python /tmp/build_v120.py -- --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/RENDER_SECONDS.txt"

      - name: Validate render matrix and execution contract
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Blender_Surface_System_v1.20.0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Blender_Surface_System_v1.20.0')
          r=json.loads((out/'CMF_COMPARISON_RECEIPT.json').read_text())
          assert r['status']=='15_RENDERED_POST_REVIEW_REQUIRED', r
          assert r['scene_compile_count']==1, r
          assert r['persistent_data'] is True
          assert r['adaptive_sampling'] is True
          assert r['samples']==8
          assert r['resolution']==[640,640]
          pngs=sorted((out/'renders').glob('*.png'))
          assert len(pngs)==15, len(pngs)
          assert len(r['renders'])==15
          assert (out/'OLEANDER_CMF_MaterialPresets_v1.20.0.blend').exists()
          assert (out/'lab_blends/CMF_LAB_COMPILED_F1.blend').exists()
          for p in pngs:
              assert p.stat().st_size > 1000, (p,p.stat().st_size)
          print('F1 EXECUTION GATE PASS', len(pngs))
          PY
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"

      - name: Upload F1 CMF lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oleander-cmf-comparison-v1-20-f1-${{ github.run_id }}
          path: out/OLEANDER_Blender_Surface_System_v1.20.0/
          if-no-files-found: error
          retention-days: 14
