name: OLEANDER Modeling Worker v0.12 R3｜Historical Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-r3-failure-receipt:
    name: Verify immutable R3 machine-failure receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify R3 failure lineage
        run: |
          set -euo pipefail
          RECEIPT='90-shared/toolchains/modeling-worker/automotive/v0.12/E3_R3_MACHINE_FAILURE_DECISION.md'
          test -f "$RECEIPT"
          grep -F 'R3 CONTRACT PASS / MACHINE FAIL' "$RECEIPT"
          grep -F '31670668379' "$RECEIPT"
          grep -F '9169743690' "$RECEIPT"
          echo 'R3_HISTORICAL_FAILURE_RECEIPT_VERIFIED'
      - name: Boundary
        run: |
          echo 'R3 is immutable failed evidence. Active Automotive application execution has moved forward; this workflow no longer re-runs the known-failed Blender Working Source on every PR synchronize.' >> "$GITHUB_STEP_SUMMARY"
