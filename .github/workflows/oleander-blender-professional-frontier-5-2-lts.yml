name: OLEANDER Blender Professional Frontier 5.2 LTS

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/PROFESSIONAL_PARITY_*"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/CANDIDATE_GOVERNANCE.json"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/**"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_candidate_governance.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/PROFESSIONAL_INTEGRATION_RECEIPT_*.json"
      - "90-shared/toolchains/blender-runtime/**"
      - ".github/workflows/oleander-blender-professional-frontier-5-2-lts.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/PROFESSIONAL_PARITY_*"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/**"
      - "90-shared/toolchains/blender-runtime/**"
      - ".github/workflows/oleander-blender-professional-frontier-5-2-lts.yml"

permissions:
  contents: read

jobs:
  governance:
    name: Candidate anti-pollution gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Enforce candidate governance contract
        run: python3 oleander-skills/oleander-3d-pipeline/blender_runtime/tests/static_check_candidate_governance.py
      - name: Verify project-wide governance is inherited from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for path in \
            00-governance/OLEANDER_ANTI_POLLUTION_PROTOCOL_v1.0.md \
            00-governance/OLEANDER_ANTI_POLLUTION_CONTRACT_CURRENT.json \
            00-governance/tests/static_check_anti_pollution.py \
            .github/workflows/oleander-project-anti-pollution.yml \
            README.md; do
            git show "origin/main:$path" > /tmp/oleander-main-authority
            cmp -s /tmp/oleander-main-authority "$path" || { echo "Blender Candidate attempted to fork project-wide authority: $path"; exit 1; }
          done

  frontier:
    needs: governance
    name: Frontier 5.2 / ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: custom-tangent-axis-rotate
            probe: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate.py
            readback: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate_blender_readback.py
          - id: reference-bound-operation
            probe: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_reference_bound_operation.py
            readback: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_reference_bound_operation_blender_readback.py
          - id: bounded-pattern-mirror
            probe: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_bounded_pattern_mirror.py
            readback: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_bounded_pattern_mirror_blender_readback.py
          - id: arbitrary-axis-face-rotate
            probe: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_arbitrary_axis_face_rotate.py
            readback: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_arbitrary_axis_face_rotate_blender_readback.py
          - id: cylindrical-face-offset
            probe: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_cylindrical_face_offset.py
            readback: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_cylindrical_face_offset_blender_readback.py
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      PROBE: ${{ matrix.probe }}
      READBACK: ${{ matrix.readback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile frontier probe and readback
        run: |
          set -euo pipefail
          python3 -m py_compile "$PROBE" "$READBACK"

      - name: Install runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Download and verify FreeCAD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${FREECAD_APPIMAGE}" "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-frontier-5-2-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version

      - name: Execute authoritative FreeCAD frontier probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/oleander_frontier_5_2_runner.py <<PY
          import runpy
          runpy.run_path(r"${GITHUB_WORKSPACE}/${PROBE}", run_name="__main__")
          PY
          /tmp/squashfs-root/usr/bin/freecadcmd /tmp/oleander_frontier_5_2_runner.py 2>&1 | tee /tmp/oleander-frontier-5-2-freecad.log
          grep -F '"status": "PASS"' /tmp/oleander-frontier-5-2-freecad.log

      - name: Resolve canonical Blender 5.2 LTS runtime
        id: blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(bash 90-shared/toolchains/blender-runtime/ensure-blender-5.2.sh)"
          echo "bin=$BLENDER_BIN" >> "$GITHUB_OUTPUT"
          "$BLENDER_BIN" --version | tee /tmp/oleander-frontier-5-2-blender-version.txt
          grep -F "Blender 5.2.0" /tmp/oleander-frontier-5-2-blender-version.txt
          grep -F "build hash: fbe6228777e7" /tmp/oleander-frontier-5-2-blender-version.txt

      - name: Blender 5.2 display-only readback
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.blender.outputs.bin }}" --background --factory-startup --python-exit-code 2 --python "$READBACK" 2>&1 | tee /tmp/oleander-frontier-5-2-blender.log
          grep -F '"status": "PASS"' /tmp/oleander-frontier-5-2-blender.log

      - name: Record bounded 5.2 runtime scope
        if: always()
        shell: bash
        run: |
          {
            echo "## OLEANDER Frontier 5.2 — ${{ matrix.id }}"
            echo '- B-Rep authority: FreeCAD 1.1.3 / OCCT.'
            echo '- Blender readback runtime: canonical OLEANDER Blender 5.2.0 LTS.'
            echo '- Blender remains DISPLAY_DERIVATIVE_ONLY / reference consumer for B-Rep evidence.'
            echo '- PASS is bounded to the registered probe and does not make P0-B or general CAD parity PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
