name: OLEANDER 3D glTF Numeric TBN Reconstruction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-gltf-tbn-reconstruction-witness.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  numeric-tbn-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}

      - name: Validate scripts
        run: |
          set -euo pipefail
          python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/build_tbn_witness.py
          node --check 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/browser/runtime_check.mjs

      - name: Install Blender 5.2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee BLENDER_RUNTIME.txt

      - name: Build non-axis-aligned TBN source
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/TBN_SOURCE"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/build_tbn_witness.py \
            -- --out "$OUT"
          test -s "$OUT/TBN_RECONSTRUCTION_WITNESS.blend"
          test -s "$OUT/TBN_RECONSTRUCTION_WITNESS.glb"
          test -s "$OUT/TBN_NORMAL.png"
          test -s "$OUT/SOURCE_RECEIPT.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/TBN_SOURCE/SOURCE_RECEIPT.json').read_text())
          assert r['objects']['TBN_STANDARD']['sign'] != r['objects']['TBN_MIRRORED']['sign']
          q=r['tangent_space_sample']; assert min(abs(q[0]),abs(q[1]),abs(q[2]))>0.2
          assert r['transform_determinant']==1
          print(json.dumps({'source_tbn':'PASS','q':q,'standard_sign':r['objects']['TBN_STANDARD']['sign'],'mirrored_sign':r['objects']['TBN_MIRRORED']['sign']},indent=2))
          PY

      - name: Install pinned Chromium runtime
        working-directory: 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/browser
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node -e "const p=require('./node_modules/playwright/package.json');const t=require('./node_modules/three/package.json');if(p.version!=='1.55.0'||t.version!=='0.179.1')process.exit(2);console.log({playwright:p.version,three:t.version})" | tee "$GITHUB_WORKSPACE/BROWSER_DEPENDENCIES.txt"

      - name: Assemble target asset
        run: |
          set -euo pipefail
          BROWSER="$GITHUB_WORKSPACE/06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/browser"
          mkdir -p "$BROWSER/assets"
          cp out/TBN_SOURCE/TBN_RECONSTRUCTION_WITNESS.glb "$BROWSER/assets/TBN_RECONSTRUCTION_WITNESS.glb"

      - name: Execute numeric TBN readback in Chromium
        working-directory: 06-practice/2026/SYS-MODELING-WORKER/2026-08-30-gltf-tbn-reconstruction-witness/browser
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/BROWSER_SERVER.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4176/viewer.html >/dev/null && break; sleep 1; done
          OLEANDER_OUT="$GITHUB_WORKSPACE/out/TBN_BROWSER" \
          OLEANDER_SOURCE_RECEIPT="$GITHUB_WORKSPACE/out/TBN_SOURCE/SOURCE_RECEIPT.json" \
            node runtime_check.mjs
          test -s "$GITHUB_WORKSPACE/out/TBN_BROWSER/TARGET_RUNTIME_RECEIPT.json"
          test -s "$GITHUB_WORKSPACE/out/TBN_BROWSER/TBN_NUMERIC_BROWSER_720.png"

      - name: Validate numeric TBN contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/TBN_BROWSER/TARGET_RUNTIME_RECEIPT.json').read_text())
          assert r['evidenceClass']=='TARGET_RUNTIME_NUMERIC_TBN_RECONSTRUCTION'
          assert r['numericTangentVectorPreserved'] is True
          assert r['numericNormalVectorPreserved'] is True
          assert r['tangentHandednessPreserved'] is True
          assert r['numericPerturbedNormalReconstructionPreserved'] is True
          assert r['standardVsMirroredPerturbedNormalSeparationDeg']>5
          for c in r['objectChecks'].values():
              assert c['tangentMatch'] and c['normalMatch'] and c['signMatch'] and c['bitangentMatch'] and c['perturbedMatch'] and c['mappedConstructionMatch'] and c['normalMapped']
          print(json.dumps({'numeric_tbn':'PASS','separation_deg':r['standardVsMirroredPerturbedNormalSeparationDeg'],'errors_deg':{k:v['perturbedAngleErrorDeg'] for k,v in r['objectChecks'].items()}},indent=2))
          PY

      - name: Hash evidence
        if: always()
        run: |
          find out -type f -print0 | sort -z | xargs -0 sha256sum > TBN_RECONSTRUCTION_SHA256SUMS.txt || true

      - name: Upload numeric TBN evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-gltf-numeric-tbn-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            BROWSER_DEPENDENCIES.txt
            BROWSER_SERVER.log
            TBN_RECONSTRUCTION_SHA256SUMS.txt
            out/TBN_SOURCE/
            out/TBN_BROWSER/
          if-no-files-found: error
          retention-days: 14
