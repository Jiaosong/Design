name: AI Governance Evals

on:
  pull_request:
    paths:
      - '90-shared/OLEANDER_AI_Governance_P0_v0.1.md'
      - '90-shared/OLEANDER_AI_Governance_P1_v0.1.md'
      - '90-shared/OLEANDER_AI_Design_Reasoning_Protocol_v0.2.md'
      - 'evals/**'
      - 'oleander-skills/**'
      - '.github/workflows/ai-governance-evals.yml'
  push:
    branches: [main]
    paths:
      - '90-shared/OLEANDER_AI_Governance_P0_v0.1.md'
      - '90-shared/OLEANDER_AI_Governance_P1_v0.1.md'
      - '90-shared/OLEANDER_AI_Design_Reasoning_Protocol_v0.2.md'
      - 'evals/**'
      - 'oleander-skills/**'
      - '.github/workflows/ai-governance-evals.yml'

permissions:
  contents: read

jobs:
  governance-corpus:
    name: P0 + P1 governance corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate governance corpus
        run: python evals/scripts/validate_evals.py

      - name: Publish summary
        if: always()
        run: |
          echo '## OLEANDER AI Governance P0 + P1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates five reusable skill Golden Sets.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates canonical retrieval QA cases.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates P1 failure/escalation cases, Recommendation Card and provenance manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Asset manifest does not claim C2PA Content Credentials by default.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Actual model/prompt/skill candidate runs still require versioned result records and human approval before PROMOTE.' >> "$GITHUB_STEP_SUMMARY"
