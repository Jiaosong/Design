name: AI Governance Evals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-corpus:
    name: AIG-01 + AIG-02 + AIG-03 governance, namespaces and runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate governance corpus
        run: python evals/scripts/validate_evals.py

      - name: Validate case and claim namespaces
        run: python 00-governance/schemas/validate_namespaces.py

      - name: Validate architecture namespaces
        run: python 00-governance/schemas/validate_architecture_namespaces.py

      - name: Validate execution contract layer
        run: python 00-governance/runtime/validate_execution_contracts.py

      - name: Validate sticky constraints and full-flow completion
        run: python 00-governance/runtime/validate_execution_locks.py

      - name: Validate governance consolidation contracts
        run: python 00-governance/runtime/validate_governance_consolidation.py

      - name: Validate existing visual authority and image consumption
        run: python 00-governance/runtime/validate_image_consumption.py

      - name: Validate Cloud-Free shared capability surfaces
        run: python 00-governance/runtime/validate_cloud_free_capabilities.py

      - name: Validate current Control Cards and no-loss architecture contract
        run: python 00-governance/control-plane/scan_control_cards.py | tee /tmp/control-card-scan.txt

      - name: Enforce immutable workflow action refs
        run: python evals/scripts/validate_workflow_action_pins.py

      - name: Validate release workflow defaults
        run: python evals/scripts/validate_workflow_release_defaults.py

      - name: Compute AIG-03 runtime metrics
        run: python evals/runtime/compute_metrics.py | tee /tmp/aig03-metrics.txt

      - name: Publish summary
        if: always()
        run: |
          echo '## OLEANDER AI Governance AIG-01 + AIG-02 + AIG-03' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runs on every pull request and every push to main, so it can be used as a stable required check.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates reusable skill Golden Sets and canonical retrieval QA cases.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates AIG-02 failure/escalation cases, Recommendation Card and provenance manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates AIG-03 runtime-event schema and reports only confirmed metric-eligible evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates project/case/claim namespaces and rejects current-authority P0/P1/P2 AI-governance pollution.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates the six machine-readable execution contracts, current owner declarations, Image Ops binding, four-layer regression schema, and runtime README pointers.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces sticky negative user constraints before tool/creation routing and blocks full-flow closure while required phases remain incomplete.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces one active production frontier per logical object, predecessor closure on successor adoption, location integrity, lifecycle exit, and source-byte dedup semantics.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces existing visual authority, one semantic content image per consumer unit, derivative identity inheritance, and project image-consumption ledgers.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates Cloud-Free shared capability surfaces, zero external runtime dependency for Spatial Lab, preserved professional HOLD boundaries, and forbids fake browser PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Discovers current Control Card v0.2 objects by content signature and applies existing Control Plane validation, including the global no-loss Architecture preservation contract.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Replay/example/test/receipt/archive/frozen-Legacy zones are not retroactively rewritten by the prospective Control Card scan.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforces full immutable commit-SHA pins for external GitHub Actions dependencies across all workflows.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validates release workflow defaults against the locked Timer v3.3 authority manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Zero-denominator metrics must render as N/A, never as 0%.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Current Control Card scan' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/control-card-scan.txt ]; then
            sed 's/^/- /' /tmp/control-card-scan.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Control Card scan unavailable because an earlier validation step failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### AIG-03 current evidence' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/aig03-metrics.txt ]; then
            sed 's/^/- /' /tmp/aig03-metrics.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- AIG-03 metrics unavailable because an earlier validation step failed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  pro-design-candidate-smoke:
    name: PR393 professional shared runtime smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/2026-08-27-pro-design-toolchain-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OLEANDER_PRO_RUNTIME_HOME: ${{ runner.temp }}/oleander-pro-design
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate candidate runtime contract
        run: |
          set -euo pipefail
          python3 -m json.tool 00-governance/runtime/OLEANDER_PRO_DESIGN_TOOLCHAIN_RUNTIME_v0.1.json >/dev/null
          for f in 90-shared/toolchains/pro-design/*.sh; do bash -n "$f"; done

      - name: Materialize pinned OpenBIM CAD DXF Python runtime
        run: |
          set -euo pipefail
          bash 90-shared/toolchains/pro-design/materialize.sh
          bash 90-shared/toolchains/pro-design/probe.sh

      - name: IFC create write reopen
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oleander-pro-smoke"
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.ifc" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os, ifcopenshell, ifcopenshell.guid
          out = os.environ['OUT']
          model = ifcopenshell.file(schema='IFC4')
          model.create_entity('IfcProject', GlobalId=ifcopenshell.guid.new(), Name='OLEANDER_PRO_SMOKE')
          model.write(out)
          reopened = ifcopenshell.open(out)
          projects = reopened.by_type('IfcProject')
          assert len(projects) == 1 and projects[0].Name == 'OLEANDER_PRO_SMOKE'
          print('IFC_CREATE_WRITE_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.ifc"

      - name: STEP solid export reopen
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.step" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os, cadquery as cq
          out = os.environ['OUT']
          solid = cq.Workplane('XY').box(20, 10, 5)
          cq.exporters.export(solid, out)
          reopened = cq.importers.importStep(out)
          bb = reopened.val().BoundingBox()
          assert abs(bb.xlen - 20) < 1e-6 and abs(bb.ylen - 10) < 1e-6 and abs(bb.zlen - 5) < 1e-6
          print('STEP_EXPORT_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.step"

      - name: DXF create reopen
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.dxf" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os, ezdxf
          out = os.environ['OUT']
          doc = ezdxf.new('R2018')
          msp = doc.modelspace()
          msp.add_line((0, 0), (100, 0))
          msp.add_circle((50, 25), radius=10)
          doc.saveas(out)
          reopened = ezdxf.readfile(out)
          assert len(reopened.modelspace()) >= 2
          print('DXF_CREATE_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.dxf"

      - name: Deterministic raster and motion smoke
        run: |
          set -euo pipefail
          png="${RUNNER_TEMP}/oleander-pro-smoke/smoke.png"
          video="${RUNNER_TEMP}/oleander-pro-smoke/smoke.mkv"
          bash 90-shared/toolchains/pro-design/raster.sh -size 64x64 gradient: -colorspace sRGB "$png"
          test "$(bash 90-shared/toolchains/pro-design/raster.sh "$png" -format '%wx%h' info:)" = "64x64"
          bash 90-shared/toolchains/pro-design/motion.sh -hide_banner -loglevel error -f lavfi -i testsrc=size=64x64:rate=5 -t 1 -c:v ffv1 -y "$video"
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 "$video" | grep -q '64,64'
          echo 'RASTER_AND_MOTION=PASS'

      - name: Materialize verified FreeCAD 1.1.3
        env:
          OLEANDER_PRO_MATERIALIZE_FREECAD: '1'
        run: |
          set -euo pipefail
          bash 90-shared/toolchains/pro-design/materialize.sh
          bash 90-shared/toolchains/pro-design/freecad.sh --version

      - name: FreeCAD headless STEP and CAM module smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/oleander-pro-smoke/freecad_smoke.py" <<'PY'
          import os
          import FreeCAD as App
          import Part
          doc = App.newDocument('OLEANDER_PRO_SMOKE')
          obj = doc.addObject('Part::Feature', 'Box')
          obj.Shape = Part.makeBox(20, 10, 5)
          doc.recompute()
          fcstd = os.path.join(os.environ['RUNNER_TEMP'], 'oleander-pro-smoke', 'freecad-smoke.FCStd')
          step = os.path.join(os.environ['RUNNER_TEMP'], 'oleander-pro-smoke', 'freecad-smoke.step')
          doc.saveAs(fcstd)
          Part.export([obj], step)
          assert os.path.getsize(fcstd) > 0 and os.path.getsize(step) > 0
          import Path
          print('FREECAD_PARAMETRIC_STEP_EXPORT=PASS')
          print('FREECAD_CAM_MODULE_IMPORT=PASS')
          PY
          bash 90-shared/toolchains/pro-design/freecad.sh "${RUNNER_TEMP}/oleander-pro-smoke/freecad_smoke.py"
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/freecad-smoke.FCStd"
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/freecad-smoke.step"
