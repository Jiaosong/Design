name: OLEANDER Face Rotate Stage A Patch

on:
  push:
    branches:
      - feat/oleander-blender-face-rotate-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-face-rotate-stage-a.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-face-rotate-v01-20260910
          fetch-depth: 0
      - name: Patch existing Direct Face owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('oleander-skills/oleander-3d-pipeline/blender_runtime')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # direct_model.py — extend the existing Direct Face interaction family.
          direct = root / 'oleander_blender/direct_model.py'
          replace_once(direct, 'import hashlib\nimport json\n', 'import hashlib\nimport json\nimport math\n')
          rotate_builder = '''\n\ndef _build_cad_direct_rotate_intent(obj, angle_deg, axis_mode, descriptor, tangent_u, tangent_v):\n    angle = float(angle_deg)\n    if not math.isfinite(angle) or abs(angle) <= 1e-9:\n        raise ValueError("CAD face rotate requires a finite non-zero angle")\n    if abs(angle) > 10.0:\n        raise ValueError("CAD face rotate exceeds bounded 10 degree contract")\n    if axis_mode not in {"U", "V"}:\n        raise ValueError("CAD face rotate axis mode must be U or V")\n    axis = tangent_u if axis_mode == "U" else tangent_v\n    normal = Vector(tuple(float(v) for v in descriptor["normal_local"])).normalized()\n    if axis.length <= 1e-9 or abs(float(normal.dot(axis.normalized()))) > 1e-7:\n        raise ValueError("CAD face rotate axis must lie in the selected face tangent plane")\n    return _cad_direct_intent_envelope(\n        obj,\n        "FACE_ROTATE",\n        {\n            "angle_deg": angle,\n            "axis_mode": axis_mode,\n            "axis_origin_local_mm": list(descriptor["center_local_mm"]),\n            "axis_direction_local": _rounded_vector(axis.normalized(), 9),\n        },\n        descriptor,\n    )\n'''
          replace_once(direct, '\ndef _selected_governed_edit_face(context):\n', rotate_builder + '\ndef _selected_governed_edit_face(context):\n')

          rotate_operator = '''\n\nclass OLEANDER_OT_direct_face_rotate(bpy.types.Operator):\n    """Rotate one governed planar face about a deterministic in-face U/V axis."""\n\n    bl_idname = "oleander.direct_face_rotate"\n    bl_label = "Face Rotate"\n    bl_description = (\n        "Rotate one selected face about its geometry-derived U or V tangent axis through the face center; "\n        "CAD-native masters prepare a governed sidecar intent without mutating the Blender display"\n    )\n    bl_options = {"REGISTER", "UNDO"}\n\n    axis_mode: bpy.props.EnumProperty(\n        name="Axis",\n        items=[("U", "U tangent", "Rotate about the deterministic face U tangent"), ("V", "V tangent", "Rotate about the deterministic face V tangent")],\n        default="U",\n    )\n    angle_deg: bpy.props.FloatProperty(name="Angle deg", default=3.0, min=-10.0, max=10.0)\n\n    @classmethod\n    def poll(cls, context):\n        return (\n            context.active_object is not None\n            and context.active_object.type == "MESH"\n            and context.mode == "EDIT_MESH"\n        )\n\n    def invoke(self, context, event):\n        return context.window_manager.invoke_props_dialog(self)\n\n    def execute(self, context):\n        angle = float(self.angle_deg)\n        if not math.isfinite(angle) or abs(angle) <= 1e-9:\n            self.report({"ERROR"}, "Face Rotate requires a finite non-zero angle")\n            return {"CANCELLED"}\n        if abs(angle) > 10.0:\n            self.report({"ERROR"}, "Face Rotate exceeds bounded 10 degree contract")\n            return {"CANCELLED"}\n        try:\n            obj, bm, face = _selected_governed_edit_face(context)\n            tangent_u, tangent_v = _face_tangent_basis(face)\n        except ValueError as exc:\n            self.report({"ERROR"}, str(exc))\n            return {"CANCELLED"}\n\n        descriptor = _face_semantic_descriptor(context, face)\n        axis = tangent_u if self.axis_mode == "U" else tangent_v\n        center = face.calc_center_median().copy()\n        master_type = obj.oleander.master_type if hasattr(obj, "oleander") else "BLENDER_NATIVE"\n\n        if master_type == "CAD_NATIVE":\n            try:\n                intent = _build_cad_direct_rotate_intent(\n                    obj, angle, self.axis_mode, descriptor, tangent_u, tangent_v\n                )\n            except ValueError as exc:\n                self.report({"ERROR"}, str(exc))\n                return {"CANCELLED"}\n            encoded = _canonical_json(intent)\n            obj["oleander_last_direct_operation"] = "CAD_DIRECT_EDIT_INTENT"\n            obj["oleander_direct_authority_route"] = "CAD_NATIVE"\n            obj["oleander_cad_direct_edit_intent"] = encoded\n            obj["oleander_cad_direct_edit_intent_sha256"] = hashlib.sha256(encoded.encode("utf-8")).hexdigest()\n            obj["oleander_cad_direct_edit_state"] = "PENDING_SIDECAR"\n            obj["oleander_direct_face_rotate_axis_mode"] = self.axis_mode\n            obj["oleander_direct_face_rotate_angle_deg"] = angle\n            self.report({"INFO"}, "CAD face-rotate intent prepared; authoritative CAD and Blender display geometry remain unchanged")\n            return {"FINISHED"}\n\n        if master_type != "BLENDER_NATIVE":\n            self.report({"ERROR"}, f"Face Rotate has no bounded authority route for {master_type}")\n            return {"CANCELLED"}\n\n        radians = math.radians(angle)\n        cosine = math.cos(radians)\n        sine = math.sin(radians)\n        unit_axis = axis.normalized()\n        for vert in face.verts:\n            relative = vert.co - center\n            rotated = (\n                relative * cosine\n                + unit_axis.cross(relative) * sine\n                + unit_axis * unit_axis.dot(relative) * (1.0 - cosine)\n            )\n            vert.co = center + rotated\n        bm.normal_update()\n        bmesh.update_edit_mesh(obj.data, loop_triangles=False, destructive=False)\n        context.view_layer.update()\n\n        downstream = mark_downstream_stale(\n            [object_id(obj)],\n            reason="DIRECT_FACE_ROTATE",\n            scene=context.scene,\n        )\n        obj["oleander_last_direct_operation"] = "FACE_ROTATE"\n        obj["oleander_direct_authority_route"] = "BLENDER_NATIVE"\n        obj["oleander_direct_face_rotate_axis_mode"] = self.axis_mode\n        obj["oleander_direct_face_rotate_angle_deg"] = angle\n        obj["oleander_direct_face_rotate_axis_local"] = _rounded_vector(unit_axis, 9)\n        obj["oleander_direct_face_rotate_origin_local_mm"] = list(descriptor["center_local_mm"])\n        obj["oleander_direct_face_target_descriptor"] = _canonical_json(descriptor)\n        obj["oleander_direct_downstream_stale"] = json.dumps(downstream, sort_keys=True)\n        self.report({"INFO"}, f"Face rotated {angle:+.3f} deg about {self.axis_mode}; downstream stale: {len(downstream)}")\n        return {"FINISHED"}\n'''
          replace_once(direct, '\nclass OLEANDER_OT_duplicate_linear(bpy.types.Operator):\n', rotate_operator + '\nclass OLEANDER_OT_duplicate_linear(bpy.types.Operator):\n')
          replace_once(direct, '    OLEANDER_OT_direct_face_tangent_move,\n    OLEANDER_OT_duplicate_linear,', '    OLEANDER_OT_direct_face_tangent_move,\n    OLEANDER_OT_direct_face_rotate,\n    OLEANDER_OT_duplicate_linear,')

          # panel.py — expose the same bounded operator for Blender and CAD intent routing.
          panel = root / 'oleander_blender/panel.py'
          old_panel = '''            direct_box.label(text="Direct Face · bounded v0.2")\n            direct_box.label(text=f"Authority route: {meta.master_type}")\n            if context.mode == "EDIT_MESH":\n                direct_box.operator(\n                    "oleander.direct_face_normal_move",\n                    text="Face Normal Move ±mm",\n                    icon="ORIENTATION_NORMAL",\n                )\n                if meta.master_type == "BLENDER_NATIVE":\n                    direct_box.operator(\n                        "oleander.direct_face_tangent_move",\n                        text="Face Tangent Move U/V mm",\n                        icon="ORIENTATION_LOCAL",\n                    )\n                    direct_box.label(text="One selected face · geometry U/V tangent basis")\n                    direct_box.label(text="Normal and tangent edits propagate stale state")\n                elif meta.master_type == "CAD_NATIVE":\n                    direct_box.label(text="Normal Move routes through governed CAD sidecar", icon="INFO")\n                    direct_box.label(text="Tangent Move remains HOLD until shared sidecar absorption")\n                    direct_box.label(text="Display mesh is not CAD authority")\n                else:\n                    direct_box.label(text="No bounded direct-face route for this master", icon="ERROR")\n            else:\n                direct_box.label(text="Enter Mesh Edit Mode and select one face")\n'''
          new_panel = '''            direct_box.label(text="Direct Face · bounded v0.3")\n            direct_box.label(text=f"Authority route: {meta.master_type}")\n            if context.mode == "EDIT_MESH":\n                direct_box.operator("oleander.direct_face_normal_move", text="Face Normal Move ±mm", icon="ORIENTATION_NORMAL")\n                direct_box.operator("oleander.direct_face_tangent_move", text="Face Tangent Move U/V mm", icon="ORIENTATION_LOCAL")\n                direct_box.operator("oleander.direct_face_rotate", text="Face Rotate U/V ±deg", icon="DRIVER_ROTATIONAL_DIFFERENCE")\n                if meta.master_type == "BLENDER_NATIVE":\n                    direct_box.label(text="One selected face · geometry U/V tangent basis")\n                    direct_box.label(text="Normal / tangent / rotate edits propagate stale state")\n                elif meta.master_type == "CAD_NATIVE":\n                    direct_box.label(text="Normal + Tangent route through governed CAD sidecar", icon="INFO")\n                    direct_box.label(text="Rotate prepares governed intent; execution gate remains separate")\n                    direct_box.label(text="Display mesh is not CAD authority")\n                else:\n                    direct_box.label(text="No bounded direct-face route for this master", icon="ERROR")\n            else:\n                direct_box.label(text="Enter Mesh Edit Mode and select one face")\n'''
          replace_once(panel, old_panel, new_panel)

          # cad_sidecar.py — add strict FACE_ROTATE intent/request contract only; specialist execution follows next gate.
          sidecar = root / 'professional_adapter/cad_sidecar.py'
          replace_once(sidecar,
              'DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE = "FACE_TANGENT_MOVE"\nDIRECT_EDIT_TANGENT_MAX_DISTANCE_MM = 20.0\n',
              'DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE = "FACE_TANGENT_MOVE"\nDIRECT_EDIT_OPERATION_FACE_ROTATE = "FACE_ROTATE"\nDIRECT_EDIT_TANGENT_MAX_DISTANCE_MM = 20.0\nDIRECT_EDIT_ROTATE_MAX_ANGLE_DEG = 10.0\n')
          replace_once(sidecar,
              '_DIRECT_REQUEST_TANGENT_OPERATION_KEYS = {"kind", "translation_local_mm"}\n_DIRECT_TANGENT_INTENT_PARAMETER_KEYS = {"u_mm", "v_mm", "tangent_u_local", "tangent_v_local", "translation_local_mm"}\n',
              '_DIRECT_REQUEST_TANGENT_OPERATION_KEYS = {"kind", "translation_local_mm"}\n_DIRECT_REQUEST_ROTATE_OPERATION_KEYS = {"kind", "angle_deg", "axis_mode", "axis_origin_local_mm", "axis_direction_local"}\n_DIRECT_TANGENT_INTENT_PARAMETER_KEYS = {"u_mm", "v_mm", "tangent_u_local", "tangent_v_local", "translation_local_mm"}\n_DIRECT_ROTATE_INTENT_PARAMETER_KEYS = {"angle_deg", "axis_mode", "axis_origin_local_mm", "axis_direction_local"}\n')
          rotate_validator = '''\n\ndef _validate_rotate_intent_parameters(parameters: dict, target: dict) -> dict:\n    parameters = _require_exact_keys(parameters, _DIRECT_ROTATE_INTENT_PARAMETER_KEYS, "FACE_ROTATE parameters")\n    angle_deg = _finite_float(parameters.get("angle_deg"), "parameters.angle_deg")\n    if abs(angle_deg) <= 1e-9:\n        raise CADSidecarContractError("FACE_ROTATE angle must be non-zero")\n    if abs(angle_deg) > DIRECT_EDIT_ROTATE_MAX_ANGLE_DEG + 1e-9:\n        raise CADSidecarContractError("FACE_ROTATE exceeds bounded 10 degree specialist contract")\n    axis_mode = str(parameters.get("axis_mode") or "")\n    if axis_mode not in {"U", "V"}:\n        raise CADSidecarContractError("FACE_ROTATE axis_mode must be U or V")\n    axis_origin = _vector(parameters.get("axis_origin_local_mm"), 3, "parameters.axis_origin_local_mm")\n    axis_direction = _unit3(parameters.get("axis_direction_local"), "parameters.axis_direction_local")\n    normal = _unit3(target.get("normal_local"), "target.normal_local")\n    if abs(_dot3(axis_direction, normal)) > 1e-6:\n        raise CADSidecarContractError("FACE_ROTATE axis must lie in the target tangent plane")\n    center = _vector(target.get("center_local_mm"), 3, "target.center_local_mm")\n    if any(abs(a - b) > 1e-6 for a, b in zip(axis_origin, center)):\n        raise CADSidecarContractError("FACE_ROTATE first shared contract requires the axis through target face center")\n    return {\n        "kind": DIRECT_EDIT_OPERATION_FACE_ROTATE,\n        "angle_deg": angle_deg,\n        "axis_mode": axis_mode,\n        "axis_origin_local_mm": axis_origin,\n        "axis_direction_local": axis_direction,\n    }\n'''
          replace_once(sidecar, '\ndef validate_direct_edit_intent(intent: dict) -> dict:\n', rotate_validator + '\ndef validate_direct_edit_intent(intent: dict) -> dict:\n')
          replace_once(sidecar,
              '    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normalized_operation = None\n    else:\n',
              '    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normalized_operation = None\n    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_ROTATE:\n        normalized_operation = None\n    else:\n')
          replace_once(sidecar,
              '    if operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normalized_operation = _validate_tangent_intent_parameters(parameters, target)\n',
              '    if operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normalized_operation = _validate_tangent_intent_parameters(parameters, target)\n    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_ROTATE:\n        normalized_operation = _validate_rotate_intent_parameters(parameters, target)\n')
          old_request_branch = '''    if normalized_operation["kind"] == DIRECT_EDIT_OPERATION_FACE_NORMAL_MOVE:\n        request_operation = {\n            "kind": DIRECT_EDIT_OPERATION_FACE_NORMAL_MOVE,\n            "distance_mm": normalized_operation["distance_mm"],\n        }\n    else:\n        request_operation = {\n            "kind": DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE,\n            "translation_local_mm": normalized_operation["translation_local_mm"],\n        }\n'''
          new_request_branch = '''    if normalized_operation["kind"] == DIRECT_EDIT_OPERATION_FACE_NORMAL_MOVE:\n        request_operation = {"kind": DIRECT_EDIT_OPERATION_FACE_NORMAL_MOVE, "distance_mm": normalized_operation["distance_mm"]}\n    elif normalized_operation["kind"] == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        request_operation = {"kind": DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE, "translation_local_mm": normalized_operation["translation_local_mm"]}\n    else:\n        request_operation = {\n            "kind": DIRECT_EDIT_OPERATION_FACE_ROTATE,\n            "angle_deg": normalized_operation["angle_deg"],\n            "axis_mode": normalized_operation["axis_mode"],\n            "axis_origin_local_mm": normalized_operation["axis_origin_local_mm"],\n            "axis_direction_local": normalized_operation["axis_direction_local"],\n        }\n'''
          replace_once(sidecar, old_request_branch, new_request_branch)
          request_rotate_branch = '''    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_ROTATE:\n        operation = _require_exact_keys(raw_operation, _DIRECT_REQUEST_ROTATE_OPERATION_KEYS, "CAD direct-edit rotate operation")\n        angle_deg = _finite_float(operation.get("angle_deg"), "operation.angle_deg")\n        if abs(angle_deg) <= 1e-9:\n            raise CADSidecarContractError("FACE_ROTATE request angle must be non-zero")\n        if abs(angle_deg) > DIRECT_EDIT_ROTATE_MAX_ANGLE_DEG + 1e-9:\n            raise CADSidecarContractError("FACE_ROTATE request exceeds bounded 10 degree specialist contract")\n        axis_mode = str(operation.get("axis_mode") or "")\n        if axis_mode not in {"U", "V"}:\n            raise CADSidecarContractError("FACE_ROTATE request axis_mode must be U or V")\n        axis_origin = _vector(operation.get("axis_origin_local_mm"), 3, "operation.axis_origin_local_mm")\n        axis_direction = _unit3(operation.get("axis_direction_local"), "operation.axis_direction_local")\n        normalized_operation = {\n            "kind": operation_kind,\n            "angle_deg": angle_deg,\n            "axis_mode": axis_mode,\n            "axis_origin_local_mm": axis_origin,\n            "axis_direction_local": axis_direction,\n        }\n'''
          replace_once(sidecar,
              '    else:\n        raise CADSidecarContractError(f"unsupported CAD direct-edit request operation: {operation_kind}")\n\n    selector =',
              request_rotate_branch + '    else:\n        raise CADSidecarContractError(f"unsupported CAD direct-edit request operation: {operation_kind}")\n\n    selector =')
          replace_once(sidecar,
              '    if operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normal = _unit3(descriptor["normal_local"], "target.normal_local")\n        if abs(_dot3(normal, normalized_operation["translation_local_mm"])) > 1e-6:\n            raise CADSidecarContractError("FACE_TANGENT_MOVE request translation must remain in target tangent plane")\n',
              '    if operation_kind == DIRECT_EDIT_OPERATION_FACE_TANGENT_MOVE:\n        normal = _unit3(descriptor["normal_local"], "target.normal_local")\n        if abs(_dot3(normal, normalized_operation["translation_local_mm"])) > 1e-6:\n            raise CADSidecarContractError("FACE_TANGENT_MOVE request translation must remain in target tangent plane")\n    elif operation_kind == DIRECT_EDIT_OPERATION_FACE_ROTATE:\n        normal = _unit3(descriptor["normal_local"], "target.normal_local")\n        if abs(_dot3(normal, normalized_operation["axis_direction_local"])) > 1e-6:\n            raise CADSidecarContractError("FACE_ROTATE request axis must remain in target tangent plane")\n        if any(abs(a - b) > 1e-6 for a, b in zip(normalized_operation["axis_origin_local_mm"], descriptor["center_local_mm"])):\n            raise CADSidecarContractError("FACE_ROTATE request axis must pass through target face center")\n')

          # Stage 3 real-Blender validation for native execution + CAD intent routing.
          stage = root / 'tests/validate_stage3_direct.py'
          replace_once(stage,
              'face-normal move, and bounded face-tangent move in a real Blender process. Both\nCAD_NATIVE normal and tangent entrypoints may prepare governed sidecar intents while\n',
              'face-normal move, bounded face-tangent move, and bounded U/V-axis face rotation in a real Blender process.\nCAD_NATIVE normal, tangent, and rotate entrypoints may prepare governed sidecar intents while\n')
          native_rotate_test = '''\n    # BLENDER_NATIVE bounded face rotation around the deterministic U tangent through face center.\n    rotate_face = add_cube("OLE_STAGE3_DIRECT_FACE_ROTATE", location=(0.0, 3500.0, 0.0))\n    rotate_face.oleander.ole_id = "OLE_STAGE3_DIRECT_FACE_ROTATE"\n    select_only(rotate_face)\n    rotate_dims = bpy.ops.oleander.apply_metric_dimensions(x_mm=100.0, y_mm=100.0, z_mm=100.0)\n    assert_true("FINISHED" in rotate_dims, "rotate face fixture dimensions must apply")\n    rotate_dependent = add_cube("OLE_STAGE3_DIRECT_ROTATE_DEPENDENT", location=(500.0, 3500.0, 0.0))\n    rotate_dependent.oleander.ole_id = "OLE_STAGE3_DIRECT_ROTATE_DEPENDENT"\n    rotate_dependent.oleander.dependencies = "OLE_STAGE3_DIRECT_FACE_ROTATE"\n    rotate_dependent.oleander.stale = False\n    select_top_face_for_intent(rotate_face)\n    rotate_result = bpy.ops.oleander.direct_face_rotate(axis_mode="U", angle_deg=5.0)\n    assert_true("FINISHED" in rotate_result, "BLENDER_NATIVE Face Rotate must finish")\n    bpy.ops.object.mode_set(mode="OBJECT")\n    bpy.context.view_layer.update()\n    rotate_actual = mm_dimensions(bpy.context, rotate_face)\n    assert_true(abs(rotate_actual[0] - 100.0) <= 1e-3, f"U-axis rotate must preserve X extent; got {rotate_actual!r}")\n    assert_true(100.0 < rotate_actual[2] < 105.0, f"5 degree top-face rotate must increase Z bbox within bounded fixture; got {rotate_actual!r}")\n    assert_true(rotate_dependent.oleander.stale and rotate_dependent.get("oleander_stale_reason") == "DIRECT_FACE_ROTATE", "face rotate must propagate specific stale reason")\n    assert_true(rotate_face.get("oleander_last_direct_operation") == "FACE_ROTATE", "face rotate provenance must record operation")\n    assert_true(rotate_face.get("oleander_direct_face_rotate_axis_mode") == "U", "face rotate must retain U axis mode")\n    assert_true(abs(float(rotate_face.get("oleander_direct_face_rotate_angle_deg")) - 5.0) <= 1e-9, "face rotate must retain requested angle")\n    rotate_axis = list(rotate_face["oleander_direct_face_rotate_axis_local"])\n    assert_true(len(rotate_axis) == 3 and abs(sum(v * v for v in rotate_axis) - 1.0) <= 1e-6, "face rotate axis must be unit length")\n\n'''
          replace_once(stage, '    cad_face = add_cube("OLE_STAGE3_DIRECT_FACE_CAD", location=(0.0, 4000.0, 0.0))\n', native_rotate_test + '    cad_face = add_cube("OLE_STAGE3_DIRECT_FACE_CAD", location=(0.0, 4000.0, 0.0))\n')
          cad_rotate_test = '''\n    # CAD face rotate prepares the same governed intent envelope without mutating display geometry.\n    cad_rotate_before = mesh_vertex_snapshot(cad_face)\n    select_top_face_for_intent(cad_face)\n    cad_rotate = bpy.ops.oleander.direct_face_rotate(axis_mode="U", angle_deg=5.0)\n    assert_true("FINISHED" in cad_rotate, "CAD_NATIVE Face Rotate must prepare an intent")\n    bpy.ops.object.mode_set(mode="OBJECT")\n    bpy.context.view_layer.update()\n    assert_true(mesh_vertex_snapshot(cad_face) == cad_rotate_before, "CAD face-rotate intent must not mutate display geometry")\n    raw_rotate_intent = cad_face["oleander_cad_direct_edit_intent"]\n    rotate_intent = json.loads(raw_rotate_intent)\n    assert_true(rotate_intent["operation"] == "FACE_ROTATE", "CAD face-rotate intent operation must be explicit")\n    assert_true(rotate_intent["parameters"]["axis_mode"] == "U", "CAD face-rotate intent must retain axis mode")\n    assert_true(abs(rotate_intent["parameters"]["angle_deg"] - 5.0) <= 1e-9, "CAD face-rotate intent must retain angle")\n    assert_true(rotate_intent["parameters"]["axis_origin_local_mm"] == rotate_intent["target"]["center_local_mm"], "CAD face-rotate first contract axis must pass through semantic face center")\n    rotate_normal = rotate_intent["target"]["normal_local"]\n    rotate_axis = rotate_intent["parameters"]["axis_direction_local"]\n    assert_true(abs(sum(float(a) * float(b) for a, b in zip(rotate_normal, rotate_axis))) <= 1e-6, "CAD face-rotate axis must be tangent to semantic face")\n    assert_true(cad_face["oleander_cad_direct_edit_intent_sha256"] == hashlib.sha256(raw_rotate_intent.encode("utf-8")).hexdigest(), "CAD face-rotate intent must carry deterministic SHA identity")\n\n'''
          replace_once(stage, '\n    audit = audit_scene(scene)\n', cad_rotate_test + '    audit = audit_scene(scene)\n')
          replace_once(stage, '        "version": "0.2.1",', '        "version": "0.3.0",')
          replace_once(stage,
              '            "face_tangent_move_downstream_stale_propagation",\n            "cad_native_direct_edit_intent_routing",',
              '            "face_tangent_move_downstream_stale_propagation",\n            "face_rotate_operator",\n            "blender_native_face_rotate_bounded_angle",\n            "face_rotate_geometry_based_axis",\n            "face_rotate_downstream_stale_propagation",\n            "cad_native_direct_edit_intent_routing",')
          replace_once(stage,
              '            "cad_native_tangent_uv_translation_normalization",\n            "cad_intent_semantic_selector_no_persistent_face_index",',
              '            "cad_native_tangent_uv_translation_normalization",\n            "cad_native_face_rotate_intent_routing",\n            "cad_native_face_rotate_no_display_mutation",\n            "cad_native_face_rotate_center_tangent_axis",\n            "cad_intent_semantic_selector_no_persistent_face_index",')
          replace_once(stage,
              '            "cad_tangent_direct_edit_execution",\n            "general_brep_push_pull",',
              '            "cad_face_rotate_direct_edit_execution",\n            "general_arbitrary_axis_face_rotate",\n            "general_brep_push_pull",')

          for path in (direct, panel, sidecar, stage):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

          python3 -m py_compile \
            oleander-skills/oleander-3d-pipeline/blender_runtime/oleander_blender/direct_model.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/oleander_blender/panel.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/professional_adapter/cad_sidecar.py \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/validate_stage3_direct.py
