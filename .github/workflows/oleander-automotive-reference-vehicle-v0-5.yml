name: OLEANDER Automotive Reference Vehicle v0.5 F1

on:
  push:
    branches: [agent/automotive-reference-vehicle-v0-5]
    paths:
      - 'tools/oleander-automotive/v0.5/**'
      - '.github/workflows/oleander-automotive-reference-vehicle-v0-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automotive-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Resolve verified v0.2 source + v0.4 definitions + v0.5 wrapper
        run: |
          set -euo pipefail
          git fetch --depth=1 origin c1b5b593024c96901f54f9bfd2235a3d37cf7883
          git show FETCH_HEAD:tools/oleander-automotive/v0.2/build_automotive_reference_vehicle.py.gz.b64 | base64 -d | gzip -d > /tmp/build_auto_v02.py
          git fetch --depth=1 origin dbcace4001d6598dbfd52aa04f04237a0d377a15
          git show FETCH_HEAD:tools/oleander-automotive/v0.4/patch_automotive_reference_vehicle.py > /tmp/patch_auto_v04.py
          python3 -m py_compile /tmp/build_auto_v02.py /tmp/patch_auto_v04.py tools/oleander-automotive/v0.5/apply_automotive_v0_5.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version
      - name: Build verified v0.2 working source
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/auto_v02"; mkdir -p "$BASE"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/build_auto_v02.py -- --out "$BASE" --samples 2 --resolution 320
          test -f "$BASE/OLEANDER_Automotive_Reference_Vehicle_v0.2.blend"
      - name: Apply v0.5 surfacing revision and render F1
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/auto_v02/OLEANDER_Automotive_Reference_Vehicle_v0.2.blend"
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Reference_Vehicle_v0.5"; mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background "$BASE" --python-exit-code 5 --python tools/oleander-automotive/v0.5/apply_automotive_v0_5.py -- --v04-source /tmp/patch_auto_v04.py --out "$OUT" --samples 8 --resolution 720
          END=$(date +%s); echo $((END-START)) > "$OUT/RENDER_SECONDS.txt"
          echo 'V0.2 VERIFIED BASE + V0.4 CABIN LOGIC + V0.5 BODY/WHEEL SURFACING FIX' > "$OUT/REVISION_CHAIN.txt"
      - name: Validate v0.5 machine gate
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Reference_Vehicle_v0.5"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Reference_Vehicle_v0.5')
          rec=json.loads((out/'AUTOMOTIVE_RECEIPT.json').read_text()); qa=json.loads((out/'AUTOMOTIVE_QA.json').read_text())
          assert rec['status']=='EXECUTED_QA_PASS', rec
          assert qa['status']=='PASS', qa
          pngs=list((out/'renders').glob('*.png')); assert len(pngs)==8
          assert (out/'OLEANDER_Automotive_Reference_Vehicle_v0.5.blend').exists()
          print('AUTOMOTIVE V0.5 MACHINE GATE PASS')
          PY
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
      - name: Upload automotive v0.5 F1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oleander-automotive-reference-v0-5-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Reference_Vehicle_v0.5/
          if-no-files-found: error
          retention-days: 14
