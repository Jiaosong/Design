name: OLEANDER Automotive v0.11 R28A Diagnostic Isolation

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r28a.py'
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r28a_diag.py'
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/revise_v011_r28a_hpdiag.py'
      - '.github/workflows/oleander-automotive-v0-11-r28a-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r28a-wheelhouse-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Stage R28A HP diagnostic dependencies
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/revise_v011_r28a.py
          test -f /tmp/revise_v011_r28a_diag.py
          test -f /tmp/revise_v011_r28a_hpdiag.py
          python3 -m py_compile /tmp/build_automotive_v011*.py /tmp/revise_v011*.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Run source-locked HP-normalized wheelhouse diagnostic
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/R28A_HPDIAG"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r28a_hpdiag.py -- --out "$OUT" --samples 8 --resolution 640
      - name: HP diagnostic machine gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/R28A_HPDIAG');q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text());w=json.loads((out/'WHEEL_HP_NORMALIZATION.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED',q
          for k in ('source_shape_hash_locked','source_no_boolean','source_no_subd','wheelhouse_count_four','render_matrix','wheel_hp_od_normalized'):assert q['checks'].get(k) is True,(k,q)
          assert w['target_od_m']==.7 and w['wheel_mesh_count']==4
          assert len(q['renders'])==6
          print('R28A HP DIAGNOSTIC MACHINE PASS — SOURCE LOCKED — 0.70 m WHEEL OD — HUMAN VISUAL QA REQUIRED')
          PY
      - name: Upload R28A HP diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-automotive-v0-11-r28a-hpdiag-${{ github.run_id }}
          path: out/R28A_HPDIAG/
          if-no-files-found: error
          retention-days: 14
