name: Timer v3.3 Photography Round 3

on:
  push:
    branches:
      - agent/timer-light-basin-v3.3-photography
    paths:
      - 'website/practice/timer-light-basin-v3/calibration/round3/**'
      - '.github/workflows/timer-v33-photography-round3.yml'
  workflow_dispatch:

jobs:
  round3-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install round3 dependencies
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: npm install --no-audit --no-fund
      - name: Expose render dependencies to parent modules
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: |
          rm -rf ../../node_modules
          ln -s calibration/round3/node_modules ../../node_modules
          test -d ../../node_modules/three
          test -d ../../node_modules/postprocessing
      - name: Install Chromium
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: npx playwright install --with-deps chromium
      - name: Start Vite round3 server
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: |
          npm run dev > vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Capture Round 3 WebGL gates
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: npm run capture
      - name: Print manifest
        working-directory: website/practice/timer-light-basin-v3/calibration/round3
        run: cat artifacts/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timer-v33-photography-round3
          path: |
            website/practice/timer-light-basin-v3/calibration/round3/artifacts/*.png
            website/practice/timer-light-basin-v3/calibration/round3/artifacts/manifest.json
            website/practice/timer-light-basin-v3/calibration/round3/vite.log
          if-no-files-found: warn
          retention-days: 14
