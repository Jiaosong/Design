name: OLEANDER 3D Skill Automotive R29A Replay

on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-automotive-r29a-replay.yml'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automotive-r29a-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Stage frozen R29A benchmark
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/build_automotive_v011_r05.py
          test -f /tmp/revise_v011_r25.py
          test -f /tmp/wheel_hp_contract.py
          test -f /tmp/revise_v011_r29.py
          test -f /tmp/revise_v011_r29a.py
          python3 -m py_compile /tmp/build_automotive_v011*.py /tmp/revise_v011*.py /tmp/wheel_hp_contract.py
          test "$(sha256sum /tmp/build_automotive_v011_r05.py | awk '{print $1}')" = "4e6e6482b9098a7e2aa42eafed7217a7e97d331a45a9a1ceaa78fc98f287a967"
          git rev-parse HEAD > /tmp/R29A_REPLAY_HEAD.txt

      - name: Validate current refined 3D Skill contract
        run: |
          set -euo pipefail
          python3 -m py_compile oleander-skills/oleander-3d-pipeline/tools/validate_receipt.py
          python3 -m unittest \
            00-governance/control-plane/tests/test_oleander_3d_pipeline_skill_contract.py \
            00-governance/control-plane/tests/test_oleander_3d_pipeline_receipt_validator.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema=json.loads(Path('oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_SCHEMAS_v1.json').read_text())
          templates=json.loads(Path('oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_TEMPLATES_v1.json').read_text())['templates']
          assert len(schema['sections']) == 15
          assert len(templates) == 15
          PY

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | head -n 2

      - name: Rebuild original Automotive v0.11 R29A
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_R29A_3D_Skill_Replay"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r29a.py -- --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          cp /tmp/R29A_REPLAY_HEAD.txt "$OUT/R29A_REPLAY_HEAD.txt"
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Re-run original R29A machine gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_R29A_3D_Skill_Replay')
          q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_V011_RECEIPT.json').read_text())
          c=json.loads((out/'MODELING_CONTRACT.json').read_text())
          x=json.loads((out/'R29A_CONTEXT.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED',q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED',r
          assert q['model'].endswith('_R29A'),q['model']
          assert c['contract_version']=='v0.2' and c['spec_patch']=='v0.2.1'
          assert c['modeling_stage']=='M5' and c['job_id']=='SYS-MODELING-WORKER-AUTO-M4M5-v0.11-R29A'
          checks=q['checks']
          for key in ('source_hash_stable_during_diagnostics','source_island_count_one','source_ngon_zero','termination_triangles_four','source_no_boolean','source_no_subd','arch_endpoint_vertex_reuse_24','four_arch_boundaries','rounded_profile_active','render_matrix','wheel_hp_package_exact','r25_shared_endpoint_topology_retained','shoulder_fed_crown_active','monotonic_crown_bridge_targets','bounded_crown_influence'):
              assert checks.get(key) is True,(key,checks)
          assert q['source_island_count']==1 and q['topology']['tri']==4 and q['topology']['ngon']==0
          assert q['endpoint_reuse_count']==24
          assert len(q['wheel_hp_package'])==4
          assert all(t['monotonic_z'] is True for t in x['targets'])
          assert len(q['renders'])==9 and len(list((out/'renders').glob('*.png')))==9
          print('AUTOMOTIVE v0.11 R29A ORIGINAL MACHINE GATE PASS')
          PY

      - name: Emit refined Skill application receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path

          root=Path('.')
          out=root/'out/OLEANDER_Automotive_R29A_3D_Skill_Replay'
          q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text())
          c=json.loads((out/'MODELING_CONTRACT.json').read_text())
          templates=json.loads((root/'oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_TEMPLATES_v1.json').read_text())['templates']
          schema=json.loads((root/'oleander-skills/oleander-3d-pipeline/contracts/BLENDER_3D_RECEIPT_SCHEMAS_v1.json').read_text())
          vpath=root/'oleander-skills/oleander-3d-pipeline/tools/validate_receipt.py'
          spec=importlib.util.spec_from_file_location('validator',vpath)
          validator=importlib.util.module_from_spec(spec); spec.loader.exec_module(validator)
          head=(out/'R29A_REPLAY_HEAD.txt').read_text().strip()
          common={
            'project_id':'SYS-MODELING-WORKER',
            'asset_id':'AUTOMOTIVE_V0.11_R29A_CANONICAL_BENCHMARK',
            'task_id':'3D_SKILL_R29A_REPLAY_2026-08-17',
            'source_revision':'R29A_CANONICAL_REPLAY@'+head[:12],
            'producer':'GITHUB_ACTIONS_AUTOMOTIVE_R29A_REPLAY',
            'does_not_prove':'Machine replay does not prove Design KEEP, Class-A, engineering CAD, manufacturing, homologation or final CMF.'
          }

          receipts={}
          r06=json.loads(json.dumps(templates['06_geometry_topology']))
          r06.update(common)
          r06.update({
            'status':'PASS',
            'source_structure_checks':'PASS',
            'derived_topology_checks':'PASS',
            'normals_check':'PASS',
            'manifoldness_check':'PASS',
            'boundary_drift_check':'PASS',
            'units_check':'PASS',
            'bounds_check':'PASS',
            'uv_material_id_check':'PASS',
            'source_form_quality_not_inferred':True,
            'failure_codes':[]
          })
          validator.validate_receipt('06_geometry_topology',r06,schema); receipts['06_geometry_topology']=r06

          r13=json.loads(json.dumps(templates['13_review_gates']))
          r13.update(common)
          r13.update({
            'status':'PASS',
            'machine_gate':'PASS',
            'machine_evidence_ids':['AUTOMOTIVE_V011_QA.json','AUTOMOTIVE_V011_RECEIPT.json','MODELING_CONTRACT.json','R29A_CONTEXT.json'],
            'evidence_gate':'PASS',
            'evidence_ids':['9_RENDER_MATRIX','PRIMARY_SHA256SUMS.txt','RENDER_SHA256SUMS.txt'],
            'design_quality_gate':'HOLD',
            'design_review_system_or_reviewer':'NOT_RUN',
            'design_evidence_ids':[],
            'main_promotion_requested':False,
            'independent_review_present':False,
            'final_promotion_state':'NOT_REQUESTED'
          })
          validator.validate_receipt('13_review_gates',r13,schema); receipts['13_review_gates']=r13

          r15=json.loads(json.dumps(templates['15_completion']))
          r15.update(common)
          r15.update({
            'status':'PASS',
            'requested_deliverables':['R29A_MACHINE_REPLAY','REFINED_SKILL_MACHINE_APPLICATION'],
            'deliverable_statuses':{'R29A_MACHINE_REPLAY':'PASS','REFINED_SKILL_MACHINE_APPLICATION':'PASS'},
            'native_assets':[p.name for p in out.glob('*.blend')],
            'derived_assets':[p.name for p in (out/'renders').glob('*.png')],
            'evidence_receipts':['06_geometry_topology','13_review_gates'],
            'reopen_or_machine_checks':['ORIGINAL_R29A_MACHINE_GATE_PASS','3D_SKILL_VALIDATOR_PASS'],
            'authority_boundaries_intact':True,
            'machine_gate':'PASS',
            'evidence_gate':'PASS',
            'design_quality_gate':'HOLD',
            'field_engineering_manufacturing_open_items':['CLASS_A_OPEN','ENGINEERING_CAD_OPEN','MANUFACTURING_OPEN','FINAL_CMF_OPEN'],
            'residual_blockers':['INDEPENDENT_DESIGN_REVIEW_NOT_RUN'],
            'final_status':'PARTIAL'
          })
          validator.validate_receipt('15_completion',r15,schema); receipts['15_completion']=r15

          summary={
            'schema':'oleander.3d-skill.automotive-r29a-replay.v1',
            'benchmark':'OLEANDER Automotive v0.11 R29A | Shoulder-Fed Monotonic Fender Crown',
            'historical_canonical_source_geometry_hash':'d19224d2e33485ed5f6e333c5996133a07fd686cd4333caf28c37a83b7e552fb',
            'replay_head':head,
            'blender':'5.2.0 LTS',
            'samples':8,
            'resolution':640,
            'render_count':len(list((out/'renders').glob('*.png'))),
            'original_machine_gate':'PASS',
            'refined_skill_machine_application':'PASS',
            'design_quality_gate':'HOLD_NOT_RUN',
            'main_keep':False,
            'qa_status':q['status'],
            'modeling_job_id':c['job_id'],
            'wheel_hp_od_m':0.700,
            'receipts':sorted(receipts),
            'does_not_prove':common['does_not_prove']
          }
          (out/'OLEANDER_3D_SKILL_R29A_REPLAY_RECEIPTS.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2)+'\n')
          (out/'OLEANDER_3D_SKILL_R29A_REPLAY_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          for p in (out/'OLEANDER_3D_SKILL_R29A_REPLAY_RECEIPTS.json',out/'OLEANDER_3D_SKILL_R29A_REPLAY_SUMMARY.json'):
            print(p,hashlib.sha256(p.read_bytes()).hexdigest(),p.stat().st_size)
          PY
          sha256sum out/OLEANDER_Automotive_R29A_3D_Skill_Replay/* > out/OLEANDER_Automotive_R29A_3D_Skill_Replay/ROOT_SHA256SUMS.txt || true

      - name: Upload Automotive R29A replay evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-3d-skill-automotive-r29a-${{ github.run_id }}
          path: out/OLEANDER_Automotive_R29A_3D_Skill_Replay/
          if-no-files-found: error
          retention-days: 14
