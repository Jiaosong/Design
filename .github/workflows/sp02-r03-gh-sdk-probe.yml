name: SP02-R03 Grasshopper SDK Metadata Probe

on:
  push:
    branches:
      - practice/2026-08-11-sp02-r03-runtime-closure
    paths:
      - 'practice/2026/2026-08-11_SP02-R03_Runtime-Closure-Handoff/native_definition_sdk_probe/**'
      - '.github/workflows/sp02-r03-gh-sdk-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-grasshopper-sdk:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: practice/2026/2026-08-11_SP02-R03_Runtime-Closure-Handoff/native_definition_sdk_probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore official McNeel Grasshopper NuGet SDK
        run: dotnet restore

      - name: Build metadata probe
        run: dotnet build --configuration Release --no-restore

      - name: Run metadata probe
        run: dotnet run --configuration Release --no-build

      - name: Assert probe output
        run: |
          $p='sdk_probe_output/grasshopper_sdk_metadata.json'
          if (!(Test-Path $p)) { throw 'Missing metadata output' }
          $j=Get-Content $p -Raw | ConvertFrom-Json
          if ($j.Types.Count -lt 1) { throw 'No matching Grasshopper SDK types discovered' }
          Write-Host "types=$($j.Types.Count)"

      - uses: actions/upload-artifact@v4
        with:
          name: sp02-r03-grasshopper-sdk-metadata
          path: practice/2026/2026-08-11_SP02-R03_Runtime-Closure-Handoff/native_definition_sdk_probe/sdk_probe_output/
          retention-days: 30
