name: OLEANDER Blender Professional FreeCAD Custom Tangent Axis Face Rotate

on:
  pull_request:
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-custom-tangent-axis-face-rotate.yml"
  push:
    branches: [main]
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-custom-tangent-axis-face-rotate.yml"

permissions:
  contents: read

jobs:
  custom-tangent-axis-face-rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      OLEANDER_CUSTOM_AXIS_ROTATE_DIR: /tmp/oleander-custom-axis-rotate
      PROBE: oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile custom tangent-axis probe source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "${PROBE}"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path("oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate.py")
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("OLEANDER_CUSTOM_TANGENT_AXIS_ROTATE_SOURCE=PASS")
          PY

      - name: Download and verify FreeCAD 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${FREECAD_APPIMAGE}" "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-custom-axis-rotate-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version

      - name: Execute custom tangent-axis BRep ReShape rotation probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}"
          cat > /tmp/oleander_custom_axis_rotate_runner.py <<PY
          import runpy, traceback
          print("OLEANDER_CUSTOM_AXIS_ROTATE_WRAPPER=START", flush=True)
          try:
              runpy.run_path(r"${GITHUB_WORKSPACE}/${PROBE}", run_name="__main__")
          except BaseException as exc:
              print("OLEANDER_CUSTOM_AXIS_ROTATE_WRAPPER_EXCEPTION=" + repr(exc), flush=True)
              traceback.print_exc(); raise
          print("OLEANDER_CUSTOM_AXIS_ROTATE_WRAPPER=PASS", flush=True)
          PY
          python3 -m py_compile /tmp/oleander_custom_axis_rotate_runner.py
          /tmp/squashfs-root/usr/bin/freecadcmd /tmp/oleander_custom_axis_rotate_runner.py 2>&1 | tee /tmp/oleander-custom-axis-rotate.log
          grep -F 'OLEANDER_CUSTOM_AXIS_ROTATE_WRAPPER=PASS' /tmp/oleander-custom-axis-rotate.log
          grep -F 'OLEANDER_FREECAD_CUSTOM_TANGENT_AXIS_FACE_ROTATE=' /tmp/oleander-custom-axis-rotate.log
          grep -F '"schema": "OLEANDER_FREECAD_CUSTOM_TANGENT_AXIS_FACE_ROTATE_v0.1"' /tmp/oleander-custom-axis-rotate.log
          grep -F '"status": "PASS"' /tmp/oleander-custom-axis-rotate.log
          grep -F '"zero_axis_coefficients": "PASS"' /tmp/oleander-custom-axis-rotate.log
          test -s "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}/oleander_custom_tangent_axis_face_rotate.FCStd"
          test -s "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}/oleander_custom_tangent_axis_face_rotate_R001.step"
          test -s "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}/oleander_custom_tangent_axis_face_rotate_R002.step"
          test -s "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}/oleander_custom_tangent_axis_face_rotate_display.json"
          test -s "${OLEANDER_CUSTOM_AXIS_ROTATE_DIR}/oleander_custom_tangent_axis_face_rotate_manifest.json"

      - name: Download official Blender 5.1.2 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          sha256sum --check blender-selected.sha256
          tar -xf "${BLENDER_ARCHIVE}"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Read custom-axis derivatives in Blender and reopen
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_custom_tangent_axis_face_rotate_blender_readback.py 2>&1 | tee /tmp/oleander-custom-axis-rotate-blender.log
          grep -F 'OLEANDER_CUSTOM_TANGENT_AXIS_FACE_ROTATE_BLENDER_READBACK=' /tmp/oleander-custom-axis-rotate-blender.log
          grep -F '"status": "PASS"' /tmp/oleander-custom-axis-rotate-blender.log
          grep -F '"blender": "DISPLAY_DERIVATIVE_ONLY"' /tmp/oleander-custom-axis-rotate-blender.log

      - name: Record bounded custom tangent-axis evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Bounded Custom Tangent-Axis Face Rotate'
            echo '- FreeCAD 1.1.3 / OCCT 7.8.1 remains authoritative; Blender 5.1.2 is display-only.'
            echo '- Full-3D semantic local +X planar face is selected after yaw+pitch transform.'
            echo '- Rotation axis is selected-face-center normalize(4*localY + 3*localZ), not a cardinal local/world axis.'
            echo '- R001 rotates +3 deg; R002 rotates -3 deg while world axis changes and semantic coefficient definition remains stable.'
            echo '- Target + four adjacent faces are rebuilt through BRepTools_ReShape; opposite face center/area is preserved.'
            echo '- Zero angle, >10 deg, axis with normal component, and zero custom-axis coefficients fail before accepted mutation.'
            echo '- FCStd + R001/R002 STEP persist; Blender reads two DISPLAY_DERIVATIVE_ONLY derivatives and reopens the .blend.'
            echo '- Does NOT prove unrestricted arbitrary-axis/nonplanar rotation, persistent topology naming, or P0-B PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
