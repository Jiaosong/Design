name: Deploy Timer v3.3 Staged Package

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Confirm E3 review, rights/provenance, contact/privacy and release approval are complete"
        required: true
        type: boolean
        default: false
      draft_release_tag:
        description: "Draft release tag holding the audited v3.3 package"
        required: true
        type: string
        default: "timer-v3.3-audited-staging"
      asset_name:
        description: "Exact audited ZIP asset name"
        required: true
        type: string
        default: "OLEANDER_Zhizuo_TimerLightBasin_v3.3_AUDITED_2026-08-10.zip"
      release_note:
        description: "Approval record or release note reference"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  authorization-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require explicit release authorization
        env:
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_AUTHORIZED" != "true" ]]; then
            echo "::error::Public Pages deployment is not authorized. Re-run with release_authorized=true only after E3/release review."
            exit 1
          fi
          echo "release authorization: PASS"

  validate-and-deploy:
    needs: authorization-guard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MANIFEST: website/practice/timer-light-basin-v3/DEPLOYMENT_ARTIFACT_MANIFEST_v3.3.json
      QA_DIR: test-results/timer-v33-staged-pages
      STAGE_DIR: test-results/timer-v33-stage
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record release boundary
        env:
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'release_authorized=%s\n' "$RELEASE_AUTHORIZED"
          printf 'draft_release_tag=%s\n' "$DRAFT_RELEASE_TAG"
          printf 'asset_name=%s\n' "$ASSET_NAME"
          printf 'release_note=%s\n' "$RELEASE_NOTE"

      - name: Resolve authenticated draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_DIR" "$STAGE_DIR"
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$STAGE_DIR/releases.json"

          python3 - "$DRAFT_RELEASE_TAG" "$ASSET_NAME" "$STAGE_DIR/releases.json" "$STAGE_DIR/selection.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          tag, asset_name, releases_path, selection_path, output_path = sys.argv[1:]
          releases = json.loads(pathlib.Path(releases_path).read_text())
          matches = [r for r in releases if r.get('draft') is True and r.get('tag_name') == tag]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one draft release with tag {tag!r}; found {len(matches)}')
          release = matches[0]
          assets = [a for a in release.get('assets', []) if a.get('name') == asset_name]
          if len(assets) != 1:
              raise SystemExit(f'Expected exactly one asset {asset_name!r}; found {len(assets)}')
          asset = assets[0]
          selection = {
              'release_id': release['id'],
              'release_tag': tag,
              'release_draft': release['draft'],
              'asset_id': asset['id'],
              'asset_name': asset['name'],
              'asset_size': asset.get('size'),
              'asset_digest': asset.get('digest'),
              'asset_api_url': asset['url']
          }
          pathlib.Path(selection_path).write_text(json.dumps(selection, indent=2) + '\n')
          with open(output_path, 'a', encoding='utf-8') as handle:
              handle.write(f"asset_api_url={asset['url']}\n")
          print(json.dumps(selection, indent=2))
          PY
        id: release

      - name: Download staged audited package
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_API_URL: ${{ steps.release.outputs.asset_api_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ASSET_API_URL" \
            -o "$STAGE_DIR/$ASSET_NAME"

      - name: Verify authority and extract package
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/timer-v33-stage-package.py \
            --zip "$STAGE_DIR/$ASSET_NAME" \
            --manifest "$MANIFEST" \
            --dest "$STAGE_DIR/site" \
            --result "$QA_DIR/package-verification.json"

      - name: Overlay audited Timer v3.3 package
        shell: bash
        run: |
          set -euo pipefail
          target='website/practice/timer-light-basin-v3'
          cp "$MANIFEST" "$QA_DIR/deployment-artifact-manifest.json"
          cp "$STAGE_DIR/selection.json" "$QA_DIR/staging-selection.json"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$STAGE_DIR/site/." "$target/"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install QA dependencies
        run: npm ci

      - name: Run existing E1 website checks
        run: npm run test:e1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start integrated website server
        shell: bash
        run: |
          set -euo pipefail
          node tests/serve.mjs > "$QA_DIR/server.log" 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/practice/timer-light-basin-v3/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$QA_DIR/server.log"
          exit 1

      - name: Run Timer v3.3 Chromium/WebGL gate
        env:
          TIMER_V33_BASE_URL: http://127.0.0.1:4173/practice/timer-light-basin-v3/index.html
          TIMER_V33_QA_OUT: ${{ env.QA_DIR }}
        run: node tests/timer-v33-integrated.mjs

      - name: Upload pre-deploy QA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-v33-staged-pages-qa
          path: ${{ env.QA_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload authorized website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
