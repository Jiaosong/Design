name: OLEANDER Automotive v0.11 M6 Component Architecture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-component-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Stage R29A M6 dependencies
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/revise_v011_r29a.py
          test -f /tmp/wheel_hp_contract.py
          test -f /tmp/revise_v011_r29a_m6.py
          test -f /tmp/revise_v011_r29a_m6_diagfix.py
          python3 -m py_compile /tmp/build_automotive_v011*.py /tmp/revise_v011*.py /tmp/wheel_hp_contract.py
          git rev-parse HEAD > /tmp/M6_SOURCE_COMMIT.txt

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Build M6 semantic routing architecture with underside diagnostic
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_v0.11_M6"
          mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r29a_m6_diagfix.py -- --out "$OUT" --samples 4 --resolution 512
          cp /tmp/M6_SOURCE_COMMIT.txt "$OUT/M6_SOURCE_COMMIT.txt"
          sha256sum "$OUT"/renders/*.png > "$OUT/M6_RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.json "$OUT"/*.blend > "$OUT/M6_PRIMARY_SHA256SUMS.txt"

      - name: M6 replay gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_v0.11_M6')
          q=json.loads((out/'M6_COMPONENT_QA.json').read_text())
          assert q['status']=='MACHINE_PASS_HUMAN_M6_REVIEW_REQUIRED',q
          assert q['source_hash_before']==q['source_hash_after']=='d19224d2e33485ed5f6e333c5996133a07fd686cd4333caf28c37a83b7e552fb'
          assert q['checks']['underbody_diagnostic_present'] is True
          assert len(q['renders'])==4
          print('M6 PASSED EVIDENCE REPLAY — MANUAL ONLY')
          PY

      - name: Upload M6 component architecture evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-automotive-v0-11-m6-${{ github.run_id }}
          path: out/OLEANDER_Automotive_v0.11_M6/
          if-no-files-found: error
          retention-days: 14
