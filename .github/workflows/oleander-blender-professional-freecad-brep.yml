name: OLEANDER Blender Professional FreeCAD BRep

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "oleander-skills/oleander-3d-pipeline/PROFESSIONAL_PARITY_*"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_*.py"
      - ".github/workflows/oleander-blender-professional-freecad-brep.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/PROFESSIONAL_PARITY_*"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_*.py"
      - ".github/workflows/oleander-blender-professional-freecad-brep.yml"

permissions:
  contents: read

jobs:
  freecad-occt-brep-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef"
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify FreeCAD 1.1.3 AppImage
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${FREECAD_APPIMAGE}" "${url}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-appimage-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version 2>&1 | tee /tmp/freecad-version.log

      - name: Run authoritative FreeCAD OCCT B-Rep and STEP probe
        shell: bash
        run: |
          set -euo pipefail
          /tmp/squashfs-root/usr/bin/freecadcmd \
            oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_brep.py \
            2>&1 | tee /tmp/oleander-freecad-brep-probe.log
          grep -F 'OLEANDER_FREECAD_BREP_PROBE=' /tmp/oleander-freecad-brep-probe.log
          grep -F '"dependency_state": "RUNTIME_PROBED"' /tmp/oleander-freecad-brep-probe.log
          grep -F '"status": "PASS"' /tmp/oleander-freecad-brep-probe.log
          test -s /tmp/oleander-freecad-probe/oleander_brep_master.FCStd
          test -s /tmp/oleander-freecad-probe/oleander_brep_master.step
          test -s /tmp/oleander-freecad-probe/oleander_brep_master.brep
          test -s /tmp/oleander-freecad-probe/oleander_brep_display_mesh.json
          sha256sum /tmp/oleander-freecad-probe/oleander_brep_master.* | tee /tmp/oleander-freecad-master-hashes.txt

      - name: Download official Blender 5.1.2 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          sha256sum --check blender-selected.sha256
          tar -xf "${BLENDER_ARCHIVE}"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Read FreeCAD display derivative in Blender and reopen
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender \
            --background \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_blender_readback.py \
            2>&1 | tee /tmp/oleander-freecad-blender-readback.log
          grep -F 'OLEANDER_FREECAD_BLENDER_READBACK=' /tmp/oleander-freecad-blender-readback.log
          grep -F '"status": "PASS"' /tmp/oleander-freecad-blender-readback.log
          grep -F '"blender_object": "DISPLAY_DERIVATIVE_ONLY"' /tmp/oleander-freecad-blender-readback.log

      - name: Record bounded B-Rep sidecar evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Professional Dependency Probe — FreeCAD / OCCT B-Rep'
            echo "- FreeCAD: ${FREECAD_VERSION} (official Linux py311 AppImage, SHA256 ${FREECAD_SHA256})"
            echo "- Blender readback: ${BLENDER_VERSION}"
            echo '- Scope: OCCT solid creation, bounded fillet, boolean cut, metric B-Rep measurement, FCStd master, STEP/BREP export+readback, tessellated typed display derivative, Blender metric readback and reopen.'
            echo '- Result state on PASS: RUNTIME_PROBED only.'
            echo '- Does NOT prove P0-A Parametric CAD, P0-B Direct B-Rep parity, feature-tree rebuild, broad fillet robustness, assembly mates, engineering approval, or manufacturing release.'
          } >> "$GITHUB_STEP_SUMMARY"
