name: OLEANDER CAD Tangent Patch Runner

on:
  push:
    branches:
      - feat/oleander-blender-cad-tangent-move-v01-20260910
    paths:
      - ".github/workflows/zz-oleander-cad-tangent-patch-runner.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oleander-blender-cad-tangent-move-v01-20260910
          fetch-depth: 0
      - name: Execute isolated patch payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EXTRACT'
          from pathlib import Path
          src = Path('.github/workflows/zz-oleander-cad-tangent-branch-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm .github/workflows/zz-oleander-cad-tangent-branch-patch.yml"
          start = src.index(start_marker) + len(start_marker)
          end = src.rindex(end_marker)
          lines = src[start:end].splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          payload = payload.replace("b = text.index(end, a)", "b = text.index(end, a + len(start))")
          payload = payload.replace("idx = service_text.index(anchor)", "idx = service_text.index('def metrics(shape)')")
          payload = payload.replace("service_text[:idx] + tangent_helpers.rstrip() + service_text[idx:]", "service_text[:idx] + tangent_helpers.rstrip() + '\\n\\n' + service_text[idx:]")
          Path('/tmp/oleander-cad-tangent-patch.py').write_text(payload, encoding='utf-8')
          EXTRACT
          python3 -m py_compile /tmp/oleander-cad-tangent-patch.py
          python3 /tmp/oleander-cad-tangent-patch.py
          rm -f .github/workflows/zz-oleander-cad-tangent-branch-patch.yml
          rm -f .github/workflows/zz-oleander-cad-tangent-patch-runner.yml
          git config user.name "OLEANDER Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(blender): absorb bounded CAD tangent face move"
          git push origin HEAD:feat/oleander-blender-cad-tangent-move-v01-20260910
