name: OLEANDER COCOS4 Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - c04/qingjiang-project-alignment-20260811
    paths:
      - '90-shared/toolchains/cocos4/**'
      - '05-cases/c04-qingjiang-stone-book/game-ui/cocos4-source/**'
      - '.github/workflows/oleander-cocos4-smoke.yml'

jobs:
  cocos4-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 22.17.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.0

      - name: Install COCOS CLI from pinned source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/cocos/cocos-cli.git "$RUNNER_TEMP/cocos-cli"
          git -C "$RUNNER_TEMP/cocos-cli" checkout --detach 6f810d60d89f100b5a5d6f1b0cd3518b67b15e5c
          cd "$RUNNER_TEMP/cocos-cli"
          npm install -g node-gyp
          npm run init
          npm install
          npm run download-tools
          npm run build
          npm link
          cocos --version

      - name: Materialize C04 from authoritative source pack
        shell: bash
        run: |
          set -euxo pipefail
          DEST="$RUNNER_TEMP/c04-cocos4"
          cocos create --project "$DEST" --type 2d
          cp -R 05-cases/c04-qingjiang-stone-book/game-ui/cocos4-source/assets/. "$DEST/assets/"
          cocos import --project "$DEST"
          cocos info --project "$DEST"

      - name: Web-mobile smoke build
        shell: bash
        run: |
          set -euxo pipefail
          cocos build --project "$RUNNER_TEMP/c04-cocos4" --platform web-mobile --debug
