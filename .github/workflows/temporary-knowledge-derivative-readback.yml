name: Temporary Knowledge Derivative Readback

on:
  push:
    branches:
      - agent/knowledge-weakness-closure-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-derivative-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify CMF derivative revisions
        env:
          OLEANDER_API_TOKEN: ${{ secrets.OLEANDER_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: https://oleander-notion-canonical-knowledge.oleander-design-runtime.workers.dev
        shell: bash
        working-directory: 90-shared/oleander-core-framework/runtime/notion_canonical_knowledge
        run: |
          set -euo pipefail

          if [[ -n "${OLEANDER_API_TOKEN:-}" ]]; then
            echo "readback_path=protected_worker"
            python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          worker = os.environ["WORKER_URL"].rstrip("/")
          token = os.environ["OLEANDER_API_TOKEN"]
          expected = [
              ("3cbb86be-5c47-8117-aac9-dc10313e1f37", "KN-THEORY-CMF-IMD-001"),
              ("3cbb86be-5c47-819c-90cd-c6494f85ea30", "KN-THEORY-CMF-PVD-001"),
              ("3cbb86be-5c47-81ac-bdd5-cbbf43f4d4a7", "KN-THEORY-CMF-ELECTROPLATING-001"),
              ("3cbb86be-5c47-819b-bc61-cb329c12f7b7", "KN-THEORY-CMF-ANODIZING-001"),
              ("3cbb86be-5c47-8175-a36c-d1f31622a190", "KN-THEORY-CMF-COATING-001"),
          ]
          def norm(value):
              return str(value or "").replace("-", "").lower()
          failures = []
          for page_id, canonical_id in expected:
              req = urllib.request.Request(
                  f"{worker}/v1/reader-page/{page_id}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status = response.status
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  print(f"{canonical_id}: FAIL http_status={error.code}")
                  failures.append(canonical_id)
                  continue
              except Exception as error:
                  print(f"{canonical_id}: FAIL transport={type(error).__name__}")
                  failures.append(canonical_id)
                  continue
              source = ((payload.get("frameworkReadback") or {}).get("source") or {})
              checks = {
                  "http_200": status == 200,
                  "page_id": norm(payload.get("id")) == norm(page_id),
                  "canonical_id": payload.get("canonicalId") == canonical_id,
                  "revision_matches": source.get("revisionMatches") is True,
                  "readback_coherent": source.get("readbackRevisionCoherent") is True,
              }
              failed = [name for name, passed in checks.items() if not passed]
              if failed:
                  print(f"{canonical_id}: FAIL checks={','.join(failed)} source_state={source.get('state')}")
                  failures.append(canonical_id)
              else:
                  print(f"{canonical_id}: PASS derivative_revision_matches_live source_state={source.get('state')}")
          if failures:
              print(f"RESULT: FAIL count={len(failures)}")
              sys.exit(1)
          print(f"RESULT: PASS count={len(expected)}")
          PY
            exit 0
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "FAIL: neither Worker bearer nor Cloudflare API credential is available to Actions"
            exit 2
          fi

          echo "readback_path=wrangler_remote_d1"
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          SQL="SELECT page_id, canonical_id, notion_last_edited_time, indexed_at, index_state, markdown_truncated, index_revision, active FROM documents WHERE page_id IN ('3cbb86be-5c47-8117-aac9-dc10313e1f37','3cbb86be-5c47-819c-90cd-c6494f85ea30','3cbb86be-5c47-81ac-bdd5-cbbf43f4d4a7','3cbb86be-5c47-819b-bc61-cb329c12f7b7','3cbb86be-5c47-8175-a36c-d1f31622a190') ORDER BY canonical_id"
          npx wrangler d1 execute oleander-knowledge-manifest --remote --command "$SQL" --json > /tmp/cmf-d1.json
          python - <<'PY'
          import json, sys
          expected = {
              "3cbb86be5c478117aac9dc10313e1f37": ("KN-THEORY-CMF-IMD-001", "2026-09-13T02:45:09.902Z"),
              "3cbb86be5c47819c90cdc6494f85ea30": ("KN-THEORY-CMF-PVD-001", "2026-09-13T02:55:11.426Z"),
              "3cbb86be5c4781acbdd5cbbf43f4d4a7": ("KN-THEORY-CMF-ELECTROPLATING-001", "2026-09-13T02:55:58.607Z"),
              "3cbb86be5c47819bbc61cb329c12f7b7": ("KN-THEORY-CMF-ANODIZING-001", "2026-09-13T02:56:43.643Z"),
              "3cbb86be5c478175a36cd1f31622a190": ("KN-THEORY-CMF-COATING-001", "2026-09-13T03:09:59.767Z"),
          }
          raw = json.load(open('/tmp/cmf-d1.json', encoding='utf-8'))
          blocks = raw if isinstance(raw, list) else [raw]
          rows = []
          for block in blocks:
              if isinstance(block, dict):
                  rows.extend(block.get('results') or [])
          by_id = {str(r.get('page_id','')).replace('-','').lower(): r for r in rows}
          failures = []
          for pid, (cid, notion_rev) in expected.items():
              row = by_id.get(pid)
              if not row:
                  print(f"{cid}: FAIL missing_d1_row")
                  failures.append(cid)
                  continue
              checks = {
                  'canonical_id': row.get('canonical_id') == cid,
                  'notion_revision': row.get('notion_last_edited_time') == notion_rev,
                  'indexed': row.get('index_state') == 'INDEXED',
                  'not_truncated': int(row.get('markdown_truncated') or 0) == 0,
                  'active': int(row.get('active') or 0) == 1,
                  'index_revision': bool(row.get('index_revision')),
                  'indexed_at': bool(row.get('indexed_at')),
              }
              failed = [k for k,v in checks.items() if not v]
              if failed:
                  print(f"{cid}: FAIL checks={','.join(failed)}")
                  failures.append(cid)
              else:
                  print(f"{cid}: PASS d1_revision_matches_live_notion index_state=INDEXED")
          if failures:
              print(f"RESULT: FAIL count={len(failures)}")
              sys.exit(1)
          print(f"RESULT: PASS count={len(expected)}")
          PY
