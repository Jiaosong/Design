name: OLEANDER Project Anti-Pollution Gate

on:
  pull_request:
    paths:
      - "00-governance/**"
      - "01-business/**"
      - "02-culture/**"
      - "03-ip/**"
      - "04-spatial/**"
      - "05-cases/**"
      - "06-practice/**"
      - "90-shared/**"
      - "oleander-skills/**"
      - "evals/**"
      - ".github/workflows/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "00-governance/**"
      - "01-business/**"
      - "02-culture/**"
      - "03-ip/**"
      - "04-spatial/**"
      - "05-cases/**"
      - "06-practice/**"
      - "90-shared/**"
      - "oleander-skills/**"
      - "evals/**"
      - ".github/workflows/**"
      - "README.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  anti-pollution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate project-wide anti-pollution contract
        run: |
          set -euo pipefail
          python3 -m py_compile 00-governance/tests/static_check_anti_pollution.py
          python3 00-governance/tests/static_check_anti_pollution.py
      - name: Record enforcement boundary
        if: always()
        run: |
          {
            echo '## OLEANDER Project Anti-Pollution Gate'
            echo '- Applies to governance, knowledge/application roots, cases, practice, shared assets, skills, evals and workflows.'
            echo '- Checks the full PR delta against its base instead of only the latest commit.'
            echo '- Existing pre-2026-09-05 candidate/training debt remains repairable, but new non-project training/candidate PRs are throttled while the open backlog exceeds the configured soft limit.'
            echo '- Project-mode production remains exempt from the training-debt throttle.'
            echo '- One logical object / one Current authority is mandatory.'
            echo '- Candidate or unverified evidence cannot self-promote into Current knowledge/capability status.'
            echo '- Cleanup follows NO COMPRESSION / NO LOSS.'
          } >> "$GITHUB_STEP_SUMMARY"
