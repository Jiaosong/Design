name: OLEANDER 3D Porsche V68 Boundary Refinement
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-porsche-v68-boundary-refinement.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v68.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  v68-boundary-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Compile V68
        run: python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v68.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee BLENDER_RUNTIME.txt
      - name: Execute V68 Derived-only refinement
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V68_BOUNDARY_REFINEMENT"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v68.py \
            -- --out "$OUT" --samples 4 --resolution-x 640 --resolution-y 426
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          test -f "$OUT/V68_DERIVED_BOUNDARY_REFINEMENT_RECEIPT.json"
      - name: Classify V68 without forcing a positive result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/V68_BOUNDARY_REFINEMENT/V68_DERIVED_BOUNDARY_REFINEMENT_RECEIPT.json').read_text())
          assert d['source_mutated'] is False
          assert d['source_revision_locked']=='V59_SPARSE_FRONT_HOOD_FENDER_RELATION'
          assert max(d['dimension_abs_error_m']) <= 1e-6
          assert d['adjacent_normal_fold_count']==0
          assert d['boundary_refinement_result'] in ('PASS_DERIVED_BOUNDARY_REFINEMENT','FAIL_DERIVED_BOUNDARY_REFINEMENT')
          assert d['boundary_straddle_after'] <= d['boundary_straddle_before']
          print(json.dumps(d,indent=2))
          PY
      - name: Upload V68 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-v68-boundary-refinement-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            out/V68_BOUNDARY_REFINEMENT/
          if-no-files-found: error
          retention-days: 14
