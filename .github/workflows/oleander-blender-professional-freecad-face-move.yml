name: OLEANDER Blender Professional FreeCAD Face Move

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_normal_move.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_move_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-face-move.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_normal_move.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_move_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-face-move.yml"

permissions:
  contents: read

jobs:
  planar-face-normal-move:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      OLEANDER_FACE_MOVE_DIR: /tmp/oleander-face-move
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify FreeCAD 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "/tmp/${FREECAD_APPIMAGE}" \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-face-move-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version

      - name: Move selected planar face by BRep ReShape and validate solid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OLEANDER_FACE_MOVE_DIR}"
          /tmp/squashfs-root/usr/bin/freecadcmd \
            "${GITHUB_WORKSPACE}/oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_normal_move.py" \
            2>&1 | tee /tmp/oleander-face-move.log
          grep -F 'OLEANDER_FREECAD_PLANAR_FACE_NORMAL_MOVE=' /tmp/oleander-face-move.log
          grep -F '"status": "PASS"' /tmp/oleander-face-move.log
          grep -F '"collapse_or_invert_face_move": "PASS"' /tmp/oleander-face-move.log
          grep -F '"kernel_route": "TopoShape.replaceShape / BRepTools_ReShape + bounded sew/fix normalization"' /tmp/oleander-face-move.log
          test -s "${OLEANDER_FACE_MOVE_DIR}/oleander_planar_face_move.FCStd"
          test -s "${OLEANDER_FACE_MOVE_DIR}/oleander_planar_face_move_push_R002.step"
          test -s "${OLEANDER_FACE_MOVE_DIR}/oleander_planar_face_move_pull_R002.step"
          test -s "${OLEANDER_FACE_MOVE_DIR}/oleander_planar_face_move_display.json"
          test -s "${OLEANDER_FACE_MOVE_DIR}/oleander_planar_face_move_manifest.json"

      - name: Download official Blender 5.1.2 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          sha256sum --check blender-selected.sha256
          tar -xf "${BLENDER_ARCHIVE}"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Read face-move derivative in Blender and reopen
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_planar_face_move_blender_readback.py \
            2>&1 | tee /tmp/oleander-face-move-blender.log
          grep -F 'OLEANDER_PLANAR_FACE_MOVE_BLENDER_READBACK=' /tmp/oleander-face-move-blender.log
          grep -F '"status": "PASS"' /tmp/oleander-face-move-blender.log
          grep -F '"master": "FreeCAD/OCCT B-Rep"' /tmp/oleander-face-move-blender.log
          grep -F '"blender": "DISPLAY_DERIVATIVE_ONLY"' /tmp/oleander-face-move-blender.log

      - name: Record bounded planar face-normal evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Planar Face-Normal B-Rep Edit'
            echo '- Authoritative kernel: FreeCAD 1.1.3 / OCCT.'
            echo '- Selector: unique +Z top planar face; no FaceN persistence.'
            echo '- Kernel route: TopoShape.replaceShape / BRepTools_ReShape replaces the selected face and its four adjacent faces, followed by bounded sew/fix normalization.'
            echo '- Positive move: +5 mm; negative move: -3 mm; opposite face remains fixed.'
            echo '- Authoritative width rebuild 80 mm -> 100 mm re-resolves the selected face before edit.'
            echo '- Collapse/invert move is rejected before subshape replacement.'
            echo '- Blender receives only the +5 mm R002 tessellated DISPLAY_DERIVATIVE_ONLY result with FCStd/STEP provenance.'
            echo '- Does NOT prove arbitrary/non-planar face movement, general push/pull, persistent topological naming, face rotate, split/trim, broad healing or P0-B PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
