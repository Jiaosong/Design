name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_*.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Validate V56 densification causal A/B
        run: |
          set -euo pipefail
          python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v56.py
          python3 -m unittest discover -s 00-governance/control-plane/tests -p 'test_oleander_3d_*.py'
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'; EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build V56 V49-source densification-only experiment
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Porsche_911_992_Reference_Repro"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v56.py -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
      - name: Verify V56 causal result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/OLEANDER_Porsche_911_992_Reference_Repro/DENSIFICATION_CAUSAL_AB.json')
          d=json.loads(p.read_text())
          assert d['candidate_revision']=='V56_V49_DENSIFICATION_ONLY_AB'
          assert d['source_geometry_equivalence']=='V49_SOURCE_RELATIONS_UNCHANGED'
          assert d['only_delta']=='ONE_DERIVED_MIDPOINT_PER_ADJACENT_POSITIVE_HALF_SECTION_CONTROL'
          assert d['derived_ring_vertices']==40
          print(json.dumps(d,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-reference-repro-${{ github.run_id }}
          path: out/OLEANDER_Porsche_911_992_Reference_Repro/
          if-no-files-found: error
          retention-days: 14
