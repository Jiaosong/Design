name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_*.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Validate V57 density audit
        run: |
          set -euo pipefail
          python3 -m py_compile 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v57.py
          python3 -m unittest discover -s 00-governance/control-plane/tests -p 'test_oleander_3d_*.py'
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'; EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build unchanged V49 geometry and audit evaluated density
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Porsche_911_992_Reference_Repro"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v57.py -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
      - name: Verify Source and evaluated density remain separate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/OLEANDER_Porsche_911_992_Reference_Repro/SOURCE_VS_EVALUATED_DENSITY_AUDIT.json').read_text())
          assert d['candidate_geometry_revision']=='V49_FEATURE_ALIGNED_CURVE_NETWORK'
          assert d['geometry_revision_unchanged']=='V49_FEATURE_ALIGNED_CURVE_NETWORK'
          assert d['source_ring_control_count']==20
          assert d['legacy_surface_gate']['state']=='LEGACY_GATE_MIXES_SOURCE_CONTROL_DENSITY_WITH_EVALUATED_DENSITY'
          assert d['final_evaluated_diagnostic_mesh']['triangles']>1000
          print(json.dumps(d,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-reference-repro-${{ github.run_id }}
          path: out/OLEANDER_Porsche_911_992_Reference_Repro/
          if-no-files-found: error
          retention-days: 14
