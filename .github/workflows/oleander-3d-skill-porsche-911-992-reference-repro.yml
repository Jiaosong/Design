name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_reference_fidelity.py'
      - '00-governance/control-plane/tests/test_oleander_3d_reference_image_calibration.py'
      - '00-governance/control-plane/tests/test_oleander_3d_rendered_projection_fidelity.py'
      - '00-governance/control-plane/tests/test_oleander_3d_regression_baseline_protocol.py'
      - '00-governance/control-plane/tests/test_oleander_3d_regression_promotion_validator.py'
      - '00-governance/control-plane/tests/test_oleander_3d_primary_body_surface.py'
      - '00-governance/control-plane/tests/test_oleander_3d_candidate_revision_coherence.py'
      - '00-governance/control-plane/tests/test_oleander_3d_primary_form_identity.py'
      - '00-governance/control-plane/tests/test_oleander_3d_surface_fold_diagnostic.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Validate Skill and V41 runtime
        run: |
          set -euo pipefail
          python3 -m py_compile \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v41.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/emit_primary_form_identity_receipt.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_rendered_projection_fidelity.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_regression_promotion.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_candidate_revision_coherence.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_form_identity.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_surface_fold_diagnostic.py
          python3 -m unittest \
            00-governance/control-plane/tests/test_oleander_3d_pipeline_skill_contract.py \
            00-governance/control-plane/tests/test_oleander_3d_pipeline_receipt_validator.py \
            00-governance/control-plane/tests/test_oleander_3d_reference_fidelity.py \
            00-governance/control-plane/tests/test_oleander_3d_reference_image_calibration.py \
            00-governance/control-plane/tests/test_oleander_3d_rendered_projection_fidelity.py \
            00-governance/control-plane/tests/test_oleander_3d_regression_baseline_protocol.py \
            00-governance/control-plane/tests/test_oleander_3d_regression_promotion_validator.py \
            00-governance/control-plane/tests/test_oleander_3d_primary_body_surface.py \
            00-governance/control-plane/tests/test_oleander_3d_candidate_revision_coherence.py \
            00-governance/control-plane/tests/test_oleander_3d_primary_form_identity.py \
            00-governance/control-plane/tests/test_oleander_3d_surface_fold_diagnostic.py
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'; EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build V41 true-aperture front-identity candidate
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Porsche_911_992_Reference_Repro"; mkdir -p "$OUT"; START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v41.py -- --out "$OUT" --samples 16 --resolution-x 1152 --resolution-y 768
          python3 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/emit_primary_form_identity_receipt.py "$OUT"
          END=$(date +%s); echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"; git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
      - name: Verify V41 evidence without self-promotion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Porsche_911_992_Reference_Repro')
          q=json.loads((out/'REFERENCE_REPRO_QA.json').read_text());r=json.loads((out/'REFERENCE_REPRO_RECEIPT.json').read_text());p=json.loads((out/'REFERENCE_PROJECTION_RECEIPT.json').read_text());g=json.loads((out/'REFERENCE_REGRESSION_PROMOTION_RECEIPT.json').read_text());s=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT.json').read_text());i=json.loads((out/'PRIMARY_FORM_IDENTITY_RECEIPT.json').read_text());f=json.loads((out/'SURFACE_FOLD_DIAGNOSTIC.json').read_text())
          assert q['status']=='MACHINE_PASS_REFERENCE_REVIEW_REQUIRED'
          assert q['verification_run']=='PASS'
          assert q['primary_form_stage']=='TRUE_APERTURE_STABLE_TERMINAL'
          assert p['candidate_revision']=='V41_TRUE_APERTURE_STABLE_TERMINAL'
          assert p['status'] in ('PROJECTION_MACHINE_SCREENING_PASS','PROJECTION_MACHINE_SCREENING_FAIL')
          assert s['machine_surface_state'] in ('MACHINE_CONSTRUCTED_VISUAL_HOLD','MACHINE_SURFACE_TOPOLOGY_FAIL')
          assert int(f['fold_count'])==int(s['body_adjacent_face_normal_flip_count'])
          assert g['promotion_decision'] in ('KEEP_LKG_HOLD_EXPERIMENT','KEEP_LKG_REJECT_EXPERIMENT')
          assert i['machine_identity_state'] in ('MACHINE_SCREENED_VISUAL_HOLD','MACHINE_REJECT')
          assert q['design_quality_gate']=='HOLD_FOR_INDEPENDENT_REFERENCE_COMPARISON'
          assert r['visual_reference_fidelity']=='HOLD_INDEPENDENT_REVIEW'
          print(json.dumps({'execution':'PASS','projection':p['status'],'regression':g['promotion_decision'],'surface':s['machine_surface_state'],'folds':f['fold_count'],'identity':i['machine_identity_state']},indent=2))
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_rendered_projection_fidelity.py out/OLEANDER_Porsche_911_992_Reference_Repro/REFERENCE_PROJECTION_RECEIPT.json
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_regression_promotion.py out/OLEANDER_Porsche_911_992_Reference_Repro/REFERENCE_REGRESSION_PROMOTION_RECEIPT.json
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py out/OLEANDER_Porsche_911_992_Reference_Repro/PRIMARY_BODY_SURFACE_RECEIPT.json
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_candidate_revision_coherence.py out/OLEANDER_Porsche_911_992_Reference_Repro
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_form_identity.py out/OLEANDER_Porsche_911_992_Reference_Repro/PRIMARY_FORM_IDENTITY_RECEIPT.json
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_surface_fold_diagnostic.py out/OLEANDER_Porsche_911_992_Reference_Repro/SURFACE_FOLD_DIAGNOSTIC.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-reference-repro-${{ github.run_id }}
          path: out/OLEANDER_Porsche_911_992_Reference_Repro/
          if-no-files-found: error
          retention-days: 14
