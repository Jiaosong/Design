name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_*.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}

      - name: Validate benchmark scripts and 3D contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v58.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v59.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v60.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py
          python3 -m unittest discover -s 00-governance/control-plane/tests -p 'test_oleander_3d_*.py'

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | tee "$GITHUB_WORKSPACE/BLENDER_RUNTIME.txt"
          sha256sum /tmp/blender.tar.xz > "$GITHUB_WORKSPACE/BLENDER_DISTRIBUTION_SHA256.txt"

      - name: Execute V58 no-fold LKG evidence baseline
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V58_BASELINE"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v58.py \
            -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Verify V58 evaluated-surface baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/V58_BASELINE')
          d=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT_V2.json').read_text())
          assert d['schema']=='oleander.3d.primary-body-surface-receipt.v2'
          assert d['geometry_revision_unchanged']=='V49_FEATURE_ALIGNED_CURVE_NETWORK'
          assert d['source_ring_control_count']==20
          assert d['evaluated_adjacent_face_normal_flip_count']==0
          assert d['evaluated_sampling_gate']['status']=='PASS'
          assert d['machine_surface_state']=='MACHINE_CONSTRUCTED_VISUAL_HOLD'
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py out/V58_BASELINE/PRIMARY_BODY_SURFACE_RECEIPT_V2.json

      - name: Execute V59 sparse hood-fender relation experiment
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V59_HOOD_FENDER"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v59.py \
            -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Classify V59 without conflating execution and design gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/V59_HOOD_FENDER')
          surface=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT_V2.json').read_text())
          projection=json.loads((out/'REFERENCE_PROJECTION_RECEIPT.json').read_text())
          regression=json.loads((out/'REFERENCE_REGRESSION_PROMOTION_RECEIPT.json').read_text())
          locks={x['id']:x for x in regression['regression_locks']};sem=projection['front_identity_metrics']
          assert surface['revision']=='V59_SPARSE_FRONT_HOOD_FENDER_RELATION'
          assert surface['source_ring_control_count']==20
          assert surface['evaluated_adjacent_face_normal_flip_count']==0
          assert regression['edit_scope']==['FRONT_HOOD_FENDER_RELATION_ONLY']
          summary={
            'schema':'oleander.3d.porsche-911-v59-benchmark-summary.v1',
            'baseline':'V49_FEATURE_ALIGNED_CURVE_NETWORK',
            'candidate':'V59_SPARSE_FRONT_HOOD_FENDER_RELATION',
            'runtime_execution':'PASS','source_edit_scope':'FRONT_HOOD_FENDER_RELATION_ONLY',
            'source_ring_control_count':surface['source_ring_control_count'],
            'evaluated_triangles':surface['evaluated_triangles'],
            'evaluated_edge_p95_m':surface['evaluated_edge_p95_m'],
            'evaluated_fold_count':surface['evaluated_adjacent_face_normal_flip_count'],
            'surface_preserved':surface['machine_surface_state']=='MACHINE_CONSTRUCTED_VISUAL_HOLD' and surface['evaluated_adjacent_face_normal_flip_count']==0,
            'hood_fender_delta_m':sem.get('mean_fender_crown_minus_hood_m'),
            'hood_fender_relation_state':sem.get('hood_fender_hierarchy_state'),
            'side_regression_lock':locks['SIDE_UPPER']['status'],
            'rear_regression_lock':locks['REAR_BODY_ONLY_DIAGNOSTIC']['status'],
            'machine_promotion_decision':regression['promotion_decision'],
            'held_out_visual_review':'HOLD_REQUIRES_OLEANDER_ARTIFACT_REVIEW',
            'reference_fidelity':'HOLD_REQUIRES_HELD_OUT_3Q_REVIEW',
            'design_quality':'HOLD_REQUIRES_ARTIFACT_REVIEW',
            'does_not_prove':['Reference Fidelity PASS','Design KEEP','Class-A continuity','manufacturer CAD','manufacturing feasibility']}
          (out/'V59_BENCHMARK_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py out/V59_HOOD_FENDER/PRIMARY_BODY_SURFACE_RECEIPT_V2.json

      - name: Execute V60 owned greenhouse aperture architecture
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/V60_APERTURE"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 \
            --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v60.py \
            -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: Verify V60 aperture ownership and preserve V59 body evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/V60_APERTURE')
          aperture=json.loads((out/'APERTURE_INTERFACE_RECEIPT.json').read_text())
          surface=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT_V2.json').read_text())
          qa=json.loads((out/'REFERENCE_REPRO_QA.json').read_text())
          assert aperture['schema']=='oleander.3d.aperture-interface-receipt.v1'
          assert aperture['revision']=='V60_GREENHOUSE_APERTURE_OWNERSHIP'
          assert aperture['primary_body_revision_locked']=='V59_SPARSE_FRONT_HOOD_FENDER_RELATION'
          assert aperture['primary_body_source_delta']=='NONE'
          assert len(aperture['boolean_results'])==4
          assert all(x['applied'] and x['geometry_changed'] for x in aperture['boolean_results'])
          assert not aperture['missing_required_objects']
          assert aperture['boundary_closure_state']=='MACHINE_CONSTRUCTED_VISUAL_REVIEW_REQUIRED'
          assert aperture['backing_occlusion_state']=='SCREENED_GEOMETRY_PRESENT_VISUAL_REVIEW_REQUIRED'
          assert surface['revision']=='V59_SPARSE_FRONT_HOOD_FENDER_RELATION'
          assert surface['source_ring_control_count']==20
          assert surface['evaluated_adjacent_face_normal_flip_count']==0
          assert qa['reference_fidelity_revision']=='V60_GREENHOUSE_APERTURE_OWNERSHIP'
          assert qa['design_quality_gate']=='HOLD_FOR_OLEANDER_ARTIFACT_REVIEW'
          print(json.dumps(aperture,indent=2))
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py out/V60_APERTURE/PRIMARY_BODY_SURFACE_RECEIPT_V2.json

      - name: Hash complete benchmark evidence
        if: always()
        run: |
          set -euo pipefail
          find out -type f -print0 | sort -z | xargs -0 sha256sum > BENCHMARK_SHA256SUMS.txt || true

      - name: Upload V58 V59 V60 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-v58-v59-v60-${{ github.run_id }}
          path: |
            BLENDER_RUNTIME.txt
            BLENDER_DISTRIBUTION_SHA256.txt
            BENCHMARK_SHA256SUMS.txt
            out/V58_BASELINE/
            out/V59_HOOD_FENDER/
            out/V60_APERTURE/
          if-no-files-found: error
          retention-days: 14
