name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_*.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Validate V58 surface receipt v2
        run: |
          set -euo pipefail
          python3 -m py_compile \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v58.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py
          python3 -m unittest discover -s 00-governance/control-plane/tests -p 'test_oleander_3d_*.py'
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'; EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build unchanged V49 geometry and emit v2 surface receipt
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Porsche_911_992_Reference_Repro"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v58.py -- --out "$OUT" --samples 8 --resolution-x 960 --resolution-y 640
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
      - name: Verify evaluated surface gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Porsche_911_992_Reference_Repro')
          d=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT_V2.json').read_text())
          assert d['schema']=='oleander.3d.primary-body-surface-receipt.v2'
          assert d['geometry_revision_unchanged']=='V49_FEATURE_ALIGNED_CURVE_NETWORK'
          assert d['source_ring_control_count']==20
          assert d['source_density_role']=='INFORMATIONAL_CAUSAL_CONTROL_COMPLEXITY_NOT_EVALUATED_QUALITY_GATE'
          assert d['evaluated_triangles']>1000
          assert d['evaluated_adjacent_face_normal_flip_count']==0
          assert d['evaluated_sampling_gate']['basis']!='SOURCE_RING_CONTROL_COUNT'
          assert d['evaluated_sampling_gate']['status']=='PASS'
          assert d['machine_surface_state']=='MACHINE_CONSTRUCTED_VISUAL_HOLD'
          assert d['reference_fidelity_state']=='REJECT'
          assert d['design_quality_state']=='REVISE'
          print(json.dumps(d,indent=2))
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py out/OLEANDER_Porsche_911_992_Reference_Repro/PRIMARY_BODY_SURFACE_RECEIPT_V2.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-reference-repro-${{ github.run_id }}
          path: out/OLEANDER_Porsche_911_992_Reference_Repro/
          if-no-files-found: error
          retention-days: 14
