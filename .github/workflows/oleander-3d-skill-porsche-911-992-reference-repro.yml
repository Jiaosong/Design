name: OLEANDER 3D Skill Porsche 911 992 Reference Reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/oleander-3d-skill-porsche-911-992-reference-repro.yml'
      - '06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/**'
      - 'oleander-skills/oleander-3d-pipeline/**'
      - '00-governance/control-plane/tests/test_oleander_3d_*.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  porsche-911-992-reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 1}
      - name: Validate Skill and V53 fold diagnostic
        run: |
          set -euo pipefail
          python3 -m py_compile \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v51.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v52.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v53.py \
            06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/emit_primary_form_identity_receipt.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_rendered_projection_fidelity.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_regression_promotion.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_body_surface.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_candidate_revision_coherence.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_primary_form_identity.py \
            oleander-skills/oleander-3d-pipeline/tools/validate_surface_fold_diagnostic.py
          python3 -m unittest discover -s 00-governance/control-plane/tests -p 'test_oleander_3d_*.py'
      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'; EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build unchanged V51 geometry with V52/V53 evidence
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Porsche_911_992_Reference_Repro"; mkdir -p "$OUT"; START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/run_reference_repro_v53.py -- --out "$OUT" --samples 16 --resolution-x 1152 --resolution-y 768
          python3 06-practice/2026/SYS-MODELING-WORKER/2026-08-17-porsche-911-992-reference-repro/emit_primary_form_identity_receipt.py "$OUT"
          END=$(date +%s); echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"; git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          test ! -e "$OUT/FINAL_DERIVED_SURFACE_RECEIPT.json"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
      - name: Verify V53 localized fold evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Porsche_911_992_Reference_Repro')
          p=json.loads((out/'REFERENCE_PROJECTION_RECEIPT.json').read_text())
          s=json.loads((out/'PRIMARY_BODY_SURFACE_RECEIPT.json').read_text())
          i=json.loads((out/'PRIMARY_FORM_IDENTITY_RECEIPT.json').read_text())
          fd=json.loads((out/'SURFACE_FOLD_DIAGNOSTIC.json').read_text())
          assert p['candidate_revision']=='V51_FRONT_TRANSVERSE_IDENTITY_REPAIR'
          assert p['evidence_revision']=='V52_SEMANTIC_FRONT_IDENTITY_EVIDENCE'
          assert fd['candidate_revision']=='V51_FRONT_TRANSVERSE_IDENTITY_REPAIR'
          assert fd['evidence_revision']=='V53_SURFACE_FOLD_LOCALIZATION'
          assert fd['geometry_revision_unchanged']=='V51_FRONT_TRANSVERSE_IDENTITY_REPAIR'
          assert fd['fold_count']==s['body_adjacent_face_normal_flip_count']
          assert fd['fold_count']>0
          assert fd['cluster_count']>0
          assert fd['authority']=='DIAGNOSTIC_NOT_REFERENCE_AUTHORITY'
          assert i['machine_identity_state']=='MACHINE_REJECT'
          print(json.dumps({'projection':p['status'],'surface':s['machine_surface_state'],'fold_count':fd['fold_count'],'front':fd['front_fold_count'],'mid':fd['mid_fold_count'],'rear':fd['rear_fold_count'],'top_clusters':fd['clusters'][:12]},indent=2))
          PY
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_surface_fold_diagnostic.py out/OLEANDER_Porsche_911_992_Reference_Repro/SURFACE_FOLD_DIAGNOSTIC.json
          python3 oleander-skills/oleander-3d-pipeline/tools/validate_primary_form_identity.py out/OLEANDER_Porsche_911_992_Reference_Repro/PRIMARY_FORM_IDENTITY_RECEIPT.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: oleander-porsche-911-992-reference-repro-${{ github.run_id }}
          path: out/OLEANDER_Porsche_911_992_Reference_Repro/
          if-no-files-found: error
          retention-days: 14
