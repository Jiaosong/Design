name: OLEANDER Professional Design Toolchain Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '00-governance/runtime/OLEANDER_PRO_DESIGN_TOOLCHAIN_RUNTIME_v0.1.json'
      - '90-shared/toolchains/pro-design/**'
      - '.github/workflows/oleander-pro-design-toolchain.yml'
  push:
    branches:
      - main
      - 'agent/2026-08-27-pro-design-toolchain-runtime'
    paths:
      - '00-governance/runtime/OLEANDER_PRO_DESIGN_TOOLCHAIN_RUNTIME_v0.1.json'
      - '90-shared/toolchains/pro-design/**'
      - '.github/workflows/oleander-pro-design-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openbim-cad-dxf-raster-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLEANDER_PRO_RUNTIME_HOME: ${{ runner.temp }}/oleander-pro-design
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate runtime contract and shell syntax
        run: |
          set -euo pipefail
          python3 -m json.tool 00-governance/runtime/OLEANDER_PRO_DESIGN_TOOLCHAIN_RUNTIME_v0.1.json >/dev/null
          for f in 90-shared/toolchains/pro-design/*.sh; do bash -n "$f"; done
      - name: Materialize pinned OpenBIM CAD DXF Python runtime
        run: |
          set -euo pipefail
          bash 90-shared/toolchains/pro-design/materialize.sh
          bash 90-shared/toolchains/pro-design/probe.sh
      - name: IFC create write reopen smoke
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oleander-pro-smoke"
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.ifc" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os
          import ifcopenshell
          import ifcopenshell.guid
          out = os.environ['OUT']
          model = ifcopenshell.file(schema='IFC4')
          model.create_entity('IfcProject', GlobalId=ifcopenshell.guid.new(), Name='OLEANDER_PRO_SMOKE')
          model.write(out)
          reopened = ifcopenshell.open(out)
          projects = reopened.by_type('IfcProject')
          assert len(projects) == 1 and projects[0].Name == 'OLEANDER_PRO_SMOKE'
          print('IFC_CREATE_WRITE_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.ifc"
      - name: STEP solid export reopen smoke
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.step" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os
          import cadquery as cq
          out = os.environ['OUT']
          solid = cq.Workplane('XY').box(20, 10, 5)
          cq.exporters.export(solid, out)
          reopened = cq.importers.importStep(out)
          bb = reopened.val().BoundingBox()
          assert abs(bb.xlen - 20) < 1e-6
          assert abs(bb.ylen - 10) < 1e-6
          assert abs(bb.zlen - 5) < 1e-6
          print('STEP_EXPORT_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.step"
      - name: DXF create reopen smoke
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/oleander-pro-smoke/smoke.dxf" bash 90-shared/toolchains/pro-design/python.sh - <<'PY'
          import os
          import ezdxf
          out = os.environ['OUT']
          doc = ezdxf.new('R2018')
          msp = doc.modelspace()
          msp.add_line((0, 0), (100, 0))
          msp.add_circle((50, 25), radius=10)
          doc.saveas(out)
          reopened = ezdxf.readfile(out)
          assert len(reopened.modelspace()) >= 2
          print('DXF_CREATE_REOPEN=PASS')
          PY
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/smoke.dxf"
      - name: ImageMagick deterministic raster smoke
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/oleander-pro-smoke/smoke.png"
          bash 90-shared/toolchains/pro-design/raster.sh -size 64x64 gradient: -colorspace sRGB "$out"
          test -s "$out"
          dims="$(bash 90-shared/toolchains/pro-design/raster.sh "$out" -format '%wx%h' info:)"
          test "$dims" = "64x64"
          echo 'RASTER_READ_WRITE=PASS'
      - name: FFmpeg deterministic motion smoke
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/oleander-pro-smoke/smoke.mkv"
          bash 90-shared/toolchains/pro-design/motion.sh -hide_banner -loglevel error -f lavfi -i testsrc=size=64x64:rate=5 -t 1 -c:v ffv1 -y "$out"
          test -s "$out"
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 "$out" | grep -q '64,64'
          echo 'MOTION_GENERATE_PROBE=PASS'

  freecad-headless-cad-cam-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLEANDER_PRO_RUNTIME_HOME: ${{ runner.temp }}/oleander-pro-design
      OLEANDER_PRO_MATERIALIZE_FREECAD: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Materialize verified FreeCAD 1.1.3 AppImage
        run: |
          set -euo pipefail
          bash 90-shared/toolchains/pro-design/materialize.sh
      - name: FreeCAD version probe
        run: |
          set -euo pipefail
          bash 90-shared/toolchains/pro-design/freecad.sh --version
      - name: FreeCAD headless parametric STEP export and CAM module smoke
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oleander-pro-smoke"
          cat > "${RUNNER_TEMP}/oleander-pro-smoke/freecad_smoke.py" <<'PY'
          import os
          import FreeCAD as App
          import Part
          doc = App.newDocument('OLEANDER_PRO_SMOKE')
          obj = doc.addObject('Part::Feature', 'Box')
          obj.Shape = Part.makeBox(20, 10, 5)
          doc.recompute()
          fcstd = os.path.join(os.environ['RUNNER_TEMP'], 'oleander-pro-smoke', 'freecad-smoke.FCStd')
          step = os.path.join(os.environ['RUNNER_TEMP'], 'oleander-pro-smoke', 'freecad-smoke.step')
          doc.saveAs(fcstd)
          Part.export([obj], step)
          assert os.path.getsize(fcstd) > 0
          assert os.path.getsize(step) > 0
          import Path
          print('FREECAD_PARAMETRIC_STEP_EXPORT=PASS')
          print('FREECAD_CAM_MODULE_IMPORT=PASS')
          PY
          bash 90-shared/toolchains/pro-design/freecad.sh "${RUNNER_TEMP}/oleander-pro-smoke/freecad_smoke.py"
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/freecad-smoke.FCStd"
          test -s "${RUNNER_TEMP}/oleander-pro-smoke/freecad-smoke.step"
