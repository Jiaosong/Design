name: OLEANDER Automotive v0.11 Proportion Section Rebuild

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/**'
      - '.github/workflows/oleander-automotive-v0-11-proportion-section.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automotive-v0-11-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Stage current v0.11 source chain through R28C
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/build_automotive_v011_r05.py
          test -f /tmp/revise_v011_r28a.py
          test -f /tmp/revise_v011_r28b.py
          test -f /tmp/revise_v011_r28c.py
          python3 -m py_compile /tmp/build_automotive_v011*.py /tmp/revise_v011*.py
          test "$(sha256sum /tmp/build_automotive_v011_r05.py | awk '{print $1}')" = "4e6e6482b9098a7e2aa42eafed7217a7e97d331a45a9a1ceaa78fc98f287a967"
          git rev-parse HEAD > /tmp/R28C_SOURCE_COMMIT.txt

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | head -n 2

      - name: Build R28C zero-bulge radial fender patch
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r28c.py -- --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          cp /tmp/R28C_SOURCE_COMMIT.txt "$OUT/R28C_SOURCE_COMMIT.txt"
          cat > "$OUT/REVISION_CHAIN.txt" <<'TXT'
          R28C CURRENT EXECUTION CANDIDATE:
          R28A established the local U-boundary patch architecture. R28B corrected the visible wheel package to the locked 0.70 m OD and changed the inner crown from shoulder +26 mm to shoulder -18 mm; Machine Gate proved about 30 mm package cover remains, but Human M5 still showed the folded/ridged fender surface.
          R28C retains every R28B package/topology/crown decision and removes only R28A's artificial intermediate radial-layer bulge (+18 mm Y / +10 mm Z -> 0).
          This isolates whether the remaining fold is radial overshoot or the U-boundary-to-polar-boundary parameter mapping itself.
          R09 hard points, non-wheel R11/R12 source and R18/R20 terminations remain locked. Boolean/global SubD/ngon remain forbidden. M6/M7/M8 remain blocked pending Human M5 Visual QA.
          TXT
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: R28C machine gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11')
          q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_V011_RECEIPT.json').read_text())
          c=json.loads((out/'MODELING_CONTRACT.json').read_text())
          t=json.loads((out/'R28_PATCH_CONTRACT.json').read_text())
          x=json.loads((out/'R28B_CONTEXT.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED', q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED', r
          assert q['model'].endswith('_R28C'), q['model']
          assert c['contract_version']=='v0.2' and c['spec_patch']=='v0.2.1'
          assert c['modeling_stage']=='M5' and c['job_id']=='SYS-MODELING-WORKER-AUTO-M4M5-v0.11-R28C'
          checks=q['checks']
          for key in ('source_hash_stable_during_diagnostics','source_island_count_one','source_ngon_zero','source_no_boolean','source_no_subd','four_arch_boundaries','rounded_profile_active','local_fender_patch_active','bounded_local_window','outer_body_boundary_reused','radial_layers_6','termination_triangles_four','face_normals_recalculated','render_matrix','r28a_topology_retained','inset_crown_relation_active','wheel_hp_od_normalized','wheel_centers_retained','wheel_y_thickness_retained','package_crown_clearance_min','zero_radial_bulge_active'):
              assert checks.get(key) is True, (key,checks)
          assert q['topology']['tri']==4 and q['topology']['ngon']==0 and q['source_island_count']==1
          assert t['revision']=='R28C' and t['radial_bulge_y_m']==0.0 and t['radial_bulge_z_m']==0.0
          assert all(a['package_to_crown_clearance_m']>=x['minimum_required_clearance_m'] for a in x['axles'])
          assert len(q['renders'])==9 and len(list((out/'renders').glob('*.png')))==9
          assert 'M6/M7/M8 remains blocked' in ' | '.join(c['qa']['project'])
          print('AUTOMOTIVE v0.11 R28C MACHINE GATE PASS — HUMAN VISUAL QA REQUIRED')
          PY

      - name: Upload v0.11 R28C M5 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-automotive-v0-11-r28c-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11/
          if-no-files-found: error
          retention-days: 14
