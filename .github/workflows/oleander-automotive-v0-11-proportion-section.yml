name: OLEANDER Automotive v0.11 Proportion Section Rebuild

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/automotive/v0.11/**'
      - '.github/workflows/oleander-automotive-v0-11-proportion-section.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automotive-v0-11-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Stage HP-correct R25 working baseline
        run: |
          set -euo pipefail
          ROOT='90-shared/toolchains/modeling-worker/automotive/v0.11'
          shopt -s nullglob
          for src in "$ROOT"/*.py; do cp "$src" "/tmp/$(basename "$src")"; done
          for src in "$ROOT"/*.py.gz.b64; do
            dst="/tmp/$(basename "$src" .gz.b64)"
            if [ ! -f "$dst" ]; then base64 -d "$src" | gzip -d > "$dst"; fi
          done
          test -f /tmp/build_automotive_v011_r05.py
          test -f /tmp/revise_v011_r25.py
          test -f /tmp/wheel_hp_contract.py
          test -f /tmp/revise_v011_r25_hpbase.py
          python3 -m py_compile /tmp/build_automotive_v011*.py /tmp/revise_v011*.py /tmp/wheel_hp_contract.py
          test "$(sha256sum /tmp/build_automotive_v011_r05.py | awk '{print $1}')" = "4e6e6482b9098a7e2aa42eafed7217a7e97d331a45a9a1ceaa78fc98f287a967"
          git rev-parse HEAD > /tmp/R25_HPBASE_SOURCE_COMMIT.txt

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.0-linux-x64/blender --version | head -n 2

      - name: Build R25 source with wheel HP implementation contract
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11"
          mkdir -p "$OUT"
          START=$(date +%s)
          /tmp/blender-5.2.0-linux-x64/blender --background --python-exit-code 5 --python /tmp/revise_v011_r25_hpbase.py -- --out "$OUT" --samples 8 --resolution 640
          END=$(date +%s)
          echo $((END-START)) > "$OUT/EXECUTION_SECONDS.txt"
          cp /tmp/R25_HPBASE_SOURCE_COMMIT.txt "$OUT/R25_HPBASE_SOURCE_COMMIT.txt"
          cat > "$OUT/REVISION_CHAIN.txt" <<'TXT'
          R25 HP-CORRECT WORKING BASELINE:
          R27A-E and R28A-C remain valid audit evidence but are superseded as Source authority after hard-point-correct A/B rebaseline.
          The visible wheel implementation previously produced an anisotropic ~0.71 x 1.0792 m X/Z envelope. wheel_hp_contract.py deterministically enforces the locked 0.70 m OD at the current runtime R09 hard-point centers while preserving Y thickness.
          R25 Source geometry itself is unchanged and must retain source hash 6ae67c33aafb6da9f64359784e0cabb4fe9fb36b5bf62b91e49a0fa5348b9adf.
          Human M5 remains REVISE: local fender crown / hood-fender-shoulder integration still requires a smaller bounded M4 revision. M6/M7/M8 remain blocked.
          TXT
          sha256sum "$OUT"/renders/*.png > "$OUT/RENDER_SHA256SUMS.txt"
          sha256sum "$OUT"/*.blend "$OUT"/*.json > "$OUT/PRIMARY_SHA256SUMS.txt"

      - name: R25 HP baseline machine gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11')
          q=json.loads((out/'AUTOMOTIVE_V011_QA.json').read_text())
          r=json.loads((out/'AUTOMOTIVE_V011_RECEIPT.json').read_text())
          c=json.loads((out/'MODELING_CONTRACT.json').read_text())
          d=json.loads((out/'HP_REBASELINE_DECISION.json').read_text())
          assert q['status']=='MACHINE_PASS_VISUAL_REVIEW_REQUIRED',q
          assert r['status']=='EXECUTED_MACHINE_PASS_VISUAL_REVIEW_REQUIRED',r
          assert q['model'].endswith('_R25_HPBASE'),q['model']
          assert c['contract_version']=='v0.2' and c['spec_patch']=='v0.2.1'
          assert c['modeling_stage']=='M5' and c['job_id']=='SYS-MODELING-WORKER-AUTO-M1M5-v0.11-R25-HPBASE'
          checks=q['checks']
          for key in ('source_hash_stable_during_diagnostics','source_island_count_one','source_ngon_zero','termination_triangles_four','source_no_boolean','source_no_subd','arch_endpoint_vertex_reuse_24','four_arch_boundaries','rounded_profile_active','render_matrix','wheel_hp_contract_active','wheel_hp_package_exact','r25_source_hash_rebaseline_locked'):
              assert checks.get(key) is True,(key,checks)
          assert q['source_hash']=='6ae67c33aafb6da9f64359784e0cabb4fe9fb36b5bf62b91e49a0fa5348b9adf'
          assert len(q['wheel_hp_package'])==4
          assert len(q['renders'])==9 and len(list((out/'renders').glob('*.png')))==9
          assert d['status']=='R25_WORKING_BASELINE_RETAINED' and d['r27_r28_status']=='SUPERSEDED_AS_SOURCE / AUDIT_ONLY'
          assert 'M6/M7/M8 remains blocked' in ' | '.join(c['qa']['project'])
          print('AUTOMOTIVE v0.11 R25 HP BASELINE MACHINE PASS — HUMAN M5 REVISE / R29 REQUIRED')
          PY

      - name: Upload v0.11 R25 HP baseline evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-automotive-v0-11-r25-hpbase-${{ github.run_id }}
          path: out/OLEANDER_Automotive_Proportion_Section_Rebuild_v0.11/
          if-no-files-found: error
          retention-days: 14
