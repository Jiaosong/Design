name: OLEANDER Blender Professional FreeCAD Feature Tree

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_parametric_feature_tree.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_feature_tree_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-feature-tree.yml"
  push:
    branches:
      - main
    paths:
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_parametric_feature_tree.py"
      - "oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_feature_tree_blender_readback.py"
      - ".github/workflows/oleander-blender-professional-freecad-feature-tree.yml"

permissions:
  contents: read

jobs:
  native-feature-tree-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      BLENDER_VERSION: "5.1.2"
      BLENDER_SERIES: "5.1"
      BLENDER_ARCHIVE: blender-5.1.2-linux-x64.tar.xz
      OLEANDER_CAD_FEATURE_TREE_DIR: /tmp/oleander-cad-feature-tree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify FreeCAD 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "/tmp/${FREECAD_APPIMAGE}" \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          echo "${FREECAD_SHA256}  /tmp/${FREECAD_APPIMAGE}" | sha256sum --check
          chmod +x "/tmp/${FREECAD_APPIMAGE}"
          cd /tmp
          "./${FREECAD_APPIMAGE}" --appimage-extract >/tmp/freecad-feature-tree-extract.log 2>&1
          test -x /tmp/squashfs-root/usr/bin/freecadcmd
          /tmp/squashfs-root/usr/bin/freecadcmd --version

      - name: Build native Datum Sketch Pad tree and edit driving dimension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OLEANDER_CAD_FEATURE_TREE_DIR}"
          /tmp/squashfs-root/usr/bin/freecadcmd \
            "${GITHUB_WORKSPACE}/oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_parametric_feature_tree.py" \
            2>&1 | tee /tmp/oleander-freecad-feature-tree.log
          grep -F 'OLEANDER_FREECAD_NATIVE_FEATURE_TREE=' /tmp/oleander-freecad-feature-tree.log
          grep -F '"status": "PASS"' /tmp/oleander-freecad-feature-tree.log
          grep -F '"fully_constrained": true' /tmp/oleander-freecad-feature-tree.log
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_R001.FCStd"
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_R002.FCStd"
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_R001.step"
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_R002.step"
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_R002_display.json"
          test -s "${OLEANDER_CAD_FEATURE_TREE_DIR}/oleander_feature_tree_manifest.json"

      - name: Download official Blender 5.1.2 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl --fail --location --retry 3 --retry-delay 2 --output "${BLENDER_ARCHIVE}" "${base}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "blender-${BLENDER_VERSION}.sha256" "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-selected.sha256
          sha256sum --check blender-selected.sha256
          tar -xf "${BLENDER_ARCHIVE}"
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -5

      - name: Read feature-tree derivative in Blender and reopen
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background \
            --python oleander-skills/oleander-3d-pipeline/blender_runtime/tests/professional/probe_freecad_feature_tree_blender_readback.py \
            2>&1 | tee /tmp/oleander-feature-tree-blender.log
          grep -F 'OLEANDER_FREECAD_FEATURE_TREE_BLENDER_READBACK=' /tmp/oleander-feature-tree-blender.log
          grep -F '"status": "PASS"' /tmp/oleander-feature-tree-blender.log
          grep -F '"master": "FreeCAD PartDesign feature tree"' /tmp/oleander-feature-tree-blender.log
          grep -F '"blender": "DISPLAY_DERIVATIVE_ONLY"' /tmp/oleander-feature-tree-blender.log

      - name: Record bounded feature-tree evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## OLEANDER Native FreeCAD Parametric Feature Tree'
            echo '- Native chain: PartDesign::Plane -> Sketcher::SketchObject -> PartDesign::Pad.'
            echo '- Sketch must remain FullyConstrained.'
            echo '- Driving width edit 80 mm -> 100 mm must recompute the Pad and change authoritative volume without manual mesh editing.'
            echo '- FCStd and STEP R001/R002 are preserved; R002 lineage is read in Blender as DISPLAY_DERIVATIVE_ONLY and survives reopen.'
            echo '- This is bounded native feature-tree evidence, not full P0-A Parametric CAD parity.'
          } >> "$GITHUB_STEP_SUMMARY"
