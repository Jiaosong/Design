          def select_opposite_face(shape, normal):
              found = []
              for face in shape.Faces:
                  candidate = face_normal(face)
                  if candidate.dot(-normal) > 0.999999:
                      found.append(face)
              require(len(found) == 1, "bounded prism requires one opposite face")
