name: C04 Blender Rebuild

on:
  workflow_dispatch:
    inputs:
      object:
        description: Rebuild object slug
        required: false
        default: yunshuiyi
  push:
    branches:
      - main
      - fix/c04-blender-rebuild-runtime-clean-20260902
    paths:
      - '.github/workflows/c04-blender-rebuild.yml'
      - 'tools/oleander-runtime/ensure-blender-5.2.sh'
      - '05-cases/c04-qingjiang-stone-book/blender-rebuild/**'
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/c04_blender_web_derivative.py'
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/c04_web_runtime_harness.html'
      - '05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/c04_browser_runtime_test.mjs'

permissions:
  contents: read

jobs:
  rebuild-yunshuiyi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      C04_REBUILD_OUT: ${{ github.workspace }}/artifacts/c04-yunshuiyi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Restore OLEANDER Blender 5.2 runtime
        id: blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(bash tools/oleander-runtime/ensure-blender-5.2.sh)"
          echo "bin=$BLENDER_BIN" >> "$GITHUB_OUTPUT"
          "$BLENDER_BIN" --version | tee blender-version.txt
          grep -F "Blender 5.2.0" blender-version.txt
          grep -F "build hash: fbe6228777e7" blender-version.txt

      - name: Build editable Yunshuiyi candidate v003
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$C04_REBUILD_OUT"
          "${{ steps.blender.outputs.bin }}" \
            --background \
            --factory-startup \
            --python-exit-code 2 \
            --python 05-cases/c04-qingjiang-stone-book/blender-rebuild/c04_rebuild_yunshuiyi_v003.py

      - name: Native Blender reopen validation v003
        shell: bash
        run: |
          set -euo pipefail
          BLEND="$C04_REBUILD_OUT/C04_YUNSHUIYI_REBUILD_MASTER_v003.blend"
          test -s "$BLEND"
          "${{ steps.blender.outputs.bin }}" \
            --background "$BLEND" \
            --python-exit-code 3 \
            --python 05-cases/c04-qingjiang-stone-book/blender-rebuild/c04_validate_rebuild_v003.py

      - name: Generate Web LOD/GLB derivatives from validated rebuild
        shell: bash
        run: |
          set -euo pipefail
          BLEND="$C04_REBUILD_OUT/C04_YUNSHUIYI_REBUILD_MASTER_v003.blend"
          WEB_OUT="$C04_REBUILD_OUT/web"
          mkdir -p "$WEB_OUT"
          "${{ steps.blender.outputs.bin }}" \
            --background "$BLEND" \
            --python-exit-code 4 \
            --python 05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support/c04_blender_web_derivative.py -- \
            --input "$BLEND" \
            --output-dir "$WEB_OUT" \
            --slug yunshuiyi \
            --texture-max 2048 \
            --lod0 160000 \
            --lod1 70000 \
            --lod2 24000
          test -s "$WEB_OUT/C04_yunshuiyi_LOD0.glb"
          test -s "$WEB_OUT/C04_yunshuiyi_LOD1.glb"
          test -s "$WEB_OUT/C04_yunshuiyi_LOD2.glb"
          test -s "$WEB_OUT/C04_yunshuiyi_WEB_DERIVATIVE_MANIFEST.json"

      - name: Chromium runtime attack and readback
        shell: bash
        run: |
          set -euo pipefail
          WEB_OUT="$C04_REBUILD_OUT/web"
          SUPPORT="05-cases/c04-qingjiang-stone-book/web-v1.12-game-line/support"
          TESTROOT=/tmp/c04-browser-runtime
          rm -rf "$TESTROOT"; mkdir -p "$TESTROOT" "$WEB_OUT/browser" "$WEB_OUT/addons/loaders"
          cd "$TESTROOT"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund three@0.179.1 playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
          cp node_modules/three/build/three.module.js "$WEB_OUT/three.module.js"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$WEB_OUT/addons/loaders/GLTFLoader.js"
          cp "$GITHUB_WORKSPACE/$SUPPORT/c04_web_runtime_harness.html" "$WEB_OUT/index.html"
          cp "$GITHUB_WORKSPACE/$SUPPORT/c04_browser_runtime_test.mjs" "$TESTROOT/test.mjs"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$WEB_OUT" >/tmp/c04-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node "$TESTROOT/test.mjs" http://127.0.0.1:8765/ "$WEB_OUT/browser/C04_YUNSHUIYI_BROWSER_RUNTIME_RECEIPT.json"
          test -s "$WEB_OUT/browser/C04_YUNSHUIYI_BROWSER_RUNTIME_RECEIPT.json"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Artifact identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$C04_REBUILD_OUT"
          find . -type f -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS.txt
          test -s C04_YUNSHUIYI_REBUILD_MASTER_v003.blend
          test -s C04_YUNSHUIYI_REBUILD_MASTER_v003_preview.png
          test -s C04_YUNSHUIYI_REBUILD_MASTER_v003_manifest.json
          test -s C04_YUNSHUIYI_REBUILD_MASTER_v003_reopen_receipt.json

      - name: Upload rebuild and Web derivative evidence
        uses: actions/upload-artifact@v4
        with:
          name: C04_YUNSHUIYI_REBUILD_MASTER_v003
          path: |
            artifacts/c04-yunshuiyi/
            blender-version.txt
          if-no-files-found: error
          retention-days: 30
