name: C04 F Integration Loop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '05-cases/c04-qingjiang-stone-book/f-integration/**'
      - '05-cases/c04-qingjiang-stone-book/orchestration/*.mjs'
      - '05-cases/c04-qingjiang-stone-book/orchestration/*.json'
      - '.github/workflows/c04-f-integration-loop.yml'
  push:
    branches:
      - main
    paths:
      - '05-cases/c04-qingjiang-stone-book/f-integration/**'
      - '05-cases/c04-qingjiang-stone-book/orchestration/*.mjs'
      - '05-cases/c04-qingjiang-stone-book/orchestration/*.json'
      - '.github/workflows/c04-f-integration-loop.yml'

permissions:
  contents: read

jobs:
  f-integration-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Syntax check F integration and contract validator
        run: |
          node --check 05-cases/c04-qingjiang-stone-book/f-integration/run-f-integration-loop.mjs
          node --check 05-cases/c04-qingjiang-stone-book/orchestration/validate-cross-line-contracts.mjs

      - name: Test orchestration controls
        run: node --test 05-cases/c04-qingjiang-stone-book/orchestration/test-cross-line-contracts.mjs

      - name: Validate six-lane contracts and promotion freeze
        run: node 05-cases/c04-qingjiang-stone-book/orchestration/validate-cross-line-contracts.mjs

      - name: Run latest-governance F integration loop
        run: node 05-cases/c04-qingjiang-stone-book/f-integration/run-f-integration-loop.mjs

      - name: Preserve F result as execution evidence only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: c04-f-integration-loop-result
          path: |
            05-cases/c04-qingjiang-stone-book/f-integration/loop-result.json
            05-cases/c04-qingjiang-stone-book/orchestration/orchestration-result.json
          if-no-files-found: error
          retention-days: 7
