name: OLEANDER Modeling Worker v0.13 R4.5.1 Cap Curvature Scale

on:
  pull_request:
    paths:
      - '90-shared/toolchains/modeling-worker/v0.13/G1_R4_5_TERMINATION_CAP_DECISION_2026-08-17.md'
      - '90-shared/toolchains/modeling-worker/v0.13/G1_R4_5_1_CAP_CURVATURE_SCALE_CONTRACT.json'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r4_5_1_cap_curvature_scale.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_core.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_qa.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_entry.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_roundtrip.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_scene.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r2_topology_isolation.py'
      - '90-shared/toolchains/modeling-worker/v0.13/g1_r4_5_termination_cap_relation.py'
      - '90-shared/toolchains/modeling-worker/v0.13/G1_R3_CONFIRMED_INTERFACE_RELATION.json'
      - '90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_EXECUTION_CONTRACT.json'
      - '90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_SURFACE_BINDING.json'
      - '90-shared/toolchains/blender-surface-system/v1.20.0/f1_design_validation_runtime.py'
      - '90-shared/toolchains/blender-surface-system/v1.20.0/CMF_PRESET_CONTRACT_v1.20.0.json'
      - '.github/workflows/oleander-modeling-worker-v0-13-r4-5-1-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-r4-5-1-cap-curvature-scale:
    name: G1 R4.5.1 Sparse Cap Pole-Curvature Scale
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile and validate R4.5.1 contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            90-shared/toolchains/modeling-worker/v0.13/g1_r2_core.py \
            90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_roundtrip.py \
            90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_scene.py \
            90-shared/toolchains/modeling-worker/v0.13/g1_r4_5_termination_cap_relation.py \
            90-shared/toolchains/modeling-worker/v0.13/g1_r4_5_1_cap_curvature_scale.py
          python3 -m json.tool 90-shared/toolchains/modeling-worker/v0.13/G1_R4_5_1_CAP_CURVATURE_SCALE_CONTRACT.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('90-shared/toolchains/modeling-worker/v0.13')
          c=json.loads((root/'G1_R4_5_1_CAP_CURVATURE_SCALE_CONTRACT.json').read_text())
          assert c['source_owner_family']=='LOWER_RETURN_PROFILE'
          assert c['relation_vocabulary']['numeric_dof_count']==2
          assert c['relation_vocabulary']['locked_onset_value']==0.88
          assert c['relation_vocabulary']['new_numeric_property']=='termination_cap_pole_curvature_scale'
          assert c['relation_vocabulary']['law']=='C2_MATCHED_ELLIPTIC_PARABOLOID_POLE'
          assert c['relation_vocabulary']['semantics']=='EXPLICIT_SPARSE_TERMINATION_CAP_RELATION'
          p=c['policy']
          assert p['termination_cap_onset_u_locked']==0.88
          assert p['confirmed_interface_relation_locked'] is True
          assert p['termination_envelope_exponent_locked']==0.34
          assert p['profile_control_edit_forbidden'] is True
          assert p['grip_axis_control_edit_forbidden'] is True
          assert p['seventh_source_family_forbidden'] is True
          assert p['mesh_local_cosmetic_patch_forbidden'] is True
          assert p['max_sparse_authority_scalar_count']==50
          assert p['candidate_promotion']=='NOT_RUN'
          assert set(c['variants'])=={'SCALE_A_0_90','SCALE_B_0_92','SCALE_C_0_94','SCALE_D_0_96'}
          receipt=(root/c['authorization_receipt']).read_text()
          assert 'ONE_DOF_ONSET_ONLY_INSUFFICIENT_FOR_PROFESSIONAL_REFLECTION_FLOW' in receipt
          print('R4_5_1_CONTRACT_AND_AUTHORIZATION_VALIDATED')
          PY

      - name: Install Blender runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install Blender 5.2.0 LTS
        run: |
          set -euo pipefail
          URL='https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz'
          EXPECTED='96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/blender.tar.xz "$URL"
          test "$(sha256sum /tmp/blender.tar.xz | awk '{print $1}')" = "$EXPECTED"
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Build Blender-native R2 Working Source reference
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/G1_R2"; mkdir -p "$OUT"
          /tmp/blender-5.2.0-linux-x64/blender \
            --background \
            --python-exit-code 5 \
            --python 90-shared/toolchains/modeling-worker/v0.13/g1_r2_blender_entry.py \
            -- \
            --source 90-shared/toolchains/modeling-worker/v0.13/G1_PRIMARY_CURVE_SOURCE.json \
            --correction 90-shared/toolchains/modeling-worker/v0.13/G1_R2_RELATION_CORRECTION.json \
            --contract 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_EXECUTION_CONTRACT.json \
            --binding 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_SURFACE_BINDING.json \
            --out "$OUT" \
            --resolution 384

      - name: Execute R4.5.1 sparse cap curvature scale batch
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/G1_R4_5_1"; mkdir -p "$OUT/60_OUTPUTS/DIAGNOSTIC"
          /tmp/blender-5.2.0-linux-x64/blender \
            "$GITHUB_WORKSPACE/out/G1_R2/OLEANDER_G1_R2_HandheldShell__BLENDER_EXECUTION__v0_13.blend" \
            --background \
            --python-exit-code 13 \
            --python 90-shared/toolchains/modeling-worker/v0.13/g1_r4_5_1_cap_curvature_scale.py \
            -- \
            --source 90-shared/toolchains/modeling-worker/v0.13/G1_PRIMARY_CURVE_SOURCE.json \
            --r2-correction 90-shared/toolchains/modeling-worker/v0.13/G1_R2_RELATION_CORRECTION.json \
            --confirmed-interface 90-shared/toolchains/modeling-worker/v0.13/G1_R3_CONFIRMED_INTERFACE_RELATION.json \
            --execution-contract 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_EXECUTION_CONTRACT.json \
            --binding 90-shared/toolchains/modeling-worker/v0.13/G1_R2_BLENDER_SURFACE_BINDING.json \
            --contract 90-shared/toolchains/modeling-worker/v0.13/G1_R4_5_1_CAP_CURVATURE_SCALE_CONTRACT.json \
            --out "$OUT/60_OUTPUTS/DIAGNOSTIC" \
            --resolution 512

      - name: Verify R4.5.1 Machine gate and authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/G1_R4_5_1/60_OUTPUTS/DIAGNOSTIC')
          r=json.loads((root/'G1_R4_5_1_CAP_CURVATURE_SCALE_REPORT.json').read_text())
          assert r['status']=='R4_5_1_CAP_SCALE_MACHINE_PASS_VISUAL_REVIEW_REQUIRED', r['status']
          assert all(r['global_checks'].values()), r['global_checks']
          assert r['authority_state']=='WORKING_SOURCE'
          assert r['candidate_review']=='REOPENED'
          assert r['candidate_promotion']=='NOT_RUN'
          assert r['relation_vocabulary']['numeric_dof_count']==2
          assert r['relation_vocabulary']['locked_onset_value']==0.88
          assert r['roundtrip']['pass'] is True, r['roundtrip']
          assert len(r['machine_pass_variants'])>=1, r['variants']
          assert set(r['renders'])=={'SCALE_1_00_REFERENCE', *r['machine_pass_variants']}
          for vid in r['machine_pass_variants']:
              row=r['variants'][vid]
              assert row['machine_pass'] is True
              assert all(row['checks'].values()), (vid,row['checks'])
              assert set(r['renders'][vid])=={'BROAD','STRIP','GRAZING','ZEBRA'}
              for name in r['renders'][vid].values(): assert (root/name).exists(), name
          for name in r['renders']['SCALE_1_00_REFERENCE'].values(): assert (root/name).exists(), name
          print('R4_5_1_MACHINE_PASS_VISUAL_REVIEW_REQUIRED',r['machine_pass_variants'],r['machine_ranked_variants'])
          PY

      - name: Upload R4.5.1 scale artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: oleander-modeling-worker-v0-13-g1-r4-5-1-${{ github.run_id }}
          path: |
            out/G1_R4_5_1/
            out/G1_R2/OLEANDER_G1_R2_HandheldShell__BLENDER_EXECUTION__v0_13.blend
          if-no-files-found: error
          retention-days: 14

      - name: Boundary
        run: |
          echo 'R4.5.1 keeps cap onset fixed at 0.88 and adds one explicit Source-level pole-curvature scale on existing LOWER_RETURN_PROFILE.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only Machine-PASS variants are rendered against the rejected scale=1.0 reference under shared Broad/Strip/Grazing/Zebra.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No seventh Source family, profile/axis edit, mesh patch or Candidate Promotion is authorized.' >> "$GITHUB_STEP_SUMMARY"
