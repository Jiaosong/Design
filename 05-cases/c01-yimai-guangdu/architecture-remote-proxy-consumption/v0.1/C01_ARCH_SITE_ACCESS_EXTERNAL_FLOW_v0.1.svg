<g transform="translate(56,1024)">
<rect width="1688" height="100" rx="14" class="card"/>
<text x="20" y="30" class="xs proxy">ARCHITECTURE DISPOSITION</text>
<text x="20" y="58" class="txt ink">KEEP SUPPORT at Architecture Site/Context + Relationship/Flow level. Do not issue pseudo-survey geometry.</text>
<text x="20" y="82" class="txt hold">Metric planning, fire/accessibility, civil/drainage, room capacity and fixed heritage installation remain HOLD / NOT_RUN.</text>
