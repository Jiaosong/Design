<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<style>
.bg{fill:#f2efe7}.card{fill:#fffdf8;stroke:#c9c4b8;stroke-width:1.2}.ink{fill:#202824}.muted{fill:#68716b}.keep{fill:#416c5c}.hold{fill:#9c5742}.proxy{fill:#66768a}.line{stroke:#34443d;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#9b7566;stroke-width:1.6;fill:none;stroke-dasharray:8 7}.thin{stroke:#c9c4b8;stroke-width:1.1;fill:none}.h1{font:700 34px Arial,sans-serif}.h2{font:700 18px Arial,sans-serif}.txt{font:400 14px Arial,sans-serif}.sm{font:400 12px Arial,sans-serif}.xs{font:700 11px Arial,sans-serif;letter-spacing:.8px}
</style>
<rect width="1800" height="1180" class="bg"/>
<text x="56" y="58" class="h1 ink">C01 · ARCHITECTURE ADD-01 · SITE ACCESS + EXTERNAL FLOW PROXY</text>
<text x="56" y="90" class="txt muted">NTS / RELATION-LEVEL ONLY · not a surveyed masterplan · RG2 NOT RUN · E2 unchanged</text>

