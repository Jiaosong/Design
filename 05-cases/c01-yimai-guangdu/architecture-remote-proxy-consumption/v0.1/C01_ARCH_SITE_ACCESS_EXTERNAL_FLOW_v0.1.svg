  <text x="78" y="275" class="sm muted">resident priority · no forced private-courtyard route</text>
  <path d="M260 304v70" class="line"/>
  <rect x="55" y="374" width="410" height="106" rx="12" class="card"/>
  <text x="78" y="402" class="h2 ink">Existing cultural route system</text>
  <text x="78" y="428" class="sm muted">Visitor centre / Hand Lion</text>
  <text x="78" y="450" class="sm muted">Mao ancestral hall</text>
