  <text x="26" y="82" class="h2 ink">ADD-00 / 01 / 02 / 04 / 06 / 15</text>
  <text x="26" y="110" class="txt keep">usable at bounded relation / change-register level</text>
  <line x1="26" y1="132" x2="530" y2="132" class="thin"/>

  <text x="26" y="175" class="h2 ink">Metric site plan</text>
  <text x="26" y="201" class="txt hold">HOLD — no survey boundary / levels / route widths</text>

  <text x="26" y="247" class="h2 ink">Accessible / emergency path</text>
  <text x="26" y="273" class="txt hold">HOLD — no measured slope / clear width / thresholds</text>

  <text x="26" y="319" class="h2 ink">Indoor room / 20–30 capacity</text>
  <text x="26" y="345" class="txt hold">HOLD — planning scenario only</text>

  <text x="26" y="391" class="h2 ink">Fixed heritage intervention</text>
  <text x="26" y="417" class="txt hold">HOLD — protection / permission / field geometry open</text>

  <text x="26" y="463" class="h2 ink">Design response under uncertainty</text>
  <text x="26" y="489" class="txt keep">movable · non-contact · relocatable · digital/handheld fallback</text>

  <rect x="24" y="548" width="510" height="128" rx="12" fill="#edf3ef" stroke="#8ca99b"/>
  <text x="48" y="577" class="xs keep">ROBUSTNESS RULE</text>
  <text x="48" y="606" class="sm ink">If stopping space shrinks → move deep reading elsewhere.</text>
  <text x="48" y="628" class="sm ink">If P3 road changes → reopen position, not whole concept.</text>
