  <text x="62" y="585" class="sm muted">older road/surface image cannot remain Current authority</text>

  <path d="M265 170v45M265 307v45M265 444v45" class="dash"/>
</g>

<g transform="translate(1186,270)">
  <rect width="558" height="720" rx="16" class="card"/>
