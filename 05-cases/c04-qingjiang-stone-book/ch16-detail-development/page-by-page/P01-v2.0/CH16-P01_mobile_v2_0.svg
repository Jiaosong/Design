<g transform="translate(0 1710)"><path class="h" d="M18 -10h354"/><text class="m j note" x="18" y="28">INVARIANTS</text><text class="s" x="105" y="28" font-size="10" font-weight="650">安全边界 ≠ 身体支持 · 路径优先</text><text class="s" x="105" y="49" font-size="9" fill="#69766F">对象可撤 / 可绕 / 可维护 · R06 EXPERIENCE FROZEN</text><path class="h" d="M18 70h354"/><text class="m c note" x="18" y="98">OPEN / VERIFY</text><text class="s" x="105" y="98" font-size="9">人体参数 · 净宽 · 接触压力 · 湿滑/热感</text><text class="s" x="105" y="119" font-size="9">荷载 · 锚固 · 实际安装点位</text><path class="h" d="M18 144h354"/><text class="m note" x="18" y="169">ODB-02 = IDENTITY AUTHORITY / action layer = DIAGRAM ONLY</text><text class="m note" x="18" y="190">EXECUTED / SELF-CHECKED / INDEPENDENT REVIEW PENDING</text><text class="m c note" x="18" y="216">FIELD=0 · G1F HOLD · NO_PROMOTION · NTS · NOT FOR CONSTRUCTION</text></g></svg>