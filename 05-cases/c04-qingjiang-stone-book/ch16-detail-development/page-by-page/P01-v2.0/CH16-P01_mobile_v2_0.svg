<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2070" viewBox="0 0 390 2070" role="img" aria-labelledby="title desc"><title id="title">CH16-P01 Mobile v2.0</title><desc id="desc">MOVE、LEAN、PERCH、OBSERVE、MAINTAIN 五种行动承载的人体—接口关系移动端纵向重排。</desc><style>.s{font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#18322D}.r{font-family:'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif;fill:#18322D}.m{font-family:'Noto Sans Mono CJK SC','Noto Sans Mono',monospace;fill:#69766F}.j{fill:#2F746B}.c{fill:#B85C49}.b{stroke:#18322D;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{stroke:#BBB9AE;fill:none}.body{stroke:#18322D;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.5}.head{fill:#FBF9F4;stroke:#18322D;stroke-width:2}.note{font-size:8px;font-weight:700}.act{font-size:9px;font-weight:800;fill:#2F746B}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#B85C49"/></marker><marker id="aj" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#2F746B"/></marker><g id="bd"><path class="b" stroke-width="4.5" d="M220 0v250"/><path class="b" stroke-width="1.4" d="M248 0v250"/><path class="b" stroke-width="2.4" d="M135 80h113M135 160h113"/><rect x="249" y="114" width="112" height="38" rx="3" fill="#DDE8E2" stroke="#2F746B" stroke-width="1.6"/><path d="M262 133h86" stroke="#2F746B" stroke-width="2" stroke-dasharray="5 4"/><text class="m j" x="305" y="101" font-size="8" font-weight="800" text-anchor="middle">SUPPORT / CONTACT ZONE</text></g></defs><rect width="390" height="2070" fill="#F2EEE5"/><path class="h" d="M18 24h354"/><text class="m j" x="18" y="49" font-size="8" font-weight="800">CH16 / P01 / BODY × INTERFACE</text><text class="r" x="18" y="91" font-size="27" font-weight="700">人体不证明尺度；</text><text class="r" x="18" y="126" font-size="27" font-weight="700">动作才定义接口。</text><text class="s" x="18" y="154" font-size="10" fill="#69766F">五种动作必须分别对应空间任务；不复刻 ODB-02 产品几何。</text><path class="h" d="M18 177h354"/><text class="m j note" x="18" y="198">SOURCE / ODB-02</text><text class="m note" x="372" y="198" text-anchor="end">IDENTITY AUTHORITY · NO TRACE · DIAGRAM ONLY</text>
