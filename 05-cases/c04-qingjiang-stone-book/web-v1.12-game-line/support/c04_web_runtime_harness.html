<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C04 Yunshuiyi Runtime Harness</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:14px system-ui}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#ui{position:fixed;z-index:2;left:16px;top:16px;display:flex;gap:8px;align-items:center;background:#111c;padding:8px;border-radius:6px}button{font:inherit}#hotspot[hidden],#retry[hidden]{display:none}#status{min-width:130px}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script>
<div id="stage"></div>
<div id="ui"><button id="load">Load model</button><button id="hotspot" hidden>Contact zone</button><button id="retry" hidden>Retry</button><span id="status">idle</span></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),loadBtn=document.querySelector('#load'),hotspot=document.querySelector('#hotspot'),retry=document.querySelector('#retry');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search); let forceError=params.get('forceError')==='1';
const lod=innerWidth<=500?'LOD2':innerWidth<=1500?'LOD1':'LOD0';
const realUrl=`./C04_yunshuiyi_${lod}.glb`;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x111111);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100); camera.position.set(3.4,-3.7,2.4);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); stage.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2.4)); const key=new THREE.DirectionalLight(0xffffff,3); key.position.set(3,-4,5); scene.add(key);
let root=null,drag=false,lastX=0,lastY=0,selected=false;
window.__C04_METRICS={selectedLOD:lod,reducedMotion:reduced,modelLoaded:false,requestStarted:false,interacted:false,recovered:false,webglVersion:renderer.getContext().getParameter(renderer.getContext().VERSION),renderFrames:0};
function fit(obj){const b=new THREE.Box3().setFromObject(obj),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()); obj.position.sub(c); const m=Math.max(s.x,s.y,s.z)||1; camera.position.set(m*1.7,-m*1.9,m*1.2); camera.lookAt(0,0,0); camera.near=Math.max(.001,m/1000);camera.far=m*20;camera.updateProjectionMatrix()}
async function loadModel(){status.textContent='loading';retry.hidden=true;loadBtn.disabled=true;window.__C04_METRICS.requestStarted=true;const url=forceError?'./__missing__.glb':realUrl;try{const gltf=await new GLTFLoader().loadAsync(url);if(root)scene.remove(root);root=gltf.scene;scene.add(root);fit(root);status.textContent='ready';hotspot.hidden=false;window.__C04_METRICS.modelLoaded=true;window.__C04_METRICS.loadedUrl=url;window.__C04_METRICS.objectCount=root.children.length}catch(e){status.textContent='error';retry.hidden=false;loadBtn.disabled=false;window.__C04_METRICS.lastError=String(e)}}
loadBtn.addEventListener('click',loadModel);retry.addEventListener('click',()=>{forceError=false;window.__C04_METRICS.recovered=true;loadModel()});hotspot.addEventListener('click',()=>{selected=!selected;hotspot.dataset.selected=String(selected);status.textContent=selected?'contact selected':'ready';window.__C04_METRICS.hotspotSelected=selected});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!root)return;root.rotation.z+=(e.clientX-lastX)*.005;root.rotation.x+=(e.clientY-lastY)*.003;lastX=e.clientX;lastY=e.clientY;window.__C04_METRICS.interacted=true;window.__C04_METRICS.rotation=[root.rotation.x,root.rotation.y,root.rotation.z]});renderer.domElement.addEventListener('pointerup',()=>drag=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);if(root&&!reduced&&!drag)root.rotation.z+=.0008;renderer.render(scene,camera);window.__C04_METRICS.renderFrames++}loop();
</script>
