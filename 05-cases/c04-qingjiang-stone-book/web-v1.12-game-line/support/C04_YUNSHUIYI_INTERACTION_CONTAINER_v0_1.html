<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云水倚｜身体支持交互容器</title>
<style>
:root{--ink:#17211f;--paper:#f2efe6;--line:rgba(23,33,31,.18);--accent:#8c4938;--muted:#66706c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans SC",sans-serif}.module{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stage{position:relative;min-height:680px;overflow:hidden;border-right:1px solid var(--line);background:#e8e4da}.evidence{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26;filter:saturate(.6);transition:opacity .35s ease,transform .45s ease}.module[data-state="support"] .evidence{opacity:.42;transform:scale(1.015)}.model-slot{position:absolute;inset:10% 8% 13%;display:grid;place-items:center;border:1px solid rgba(23,33,31,.26);background:rgba(242,239,230,.58)}.silhouette{width:min(72%,620px);aspect-ratio:1.5;position:relative}.silhouette:before,.silhouette:after{content:"";position:absolute;border:1.5px solid var(--ink);border-radius:50% 55% 45% 55%/55% 45% 60% 40%;transform:rotate(-8deg)}.silhouette:before{inset:18% 5% 16% 7%;opacity:.18}.silhouette:after{inset:28% 15% 24% 17%;opacity:.08}.truth{position:absolute;left:24px;bottom:22px;max-width:560px;font-size:11px;line-height:1.5;letter-spacing:.04em;color:var(--muted)}.panel{padding:clamp(28px,4vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:48px}.kicker{font-size:11px;letter-spacing:.18em;color:var(--muted);margin:0 0 18px}.panel h1{font-size:clamp(34px,4vw,64px);line-height:.98;font-weight:500;margin:0 0 22px}.lead{font-size:15px;line-height:1.75;max-width:34em;margin:0}.states{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}button{appearance:none;border:0;background:var(--paper);text-align:left;padding:18px 18px 16px;color:var(--ink);cursor:pointer}button b{display:block;font-size:16px;margin-bottom:5px}button span{font-size:12px;color:var(--muted)}button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}button[aria-pressed="true"] span{color:#c9cfca}.state-read{border-top:1px solid var(--line);padding-top:20px}.state-read strong{display:block;font-size:12px;letter-spacing:.12em;margin-bottom:8px}.state-read p{margin:0;font-size:14px;line-height:1.65}.cue{position:absolute;right:22px;top:22px;font-size:11px;letter-spacing:.12em;color:var(--muted)}@media(max-width:720px){.module{grid-template-columns:1fr}.stage{min-height:58svh;border-right:0;border-bottom:1px solid var(--line)}.panel{padding:26px 20px 32px;gap:32px}.model-slot{inset:9% 5% 16%}.truth{left:16px;right:16px;bottom:14px}.panel h1{font-size:38px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="module" id="module" data-state="walk" aria-label="云水倚身体支持交互容器设计验证">
  <div class="stage">
    <img class="evidence" src="../assets/body_need_scenarios_current.svg" alt="身体压力与短停靠需求的现有项目证据图">
    <div class="model-slot" aria-label="云水倚 Web 模型展示区域；真实 derivative 返回后替换此区域">
      <div class="silhouette" aria-hidden="true"></div>
    </div>
    <div class="cue">BODY STATE · A/B</div>
    <div class="truth">当前仅验证交互容器、状态层级与身体关系；中央轮廓不是产品模型。真实云水倚 Web derivative 返回前，不授予 3D / 产品像素 KEEP。</div>
  </div>
  <div class="panel">
    <div><p class="kicker">PATH · FATIGUE · SHORT SUPPORT · RETURN</p><h1>走累时，<br>只需要短暂借力。</h1><p class="lead">产品不是新的停留目的地。它只在身体压力出现时进入视野，帮助完成一次短停靠，再把注意力还给路线与清江。</p></div>
    <div>
      <div class="states" role="group" aria-label="身体状态切换">
        <button type="button" data-next="walk" aria-pressed="true"><b>继续走</b><span>路线仍是主角 · 对象退后</span></button>
        <button type="button" data-next="support" aria-pressed="false"><b>短暂停靠</b><span>身体需要支撑 · 对象进入</span></button>
      </div>
      <div class="state-read"><strong id="stateTitle">WALK / LANDSCAPE FIRST</strong><p id="stateCopy">身体仍能连续通过时，不主动制造产品注意力；景观与路线保持第一阅读。</p></div>
    </div>
  </div>
</section>
<script>
const root=document.querySelector('#module'),title=document.querySelector('#stateTitle'),copy=document.querySelector('#stateCopy');
const text={walk:['WALK / LANDSCAPE FIRST','身体仍能连续通过时，不主动制造产品注意力；景观与路线保持第一阅读。'],support:['LEAN / SHORT RECOVERY','疲劳出现后，支撑关系才增强；恢复完成即返回路线，不把短停靠变成新的景点。']};
document.querySelectorAll('button[data-next]').forEach(btn=>btn.addEventListener('click',()=>{const s=btn.dataset.next;root.dataset.state=s;document.querySelectorAll('button[data-next]').forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));title.textContent=text[s][0];copy.textContent=text[s][1]}));
</script>
</body></html>
