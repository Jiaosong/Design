<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">R06 Detail Atlas — Authority Hold</title><desc id="desc">Editable verification atlas. Detail geometry remains open until the authoritative source is rebound.</desc><rect width="1400" height="820" fill="#eef0eb"/><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="90" y="95" font-size="21" letter-spacing="4">R06 / DETAIL ATLAS</text><text x="90" y="175" font-size="58" font-weight="700">AUTHORITY HOLD</text><text x="90" y="225" font-size="20">DETAIL GEOMETRY / FIELD CONDITIONS NOT BOUND</text></g><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><g transform="translate(90 320)"><rect width="360" height="180" fill="none" stroke="#173c37" stroke-width="2"/><text x="25" y="48" font-size="17">01 / JOINT</text><text x="25" y="100" font-size="28">VERIFY</text><text x="25" y="140" font-size="15" opacity=".65">gap · fastener · movement</text></g><g transform="translate(520 320)"><rect width="360" height="180" fill="none" stroke="#173c37" stroke-width="2"/><text x="25" y="48" font-size="17">02 / DRAINAGE + SLIP</text><text x="25" y="100" font-size="28">VERIFY</text><text x="25" y="140" font-size="15" opacity=".65">water path · wet surface</text></g><g transform="translate(950 320)"><rect width="360" height="180" fill="none" stroke="#173c37" stroke-width="2"/><text x="25" y="48" font-size="17">03 / REPLACEMENT</text><text x="25" y="100" font-size="28">VERIFY</text><text x="25" y="140" font-size="15" opacity=".65">access · removal · maintenance</text></g><text x="90" y="640" font-size="20">These are verification slots, not fabricated construction details.</text><text x="90" y="690" font-size="16" opacity=".65">Authoritative detail source + field conditions + engineering review remain required.</text></g></svg>