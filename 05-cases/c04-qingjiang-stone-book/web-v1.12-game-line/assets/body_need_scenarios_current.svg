<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">清江连续步行中的身体支持关系</title>
<desc id="desc">以走、停、倚、恢复四种身体状态说明：连续步行是主线；身体压力出现后才引入支持，恢复后重新回到路径。具体实体选型、尺寸与连接保持开放。</desc>
<defs><style>
.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}.ink{fill:#17201E}.muted{fill:#68706C}.water{fill:#2E7F86}.seal{fill:#985448}.rule{stroke:#C6CECA;stroke-width:1.2}.route{fill:none;stroke:#2E7F86;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.route-soft{fill:none;stroke:#2E7F86;stroke-width:14;stroke-opacity:.08;stroke-linecap:round}.support{fill:none;stroke:#6D817C;stroke-width:7;stroke-linecap:round}.person{fill:none;stroke:#17201E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#F4F3EC;stroke:#C6CECA;stroke-width:1.2}.card-pause{fill:#F4F3EC;stroke:#985448;stroke-width:1.8}</style></defs>
<rect width="1000" height="680" fill="#EDF0E9"/>
<g class="sans">
<text x="48" y="44" font-size="12" font-weight="700" letter-spacing="2.4" class="water">BODY / WALK → PAUSE → LEAN → RECOVER</text>
<text x="48" y="96" class="serif ink" font-size="42" font-weight="700">走累的时候，支持才出现。</text>
<text x="48" y="128" class="muted" font-size="16">连续步行是主线；身体需要成立后才介入，恢复后重新回到路径。</text>
</g>
<line x1="48" y1="154" x2="952" y2="154" class="rule"/>

<g transform="translate(48 188)">
<rect width="430" height="178" rx="2" class="card"/>
<text x="24" y="32" class="sans water" font-size="15" font-weight="700" letter-spacing="2">01 / WALK</text>
<text x="24" y="83" class="serif ink" font-size="42" font-weight="700">继续走</text>
<text x="24" y="119" class="sans muted" font-size="19">压力不明显，不增加对象。</text>
<path d="M286 120 C318 95 346 132 378 106" class="route-soft"/><path d="M286 120 C318 95 346 132 378 106" class="route"/>
<g transform="translate(334 53)" class="person"><circle r="11"/><path d="M0 12l-4 44m-1-26l-24 19m25-16l24 18m-24 24l-20 31m20-31l27 27"/></g>
</g>

<g transform="translate(522 188)">
<rect width="430" height="178" rx="2" class="card-pause"/>
<text x="24" y="32" class="sans seal" font-size="15" font-weight="700" letter-spacing="2">02 / PAUSE · INTERVENTION STARTS</text>
<text x="24" y="83" class="serif ink" font-size="42" font-weight="700">先停下来</text>
<text x="24" y="119" class="sans muted" font-size="19">先给停留、辨向与恢复条件。</text>
<path d="M286 120 C318 95 346 132 378 106" class="route-soft"/><path d="M286 120 C318 95 346 132 378 106" class="route"/>
<g transform="translate(334 53)" class="person"><circle r="11"/><path d="M0 12v44m0-28l-19 25m19-25l19 25m-19 3l-13 38m13-38l13 38"/></g>
</g>

<g transform="translate(48 394)">
<rect width="430" height="178" rx="2" class="card"/>
<text x="24" y="32" class="sans water" font-size="15" font-weight="700" letter-spacing="2">03 / LEAN</text>
<text x="24" y="83" class="serif ink" font-size="42" font-weight="700">短时借力</text>
<text x="24" y="119" class="sans muted" font-size="19">需要支撑，才研究倚靠对象。</text>
<path d="M286 120 C318 95 346 132 378 106" class="route-soft"/><path d="M286 120 C318 95 346 132 378 106" class="route"/>
<path d="M367 109l24-42" class="support"/>
<g transform="translate(338 51) rotate(8)" class="person"><circle r="11"/><path d="M0 12l12 44m-4-27l22 12m-18 15l-11 38m11-38l25 30"/></g>
</g>

<g transform="translate(522 394)">
<rect width="430" height="178" rx="2" class="card"/>
<text x="24" y="32" class="sans water" font-size="15" font-weight="700" letter-spacing="2">04 / RECOVER</text>
<text x="24" y="83" class="serif ink" font-size="42" font-weight="700">恢复，再走</text>
<text x="24" y="119" class="sans muted" font-size="19">支持退出，重新回到路径。</text>
<path d="M286 120 C318 95 346 132 378 106" class="route-soft"/><path d="M286 120 C318 95 346 132 378 106" class="route"/>
<g transform="translate(334 53)" class="person"><circle r="11"/><path d="M0 12l-4 44m-1-26l-24 19m25-16l24 18m-24 24l-20 31m20-31l27 27"/></g>
</g>

<g class="sans">
<path d="M48 601H952" class="rule"/>
<text x="48" y="631" font-size="12" font-weight="700" letter-spacing="2" class="water">BOUNDARY</text>
<text x="148" y="631" font-size="13" class="muted">CONCEPT BODY-USE SCENARIO · NTS · FIELD OPEN · NOT FOR CONSTRUCTION</text>
<text x="952" y="631" text-anchor="end" font-size="11" class="muted">BODY-USE SCENARIO</text>
<text x="48" y="658" font-size="13" class="seal">THRESHOLD · 身体需要成立后，设计才进入。</text>
</g>
</svg>