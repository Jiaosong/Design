<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">清江连续步行中的身体支持关系</title>
<desc id="desc">以走、停、倚、恢复四种身体状态说明：连续步行是主线；身体压力出现后才引入支持，恢复后重新回到路径。具体实体选型、尺寸与连接保持开放。</desc>
<defs><style>
.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}.ink{fill:#17201E}.muted{fill:#68706C}.water{fill:#2E7F86}.seal{fill:#985448}.rule{stroke:#C6CECA;stroke-width:1.2}.route{fill:none;stroke:#2E7F86;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.route-soft{fill:none;stroke:#2E7F86;stroke-width:14;stroke-opacity:.08;stroke-linecap:round}.support{fill:none;stroke:#6D817C;stroke-width:7;stroke-linecap:round}.person{fill:none;stroke:#17201E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#F4F3EC;stroke:#C6CECA;stroke-width:1.2}.card-pause{fill:#F4F3EC;stroke:#985448;stroke-width:2}</style></defs>
<rect width="1000" height="700" fill="#EDF0E9"/>
<g class="sans">
<text x="48" y="44" font-size="15" font-weight="700" letter-spacing="2.2" class="water">BODY / WALK → PAUSE → LEAN → RECOVER</text>
<text x="48" y="98" class="serif ink" font-size="44" font-weight="700">走累的时候，支持才出现。</text>
<text x="48" y="136" class="muted" font-size="24">连续步行是主线；身体需要成立后才介入，恢复后重新回到路径。</text>
</g>
<line x1="48" y1="160" x2="952" y2="160" class="rule"/>

<g transform="translate(48 188)">
<rect width="430" height="184" rx="2" class="card"/>
<text x="24" y="34" class="sans water" font-size="20" font-weight="700" letter-spacing="1.6">01 / WALK</text>
<text x="24" y="86" class="serif ink" font-size="42" font-weight="700">继续走</text>
<text x="24" y="128" class="sans muted" font-size="28">压力不明显，不增加对象。</text>
<path d="M304 132 C330 108 354 138 386 112" class="route-soft"/><path d="M304 132 C330 108 354 138 386 112" class="route"/>
<g transform="translate(350 62)" class="person"><circle r="11"/><path d="M0 12l-4 44m-1-26l-24 19m25-16l24 18m-24 24l-20 31m20-31l27 27"/></g>
</g>

<g transform="translate(522 188)">
<rect width="430" height="184" rx="2" class="card-pause"/>
<text x="24" y="34" class="sans seal" font-size="20" font-weight="700" letter-spacing="1.3">02 / PAUSE · INTERVENTION</text>
<text x="24" y="86" class="serif ink" font-size="42" font-weight="700">先停下来</text>
<text x="24" y="128" class="sans muted" font-size="28">先给停留、辨向与恢复条件。</text>
<path d="M304 132 C330 108 354 138 386 112" class="route-soft"/><path d="M304 132 C330 108 354 138 386 112" class="route"/>
<g transform="translate(350 62)" class="person"><circle r="11"/><path d="M0 12v44m0-28l-19 25m19-25l19 25m-19 3l-13 38m13-38l13 38"/></g>
</g>

<g transform="translate(48 400)">
<rect width="430" height="184" rx="2" class="card"/>
<text x="24" y="34" class="sans water" font-size="20" font-weight="700" letter-spacing="1.6">03 / LEAN</text>
<text x="24" y="86" class="serif ink" font-size="42" font-weight="700">短时借力</text>
<text x="24" y="128" class="sans muted" font-size="28">需要支撑，才研究倚靠对象。</text>
<path d="M304 132 C330 108 354 138 386 112" class="route-soft"/><path d="M304 132 C330 108 354 138 386 112" class="route"/>
<path d="M375 115l22-42" class="support"/>
<g transform="translate(350 60) rotate(8)" class="person"><circle r="11"/><path d="M0 12l12 44m-4-27l22 12m-18 15l-11 38m11-38l25 30"/></g>
</g>

<g transform="translate(522 400)">
<rect width="430" height="184" rx="2" class="card"/>
<text x="24" y="34" class="sans water" font-size="20" font-weight="700" letter-spacing="1.6">04 / RECOVER</text>
<text x="24" y="86" class="serif ink" font-size="42" font-weight="700">恢复，再走</text>
<text x="24" y="128" class="sans muted" font-size="28">支持退出，重新回到路径。</text>
<path d="M304 132 C330 108 354 138 386 112" class="route-soft"/><path d="M304 132 C330 108 354 138 386 112" class="route"/>
<g transform="translate(350 62)" class="person"><circle r="11"/><path d="M0 12l-4 44m-1-26l-24 19m25-16l24 18m-24 24l-20 31m20-31l27 27"/></g>
</g>

<g class="sans">
<path d="M48 612H952" class="rule"/>
<text x="48" y="644" font-size="18" font-weight="700" letter-spacing="1.6" class="water">BOUNDARY</text>
<text x="170" y="644" font-size="20" class="muted">CONCEPT · NTS · FIELD OPEN · NOT FOR CONSTRUCTION</text>
<text x="48" y="678" font-size="22" font-weight="700" class="seal">THRESHOLD · 身体需要成立后，设计才进入。</text>
</g>
</svg>