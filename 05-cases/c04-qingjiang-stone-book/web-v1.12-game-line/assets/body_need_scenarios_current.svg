<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">清江身体需求场景</title><desc id="desc">以连续路径中的走、停、倚、恢复四种身体状态表达实体设计前的需求判断；不绑定具体构件、尺寸或施工结论。</desc>
<defs><style>
.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}.ink{fill:#17201E}.muted{fill:#68706C}.water{fill:#2E7F86}.seal{fill:#985448}.person{fill:none;stroke:#17201E;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#9EBBB6;stroke-width:2}.terrain{fill:none;stroke:#70827E;stroke-width:2.5}.route{fill:none;stroke:#2E7F86;stroke-width:4;stroke-linecap:round}
</style></defs>
<rect width="1600" height="900" fill="#EDF0E9"/>
<g class="sans"><text x="72" y="70" font-size="14" font-weight="700" letter-spacing="3" fill="#2E7F86">PHYSICAL / BODY-NEED SCENARIOS</text><text x="72" y="124" class="serif ink" font-size="42" font-weight="700">先证明身体为什么需要支持，再决定要不要放一个对象。</text><text x="72" y="160" class="muted" font-size="16">当前只表达使用情景和介入门槛；具体实体选型、几何、尺寸与连接仍保持开放。</text></g>
<line x1="72" y1="194" x2="1528" y2="194" stroke="#CAD1CB"/>
<g transform="translate(70 260)">
 <path d="M0 345 C180 276 312 376 468 306 S786 261 956 324 S1235 299 1458 205" class="terrain" opacity=".55"/>
 <path d="M0 374 C198 323 304 420 482 354 S789 310 962 372 S1248 349 1458 258" class="route"/>
 <path d="M104 315 C170 250 237 225 302 242" class="ghost"/><path d="M1160 258 C1248 190 1330 166 1418 179" class="ghost"/>
 <g transform="translate(180 208)" class="person"><circle cx="0" cy="0" r="16"/><path d="M0 18l-7 74m-2-46l-39 32m41-26l38 28m-38 64l-34 51m34-51l43 44"/></g><circle cx="180" cy="374" r="9" fill="#2E7F86"/>
 <g transform="translate(530 202)" class="person"><circle cx="0" cy="0" r="16"/><path d="M0 18v78m0-50l-32 42m32-42l31 42m-31 8l-20 62m20-62l21 62"/></g><circle cx="530" cy="354" r="9" fill="#985448"/><path d="M492 172q38-34 76 0" fill="none" stroke="#985448" stroke-width="2" stroke-dasharray="4 6"/>
 <path d="M856 274l44-72" stroke="#687E79" stroke-width="7" stroke-linecap="round"/><g transform="translate(820 198) rotate(8)" class="person"><circle cx="0" cy="0" r="16"/><path d="M0 18l20 72m-8-48l36 18m-30 30l-18 62m18-62l42 50"/></g><circle cx="842" cy="328" r="9" fill="#2E7F86"/>
 <path d="M1128 301h108" stroke="#687E79" stroke-width="7" stroke-linecap="round"/><g transform="translate(1184 213)" class="person"><circle cx="0" cy="0" r="16"/><path d="M0 18v50m0 22h54m-54-22l22 22m32 0l35 46m-89-46l-28 58"/></g><circle cx="1184" cy="346" r="9" fill="#2E7F86"/>
 <g class="sans"><g transform="translate(110 480)"><text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">01 / WALK</text><text y="42" class="serif ink" font-size="28" font-weight="700">继续走</text><text y="72" class="muted" font-size="14">没有明显身体压力 → 不介入。</text></g><g transform="translate(455 480)"><text font-size="12" font-weight="700" letter-spacing="2" fill="#985448">02 / PAUSE</text><text y="42" class="serif ink" font-size="28" font-weight="700">短暂停</text><text y="72" class="muted" font-size="14">需要看清、辨向或恢复呼吸 → 先给停留条件。</text></g><g transform="translate(790 480)"><text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">03 / LEAN</text><text y="42" class="serif ink" font-size="28" font-weight="700">轻倚靠</text><text y="72" class="muted" font-size="14">短时支撑需求成立 → 才进入身体支持对象研究。</text></g><g transform="translate(1125 480)"><text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">04 / RECOVER</text><text y="42" class="serif ink" font-size="28" font-weight="700">恢复后再走</text><text y="72" class="muted" font-size="14">更长恢复需求 → 必须同时证明位置、路径与维护条件。</text></g></g>
</g>
<g transform="translate(72 844)" class="sans"><rect width="1456" height="1" fill="#CAD1CB"/><text y="34" font-size="12" font-weight="700" fill="#2E7F86" letter-spacing="2">BOUNDARY</text><text x="104" y="34" font-size="13" fill="#5F6662">CONCEPT BODY-USE SCENARIO · NTS · FIELD OPEN · NOT FOR CONSTRUCTION</text><text x="1456" y="34" font-size="11" text-anchor="end" fill="#858980">BODY-USE SCENARIO</text></g>
</svg>
