<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">清江连续步行中的身体支持关系</title>
<desc id="desc">以连续路径中的走、停、倚、恢复四种身体状态说明：身体压力出现后才引入支持，恢复后重新回到路径。具体实体选型、尺寸与连接仍保持开放。</desc>
<defs><style>
.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}
.ink{fill:#17201E}.muted{fill:#68706C}.water{fill:#2E7F86}.seal{fill:#985448}
.person{fill:none;stroke:#17201E;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.terrain{fill:none;stroke:#A7B2AE;stroke-width:2.2}
.route{fill:none;stroke:#2E7F86;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.support{fill:none;stroke:#6D817C;stroke-width:8;stroke-linecap:round}
.leader{fill:none;stroke:#9CA8A4;stroke-width:1.4}
</style></defs>
<rect width="1600" height="900" fill="#EDF0E9"/>
<g class="sans">
  <text x="72" y="66" font-size="13" font-weight="700" letter-spacing="3.2" fill="#2E7F86">BODY / WALK → PAUSE → LEAN → RECOVER</text>
  <text x="72" y="122" class="serif ink" font-size="46" font-weight="700">走累的时候，支持才出现。</text>
  <text x="72" y="159" class="muted" font-size="16">连续步行是主线；停留与倚靠只在身体需要出现时介入，恢复后重新回到路径。</text>
</g>
<line x1="72" y1="194" x2="1528" y2="194" stroke="#CAD1CB"/>
<path d="M72 505 C240 438 346 508 488 470 S744 410 890 456 S1142 548 1302 476 S1448 424 1528 446" class="terrain"/>
<path d="M72 548 C244 500 356 570 508 526 S742 462 906 510 S1136 606 1300 528 S1452 470 1528 492" class="route"/>
<g transform="translate(255 385)" class="person">
 <circle cx="0" cy="0" r="17"/><path d="M0 19l-7 77m-2-46l-42 34m44-28l40 30m-40 68l-36 54m36-54l46 46"/>
</g>
<circle cx="255" cy="515" r="10" fill="#2E7F86"/>
<path d="M255 526V635" class="leader"/>
<g class="sans" transform="translate(150 674)">
 <text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">01 / WALK</text>
 <text y="42" class="serif ink" font-size="30" font-weight="700">继续走</text>
 <text y="74" class="muted" font-size="14">身体压力不明显，不增加对象。</text>
</g>
<g transform="translate(595 360)" class="person">
 <circle cx="0" cy="0" r="17"/><path d="M0 19v80m0-51l-34 44m34-44l33 44m-33 7l-22 66m22-66l23 66"/>
</g>
<path d="M555 329q40-34 80 0" fill="none" stroke="#985448" stroke-width="2.2" stroke-dasharray="4 7"/>
<circle cx="595" cy="500" r="10" fill="#985448"/>
<path d="M595 511V635" class="leader"/>
<g class="sans" transform="translate(492 674)">
 <text font-size="12" font-weight="700" letter-spacing="2" fill="#985448">02 / PAUSE</text>
 <text y="42" class="serif ink" font-size="30" font-weight="700">先停下来</text>
 <text y="74" class="muted" font-size="14">看清、辨向、缓一口气；先给停留条件。</text>
</g>
<path d="M900 506l48-82" class="support"/>
<g transform="translate(858 363) rotate(8)" class="person">
 <circle cx="0" cy="0" r="17"/><path d="M0 19l21 76m-8-50l38 20m-31 31l-19 65m19-65l44 52"/>
</g>
<circle cx="885" cy="493" r="10" fill="#2E7F86"/>
<path d="M885 504V635" class="leader"/>
<g class="sans" transform="translate(813 674)">
 <text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">03 / LEAN</text>
 <text y="42" class="serif ink" font-size="30" font-weight="700">短时借力</text>
 <text y="74" class="muted" font-size="14">支撑需求成立，才研究倚靠对象。</text>
</g>
<path d="M1195 490h116" class="support"/>
<g transform="translate(1251 383)" class="person">
 <circle cx="0" cy="0" r="17"/><path d="M0 19v53m0 23h58m-58-23l23 23m35 0l38 49m-96-49l-30 61"/>
</g>
<circle cx="1251" cy="521" r="10" fill="#2E7F86"/>
<path d="M1251 532V635" class="leader"/>
<g class="sans" transform="translate(1160 674)">
 <text font-size="12" font-weight="700" letter-spacing="2" fill="#2E7F86">04 / RECOVER</text>
 <text y="42" class="serif ink" font-size="30" font-weight="700">恢复，再走</text>
 <text y="74" class="muted" font-size="14">更长停留必须同时证明位置、路径与维护条件。</text>
</g>
<g class="sans">
 <text x="690" y="262" font-size="12" letter-spacing="2.4" font-weight="700" fill="#68706C">INTERVENTION THRESHOLD</text>
 <path d="M716 282H1044" stroke="#985448" stroke-width="2"/>
 <circle cx="716" cy="282" r="4" fill="#985448"/><circle cx="1044" cy="282" r="4" fill="#985448"/>
 <text x="880" y="310" text-anchor="middle" font-size="14" fill="#985448">身体需要成立后，设计才进入。</text>
</g>
<g transform="translate(72 844)" class="sans">
 <rect width="1456" height="1" fill="#CAD1CB"/>
 <text y="34" font-size="12" font-weight="700" fill="#2E7F86" letter-spacing="2">BOUNDARY</text>
 <text x="104" y="34" font-size="13" fill="#5F6662">CONCEPT BODY-USE SCENARIO · NTS · FIELD OPEN · NOT FOR CONSTRUCTION</text>
 <text x="1456" y="34" font-size="11" text-anchor="end" fill="#858980">BODY-USE SCENARIO</text>
</g>
</svg>