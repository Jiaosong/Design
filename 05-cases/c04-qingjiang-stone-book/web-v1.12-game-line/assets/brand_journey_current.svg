<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Qingjiang Brand Journey Grammar</title><desc id="desc">Editable visual grammar connecting line, seal, page and trace to route, discovery, reveal and memory.</desc><rect width="1200" height="900" fill="#0e2925"/><g font-family="Arial,Helvetica,sans-serif" fill="#f2f0e8"><text x="80" y="95" font-size="20" letter-spacing="4" opacity=".65">QINGJIANG / MEMORY GRAMMAR</text><text x="80" y="165" font-size="52" font-weight="700">山水是正文，设计只是翻页的方法。</text></g><g font-family="Arial,Helvetica,sans-serif" fill="#f2f0e8"><g transform="translate(80 285)"><path d="M0 90C120 15 230 135 360 48" fill="none" stroke="#f2f0e8" stroke-width="3"/><text y="155" font-size="30">LINE</text><text y="190" font-size="17" opacity=".62">路线 / 河流 / 关系</text></g><g transform="translate(650 260)"><rect x="0" y="0" width="150" height="150" rx="12" fill="none" stroke="#f2f0e8" stroke-width="3"/><path d="M35 105L70 55L115 110" fill="none" stroke="#f2f0e8" stroke-width="3"/><text x="190" y="70" font-size="30">SEAL</text><text x="190" y="108" font-size="17" opacity=".62">发现 / 保存 / 记忆</text></g><g transform="translate(80 565)"><path d="M0 0H310V180H0Z M155 0V180" fill="none" stroke="#f2f0e8" stroke-width="3"/><text x="355" y="75" font-size="30">PAGE</text><text x="355" y="113" font-size="17" opacity=".62">Reveal / Layer / Fold</text></g><g transform="translate(650 580)"><path d="M0 120C90 0 190 160 350 35" fill="none" stroke="#f2f0e8" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/><text x="0" y="190" font-size="30">TRACE</text><text x="0" y="225" font-size="17" opacity=".62">行走 / 记录 / 再认出</text></g></g></svg>