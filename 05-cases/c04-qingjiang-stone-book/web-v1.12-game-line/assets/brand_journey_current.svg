<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">清江品牌与游程语法</title>
<desc id="desc">以线、印、页、迹连接路线判断、发现、内容展开与离开后的记忆。</desc>
<rect width="1200" height="900" fill="#0e2925"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" fill="#f2f0e8">
  <text x="80" y="78" font-size="15" letter-spacing="3.2" opacity=".62">QINGJIANG / JOURNEY → MEMORY</text>
  <text x="80" y="138" font-size="48" font-weight="700">从看见清江，到把它带走。</text>
  <text x="80" y="180" font-size="18" opacity=".68">山水是正文，设计只是翻页的方法。</text>
</g>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" fill="#f2f0e8">
  <g transform="translate(80 285)">
    <path d="M0 90C120 15 230 135 360 48" fill="none" stroke="#f2f0e8" stroke-width="3"/>
    <text y="155" font-size="28" font-weight="700">LINE / 线</text>
    <text y="188" font-size="16" opacity=".68">路线 / 河流 / 关系</text>
    <text y="220" font-size="15">沿河辨方向，把移动关系连起来</text>
  </g>
  <g transform="translate(650 260)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="none" stroke="#f2f0e8" stroke-width="3"/>
    <path d="M35 105L70 55L115 110" fill="none" stroke="#f2f0e8" stroke-width="3"/>
    <text x="190" y="70" font-size="28" font-weight="700">SEAL / 印</text>
    <text x="190" y="103" font-size="16" opacity=".68">发现 / 保存 / 记忆</text>
    <text x="190" y="135" font-size="15">在发现处留下可带走的记忆标记</text>
  </g>
  <g transform="translate(80 565)">
    <path d="M0 0H310V180H0Z M155 0V180" fill="none" stroke="#f2f0e8" stroke-width="3"/>
    <text x="355" y="58" font-size="28" font-weight="700">PAGE / 页</text>
    <text x="355" y="91" font-size="16" opacity=".68">展开 / 分层 / 折叠</text>
    <text x="355" y="123" font-size="15">停下时打开内容，走动时让出视线</text>
  </g>
  <g transform="translate(650 580)">
    <path d="M0 120C90 0 190 160 350 35" fill="none" stroke="#f2f0e8" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
    <text x="0" y="190" font-size="28" font-weight="700">TRACE / 迹</text>
    <text x="0" y="223" font-size="16" opacity=".68">行走 / 记录 / 再认出</text>
    <text x="0" y="255" font-size="15">把行走痕迹带到回程与离开之后</text>
  </g>
</g>
</svg>