<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">清江回程关系</title>
<desc id="desc">以路线连续性、纸本、标识、人工服务和数字辅助表达无手机仍可回程的概念关系。仅表达设计原则，不声明现场位置、距离、容量或工程事实。</desc>
<defs>
  <style>
    .sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
    .paper{fill:#F1EEE5}.soft{fill:#8FA49F}.water{fill:#8FD5D1}.seal{fill:#C88C79}
    .route{fill:none;stroke:#8FD5D1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .route-soft{fill:none;stroke:#8FD5D1;stroke-width:22;stroke-opacity:.10;stroke-linecap:round;stroke-linejoin:round}
    .hair{fill:none;stroke:#91AAA4;stroke-width:1.2;stroke-opacity:.32}
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07151A"/><stop offset="1" stop-color="#10282D"/>
  </linearGradient>
  <radialGradient id="mist" cx="78%" cy="32%" r="52%">
    <stop offset="0" stop-color="#28737B" stop-opacity=".20"/><stop offset="1" stop-color="#28737B" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#mist)"/>

<g class="sans">
  <text x="84" y="78" font-size="13" font-weight="700" letter-spacing="3.2" class="water">RETURN / CONTINUE</text>
  <text x="84" y="111" font-size="14" class="soft">路线先于界面；纸本、标识与人工服务在需要时接住返回。</text>
</g>

<g transform="translate(84 188)">
  <path d="M0 122 C165 34 304 198 462 119 S744 12 900 104 S1190 189 1410 92" class="route-soft"/>
  <path d="M0 122 C165 34 304 198 462 119 S744 12 900 104 S1190 189 1410 92" class="route"/>
  <path d="M1320 126 C1360 114 1394 101 1418 88" class="route"/>
  <path d="M1392 79 L1422 87 L1404 112" class="route"/>
  <g class="sans">
    <g transform="translate(86 86)">
      <circle r="9" fill="#8FD5D1"/>
      <text x="0" y="44" font-size="12" font-weight="700" fill="#EEF3EF">继续走</text>
      <text x="0" y="64" font-size="10" class="soft">沿路线判断</text>
    </g>
    <g transform="translate(420 131)">
      <circle r="10" fill="#8FD5D1"/>
      <text x="-8" y="48" font-size="12" font-weight="700" fill="#EEF3EF">需要确认</text>
      <text x="-8" y="68" font-size="10" class="soft">看纸本 / 标识</text>
    </g>
    <g transform="translate(760 50)">
      <circle r="10" fill="#C88C79"/>
      <text x="-8" y="48" font-size="12" font-weight="700" fill="#EEF3EF">状态不确定</text>
      <text x="-8" y="68" font-size="10" class="soft">问人工服务</text>
    </g>
    <g transform="translate(1110 135)">
      <circle r="10" fill="#8FD5D1"/>
      <text x="-8" y="48" font-size="12" font-weight="700" fill="#EEF3EF">重新确认方向</text>
      <text x="-8" y="68" font-size="10" class="soft">继续返回</text>
    </g>
  </g>
  <g transform="translate(1216 -30)" class="sans">
    <rect width="194" height="74" rx="37" fill="none" stroke="#90A6A1" stroke-width="1.2" stroke-opacity=".45"/>
    <circle cx="34" cy="37" r="12" fill="none" stroke="#90A6A1" stroke-width="1.2"/>
    <path d="M30 37h8M34 33v8" stroke="#90A6A1" stroke-width="1.2" stroke-linecap="round"/>
    <text x="58" y="32" font-size="11" fill="#EEF3EF">数字辅助</text>
    <text x="58" y="51" font-size="9.5" class="soft">可退场，不是唯一入口</text>
  </g>
</g>

<g transform="translate(84 526)" class="sans">
  <line x1="0" y1="0" x2="1432" y2="0" class="hair"/>
  <text x="0" y="42" font-size="12" font-weight="700" letter-spacing="2" class="water">ROUTE + PAPER + SIGNAGE + HUMAN SERVICE</text>
  <text x="0" y="74" font-size="13" class="soft">概念服务关系：强调无手机仍可返回；不提供现场定位、距离、容量或运营既成事实。</text>
  <g transform="translate(1156 18)">
    <rect width="276" height="68" rx="2" fill="#F1EEE5"/>
    <text x="20" y="28" font-size="10" font-weight="800" letter-spacing="1.8" fill="#2E747B">RETURN REMAINS AVAILABLE</text>
    <text x="20" y="50" font-size="12" fill="#17201E">数字关闭后，关系仍不断。</text>
  </g>
</g>
</svg>