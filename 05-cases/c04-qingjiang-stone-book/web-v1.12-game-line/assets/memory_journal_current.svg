<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">清江旅记纸本记忆使用态</title>
<desc id="desc">可编辑纸本记忆应用资产。以封面、路线痕迹、自由书写和夹入物四种动作表达旅行记忆；无手机仍成立，不使用完成率或任务计分。</desc>
<defs><style>
.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}.ink{fill:#17201E}.muted{fill:#666E69}.water{fill:#2E7F86}.seal{fill:#985448}.hair{stroke:#C9C2B5;stroke-width:1}.paper{fill:#F8F4EB;stroke:#CEC6B8;stroke-width:1}.label{font-size:13px;font-weight:700;letter-spacing:1.8px}.body{font-size:18px}.micro{font-size:14px}
</style></defs>
<rect width="1000" height="700" fill="#E7E2D7"/>
<g class="sans">
 <text x="52" y="48" class="water label">QINGJIANG / PAPER MEMORY</text>
 <text x="52" y="92" class="serif ink" font-size="34" font-weight="700">纸页留下旅行，不证明“完成”。</text>
 <text x="52" y="124" class="muted" font-size="17">可以写、折、夹、留白；无手机时仍然成立，也可以什么都不记录。</text>
</g>
<line x1="52" y1="148" x2="948" y2="148" class="hair"/>

<g transform="translate(54 190) rotate(-2 145 205)">
 <rect width="290" height="410" rx="4" class="paper"/>
 <rect x="20" y="20" width="250" height="370" fill="none" stroke="#D5CCBC"/>
 <text x="38" y="58" class="sans muted" font-size="11" letter-spacing="2">QINGJIANG STONE BOOK</text>
 <text x="38" y="118" class="serif ink" font-size="45" font-weight="700">清江旅记</text>
 <path d="M38 230 C92 180 144 252 198 204 S246 190 258 207" fill="none" stroke="#2E7F86" stroke-width="3"/>
 <circle cx="198" cy="204" r="11" fill="#F8F4EB" stroke="#985448" stroke-width="2.5"/>
 <text x="38" y="348" class="serif muted" font-size="18">留给这一次清江。</text>
</g>

<g transform="translate(386 184)">
 <path d="M0 24 Q142 0 278 18 L278 430 Q140 408 0 430 Z" class="paper"/>
 <path d="M278 18 Q418 0 558 24 L558 430 Q418 408 278 430 Z" fill="#F5F0E6" stroke="#CEC6B8"/>
 <path d="M278 22V426" stroke="#C8C0B2"/>
 <g class="sans">
  <text x="26" y="62" class="water label">01 / 圈一个停留</text>
  <text x="304" y="62" class="seal label">02 / 写一句话</text>
 </g>
 <path d="M28 124 C76 84 126 146 174 106 S232 100 252 119" fill="none" stroke="#A8CFCB" stroke-width="11" stroke-linecap="round" opacity=".45"/>
 <path d="M28 124 C76 84 126 146 174 106 S232 100 252 119" fill="none" stroke="#2E7F86" stroke-width="2.5" stroke-linecap="round"/>
 <circle cx="174" cy="106" r="8" fill="#F8F4EB" stroke="#985448" stroke-width="2"/>
 <text x="28" y="176" class="sans ink body">路线只留下痕迹，</text>
 <text x="28" y="202" class="sans ink body">不变成 13/13。</text>
 <line x1="28" y1="250" x2="244" y2="250" class="hair"/><line x1="28" y1="292" x2="244" y2="292" class="hair"/>
 <text x="28" y="342" class="sans muted micro">可以只圈一个点，</text><text x="28" y="364" class="sans muted micro">也可以整页留白。</text>

 <line x1="306" y1="124" x2="526" y2="124" class="hair"/><line x1="306" y1="176" x2="526" y2="176" class="hair"/>
 <path d="M312 145 C350 116 386 164 424 140" fill="none" stroke="#985448" stroke-width="2.3" stroke-linecap="round"/>
 <text x="306" y="224" class="serif ink" font-size="21">“今天最想记住的是</text>
 <text x="306" y="254" class="serif ink" font-size="21">__________ ”</text>
 <rect x="306" y="300" width="210" height="74" rx="2" fill="none" stroke="#B9B1A4"/>
 <text x="322" y="328" class="sans muted micro">03 / 夹入自己的东西</text>
 <path d="M322 350h112" stroke="#2E7F86" stroke-width="2"/><circle cx="454" cy="350" r="8" fill="none" stroke="#985448" stroke-width="2"/>
</g>

<g transform="translate(52 642)" class="sans">
 <text class="water label">MEMORY RULE</text>
 <text x="148" class="ink" font-size="15" font-weight="700">个人痕迹属于游客。</text>
 <text x="310" class="muted" font-size="15">路线可记录，但不转换成完成率；纸页不是任务成绩。</text>
 <text x="896" font-size="11" text-anchor="end" fill="#858980">QINGJIANG JOURNAL</text>
</g>
</svg>