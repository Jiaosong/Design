<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">清江旅记纸本记忆成品使用态</title>
  <desc id="desc">可编辑纸本记忆资产：封面、展开页、折页与夹入物共同形成真实纸本使用态。路线只留下个人痕迹，不形成十三印完成率；无手机仍成立，也允许整页留白。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}
      .ink{fill:#17201E}.muted{fill:#6D746F}.water{fill:#2E7F86}.seal{fill:#985448}.paper{fill:#FAF7EF}.paper2{fill:#F2EDE2}.edge{stroke:#C8C0B3;stroke-width:1.2}.hair{stroke:#D7D0C5;stroke-width:1}.route{fill:none;stroke:#2E7F86;stroke-width:2.5;stroke-linecap:round}.route-soft{fill:none;stroke:#B9D8D5;stroke-width:11;stroke-linecap:round;opacity:.5}.label{font-size:11px;font-weight:700;letter-spacing:1.8px}.micro{font-size:11px}.body{font-size:15px}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17201E" flood-opacity=".16"/></filter>
  </defs>

  <rect width="1000" height="700" fill="#E7E2D7"/>

  <!-- Actual paper object: cover -->
  <g transform="translate(72 118) rotate(-5 144 220)" filter="url(#shadow)">
    <rect width="288" height="440" rx="5" class="paper edge"/>
    <rect x="20" y="20" width="248" height="400" fill="none" stroke="#D8D0C2"/>
    <text x="38" y="56" class="sans muted label">QINGJIANG STONE BOOK</text>
    <text x="38" y="128" class="serif ink" font-size="48" font-weight="700">清江旅记</text>
    <text x="40" y="158" class="sans muted micro">MY QINGJIANG NOTES</text>
    <path d="M38 258 C92 216 144 281 198 239 S246 224 256 240" class="route-soft"/>
    <path d="M38 258 C92 216 144 281 198 239 S246 224 256 240" class="route"/>
    <circle cx="198" cy="239" r="10" fill="#FAF7EF" stroke="#985448" stroke-width="2.3"/>
    <text x="38" y="367" class="serif muted" font-size="18">留给这一次清江。</text>
    <text x="38" y="394" class="sans muted micro">可写 · 可夹 · 可留白</text>
  </g>

  <!-- Actual paper object: open spread -->
  <g transform="translate(370 98) rotate(2 275 226)" filter="url(#shadow)">
    <path d="M0 28 Q139 3 275 22 L275 448 Q139 428 0 452 Z" class="paper edge"/>
    <path d="M275 22 Q413 4 552 28 L552 452 Q414 428 275 448 Z" class="paper2 edge"/>
    <path d="M275 26V444" stroke="#C6BFB2" stroke-width="1.2"/>

    <!-- left page / personal route trace -->
    <text x="28" y="68" class="sans water label">圈一个停留</text>
    <path d="M30 132 C78 93 126 154 177 116 S230 111 248 128" class="route-soft"/>
    <path d="M30 132 C78 93 126 154 177 116 S230 111 248 128" class="route"/>
    <circle cx="177" cy="116" r="8" fill="#FAF7EF" stroke="#985448" stroke-width="2"/>
    <text x="30" y="186" class="sans ink body">这一次，我停在这里。</text>
    <line x1="30" y1="230" x2="240" y2="230" class="hair"/>
    <line x1="30" y1="270" x2="240" y2="270" class="hair"/>
    <text x="30" y="316" class="sans muted micro">路线只留个人痕迹，</text>
    <text x="30" y="336" class="sans muted micro">不转换成 13/13。</text>

    <!-- right page / writing + inserted trace -->
    <text x="304" y="68" class="sans seal label">写一句话</text>
    <text x="304" y="125" class="serif ink" font-size="20">“今天最想记住的是</text>
    <text x="304" y="158" class="serif ink" font-size="20">__________________ ”</text>
    <path d="M310 190 C348 160 386 208 424 184" fill="none" stroke="#985448" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="304" y1="236" x2="520" y2="236" class="hair"/>
    <line x1="304" y1="278" x2="520" y2="278" class="hair"/>
    <text x="304" y="324" class="sans muted micro">可以写，也可以整页留白。</text>

    <!-- inserted ticket / leaf proxy as plain editable shape -->
    <g transform="translate(344 352) rotate(-8 82 42)">
      <rect width="164" height="84" rx="3" fill="#EEE3CF" stroke="#BDAF98"/>
      <text x="18" y="28" class="sans muted micro">夹入自己的东西</text>
      <path d="M18 55h86" stroke="#2E7F86" stroke-width="2"/>
      <circle cx="124" cy="55" r="7" fill="none" stroke="#985448" stroke-width="2"/>
    </g>
  </g>

  <!-- Fold / pocket detail, shown as part of the object rather than an explanatory board -->
  <g transform="translate(702 510) rotate(4 100 60)" filter="url(#shadow)">
    <path d="M0 0h198v112H0z" fill="#F7F1E5" stroke="#C8C0B3"/>
    <path d="M0 42 L99 92 L198 42" fill="none" stroke="#C8C0B3"/>
    <text x="18" y="26" class="sans muted micro">POCKET / PERSONAL TRACE</text>
    <text x="18" y="102" class="serif ink" font-size="15">票据、叶片、空白都可以留下。</text>
  </g>

  <!-- Only a restrained object caption remains outside the product -->
  <g class="sans">
    <text x="52" y="48" class="water label">QINGJIANG JOURNAL / PHYSICAL MEMORY</text>
    <text x="52" y="77" class="muted" font-size="13">纸本记忆是可使用的对象，不是完成证明；无手机仍成立。</text>
    <text x="948" y="652" text-anchor="end" class="muted micro">EDITABLE VECTOR · CONCEPT PRODUCT · PRODUCTION DETAIL OPEN</text>
    <text x="948" y="674" text-anchor="end" class="seal micro">NO COMPLETION SCORE · OPTIONAL USE</text>
  </g>
</svg>
