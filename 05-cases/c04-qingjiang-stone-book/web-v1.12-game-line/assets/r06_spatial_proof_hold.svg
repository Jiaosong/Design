<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">R06 Spatial Proof Interface — Authority Hold</title><desc id="desc">No site-measured spatial proof is claimed. The panel records the verification relationship between location, path, body and landscape.</desc><rect width="1200" height="720" fill="#f3f2ed"/><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="80" y="90" font-size="20" letter-spacing="4">R06 / SPATIAL PROOF INTERFACE</text><text x="80" y="160" font-size="52" font-weight="700">AUTHORITY HOLD</text><text x="80" y="205" font-size="19">FIELD OBSERVED = 0 · FIELD MEASURED = 0</text></g><g fill="none" stroke="#173c37" stroke-width="2"><path d="M90 500C230 350 420 445 560 330S870 270 1110 360"/><path d="M155 485C310 455 490 500 700 430S940 405 1060 435" stroke-dasharray="10 10"/><circle cx="350" cy="430" r="10"/><circle cx="760" cy="375" r="10"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="85" y="590" font-size="18">VERIFY LOCATION → PATH → BODY → LANDSCAPE RELATION</text><text x="85" y="640" font-size="16" opacity=".65">No slope, width, elevation, foundation or safety value is promoted without authoritative source / field verification.</text></g></svg>