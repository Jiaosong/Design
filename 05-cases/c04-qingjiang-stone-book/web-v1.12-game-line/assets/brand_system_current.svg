<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">清江石书品牌系统应用</title>
<desc id="desc">以路线、印、页与个人痕迹构成的可编辑品牌应用资产。路线提供连续性，纸页承接记忆，印记形成记忆锚点，数字页签只在需要时出现；品牌不置于景观之前。</desc>
<defs><style>.sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}.ink{fill:#17201E}.muted{fill:#626A66}.water{fill:#2E7F86}.seal{fill:#985448}.paper{fill:#F3F0E7}.hair{fill:none;stroke:#CBC6BA;stroke-width:1}</style></defs>
<rect width="1000" height="900" fill="#E9E5DB"/>
<g class="sans"><text x="54" y="52" font-size="13" font-weight="700" letter-spacing="2.5" class="water">QINGJIANG STONE BOOK / BRAND IN JOURNEY</text><text x="54" y="98" class="serif ink" font-size="34" font-weight="700">识别跟着路线出现，不盖过山水。</text><text x="54" y="130" class="muted" font-size="16">LINE · PAGE · SEAL · TRACE 进入真实媒介角色；景观强时，品牌主动退后。</text></g>
<line x1="54" y1="158" x2="946" y2="158" class="hair"/>
<g transform="translate(54 196)" class="sans"><text font-size="12" font-weight="700" letter-spacing="2" class="water">01 / ROUTE STRIP · 连续性</text><rect y="28" width="892" height="150" rx="3" fill="#F6F3EA" stroke="#D7D1C4"/><path d="M38 100 C150 46 238 138 350 83 S555 65 650 108 S790 76 850 91" fill="none" stroke="#B8D6D3" stroke-width="15" stroke-linecap="round" opacity=".55"/><path d="M38 100 C150 46 238 138 350 83 S555 65 650 108 S790 76 850 91" fill="none" stroke="#2E7F86" stroke-width="3" stroke-linecap="round"/><g font-size="13" class="ink"><circle cx="92" cy="78" r="7" fill="#F6F3EA" stroke="#2E7F86" stroke-width="2"/><text x="92" y="142" text-anchor="middle">出发</text><circle cx="350" cy="83" r="8" fill="#F6F3EA" stroke="#985448" stroke-width="2"/><text x="350" y="142" text-anchor="middle">可选阅读</text><circle cx="650" cy="108" r="7" fill="#F6F3EA" stroke="#2E7F86" stroke-width="2"/><text x="650" y="142" text-anchor="middle">停留</text><text x="820" y="142" text-anchor="middle" class="seal">回程优先 →</text></g></g>
<g transform="translate(54 420)" class="sans"><text font-size="12" font-weight="700" letter-spacing="2" class="water">02 / PAPER MEMORY · 带走自己的句子</text><rect y="28" width="430" height="320" rx="4" fill="#F8F5ED"/><rect x="22" y="50" width="386" height="276" fill="none" stroke="#CFC9BC"/><text x="48" y="112" class="serif ink" font-size="42" font-weight="700">清江石书</text><text x="50" y="142" class="muted" font-size="12" letter-spacing="1.8">MY QINGJIANG NOTES</text><path d="M48 246 C120 202 195 270 270 222 S352 220 382 232" fill="none" stroke="#2E7F86" stroke-width="2.5"/><circle cx="270" cy="222" r="12" fill="none" stroke="#985448" stroke-width="2"/><text x="48" y="298" font-size="14" class="muted">路线留下痕迹，纸页保留自己的句子。</text></g>
<g transform="translate(516 420)" class="sans"><text font-size="12" font-weight="700" letter-spacing="2" class="water">03 / SEAL + PAGE · 需要时才打开</text><rect y="28" width="430" height="320" rx="4" fill="#0B2026"/><g transform="translate(28 60)"><rect width="126" height="126" rx="2" fill="none" stroke="#985448" stroke-width="3"/><path d="M30 92 C56 55 78 58 100 34 M34 38 C58 61 78 80 101 98" fill="none" stroke="#D5B3A9" stroke-width="3"/><circle cx="65" cy="65" r="10" fill="#985448"/><text x="0" y="160" font-size="13" fill="#E9F0EC">发现处留下记忆锚点</text></g><g transform="translate(190 64)"><rect width="210" height="46" rx="23" fill="#F0EEE6"/><circle cx="25" cy="23" r="6" fill="#985448"/><text x="42" y="29" font-size="13" class="ink">河谷 · 按需打开</text><rect y="66" width="184" height="46" rx="23" fill="none" stroke="#5F7773"/><text x="24" y="95" font-size="13" fill="#C1CECA">← 返回真实景观</text><text y="160" font-size="12" fill="#83938E">高景观注意力时，</text><text y="180" font-size="12" fill="#83938E">品牌强度可接近 OFF。</text></g></g>
<g transform="translate(54 814)" class="sans"><line x1="0" y1="-20" x2="892" y2="-20" class="hair"/><text font-size="11" font-weight="700" letter-spacing="1.8" class="water">SYSTEM RULE</text><text x="116" font-size="13" class="muted">路线连续 · 印记锚定 · 页按需打开 · 痕迹来自真实行走与记录</text><text x="892" y="32" text-anchor="end" font-size="12" class="seal">LANDSCAPE FIRST · BRAND STEPS BACK</text></g>
</svg>