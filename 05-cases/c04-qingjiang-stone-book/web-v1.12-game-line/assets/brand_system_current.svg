<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">清江石书品牌系统应用</title>
<desc id="desc">以清江路线、印、页与个人痕迹构成的可编辑品牌应用资产，展示地图条带、纸本封面、印记与数字页签，不把品牌置于景观之前。</desc>
<defs>
  <style>
    .sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
    .serif{font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}
    .hair{fill:none;stroke:#B7B3A8;stroke-width:1}
    .ink{fill:#17201E}.muted{fill:#6C716D}.water{fill:#2E7F86}.seal{fill:#985448}.paper{fill:#F3F0E7}
  </style>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071318" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1000" fill="#E9E5DB"/>
<g class="sans">
  <text x="76" y="72" font-size="15" font-weight="700" letter-spacing="3.2" fill="#2E7F86">QINGJIANG STONE BOOK / BRAND APPLICATION</text>
  <text x="76" y="126" class="serif ink" font-size="42" font-weight="700">让识别跟着路线出现，不盖过山水。</text>
  <text x="76" y="160" class="muted" font-size="16">LINE · SEAL · PAGE · TRACE 被落实到真实媒介角色，而不是做成一张符号说明板。</text>
</g>
<line x1="76" y1="194" x2="1524" y2="194" stroke="#CBC6BA"/>
<g transform="translate(76 240)">
  <text class="sans muted" font-size="13" font-weight="700" letter-spacing="2.4">01 / ROUTE STRIP</text>
  <rect x="0" y="32" width="1448" height="164" rx="2" fill="#F5F2E9" stroke="#D7D1C4"/>
  <path d="M48 118 C190 54 318 164 462 94 S716 75 855 124 S1108 72 1398 108" fill="none" stroke="#B8D6D3" stroke-width="16" stroke-linecap="round" opacity=".55"/>
  <path d="M48 118 C190 54 318 164 462 94 S716 75 855 124 S1108 72 1398 108" fill="none" stroke="#2E7F86" stroke-width="3.5" stroke-linecap="round"/>
  <g class="sans" font-size="12" fill="#17201E">
    <circle cx="112" cy="92" r="7" fill="#F5F2E9" stroke="#2E7F86" stroke-width="2"/><text x="112" y="151" text-anchor="middle">出发</text>
    <circle cx="536" cy="77" r="7" fill="#F5F2E9" stroke="#985448" stroke-width="2.5"/><text x="536" y="151" text-anchor="middle">可选阅读</text>
    <circle cx="960" cy="118" r="7" fill="#F5F2E9" stroke="#2E7F86" stroke-width="2"/><text x="960" y="151" text-anchor="middle">停留</text>
    <path d="M1280 88h88" stroke="#985448" stroke-width="2"/><path d="M1356 78l14 10-14 10" fill="none" stroke="#985448" stroke-width="2"/><text x="1324" y="151" text-anchor="middle">回程优先</text>
  </g>
</g>
<g transform="translate(76 496)">
  <text class="sans muted" font-size="13" font-weight="700" letter-spacing="2.4">02 / PAPER MEMORY</text>
  <g transform="translate(0 34)">
    <rect width="650" height="350" rx="4" fill="#F8F5ED"/>
    <rect x="28" y="28" width="594" height="294" fill="none" stroke="#CFC9BC"/>
    <path d="M76 225 C182 164 282 259 389 190 S535 179 580 204" fill="none" stroke="#2E7F86" stroke-width="2.5"/>
    <circle cx="390" cy="190" r="13" fill="none" stroke="#985448" stroke-width="2"/>
    <text x="76" y="94" class="serif ink" font-size="54" font-weight="700">清江石书</text>
    <text x="78" y="127" class="sans muted" font-size="13" letter-spacing="2">MY QINGJIANG NOTES</text>
    <text x="78" y="286" class="sans muted" font-size="13">路线留下痕迹，纸页保留自己的句子。</text>
  </g>
  <g transform="translate(720 34)">
    <rect width="728" height="350" rx="4" fill="#0B2026"/>
    <text x="42" y="54" class="sans" fill="#82CECA" font-size="12" font-weight="700" letter-spacing="2.4">03 / SEAL + PAGE TAB</text>
    <g transform="translate(52 92)">
      <rect width="196" height="196" rx="2" fill="none" stroke="#8E4F45" stroke-width="3"/>
      <path d="M43 142 C84 88 114 88 153 48 M50 52 C84 87 111 112 149 145" fill="none" stroke="#D5B3A9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="101" cy="101" r="14" fill="#8E4F45"/>
      <text x="98" y="234" class="sans" fill="#E9F0EC" font-size="13" text-anchor="middle">发现不是打卡，是留下一个记号</text>
    </g>
    <g transform="translate(322 92)" class="sans">
      <rect x="0" y="0" width="342" height="52" rx="26" fill="#F0EEE6"/>
      <circle cx="28" cy="26" r="7" fill="#985448"/><text x="48" y="32" font-size="14" fill="#17201E">河谷 · 只在需要时打开</text>
      <rect x="0" y="74" width="268" height="52" rx="26" fill="none" stroke="#5F7773"/>
      <path d="M22 100h38" stroke="#82CECA" stroke-width="2"/><text x="75" y="106" font-size="14" fill="#C1CECA">返回真实景观</text>
      <path d="M0 170H310" stroke="#46605B"/>
      <text x="0" y="204" font-size="12" fill="#83938E">品牌强度随场景降低；高景观注意力时可接近 OFF。</text>
    </g>
  </g>
</g>
<g transform="translate(76 930)" class="sans">
  <text font-size="12" font-weight="700" fill="#2E7F86" letter-spacing="2.2">SYSTEM RULE</text>
  <text x="132" font-size="13" fill="#5F6662">路线提供连续性 · 印记提供记忆锚点 · 页提供可选层 · 痕迹来自真实行走与记录</text>
  <text x="1448" font-size="11" text-anchor="end" fill="#858980">QINGJIANG STONE BOOK</text>
</g>
</svg>
