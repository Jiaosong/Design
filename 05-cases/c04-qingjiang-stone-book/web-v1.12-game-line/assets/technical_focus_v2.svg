<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Technical Relation Validation Interface</title><desc id="desc">Editable authority-hold panel showing the technical validation sequence without asserting unbound geometry.</desc><rect width="1400" height="800" fill="#f4f3ee"/><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="90" y="100" font-size="22" letter-spacing="4">TECHNICAL RELATION / VALIDATION INTERFACE</text><text x="90" y="175" font-size="54" font-weight="700">AUTHORITY HOLD</text><text x="90" y="225" font-size="20">GEOMETRY / FIELD VALUES ARE NOT CURRENTLY BOUND</text></g><g font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#173c37" text-anchor="middle"><rect x="90" y="355" width="190" height="100" rx="50" fill="none" stroke="#173c37" stroke-width="2"/><text x="185" y="415">USE</text><rect x="345" y="355" width="190" height="100" rx="50" fill="none" stroke="#173c37" stroke-width="2"/><text x="440" y="415">GEOMETRY</text><rect x="600" y="355" width="190" height="100" rx="50" fill="none" stroke="#173c37" stroke-width="2"/><text x="695" y="415">MATERIAL</text><rect x="855" y="355" width="190" height="100" rx="50" fill="none" stroke="#173c37" stroke-width="2"/><text x="950" y="415">CONNECTION</text><rect x="1110" y="355" width="200" height="100" rx="50" fill="none" stroke="#173c37" stroke-width="2"/><text x="1210" y="415">MAINTENANCE</text></g><g stroke="#173c37" stroke-width="2" fill="none" opacity=".65"><path d="M280 405H345M535 405H600M790 405H855M1045 405H1110"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="90" y="650" font-size="19">This panel preserves the validation route only. It is not field proof, a construction drawing, or a substitute for the authoritative model/drawing source.</text><text x="90" y="700" font-size="16" opacity=".65">SOURCE BINDING → NATIVE READBACK → TECHNICAL REVIEW required before promotion.</text></g></svg>