      <circle cx="20" cy="14" r="9"/><path d="M20 24V60M20 36L4 48M20 36L37 46M20 60L8 82M20 60L36 82"/>
    </g>
    <g transform="translate(412 69)" class="body">
      <circle cx="20" cy="14" r="9"/><path d="M20 24V60M20 36L4 48M20 36L37 46M20 60L8 82M20 60L36 82"/>
    </g>
    <g transform="translate(646 69)" class="body">
      <circle cx="20" cy="14" r="9"/><path d="M20 24V60M20 36L4 48M20 36L37 46M20 60L8 82M20 60L36 82"/>
    </g>
    <rect x="866" y="88" width="16" height="60" rx="8" class="glow" opacity=".72"/>
    <text x="22" y="217" class="xs qing">PRIMARY WALKING FIELD / CONTINUOUS</text>
    <text x="735" y="217" class="xs qing">EDGE RESPONSE</text>
    <text x="924" y="217" class="xs seal">SERVICE SIDE</text>
    <text x="994" y="84" class="sm ink">身体正常通过</text>
    <text x="994" y="107" class="sm muted">不需要踩中目标</text>
    <text x="994" y="130" class="sm muted">不改变路线权威</text>
    <text x="994" y="153" class="sm muted">短段回应后退暗</text>
  </g>

  <g transform="translate(54 474)">
