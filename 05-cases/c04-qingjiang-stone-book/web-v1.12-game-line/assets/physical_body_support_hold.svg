    <text x="22" y="32" class="xs qing">SECTION RELATION / EDITABLE GEOMETRY</text>
    <rect x="22" y="78" width="330" height="46" class="stone"/>
    <rect x="352" y="78" width="68" height="46" class="edge"/>
