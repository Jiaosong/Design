    <text x="22" y="181" class="sm seal">actual fixing / sealing / drainage / electrical = OPEN</text>
  </g>

  <g transform="translate(600 474)">
    <rect width="546" height="206" rx="14" class="paper"/>
    <text x="22" y="32" class="xs qing">BEHAVIOR + FAILURE-SAFE RELATION</text>
