    <text x="22" y="142" class="sm ink">白天 / 故障 / 维护默认 OFF；不积分、不计数、不提示“下一盏”。</text>
    <text x="22" y="170" class="sm muted">响应时间只保留样件测试方向；不迁移为项目工程数值。</text>
  </g>

  <line x1="54" y1="710" x2="1146" y2="710" stroke="#173c37" stroke-width="1" opacity=".22"/>
  <text x="54" y="738" class="sm muted">SOURCE BOUNDARY：P01 v1.2 行为逻辑 + v1.3 B 侧缘齐平嵌入候选；位置、材料、尺寸、公差、排水、电气、防滑、眩光、生态、检修、无障碍全部保持 FIELD OPEN。</text>
