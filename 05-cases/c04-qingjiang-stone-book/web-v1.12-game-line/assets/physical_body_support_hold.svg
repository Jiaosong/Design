<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P01 步步生光｜侧缘齐平嵌入与身体路径关系</title>
  <desc id="desc">从当前 P01 v1.2 行为逻辑与 v1.3 B 候选推导的 Web Development 表达：主要踏面保持连续，反馈退到侧缘；身体正常经过，不需要踩中目标。所有位置、尺寸、材料、排水、电气、防滑、眩光、生态、检修和无障碍参数保持开放。</desc>
  <defs>
    <style>
      .bg{fill:#edf0e9}.paper{fill:#f8f7f1;stroke:#bdc7c1;stroke-width:1}.ink{fill:#173c37}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.stone{fill:#d9d8cf}.edge{fill:#789d92}.service{fill:#243b35}.glow{fill:#9cc8bc}.line{stroke:#173c37;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7c8983;stroke-width:1.15;fill:none}.dash{stroke:#97a19c;stroke-width:1.2;fill:none;stroke-dasharray:6 6}.body{stroke:#173c37;stroke-width:2.6;fill:none;stroke-linecap:round}.h1{font:700 38px Arial,'Noto Sans SC','Microsoft YaHei',sans-serif}.h2{font:700 20px Arial,'Noto Sans SC','Microsoft YaHei',sans-serif}.b{font:400 14px Arial,'Noto Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 11.5px Arial,'Noto Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 9.5px Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;letter-spacing:1.2px}
    </style>
  </defs>
  <rect width="1200" height="760" class="bg"/>
  <text x="54" y="52" class="xs qing">P01 / 步步生光 · CURRENT PHYSICAL DEVELOPMENT BINDING</text>
  <text x="54" y="98" class="h1 ink">路仍然首先是一条路，反馈退到侧缘。</text>
  <text x="54" y="132" class="b muted">SELECTED FOR DEVELOPMENT READBACK：B / FLUSH LATERAL EDGE CASSETTE。项目对象被具体化，但不授予 FINAL_KEEP 或工程结论。</text>
  <text x="54" y="160" class="xs seal">CONCEPT / NTS / FIELD OPEN / NOT FOR CONSTRUCTION / NO ROUTE-GUIDANCE CLAIM</text>

  <g transform="translate(54 205)">
    <rect width="1092" height="244" rx="14" class="paper"/>
    <text x="22" y="32" class="xs qing">PLAN + BODY / PATH RELATION</text>
    <rect x="22" y="60" width="852" height="118" rx="4" class="stone"/>
    <rect x="874" y="60" width="70" height="118" class="edge"/>
    <rect x="944" y="60" width="28" height="118" class="service"/>
