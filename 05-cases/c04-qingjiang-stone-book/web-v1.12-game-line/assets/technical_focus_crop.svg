<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Cross-river Relation Detail Interface — Authority Hold</title><desc id="desc">Editable verification slots for route, clearance, edge and return relationships without unverified dimensions.</desc><rect width="1200" height="720" fill="#eef0eb"/><g font-family="Arial,Helvetica,sans-serif" fill="#173c37"><text x="80" y="90" font-size="20" letter-spacing="4">CROSS-RIVER RELATION / DETAIL INTERFACE</text><text x="80" y="160" font-size="52" font-weight="700">AUTHORITY HOLD</text><text x="80" y="205" font-size="19">NO FIELD OR ENGINEERING DIMENSION CLAIM</text></g><g fill="none" stroke="#173c37" stroke-width="2"><path d="M90 500C260 380 410 425 555 335S825 270 1110 345"/><path d="M180 425L980 300" stroke-dasharray="10 10"/><circle cx="180" cy="425" r="12"/><circle cx="980" cy="300" r="12"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#173c37" font-size="18"><text x="95" y="590">VERIFY: ROUTE IDENTITY</text><text x="350" y="590">VERIFY: CLEARANCE</text><text x="605" y="590">VERIFY: EDGE / SAFETY</text><text x="875" y="590">VERIFY: RETURN</text><text x="80" y="650" font-size="16" opacity=".65">Authoritative spatial/model source must be rebound and read back before this interface becomes technical evidence.</text></g></svg>