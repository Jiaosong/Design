<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>
.bg{fill:#f2efe7} .ink{fill:#17211f} .muted{fill:#68736d} .deep{fill:#173b3a}
.red{fill:#a84d3a} .jade{fill:#477f79} .soft{fill:#e4e2da} .paper{fill:#fbfaf5;stroke:#c8c7bf;stroke-width:1.2}
.rule{stroke:#a7afa9;stroke-width:1} .base{stroke:#a9b0aa;stroke-width:4;stroke-linecap:round}
.mark{fill:#477f79} .dot{fill:#173b3a}
.h1{font:700 56px 'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif}
.h2{font:700 28px 'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif}
.body{font:400 18px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}
.sm{font:400 15px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}
.xs{font:700 11px 'Noto Sans CJK SC','Noto Sans SC',sans-serif;letter-spacing:1.35px}
.lab{font:600 18px 'Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#17211f}
.value{font:700 26px 'Inter','Noto Sans',sans-serif;fill:#173b3a}
.tick{font:500 12px 'Inter','Noto Sans',sans-serif;fill:#68736d}
</style>
<rect width="1920" height="1080" class="bg"/>
<text x="90" y="70" class="xs jade">C04 / CH02 / ENV-05 · SOLAR SCENARIO COMPARISON</text>
<text x="90" y="145" class="h1 ink">不是三张“好看的季节图”，而是一个可比较的变化关系</text>
<text x="90" y="190" class="body muted">同一问题、同一单位、同一 0–1 域。夏至 / 春秋分 / 冬至只比较相对正午地形入射场景，不冒充热舒适、现场遮阴或全年运营事实。</text>
<text x="90" y="226" class="xs red">DERIVED SCENARIO / FIELD OBSERVED=0 / FIELD MEASURED=0 / G1F HOLD / NO_PROMOTION / NTS</text>
<line x1="90" y1="252" x2="1830" y2="252" class="rule"/>
<g>
  <text x="90" y="298" class="xs jade">01 / EVIDENCE — SHARED-SCALE SMALL MULTIPLES</text>
  <rect x="90" y="315" width="1080" height="575" rx="18" class="paper"/>
  <text x="145" y="365" class="h2 ink">相对正午暴露均值</text>
  <text x="145" y="400" class="sm muted">Shared domain = 0.00–1.00 · identical baseline / mark geometry</text>
  <text x="145" y="442" class="lab">夏至 / SUMMER</text>
  <line x1="145" y1="470" x2="905" y2="470" class="base"/>
  <rect x="145" y="452" width="706.8" height="36" rx="18" class="mark"/>
  <circle cx="851.8" cy="470" r="8" class="dot"/>
  <text x="933" y="478" class="value">0.93</text>
  <text x="145" y="582" class="lab">春秋分 / EQUINOX</text>
  <line x1="145" y1="610" x2="905" y2="610" class="base"/>
  <rect x="145" y="592" width="585.2" height="36" rx="18" class="mark"/>
  <circle cx="730.2" cy="610" r="8" class="dot"/>
  <text x="933" y="618" class="value">0.77</text>
  <text x="145" y="722" class="lab">冬至 / WINTER</text>
  <line x1="145" y1="750" x2="905" y2="750" class="base"/>
  <rect x="145" y="732" width="372.4" height="36" rx="18" class="mark"/>
  <circle cx="517.4" cy="750" r="8" class="dot"/>
  <text x="933" y="758" class="value">0.49</text>
  <g>
    <text x="145" y="830" class="tick">0.00</text><text x="319" y="830" class="tick">0.25</text>
    <text x="509" y="830" class="tick">0.50</text><text x="699" y="830" class="tick">0.75</text>
    <text x="887" y="830" class="tick">1.00</text>
  </g>
  <rect x="145" y="850" width="970" height="1" fill="#c4c7c3"/>
  <text x="145" y="878" class="sm muted">Δ summer→equinox = −0.16 · Δ equinox→winter = −0.28 · Δ summer→winter = −0.44</text>
</g>
<g>
  <text x="1210" y="298" class="xs jade">02 / FINDING → DESIGN CONSEQUENCE</text>
  <rect x="1210" y="315" width="620" height="575" rx="18" class="paper"/>
  <text x="1250" y="370" class="xs red">FINDING</text>
  <text x="1250" y="410" class="h2 ink">季节变化不是装饰差异，</text>
  <text x="1250" y="445" class="h2 ink">而是明显的相对场景差。</text>
  <text x="1250" y="486" class="body muted">
    <tspan x="1250" dy="0">在这组远程派生场景中，正午相对暴露从 0.93 降至 0.49。</tspan>
    <tspan x="1250" dy="28">任何只在一个季节成立的光照叙事，</tspan>
    <tspan x="1250" dy="28">都不能被当作全年固定条件。</tspan>
  </text>
  <line x1="1250" y1="530" x2="1790" y2="530" class="rule"/>
  <text x="1250" y="574" class="xs red">DESIGN CONSEQUENCE</text>
  <text x="1250" y="616" class="body ink">1｜停留 / 阅读 / 光响应设计不得把“高暴露”当永久前提。</text>
  <text x="1250" y="658" class="body ink">2｜需要跨季节成立的对象，应优先依赖身体、路线、Return 与可关闭状态。</text>
  <text x="1250" y="700" class="body ink">3｜遮阴、热舒适、材料表面温度与具体时段仍须现场/专业验证。</text>
  <rect x="1250" y="754" width="540" height="90" rx="12" class="soft"/>
  <text x="1272" y="786" class="xs jade">DOES NOT PROVE</text>
  <text x="1272" y="816" class="sm muted">太阳物理完整模型 / 微气候 / 热舒适 / 实际遮阴 / 构造适宜性 / 现场选址</text>
</g>
<text x="90" y="955" class="xs jade">03 / TRANSFER RULE</text>
<text x="90" y="995" class="body ink">同一问题 + 同一单位 + 需要比较幅度 → 默认共享域、共享基线、共享 mark geometry；缺失/HOLD 项不得为了版式完整而消失。</text>
<text x="90" y="1030" class="sm muted">Source method: terrain incidence + solar geometry / relative exposure only. Current ENV-05 remains DERIVED SCENARIO / independent professional review pending.</text>
</svg>