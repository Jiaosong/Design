<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>清江石书 App v1.5｜Journey-State Prototype</title><style>:root{--paper:#f4f1e9;--ink:#17211f;--qing:#3c8990;--peak:#566e5e;--trace:#6e7874;--signal:#b64936;--line:rgba(23,33,31,.14);--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans}*{box-sizing:border-box}body{margin:0;background:#dce4df;color:var(--ink);font-family:var(--sans)}button{font:inherit;color:inherit}.app{width:min(100%,520px);min-height:100vh;margin:auto;background:var(--paper);position:relative;padding-bottom:86px}.head{position:sticky;top:0;z-index:20;background:rgba(244,241,233,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px 10px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px}.seal{width:30px;height:30px;border:1.5px solid var(--signal);display:grid;place-items:center;color:var(--signal);font:700 16px var(--serif)}.brand b{display:block;font:700 14px var(--serif)}.brand small{display:block;font-size:6px;letter-spacing:.11em;color:var(--trace)}.return{border:1px solid rgba(182,73,54,.28);color:var(--signal);background:#fbf8f1;border-radius:99px;padding:8px 10px;font-size:8px}.meta{display:flex;gap:8px;margin-top:8px;align-items:center}.phase{font-size:6px;letter-spacing:.12em;color:var(--qing);font-weight:800}.state{font-size:6px;color:var(--trace)}.state strong{color:var(--signal)}main{padding:0 20px}.screen{padding:34px 0 22px;min-height:610px}.l0{font-size:7px;letter-spacing:.13em;color:var(--qing);font-weight:800}.l1{font:700 38px/1.08 var(--serif);letter-spacing:-.04em;margin:12px 0 14px;max-width:440px}.lead{font-size:10px;line-height:1.7;color:var(--trace);margin:0 0 20px;max-width:390px}.field{border-radius:24px;overflow:hidden;background:#dbe7e2;min-height:250px;position:relative;margin:18px 0}.field svg{width:100%;height:auto;display:block}.field .caption{position:absolute;left:14px;right:14px;bottom:12px;background:rgba(244,241,233,.92);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.caption b{display:block;font:700 11px var(--serif);margin-bottom:3px}.caption span{font-size:7px;line-height:1.45;color:var(--trace)}.bodycue{border-left:3px solid var(--qing);padding:3px 0 3px 12px;margin:18px 0}.bodycue b{font:700 14px var(--serif)}.bodycue p{font-size:8px;line-height:1.55;color:var(--trace);margin:4px 0 0}.choice{display:grid;gap:8px;margin:18px 0}.choice button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 14px;text-align:left}.choice button b{display:block;font:700 12px var(--serif);margin-bottom:3px}.choice button span{font-size:7px;color:var(--trace)}.choice button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.choice button.primary span{color:#b9c8c3}.continuation{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:22px}.continuation button{border:0;background:transparent;padding:7px 0;font-size:8px;color:var(--qing)}.continuation .go{background:var(--ink);color:#fff;border-radius:99px;padding:10px 14px;font-weight:700}.continuation .skip{color:var(--trace)}.continuation .ret{color:var(--signal)}details.evidence{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}details.evidence summary{font-size:7px;color:var(--trace);cursor:pointer}details.evidence p{font-size:7px;line-height:1.55;color:var(--trace)}.quiet{background:#10201c;color:#f3efe5;border-radius:24px;padding:24px;margin:18px 0}.quiet .l1{font-size:34px;margin-top:8px}.quiet p{color:#aabdb6;font-size:9px;line-height:1.65}.recognition{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.recognition button{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px 12px;text-align:left}.recognition button b{font:700 11px var(--serif);display:block}.recognition button span{font-size:7px;color:var(--trace)}.tools{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:rgba(244,241,233,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px;z-index:30}.tools button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-size:7px;color:#718079}.tools button.main{background:#e1e9e4;color:var(--ink);font-weight:700}.drawer{position:fixed;inset:0;background:rgba(10,25,21,.34);display:none;align-items:flex-end;z-index:60}.drawer.open{display:flex}.sheet{width:min(100%,520px);margin:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:80vh;overflow:auto}.sheet h2{font:700 24px var(--serif);margin:7px 0 12px}.sheet .close{float:right;border:0;background:transparent;font-size:20px}.list{display:grid;gap:7px}.list button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:left}.list b{font:700 11px var(--serif)}.list span{display:block;font-size:7px;color:var(--trace);margin-top:3px}.bookempty{padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--trace);font-size:8px;line-height:1.6}.signal{color:var(--signal)}@media(max-width:390px){main{padding:0 20px}.l1{font-size:33px}.field{min-height:220px}.recognition{grid-template-columns:1fr}.tools{grid-template-columns:1.5fr 1fr 1fr 1fr}}</style></head><body><div class="app"><header class="head"><div class="top"><div class="brand"><div class="seal">清</div><div><b>清江石书</b><small>JOURNEY-STATE PROTOTYPE · v1.5</small></div></div><button class="return" id="returnBtn">RETURN / 服务</button></div><div class="meta"><span class="phase" id="phaseLabel">ENTER / 进入</span><span class="state">REALITY <strong id="realityLabel">UNKNOWN</strong></span><span class="state">DIGITAL <b id="digitalLabel">LIGHT</b></span></div></header><main><section class="screen" id="screen"></section></main><nav class="tools"><button class="main" id="journeyBtn">当前旅程</button><button data-drawer="route">地图</button><button data-drawer="imprints">十三印</button><button data-drawer="book">我的石书</button></nav></div><div class="drawer" id="drawer"><div class="sheet"><button class="close" id="closeDrawer">×</button><div id="sheetBody"></div></div></div><script>const phases=[{id:'ENTER',ey:'P01 / ENTER',phase:'ENTER / 进入',digital:'FULL',q:'今天先怎么进入清江？',lead:'先理解游程与返回，再决定是否需要内容。十三印不会在第一屏抢占注意力。',type:'enter'},{id:'MOVE',ey:'P02 / MOVE',phase:'MOVE / 移动',digital:'LIGHT',q:'这一段，是继续、分支、休息，还是回来？',lead:'路线是主骨架。场景只在真正有意义时出现，不把十三印画成十三个任务点。',type:'move'},{id:'NOTICE',ey:'P03 / NOTICE',phase:'NOTICE / 先看',digital:'OFF',q:'整片峰林里，你最先认出的是什么？',lead:'这是 R05 的第一读。先把注意力交给真实景观，再决定要不要打开一个轻量互动。',type:'notice'},{id:'ENGAGE',ey:'P04 / ENGAGE',phase:'ENGAGE / 参与',digital:'LIGHT',q:'只选一个你真正注意到的轮廓。',lead:'参与不是点一下。你的选择会决定下一步只揭示哪一组比较关系。',type:'engage'},{id:'REVEAL',ey:'P05 / REVEAL',phase:'REVEAL / 最小解释',digital:'LIGHT',q:'刚才的比较，有没有改变你的判断？',lead:'系统不一次性讲完整故事，只显示足够支持这次修订的最小关系。',type:'reveal'},{id:'RECOVER',ey:'P06 / RECOVER',phase:'RECOVER / 休息',digital:'OFF',q:'先停下来，还是继续？',lead:'到 R06 这类场景，身体和景观优先。解释可以完全跳过。',type:'recover'},{id:'RETURN',ey:'P07 / RETURN',phase:'RETURN / 回来',digital:'LIGHT',q:'现在先回来。',lead:'Return 获得最高优先级。新内容停止出现，UNKNOWN / CLOSED 不伪装成正常开放。',type:'return'},{id:'RECOGNIZE',ey:'P08 / RECOGNIZE',phase:'RECOGNIZE / 再认',digital:'LIGHT',q:'回来时，你现在认出了什么？',lead:'不是测验，也不是完成度。可以选择“没有特别记住”。',type:'recognize'},{id:'REMEMBER',ey:'P09 / REMEMBER',phase:'REMEMBER / 带走',digital:'LIGHT',q:'哪一部分真的值得留下？',lead:'记忆来自回程中的再认、一次改变的判断或一次主动停留，不来自自动集齐。',type:'remember'}];let idx=0,chosen='';const screen=document.getElementById('screen'),phaseLabel=document.getElementById('phaseLabel'),digitalLabel=document.getElementById('digitalLabel');function fieldSVG(kind){if(kind==='move')return `<div class="field"><svg viewBox="0 0 520 290"><path d="M-30 150C80 70 150 180 250 125S410 90 560 48" fill="none" stroke="#79a9a1" stroke-width="30" stroke-linecap="round"/><path d="M305 135L390 230" stroke="#b64936" stroke-width="3"/><path d="M388 230c38-18 69 7 93 34" fill="none" stroke="#315f55" stroke-width="5"/><path d="M420 246c-18 22-27 39-24 54" fill="none" stroke="#315f55" stroke-width="3" stroke-dasharray="7 6"/><circle cx="305" cy="135" r="11" fill="#f4f1e9" stroke="#17211f"/><circle cx="390" cy="230" r="11" fill="#f4f1e9" stroke="#17211f"/></svg><div class="caption"><b>关系地图 / 非测绘图</b><span>BOAT → CABLE → WALK；返回关系始终独立于内容完成。</span></div></div>`;return `<div class="field"><svg viewBox="0 0 520 290"><rect width="520" height="290" fill="#d9e3de"/><path d="M0 220C90 160 132 82 190 118s92 72 142 22 76-83 188-89V290H0Z" fill="#7d9684"/><path d="M0 236c118-26 198-31 286-6s153 21 234 5" fill="none" stroke="#6ca1a2" stroke-width="18"/><path d="M58 184c34-61 67-88 103-69" fill="none" stroke="#607867" stroke-width="9"/><path d="M338 140c42-65 86-87 130-84" fill="none" stroke="#607867" stroke-width="10"/></svg><div class="caption"><b>FIELD FIRST / 景观先读</b><span>这里用关系占位示意，不替代真实清江/R05/R06景观像素。</span></div></div>`}function actions(p){if(p.type==='enter')return `<div class="choice"><button class="primary" data-next><b>看这一趟怎么走</b><span>先建立 BOAT / CABLE / WALK / RETURN 的关系</span></button><button data-nophone><b>不用手机继续</b><span>纸图 / 现场方向 / 人工服务</span></button></div>`;if(p.type==='move')return `${fieldSVG('move')}<div class="choice"><button class="primary" data-next><b>继续这一段</b><span>场景内容保持次级</span></button><button data-rest><b>我想先休息</b><span>减少信息，进入身体/恢复状态</span></button><button data-return><b>直接回来</b><span>任何时候都可以退出探索</span></button></div>`;if(p.type==='notice')return `${fieldSVG('scene')}<div class="bodycue"><b>先看，不急着解释。</b><p>手机此刻默认 OFF。你可以直接继续走，不产生未完成任务。</p></div><div class="continuation"><button class="go" data-next>我想再看一点</button><button class="skip" data-skip>跳过内容</button><button class="ret" data-return>返回</button></div>`;if(p.type==='engage')return `<div class="choice"><button data-pick="竖向峰形"><b>竖向峰形</b><span>我最先注意到它</span></button><button data-pick="层叠关系"><b>层叠关系</b><span>我先注意到前后层次</span></button><button data-pick="江与峰的关系"><b>江与峰的关系</b><span>我先看到水与山如何组织画面</span></button><button data-unknown><b>仍不确定</b><span>这是有效结果，不扣分</span></button></div><div class="continuation"><button class="ret" data-return>退出并返回</button></div>`;if(p.type==='reveal')return `<div class="bodycue"><b>${chosen||'未选择具体线索'}</b><p>只展示与刚才选择相关的最小比较关系；来源与证据放在 L3，不抢第一读。</p></div><div class="choice"><button class="primary" data-changed><b>改变了我的判断</b><span>允许进入之后的记忆候选</span></button><button data-next><b>没有改变</b><span>继续，不自动保存</span></button><button data-unknown><b>仍不确定</b><span>保留 UNKNOWN，继续</span></button></div>`;if(p.type==='recover')return `${fieldSVG('scene')}<div class="quiet"><span class="l0">BODY / DIGITAL OFF</span><div class="l1">先让身体接管。</div><p>站、停、靠、坐、听、看；这里不需要完成任何数字动作。</p></div><div class="continuation"><button class="go" data-next>休息后继续</button><button class="ret" data-return>现在返回</button></div>`;if(p.type==='return')return `${fieldSVG('move')}<div class="bodycue"><b class="signal">UNKNOWN / fail-closed</b><p>新内容退场。纸图、物理方向、人工服务与返回识别成为主结构。</p></div><div class="continuation"><button class="go" data-next>回程中再看一次</button><button data-nophone>关闭手机继续</button></div>`;if(p.type==='recognize')return `<div class="recognition"><button data-rec="江与两岸"><b>江与两岸</b><span>我现在能重新对应它们</span></button><button data-rec="索道方向"><b>索道方向</b><span>我认出了跨江关系</span></button><button data-rec="一个刚经过的场景"><b>一个刚经过的场景</b><span>我知道自己从哪里回来</span></button><button data-rec="没有特别记住"><b>没有特别记住</b><span>允许没有结果</span></button></div>`;return `<div class="bodycue"><b>${chosen?`我留下：${chosen}`:'没有必须留下的东西'}</b><p>My Book 只接收主动选择的记忆、变化或问题，不自动记录十三印完成度。</p></div><div class="continuation"><button class="go" data-drawer="book">打开我的石书</button><button class="skip" data-reset>结束这次演示</button></div>`}function render(){const p=phases[idx];phaseLabel.textContent=p.phase;digitalLabel.textContent=p.digital;screen.innerHTML=`<span class="l0">${p.ey}</span><h1 class="l1">${p.q}</h1><p class="lead">${p.lead}</p>${actions(p)}<details class="evidence"><summary>L3 / EVIDENCE · 查看状态与证据边界</summary><p>FIELD OBSERVED=0 · FIELD MEASURED=0 · G1F HOLD · 本原型不声称实时运营、精确定位或现场验证。</p></details>`;bind()}function bind(){screen.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{idx=Math.min(idx+1,phases.length-1);render()});screen.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{idx=6;render()});screen.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{idx=5;render()});screen.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{idx=1;render()});screen.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{chosen=b.dataset.pick;idx=4;render()});screen.querySelectorAll('[data-unknown]').forEach(b=>b.onclick=()=>{chosen='仍不确定';idx=Math.min(idx+1,phases.length-1);render()});screen.querySelectorAll('[data-changed]').forEach(b=>b.onclick=()=>{chosen=(chosen||'一个观察')+' · 判断被修订';idx=5;render()});screen.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{chosen=b.dataset.rec;idx=8;render()});screen.querySelectorAll('[data-nophone]').forEach(b=>b.onclick=()=>alert('NO-PHONE SHADOW\n纸图 / 物理方向 / 人工服务 / 真实休息 / Return 继续成立。'));screen.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{idx=0;chosen='';render()});screen.querySelectorAll('[data-drawer]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.drawer))}document.getElementById('returnBtn').onclick=()=>{idx=6;render()};document.getElementById('journeyBtn').onclick=()=>render();document.querySelectorAll('.tools [data-drawer]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.drawer));function openDrawer(type){const body=document.getElementById('sheetBody');if(type==='route')body.innerHTML='<span class="l0">CAP-ROUTE</span><h2>地图是能力，不是主架构</h2><div class="list"><button><b>总游程</b><span>ARRIVAL → BOAT → CABLE → WALK → RETURN</span></button><button><b>分支 / 休息 / 返回</b><span>移动决策高于内容点位</span></button><button><b>无手机</b><span>纸图 / 现场方向 / 人工服务</span></button></div>';else if(type==='imprints')body.innerHTML='<span class="l0">CAP-IMPRINTS</span><h2>十三印完整保留，但不支配现场阅读</h2><div class="list"><button><b>附近真正有意义的内容</b><span>根据当前场景进入，不做13/13任务链</span></button><button><b>按问题 / 按内容</b><span>文化 · 观察 · 轻游戏 · 身体</span></button><button><b>完整 R01–R13 索引</b><span>作为内容世界与档案入口</span></button></div>';else body.innerHTML=`<span class="l0">CAP-BOOK</span><h2>我的石书</h2>${chosen?`<div class="list"><button><b>${chosen}</b><span>来自本次旅程中的主动选择 / 再认 / 修订</span></button></div>`:'<div class="bookempty">这次旅程还没有产生需要留下的内容。<br>不会因为“经过”而自动收集十三印。</div>'}`;document.getElementById('drawer').classList.add('open')}document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};render();</script></body></html>
