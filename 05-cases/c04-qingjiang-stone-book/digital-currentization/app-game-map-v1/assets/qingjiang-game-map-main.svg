<g transform="translate(915,65)"><rect class="card" width="485" height="170" rx="24"/><text class="t green" x="24" y="34" font-size="12" font-weight="800">HOW TO PLAY</text><text class="ser" x="24" y="75" font-size="25" font-weight="700">探索，而不是通关。</text><text class="t sub" x="24" y="107">选择交通 → 进入步道 → 发现附近内容 →</text><text class="t sub" x="24" y="132">观看 / 游戏 / 休息 / 阅读 → 随时返回。</text></g>
<g transform="translate(915,255)"><rect class="card" width="485" height="240" rx="24"/><text class="t green" x="24" y="34" font-size="12" font-weight="800">MAP LAYERS</text><g transform="translate(24,65)"><circle class="legendDot" fill="#78aaa0" r="7"/><text class="t label" x="20" y="6">清江 / River</text><circle class="legendDot" fill="#9a7b48" cx="210" r="7"/><text class="t label" x="230" y="6">交通 / Transport</text></g><g transform="translate(24,108)"><circle class="legendDot" fill="#527f74" r="7"/><text class="t label" x="20" y="6">十三印 / Imprints</text><circle class="legendDot" fill="#a44337" cx="210" r="7"/><text class="t label" x="230" y="6">返回 / Return</text></g><line class="line" x1="24" y1="145" x2="461" y2="145"/><text class="t small" x="24" y="177">节点只表达设计关系，不宣称 GPS、实测距离、坡度或开放状态。</text><text class="t small" x="24" y="203">关闭 / 未知状态进入 App 后 fail-closed；基础返回不被游戏门控。</text></g></g>
<g transform="translate(70,910)"><rect class="tag" width="150" height="36" rx="18"/><text class="t tagText" x="75" y="23" text-anchor="middle">BOAT 水上</text><rect class="tag" x="162" width="155" height="36" rx="18"/><text class="t tagText" x="239" y="23" text-anchor="middle">CABLE 空中</text><rect class="tag" x="329" width="150" height="36" rx="18"/><text class="t tagText" x="404" y="23" text-anchor="middle">WALK 山中</text><text class="t small" x="510" y="23">十三印可打开、可跳过、可错序；路线、安全和回程不依赖完成内容。</text></g>
