<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">清江石书探索地图｜MAIN candidate</title><desc id="desc">基于当前宏观关系权威的非测绘探索地图：游船、索道、步行、多分支十三印、休息与返回。</desc>
<style>.bg{fill:#f4f1e8}.terrainA{fill:#dfe6dc}.terrainB{fill:#c9d4c5}.terrainC{fill:#b8c7b7}.river{fill:none;stroke:#78aaa0;stroke-width:64;stroke-linecap:round}.river2{fill:none;stroke:#b5d2ca;stroke-width:16;stroke-linecap:round}.walk{fill:none;stroke:#203b33;stroke-width:10;stroke-linecap:round}.branch{stroke-width:6;opacity:.72}.cable{fill:none;stroke:#9a7b48;stroke-width:8;stroke-dasharray:14 12}.boat{fill:none;stroke:#36776c;stroke-width:8;stroke-dasharray:18 14}.return{fill:none;stroke:#a44337;stroke-width:8;stroke-dasharray:16 12}.poi{fill:#f4f1e8;stroke-width:4}.j{stroke:#4e8f82}.s{stroke:#9a7b48}.r{stroke:#a44337}.im{fill:#f4f1e8;stroke:#527f74;stroke-width:3}.imMain{fill:#173f36;stroke:#173f36}.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1a2e28}.ser{font-family:'Noto Serif CJK SC','Songti SC',serif;fill:#142720}.h1{font-size:52px;font-weight:700}.sub{font-size:17px;fill:#65766f}.small{font-size:14px;fill:#65766f}.label{font-size:18px;font-weight:700}.node{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:central}.white{fill:#fff}.red{fill:#a44337}.green{fill:#4e8f82}.line{stroke:#b7c1ba;stroke-width:1}.card{fill:#fbfaf5;stroke:#d7d9d1;stroke-width:1}.tag{fill:#e5ede7}.tagText{font-size:13px;font-weight:700;fill:#315f55}.returnText{fill:#a44337}.legendDot{stroke:none}</style>
<rect class="bg" width="1600" height="1000"/>
<g transform="translate(70,70)"><text class="t green" x="0" y="0" font-size="15" font-weight="800" letter-spacing="3">ROUTE / 清江探索地图</text><text class="ser h1" x="0" y="72">从江面到山中，自己决定阅读深度。</text><text class="t sub" x="0" y="111">BOAT / CABLE / WALK 构成真实游程骨架；十三印是沿途可选择打开的内容，不拥有路线。</text></g>
<g transform="translate(1120,70)"><text class="t red" x="0" y="0" font-size="13" font-weight="800">NTS · RELATIONAL MAP</text><text class="t small" x="0" y="26">非测绘图｜不代表实测距离、坡度或开放状态</text></g>
