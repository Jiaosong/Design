<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<style>
.serif{font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif}
.sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
.mono{font-family:"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace}
</style><rect width="1600" height="820" fill="#F2EFE7"/><text x="56" y="62" class="mono" font-size="13" fill="#2C6F70" letter-spacing="2">02 / SYSTEM · GRAPHIC GRAMMAR</text><text x="56" y="120" class="serif" font-size="50" font-weight="700" fill="#16211F">不是“山、水、印章”的装饰包，而是一套阅读动作。</text><rect x="56" y="190" width="690" height="235" fill="#FBFAF6" stroke="#C6C2B8"/><text x="84" y="228" class="mono" font-size="12" fill="#8F3D35">01</text><text x="136" y="230" class="sans" font-size="18" font-weight="700" fill="#16211F" letter-spacing="1.5">RIVER FOLD</text><path d="M 84 310 C 186 268, 306 350, 416 302 S 606 310, 696 276" fill="none" stroke="#2C6F70" stroke-width="4"/><text x="84" y="401" class="sans" font-size="14" fill="#16211F" opacity=".68">一条连续线只在旅程、关系或回程真的连续时使用。</text><rect x="806" y="190" width="690" height="235" fill="#FBFAF6" stroke="#C6C2B8"/><text x="834" y="228" class="mono" font-size="12" fill="#8F3D35">02</text><text x="886" y="230" class="sans" font-size="18" font-weight="700" fill="#16211F" letter-spacing="1.5">STRATA / TRACE</text><path d="M 836 280 C 986 272, 1186 288, 1446 276" fill="none" stroke="#16211F" stroke-width="2" stroke-opacity="0.8"/><path d="M 836 304 C 986 296, 1186 312, 1446 300" fill="none" stroke="#16211F" stroke-width="1.2" stroke-opacity="0.35"/><path d="M 836 328 C 986 320, 1186 336, 1446 324" fill="none" stroke="#16211F" stroke-width="1.2" stroke-opacity="0.35"/><path d="M 836 352 C 986 344, 1186 360, 1446 348" fill="none" stroke="#16211F" stroke-width="1.2" stroke-opacity="0.35"/><path d="M 1226 276 L 1226 368" stroke="#8C8A82" stroke-width="2" stroke-dasharray="5 6"/><text x="834" y="401" class="sans" font-size="14" fill="#16211F" opacity=".68">层理只表示时间、证据层或地质阅读；未知使用 TRACE，不伪装事实。</text><rect x="56" y="475" width="690" height="235" fill="#FBFAF6" stroke="#C6C2B8"/><text x="84" y="513" class="mono" font-size="12" fill="#8F3D35">03</text><text x="136" y="515" class="sans" font-size="18" font-weight="700" fill="#16211F" letter-spacing="1.5">WINDOW CUT</text><rect x="90" y="553" width="596" height="110" fill="#0F302F"/><rect x="330" y="553" width="72" height="110" fill="#F2EFE7"/><line x1="365" y1="553" x2="365" y2="663" stroke="#2C6F70" stroke-width="2"/><text x="84" y="686" class="sans" font-size="14" fill="#16211F" opacity=".68">窄切口用于局部揭示/对照；自然高潮区应减少而不是增加品牌图形。</text><rect x="806" y="475" width="690" height="235" fill="#FBFAF6" stroke="#C6C2B8"/><text x="834" y="513" class="mono" font-size="12" fill="#8F3D35">04</text><text x="886" y="515" class="sans" font-size="18" font-weight="700" fill="#16211F" letter-spacing="1.5">RETURN</text><path d="M 848 610 C 951 565, 1076 563, 1171 605 S 1346 660, 1432 610" fill="none" stroke="#16211F" stroke-width="3"/><path d="M 1432 610 C 1361 547, 1276 550, 1222 587" fill="none" stroke="#2C6F70" stroke-width="3"/><path d="M 1222 587 l 15 -5 l -5 15" fill="none" stroke="#2C6F70" stroke-width="3"/><text x="834" y="686" class="sans" font-size="14" fill="#16211F" opacity=".68">所有体验媒介都必须允许退出并回到路线、服务与安全。</text></svg>