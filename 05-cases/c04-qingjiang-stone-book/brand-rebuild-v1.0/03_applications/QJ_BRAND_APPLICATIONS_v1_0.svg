rif" font-size="38" font-weight="700" fill="#16211F">先看两岸哪里不一样。</text><text x="544" y="615" class="sans" font-size="16" fill="#16211F" opacity=".72">找几处高度不同的平缓面，再比较左岸与右岸。</text><line x1="544" y1="677" x2="1136" y2="677" stroke="#C6C2B8"/><path d="M 568 785 C 670 743, 760 765, 822 805" fill="none" stroke="#16211F" stroke-width="3"/><path d="M 858 807 C 900 725, 980 701, 1105 729" fill="none" stroke="#16211F" stroke-width="3"/><path d="M 592 830 C 730 819, 890 847, 1096 817" fill="none" stroke="#2C6F70" stroke-width="4"/><text x="544" y="903" class="mono" font-size="10" fill="#8C8A82">RELATION = SOURCE-GROUNDED · FIELD GEOMETRY = OPEN</text><rect x="1215" y="175" width="647" height="760" rx="42" fill="#0F302F"/><text x="1255" y="227" class="mono" font-size="11" fill="#96BBB7" letter-spacing="1.6">MY BOOK / MEMORY · NO SCORE</text><g transform="translate(1251,263) scale(1.3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
