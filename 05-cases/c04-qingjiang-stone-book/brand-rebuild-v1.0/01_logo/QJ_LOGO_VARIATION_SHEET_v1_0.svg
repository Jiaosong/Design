</style><rect width="1600" height="720" fill="#F2EFE7"/><text x="56" y="68" class="mono" font-size="14" fill="#8F3D35" letter-spacing="2">OLEANDER / VARY → CONSTRUCT</text><text x="56" y="130" class="serif" font-size="48" font-weight="700" fill="#16211F">清江品牌标志重构：三条血缘，不做三个旅游图标。</text><rect x="56" y="190" width="448" height="440" rx="4" fill="#FBFAF6" stroke="#C6C2B8"/><text x="84" y="232" class="mono" font-size="13" fill="#2C6F70" letter-spacing="1.8">A / RIVER FOLIO</text><g transform="translate(106,278) scale(2.2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M 4 36 C 17 34, 28 30, 39 23 C 48 17, 55 12, 60 6 C 61 17, 62 27, 64 37 C 66 45, 72 48, 80 47 C 91 46, 98 38, 105 27 C 111 18, 118 13, 128 12 C 137 11, 145 14, 154 16" stroke="#16211F" stroke-width="2.8"/>
<path d="M 5 48 C 30 47, 49 49, 64 58 C 82 49, 106 46, 154 48" stroke="#2C6F70" stroke-width="2.8"/>
<path d="M 17 41 C 31 39, 43 35, 53 29" stroke="#16211F" stroke-opacity=".38" stroke-width="1.54"/>
<path d="M 94 40 C 102 34, 108 26, 115 20" stroke="#16211F" stroke-opacity=".38" stroke-width="1.54"/>
<circle cx="64" cy="58" r="2.6599999999999997" fill="#2C6F70" stroke="none"/>
</g><text x="84" y="502" class="serif" font-size="28" font-weight="700" fill="#16211F">江谷切面 × 打开的页</text><text x="84" y="548" class="sans" font-size="15" fill="#16211F" opacity=".72">保留现有线性山水血缘；将“波纹山形”改成不对</text><text x="84" y="572" class="sans" font-size="15" fill="#16211F" opacity=".72">称河谷、页缝与水线的同一结构。</text><text x="84" y="610" class="mono" font-size="10" fill="#8F3D35" letter-spacing=".9">PRODUCER CANDIDATE / REVIEW PENDING</text><rect x="560" y="190" width="448" height="440" rx="4" fill="#FBFAF6" stroke="#C6C2B8"/><text x="588" y="232" class="mono" font-size="13" fill="#2C6F70" letter-spacing="1.8">B / TERRACE CUT</text><path d="M 612 312 C 710 302, 820 322, 917 308" fill="none" stroke="#16211F" stroke-width="2.2"/><path d="M 634 344 C 710 334, 820 354, 894 340" fill="none" stroke="#16211F" stroke-width="2.2"/><path d="M 658 376 C 710 366, 820 386, 878 372" fill="none" stroke="#16211F" stroke-width="2.2"/><path d="M 682 408 C 710 398, 820 418, 857 404" fill="none" stroke="#16211F" stroke-width="2.2"/><path d="M 800 282 C 790 340, 810 395, 785 450" fill="none" stroke="#2C6F70" stroke-width="4"/><text x="588" y="502" class="serif" font-size="28" font-weight="700" fill="#16211F">阶地 × 切面</text><text x="588" y="548" class="sans" font-size="15" fill="#16211F" opacity=".72">强调多级阶地与地质阅读，专业性强，但作为大众</text><text x="588" y="572" class="sans" font-size="15" fill="#16211F" opacity=".72">主识别偏技术。</text><text x="588" y="610" class="mono" font-size="10" fill="#8F3D35" letter-spacing=".9">SUPPORT VARIANT</text><rect x="1064" y="190" width="448" height="440" rx="4" fill="#FBFAF6" stroke="#C6C2B8"/><text x="1092" y="232" class="mono" font-size="13" fill="#2C6F70" letter-spacing="1.8">C / RETURN TRACE</text><path d="M 1120 370 C 1194 315, 1254 420, 1324 342 S 1429 350, 1444 300" fill="none" stroke="#16211F" stroke-width="3"/><circle cx="1136" cy="390" r="6" fill="#2C6F70"/><text x="1136" y="418" class="mono" text-anchor="middle" font-size="9" fill="#8C8A82">BOAT</text><circle cx="1230" cy="390" r="6" fill="#2C6F70"/><text x="1230" y="418" class="mono" text-anchor="middle" font-size="9" fill="#8C8A82">CABLE</text><circle cx="1324" cy="390" r="6" fill="#2C6F70"/><text x="1324" y="418" class="mono" text-anchor="middle" font-size="9" fill="#8C8A82">WALK</text><circle cx="1418" cy="322" r="6" fill="#2C6F70"/><text x="1418" y="350" class="mono" text-anchor="middle" font-size="9" fill="#8C8A82">RETURN</text><text x="1092" y="502" class="serif" font-size="28" font-weight="700" fill="#16211F">游程 × 回程</text><text x="1092" y="548" class="sans" font-size="15" fill="#16211F" opacity=".72">强调 BOAT / CABLE / WALK</text><text x="1092" y="572" class="sans" font-size="15" fill="#16211F" opacity=".72">/ RETURN 连续性，适合辅助图形，不足</text><text x="1092" y="596" class="sans" font-size="15" fill="#16211F" opacity=".72">以单独承担品牌名称。</text><text x="1092" y="610" class="mono" font-size="10" fill="#8F3D35" letter-spacing=".9">SUPPORT VARIANT</text></svg>