<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8,4 L0,0 L0,8 Z" fill="#a54a3d"/></marker><pattern id="concrete" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0M-6 6L6 -6M12 24L24 12" stroke="#b8bcb8" stroke-width="1"/><circle cx="5" cy="5" r="1.4" fill="#aeb3ae"/><circle cx="14" cy="12" r="1.2" fill="#aeb3ae"/></pattern><pattern id="steelH" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#66736e" stroke-width="1"/></pattern><pattern id="woodH" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 3 C4 0 8 6 16 2 M0 9 C6 6 10 12 16 8" fill="none" stroke="#9a7a57" stroke-width="1"/></pattern></defs>
<style>.bg{fill:#f4f2ec}.paper{fill:#fbfaf6}.ink{fill:#17221e}.muted{fill:#6f7974}.qing{fill:#477d77}.seal{fill:#a54a3d}.l1{stroke:#17221e;stroke-width:2.4;fill:none}.l2{stroke:#53615c;stroke-width:1.35;fill:none}.l3{stroke:#8b9691;stroke-width:.8;fill:none}.ghost{stroke:#9ba7a1;stroke-width:2;fill:none;stroke-dasharray:7 7}.h0{font:700 46px "Noto Serif CJK SC","Songti SC",serif}.h1{font:700 25px "Noto Serif CJK SC","Songti SC",serif}.t{font:400 14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.s{font:400 12px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.cap{font:700 11px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;letter-spacing:1.1px}.num{font:700 12px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1920" height="1080" class="bg"/><text x="58" y="46" class="cap qing">OLEANDER / C04 / R06 · FOUNDATION / CMF / MAINTENANCE · SHEET 03</text><text x="58" y="98" class="h0 ink">基础不假定｜三种 substrate 情景 + 可维护材料节点</text><text x="58" y="132" class="t muted">Truthful scenario design is stronger than a fake fixed footing. Material identity follows phenomenon → channel → scale → response.</text>
<rect x="58" y="170" width="570" height="430" class="paper"/><text x="82" y="203" class="cap qing">A / VERIFIED RC · CONDITIONAL</text><text x="82" y="240" class="h1 ink">已验证钢筋混凝土</text><g transform="translate(120 280)"><rect x="0" y="180" width="250" height="105" fill="url(#concrete)" stroke="#17221e" stroke-width="2"/><rect x="25" y="166" width="200" height="14" fill="#d9ddd9" stroke="#53615c" stroke-width="1"/><rect x="45" y="148" width="160" height="18" fill="#56645e" stroke="#17221e" stroke-width="2"/><rect x="105" y="35" width="40" height="113" fill="url(#steelH)" stroke="#17221e" stroke-width="2"/><path d="M72 138L72 250M178 138L178 250" class="l1"/><circle cx="72" cy="148" r="6" fill="#17221e"/><circle cx="178" cy="148" r="6" fill="#17221e"/></g><text x="390" y="320" class="s ink">Base plate: 220×180×12 / v1.7</text><text x="390" y="350" class="s ink">4×M16 / plate candidate</text><text x="390" y="380" class="s ink">Anchor plan: 150×110 candidate</text><text x="390" y="410" class="s ink">Grout: 10–20mm candidate</text><text x="390" y="440" class="s seal">EMBEDMENT = OPEN</text><text x="82" y="535" class="s muted">Before closure: concrete strength / member thickness / edge distance / rebar scan.</text><text x="82" y="558" class="s muted">Cracking state + approved anchor system / pull-out verification as required.</text>
<rect x="652" y="170" width="570" height="430" class="paper"/><text x="676" y="203" class="cap qing">B / DIRECT ROCK · FIELD OPEN</text><text x="676" y="240" class="h1 ink">直接岩体</text><g transform="translate(724 286)"><path d="M0 205 C80 155 145 185 210 128 C275 76 350 110 450 50" class="l1"/><rect x="175" y="78" width="42" height="110" fill="url(#steelH)" stroke="#17221e" stroke-width="2"/><rect x="142" y="188" width="110" height="15" fill="#56645e" stroke="#17221e" stroke-width="2"/><path d="M160 198 L135 255 M232 198 L258 250" class="ghost"/></g><text x="676" y="512" class="s muted">Rock class / joints / weathering / pull-out / drilling feasibility are unknown.</text><text x="676" y="535" class="s muted">Concrete-anchor logic must not be copied into rock.</text><text x="676" y="558" class="s seal">FIELD + GEO / STRUCTURAL ENGINEER</text><text x="676" y="580" class="cap seal">ANCHOR DIA / EMBEDMENT = UNSPECIFIED</text>
<rect x="1246" y="170" width="610" height="430" class="paper"/><text x="1270" y="203" class="cap qing">C / UNKNOWN SUBSTRATE · HOLD</text><text x="1270" y="240" class="h1 ink">未知基层 = 不出构造 issue</text><g transform="translate(1296 300)"><rect width="510" height="165" fill="#eef0ed" stroke="#8b9691" stroke-width="1.2" stroke-dasharray="8 7"/><text x="255" y="66" text-anchor="middle" class="h1 seal">HOLD</text><text x="255" y="105" text-anchor="middle" class="t ink">Survey / substrate / drainage / fall-edge / clear-width</text><text x="255" y="134" text-anchor="middle" class="s muted">NO RECEIPT → NO FOUNDATION SELECTION</text></g><text x="1270" y="533" class="s muted">Unknown is not drawn as RC, rock, normal/open or safe. It remains an acquisition interface.</text>
<rect x="58" y="628" width="1164" height="330" class="paper"/><text x="82" y="660" class="cap qing">MATERIAL NODE / CMF · PHENOMENON → CHANNEL → SCALE → RESPONSE</text><g transform="translate(90 704)"><rect x="0" y="0" width="410" height="46" fill="url(#woodH)" stroke="#17221e" stroke-width="2"/><text x="438" y="20" class="s ink">01 40mm timber cap / durable or modified wood</text><text x="438" y="38" class="s muted">warm-touch / splinter-slip-durability review / replaceable</text><rect x="8" y="58" width="394" height="20" fill="#8d5946" stroke="#17221e" stroke-width="1.6"/><text x="438" y="72" class="s ink">02 3mm steel cap tray / coated galvanized preferred</text><rect x="12" y="90" width="386" height="8" fill="#d8ddd9" stroke="#53615c" stroke-width="1"/><text x="438" y="98" class="s ink">03 2mm isolation strip</text><rect x="12" y="110" width="386" height="18" fill="#f4f2ec" stroke="#8b9691" stroke-width="1" stroke-dasharray="5 5"/><text x="438" y="124" class="s ink">04 5mm drain gap / no concealed water pocket</text><rect x="30" y="145" width="350" height="62" fill="#9a6350" stroke="#17221e" stroke-width="1.6"/><text x="438" y="168" class="s ink">05 3mm face skin + 20mm ventilated cavity</text><text x="438" y="188" class="s muted">dark-copper finish = coated galvanized visual intent</text></g><text x="82" y="930" class="s muted">Material status: FACT/MEASURED not claimed. Current values are CONCEPT ESTIMATE / MATERIAL INTENT; runoff, staining, wet-dry cycle and local corrosion exposure remain OPEN.</text>
<rect x="1246" y="628" width="610" height="330" class="paper"/><text x="1270" y="660" class="cap qing">MAINTENANCE / FAILURE-FIRST</text><g transform="translate(1270 700)"><line x1="30" y1="0" x2="30" y2="205" class="l2"/><circle cx="30" cy="12" r="6" class="seal"/><text x="52" y="17" class="num ink">OPENING</text><text x="150" y="17" class="s muted">状态 / 损伤 / 明显异常退出</text><circle cx="30" cy="58" r="6" class="seal"/><text x="52" y="63" class="num ink">MONTHLY</text><text x="150" y="63" class="s muted">表面 / 松动 / 腐蚀 / 障碍</text><circle cx="30" cy="104" r="6" class="seal"/><text x="52" y="109" class="num ink">QUARTERLY</text><text x="150" y="109" class="s muted">排水 / 固定 / 涂层 / 锚固</text><circle cx="30" cy="150" r="6" class="seal"/><text x="52" y="155" class="num ink">ANNUAL</text><text x="150" y="155" class="s muted">结构 / 腐蚀 / 替换 / 重涂判断</text><circle cx="30" cy="196" r="6" class="seal"/><text x="52" y="201" class="num ink">EVENT</text><text x="150" y="201" class="s muted">暴雨 / 撞击 / 关闭后复核</text></g>
<line x1="58" y1="988" x2="1856" y2="988" class="l3"/><text x="58" y="1017" class="cap seal">STATUS</text><text x="128" y="1017" class="s ink">CONCEPT / NTS / FIELD OPEN / NOT FOR CONSTRUCTION</text><text x="58" y="1042" class="s muted">Substrate truth controls foundation choice. CMF is a maintainable material system, not a color swatch.</text><text x="1495" y="1017" class="cap ink">SHEET R06-T-03</text><text x="1695" y="1017" class="cap ink">REV SKILL-v1.3</text>
</svg>