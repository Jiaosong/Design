<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>.bg{fill:#e7e2d7}.paper{fill:#f7f4ec}.ink{fill:#162823}.muted{fill:#6e776f}.qing{fill:#315f55}.water{fill:none;stroke:#6fa79b;stroke-width:4}.route{fill:none;stroke:#a44337;stroke-width:3;stroke-dasharray:8 8}.line{stroke:#c9c6bd;stroke-width:1}.seal{fill:none;stroke:#a44337;stroke-width:2}.sans{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.serif{font-family:'Noto Serif CJK SC','Songti SC',serif}.h1{font-size:48px;font-weight:700}.h2{font-size:25px;font-weight:700}.body{font-size:15px}.small{font-size:12px}.tiny{font-size:10px}.mono{font-size:11px;font-weight:700;letter-spacing:2px}</style><rect class="bg" width="1600" height="1000"/><text x="60" y="68" class="sans mono qing">MEMORY / PRINT · CURRENTIZATION V1</text><text x="60" y="130" class="serif h1 ink">《清江旅记》｜从开卷到成书</text><text x="60" y="170" class="sans body muted">不是十三印盖章册。它保存这一次实际走过、停过、看过、写过的清江。</text><g transform="translate(85,245)"><rect class="paper" width="390" height="610" rx="8"/><rect x="32" y="32" width="326" height="546" rx="2" fill="none" stroke="#d4d0c6"/><text x="52" y="86" class="sans mono qing">QINGJIANG JOURNAL</text><text x="52" y="162" class="serif" font-size="56" font-weight="700" fill="#162823">清江旅记</text><path d="M42 366 C116 308 184 376 246 332 C298 295 346 323 371 285" class="water"/><path d="M52 405 C127 351 197 412 260 369 C309 335 345 356 380 321" class="water" opacity=".45"/><rect x="52" y="500" width="46" height="46" class="seal"/><text x="75" y="531" text-anchor="middle" class="serif" font-size="20" fill="#a44337">清</text><text x="52" y="558" class="sans tiny muted">A trip can be partial and still complete.</text></g><g transform="translate(550,245)"><rect class="paper" width="965" height="610" rx="8"/><line x1="482" y1="20" x2="482" y2="590" class="line"/><g transform="translate(32,32)"><text class="sans mono qing">LEFT / ROUTE + MOMENTS</text><text y="52" class="serif h2 ink">这一趟，我怎么走过清江？</text><path d="M28 195 C115 147 187 185 254 232 C309 271 353 230 420 193" class="water"/><path d="M54 183 C112 170 168 191 221 229 C276 268 324 247 381 211" class="route"/><g class="sans small ink"><text x="52" y="154">BOAT</text><text x="190" y="205">CABLE</text><text x="335" y="205">WALK</text></g><text x="0" y="310" class="sans small muted">我停下来的地方</text><line x1="0" y1="328" x2="418" y2="328" class="line"/><line x1="0" y1="365" x2="418" y2="365" class="line"/><text x="0" y="418" class="sans small muted">我想以后再看的一个问题</text><line x1="0" y1="436" x2="418" y2="436" class="line"/><line x1="0" y1="473" x2="418" y2="473" class="line"/></g><g transform="translate(514,32)"><text class="sans mono qing">RIGHT / LOOK + WRITE</text><text y="52" class="serif h2 ink">我记住的不是数量，是一个瞬间。</text><rect y="92" width="388" height="218" fill="#e9eee8"/><path d="M0 286 C82 214 148 263 201 222 C273 166 321 213 388 164 L388 310 L0 310Z" fill="#c5d2c7"/><path d="M0 272 C84 235 146 296 213 257 C280 219 330 244 388 212" class="water"/><text y="354" class="sans small muted">画 / 写 / 贴一张照片</text><line x1="0" y1="373" x2="388" y2="373" class="line"/><line x1="0" y1="410" x2="388" y2="410" class="line"/><line x1="0" y1="447" x2="388" y2="447" class="line"/><text y="513" class="sans tiny muted">十三印只作为页目录参考，不显示 13/13；离场后可与“我的石书”数字记录对应。</text></g></g><text x="85" y="930" class="sans tiny muted">Vector/editable concept layout. Paper stock / size / binding / production remain design-development fields; no commercial-manufacturing claim.</text></svg>