<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>.bg{fill:#f4f1e8}.ink{fill:#142720}.muted{fill:#68776f}.qing{fill:#315f55}.red{fill:#a44337}.card{fill:#faf8f2;stroke:#d4d3ca}.line{fill:none;stroke:#6fa79b;stroke-width:4}.mist{fill:#d8e5e0}.sans{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.serif{font-family:'Noto Serif CJK SC','Songti SC',serif}.h1{font-size:50px;font-weight:700}.h2{font-size:26px;font-weight:700}.body{font-size:16px}.small{font-size:12px}.mono{font-size:11px;font-weight:700;letter-spacing:2px}</style><rect class="bg" width="1600" height="1000"/><text x="60" y="68" class="sans mono qing">MEMORY / IP · ONE VARIABLE PER OBJECT</text><text x="60" y="132" class="serif h1 ink">离场以后，带走的是一段真实经历。</text><text x="60" y="172" class="sans body muted">每一种记忆物只保存一种现场变量，避免变成互相重复的旅游纪念品。</text><g transform="translate(60,260)"><rect class="card" width="350" height="540" rx="26"/><text x="25" y="42" class="sans mono qing">WRITE</text><text x="25" y="86" class="serif h2 ink">清江旅记</text><path d="M25 164 C92 124 164 178 222 143 C277 110 309 137 326 122" class="line"/><line x1="25" y1="220" x2="325" y2="220" stroke="#cccac1"/><line x1="25" y1="258" x2="325" y2="258" stroke="#cccac1"/><text x="25" y="325" class="sans small muted">保存：页 / 路线 / 手写 / 画 / 个人选择</text><text x="25" y="372" class="sans small ink">MAIN MEMORY</text><text x="25" y="405" class="sans small muted">与 App「我的石书」互补，</text><text x="25" y="428" class="sans small muted">而不是实体版完成清单。</text></g><g transform="translate(435,260)"><rect class="card" width="350" height="540" rx="26"/><text x="25" y="42" class="sans mono qing">CARRY</text><text x="25" y="86" class="serif h2 ink">清江一线</text><path d="M22 195 C95 131 153 212 220 155 C271 111 307 150 332 121" class="line"/><path d="M22 224 C94 171 155 243 222 188 C274 145 307 176 333 153" class="line" opacity=".35"/><text x="25" y="325" class="sans small muted">保存：一条江线 / 路线 / 山线关系</text><text x="25" y="372" class="sans small red">OPTIONAL / FORM AUTHORITY NEEDED</text><text x="25" y="405" class="sans small muted">当前只恢复记忆语法；</text><text x="25" y="428" class="sans small muted">最终产品形态不在此凭空补写。</text></g><g transform="translate(810,260)"><rect class="card" width="350" height="540" rx="26"/><text x="25" y="42" class="sans mono qing">SENSE</text><text x="25" y="86" class="serif h2 ink">清江雾气</text><circle cx="105" cy="190" r="76" class="mist"/><circle cx="175" cy="165" r="60" class="mist" opacity=".7"/><circle cx="245" cy="198" r="82" class="mist" opacity=".55"/><text x="25" y="325" class="sans small muted">保存：雾 / 湿度 / 空气感的记忆触发</text><text x="25" y="372" class="sans small red">OPTIONAL / HIGH SCRUTINY</text><text x="25" y="405" class="sans small muted">不宣称硒、保健或治疗功效；</text><text x="25" y="428" class="sans small muted">配方、容器与生产需另行验证。</text></g><g transform="translate(1185,260)"><rect class="card" width="350" height="540" rx="26"/><text x="25" y="42" class="sans mono qing">TOGETHER</text><text x="25" y="86" class="serif h2 ink">红花峰崽</text><path d="M85 235 L140 135 L194 232 L250 156 L295 238Z" fill="#d9e4dd" stroke="#315f55" stroke-width="3"/><circle cx="189" cy="224" r="15" fill="#315f55"/><text x="25" y="325" class="sans small muted">保存：家庭共同发现 / 对话 / 观察动作</text><text x="25" y="372" class="sans small red">FAMILY OPTIONAL / NOT ROUTE MASTER</text><text x="25" y="405" class="sans small muted">当前图只表达角色机制，</text><text x="25" y="428" class="sans small muted">不替代既有 IP 造型 authority。</text></g><text x="60" y="875" class="serif h2 ink">My Book / 我的石书</text><text x="350" y="875" class="sans body muted">数字端保存真实经过、停留、照片、互动和书写；与实体旅记形成“同一次旅行的两种记忆”，都不以完成率闭合。</text></svg>