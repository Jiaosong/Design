<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>.bg{fill:#f4f1e8}.ink{fill:#142720}.muted{fill:#68776f}.qing{fill:#315f55}.red{fill:#a44337}.path{stroke:#283b35;stroke-width:14;fill:none;stroke-linecap:round}.glow{fill:#b6d6cb}.glow2{fill:#d9e8e2}.foot{fill:#1e332d}.sans{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.serif{font-family:'Noto Serif CJK SC','Songti SC',serif}.h1{font-size:50px;font-weight:700}.h2{font-size:28px;font-weight:700}.body{font-size:17px}.small{font-size:13px}.mono{font-size:12px;font-weight:700;letter-spacing:2px}</style><rect class="bg" width="1600" height="1000"/><text x="60" y="68" class="sans mono qing">PHYSICAL / BODY FEEDBACK · EXISTING CONCEPT</text><text x="60" y="134" class="serif h1 ink">PHY-01《步步生光》</text><text x="60" y="175" class="sans body muted">保留“经过 → 短暂反馈 → 消退”的身体机制；当前不选址、不作为已确定 Physical Hero。</text><text x="1540" y="70" text-anchor="end" class="sans mono red">HOLD / FIELD-EVIDENCE RE-ENTRY</text><line x1="60" y1="212" x2="1540" y2="212" stroke="#c5cbc6"/><g transform="translate(70,300)"><text class="sans mono qing">00 / BEFORE</text><rect x="0" y="45" width="440" height="360" rx="28" fill="#e2e5dd"/><path d="M55 270 C170 190 278 260 382 180" class="path"/><circle cx="132" cy="236" r="13" class="foot"/><circle cx="161" cy="218" r="13" class="foot"/><text x="0" y="450" class="serif h2 ink">不主动吸引。</text><text x="0" y="483" class="sans small muted">游客先走路、看山；没有身体经过时，不制造持续发光事件。</text></g><g transform="translate(580,300)"><text class="sans mono qing">01 / PASS</text><rect x="0" y="45" width="440" height="360" rx="28" fill="#dce5de"/><path d="M55 270 C170 190 278 260 382 180" class="path"/><circle cx="205" cy="214" r="72" class="glow" opacity=".75"/><circle cx="205" cy="214" r="42" class="glow2"/><circle cx="190" cy="223" r="13" class="foot"/><circle cx="220" cy="204" r="13" class="foot"/><text x="0" y="450" class="serif h2 ink">身体经过才回应。</text><text x="0" y="483" class="sans small muted">反馈低强度、短暂，不扫码、不积分、不要求停留。</text></g><g transform="translate(1090,300)"><text class="sans mono qing">02 / FADE</text><rect x="0" y="45" width="440" height="360" rx="28" fill="#e2e5dd"/><path d="M55 270 C170 190 278 260 382 180" class="path"/><circle cx="255" cy="205" r="56" class="glow" opacity=".18"/><circle cx="300" cy="184" r="13" class="foot"/><circle cx="329" cy="166" r="13" class="foot"/><text x="0" y="450" class="serif h2 ink">反馈自然消退。</text><text x="0" y="483" class="sans small muted">不形成收集奖励；是否进入现场取决于真实 Need / 安全 / 维护证据。</text></g><g transform="translate(70,865)"><rect width="1460" height="70" rx="16" fill="#eee8df"/><text x="22" y="28" class="sans small red">CURRENT AUTHORITY</text><text x="190" y="28" class="sans small ink">UNLOCATED · Problem Exists UNKNOWN · FIELD EVIDENCE REQUIRED · HOLD</text><text x="22" y="52" class="sans small muted">Does not prove permanent rejection. It preserves the design mechanism while preventing false placement / engineering / operation claims.</text></g></svg>