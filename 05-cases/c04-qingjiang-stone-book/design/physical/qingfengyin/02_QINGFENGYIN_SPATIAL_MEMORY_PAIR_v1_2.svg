e="#477d77" stroke-width="2.4"/><rect x="400" y="244" width="42" height="42" fill="none" stroke="#a24d40" stroke-width="2"/><text x="46" y="268" class="body ink">“风停了一次，我才看到江面。”</text></g><text x="1116" y="740" class="h1 ink">只带走一句真实经历。</text><text x="1116" y="782" class="body muted">不是购买门槛，不要求集齐，不增加现场悬挂数量。</text><line x1="1116" y1="826" x2="1828" y2="826" class="l3"/><text x="1116" y="862" class="cap seal">C2 MASS HANGING</text><text x="1300" y="862" class="body seal">CUT PRIORITY</text><text x="1116" y="892" class="s muted">visual occupation / sound density / falling / entanglement / maintenance</text><line x1="58" y1="952" x2="1860" y2="952" class="l3"/><text x="58" y="990" class="cap seal">QUIET</text><text x="128" y="990" class="body ink">不动，也成立</text><text x="430" y="990" class="cap seal">BREEZE</text><text x="516" y="990" class="body ink">轻转 / 微弱存在提示</text><text x="900" y="990" class="cap seal">STRONG WIND</text><text x="1030" y="990" class="body ink">收束 / 停用，不追求更大动作</text><text x="58" y="1032" class="s muted">VERDICT · C0 NATURAL KEEP / C1 SINGLE DEVICE COMPETE / C2 MASS HANGING CUT / C3 MEMORY PAGE KEEP SECONDARY · FIELD OPEN / NTS</text></svg>