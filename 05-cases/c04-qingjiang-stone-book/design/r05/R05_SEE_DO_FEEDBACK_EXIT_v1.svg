<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,'Noto Sans SC',sans-serif" fill="#17211f"><text x="80" y="90" font-size="24" letter-spacing="3">R05 · 红花石林 · SCENE</text><text x="80" y="165" font-size="58" font-family="Georgia,'Noto Serif SC',serif">SEE → DO → FEEDBACK → END / EXIT</text><text x="80" y="215" font-size="20">景观优先；互动可选；一次观察即可结束；无积分、无解锁、无13/13。</text></g><g transform="translate(80 300)" font-family="Arial,'Noto Sans SC',sans-serif"><g><rect width="330" height="390" fill="#e5e3da"/><text x="26" y="52" font-size="30">01 · SEE</text><path d="M20 270L70 220 110 260 155 160 205 255 245 130 300 260" fill="none" stroke="#65766c" stroke-width="12"/><text x="26" y="330" font-size="18">先看峰林整体</text><text x="26" y="360" font-size="16">Digital = OFF / LIGHT</text></g><g transform="translate(365)"><rect width="330" height="390" fill="#e5e3da"/><text x="26" y="52" font-size="30">02 · DO</text><circle cx="90" cy="175" r="34" fill="none" stroke="#17211f" stroke-width="3"/><circle cx="170" cy="145" r="34" fill="none" stroke="#17211f" stroke-width="3"/><circle cx="250" cy="190" r="34" fill="none" stroke="#17211f" stroke-width="3"/><text x="26" y="330" font-size="18">找形 / 比较 / 构图</text><text x="26" y="360" font-size="16">可跳过，不拥有路线</text></g><g transform="translate(730)"><rect width="330" height="390" fill="#e5e3da"/><text x="26" y="52" font-size="30">03 · FEEDBACK</text><path d="M55 145H275M55 190H235M55 235H190" stroke="#855a46" stroke-width="6"/><text x="26" y="330" font-size="18">只记录“注意到了什么”</text><text x="26" y="360" font-size="16">可进入我的石书，不计分</text></g><g transform="translate(1095)"><rect width="330" height="390" fill="#e5e3da"/><text x="26" y="52" font-size="30">04 · EXIT</text><path d="M70 190H255M215 150L255 190 215 230" fill="none" stroke="#17211f" stroke-width="5"/><text x="26" y="330" font-size="18">抬头再看一次，继续走</text><text x="26" y="360" font-size="16">Route / Service / Return 不受影响</text></g></g><text x="80" y="790" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#69736e">SOURCE-GROUNDED peak-forest viewing relation · same-view / weather / precise viewpoint FIELD OPEN · diagram is conceptual, not survey.</text></svg>