<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R05 红花石林｜Scene Prototype v1</title><style>:root{--ink:#17211f;--paper:#f3f0e8;--water:#4f7776;--line:#a8b4ae;--accent:#8b5a43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.65fr)}.view{position:relative;overflow:hidden;min-height:720px;background:linear-gradient(#dce4df 0 48%,#a9c2bf 48% 55%,#d5d0c2 55%)}svg{width:100%;height:100%;position:absolute;inset:0}.ui{padding:32px;border-left:1px solid #b9bdb5;display:flex;flex-direction:column;gap:22px}.eyebrow{font-size:12px;letter-spacing:.14em}.title{font:600 clamp(34px,5vw,70px)/.95 Georgia,"Noto Serif SC",serif}.sub{max-width:34em;line-height:1.6}.step{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:14px 0;border-top:1px solid #c8c9c2}.n{font:24px Georgia}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button,.exit{border:1px solid #6f7771;background:transparent;padding:10px 12px;border-radius:999px;color:inherit}.controls button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.feedback{min-height:72px;padding:14px;border-left:3px solid var(--accent);background:#ebe7dc}.exit{margin-top:auto;text-align:left}.prompt{position:absolute;left:28px;bottom:28px;max-width:380px;background:rgba(243,240,232,.92);padding:16px 18px;border-radius:4px;box-shadow:0 10px 30px #0001}.prompt strong{display:block;margin-bottom:6px}.marker{cursor:pointer}.marker circle{fill:var(--paper);stroke:var(--ink);stroke-width:2}.marker text{font:600 15px system-ui;fill:var(--ink)}@media(max-width:850px){.shell{grid-template-columns:1fr}.view{min-height:58vh}.ui{border-left:0;border-top:1px solid #b9bdb5}.prompt{left:16px;right:16px;bottom:16px;max-width:none}}</style><div class="shell"><section class="view" aria-label="红花石林概念观察场景；非测绘、非现场视点"><svg viewBox="0 0 1000 760" role="img"><path d="M0 490L70 390 120 455 190 300 250 440 320 250 380 430 450 210 510 445 585 275 640 450 710 330 765 460 845 290 910 450 1000 360V760H0Z" fill="#7f8e83"/><path d="M0 535C180 500 320 550 480 515S760 520 1000 485V760H0Z" fill="#596c62" opacity=".78"/><path d="M0 610C240 560 390 620 590 575S820 590 1000 545" fill="none" stroke="#d9d5c7" stroke-width="18" opacity=".75"/><g class="marker" data-shape="A" transform="translate(330 248)"><circle r="22"/><text text-anchor="middle" dy="5">A</text></g><g class="marker" data-shape="B" transform="translate(585 275)"><circle r="22"/><text text-anchor="middle" dy="5">B</text></g><g class="marker" data-shape="C" transform="translate(845 290)"><circle r="22"/><text text-anchor="middle" dy="5">C</text></g></svg><div class="prompt"><strong>先看山，不先看任务。</strong><span id="scenePrompt">如果你愿意，选一个最容易记住的峰形。这里不要求完成。</span></div></section><aside class="ui"><div><div class="eyebrow">R05 · 红花石林 · SCENE / OBSERVE + PLAY</div><h1 class="title">看见一座峰，<br>记住一种形。</h1><p class="sub">游戏只帮助观察，不替代景观。峰林关系有公开来源支持；本图为概念化轮廓，不表示真实视点、天气或精确峰形。</p></div><div class="step"><div class="n">01</div><div><b>SEE</b><br>先自由观看。界面默认 LIGHT；不弹出倒计时、积分或 13/13。</div></div><div class="step"><div class="n">02</div><div><b>DO · 可选</b><div class="controls" id="aud"><button aria-pressed="true" data-aud="family">亲子 · 找形</button><button data-aud="youth">青年 · 构图</button><button data-aud="adult">成人 · 比较</button><button data-aud="older">低体力 · 只看</button></div></div></div><div class="step"><div class="n">03</div><div><b>FEEDBACK</b><div class="feedback" id="feedback">点选 A / B / C 中任一峰形，只记录“你注意到了什么”。</div></div></div><div class="step"><div class="n">04</div><div><b>END / EXIT</b><br>一次选择后即可结束；也可以从一开始就跳过。记录可进入“我的石书”，但不形成任务进度。</div></div><button class="exit" id="exit">结束观察 · 回到路线 / Return remains available →</button></aside></div><script>const copy={family:'和同行者各选一个最像“动物 / 字 / 人”的轮廓，再比较为什么不同。',youth:'只选一个轮廓作为摄影边界；先放下手机看，再决定是否拍。',adult:'比较近峰与远峰的重叠、疏密和江谷关系；解释层按需打开。',older:'不需要操作。保留观看、休息与返回；数字层保持 OFF/LIGHT。'};document.querySelectorAll('#aud button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#aud button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');feedback.textContent=copy[b.dataset.aud]});document.querySelectorAll('.marker').forEach(m=>m.onclick=()=>{feedback.textContent='已记下峰形 '+m.dataset.shape+'：只保存一次个人观察，不计分、不解锁。';scenePrompt.textContent='已经足够。抬头再看一次，然后继续走。'});exit.onclick=()=>{feedback.textContent='场景已结束。路线、Service 与 Return 不受本互动影响。';scenePrompt.textContent='数字退场。继续看山，或继续游程。'};</script></html>
