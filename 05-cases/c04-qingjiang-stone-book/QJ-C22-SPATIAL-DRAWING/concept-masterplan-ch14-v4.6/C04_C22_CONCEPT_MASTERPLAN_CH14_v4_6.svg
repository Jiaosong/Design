  </g>

  <!-- experience anchors, not geolocation -->
  <g transform="translate(780,892)">
    <circle r="16" fill="#F3F0E9" stroke="#245B58" stroke-width="1.2"/>
    <text y="4" class="mono id" text-anchor="middle" fill="#245B58">R06</text>
    <text x="30" y="4" class="sans small" fill="#44534F">河谷观察 / 恢复型空间</text>
  </g>
  <g transform="translate(1160,925)">
    <circle r="16" fill="#F3F0E9" stroke="#B65C49" stroke-width="1.2"/>
    <text y="4" class="mono id" text-anchor="middle" fill="#B65C49">R13</text>
    <text x="30" y="4" class="sans small" fill="#44534F">收束 / 通过型空间</text>
  </g>

  <!-- return is same cable interface, not a second route -->
  <path d="M420 836 C392 816 376 787 360 759" fill="none" stroke="#B65C49" stroke-width="1.2" stroke-dasharray="5 6" opacity=".66"/>
  <text x="446" y="842" class="mono meta" fill="#B65C49">RETURN / SAME CABLE</text>
</g>

<!-- 10% / THIRTEEN IMPRINTS + BRAND PUNCTUATION -->
<g id="PUNCTUATION_10" transform="translate(1544,154)">
  <text x="0" y="0" class="mono meta" fill="#6F7974">PAGE / TRACE</text>
  <text x="0" y="38" class="ser" font-size="24" font-weight="700" fill="#101817">需要时，再打开一页。</text>
  <text x="0" y="64" class="sans small" fill="#6F7974">阅读退到景观与路线之后。</text>

  <line x1="12" y1="112" x2="12" y2="630" stroke="#101817" stroke-opacity=".14"/>

  <g class="mono id">
    <g transform="translate(0,132)"><rect x="5" y="-6" width="14" height="14" fill="#B65C49"/><text x="40" y="5" fill="#101817">R01</text><text x="92" y="5" class="sans small" fill="#6F7974">越江</text></g>
    <g transform="translate(0,190)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R02</text></g>
    <g transform="translate(0,248)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R05</text></g>
    <g transform="translate(0,306)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R06</text><text x="92" y="5" class="sans small" fill="#6F7974">河谷</text></g>
    <g transform="translate(0,364)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R07</text></g>
    <g transform="translate(0,422)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R09</text></g>
    <g transform="translate(0,480)"><circle cx="12" cy="0" r="3.5" fill="#2E7571"/><text x="40" y="5" fill="#245B58">R12</text></g>
    <g transform="translate(0,538)"><rect x="5" y="-6" width="14" height="14" fill="#B65C49"/><text x="40" y="5" fill="#101817">R13</text><text x="92" y="5" class="sans small" fill="#6F7974">归缝</text></g>
  </g>

  <line x1="0" y1="674" x2="320" y2="674" stroke="#101817" stroke-opacity=".10"/>
  <text x="0" y="706" class="mono meta" fill="#6F7974">COMPANION</text>
  <text x="0" y="734" class="sans small" fill="#44534F">R03 · R04 · R08 · R10 · R11</text>
  <text x="0" y="760" class="sans small" fill="#6F7974">合并 / 替换 / OFF</text>

  <g transform="translate(0,826)">
    <rect width="24" height="24" fill="#B65C49"/>
    <path d="M6 8 H18 M6 13 H15 M10 18 H18" stroke="#F3F0E9" stroke-width="1.05" opacity=".86"/>
    <text x="40" y="10" class="mono meta" fill="#B65C49">MEMORY / RETURN</text>
    <text x="40" y="33" class="sans small" fill="#6F7974">身体与返程优先时，阅读退出。</text>
  </g>
</g>

<!-- footer -->
<text x="48" y="1052" class="mono meta" fill="#6F7974">ARRIVAL → ORIENT → CROSS → WALK → OBSERVE / RECOVER / CHOOSE → RETURN</text>
