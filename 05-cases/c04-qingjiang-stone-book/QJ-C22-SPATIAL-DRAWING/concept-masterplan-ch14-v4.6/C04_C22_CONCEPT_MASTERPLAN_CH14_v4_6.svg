<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="photoRightFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F3F0E9" stop-opacity="0"/>
    <stop offset=".74" stop-color="#F3F0E9" stop-opacity="0"/>
    <stop offset="1" stop-color="#F3F0E9" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="photoBottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3F0E9" stop-opacity="0"/>
    <stop offset=".34" stop-color="#F3F0E9" stop-opacity=".12"/>
    <stop offset=".66" stop-color="#F3F0E9" stop-opacity=".76"/>
    <stop offset="1" stop-color="#F3F0E9" stop-opacity=".98"/>
  </linearGradient>
  <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M0 17.5H18" stroke="#101817" stroke-opacity=".014"/>
    <path d="M17.5 0V18" stroke="#101817" stroke-opacity=".009"/>
  </pattern>
  <clipPath id="photoClip"><rect x="0" y="118" width="1500" height="962"/></clipPath>
  <style>
    .sans{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
    .ser{font-family:"Noto Serif CJK SC","Songti SC",serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .meta{font-size:10px;letter-spacing:1.55px}
    .small{font-size:13px}
    .body{font-size:15px}
    .id{font-size:11px;font-weight:800;letter-spacing:1px}
  </style>
</defs>

<!-- PAGE -->
<rect width="1920" height="1080" fill="#F3F0E9"/>
<rect width="1920" height="1080" fill="url(#paper)"/>

<!-- HEADER / PAGE -->
<text x="48" y="42" class="mono meta" fill="#6F7974">C04 / C22 · CONCEPT MASTERPLAN</text>
<text x="48" y="88" class="ser" font-size="34" font-weight="700" fill="#101817">江 · 索道 · 峰林</text>
<text x="302" y="87" class="sans small" fill="#6F7974">概念总平面</text>
<text x="1460" y="84" class="sans small" text-anchor="end" fill="#245B58">先游清江，再读清江。</text>
<line x1="48" y1="110" x2="1872" y2="110" stroke="#101817" stroke-opacity=".12"/>

<!-- 70% / REAL QINGJIANG LANDSCAPE FIELD -->
<g id="LANDSCAPE_70">
  <image href="assets/QINGJIANG_R06_REAL_SCENE.jpg" xlink:href="assets/QINGJIANG_R06_REAL_SCENE.jpg" x="0" y="118" width="1500" height="962"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  <rect x="0" y="118" width="1500" height="962" fill="url(#photoRightFade)"/>
  <rect x="0" y="640" width="1500" height="440" fill="url(#photoBottomFade)"/>
  <text x="52" y="164" class="mono meta" fill="#F3F0E9" opacity=".88">QINGJIANG / HONGHUA PEAK-FOREST</text>
  <text x="52" y="194" class="ser" font-size="24" font-weight="700" fill="#F3F0E9">先看完整河谷。</text>
</g>

<!-- 20% / ROUTE + BANK TRACE. Topology carrier, deliberately separate from photo registration. -->
<g id="TRACE_20">
  <!-- Two-bank relation -->
  <path d="M58 770 C300 748 512 770 735 754 C957 738 1202 756 1450 744"
