<g id="ANNOTATION_RAIL">
<line x1="1855" y1="292" x2="1855" y2="1452" class="hair"/>
<text x="1892" y="330" class="cap">EVIDENCE → FINDING → CONSEQUENCE</text>
<text x="1892" y="382" class="railhead">E-01 / SOURCE</text><text x="1892" y="412" class="sm">C22 v3.0 relation carriers + current project</text><text x="1892" y="434" class="sm">route/source authority. Base remains relational.</text>
<line x1="1892" y1="470" x2="2296" y2="470" class="hair"/>
<text x="1892" y="514" class="railhead">F-01 / SPATIAL FINDING</text><text x="1892" y="544" class="sm">跨江后不是线性十三站，而是南岸多分支</text><text x="1892" y="566" class="sm">步行关系；内容节点叠加在网络之上。</text>
<line x1="1892" y1="602" x2="2296" y2="602" class="hair"/>
<text x="1892" y="646" class="railhead">D-01 / DESIGN CONSEQUENCE</text><text x="1892" y="676" class="sm">地图 / App / Web / 纸图必须先表达 Route，</text><text x="1892" y="698" class="sm">再允许 R01–R13 被选择性打开。</text>
