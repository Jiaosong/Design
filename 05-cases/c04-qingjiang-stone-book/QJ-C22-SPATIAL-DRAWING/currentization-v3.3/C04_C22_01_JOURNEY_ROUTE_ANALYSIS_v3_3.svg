<g id="SHEET_HEADER">
<text x="74" y="103" class="cap">C04 / C22 · SPATIAL ANALYSIS · SOURCE-BOUND REV 3.3</text>
<text x="74" y="163" class="title">游程骨架与南岸分支网络｜Journey / Route Analysis</text>
<text x="2310" y="103" text-anchor="end" class="sm">RELATIONAL / NTS · NOT SURVEY · FIELD OPEN</text>
</g>
<g id="PRIMARY_CLAIM">
<text x="74" y="220" class="claim">路线不是十三个任务点，而是“到达—跨江—分支行走—回程”的空间网络。</text>
<text x="74" y="251" class="sub">主图先让关系自己成立；R01–R13 只作为可选内容节点，不覆盖 Route 主权。</text>
</g>
