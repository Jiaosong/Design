<rect class="paper" width="1684" height="2384"/>
<line x1="72" y1="64" x2="1612" y2="64" class="rule"/>
<text x="72" y="105" class="cap">OLEANDER / C04 / C22 · LANDSCAPE ANALYSIS · v3.5</text>
<text x="72" y="172" class="title">清江景观关系分层</text>
<text x="72" y="215" class="sub">同一场地只重复一次语义母体；水、路、身体事件与回程分别成为可读的景观 carrier。</text>
<text x="1612" y="105" text-anchor="end" class="small">RELATIONAL / NTS · FIELD OBSERVED=0 · G1F HOLD</text>
<line x1="591" y1="350" x2="591" y2="2200" class="cor"/>
<line x1="792" y1="470" x2="792" y2="2200" class="cor"/>
<text x="72" y="382" class="num">01</text><text x="128" y="365" class="cap">GROUND / WATER</text><text x="128" y="398" class="layer">已知的水体，不虚构地形</text><text x="128" y="425" class="small">清江水体是现阶段可追溯的 ground-water carrier；等高线、坡度与径流保持未画。</text>
<g clip-path="url(#p1)"><g transform="translate(100 310) scale(.42)"><use href="#g-river" class="river"/><use href="#g-arrival" class="ctx"/><use href="#g-ca" class="ctx"/><use href="#g-cb" class="ctx"/><use href="#g-s1" class="ctx"/><use href="#g-s2" class="ctx"/><use href="#g-s3" class="ctx"/><use href="#g-s4" class="ctx"/><use href="#g-s5" class="ctx"/><use href="#g-s6" class="ctx"/><use href="#g-s7" class="ctx"/><use href="#g-s8" class="ctx"/></g></g>
<path d="M510 525 C750 505 980 500 1190 500" class="lead"/><circle cx="510" cy="525" r="3.8" fill="#5f8f8b"/><text x="1212" y="495" class="label teal">清江 / WATER BODY</text><text x="1212" y="519" class="micro">source-bounded river carrier · not a hydraulic model</text><text x="1212" y="612" class="label">未画出的地形</text><text x="1212" y="636" class="micro">NO contour / ridge / slope / runoff without survey / DEM / field evidence</text>
<line x1="72" y1="790" x2="1612" y2="790" class="rule"/>
<text x="72" y="892" class="num">02</text><text x="128" y="875" class="cap">MOVEMENT / ACCESS</text><text x="128" y="908" class="layer">路线由连接关系证明，而不是靠箭头说明</text><text x="128" y="935" class="small">到达、索道、步行、条件性船行各自保留 carrier；分叉节点只在真实 edge 连接处出现。</text>
<g clip-path="url(#p2)"><g transform="translate(100 820) scale(.42)"><use href="#g-river" class="river" opacity=".48"/><use href="#g-arrival" class="walk"/><use href="#g-s1" class="walk"/><use href="#g-s2" class="walk"/><use href="#g-s3" class="walk"/><use href="#g-s4" class="walk"/><use href="#g-s5" class="walk"/><use href="#g-s6" class="walk2"/><use href="#g-s7" class="walk2"/><use href="#g-s8" class="walk2"/><use href="#g-boat" class="boat"/><use href="#g-ca" class="cable"/><use href="#g-cb" class="cable"/><circle cx="1653.854" cy="715.242" r="15" class="junc"/><circle cx="1966.746" cy="856.788" r="15" class="junc"/><circle cx="1773.057" cy="1132.433" r="15" class="junc"/><circle cx="2100.846" cy="1221.828" r="15" class="junc"/></g></g>
<text x="1212" y="1042" class="label">主步行网络</text><line x1="1212" y1="1065" x2="1270" y2="1065" class="walk"/><text x="1292" y="1070" class="micro">primary traversable relation carrier</text><text x="1212" y="1120" class="label teal">条件性水上到达</text><line x1="1212" y1="1143" x2="1270" y2="1143" class="boat"/><text x="1292" y="1148" class="micro">conditional access relation · not live-operation proof</text><text x="1212" y="1197" class="label">索道换乘</text><line x1="1212" y1="1220" x2="1270" y2="1220" class="cable"/><text x="1292" y="1225" class="micro">transport carrier / moving view secondary</text>
<line x1="72" y1="1300" x2="1612" y2="1300" class="rule"/>
<text x="72" y="1402" class="num">03</text><text x="128" y="1385" class="cap">VIEW / BODY / THRESHOLD</text><text x="128" y="1418" class="layer">景观节点用身体事件表达，不再全部画成 POI</text><text x="128" y="1445" class="small">R06 是观察与恢复关系；R13 是阈值带。二者的 geometry 与 node role 不同。</text>
<g clip-path="url(#p3)"><g transform="translate(100 1330) scale(.42)"><use href="#g-river" class="river" opacity=".26"/><use href="#g-arrival" class="ctx"/><use href="#g-ca" class="ctx"/><use href="#g-cb" class="ctx"/><use href="#g-s1" class="ctx"/><use href="#g-s2" class="ctx"/><use href="#g-s3" class="ctx"/><use href="#g-s4" class="ctx"/><use href="#g-s5" class="ctx"/><use href="#g-s6" class="ctx"/><use href="#g-s7" class="ctx"/><use href="#g-s8" class="ctx"/></g></g>
<path d="M330 1532 C455 1505 575 1485 698 1468" stroke="#b98562" stroke-width="4.8" stroke-opacity=".22" fill="none"/><text x="335" y="1504" class="micro ochre">MOVING VIEW / transport first</text><path d="M806 1570 L622 1500 A205 205 0 0 0 620 1658 Z" class="viewfill"/><circle cx="806" cy="1570" r="8" class="observe"/><circle cx="806" cy="1570" r="18" class="eyering"/><path d="M806 1570 C930 1552 1045 1540 1188 1532" class="lead"/><text x="1212" y="1527" class="label ochre">R06 · 观察 / 恢复</text><text x="1212" y="1551" class="micro">viewer position + relational view field + short recovery</text><path d="M760 1686 C780 1666 820 1664 842 1683 L842 1734 C818 1748 782 1746 760 1725 Z" class="threshold"/><path d="M802 1706 C955 1688 1076 1665 1188 1644" class="returnLead"/><text x="1212" y="1639" class="label red">R13 · 阈值 / 压缩</text><text x="1212" y="1663" class="micro">approach → compression → release; exact geometry / safety FIELD OPEN</text>
<line x1="72" y1="1810" x2="1612" y2="1810" class="rule"/>
<text x="72" y="1912" class="num">04</text><text x="128" y="1895" class="cap">CONTENT / SERVICE / RETURN</text><text x="128" y="1928" class="layer">内容节点服从旅程；Return 是决策关系，不是一枚图标</text><text x="128" y="1955" class="small">服务、换乘、可选内容、观察恢复和回程决策使用不同 node grammar。</text>
