_PROMOTION</text><rect x="70" y="300" width="1544" height="440" class="q"/><text x="96" y="334" class="cap">LAYER 01</text><text x="208" y="334" class="lt">GROUND / WATER — 已知载体</text><text x="96" y="361" class="sm">只画当前来源中可追溯的清江水体；没有测绘/DEM依据，不补等高线、山脊、坡度与径流。</text><rect x="70" y="800" width="1544" height="440" class="q"/><text x="96" y="834" class="cap">LAYER 02</text><text x="208" y="834" class="lt">MOVEMENT / ACCESS — 真实网络载体</text><text x="96" y="861" class="sm">道路/到达、索道、条件性船行关系、南岸主/次步行 carrier 分开；junction 由连接关系证明。</text><rect x="70" y="1300" width="1544" height="440" class="q"/><text x="96" y="1334" class="cap">LAYER 03</text><text x="208" y="1334" class="lt">VIEW / BODY / THRESHOLD — 景观事件</text><text x="96" y="1361" class="sm">R06 用“位置 + 视域/恢复场”表达；R13 用“阈值带”表达，不再把二者都画成同一种 POI 圆点。</text><rect x="70" y="1800" width="1544" height="440" class="q"/><text x="96" y="1834" class="cap">LAYER 04</text><text x="208" y="1834" class="lt">CONTENT / SERVICE / RETURN — 节点角色</text><text x="96" y="1861" class="sm">可选内容、服务、换乘、决策/回程功能使用不同节点语法；未证实的精确回程路径不画。</text><g clip-path="url(#c1)"><g transform="translate(79.2 272.10) scale(0.34)" id="MAP1"><use href="#g-river" class="w"/><use href="#g-arrival" class="ctx"/><use href="#g-ca" class="ctx"/><use href="#g-cb" class="ctx"/><use href="#g-s1" class="ctx"/><use href="#g-s2" class="ctx"/><use href="#g-s3" class="ctx"/><use href="#g-s4" class="ctx"/><use href="#g-s5" class="ctx"/><use href="#g-s6" class="ctx"/><use href="#g-s7" class="ctx"/><use href="#g-s8" class="ctx"/></g></g><g clip-path="url(#c2)"><g transform="translate(79.2 772.10) scale(0.34)" id="MAP2"><use href="#g-river" class="w" opacity=".72"/><use href="#g-arrival" class="maj"/><use href="#g-s1" class="maj"/><use href="#g-s2" class="maj"/><use href="#g-s3" class="maj"/><use href="#g-s4" class="maj"/><use href="#g-s5" class="maj"/><use href="#g-s6" class="min"/><use href="#g-s7" class="min"/><use href="#g-s8" class="min"/><use href="#g-boat" class="boat"/><use href="#g-ca" c