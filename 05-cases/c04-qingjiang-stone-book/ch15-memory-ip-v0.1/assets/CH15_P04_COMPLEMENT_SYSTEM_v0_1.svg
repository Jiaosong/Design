<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760"><style>.bg{fill:#f1ede4}.ink{fill:#111918}.d{fill:#133b3c}.q{fill:#2e7571}.r{fill:#b8543e}.m{fill:#65706a}.paper{fill:#fbf9f3;stroke:#bfc5be}.san{font-family:'Noto Sans CJK SC',sans-serif}.ser{font-family:'Noto Serif CJK SC',serif}</style><rect width="1400" height="760" class="bg"/><rect x="70" y="100" width="520" height="540" rx="22" class="paper"/><text x="112" y="154" class="san q" font-size="12" font-weight="700">PHYSICAL MEMORY</text><text x="112" y="208" class="ser ink" font-size="38">清江旅记</text><g class="san ink" font-size="18"><text x="112" y="300">手写</text><text x="112" y="350">折痕</text><text x="112" y="400">画与贴附</text><text x="112" y="450">路线痕迹</text><text x="112" y="500">身体留下的材料证据</text></g><rect x="810" y="100" width="520" height="540" rx="22" class="d"/><text x="852" y="154" class="san" fill="#9bc4b9" font-size="12" font-weight="700">DIGITAL MEMORY</text><text x="852" y="208" class="ser" fill="#f1ede4" font-size="38">我的石书</text><g class="san" fill="#f1ede4" font-size="18"><text x="852" y="300">scene index</text><text x="852" y="350">photo optional</text><text x="852" y="400">one sentence</text><text x="852" y="450">recomposition</text><text x="852" y="500">以后再看的关联</text></g><g transform="translate(700 370)"><circle r="84" fill="#f1ede4" stroke="#b8543e" stroke-width="2"/><text x="0" y="-22" text-anchor="middle" class="san r" font-size="11" font-weight="700">SHARED GRAMMAR</text><text x="0" y="14" text-anchor="middle" class="ser ink" font-size="22">场景 + 动作</text><text x="0" y="46" text-anchor="middle" class="ser ink" font-size="22">+ 一句话</text></g><text x="700" y="706" text-anchor="middle" class="san m" font-size="13">互补，不互相备份 · 不要求实时同步 · 任一侧都能独立成立</text></svg>