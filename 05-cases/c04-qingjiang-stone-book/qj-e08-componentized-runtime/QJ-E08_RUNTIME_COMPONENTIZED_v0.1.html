<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QJ-E08 Componentized Runtime Portable Mirror</title><style>:root {
  --qj-color-rock-950: #101714;
  --qj-color-rock-900: #17211D;
  --qj-color-rock-800: #23312B;
  --qj-color-paper-100: #F2EFE7;
  --qj-color-paper-200: #E5DFD1;
  --qj-color-qing-500: #3F7B70;
  --qj-color-qing-300: #86AAA0;
  --qj-color-bronze-500: #9B7B45;
  --qj-color-vermilion-500: #A84636;
  --qj-color-safe-500: #6F917D;
  --qj-space-1: 4px;
  --qj-space-2: 8px;
  --qj-space-3: 12px;
  --qj-space-4: 16px;
  --qj-space-5: 20px;
  --qj-space-6: 24px;
  --qj-space-8: 32px;
  --qj-radius-sm: 8px;
  --qj-radius-md: 14px;
  --qj-radius-lg: 22px;
  --qj-touch-min: 48px;
}

*{box-sizing:border-box}html,body{margin:0;background:#090d0b;color:var(--qj-color-paper-100);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}button{font:inherit}.qj-app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--qj-color-rock-950);padding-bottom:72px}.qj-app[data-chrome="none"]{padding-bottom:0}.qj-header{padding:22px 20px 14px;background:var(--qj-color-rock-900);border-bottom:1px solid #334038;display:flex;align-items:end;justify-content:space-between}.qj-header h1{margin:4px 0 0;font:600 25px "Noto Serif SC",serif}.qj-eyebrow,.qj-kicker{font-size:10px;letter-spacing:.14em;color:var(--qj-color-qing-300)}.qj-provenance{padding:8px 20px;font-size:9px;color:#c6c2b8;background:#201e19}.qj-provenance:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--qj-color-vermilion-500);margin-right:8px}.qj-main{padding:24px 20px}.qj-main h2{font:600 28px/1.4 "Noto Serif SC",serif;margin:14px 0}.qj-lead{font-size:13px;line-height:1.7;color:#d0cec5}.qj-button{display:block;width:100%;min-height:var(--qj-touch-min);border-radius:var(--qj-radius-sm);padding:12px 16px;margin:8px 0;border:1px solid #334038;background:transparent;color:var(--qj-color-paper-100);font-weight:600;text-align:left;cursor:pointer}.qj-button[data-variant="primary"]{background:var(--qj-color-bronze-500);border-color:var(--qj-color-bronze-500);color:#111}.qj-button[data-variant="secondary"]{background:#1d3832;border-color:var(--qj-color-qing-500)}.qj-button[data-variant="critical"]{background:#25362f;border-color:var(--qj-color-safe-500)}.qj-button:focus-visible,.qj-nav button:focus-visible{outline:2px solid var(--qj-color-paper-100);outline-offset:2px}.qj-prompt{border-left:3px solid var(--qj-color-bronze-500);padding-left:16px;margin:32px 0}.qj-prompt strong{display:block;font-size:10px;letter-spacing:.12em;color:var(--qj-color-qing-300)}.qj-prompt p{font:500 23px/1.6 "Noto Serif SC",serif;margin:8px 0}.qj-reveal{border:1px solid #31564c;border-radius:var(--qj-radius-md);padding:18px;background:#173028}.qj-reveal small{color:var(--qj-color-qing-300)}.qj-section-diagram{height:120px;border-bottom:1px solid #71847a;position:relative;margin:16px 0}.qj-section-diagram:before,.qj-section-diagram:after{content:"";position:absolute;bottom:0;width:55%;height:75px;border:1px solid #9fb1a7;border-radius:50% 50% 0 0}.qj-section-diagram:before{left:0}.qj-section-diagram:after{right:0;height:55px}.qj-route{height:245px;border:1px solid #334038;border-radius:var(--qj-radius-lg);position:relative;overflow:hidden;background:#17261f;margin:18px 0}.qj-route:before{content:"";position:absolute;left:65px;top:175px;width:240px;height:2px;background:var(--qj-color-paper-200);transform:rotate(-31deg)}.qj-route-node{position:absolute;width:17px;height:17px;transform:rotate(45deg);border:2px solid var(--qj-color-paper-100);background:var(--qj-color-rock-900)}.qj-route-node[data-index="1"]{left:70px;top:176px}.qj-route-node[data-index="2"]{left:145px;top:132px;background:var(--qj-color-bronze-500);border-color:var(--qj-color-bronze-500);width:22px;height:22px}.qj-route-node[data-index="3"]{left:222px;top:87px}.qj-route-node[data-index="4"]{left:300px;top:42px}.qj-service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qj-service-item{border:1px solid #334038;border-radius:var(--qj-radius-sm);padding:14px;min-height:96px}.qj-service-item small{display:block;color:#b8b5ad;margin-top:30px}.qj-memory{background:#e9e4d8;color:#1b241f;border-radius:20px;padding:24px;min-height:330px}.qj-memory blockquote{font:500 22px/1.6 "Noto Serif SC",serif;margin:32px 0}.qj-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:grid;grid-template-columns:repeat(4,1fr);background:#090d0b;border-top:1px solid #334038}.qj-nav button{min-height:60px;border:0;background:transparent;color:#b8b5ad}.qj-nav button[aria-current="page"]{color:var(--qj-color-paper-100);background:#141b17}.qj-silence{min-height:100vh;display:grid;place-content:center;text-align:center;padding:40px 28px;background:var(--qj-color-rock-950)}.qj-silence h2{font:600 30px/1.45 "Noto Serif SC",serif}.qj-silence .qj-button{margin-top:44px}.qj-card{border:1px solid #334038;border-radius:var(--qj-radius-md);padding:18px;margin:16px 0;background:#141e1a}.gallery{width:min(100%,980px);margin:auto;padding:32px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.gallery section{border:1px solid #334038;border-radius:var(--qj-radius-md);padding:20px;background:var(--qj-color-rock-950)}@media(max-width:480px){.gallery{padding:16px}.qj-main{padding:20px 18px}}
</style></head><body><div class="qj-app" data-chrome="full"></div><script>const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
class QJAction extends HTMLElement{connectedCallback(){const v=this.getAttribute('variant')||'tertiary';const label=this.getAttribute('label')||this.textContent.trim()||'继续';const go=this.getAttribute('go')||'';this.innerHTML=`<button class="qj-button" data-variant="${esc(v)}" data-go="${esc(go)}">${esc(label)}</button>`}}
class QJPrompt extends HTMLElement{connectedCallback(){const type=this.getAttribute('type')||'find';const label=this.getAttribute('label')||'看';const text=this.getAttribute('text')||'';this.innerHTML=`<div class="qj-prompt" data-type="${esc(type)}"><strong>${esc(label)}</strong><p>${esc(text)}</p></div>`}}
class QJReveal extends HTMLElement{connectedCallback(){const mode=this.getAttribute('mode')||'fallback-2d';const title=this.getAttribute('title')||'示意关系';const copy=this.getAttribute('copy')||'';this.innerHTML=`<section class="qj-reveal" data-mode="${esc(mode)}"><small>${mode==='fallback-2d'?'FALLBACK-2D':esc(mode)}</small><div class="qj-section-diagram" aria-hidden="true"></div><b>${esc(title)}</b><p class="qj-lead">${esc(copy)}</p></section>`}}
class QJRouteCanvas extends HTMLElement{connectedCallback(){this.innerHTML='<div class="qj-route" aria-label="路线关系示意；位置为模拟数据"><i class="qj-route-node" data-index="1"></i><i class="qj-route-node" data-index="2"></i><i class="qj-route-node" data-index="3"></i><i class="qj-route-node" data-index="4"></i></div>'}}
class QJServiceItem extends HTMLElement{connectedCallback(){const label=this.getAttribute('label')||'';const state=this.getAttribute('state')||'UNKNOWN';this.innerHTML=`<div class="qj-service-item"><b>${esc(label)}</b><small>${esc(state)}</small></div>`}}
class QJMemoryEntry extends HTMLElement{connectedCallback(){const quote=this.getAttribute('quote')||'';const meta=this.getAttribute('meta')||'DEMO FOLIO';this.innerHTML=`<article class="qj-memory"><small>${esc(meta)}</small><blockquote>“${esc(quote)}”</blockquote><p>记录不是成就；未经过的节点不会被标记为失败。</p></article>`}}
class QJNav extends HTMLElement{connectedCallback(){const current=this.getAttribute('current')||'today';this.innerHTML=`<nav class="qj-nav" aria-label="主导航">${[['today','今日'],['route','路线'],['book','我的石书'],['service','服务']].map(([k,l])=>`<button data-go="${k}" ${current===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`}}
customElements.define('qj-action',QJAction);customElements.define('qj-prompt',QJPrompt);customElements.define('qj-reveal',QJReveal);customElements.define('qj-route-canvas',QJRouteCanvas);customElements.define('qj-service-item',QJServiceItem);customElements.define('qj-memory-entry',QJMemoryEntry);customElements.define('qj-nav',QJNav);
const componentRegistry=['qj-action','qj-prompt','qj-reveal','qj-route-canvas','qj-service-item','qj-memory-entry','qj-nav'];

const capabilities=Object.freeze({gpsVerified:false,arVerified:false,liveServiceVerified:false,fieldSafetyVerified:false});
const states=Object.freeze({
  today:{reading:'ENTRY',chrome:'full',nav:'today',next:['route','service']},
  route:{reading:'JOURNEY',chrome:'full',nav:'route',next:['s1','service']},
  s1:{reading:'READ_1_FIND_COMPARE',chrome:'full',nav:'route',nodeMode:'S1',next:['s2','route']},
  s2:{reading:'READ_2_3_UNDERSTAND',chrome:'full',nav:'route',nodeMode:'S2',reveal:capabilities.arVerified?'ar':'fallback-2d',next:['record','route']},
  record:{reading:'READ_4_LEAVE',chrome:'full',nav:'route',next:['s0']},
  s0:{reading:'READ_0_PRESENCE',chrome:'none',nav:null,nodeMode:'S0',digitalSilence:true,next:['closure']},
  closure:{reading:'CLOSURE',chrome:'full',nav:'route',next:['book','service']},
  book:{reading:'MEMORY',chrome:'full',nav:'book',next:['route']},
  service:{reading:'SAFETY_RETURN',chrome:'full',nav:'service',next:['route']}
});
const primaryJourney=['today','route','s1','s2','record','s0','closure','book'];
function resolveState(hash){const key=(hash||'').replace(/^#/,'');return states[key]?key:'today'}
function canTransition(from,to){return Boolean(states[from]?.next.includes(to))}

const views={
 today:{title:'今日清江',html:`<div class="qj-kicker">入江开卷</div><h2>先确认你在哪里，<br>再决定今天读多少。</h2><p class="qj-lead">数字层只辅助路线、理解与记录。真实景观始终是主体验。</p><div class="qj-card"><div class="qj-kicker">当前位置 · SIMULATED</div><h3>入江段 · 示例位置</h3><p>建议体验：轻读　预计时间：45 min*</p><small>* 原型占位，不代表现场验证数据。</small></div><qj-action variant="primary" go="route" label="开始今日旅程 →"></qj-action><qj-action go="service" label="先查看返回与服务 ↗"></qj-action>`},
 route:{title:'路线',html:`<div class="qj-kicker">真实行动层 + 十三印阅读层</div><h2>你正在从江面<br>进入山体阅读。</h2><qj-route-canvas></qj-route-canvas><p class="qj-lead">下一阅读点 · S1｜两岸对读。只给一句观察令，不先解释答案。</p><qj-action variant="primary" go="s1" label="进入观察 →"></qj-action><qj-action variant="secondary" go="service" label="返回 / 服务 ↗"></qj-action>`},
 s1:{title:'S1 · 观察提示',html:`<div class="qj-kicker">READ 1 · 发现</div><h2>先看，不急着知道。</h2><qj-prompt type="compare" label="比 · COMPARE" text="同时看看两岸，哪一侧出现更多平缓面？"></qj-prompt><p class="qj-lead">完成标准是一次真实观看，而不是一次手机点击。</p><qj-action variant="primary" go="s2" label="我看到了不同 →"></qj-action><qj-action go="route" label="先继续走 ←"></qj-action>`},
 s2:{title:'S2 · 数字揭示',html:`<div class="qj-kicker">READ 2–3 · 比较 → 看懂</div><h2>数字只揭示<br>现场难以直接说明的关系。</h2><qj-reveal mode="fallback-2d" title="示意关系" copy="二维剖面作为 AR 未验证时的降级路径；图形只验证信息层级，不作为地貌事实。"></qj-reveal><qj-action variant="primary" go="record" label="记录这一页 ＋"></qj-action><qj-action go="route" label="返回现场 ←"></qj-action>`},
 record:{title:'已写入',html:`<div class="qj-kicker">READ 4 · 留下</div><h2>此页已写入<br>你的清江石书。</h2><p class="qj-lead">这是非阻断反馈，只确认这一页已经写入记录。</p><div class="qj-card">记录类型：Comparison · 示例</div><qj-action variant="primary" go="s0" label="继续下一段 →"></qj-action>`},
 closure:{title:'回江成书',html:`<div class="qj-kicker">CLOSURE WALK</div><h2>不以“完成全部节点”结束，<br>而以一次完整阅读结束。</h2><p class="qj-lead">短路线、跳过节点或节点关闭，都不构成用户失败。</p><qj-action variant="primary" go="book" label="生成今日石书 →"></qj-action><qj-action variant="secondary" go="service" label="查看返回 ↗"></qj-action>`},
 book:{title:'我的石书',html:`<div class="qj-kicker">个人时间档案</div><h2>今日一页清江</h2><qj-memory-entry meta="2026 · DEMO FOLIO 01" quote="我先注意到两岸并不一样，之后才去看解释。"></qj-memory-entry><qj-action variant="secondary" go="route" label="回到路线 ←"></qj-action>`},
 service:{title:'服务与返回',html:`<div class="qj-kicker">SAFETY / RETURN FIRST</div><h2>服务事实优先于<br>文化装饰。</h2><p class="qj-lead">真实出口距离、运营状态与风险信息必须接现场 / 官方 Authority。</p><div class="qj-service-grid"><qj-service-item label="返回路线" state="STATIC DEMO"></qj-service-item><qj-service-item label="最近休息" state="UNKNOWN"></qj-service-item><qj-service-item label="厕所" state="UNKNOWN"></qj-service-item><qj-service-item label="急救" state="OFFICIAL REQUIRED"></qj-service-item></div><qj-action variant="critical" go="route" label="返回路线 ←"></qj-action>`}
};
function app(){return document.querySelector('.qj-app')}
function renderS0(){const el=app();el.dataset.chrome='none';el.innerHTML=`<main class="qj-silence" tabindex="-1"><div><div class="qj-kicker">READ 0 · 在场</div><h2>这里不需要更多界面。</h2><p class="qj-lead">收起手机。让声音、风、尺度和身体位置重新成为主角。</p><qj-action go="closure" label="离开后继续 →"></qj-action></div></main>`;el.querySelector('main').focus({preventScroll:true})}
function render(){const key=resolveState(location.hash);const state=states[key];if(state.chrome==='none'){renderS0();return}const view=views[key];const el=app();el.dataset.chrome='full';el.innerHTML=`<header class="qj-header"><div><div class="qj-eyebrow">QJ-E08 · WORKING SOURCE</div><h1>${view.title}</h1></div><qj-action go="service" label="服务"></qj-action></header><div class="qj-provenance">位置 SIMULATED · AR ${capabilities.arVerified?'VERIFIED':'FALLBACK-2D'} · 服务 ${capabilities.liveServiceVerified?'LIVE':'STATIC DEMO'}</div><main class="qj-main" tabindex="-1">${view.html}</main><qj-nav current="${state.nav}"></qj-nav>`;el.querySelector('main').focus({preventScroll:true})}
document.addEventListener('click',e=>{const button=e.target.closest('[data-go]');if(!button)return;const from=resolveState(location.hash);const to=button.dataset.go;if(canTransition(from,to)||to==='service'||(from==='service'&&to==='route'))location.hash=to});addEventListener('hashchange',render);render();
</script></body></html>
