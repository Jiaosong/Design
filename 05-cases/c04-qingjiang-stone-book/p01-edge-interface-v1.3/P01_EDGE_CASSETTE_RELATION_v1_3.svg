<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>.bg{fill:#f3efe5}.paper{fill:#fbfaf5;stroke:#c5cbc6;stroke-width:1}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.stone{fill:#d8d7ce}.edge{fill:#789d92}.dark{fill:#243b35}.glow{fill:#9cc8bc}.line{stroke:#17332c;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7c8983;stroke-width:1.15;fill:none}.dash{stroke:#9ba49f;stroke-width:1;fill:none;stroke-dasharray:5 5}.h1{font:700 39px 'Noto Serif CJK SC',serif}.h2{font:700 22px 'Noto Serif CJK SC',serif}.h3{font:700 15px 'Noto Sans CJK SC',sans-serif}.b{font:400 13px 'Noto Sans CJK SC',sans-serif}.sm{font:400 11px 'Noto Sans CJK SC',sans-serif}.xs{font:700 9.5px 'Noto Sans CJK SC',sans-serif;letter-spacing:1px}</style><rect width="1400" height="820" class="bg"/><text x="54" y="54" class="xs qing">P01 / B-CANDIDATE · EDGE CASSETTE INTERFACE v1.3</text><text x="54" y="104" class="h1 ink">踏面保持完整，反馈与检修都退到侧缘</text><text x="54" y="142" class="b muted">几何关系为设计候选，不是施工尺寸。所有数值接口保持 OPEN，避免把视觉训练值误写成工程公差。</text><text x="54" y="178" class="xs seal">CONCEPT / NTS / FIELD OPEN / NOT FOR CONSTRUCTION</text><g transform="translate(54 226)"><text class="h3 ink">PLAN RELATION</text><rect x="0" y="42" width="690" height="230" class="stone"/><rect x="690" y="42" width="64" height="230" class="edge"/><rect x="754" y="42" width="24" height="230" class="dark"/><path d="M48 152h544" class="thin"/><path d="M548 136l44 16-44 16" class="line"/><text x="0" y="310" class="xs qing">PRIMARY WALKING FIELD</text><text x="520" y="310" class="xs qing">EDGE RESPONSE</text><text x="718" y="310" class="xs seal">SERVICE SIDE</text><g transform="translate(850 0)"><text class="h3 ink">SECTION RELATION</text><rect x="0" y="104" width="310" height="52" class="stone"/><rect x="310" y="104" width="64" height="52" class="edge"/><rect x="374" y="104" width="24" height="52" class="dark"/><line x1="0" y1="156" x2="460" y2="156" class="line"/><text x="0" y="206" class="sm muted">flush relation candidate</text><text x="0" y="244" class="sm muted">walk surface remains uninterrupted</text><text x="0" y="282" class="sm seal">actual fixing / sealing / drainage = OPEN</text></g><line x1="0" y1="370" x2="1290" y2="370" class="thin"/><text x="0" y="414" class="h3 ink">DESIGN CLAIM → REPRESENTATION → EVIDENCE BOUNDARY</text><text x="0" y="460" class="xs qing">UNDERSTAND</text><text x="120" y="460" class="b ink">路仍然首先是一条路，不是灯具阵列。</text><text x="0" y="500" class="xs qing">OPERATE</text><text x="120" y="500" class="b ink">身体正常经过，不需要踩中目标；维修从侧缘进入。</text><text x="0" y="540" class="xs qing">FEEL</text><text x="120" y="540" class="b ink">夜间只出现邻近短段回应，随后退暗。</text><text x="0" y="580" class="xs qing">EDITABILITY</text><text x="120" y="580" class="b ink">SVG source；主踏面 / edge cassette / service side / glow 分层。</text><text x="0" y="620" class="xs seal">OPEN</text><text x="120" y="620" class="b muted">位置、材料、尺寸、公差、排水、电气、防滑、眩光、生态、检修、无障碍。</text></g></svg>