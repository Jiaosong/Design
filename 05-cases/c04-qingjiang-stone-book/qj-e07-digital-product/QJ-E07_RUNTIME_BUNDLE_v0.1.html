 class="btn primary" data-go="book">生成今日石书 →</button><button class="btn secondary" data-go="service">查看返回 ↗</button>`],book:['我的石书',`<div class="kicker">个人时间档案</div><h2>今日一页清江</h2><article class="book"><small>2026 · DEMO FOLIO 01</small><blockquote>“我先注意到两岸并不一样，之后才去看解释。”</blockquote><p>记录：比较 · 观察 · 一段数字揭示。没有“未完成”提示。</p></article><button class="btn secondary" data-go="route">回到路线 ←</button>`],service:['服务与返回',`<div class="kicker">SAFETY / RETURN FIRST</div><h2>服务事实优先于<br>文化装饰。</h2><p class="lead">真实出口距离、运营状态与风险信息必须接现场 / 官方 Authority。</p><div class="service"><div>返回路线<small>STATIC DEMO</small></div><div>最近休息<small>UNKNOWN</small></div><div>厕所<small>UNKNOWN</small></div><div>急救<small>OFFICIAL REQUIRED</small></div></div><button class="btn primary" data-go="route">返回路线 ←</button>`]};
