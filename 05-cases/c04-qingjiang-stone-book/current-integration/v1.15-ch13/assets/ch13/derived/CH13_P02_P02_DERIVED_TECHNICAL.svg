<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<style>
.bg{fill:#f4f1e8}.ink{fill:#142720}.muted{fill:#68776f}.qing{fill:#315f55}.red{fill:#a44337}.line{stroke:#1b302a;stroke-width:3;fill:none}.thin{stroke:#8c9993;stroke-width:1.5;fill:none}.dim{stroke:#a44337;stroke-width:1.6;fill:none}.ground{stroke:#6f7c76;stroke-width:2}.steel{fill:#243a34}.wood{fill:#9a7b48}.concrete{fill:#d4d5cf}.human{stroke:#263d36;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.serif{font-family:'Noto Serif CJK SC','Songti SC',serif}.h1{font-size:48px;font-weight:700}.h2{font-size:24px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.tiny{font-size:11px}.mono{font-size:12px;font-weight:700;letter-spacing:2px}
</style>
<rect class="bg" width="1600" height="1000"/>
<text x="60" y="68" class="sans mono qing">PHYSICAL / SERVICE SUPPORT · CURRENTIZATION V1</text>
<text x="60" y="132" class="serif h1 ink">栏杆式可拆卸倚靠休息板</text>
<text x="60" y="171" class="sans body muted">短时倚靠 / 半坐 / 恢复。当前角色：KEEP · HIGH-PRIORITY SUPPORT · NOT LOCATED。</text>
<text x="1540" y="70" text-anchor="end" class="sans mono red">CONCEPT / NTS / FIELD OPEN</text>
<text x="1540" y="94" text-anchor="end" class="sans tiny muted">NOT FOR CONSTRUCTION</text>
<line x1="60" y1="206" x2="1540" y2="206" class="thin"/>
<g transform="translate(80,270)">
 <text x="0" y="0" class="sans mono qing">01 / ELEVATION + BODY SCALE</text>
 <line x1="0" y1="500" x2="840" y2="500" class="ground"/>
 <rect x="120" y="272" width="560" height="70" rx="8" class="wood"/>
 <rect x="165" y="342" width="34" height="158" class="steel"/>
 <rect x="601" y="342" width="34" height="158" class="steel"/>
 <rect x="135" y="500" width="94" height="78" class="concrete"/><rect x="571" y="500" width="94" height="78" class="concrete"/>
 <circle cx="770" cy="205" r="31" class="human"/><path d="M770 238 L748 360 L710 435 M748 360 L792 432 M750 285 L690 332" class="human"/>
 <path d="M690 332 L664 326" class="human"/>
 <line x1="120" y1="225" x2="680" y2="225" class="dim"/><line x1="120" y1="215" x2="120" y2="235" class="dim"/><line x1="680" y1="215" x2="680" y2="235" class="dim"/>
 <text x="400" y="212" text-anchor="middle" class="sans small red">1200 recommended [800–1400]</text>
 <line x1="85" y1="272" x2="85" y2="500" class="dim"/><line x1="75" y1="272" x2="95" y2="272" class="dim"/><line x1="75" y1="500" x2="95" y2="500" class="dim"/>
 <text x="64" y="390" transform="rotate(-90 64 390)" text-anchor="middle" class="sans small red">975 recommended [900–1050]</text>
 <text x="735" y="495" class="sans tiny muted">HUMAN REF · H≈1700</text>
 <text x="0" y="620" class="sans tiny muted">Concept sizing inherited from C23. Actual rail/substrate capacity, anchoring, clear width, wet-weather behavior and accessibility remain FIELD / ENGINEERING OPEN.</text>
</g>
<g transform="translate(980,270)">
 <text x="0" y="0" class="sans mono qing">02 / USE + SECTION LOGIC</text>
 <line x1="0" y1="500" x2="500" y2="500" class="ground"/>
 <polygon points="145,270 310,245 322,315 155,338" class="wood"/>
 <rect x="190" y="330" width="36" height="170" class="steel"/>
 <rect x="160" y="500" width="96" height="78" class="concrete"/>
 <circle cx="390" cy="210" r="30" class="human"/><path d="M390 242 L365 352 L330 430 M365 352 L410 428 M367 290 L316 327" class="human"/>
 <path d="M316 327 L286 323" class="human"/>
 <path d="M140 250 A100 100 0 0 1 235 232" class="dim"/>
 <text x="96" y="228" class="sans small red">≈10° concept</text>
 <line x1="145" y1="205" x2="322" y2="205" class="dim"/><text x="233" y="190" text-anchor="middle" class="sans small red">160 rec. [120–180]</text>
 <rect x="0" y="625" width="500" height="180" rx="20" fill="#e5ebe6"/>
 <text x="22" y="660" class="serif h2 ink">动作不是“坐下打卡”，而是恢复后继续走。</text>
 <text x="22" y="697" class="sans body muted">走 → 累 → 靠 / 半坐 → 看 → 再走</text>
 <text x="22" y="736" class="sans small qing">A4 / A5 优先价值</text>
 <text x="22" y="768" class="sans small muted">如果没有真实疲劳 / 停留需要，C0 不介入仍优先。</text>
</g>
<g transform="translate(60,925)"><text class="sans tiny muted">SOURCE BASIS: C23 concept board + current Field-Evidence Protocol.  Does not prove site location / load / clear width / safety / durability / accessibility / operation.</text></g>
</svg>
