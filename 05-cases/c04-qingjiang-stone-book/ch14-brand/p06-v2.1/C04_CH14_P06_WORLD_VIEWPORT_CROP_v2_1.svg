<text x="80" y="64" class="xs jade">CH14 / P06 v2.1 CANDIDATE · ROUTE-03 WORLD-VIEWPORT CROP</text>
<text x="80" y="136" class="h1 ink">路线不缩成一张小卡；载体只打开同一个世界的不同窗口</text>
<text x="80" y="178" class="body muted">P06 只证明裁切语法：几何来自锁定 ROUTE-03，同一个 Tall carrier 通过 crop / pan / focus 读取不同区域；不移动节点、不重画曲线、不在此页承担 App 导航。</text>
<text x="80" y="218" class="xs red">ROUTE-03 LOCKED · GEOMETRY MUTATION=NONE · EXCERPT/CROP/STYLING ONLY · NTS / NOT GPS / NO_PROMOTION</text><line x1="80" y1="246" x2="1840" y2="246" stroke="#aaa"/>
<g transform="translate(80 296)"><text x="0" y="-18" class="xs jade">01 / LOCKED WORLD</text><rect width="900" height="620" rx="18" class="paper"/><text x="34" y="48" class="h2 ink">一份 ROUTE-03，所有窗口都从这里裁切</text><text x="34" y="80" class="sm muted">下方红色框只是 viewport bounds，不是第二套地图。</text><g transform="translate(34 120) scale(.62 .62)"><use href="#route03"/></g><rect x="220" y="265" width="200" height="260" class="crop"/><rect x="418" y="292" width="200" height="260" class="crop"/><text x="220" y="552" class="xs red">VIEWPORT A</text><text x="418" y="579" class="xs red">VIEWPORT B</text><text x="34" y="594" class="sm muted">两个窗口相互重叠，保留连续 landmark，而不是每一屏重新排一条“更好看”的路线。</text></g>
<g transform="translate(1040 296)"><text x="0" y="-18" class="xs jade">02 / TALL VIEWPORT A</text><rect width="350" height="560" rx="16" class="deep"/><g clip-path="url(#vpA)"><g transform="translate(-150 60) scale(.78 .78)"><use href="#route03"/></g></g><text x="22" y="42" class="xs" fill="#D8C9B1">WORLD / ROUTE-03</text><text x="22" y="524" class="sm" fill="#F1EDE4">蝴蝶崖附近进入视窗；世界仍继续在屏外。</text></g>
<g transform="translate(1470 296)"><text x="0" y="-18" class="xs jade">03 / TALL VIEWPORT B</text><rect width="350" height="560" rx="16" class="deep"/><g clip-path="url(#vpB)"><g transform="translate(-360 60) scale(.78 .78)"><use href="#route03"/></g></g><text x="22" y="42" class="xs" fill="#D8C9B1">WORLD / ROUTE-03</text><text x="22" y="508" class="sm" fill="#F1EDE4"><tspan x="22" dy="0">继续向下游裁切；蝴蝶崖 source node</tspan><tspan x="22" dy="20">仍保留在左侧作为连续 landmark。</tspan></text></g>
