<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
.bg{fill:#f2efe6}.paper{fill:#fbfaf5;stroke:#c9c8bf;stroke-width:1.1}
.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.soft{fill:#e6ebe7}.river{fill:#77a497}
.main{stroke:#17332c;stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round}
.branch{stroke:#548b7e;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.return{stroke:#a54539;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 10}
.thin{stroke:#89938d;stroke-width:1.05;fill:none}.body{stroke:#17332c;stroke-width:2.2;fill:none;stroke-linecap:round}
.t1{font:700 42px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif}
.t2{font:700 22px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif}
.t3{font:700 16px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.txt{font:400 14px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.sm{font:400 12px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.xs{font:700 10.5px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif;letter-spacing:1.1px}
</style>
<rect class="bg" width="1600" height="1000"/>
<text x="70" y="58" class="xs qing">J04 / WALK · SOUTH-BANK BRANCHING EXPLORATION / CURRENT NATIVE CARRIER</text>
<text x="70" y="108" class="t1 ink">知道怎么回来以后，偏离主路才是一种自由</text>
<text x="70" y="146" class="txt muted">ROUTE-03 的 MAIN / EXPLORE / RETURN 不再画成“精确路线图”，而是作为步行时的三种关系：稳定前进、可选发现、随时退回。</text>
<text x="70" y="178" class="xs seal">TOPOLOGICAL RELATION / NOT SURVEY / NO DISTANCE-SLOPE-WIDTH CLAIM / FIELD OPEN / NO 13-STOP LINEAR ROUTE</text>
<line x1="70" y1="205" x2="1530" y2="205" class="thin"/>

<text x="70" y="244" class="xs qing">01 / FIRST READ — TOPOLOGY BEFORE MAP-LIKE DETAIL</text>
<g transform="translate(70 268)">
  <rect width="930" height="430" rx="22" class="paper"/>
  <rect x="28" y="28" width="874" height="70" rx="14" class="soft"/>
  <text x="48" y="56" class="xs seal">MAIN RELATION</text>
  <text x="48" y="82" class="t3 ink">主关系只负责“继续走得明白”，不负责把十三印串成线性任务。</text>
  <path d="M112 236C220 154 333 161 430 224C531 289 641 281 742 205C785 172 830 155 868 163" class="main"/>
  <path d="M308 183C338 137 377 117 421 111" class="branch"/>
  <path d="M493 254C517 204 553 178 600 166" class="branch"/>
  <path d="M675 251C717 280 765 292 815 280" class="branch"/>
  <path d="M867 164C885 211 881 260 851 307C806 375 713 394 600 385C468 375 334 386 225 352C139 326 93 278 112 236" class="return"/>
  <circle cx="112" cy="236" r="10" fill="#17332c"/>
  <circle cx="868" cy="163" r="10" fill="#a54539"/>
  <circle cx="421" cy="111" r="13" fill="#fbfaf5" stroke="#548b7e" stroke-width="2"/>
  <circle cx="600" cy="166" r="13" fill="#fbfaf5" stroke="#548b7e" stroke-width="2"/>
  <circle cx="815" cy="280" r="13" fill="#fbfaf5" stroke="#548b7e" stroke-width="2"/>
  <text x="415" y="116" class="xs ink">R</text>
  <text x="594" y="171" class="xs ink">R</text>
  <text x="809" y="285" class="xs ink">R</text>
  <text x="78" y="220" class="sm muted">ENTER</text>
  <text x="810" y="145" class="sm seal">RETURN DECISION</text>
  <rect x="286" y="118" width="206" height="28" rx="8" fill="#fbfaf5" opacity="0.94"/><text x="302" y="137" class="sm muted">R = 可遇见内容，不是必到站点</text>
  <g transform="translate(58 352)">
    <line x1="0" y1="0" x2="74" y2="0" class="main"/><text x="92" y="5" class="sm muted">MAIN｜稳定前进</text>
    <line x1="265" y1="0" x2="339" y2="0" class="branch"/><text x="357" y="5" class="sm muted">EXPLORE｜可选靠近</text>
    <line x1="567" y1="0" x2="641" y2="0" class="return"/><text x="659" y="5" class="sm muted">RETURN｜随时退回</text>
  </g>
  <text x="58" y="405" class="sm seal">图只表达关系；真实路线几何由当前空间/现场权威决定。</text>
</g>

<text x="1040" y="244" class="xs qing">02 / DECISION POINT — BODY + CHOICE</text>
<g transform="translate(1040 268)">
  <rect width="490" height="430" rx="22" class="paper"/>
  <text x="24" y="40" class="t2 ink">人在岔路口只需要三个答案</text>
  <path d="M55 330L212 183L430 330" class="thin"/>
  <path d="M212 183L212 350" class="main"/>
  <path d="M212 238L99 162" class="branch"/>
  <path d="M212 258L350 190" class="branch"/>
  <path d="M212 313C293 335 362 328 426 292" class="return"/>
  <circle cx="210" cy="112" r="18" class="body"/>
  <path d="M210 130v63m0-38l-26 28m26-28l24 27m-24 11l-18 48m18-48l20 48" class="body"/>
  <text x="24" y="88" class="xs seal">1 / CONTINUE</text><text x="136" y="88" class="sm ink">主路往哪边继续</text>
  <text x="24" y="116" class="xs seal">2 / EXPLORE</text><text x="136" y="116" class="sm ink">这条支路是否值得靠近</text>
  <text x="24" y="144" class="xs seal">3 / RETURN</text><text x="136" y="144" class="sm ink">体力/状态变化时怎么退回</text>
  <rect x="24" y="362" width="442" height="46" rx="10" class="soft"/>
  <text x="42" y="389" class="sm ink">PHONE：行走默认 LIGHT / OFF；停下后才允许主动深读。</text>
</g>

<text x="70" y="750" class="xs qing">03 / SAME WALK, DIFFERENT BODY STATE — CONTENT DENSITY CHANGES, ROUTE AUTHORITY DOES NOT</text>
<g transform="translate(70 775)">
  <rect width="455" height="145" rx="16" class="paper"/>
  <text x="22" y="32" class="xs seal">FRESH / 有余力</text>
  <text x="22" y="62" class="t3 ink">MAIN → EXPLORE → MAIN</text>
  <text x="22" y="92" class="sm muted">支路增加发现，不改变底层回程关系。</text>
  <text x="22" y="119" class="sm muted">十三印可错序、可跳过。</text>
</g>
<g transform="translate(555 775)">
  <rect width="455" height="145" rx="16" class="paper"/>
  <text x="22" y="32" class="xs seal">TIRED / 疲劳上升</text>
  <text x="22" y="62" class="t3 ink">MAIN → RECOVER → RETURN</text>
  <text x="22" y="92" class="sm muted">内容降级；休息、方向、人工服务提权。</text>
  <text x="22" y="119" class="sm seal">不惩罚提前结束。</text>
</g>
<g transform="translate(1040 775)">
  <rect width="490" height="145" rx="16" class="paper"/>
  <text x="22" y="32" class="xs seal">UNKNOWN / CLOSED</text>
  <text x="22" y="62" class="t3 ink">不继续猜支路</text>
  <text x="22" y="92" class="sm muted">回到已确认主关系 / 人工服务；探索标记失效。</text>
  <text x="22" y="119" class="sm seal">UNKNOWN NEVER OPEN.</text>
</g>

<text x="70" y="963" class="sm muted">Source boundary：当前官方导览仅支持南岸多分支/回环网络与宏观节点关系；本图不表达微观顺序、真实距离、坡度、净宽、安全、容量或无障碍合规。</text>
<text x="70" y="987" class="sm seal">ATTACK TEST：若第一眼仍像测绘路线图、13 点线性打卡、所有支路同时高亮、回程隐藏，或 UI 比走路本身更抢注意，则 FAIL。</text>
</svg>