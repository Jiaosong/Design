<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
.bg{fill:#f2efe7}.paper{fill:#fbfaf5;stroke:#c9c8bf;stroke-width:1.1}
.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}
.sky{fill:#eef1ed}.mount1{fill:#d9ded8}.mount2{fill:#c9d2cb}.river{fill:#7aa398}
.cable{stroke:#17332c;stroke-width:4;fill:none}.view{stroke:#548b7e;stroke-width:2;fill:none;stroke-dasharray:8 7}
.thin{stroke:#87928d;stroke-width:1.1;fill:none}.body{stroke:#17332c;stroke-width:2.1;fill:none;stroke-linecap:round}
.t1{font:700 42px 'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif}
.t2{font:700 22px 'Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif}
.t3{font:700 16px 'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.txt{font:400 14px 'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.sm{font:400 12px 'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.xs{font:700 10.5px 'Noto Sans CJK SC','Source Han Sans SC',sans-serif;letter-spacing:1.1px}
</style>

<rect class="bg" width="1600" height="1000"/>
<text x="70" y="58" class="xs qing">J03 / CABLE · MOVING VIEW RELATION / PUBLIC MAIN CANDIDATE</text>
<text x="70" y="110" class="t1 ink">索道先把人带过河谷，视点变化才是这段旅程真正发生的内容</text>
<text x="70" y="148" class="txt muted">Transport first：不把索道变成“空中打卡界面”。移动中只保留看两岸关系、确认方向和知道 Return 的最低信息。</text>
<text x="70" y="181" class="xs seal">DESIGN CANDIDATE / TOPOLOGICAL RELATION / NO LIVE OPERATION CLAIM / FIELD OPEN / PHONE LIGHT-OFF</text>
<line x1="70" y1="207" x2="1530" y2="207" class="thin"/>

<text x="70" y="246" class="xs qing">01 / FIRST READ — TRANSPORT + VIEWPOINT CHANGE</text>
<g transform="translate(70 270)">
  <rect width="1030" height="430" rx="22" class="paper"/>
  <rect x="24" y="24" width="982" height="300" rx="16" class="sky"/>
  <path d="M24 212C142 123 250 144 355 203C455 260 540 238 645 169C750 100 858 110 1006 190V324H24Z" class="mount1"/>
  <path d="M24 259C144 190 265 205 390 258C520 313 655 277 765 220C870 165 950 185 1006 216V324H24Z" class="mount2"/>
  <rect x="24" y="286" width="982" height="38" class="river"/>
  <path d="M115 88L894 164" class="cable"/>
  <circle cx="115" cy="88" r="8" fill="#17332c"/>
  <circle cx="894" cy="164" r="8" fill="#17332c"/>
  <g transform="translate(515 122)">
    <line x1="0" y1="-18" x2="0" y2="6" class="cable"/>
    <rect x="-42" y="6" width="84" height="58" rx="12" fill="#fbfaf5" stroke="#17332c" stroke-width="2"/>
    <rect x="-27" y="19" width="21" height="20" rx="3" fill="#dfe7e2"/>
    <rect x="6" y="19" width="21" height="20" rx="3" fill="#dfe7e2"/>
    <circle cx="0" cy="49" r="5" fill="#17332c"/>
  </g>
  <path d="M515 171L276 225" class="view"/>
  <path d="M515 171L745 206" class="view"/>
  <text x="41" y="55" class="xs seal">MOVE</text>
  <text x="41" y="82" class="t3 ink">先过河谷，再读变化</text>
  <text x="41" y="108" class="sm muted">索道是交通关系；视点转换是体验，不是任务。</text>
  <g transform="translate(42 354)">
    <text class="xs seal">LOOK</text><text y="28" class="t3 ink">看两岸远近如何换位</text>
    <text x="310" class="xs seal">COMPARE</text><text x="310" y="28" class="t3 ink">刚才在下面看到的关系，现在怎样变化</text>
    <text x="700" class="xs seal">ORIENT</text><text x="700" y="28" class="t3 ink">只确认“正在向哪一侧移动”</text>
  </g>
  <text x="42" y="414" class="sm seal">没有“下一印”提示、连续弹卡或 13 点进度；移动时不要求持续看屏幕。</text>
</g>

<text x="1140" y="246" class="xs qing">02 / ATTENTION BUDGET</text>
<g transform="translate(1140 270)">
  <rect width="390" height="430" rx="22" class="paper"/>
  <text x="24" y="42" class="t2 ink">移动中，内容主动变少</text>
  <text x="24" y="88" class="xs seal">ALWAYS</text>
  <text x="24" y="116" class="t3 ink">方向 / Return / 人工服务入口</text>
  <text x="24" y="142" class="sm muted">必要关系可以被快速确认。</text>
  <line x1="24" y1="168" x2="366" y2="168" class="thin"/>
  <text x="24" y="208" class="xs seal">LIGHT</text>
  <text x="24" y="236" class="t3 ink">一个观察问题</text>
  <text x="24" y="262" class="sm muted">例如：两岸哪一侧正在变近？</text>
  <line x1="24" y1="288" x2="366" y2="288" class="thin"/>
  <text x="24" y="328" class="xs seal">OFF</text>
  <text x="24" y="356" class="t3 ink">深读 / 故事 / 任务式互动</text>
  <text x="24" y="382" class="sm muted">留给停下以后；不和移动视野竞争。</text>
  <text x="24" y="414" class="sm seal">PHONE 默认 LIGHT / OFF。</text>
</g>

<text x="70" y="752" class="xs qing">03 / RELATION TO THE JOURNEY — NOT A STANDALONE ATTRACTION</text>
<g transform="translate(70 777)">
  <rect width="1460" height="130" rx="18" class="paper"/>
  <text x="30" y="34" class="xs muted">BOAT / 水面尺度</text>
  <text x="30" y="67" class="t3 ink">从水面看两岸如何展开</text>
  <text x="515" y="34" class="xs seal">CABLE / 视点转换</text>
  <text x="515" y="67" class="t3 ink">跨过河谷时，看远近关系重新排列</text>
  <text x="1010" y="34" class="xs muted">WALK / 身体靠近</text>
  <text x="1010" y="67" class="t3 ink">落地以后再进入支路与近距离观察</text>
  <path d="M325 92h150" stroke="#87928d" stroke-width="2"/>
  <path d="M810 92h160" stroke="#87928d" stroke-width="2"/>
  <text x="30" y="109" class="sm muted">三段是体验尺度变化，不声明实际时序、班次、站点或强制组合。</text>
</g>

<text x="70" y="956" class="sm muted">Reality boundary：本图不声明索道站点位置、线路长度、高差、速度、班次、开放状态、承载、疏散或安全批准；这些需当前官方/现场/专业 authority。</text>
<text x="70" y="982" class="sm seal">FAIL：第一眼像景点列表、空中任务 UI、精确工程线路图，或索道本身比清江河谷/视点变化更像“主角”。</text>
</svg>