<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>.serif{font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif}.sans{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}.paper{fill:#f4f1e9}.ink{fill:#17211f}.muted{fill:#6b7872}.qing{fill:#3c8990}.seal{fill:#b64936}.rule{stroke:#929d98;stroke-width:1.2}.xs{font-size:14px;font-weight:700;letter-spacing:2px}.sm{font-size:15px}.body{font-size:18px}.hero{font-size:58px;font-weight:700}</style></defs><rect width="1920" height="1080" class="paper"/><text x="70" y="74" class="sans xs qing">MEMORY / IP · PAPER ↔ DIGITAL</text><text x="70" y="138" class="serif hero ink">带走的不是十三枚章，</text><text x="70" y="204" class="serif hero ink">而是一次旅行留下的痕迹。</text><text x="70" y="246" class="sans body muted">《清江旅记》保存手写与材料痕迹；“我的石书”整理一次再认、一个场景、一句话和以后再看。</text><line x1="70" y1="286" x2="1850" y2="286" class="rule"/>
<g transform="translate(70 340)"><rect width="600" height="565" rx="8" fill="#e8e1d4"/><rect x="28" y="28" width="270" height="505" rx="4" fill="#fbf9f3" stroke="#c6c7be"/><text x="55" y="76" class="sans xs qing">QINGJIANG JOURNAL</text><text x="55" y="140" class="serif" font-size="40" font-weight="700" fill="#17211f">清江旅记</text><path d="M55 360c66-42 112 24 176-17 30-19 52-23 67-37" fill="none" stroke="#6e9e92" stroke-width="3"/><path d="M55 390c66-42 112 24 176-17 30-19 52-23 67-37" fill="none" stroke="#8eb2a9" stroke-width="2"/><rect x="55" y="470" width="29" height="29" fill="none" stroke="#b64936"/><text x="62" y="492" class="serif" font-size="18" fill="#b64936">清</text><text x="55" y="523" class="sans" font-size="11" fill="#6b7872">A5 · PAPER MEMORY</text><rect x="318" y="28" width="254" height="505" rx="4" fill="#fbf9f3" stroke="#c6c7be"/><text x="345" y="76" class="sans xs qing">RETURN / 回程</text><text x="345" y="126" class="serif" font-size="26" font-weight="700" fill="#17211f">这一趟，什么值得留下？</text><line x1="345" y1="154" x2="545" y2="154" class="rule"/><text x="345" y="205" class="sans sm muted">我重新认出了：</text><text x="345" y="246" class="serif" font-size="30" font-weight="700" fill="#17211f">江与两岸</text><text x="345" y="286" class="sans" font-size="11" fill="#3c8990">R06 · LOOK / COMPARE</text><rect x="345" y="330" width="200" height="120" fill="#e4ece8"/><path d="M365 412c38-26 70 12 112-15 26-17 45-18 66-40" fill="none" stroke="#4c8e7e" stroke-width="3"/><text x="345" y="492" class="sans" font-size="11" fill="#b64936">不显示 13/13 / 积分 / 完成率</text></g>
<g transform="translate(730 360)"><text class="sans xs qing">PHYSICAL SAVES</text><text y="55" class="serif" font-size="32" font-weight="700" fill="#17211f">手写 · 画 · 折痕 · 路线痕迹</text><text y="88" class="sans sm muted">这些材料证据不需要 App 才存在。</text><line y1="132" x2="320" y2="132" class="rule"/><text y="188" class="sans xs qing">DIGITAL SAVES</text><text y="242" class="serif" font-size="31" font-weight="700" fill="#17211f">scene · action · note · revisit</text><text y="276" class="sans sm muted">不要求 GPS 精确轨迹，也不自动记录“完成”。</text><line y1="320" x2="320" y2="320" class="rule"/><text y="376" class="sans xs qing">COMMON LANGUAGE</text><text y="430" class="serif" font-size="31" font-weight="700" fill="#17211f">场景 + 动作 + 一句话</text><text y="466" class="sans sm muted">RETURN → RECOGNITION → RECORD → TAKE AWAY</text><text y="540" class="sans" font-size="12" fill="#b64936">MEMORY = OUTCOME / NOT COLLECTION</text></g>
<g transform="translate(1320 320)"><rect width="500" height="650" rx="46" fill="#123128"/><rect x="18" y="18" width="464" height="614" rx="34" fill="#f4f1e9"/><text x="48" y="72" class="sans" font-size="10" fill="#3c8990">MY BOOK / 我的石书</text><text x="48" y="132" class="serif" font-size="42" font-weight="700" fill="#17211f">不是集齐，</text><text x="48" y="180" class="serif" font-size="42" font-weight="700" fill="#17211f">是留下。</text><text x="48" y="220" class="sans" font-size="13" fill="#6b7872">只保存你真正选择的一个场景、一次比较、</text><text x="48" y="240" class="sans" font-size="13" fill="#6b7872">一句话或“以后再看”。</text><rect x="48" y="285" width="404" height="190" fill="#ebe5d9"/><rect x="70" y="306" width="166" height="146" fill="#fbf9f3" stroke="#c6c7be"/><text x="86" y="342" class="serif" font-size="21" font-weight="700" fill="#17211f">清江旅记</text><path d="M86 395c36-22 62 13 98-10 19-12 33-13 45-24" fill="none" stroke="#6e9e92" stroke-width="2"/><rect x="252" y="306" width="178" height="146" fill="#fbf9f3" stroke="#c6c7be"/><text x="268" y="342" class="serif" font-size="16" font-weight="700" fill="#17211f">这一趟，什么值得留下？</text><text x="268" y="382" class="serif" font-size="18" font-weight="700" fill="#17211f">江与两岸</text><text x="48" y="530" class="sans" font-size="10" fill="#3c8990">THIS JOURNEY / 本次</text><text x="48" y="566" class="serif" font-size="22" font-weight="700" fill="#17211f">我重新认出了：江与两岸</text><text x="48" y="596" class="sans" font-size="11" fill="#6b7872">来自 R06 的停留与回程再认。</text></g><text x="70" y="1032" class="sans" font-size="12" fill="#6b7872">DESIGN SOURCE CURRENTIZATION · PAPER/APP FIELDS CORRESPOND, BUT REAL-TIME SYNC IS NOT CLAIMED.</text></svg>