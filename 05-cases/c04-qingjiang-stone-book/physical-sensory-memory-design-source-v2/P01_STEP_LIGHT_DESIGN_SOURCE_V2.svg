<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b7ddd2" stop-opacity=".90"/><stop offset=".38" stop-color="#83b7a8" stop-opacity=".42"/><stop offset="1" stop-color="#5f9184" stop-opacity="0"/></radialGradient>
 <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10231d"/><stop offset="1" stop-color="#1e3b31"/></linearGradient>
 <style>.serif{font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif}.sans{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}.paper{fill:#f4f1e9}.ink{fill:#17211f}.muted{fill:#69756f}.qing{fill:#3c8990}.seal{fill:#b64936}.thin{stroke:#89958f;stroke-width:1.2;fill:none}.xs{font-size:14px;font-weight:700;letter-spacing:2px}.sm{font-size:15px}.body{font-size:18px}.h2{font-size:30px;font-weight:700}.hero{font-size:66px;font-weight:700}</style>
</defs>
<rect width="1920" height="1080" class="paper"/><rect x="0" y="0" width="1120" height="1080" fill="url(#field)"/>
<path d="M-80 780 C180 620 345 835 540 684 C715 548 838 540 1180 325" stroke="#90a59c" stroke-width="3" fill="none" opacity=".65"/><path d="M-80 803 C180 643 345 858 540 707 C715 571 838 563 1180 348" stroke="#48685d" stroke-width="1.5" fill="none" opacity=".75"/>
<circle cx="568" cy="664" r="165" fill="url(#glow)"/><circle cx="568" cy="664" r="70" fill="url(#glow)" opacity=".85"/><ellipse cx="542" cy="681" rx="16" ry="31" fill="#edf6f2" transform="rotate(-24 542 681)" opacity=".88"/><ellipse cx="590" cy="648" rx="14" ry="29" fill="#edf6f2" transform="rotate(-24 590 648)" opacity=".88"/>
<text x="66" y="74" class="sans xs" fill="#bad2ca">P01 / SENSORY · LOCAL LIGHT RESPONSE</text><text x="66" y="858" class="serif hero" fill="#ffffff">走过才亮，</text><text x="66" y="933" class="serif hero" fill="#ffffff">离开就熄。</text><text x="70" y="978" class="sans body" fill="#d2e1dc">不是闯关，也不是下一盏灯的提示。</text><text x="70" y="1012" class="sans" font-size="12" fill="#9eb5ad">CONCEPTUAL BEHAVIOR FIELD · NOT SITE IMAGE · DAY / FAULT / MAINTENANCE → OFF</text>
<g transform="translate(1120 0)"><rect width="800" height="1080" class="paper"/><text x="62" y="72" class="sans xs qing">STEP-LIGHT / BEHAVIOR DESIGN</text><text x="62" y="128" class="serif h2 ink">《步步生光》｜让光只回应身体经过</text><text x="62" y="166" class="sans sm muted">反馈短、局部、可关闭；无灯也不影响通行。光不承担路线或安全信息。</text><line x1="62" y1="200" x2="738" y2="200" class="thin"/><text x="62" y="246" class="sans xs qing">01 / SILENCE → LOCAL RESPONSE → OFF</text>
<line x1="95" y1="420" x2="705" y2="420" class="thin"/><circle cx="130" cy="420" r="7" fill="#17211f"/><circle cx="400" cy="420" r="7" fill="#17211f"/><circle cx="670" cy="420" r="7" fill="#17211f"/>
<path d="M86 352c52-30 98-20 145-47" stroke="#17211f" stroke-width="2" fill="none"/><text x="80" y="302" class="sans xs seal">A / SILENCE</text><text x="80" y="458" class="serif" font-size="22" font-weight="700" fill="#17211f">默认不亮。</text><text x="80" y="486" class="sans sm muted">不抢景观。</text>
<circle cx="398" cy="344" r="78" fill="#8bbcaf" opacity=".18"/><circle cx="398" cy="344" r="36" fill="#8bbcaf" opacity=".28"/><ellipse cx="385" cy="352" rx="8" ry="17" fill="#17211f" transform="rotate(-24 385 352)"/><ellipse cx="414" cy="334" rx="7" ry="16" fill="#17211f" transform="rotate(-24 414 334)"/><text x="338" y="302" class="sans xs seal">B / LOCAL</text><text x="338" y="458" class="serif" font-size="22" font-weight="700" fill="#17211f">只亮附近。</text><text x="338" y="486" class="sans sm muted">建议样件 1.5–3 s 级消退。</text>
<path d="M620 352c52-30 98-20 145-47" stroke="#17211f" stroke-width="2" fill="none"/><circle cx="680" cy="338" r="38" fill="#8bbcaf" opacity=".08"/><text x="610" y="302" class="sans xs seal">C / FADE</text><text x="610" y="458" class="serif" font-size="22" font-weight="700" fill="#17211f">自动熄灭。</text><text x="610" y="486" class="sans sm muted">把注意力还给路。</text>
<line x1="62" y1="555" x2="738" y2="555" class="thin"/><text x="62" y="600" class="sans xs qing">02 / PROTOTYPE LOGIC</text><text x="62" y="650" class="serif" font-size="24" font-weight="700" fill="#17211f">身体经过</text><path d="M190 642h94" stroke="#8a9690" stroke-width="1.3"/><path d="M279 636l12 6-12 6" fill="#8a9690"/><text x="315" y="650" class="serif" font-size="24" font-weight="700" fill="#17211f">局部控制</text><path d="M460 642h88" stroke="#8a9690" stroke-width="1.3"/><path d="M543 636l12 6-12 6" fill="#8a9690"/><text x="580" y="650" class="serif" font-size="24" font-weight="700" fill="#17211f">短反馈</text><text x="62" y="699" class="sans sm muted">非接触感应优先候选 · 不连续追逐 · 不积分 · 不计数 · 不提示“下一盏”</text>
<line x1="62" y1="760" x2="738" y2="760" class="thin"/><text x="62" y="806" class="sans xs qing">03 / FAIL-SAFE</text><text x="62" y="860" class="serif" font-size="30" font-weight="700" fill="#17211f">白天 / 故障 / 维护 → OFF</text><text x="62" y="902" class="sans body muted">错误状态不能用“亮灯”替代路线、安全或开放信息。</text><text x="62" y="954" class="sans sm muted">FIELD OPEN：真实位置 / 铺装 / 防滑 / 排水 / 照度 / 眩光 / 电气 / 防水 / 夜间运营 / 生态影响</text><text x="62" y="1000" class="sans" font-size="12" fill="#b64936">HOLD / PROTOTYPE LOGIC · 任何样件不得制造绊倒或追逐风险。</text></g></svg>