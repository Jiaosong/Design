text><rect x="20" y="54" width="190" height="10" rx="4" fill="#7c8e86"/><text x="254" y="66" class="sans body ink">B 隔离 / 缓冲</text><path d="M45 102v72h32v-40h90v40h32v-72" class="line"/><text x="254" y="142" class="sans body ink">C 可拆夹持支架</text><rect x="78" y="198" width="90" height="18" rx="7" fill="#29433b"/><text x="254" y="214" class="sans body ink">D 既有基体</text></g><text x="62" y="1014" class="sans" font-size="12" fill="#67736e">NTS · FIELD OPEN：栏杆承载 / 边缘安全 / 通行净宽 / 湿滑 / 许可 / 运营维护</text><text x="62" y="1040" class="sans" font-size="12" fill="#b64936">无法证明既有基体安全时 → 不安装。</text></g></svg>