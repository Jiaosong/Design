<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CH10-P05｜R13 一线天｜先通过</title><style>
:root{--night:#071f20;--deep:#0b3031;--deep2:#123f40;--paper:#eee8dc;--jade:#75b0a7;--cin:#cb6d52;--line:rgba(238,232,220,.17);--ser:"Songti SC","Noto Serif CJK SC","STSong",serif;--sans:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--sans)}button{font:inherit}.stage{position:relative;width:100vw;height:100svh;overflow:hidden;background:#0a292a;isolation:isolate}.mast{position:absolute;z-index:60;left:4.2vw;right:4.2vw;top:27px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font:700 8px/1.3 var(--mono);letter-spacing:.15em;color:rgba(238,232,220,.53)}.mast strong{color:var(--paper)}.mast .right{font-family:var(--sans);font-weight:400;letter-spacing:.04em;color:rgba(238,232,220,.4)}
.space{position:absolute;inset:0 0 108px;overflow:hidden;background:linear-gradient(180deg,#123d3e,#0d3334 58%,#0a292a)}.far{position:absolute;inset:0;background:linear-gradient(180deg,#7fa6a1 0 35%,#95b8b2 35% 49%,#4a8785 49% 61%,#245f60 61% 100%);opacity:.08;transition:opacity .55s ease}.far:before{content:"";position:absolute;left:-10%;right:-10%;top:48%;height:13%;background:linear-gradient(180deg,rgba(230,238,231,.45),rgba(84,151,150,.55));transform:skewY(-1.8deg)}.far:after{content:"";position:absolute;left:16%;right:11%;top:34%;height:1px;background:rgba(238,232,220,.3);box-shadow:0 11vh 0 rgba(238,232,220,.1),0 20vh 0 rgba(238,232,220,.07)}
.wall{position:absolute;top:0;bottom:0;width:56%;background:linear-gradient(108deg,#061b1b,#092929 66%,#123738);transition:clip-path .62s cubic-bezier(.2,.76,.2,1),filter .5s ease}.wall.left{left:0;clip-path:polygon(0 0,100% 0,91% 100%,0 100%)}.wall.right{right:0;background:linear-gradient(252deg,#061b1b,#092929 66%,#123738);clip-path:polygon(9% 0,100% 0,100% 100%,0 100%)}.wall:before{content:"";position:absolute;inset:0;opacity:.14;background:repeating-linear-gradient(101deg,transparent 0 38px,rgba(238,232,220,.07) 39px 40px),repeating-linear-gradient(12deg,transparent 0 74px,rgba(117,176,167,.05) 75px 76px)}
.slit-line{position:absolute;z-index:9;left:50%;top:13%;bottom:13%;width:1px;background:linear-gradient(180deg,transparent,rgba(238,232,220,.55),rgba(117,176,167,.5),transparent);opacity:.5;transition:opacity .45s ease}.state-copy{position:absolute;z-index:25;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;width:min(52vw,920px);transition:transform .55s ease,opacity .4s ease}.rid{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--jade)}.state-copy h1{font-family:var(--ser);font-size:clamp(76px,8.2vw,150px);font-weight:400;line-height:.88;letter-spacing:-.06em;margin:21px 0 20px;text-shadow:0 4px 34px rgba(0,0,0,.22)}.state-copy p{margin:0 auto;max-width:590px;font-family:var(--ser);font-size:17px;line-height:1.7;color:rgba(238,232,220,.52)}.state-copy p b{font-weight:500;color:rgba(238,232,220,.88)}
.look-caption{position:absolute;z-index:22;right:5%;bottom:10%;width:min(31vw,480px);padding-top:12px;border-top:1px solid rgba(238,232,220,.25);opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}.look-caption small{font:700 7px var(--mono);letter-spacing:.15em;color:#f09d83}.look-caption b{display:block;margin-top:9px;font-family:var(--ser);font-size:20px;font-weight:500}.look-caption p{margin:6px 0 0;font-size:10px;line-height:1.6;color:rgba(238,232,220,.48)}.return-band{position:absolute;z-index:22;left:4.2vw;right:4.2vw;bottom:8%;display:flex;justify-content:space-between;align-items:end;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}.return-band span{font:700 7px var(--mono);letter-spacing:.15em;color:#f09d83}.return-band b{font-family:var(--ser);font-size:22px;font-weight:500}
.stage[data-state="PASS"] .far{opacity:.035}.stage[data-state="PASS"] .wall.left{clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}.stage[data-state="PASS"] .wall.right{clip-path:polygon(0 0,100% 0,100% 100%,8% 100%)}.stage[data-state="PASS"] .state-copy p{opacity:.14}.stage[data-state="PASS"] .slit-line{opacity:.78}
.stage[data-state="LOOK_BACK"] .far{opacity:.62}.stage[data-state="LOOK_BACK"] .wall.left{clip-path:polygon(0 0,83% 0,65% 100%,0 100%)}.stage[data-state="LOOK_BACK"] .wall.right{clip-path:polygon(17% 0,100% 0,100% 100%,35% 100%)}.stage[data-state="LOOK_BACK"] .slit-line{opacity:0}.stage[data-state="LOOK_BACK"] .state-copy{transform:translate(-50%,-58%)}.stage[data-state="LOOK_BACK"] .look-caption{opacity:1;transform:none}
.stage[data-state="RETURN"] .far{opacity:.13}.stage[data-state="RETURN"] .wall.left{clip-path:polygon(0 0,94% 0,82% 100%,0 100%)}.stage[data-state="RETURN"] .wall.right{clip-path:polygon(6% 0,100% 0,100% 100%,18% 100%)}.stage[data-state="RETURN"] .state-copy{opacity:.18;transform:translate(-50%,-55%)}.stage[data-state="RETURN"] .return-band{opacity:1;transform:none}
.controls{position:absolute;z-index:70;left:0;right:0;bottom:0;height:108px;display:grid;grid-template-columns:41vw 1fr;border-top:1px solid var(--line);background:rgba(5,22,23,.95);backdrop-filter:blur(10px)}.control-copy{display:flex;align-items:center;padding-left:4.2vw;font-family:var(--ser);font-size:15px;color:rgba(238,232,220,.55)}.control-copy b{font-weight:500;color:#fff}.buttons{display:grid;grid-template-columns:repeat(3,1fr)}.buttons button{position:relative;border:0;border-left:1px solid var(--line);background:transparent;text-align:left;color:rgba(238,232,220,.45);padding:17px 20px;cursor:pointer}.buttons button:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--cin);transform:scaleX(0);transform-origin:left;transition:transform .22s ease}.buttons button.active:before{transform:scaleX(1)}.buttons small{font:700 6px var(--mono);letter-spacing:.14em}.buttons b{display:block;margin-top:10px;font-family:var(--ser);font-size:16px;font-weight:500;color:rgba(238,232,220,.7)}.buttons em{display:block;margin-top:6px;font:700 5px var(--mono);letter-spacing:.1em;font-style:normal;color:rgba(238,232,220,.28)}.buttons button.active small{color:#f09d83}.buttons button.active b{color:#fff}.buttons button.active em{color:var(--jade)}.buttons button:focus-visible{outline:2px solid var(--cin);outline-offset:-4px}
@media(max-width:800px){.mast{left:18px;right:18px;top:17px}.mast .right{display:none}.space{bottom:132px}.state-copy{width:82vw;top:45%}.state-copy h1{font-size:72px;margin:14px 0 12px}.state-copy p{font-size:13px;line-height:1.55;max-width:300px}.rid{font-size:6px}.look-caption{right:18px;left:18px;bottom:8%;width:auto}.look-caption b{font-size:15px}.return-band{left:18px;right:18px;bottom:8%}.return-band b{font-size:16px}.controls{height:132px;grid-template-columns:1fr}.control-copy{display:none}.buttons button{padding:15px 11px}.buttons small{font-size:5px}.buttons b{font-size:13px}.buttons em{font-size:5px}.stage[data-state="LOOK_BACK"] .wall.left{clip-path:polygon(0 0,88% 0,64% 100%,0 100%)}.stage[data-state="LOOK_BACK"] .wall.right{clip-path:polygon(12% 0,100% 0,100% 100%,36% 100%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main class="stage" id="stage" data-state="PASS"><header class="mast"><span><strong>CH10 / P05</strong> · R13 SILENCE PROOF</span><span class="right">R13 一线天：身体与路线先于解释；页面允许沉默。</span></header><section class="space"><div class="far" aria-hidden="true"></div><div class="wall left" aria-hidden="true"></div><div class="wall right" aria-hidden="true"></div><i class="slit-line" aria-hidden="true"></i><div class="state-copy"><div class="rid" id="rid">R13 / 一线天 · PASS</div><h1 id="title">先通过。</h1><p id="body"><b>身体先行。</b> 解释不在缝隙里抢第一眼，也不要求停留。</p></div><aside class="look-caption"><small>AFTER PASSING / LOOK BACK</small><b>回头，再看一眼清江。</b><p>水面与对岸重新进入视野；这一步是可选的，不产生完成反馈。</p></aside><div class="return-band"><span>ROUTE / BODY / RETURN &gt; READING</span><b>该离开时，内容先退。</b></div></section><footer class="controls"><div class="control-copy" id="controlCopy"><span><b>PASS</b> · 默认态只有通过；阅读保持关闭。</span></div><div class="buttons" role="group" aria-label="R13 行为状态"><button class="active" data-state="PASS" aria-pressed="true"><small>01 / PASS</small><b>先通过</b><em>READING OFF</em></button><button data-state="LOOK_BACK" aria-pressed="false"><small>02 / LOOK BACK</small><b>通过后回看</b><em>OPTIONAL</em></button><button data-state="RETURN" aria-pressed="false"><small>03 / RETURN</small><b>回程优先</b><em>CONTENT WITHDRAWS</em></button></div></footer></main><script>
(()=>{window.__errs=[];window.addEventListener('error',e=>window.__errs.push(String(e.message||e.error||'error')));window.addEventListener('unhandledrejection',e=>window.__errs.push(String(e.reason||'unhandledrejection')));const st=document.getElementById('stage'),bs=[...document.querySelectorAll('.buttons button')],rid=document.getElementById('rid'),title=document.getElementById('title'),body=document.getElementById('body'),cc=document.getElementById('controlCopy');const D={PASS:{rid:'R13 / 一线天 · PASS',title:'先通过。',body:'<b>身体先行。</b> 解释不在缝隙里抢第一眼，也不要求停留。',copy:'<span><b>PASS</b> · 默认态只有通过；阅读保持关闭。</span>'},LOOK_BACK:{rid:'R13 / 一线天 · LOOK BACK',title:'回头。',body:'通过以后，<b>再决定要不要看一眼清江。</b>',copy:'<span><b>LOOK BACK</b> · 通过以后，清江视域才重新打开。</span>'},RETURN:{rid:'R13 / 一线天 · RETURN',title:'返回。',body:'<b>路线与身体重新拥有主权。</b> 可选阅读退出。',copy:'<span><b>RETURN</b> · 内容退场，回程与身体优先。</span>'}};function setState(s,focus=false){const d=D[s];st.dataset.state=s;rid.textContent=d.rid;title.textContent=d.title;body.innerHTML=d.body;cc.innerHTML=d.copy;bs.forEach(b=>{const on=b.dataset.state===s;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false');if(on&&focus)b.focus()})}bs.forEach((b,i)=>{b.addEventListener('click',()=>setState(b.dataset.state));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();setState(bs[(i+1)%bs.length].dataset.state,true)}else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();setState(bs[(i-1+bs.length)%bs.length].dataset.state,true)}else if(e.key==='Home'){e.preventDefault();setState(bs[0].dataset.state,true)}else if(e.key==='End'){e.preventDefault();setState(bs.at(-1).dataset.state,true)}})});window.setState=setState})();
</script></body></html>
