<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CH10-P01 v0.3.1｜先看清江，再读一页</title>
<style>
:root{--bone:#F1EDE4;--ink:#111918;--deep:#133B3C;--jade:#2E7571;--cin:#B8543E;--ser:"Songti SC","Noto Serif CJK SC",serif;--sans:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1514;color:var(--bone);font-family:var(--sans)}button{font:inherit}.stage{position:relative;width:100vw;height:100svh;overflow:hidden;isolation:isolate;background:#0d1514}
.scene{position:absolute;inset:0;z-index:1;transition:opacity .62s cubic-bezier(.2,.75,.2,1),transform 1.1s cubic-bezier(.2,.75,.2,1),filter .55s ease}.scene img{width:100%;height:100%;object-fit:cover;display:block}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,15,14,.08),rgba(8,15,14,.02) 50%,rgba(8,15,14,.66));pointer-events:none}.scene.relation{opacity:0;transform:scale(1.025)}
.stage[data-state="MOVE"] .scene.landscape,.stage[data-state="CHOOSE"] .scene.landscape{opacity:0}.stage[data-state="MOVE"] .scene.relation,.stage[data-state="CHOOSE"] .scene.relation{opacity:1;transform:scale(1)}
.stage[data-state="LOOK"] .scene.landscape,.stage[data-state="OBSERVE"] .scene.landscape,.stage[data-state="RECOVER"] .scene.landscape,.stage[data-state="PASS"] .scene.landscape{opacity:1}
.stage[data-state="RECOVER"] .scene.landscape{filter:brightness(.56) saturate(.58)}.stage[data-state="PASS"] .scene.landscape{filter:saturate(.82) brightness(.92)}
.mast{position:absolute;left:4.5vw;right:4.5vw;top:28px;z-index:20;display:flex;justify-content:space-between;font:700 9px/1 var(--mono);letter-spacing:.13em;color:rgba(241,237,228,.78)}.mast strong{color:#fff;font-weight:700}

.prompt{position:absolute;z-index:12;right:6vw;top:29vh;width:18vw;max-width:330px;opacity:0;transform:translateY(16px);transition:opacity .38s ease,transform .5s ease;color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.42)}.prompt .micro{font:700 8px/1 var(--mono);letter-spacing:.14em;color:rgba(241,237,228,.67)}.prompt p{margin:10px 0 0;font-family:var(--ser);font-size:clamp(16px,1.35vw,25px);line-height:1.4}.stage[data-state="OBSERVE"] .reading-fold,.stage[data-state="OBSERVE"] .prompt{opacity:1;transform:translate(0)}
.body-field{position:absolute;z-index:10;right:4vw;bottom:86px;width:min(43vw,790px);height:min(49vh,520px);opacity:0;transform:translateY(40px);transition:opacity .42s ease,transform .62s cubic-bezier(.18,.82,.2,1);pointer-events:none}.body-field:before{content:"";position:absolute;inset:28% 0 0 14%;background:radial-gradient(ellipse at 58% 70%,rgba(241,237,228,.16),transparent 61%)}.body-field img{position:absolute;right:0;bottom:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 38px rgba(0,0,0,.12))}.stage[data-state="RECOVER"] .body-field{opacity:.94;transform:translateY(0)}
.return-trace{position:absolute;z-index:18;left:4.5vw;right:4.5vw;bottom:84px;height:1px;background:rgba(241,237,228,.28)}.return-trace:after{content:"RETURN";position:absolute;right:0;top:-17px;font:700 8px var(--mono);letter-spacing:.14em;color:rgba(241,237,228,.56)}.stage[data-state="RECOVER"] .return-trace:after,.stage[data-state="CHOOSE"] .return-trace:after,.stage[data-state="PASS"] .return-trace:after{color:#fff}
.rail{position:absolute;left:0;right:0;bottom:0;height:66px;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:linear-gradient(180deg,rgba(8,15,14,.34),rgba(8,15,14,.62));backdrop-filter:blur(9px);border-top:1px solid rgba(241,237,228,.12)}.state{position:relative;border:0;border-left:1px solid rgba(241,237,228,.11);background:transparent;color:rgba(241,237,228,.58);text-align:left;padding:10px 13px 8px;cursor:pointer}.state small{display:flex;gap:5px;align-items:baseline;font:700 7px/1 var(--mono);letter-spacing:.08em}.state small .n{opacity:.76}.state small .en{opacity:.62}.state b{display:block;margin-top:6px;font-family:var(--ser);font-size:13px;font-weight:500;color:rgba(241,237,228,.76)}.state:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--jade);transform:scaleX(0);transform-origin:left;transition:transform .24s ease}.state.active:before{transform:scaleX(1)}.state.active b{color:#fff}.state:focus-visible{outline:2px solid var(--cin);outline-offset:-4px}
@media(max-width:800px){.mast{left:18px;right:18px;top:18px}.mast strong{display:none}.state-mark{left:18px;bottom:88px}.state-mark h1{font-size:30px}.reading-fold{width:66vw}.reading-fold:before{left:31%;top:19vh;bottom:19vh}.reading-fold:after{left:calc(31% + 1px);top:34vh;width:23vw}.prompt{right:18px;top:31vh;width:45vw}.prompt p{font-size:18px}.body-field{right:-5vw;bottom:74px;width:82vw;height:42vh}.return-trace{left:18px;right:18px;bottom:78px}.rail{height:68px;grid-template-columns:repeat(6,1fr)}.state{padding:10px 4px 7px;text-align:center}.state small{justify-content:center;font-size:7px;letter-spacing:0}.state small .en{display:none}.state b{font-size:12px;margin-top:7px;line-height:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main class="stage" id="stage" data-state="OBSERVE">
<div class="scene landscape"><img src="assets/LANDSCAPE_WHOLE.jpg" alt="清江整体景观"></div><div class="scene relation"><img src="assets/RELATION_CABLE.jpg" alt="清江索道移动视点与两岸关系"></div>
<div class="reading-fold" aria-hidden="true"></div><div class="prompt"><div class="micro">可选阅读</div><p>再看一层？</p></div><div class="body-field"><img src="assets/BODY_RECOVER_LINE.png" alt="恢复与人体尺度设计关系"></div>
<header class="mast"><span>CH10 / P01 · THIRTEEN IMPRINTS</span><strong>清江石书 / 十三印</strong></header><div class="state-mark"><div class="code" id="stateCode">03 / OBSERVE</div><h1 id="stateTitle">再读一页。</h1></div><div class="owner" aria-hidden="true"><span></span><strong id="ownerText"></strong></div><div class="return-trace"></div>
<nav class="rail" aria-label="体验状态"><button class="state" aria-pressed="false" data-state="MOVE"><small><span class="n">01</span><span class="en">MOVE</span></small><b>移动</b></button><button class="state" aria-pressed="false" data-state="LOOK"><small><span class="n">02</span><span class="en">LOOK</span></small><b>观看</b></button><button class="state active" aria-pressed="true" data-state="OBSERVE"><small><span class="n">03</span><span class="en">OBSERVE</span></small><b>观察</b></button><button class="state" aria-pressed="false" data-state="RECOVER"><small><span class="n">04</span><span class="en">RECOVER</span></small><b>恢复</b></button><button class="state" aria-pressed="false" data-state="CHOOSE"><small><span class="n">05</span><span class="en">CHOOSE</span></small><b>决策</b></button><button class="state" aria-pressed="false" data-state="PASS"><small><span class="n">06</span><span class="en">PASS</span></small><b>通过</b></button></nav>
</main><script>
const stage=document.getElementById('stage'),btns=[...document.querySelectorAll('.state')],code=document.getElementById('stateCode'),title=document.getElementById('stateTitle'),owner=document.getElementById('ownerText');const m={MOVE:['01 / MOVE','跨江。',''],LOOK:['02 / LOOK','先看清江。',''],OBSERVE:['03 / OBSERVE','再读一页。',''],RECOVER:['04 / RECOVER','先恢复。',''],CHOOSE:['05 / CHOOSE','先决定。',''],PASS:['06 / PASS','先通过。','']};
function setState(s,focus=false){stage.dataset.state=s;btns.forEach(b=>{const on=b.dataset.state===s;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});code.textContent=m[s][0];title.textContent=m[s][1];owner.textContent=m[s][2];if(focus)btns.find(b=>b.dataset.state===s)?.focus()}
btns.forEach((b,i)=>{b.addEventListener('click',()=>setState(b.dataset.state));b.addEventListener('mouseenter',()=>setState(b.dataset.state));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();setState(btns[(i+1)%btns.length].dataset.state,true)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();setState(btns[(i-1+btns.length)%btns.length].dataset.state,true)}})});
</script></body></html>
