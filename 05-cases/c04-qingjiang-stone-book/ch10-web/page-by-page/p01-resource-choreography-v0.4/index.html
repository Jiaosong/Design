er><section class="state-mark"><div class="code" id="stateCode">03 / OBSERVE</div><h1 id="stateTitle">再读一页。</h1><p id="stateSub">先看清江，再决定这一页是否值得出现。</p></section><div class="trace"></div><nav class="rail" aria-label="体验状态"><button class="state" data-state="MOVE" aria-pressed="false"><small><span>01</span><span class="en">MOVE</span></small><b>移动</b></button><button class="state" data-state="LOOK" aria-pressed="false"><small><span>02</span><span class="en">LOOK</span></small><b>观看</b></button><button class="state active" data-state="OBSERVE" aria-pressed="true"><small><span>03</span><span class="en">OBSERVE</span></small><b>观察</b></button><button class="state" data-state="RECOVER" aria-pressed="false"><small><span>04</span><span class="en">RECOVER</span></small><b>恢复</b></button><button class="state" data-state="CHOOSE" aria-pressed="false"><small><span>05</span><span class="en">CHOOSE</span></small><b>决策</b></button><button class="state" data-state="PASS" aria-pressed="false"><small><span>06</span><span class="en">PASS</span></small><b>通过</b></button></nav></main><script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push(String(e.message||e.error||'error')));window.addEventListener('unhandledrejection',e=>window.__errs.push(String(e.reason||'unhandledrejection')));const stage=document.getElementById('stage'),btns=[...document.querySelectorAll('.state')],code=document.getElementById('stateCode'),title=document.getElementById('stateTitle'),sub=document.getElementById('stateSub');const M={MOVE:['01 / MOVE','跨江。','关系先于解释；在移动里只保留方向、两岸与继续前进。'],LOOK:['02 / LOOK','先看清江。','景观拥有第一阅读权，内容保持安静。'],OBSERVE:['03 / OBSERVE','再读一页。','先看清江，再决定这一页是否值得出现。'],RECOVER:['04 / RECOVER','先恢复。','身体、服务与回程优先；文化内容主动减载。'],CHOOSE:['05 / CHOOSE','先决定。','路线与回程拥有当前决策权，十三印不制造第二套路。'],PASS:['06 / PASS','先通过。','阅读退出；身体、路线与回程继续成立。']};function setState(s,focus=false){stage.dataset.state=s;const d=M[s];code.textContent=d[0];title.textContent=d[1];sub.textContent=d[2];btns.forEach(b=>{const
