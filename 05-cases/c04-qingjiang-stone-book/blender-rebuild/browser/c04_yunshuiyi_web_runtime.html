<div id="lead">C04 runtime carrier — model not requested before entering module</div>
<section id="stage" aria-label="云水倚 3D Web runtime">
  <div id="status">idle</div>
  <button id="retry" type="button">Retry model</button>
  <button id="hotspot" type="button" disabled>Toggle contact zone</button>
  <div id="fallback">3D runtime unavailable. Product state remains identifiable without motion.</div>
</section>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

const stage=document.querySelector('#stage');
const statusEl=document.querySelector('#status');

const retry=document.querySelector('#retry');
const fallback=document.querySelector('#fallback');
const params=new URLSearchParams(location.search);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lod=innerWidth>=1600?'LOD0':(innerWidth>=600?'LOD1':'LOD2');
const actualAsset=`/artifacts/c04-yunshuiyi/C04_YUNSHUIYI_REBUILD_v003_${lod}.glb`;
const startedAt=performance.now();
window.__C04_STATE={status:'idle',lod,reducedMotion:reduced,requested:false,requestCount:0,firstVisibleMs:null,dragCount:0,contactVisible:true,rotation:[0,0],asset:actualAsset,error:null};

function setStatus(v){window.__C04_STATE.status=v;statusEl.textContent=`${v} · ${lod}`;}
function initRenderer(){
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
  }catch(err){
    window.__C04_STATE.error=String(err);setStatus('fallback');fallback.style.display='grid';return false;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(stage.clientWidth,stage.clientHeight,false);
  renderer.setClearColor(0x181818,1);
  stage.prepend(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(40,stage.clientWidth/stage.clientHeight,0.01,100);
  scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2.2));
  const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(3,-4,5);scene.add(key);
  renderer.domElement.addEventListener('pointerdown',e=>{drag=true;interacted=true;last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)});
  renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!root)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];root.rotation.y+=dx*0.008;root.rotation.x+=dy*0.004;last=[e.clientX,e.clientY];window.__C04_STATE.dragCount++;window.__C04_STATE.rotation=[root.rotation.x,root.rotation.y]});
  renderer.domElement.addEventListener('pointerup',()=>{drag=false});
  addEventListener('resize',()=>{if(!renderer)return;camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight,false)});
  return true;
}
function fitCamera(obj){
  const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());
  const max=Math.max(size.x,size.y,size.z);camera.position.set(center.x+max*1.55,center.y-max*1.75,center.z+max*0.95);camera.lookAt(center);camera.near=Math.max(max/1000,0.001);camera.far=max*20;camera.updateProjectionMatrix();
}
function loadAsset(url){
  window.__C04_STATE.requested=true;window.__C04_STATE.requestCount++;setStatus('loading');retry.style.display='none';
  new GLTFLoader().load(url,g=>{
    root=g.scene;scene.add(root);fitCamera(root);contact=root.getObjectByName('C04_YUNSHUIYI_CONTACT_ZONE__'+lod)||root.getObjectByName('C04_YUNSHUIYI_CONTACT_ZONE');
    hotspot.disabled=!contact;window.__C04_STATE.contactVisible=contact?contact.visible:null;
    window.__C04_STATE.firstVisibleMs=performance.now()-startedAt;setStatus('ready');

    window.__C04_STATE.error=String(err);setStatus('error');retry.style.display='block';

}
hotspot.addEventListener('click',()=>{if(!contact)return;contact.visible=!contact.visible;window.__C04_STATE.contactVisible=contact.visible;});
retry.addEventListener('click',()=>{window.__C04_STATE.error=null;loadAsset(actualAsset);});
function animate(){requestAnimationFrame(animate);if(root&&!reduced&&!interacted)root.rotation.z=Math.sin(performance.now()/5000)*0.025;if(renderer)renderer.render(scene,camera)}
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&!window.__C04_STATE.requested){observer.disconnect();if(initRenderer()){const first=params.has('forceMissing')?'/artifacts/c04-yunshuiyi/__missing__.glb':actualAsset;loadAsset(first);animate();}}},{threshold:0.15});
observer.observe(stage);
</script>
