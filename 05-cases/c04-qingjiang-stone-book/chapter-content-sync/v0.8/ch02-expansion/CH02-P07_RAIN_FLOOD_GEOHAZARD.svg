<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <rect width="100%" height="100%" fill="#F3F0E8"/>
    <rect x="0" y="0" width="1920" height="1080" fill="#F3F0E8" stroke="none" stroke-width="1" rx="0" opacity="1"/><rect x="0" y="0" width="1920" height="18" fill="#10231F" stroke="none" stroke-width="1" rx="0" opacity="1"/><text x="72" y="70" fill="#68746F" font-family="Noto Sans CJK SC" font-size="18" font-weight="600" text-anchor="start" letter-spacing="1.6" opacity="1">PRJ-C04 / CH02 / 场地与山水分析</text><text x="1848" y="70" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="end" letter-spacing="1.6" opacity="1">CH02-P07</text><text x="72" y="126" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2.2" opacity="1">ENVIRONMENT / RAIN–FLOOD–GEOHAZARD</text><text x="72" y="194" fill="#172822" font-family="Noto Sans CJK SC" font-size="52" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">雨、水、坡体和通行状态必须被看成同一条因果链。</text><text x="72" y="240" fill="#68746F" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">区域先例不等于场地判定，但足以要求设计具备降级、关闭与回程语法。</text><line x1="72" y1="270" x2="1848" y2="270" stroke="#C9CEC8" stroke-width="1.2" opacity="1"/><text x="72" y="1040" fill="#68746F" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1.2" opacity="1">SOURCE-GROUNDED / FIELD OPEN</text><text x="1848" y="1040" fill="#68746F" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="end" letter-spacing="0.8" opacity="1">NO IMAGE GENERATION · NTS · FIELD OBSERVED=0 · FIELD MEASURED=0</text><rect x="92" y="385" width="300" height="184" fill="#FAF9F5" stroke="#C9CEC8" stroke-width="1.1" rx="6" opacity="1"/><text x="116" y="419" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">01</text><text x="116" y="461" fill="#172822" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">强降雨</text><text x="116" y="493" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">REGIONAL TRIGGER</text><text x="116" y="529" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">气象预警 / 5–8月雨季集中</text><line x1="406" y1="477" x2="436" y2="477" stroke="#1C7777" stroke-width="2.2" opacity="1"/><path d="M 436 477 l -9 -6 l 0 12 z" fill="#1C7777"/><rect x="450" y="385" width="300" height="184" fill="#FAF9F5" stroke="#C9CEC8" stroke-width="1.1" rx="6" opacity="1"/><text x="474" y="419" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">02</text><text x="474" y="461" fill="#172822" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">水位与浑浊变化</text><text x="474" y="493" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">HYDROLOGY</text><text x="474" y="529" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">清江水情处于动态监测体系</text><line x1="764" y1="477" x2="794" y2="477" stroke="#1C7777" stroke-width="2.2" opacity="1"/><path d="M 794 477 l -9 -6 l 0 12 z" fill="#1C7777"/><rect x="808" y="385" width="300" height="184" fill="#FAF9F5" stroke="#C9CEC8" stroke-width="1.1" rx="6" opacity="1"/><text x="832" y="419" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">03</text><text x="832" y="461" fill="#172822" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">坡体风险上升</text><text x="832" y="493" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">GEOHAZARD</text><text x="832" y="529" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">崩塌 / 滑坡 / 泥石流预警语义</text><line x1="1122" y1="477" x2="1152" y2="477" stroke="#1C7777" stroke-width="2.2" opacity="1"/><path d="M 1152 477 l -9 -6 l 0 12 z" fill="#1C7777"/><rect x="1166" y="385" width="300" height="184" fill="#FAF9F5" stroke="#C9CEC8" stroke-width="1.1" rx="6" opacity="1"/><text x="1190" y="419" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">04</text><text x="1190" y="461" fill="#172822" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">通行条件变化</text><text x="1190" y="493" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">OPERATIONS</text><text x="1190" y="529" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NORMAL → DEGRADED / CLOSED / UNKNOWN</text><line x1="1480" y1="477" x2="1510" y2="477" stroke="#1C7777" stroke-width="2.2" opacity="1"/><path d="M 1510 477 l -9 -6 l 0 12 z" fill="#1C7777"/><rect x="1524" y="385" width="300" height="184" fill="#FAF9F5" stroke="#C9CEC8" stroke-width="1.1" rx="6" opacity="1"/><text x="1548" y="419" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">05</text><text x="1548" y="461" fill="#172822" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">退出与人工确认</text><text x="1548" y="493" fill="#1C7777" font-family="Noto Sans CJK SC" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1">RETURN</text><text x="1548" y="529" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DETECT → INFORM → REDIRECT → RETURN</text><rect x="92" y="628" width="1756" height="210" fill="#10231F" stroke="none" stroke-width="0" rx="8" opacity="1"/><text x="126" y="674" fill="#9FC4BD" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">REGIONAL PRECEDENT / 2020</text><text x="126" y="730" fill="#FAF9F5" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">≈ 1.44 million m³</text><text x="126" y="764" fill="#DDE5E0" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">恩施屯堡乡沙子坝滑坡体进入清江形成堰塞影响；连续强降雨为重要诱因。</text><text x="1110" y="674" fill="#D7B982" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">PROJECT RESPONSE</text><text x="1110" y="722" fill="#FAF9F5" font-family="Noto Sans CJK SC" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">R13：身体 / 通过 / Return &gt; 内容</text><text x="1110" y="756" fill="#DDE5E0" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">高强度降雨时，解释、游戏与停留必须能够退出。</text><text x="1110" y="790" fill="#F0B6A8" font-family="Noto Sans CJK SC" font-size="15" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">UNKNOWN 不能被画成正常开放。</text><text x="92" y="888" fill="#68746F" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">SOURCE / 湖北省自然资源厅地灾气象风险预警；中国地质调查局 2020 清江滑坡事件；恩施水文公开系统。</text><text x="92" y="916" fill="#B24F3C" font-family="Noto Sans CJK SC" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">BOUNDARY / 区域事件只证明“需要风险语法”，不证明红花峰林任何节点当前危险等级、稳定性或封闭范围。</text>
    </svg>