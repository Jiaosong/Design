<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>.bg{fill:#f4f0e5}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.gold{fill:#a18755}.paper{fill:#fbf9f3;stroke:#c8c7bd;stroke-width:1.2}.line{stroke:#17332c;stroke-width:3;fill:none}.thin{stroke:#788780;stroke-width:1.3;fill:none}.glow{fill:#9cc8bc;opacity:.35}.t1{font:700 44px 'Noto Serif SC','Songti SC',serif}.t2{font:700 24px 'Noto Serif SC','Songti SC',serif}.t3{font:700 17px 'Noto Sans SC','Microsoft YaHei',sans-serif}.txt{font:400 15px 'Noto Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 11px 'Noto Sans SC',sans-serif;letter-spacing:1.3px}</style>
<rect class="bg" width="1600" height="1000"/>
<text x="70" y="76" class="xs qing">P01 / STEP-LIGHT · BEHAVIOR + FAILURE-SAFE PROTOTYPE V1.2</text><text x="70" y="135" class="t1 ink">《步步生光》｜让光只回应身体经过</text><text x="70" y="177" class="txt muted">不是“踩灯闯关”。反馈短、局部、可关闭；故障默认 OFF。优先避免在主要踏面形成凸起或让人追逐的目标。</text><text x="70" y="208" class="xs seal">HOLD / PROTOTYPE LOGIC / FIELD-EVIDENCE RE-ENTRY</text><line x1="70" y1="235" x2="1530" y2="235" class="thin"/>
<text x="70" y="280" class="xs qing">01 / RESPONSE SEQUENCE</text>
<g transform="translate(70 310)"><rect width="455" height="305" rx="18" class="paper"/><text x="28" y="42" class="xs seal">A / SILENCE</text><path d="M55 196c95-56 172-31 254-73 51-26 83-23 102-32" class="line"/><circle cx="194" cy="144" r="8" class="ink"/><circle cx="211" cy="138" r="6" class="ink"/><text x="28" y="257" class="t3 ink">默认不亮，不抢景观。</text><text x="28" y="282" class="sm muted">白天可完全 OFF；无灯也不影响通行。</text></g>
<g transform="translate(572 310)"><rect width="455" height="305" rx="18" class="paper"/><text x="28" y="42" class="xs seal">B / LOCAL RESPONSE</text><path d="M55 196c95-56 172-31 254-73 51-26 83-23 102-32" class="line"/><circle cx="205" cy="142" r="54" class="glow"/><circle cx="205" cy="142" r="29" class="glow"/><circle cx="194" cy="144" r="8" class="ink"/><circle cx="211" cy="138" r="6" class="ink"/><text x="28" y="257" class="t3 ink">经过后只响应附近一小段。</text><text x="28" y="282" class="sm muted">建议样件测试 1.5–3 s 级消退；不连续追逐。</text></g>
<g transform="translate(1074 310)"><rect width="456" height="305" rx="18" class="paper"/><text x="28" y="42" class="xs seal">C / FADE TO OFF</text><path d="M55 196c95-56 172-31 254-73 51-26 83-23 102-32" class="line"/><circle cx="288" cy="108" r="32" class="glow" opacity=".18"/><circle cx="301" cy="107" r="8" class="ink"/><circle cx="318" cy="102" r="6" class="ink"/><text x="28" y="257" class="t3 ink">自动消退，把注意力还给路。</text><text x="28" y="282" class="sm muted">不积分、不计数、不提示“下一盏”。</text></g>
<text x="70" y="675" class="xs qing">02 / PROTOTYPE ARCHITECTURE</text>
<rect x="70" y="700" width="1460" height="210" rx="18" class="paper"/>
<g transform="translate(110 742)"><circle cx="48" cy="45" r="29" fill="#dce9e3"/><text x="28" y="51" class="t3 ink">感应</text><text x="0" y="98" class="sm muted">非接触优先候选</text></g><path d="M230 787h145" class="thin"/><path d="M365 780l14 7-14 7" fill="#788780"/>
<g transform="translate(410 742)"><rect width="175" height="80" rx="15" fill="#e8eee9"/><text x="42" y="47" class="t3 ink">局部控制</text><text x="18" y="101" class="sm muted">只激活邻近反馈区</text></g><path d="M610 787h145" class="thin"/><path d="M745 780l14 7-14 7" fill="#788780"/>
<g transform="translate(790 742)"><rect width="175" height="80" rx="15" fill="#dce9e3"/><text x="45" y="47" class="t3 ink">低强度光</text><text x="10" y="101" class="sm muted">不承担路径指示职责</text></g><path d="M990 787h145" class="thin"/><path d="M1125 780l14 7-14 7" fill="#788780"/>
<g transform="translate(1170 742)"><rect width="285" height="80" rx="15" fill="#efe7dc"/><text x="44" y="47" class="t3 ink">故障 / 白天 / 维护 → OFF</text><text x="18" y="101" class="sm muted">错误状态不以“亮灯”替代安全信息</text></g>
<text x="70" y="952" class="sm muted">FIELD OPEN：是否需要、真实位置、铺装、防滑、排水、照度、眩光、电气、防水、检修、夜间运营、生态影响。任何原型不得制造绊倒/追逐风险。</text>
</svg>