<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>.bg{fill:#f4f0e5}.paper{fill:#fbf9f3;stroke:#c8c7bd;stroke-width:1.2}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.wood{fill:#a98655}.steel{fill:#29433b}.pad{fill:#7c8e86}.line{stroke:#17332c;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7f8c85;stroke-width:1.2;fill:none}.dim{stroke:#a54539;stroke-width:1.2;fill:none}.t1{font:700 42px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif}.t2{font:700 24px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC',serif}.t3{font:700 16px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.txt{font:400 14px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 10.5px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif;letter-spacing:1.2px}</style><rect class="bg" width="1600" height="1000"/><text x="70" y="65" class="xs qing">P02 / REVERSIBLE RAILING LEAN-REST · V1.2 CURRENT RELATION REPAIR</text><text x="70" y="120" class="t1 ink">栏杆只是待验证基体，身体接触板不能被画成“有腿的长椅”</text><text x="70" y="158" class="txt muted">修复第一阅读矛盾：既有栏杆 → 可逆夹持 → 倚靠接触面 → 双脚落地短停。</text><text x="70" y="192" class="xs seal">CONCEPT / NTS / DESIGN ESTIMATE / FIELD OPEN · NOT FOR CONSTRUCTION</text><line x1="70" y1="218" x2="1530" y2="218" class="thin"/><text x="70" y="258" class="xs qing">01 / BODY + EXISTING RAIL RELATION</text><g transform="translate(70 285)"><rect width="900" height="425" rx="18" class="paper"/><line x1="80" y1="330" x2="820" y2="330" class="thin"/><rect x="145" y="145" width="18" height="185" class="steel"/><rect x="650" y="145" width="18" height="185" class="steel"/><rect x="145" y="150" width="523" height="18" rx="4" class="steel"/><rect x="145" y="230" width="523" height="14" rx="4" class="steel"/><text x="86" y="372" class="sm muted">既有栏杆 / Existing rail · 尺寸与承载未验证</text><rect x="250" y="205" width="330" height="52" rx="10" class="wood"/><rect x="265" y="252" width="300" height="11" rx="5" class="pad"/><path d="M285 262v35h35v-35M510 262v35h35v-35" class="line"/><circle cx="302" cy="280" r="9" class="seal"/><circle cx="528" cy="280" r="9" class="seal"/><text x="250" y="192" class="sm seal">身体接触面 / lean-rest surface</text><text x="580" y="285" class="sm ink">可逆夹持只连接到栏杆构件</text><circle cx="720" cy="125" r="24" class="line"/><path d="M705 149l-28 80 18 83M678 200l-55 32M694 311l-18 19M695 311l35 19" class="line"/><path d="M676 225l-76 18" class="line"/><text x="682" y="365" class="sm muted">站立 / 半倚 / 短恢复</text><text x="682" y="388" class="sm muted">双脚持续落地，不形成“坐凳”姿态</text><text x="35" y="42" class="t3 ink">走 → 累 → 靠 / 半倚 → 看 → 再走</text><text x="35" y="68" class="sm muted">主要判断是身体—栏杆—视线关系；不是把栏杆改造成长时座椅。</text><line x1="250" y1="300" x2="580" y2="300" class="dim"/><line x1="250" y1="293" x2="250" y2="307" class="dim"/><line x1="580" y1="293" x2="580" y2="307" class="dim"/><text x="315" y="322" class="sm seal">L 1200 rec. [800–1400] · C23 concept envelope</text></g><text x="1010" y="258" class="xs qing">02 / SIDE RELATION — WHAT TOUCHES WHAT</text><g transform="translate(1010 285)"><rect width="520" height="425" rx="18" class="paper"/><text x="28" y="42" class="t2 ink">夹持关系先于造型</text><text x="28" y="70" class="sm muted">只有既有栏杆基体被工程复核后，才允许讨论安装。</text><rect x="90" y="115" width="38" height="220" rx="6" class="steel"/><rect x="128" y="165" width="170" height="46" rx="9" class="wood"/><rect x="130" y="211" width="165" height="10" rx="5" class="pad"/><path d="M145 221v54h42v-30h95v30h42v-54" class="line"/><circle cx="166" cy="252" r="9" class="seal"/><circle cx="302" cy="252" r="9" class="seal"/><text x="335" y="140" class="sm ink">A 既有栏杆</text><text x="335" y="175" class="sm ink">B 身体接触面</text><text x="335" y="210" class="sm ink">C 隔离 / 缓冲</text><text x="335" y="245" class="sm ink">D 可逆夹持</text><text x="335" y="280" class="sm ink">E 可检修紧固件</text><text x="28" y="350" class="sm seal">FAIL IF：</text><text x="28" y="374" class="sm muted">图面再次读成落地长椅 / 承重关系被暗示为已验证 / 侵占通行净宽。</text></g><text x="70" y="755" class="xs qing">03 / DESIGN QUALITY GATE</text><g transform="translate(70 780)"><rect width="340" height="130" rx="14" class="paper"/><text x="20" y="28" class="xs seal">BODY READ</text><text x="20" y="57" class="t3 ink">双脚落地，短时半倚</text><text x="20" y="84" class="sm muted">若第一眼像“坐凳”，关系表达失败。</text></g><g transform="translate(430 780)"><rect width="340" height="130" rx="14" class="paper"/><text x="20" y="28" class="xs seal">ATTACHMENT READ</text><text x="20" y="57" class="t3 ink">板件只通过夹持连接栏杆</text><text x="20" y="84" class="sm muted">不画落地支腿，避免伪造独立基础。</text></g><g transform="translate(790 780)"><rect width="340" height="130" rx="14" class="paper"/><text x="20" y="28" class="xs seal">PASSAGE READ</text><text x="20" y="57" class="t3 ink">通行优先于设施</text><text x="20" y="84" class="sm muted">净宽、突出物风险与无障碍仍需现场复核。</text></g><g transform="translate(1150 780)"><rect width="380" height="130" rx="14" class="paper"/><text x="20" y="28" class="xs seal">FIELD OPEN</text><text x="20" y="57" class="t3 ink">荷载 / 许可 / 防护 / 湿滑</text><text x="20" y="84" class="sm muted">任何一项未验证，都不得转成施工或安全结论。</text></g><text x="70" y="960" class="sm muted">Current delta：删除易被读成落地支腿的构件；用既有栏杆上下横杆 + 可逆夹持 + 双脚落地半倚关系替代。C23 尺寸仍仅为 concept envelope。</text></svg>