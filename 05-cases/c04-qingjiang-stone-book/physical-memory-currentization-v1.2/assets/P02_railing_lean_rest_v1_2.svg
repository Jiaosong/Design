<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>.bg{fill:#f4f0e5}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.line{stroke:#17332c;stroke-width:2;fill:none}.thin{stroke:#7f8c85;stroke-width:1.2;fill:none}.dim{stroke:#a54539;stroke-width:1.3;fill:none}.wood{fill:#a98655}.steel{fill:#29433b}.pad{fill:#7c8e86}.paper{fill:#fbf9f3;stroke:#c8c7bd;stroke-width:1.2}.t1{font:700 44px 'Noto Serif SC','Songti SC',serif}.t2{font:700 25px 'Noto Serif SC','Songti SC',serif}.t3{font:700 17px 'Noto Sans SC','Microsoft YaHei',sans-serif}.txt{font:400 15px 'Noto Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 11px 'Noto Sans SC',sans-serif;letter-spacing:1.3px}</style><rect class="bg" width="1600" height="1000"/><text x="70" y="76" class="xs qing">P02 / REVERSIBLE LEAN-REST SERVICE COMPONENT · V1.2</text><text x="70" y="135" class="t1 ink">栏杆式可拆卸倚靠休息板</text><text x="70" y="177" class="txt muted">从“一个板”深化为：身体接触面 + 可逆夹持 + 隔离缓冲 + 排水清洁 + 独立替换。不是座椅，也不假设既有栏杆可承受附加荷载。</text><text x="70" y="208" class="xs seal">CONCEPT / NTS / FIELD OPEN · NOT FOR CONSTRUCTION</text><line x1="70" y1="235" x2="1530" y2="235" class="thin"/><text x="70" y="280" class="xs qing">01 / BODY ENVELOPE + USE</text><rect x="70" y="305" width="720" height="470" rx="18" class="paper"/><line x1="135" y1="700" x2="725" y2="700" class="thin"/><rect x="195" y="498" width="445" height="62" rx="10" class="wood"/><rect x="223" y="560" width="20" height="140" class="steel"/><rect x="592" y="560" width="20" height="140" class="steel"/><rect x="215" y="545" width="405" height="13" rx="6" class="pad" opacity=".7"/><circle cx="660" cy="409" r="31" class="line"/><path d="M650 440l-18 105 58 57M635 505l-55 73M684 599l42 91M648 547l-26 143" class="line"/><path d="M640 474l-63 62" class="line"/><line x1="195" y1="465" x2="640" y2="465" class="dim"/><line x1="195" y1="456" x2="195" y2="474" class="dim"/><line x1="640" y1="456" x2="640" y2="474" class="dim"/><text x="345" y="451" class="sm seal">L 1200 rec. [800–1400] · C23 concept range</text><line x1="166" y1="498" x2="166" y2="700" class="dim"/><line x1="157" y1="498" x2="175" y2="498" class="dim"/><line x1="157" y1="700" x2="175" y2="700" class="dim"/><text x="87" y="604" class="sm seal" transform="rotate(-90 87 604)">H 975 rec. [900–1050] · leaning test</text><text x="110" y="741" class="t3 ink">动作：走 → 累 → 靠 / 半倚 → 看 → 再走</text><text x="110" y="766" class="sm muted">目标停留 2–8 min 级短恢复；不是长时占位座椅。最终人体工学须样件测试。</text><text x="830" y="280" class="xs qing">02 / REVERSIBLE CLAMP ASSEMBLY</text><rect x="830" y="305" width="700" height="470" rx="18" class="paper"/><text x="865" y="350" class="t2 ink">接触面不直接变成“栏杆承重”。</text><text x="865" y="382" class="txt muted">真实栏杆的尺寸、材质、腐蚀、基础、许可与承载必须现场/工程复核；无法证明时不安装。</text><rect x="895" y="445" width="390" height="48" rx="8" class="wood"/><text x="1310" y="475" class="t3 ink">A 触感面板</text><rect x="930" y="515" width="320" height="15" rx="6" class="pad"/><text x="1310" y="529" class="t3 ink">B 隔离 / 缓冲</text><path d="M972 558v95h46v-57h137v57h46v-95" class="line"/><text x="1310" y="610" class="t3 ink">C 可拆夹持支架</text><rect x="1018" y="678" width="137" height="24" rx="8" class="steel"/><text x="1310" y="697" class="t3 ink">D 既有基体</text><circle cx="948" cy="605" r="10" class="seal"/><circle cx="1225" cy="605" r="10" class="seal"/><text x="1310" y="742" class="t3 ink">E 可检修紧固件</text><text x="70" y="830" class="xs qing">03 / DETAIL RULES</text><g transform="translate(70 850)"><rect width="350" height="110" rx="14" class="paper"/><text x="20" y="28" class="xs seal">CONTACT</text><text x="20" y="55" class="t3 ink">圆角 / 干燥 / 不过冷</text><text x="20" y="81" class="sm muted">触感面材优先木/复合材候选；金属不直接作为大面积身体接触面。</text></g><g transform="translate(438 850)"><rect width="350" height="110" rx="14" class="paper"/><text x="20" y="28" class="xs seal">DRAIN + CLEAN</text><text x="20" y="55" class="t3 ink">不形成积水袋</text><text x="20" y="81" class="sm muted">面板、缓冲层、支架之间留清洁/排水路径；缝隙尺度以样件验证。</text></g><g transform="translate(806 850)"><rect width="350" height="110" rx="14" class="paper"/><text x="20" y="28" class="xs seal">ACCESSIBLE FLOW</text><text x="20" y="55" class="t3 ink">不得侵占有效通行净宽</text><text x="20" y="81" class="sm muted">若处于无障碍通行流线，设施必须避开必要净宽和突出物风险；具体位置现场复核。</text></g><g transform="translate(1174 850)"><rect width="356" height="110" rx="14" class="paper"/><text x="20" y="28" class="xs seal">FIELD OPEN</text><text x="20" y="55" class="t3 ink">荷载 / 边缘 / 防护 / 许可</text><text x="20" y="81" class="sm muted">栏杆承载、边缘安全、湿滑、法规、运营与无障碍均未关闭。</text></g></svg>