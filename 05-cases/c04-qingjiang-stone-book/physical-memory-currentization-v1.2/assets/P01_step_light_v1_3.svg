<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>.bg{fill:#f4f0e5}.paper{fill:#fbf9f3;stroke:#c8c7bd;stroke-width:1.2}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.stone{fill:#d7d6cc}.edge{fill:#769b90}.glow{fill:#9cc8bc;opacity:.28}.line{stroke:#17332c;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7d8b84;stroke-width:1.2;fill:none}.t1{font:700 42px 'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif}.t2{font:700 22px 'Noto Serif CJK SC','Noto Serif SC',serif}.t3{font:700 16px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}.txt{font:400 14px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 10.5px 'Noto Sans CJK SC','Noto Sans SC',sans-serif;letter-spacing:1.2px}</style>
<rect class="bg" width="1600" height="1000"/>
<text x="70" y="62" class="xs qing">P01 / 步步生光 · LOCAL RESPONSE REPAIR</text><text x="70" y="116" class="t1 ink">光只在身体经过的邻近短段出现，路本身不变成一条“发光路线”</text><text x="70" y="154" class="txt muted">保留“经过 → 局部回应 → 消退”，但把静态青色边缘降为被动构造线，只让靠近身体的一小段进入低强度响应。</text><text x="70" y="187" class="xs seal">CONCEPT / NTS / FIELD OPEN / NO ROUTE GUIDANCE CLAIM / NOT FOR CONSTRUCTION</text><line x1="70" y1="212" x2="1530" y2="212" class="thin"/>
<text x="70" y="250" class="xs qing">01 / FIRST READ — WALKWAY REMAINS WALKWAY</text>
<g transform="translate(70 275)"><rect width="930" height="365" rx="18" class="paper"/><path d="M110 305L340 72H700L845 305Z" class="stone"/><path d="M110 305L340 72M845 305L700 72" class="line"/><path d="M130 292L350 82" stroke="#9ca7a1" stroke-width="9" fill="none" opacity=".45"/><path d="M825 292L692 82" stroke="#9ca7a1" stroke-width="9" fill="none" opacity=".45"/><path d="M482 204L443 239" stroke="#8ebfb2" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M443 239L415 265" stroke="#8ebfb2" stroke-width="12" fill="none" stroke-linecap="round" opacity=".18"/><ellipse cx="456" cy="232" rx="54" ry="28" class="glow"/><circle cx="495" cy="122" r="17" class="line"/><path d="M495 140l-9 68m8-43l-35 35m35-31l31 31m-39 8l-22 61m22-61l31 58" class="line"/><text x="28" y="40" class="t3 ink">主踏面保持连续、平整、无“踩灯点”</text><text x="28" y="66" class="sm muted">身体正常经过；只有邻近短段响应，前后边缘保持被动。</text><text x="590" y="330" class="sm seal">LOCAL EDGE RESPONSE</text></g>
<text x="1040" y="250" class="xs qing">02 / DAY ↔ NIGHT + FAILURE-SAFE</text>
<g transform="translate(1040 275)"><rect width="490" height="365" rx="18" class="paper"/><text x="24" y="40" class="t2 ink">DAY / 白天</text><rect x="24" y="62" width="442" height="90" rx="12" fill="#e9e8df"/><path d="M48 125h390" stroke="#769b90" stroke-width="8" opacity=".45"/><text x="24" y="180" class="sm muted">不发光也成立：边缘材料只作为低对比构造线。</text><line x1="24" y1="205" x2="466" y2="205" class="thin"/><text x="24" y="240" class="t2 ink">NIGHT / 夜间候选</text><rect x="24" y="260" width="442" height="68" rx="12" fill="#263b35"/><path d="M48 294h390" stroke="#70877f" stroke-width="6" opacity=".28"/><path d="M188 294h78" stroke="#9cc8bc" stroke-width="8" stroke-linecap="round"/><path d="M266 294h56" stroke="#9cc8bc" stroke-width="8" stroke-linecap="round" opacity=".16"/><circle cx="224" cy="281" r="8" fill="#f2efe7"/><text x="24" y="350" class="sm muted">只在身体邻近短段出现；故障 / 白天 / 维护 → OFF；不承担路径照明或安全导向。</text></g>
<text x="70" y="690" class="xs qing">03 / SECTION + PROTOTYPE ARCHITECTURE</text>
<g transform="translate(70 715)"><rect width="1460" height="185" rx="18" class="paper"/><path d="M60 105h660" class="line"/><rect x="60" y="83" width="610" height="22" class="stone"/><rect x="670" y="83" width="32" height="22" class="edge"/><path d="M702 105h105" class="line"/><text x="60" y="54" class="t3 ink">PRIMARY WALKING SURFACE</text><text x="555" y="54" class="t3 ink">EDGE ZONE</text><text x="60" y="140" class="sm muted">连续踏面 / 不设置凸起目标</text><text x="555" y="140" class="sm muted">非接触感应 → 局部控制 → 低强度边缘反馈；1.5–3 s 仅为样件测试候选</text><text x="850" y="54" class="t3 ink">FIELD GATES</text><text x="850" y="85" class="sm muted">铺装齐平 / 防滑 / 排水 / 防水 / 检修 / 电气 / 眩光</text><text x="850" y="113" class="sm muted">夜间运营 / 生态影响 / 实际位置 / 无障碍连续性</text><text x="850" y="145" class="sm seal">任一未验证：不得进入施工或安全结论。</text></g>
<text x="70" y="948" class="sm muted">Attack test：若第一眼像“发光踏步、踩灯游戏、路径导向灯”，或反馈构件进入主要落脚区形成凸起/追逐目标，则 FAIL。无灯状态不影响通行；不积分、不计数、不提示“下一盏”。</text>
</svg>