<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>.bg{fill:#f4f0e5}.ink{fill:#17332c}.muted{fill:#687870}.qing{fill:#548b7e}.seal{fill:#a54539}.paper{fill:#fbf9f3;stroke:#c8c7bd;stroke-width:1.2}.rule{stroke:#9da9a3;stroke-width:1}.river{fill:none;stroke:#6f9d91;stroke-width:3}.t1{font:700 44px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif}.t2{font:700 24px 'Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',serif}.t3{font:700 16px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.txt{font:400 15px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 11px 'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif;letter-spacing:1.3px}</style>
<rect class="bg" width="1600" height="1000"/><text x="70" y="76" class="xs qing">M01 / QINGJIANG JOURNAL · PAPER MEMORY INTERFACE V1.2</text><text x="70" y="135" class="t1 ink">《清江旅记》｜让纸本保存身体留下的痕迹</text><text x="70" y="177" class="txt muted">A5 原型；不做“十三枚章集齐册”。纸本负责手写、画、折痕和路线痕迹；数字“我的石书”负责整理、回看和以后再读。</text><text x="70" y="208" class="xs seal">PROTOTYPE FORMAT / EDITABLE VECTOR / NO COMPLETION SCORE</text><line x1="70" y1="235" x2="1530" y2="235" class="rule"/>
<text x="70" y="280" class="xs qing">01 / PHYSICAL PROTOTYPE</text><g transform="translate(70 310)"><rect width="310" height="440" rx="4" class="paper"/><text x="30" y="48" class="xs qing">QINGJIANG JOURNAL</text><text x="30" y="105" class="t2 ink">清江旅记</text><path d="M30 282c75-49 119 22 178-18 49-33 73-20 101-42" class="river"/><path d="M30 306c74-43 119 26 181-14 48-31 74-18 102-39" class="river" opacity=".55"/><rect x="30" y="375" width="28" height="28" fill="none" stroke="#a54539"/><text x="38" y="396" class="t3 seal">清</text><text x="30" y="423" class="sm muted">A5 / 148 × 210 mm prototype</text></g>
<g transform="translate(420 310)"><rect width="1110" height="440" rx="18" class="paper"/><text x="34" y="42" class="xs seal">PROTOTYPE BUILD</text><text x="34" y="78" class="t3 ink">建议样件：A5 / 骑马订 / 32 pp（设计测试值）</text><text x="34" y="105" class="sm muted">内页：无涂层书写纸候选；封面：较厚无涂层纸 + 耐污保护测试。页数、克重、装订与耐湿仍需样件验证。</text>
<line x1="34" y1="132" x2="1070" y2="132" class="rule"/>
<g transform="translate(34 154)">
<rect width="238" height="236" rx="6" class="paper"/>
<text x="16" y="26" class="xs qing">OPEN / 出发</text><text x="16" y="56" class="t3 ink">今天怎么游？</text>
<text x="16" y="82" class="sm muted">先选节奏，不选任务</text>
<line x1="16" y1="99" x2="220" y2="99" class="rule"/>
<text x="16" y="122" class="sm ink">○ BOAT　○ CABLE　○ WALK</text>
<text x="16" y="151" class="sm ink">□ 看景　□ 亲子</text>
<text x="16" y="178" class="sm ink">□ 深读　□ 少走一点</text>
<text x="16" y="214" class="sm muted">OPEN → 只建立当天意图</text>
</g>
<g transform="translate(294 154)">
<rect width="238" height="236" rx="6" class="paper"/>
<text x="16" y="26" class="xs qing">ROUTE / 路上</text><text x="16" y="56" class="t3 ink">我从哪里走到哪里？</text>
<text x="16" y="82" class="sm muted">场景 / 动作 / 一句话</text>
<path d="M22 126c38-25 61 15 94-6 28-18 50-8 87-30" class="river"/>
<circle cx="24" cy="126" r="4" fill="#a54539"/><circle cx="204" cy="90" r="4" fill="#a54539"/>
<line x1="16" y1="166" x2="220" y2="166" class="rule"/>
<line x1="16" y1="190" x2="220" y2="190" class="rule"/>
<text x="16" y="218" class="sm muted">路线痕迹可不精确</text>
</g>
<g transform="translate(554 154)">
<rect width="238" height="236" rx="6" class="paper"/>
<text x="16" y="26" class="xs qing">LOOK / 停下</text><text x="16" y="56" class="t3 ink">我想记住哪个瞬间？</text>
<text x="16" y="82" class="sm muted">画 / 贴照片 / 写一句</text>
<rect x="16" y="103" width="206" height="88" fill="#e8eee9"/>
<path d="M28 172c45-36 76 13 116-15 22-16 41-14 66-35" class="river"/>
<line x1="16" y1="210" x2="220" y2="210" class="rule"/>
</g>
<g transform="translate(814 154)">
<rect width="262" height="236" rx="6" class="paper"/>
<text x="16" y="26" class="xs qing">RETURN / 回程</text><text x="16" y="56" class="t3 ink">这一趟留下什么？</text>
<text x="16" y="82" class="sm muted">一个声音 / 一阵风 / 一个问题</text>
<text x="16" y="117" class="sm ink">声音：</text><line x1="58" y1="113" x2="244" y2="113" class="rule"/>
<text x="16" y="147" class="sm ink">风：</text><line x1="42" y1="143" x2="244" y2="143" class="rule"/>
<text x="16" y="177" class="sm ink">问题：</text><line x1="58" y1="173" x2="244" y2="173" class="rule"/>
<text x="16" y="214" class="sm seal">不显示 13/13 / 积分 / 完成率</text>
</g>
</g>
<text x="70" y="820" class="xs qing">02 / PAPER ↔ DIGITAL FIELD MATCH</text>
<g transform="translate(70 845)"><rect width="450" height="105" rx="14" class="paper"/><text x="20" y="29" class="xs seal">PAPER SAVES</text><text x="20" y="57" class="t3 ink">手写 / 画 / 折痕 / 贴附 / 路线痕迹</text><text x="20" y="82" class="sm muted">这些“材料证据”不需要 App 才存在。</text></g>
<g transform="translate(555 845)"><rect width="450" height="105" rx="14" class="paper"/><text x="20" y="29" class="xs seal">DIGITAL SAVES</text><text x="20" y="57" class="t3 ink">scene / action / note / photo optional / revisit</text><text x="20" y="82" class="sm muted">不要求 GPS 精确轨迹；v1.2 原型仅本机保存文字。</text></g>
<g transform="translate(1040 845)"><rect width="490" height="105" rx="14" class="paper"/><text x="20" y="29" class="xs seal">COMMON LANGUAGE</text><text x="20" y="57" class="t3 ink">场景 + 动作 + 一句话 + “以后再看”</text><text x="20" y="82" class="sm muted">纸本和数字共享字段，但不要求实时同步。</text></g>
</svg>