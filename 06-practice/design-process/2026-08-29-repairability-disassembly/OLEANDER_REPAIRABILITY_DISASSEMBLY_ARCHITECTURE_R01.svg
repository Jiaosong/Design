<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC, sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / REPAIRABILITY → DISASSEMBLY ARCHITECTURE</text>
<text x="88" y="128" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#18211F">“可维修”必须改变拆装路径、紧固方式与部件边界，不只是售后说明</text>
<text x="88" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#69706D">synthetic handheld device · repairability study · no regulatory compliance / sealing / electrical / thermal / safety claim</text>
<rect x="88" y="208" width="1744" height="118" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="116" y="242" font-size="11.5" font-weight="700" fill="#8B5D46">EXTERNAL EVIDENCE</text>
<text x="116" y="268" font-size="12.0" fill="#29332F">EU ecodesign treats repair/disassembly and spare-part access</text>
<text x="116" y="291" font-size="12.0" fill="#29332F">as resource-efficiency concerns; ESPR flags impeded disassembly.</text>
<text x="640" y="242" font-size="11.5" font-weight="700" fill="#7D654B">INFERENCE</text>
<text x="640" y="268" font-size="12.0" fill="#29332F">repair intent is weak when target parts are buried behind</text>
<text x="640" y="291" font-size="12.0" fill="#29332F">destructive or unrelated disassembly.</text>
<text x="1120" y="242" font-size="11.5" font-weight="700" fill="#7D654B">ADVERSE</text>
<text x="1120" y="268" font-size="12.4" fill="#29332F">battery fails; charge port fails;</text>
<text x="1120" y="291" font-size="12.4" fill="#29332F">device must be reassembled afterward.</text>
<text x="1450" y="242" font-size="11.5" font-weight="700" fill="#315D57">CONSEQUENCE</text>
<text x="1450" y="268" font-size="12.4" fill="#29332F">separate service zones; expose reusable access;</text>
<text x="1450" y="291" font-size="12.4" fill="#29332F">avoid trapping one repair behind another.</text>
</g>
<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="394" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · SEALED STACK</text>
<text x="120" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13.2" fill="#59615F">连续背壳 + 大面积粘接；换充电口也必须先经过电池与主板。</text>
<g transform="translate(162,470)"><rect x="0" y="0" width="360" height="246" rx="42" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><rect x="32" y="30" width="296" height="186" rx="26" fill="#D0CBC0" stroke="#7B827E" stroke-width="2"/><rect x="72" y="58" width="216" height="92" rx="16" fill="#AAB0AC"/><rect x="126" y="162" width="108" height="30" rx="8" fill="#797F7C"/><rect x="48" y="44" width="264" height="154" rx="22" fill="none" stroke="#914F3D" stroke-width="7" stroke-dasharray="12 8"/><text x="112" y="108" font-family="Arial,sans-serif" font-size="11" fill="#18211F">BATTERY / BOARD STACK</text><text x="141" y="181" font-family="Arial,sans-serif" font-size="10" fill="#F7F3EA">CHARGE PORT</text></g>
<text x="120" y="756" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#7D4A3A">PORT FAILURE → unrelated battery/board removal precedes the target part.</text><text x="120" y="784" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#7D4A3A">REASSEMBLY ATTACK → destructive perimeter bond becomes a repair dependency.</text><rect x="120" y="830" width="484" height="46" rx="10" fill="#F7F3EA"/><text x="140" y="858" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#7D4A3A">ROOT · styling/sealing architecture owns the service path.</text>
<rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="718" y="394" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · SERVICE-ZONED ACCESS</text><text x="718" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13.2" fill="#59615F">battery 与 port 分成独立 service zone；外壳用可重复开启的机械 access。</text>
<g transform="translate(760,466)"><rect x="0" y="0" width="456" height="254" rx="42" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><rect x="30" y="32" width="270" height="166" rx="24" fill="#D9D4C9" stroke="#315D57" stroke-width="3"/><rect x="316" y="126" width="108" height="72" rx="18" fill="#D9D4C9" stroke="#315D57" stroke-width="3"/><rect x="60" y="64" width="210" height="100" rx="18" fill="#AAB0AC"/><text x="118" y="120" font-family="Arial,sans-serif" font-size="11" fill="#18211F">BATTERY MODULE</text><rect x="334" y="148" width="72" height="28" rx="7" fill="#777E7A"/><text x="338" y="167" font-family="Arial,sans-serif" font-size="9.5" fill="#F7F3EA">PORT</text><g fill="#F7F3EA" stroke="#5D6662" stroke-width="2"><circle cx="50" cy="52" r="7"/><circle cx="280" cy="52" r="7"/><circle cx="50" cy="178" r="7"/><circle cx="280" cy="178" r="7"/><circle cx="330" cy="140" r="6"/><circle cx="410" cy="140" r="6"/><circle cx="330" cy="184" r="6"/><circle cx="410" cy="184" r="6"/></g><path d="M164 18 V50" stroke="#315D57" stroke-width="4"/><path d="M164 18 l-8 12 h16 z" fill="#315D57"/><path d="M370 108 V132" stroke="#315D57" stroke-width="4"/><path d="M370 108 l-8 12 h16 z" fill="#315D57"/><text x="84" y="226" font-family="Arial,sans-serif" font-size="10.5" fill="#315D57">BATTERY ACCESS DOES NOT REQUIRE PORT REMOVAL</text></g>
<text x="718" y="756" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#315D57">FASTENER-OFF → access logic weakens immediately; fastener type is part of architecture.</text><text x="718" y="784" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#315D57">TARGET-PART TEST → battery and port each have a bounded disassembly route.</text><rect x="718" y="830" width="548" height="46" rx="10" fill="#F7F3EA"/><text x="738" y="858" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#315D57">CONSEQUENCE · maintenance requirement changes enclosure and part boundaries.</text>
<rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1380" y="394" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · REMOVABLE COVER, TRAPPED PART</text><text x="1380" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="13.2" fill="#59615F">背壳可拆，但 port 仍压在 battery carrier 下；“能打开”不等于目标部件可维修。</text>
<g transform="translate(1412,476)"><rect x="0" y="0" width="356" height="238" rx="42" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><rect x="28" y="26" width="300" height="182" rx="24" fill="#D9D4C9" stroke="#8A6941" stroke-width="3"/><rect x="62" y="54" width="226" height="110" rx="18" fill="#AAB0AC"/><rect x="138" y="170" width="82" height="26" rx="7" fill="#777E7A"/><path d="M178 198 V160" stroke="#914F3D" stroke-width="4" stroke-dasharray="7 5"/><text x="142" y="188" font-family="Arial,sans-serif" font-size="9" fill="#F7F3EA">PORT</text><text x="105" y="112" font-family="Arial,sans-serif" font-size="11" fill="#18211F">BATTERY CARRIER</text></g>
<text x="1380" y="756" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#8A6941">COVER-OFF → enclosure opens, but target-part dependency remains.</text><text x="1380" y="784" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#8A6941">REPAIR → relocate port or split carrier so unrelated removal disappears.</text><rect x="1380" y="830" width="420" height="46" rx="10" fill="#F7F3EA"/><text x="1400" y="858" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#59615F">openable shell ≠ repairable component architecture.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="988" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#18211F">BOUNDED TEST</text><text x="88" y="1014" font-family="Noto Sans CJK SC, sans-serif" font-size="14.5" fill="#59615F">Pick one service part. Trace only the parts/fasteners that must be disturbed before removal and again before reassembly. Unrelated dependencies are visible design debt.</text><text x="88" y="1044" font-family="Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#747B78">No universal screw count, tool type, adhesive ban, sealing solution or compliance claim is inferred from this synthetic test.</text>
</svg>