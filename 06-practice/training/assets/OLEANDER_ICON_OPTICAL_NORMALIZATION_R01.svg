<text x="168" y="790" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#7D4A3A">16px：头/躯干/回转箭头开始粘连；语义还“在”，但 first-read 已变成噪声。</text>
<text x="168" y="824" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#7D4A3A">错误修法：只加粗整图，会进一步堵塞 joint gaps；只扩大外框，会破坏 carrier rhythm。</text>

