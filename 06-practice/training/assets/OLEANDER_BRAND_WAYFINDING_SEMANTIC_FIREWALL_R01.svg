  <path d="M575 47 l-12 -8 v16 z" fill="#315D57"/>
</g>
<rect x="1384" y="522" width="160" height="48" rx="12" fill="#F7F3EA" stroke="#315D57" stroke-width="2"/>
<text x="1402" y="543" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11" font-weight="700" fill="#27312E">CURRENT CONTEXT</text>
<text x="1402" y="561" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">RELATIONAL / NTS</text>
<rect x="1590" y="566" width="152" height="44" rx="12" fill="#26312E"/>
<text x="1628" y="594" font-family="Arial,sans-serif" font-size="12" fill="#fff">RETURN</text>
<text x="1322" y="700" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#315D57">REQUIRED</text>
<text x="1322" y="728" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">node role · current context · Return · state/truth boundary · decision hierarchy</text>
<text x="1322" y="756" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">functional contrast > brand decoration; route authority remains upstream</text>
<rect x="1322" y="800" width="468" height="76" rx="12" fill="#F7F3EA"/>
<text x="1342" y="830" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">ROLE</text>
<text x="1342" y="854" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#59615F">orientation / movement decision / recovery / functional decoding</text>

<line x1="96" y1="960" x2="1824" y2="960" stroke="#BDB6A8" stroke-width="2"/>
<text x="96" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text>
<text x="300" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">Remove labels and arrows: if a brand-derived route trace still looks like an instruction to move, it is borrowing wayfinding authority and must be restated.</text>
<text x="96" y="1045" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Synthetic route geometry only. Does not define C04 official route, position, direction, GPS, distance, live status, signage approval or production brand system.</text>
</svg>