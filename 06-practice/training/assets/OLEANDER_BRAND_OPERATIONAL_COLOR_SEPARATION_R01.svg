<text x="324" y="535" font-size="18" font-weight="700" fill="#fff">可继续</text><text x="522" y="535" font-size="18" font-weight="700" fill="#fff">谨慎</text><text x="324" y="651" font-size="18" font-weight="700" fill="#fff">关闭</text><text x="522" y="651" font-size="18" font-weight="700" fill="#fff">未确认</text></g>
<path d="M320 736 C386 700 450 706 514 728 C570 748 620 744 664 718" fill="none" stroke="#4B8585" stroke-width="16" stroke-linecap="round"/><circle cx="410" cy="710" r="11" fill="#4B8585"/><circle cx="566" cy="740" r="11" fill="#4B8585"/>
<text x="302" y="792" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7F4B3C">FAIL: color carries identity + route + every state</text>
<text x="132" y="876" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#7F4B3C">去掉文字后四种运营状态完全同义；Brand identity 反而污染 fail-closed 语义。</text>
<rect x="934" y="226" width="890" height="684" rx="24" fill="#DED9CD" stroke="#BDB6A9" stroke-width="2"/>
<text x="970" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#315D57">KEEP / ROLE LANES + REDUNDANT STATE CUES</text>
<text x="970" y="309" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">品牌色只留在 identity / passive context；状态用独立 token + 形状 + 文案 + 行为共同编码。</text>
<rect x="1152" y="346" width="464" height="508" rx="38" fill="#101917"/><rect x="1172" y="366" width="424" height="468" rx="24" fill="#EEEAE0"/><rect x="1192" y="388" width="384" height="54" rx="18" fill="#4B8585"/>
