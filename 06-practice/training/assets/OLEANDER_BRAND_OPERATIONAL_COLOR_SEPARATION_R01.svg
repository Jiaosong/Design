<rect x="1394" y="582" width="176" height="96" rx="16" fill="#F7F3EA" stroke="#6C7270" stroke-width="2" stroke-dasharray="7 6"/><path d="M1422 600 l11 10 l-11 10 l-11 -10 z" fill="#6C7270"/><text x="1419" y="615" font-size="13" font-weight="700" fill="#fff">?</text><text x="1444" y="615" font-size="13" fill="#37413E">UNKNOWN</text><text x="1418" y="652" font-size="18" font-weight="700" fill="#24302D">未确认 → RETURN</text></g>
