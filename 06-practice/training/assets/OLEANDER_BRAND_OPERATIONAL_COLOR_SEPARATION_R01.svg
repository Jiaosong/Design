<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="96" y="74" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="23" letter-spacing="3" fill="#59615F">OLEANDER TRAINING / BRAND ↔ OPERATIONAL STATE COLOR SEPARATION</text>
<text x="96" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="48" font-weight="700" fill="#18211F">品牌色负责“是谁”；状态色负责“现在能不能走”</text>
<text x="96" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#69706D">C04 ROUTE semantics · NORMAL / DEGRADED / CLOSED / UNKNOWN · training-only · NTS · NOT GPS · FIELD OPEN</text>
<rect x="96" y="226" width="790" height="684" rx="24" fill="#DED9CD" stroke="#BDB6A9" stroke-width="2"/>
<text x="132" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#904F3D">REJECT / BRAND TEAL DOES EVERYTHING</text>
<text x="132" y="309" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">同一清江水色同时做品牌、选中、正常、降级、关闭、未知；状态只能靠小字补救。</text>
<rect x="258" y="346" width="464" height="508" rx="38" fill="#101917"/>
<rect x="278" y="366" width="424" height="468" rx="24" fill="#EEEAE0"/>
<rect x="298" y="388" width="384" height="54" rx="18" fill="#4B8585"/>
