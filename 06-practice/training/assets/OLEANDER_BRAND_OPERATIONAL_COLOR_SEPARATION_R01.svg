<text x="1196" y="792" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">PASS: brand teal stays contextual; CLOSED / UNKNOWN can dominate when needed</text>
<rect x="990" y="844" width="780" height="42" rx="10" fill="#F7F3EA"/><text x="1012" y="870" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#4F5855">IDENTITY lane ≠ INTERACTION lane ≠ OPERATIONAL STATE lane · color never acts alone</text>
<line x1="96" y1="962" x2="1824" y2="962" stroke="#BDB6A8" stroke-width="2"/><text x="96" y="1005" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="300" y="1005" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">Remove brand color, then remove status color: identity may weaken, but CLOSED / UNKNOWN meaning and Return priority must still survive.</text><text x="96" y="1046" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Training tokens are illustrative, not C04 approved palette values. Does not prove accessibility compliance, field status, device gamut or production color.</text>
