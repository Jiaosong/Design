<text x="1040" y="325" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2928">Second read: reveal only what changes the decision</text>
<text x="1040" y="800" font-family="Arial, sans-serif" font-size="18" fill="#59615f">Overlay is subordinate. It annotates the same geometry instead of replacing it.</text>
