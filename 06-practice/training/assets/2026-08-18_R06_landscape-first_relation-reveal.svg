<text x="100" y="980" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2928">PROMOTION GATE</text><text x="330" y="980" font-family="Arial, sans-serif" font-size="20" fill="#59615f">If A is not project-readable without labels, B cannot rescue it. Abstract proxy ≠ Main visual.</text>
<text x="100" y="1025" font-family="Arial, sans-serif" font-size="16" fill="#7a7f7c">Training artifact only · schematic relation study · does not prove field geometry, dimensions, constructability, or final design.</text>
