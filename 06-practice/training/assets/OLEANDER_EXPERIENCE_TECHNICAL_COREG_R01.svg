<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="96" y="76" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="23" letter-spacing="3" fill="#5B625F">OLEANDER TRAINING / EXPERIENCE ↔ TECHNICAL PROOF CO-REGISTRATION</text>
<text x="96" y="132" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="48" font-weight="700" fill="#18211F">体验图说“感觉”；技术图必须证明同一组关系怎样成立</text>
<text x="96" y="174" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#68706C">synthetic geometry · NTS · FIELD OPEN · training-only · no C04 site geometry claimed</text>
<rect x="96" y="224" width="820" height="680" rx="24" fill="#DED9CD" stroke="#BDB6A9" stroke-width="2"/>
<text x="132" y="270" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#2E5A55">A / EXPERIENCE CARRIER</text>
<text x="132" y="306" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#5E6663">Landscape first. Platform stays subordinate; three anchors are spatial, not graphic decoration.</text>
