<circle cx="607" cy="653" r="15" fill="#8B5D46"/><text x="598" y="659" font-family="Arial" font-size="14" fill="#fff">C</text>
<text x="150" y="840" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">Invariant read: A = path edge / B = body position / C = outer platform edge</text>
<rect x="962" y="224" width="862" height="680" rx="24" fill="#DED9CD" stroke="#BDB6A9" stroke-width="2"/>
<text x="998" y="270" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#2E5A55">B / TECHNICAL PROOF CARRIER</text>
<text x="998" y="306" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#5E6663">Section changes representation, not the invariant relationship between path, body and outer edge.</text>
