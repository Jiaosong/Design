<text x="1363" y="546" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">RELATIVE SPAN ONLY · NTS</text>
<line x1="1430" y1="616" x2="1430" y2="510" stroke="#8B5D46" stroke-width="2" stroke-dasharray="7 7"/>
<text x="1450" y="520" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#7A4E3D">B must land inside A–C span</text>
<rect x="1010" y="756" width="742" height="82" rx="12" fill="#F7F3EA" stroke="#C8C0B3"/>
<text x="1032" y="784" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="700" fill="#303936">INVARIANTS</text>
<text x="1160" y="784" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#4E5754">A→B: approach-to-body</text>
<text x="1375" y="784" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#4E5754">B→C: body-to-edge</text>
<text x="1580" y="784" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#4E5754">A→C: total support</text>
<text x="1032" y="816" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#69716E">PASS only if ordering, sidedness and containment survive the carrier change.</text>
<line x1="96" y1="956" x2="1824" y2="956" stroke="#BDB6A9" stroke-width="2"/>
<text x="96" y="1000" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text>
<text x="300" y="1000" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">If the technical carrier needs to move, mirror, widen or invent the primary relation to “explain” it, the proof is not co-registered.</text>
<text x="96" y="1042" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#737A77">Does not prove C04 site dimensions, structural adequacy, accessibility, field geometry, constructability or Design PASS.</text>
</svg>