<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<rect width="1800" height="1120" fill="#eceae4"/><rect x="44" y="40" width="1712" height="1038" rx="18" fill="#fff" stroke="#d3d0c8"/>
<text x="88" y="102" font-family="Arial" font-size="30" font-weight="700">OLEANDER / EXPLORATION BEHAVIOR GRAMMAR</text>
<text x="88" y="138" font-family="Arial" font-size="14" fill="#666">SAME WORLD RELATION · EFFECT-FIRST VS REVERSIBLE STATE GRAMMAR</text>
<text x="88" y="196" font-family="Arial" font-size="17" font-weight="700">A / EFFECT CHAIN — REJECT</text>
<text x="88" y="222" font-family="Arial" font-size="12" fill="#777">hover → glow → click → fade card. Visual change exists; behavior memory does not.</text>
<rect x="88" y="255" width="630" height="690" fill="#0c1719" stroke="#bec3be"/>
<path d="M88 720 L165 610 L250 700 L345 525 L430 692 L540 500 L630 660 L718 550" fill="none" stroke="#496762" stroke-width="38"/>
<path d="M145 790 C260 720 370 675 520 580" fill="none" stroke="#d8efc9" stroke-width="5"/>
<circle cx="245" cy="710" r="17" fill="#102123" stroke="#d8efc9" stroke-width="3"/><circle cx="405" cy="630" r="25" fill="#17302f" stroke="#d8efc9" stroke-width="3"/><circle cx="560" cy="545" r="17" fill="#102123" stroke="#d8efc9" stroke-width="3"/>
<circle cx="405" cy="630" r="52" fill="none" stroke="#d8efc9" stroke-opacity=".22" stroke-width="13"/>
<rect x="438" y="735" width="242" height="116" rx="12" fill="#132426" stroke="#3e5551"/><text x="458" y="766" font-family="Arial" font-size="12" font-weight="700" fill="#fff">Valley observation</text><text x="458" y="792" font-family="Arial" font-size="10" fill="#a8b8b4">fade card appears</text><text x="458" y="813" font-family="Arial" font-size="10" fill="#a8b8b4">no commit / retreat / world memory</text>
<text x="120" y="910" font-family="Arial" font-size="10" fill="#9fb0ac">EFFECTS: glow · pulse · fade · reveal</text>
<text x="770" y="196" font-family="Arial" font-size="17" font-weight="700">B / STATE GRAMMAR — KEEP FOR TRAINING</text>
<text x="770" y="222" font-family="Arial" font-size="12" fill="#777">Each visual change corresponds to a reversible user-intent state.</text>
<g font-family="Arial">
<g transform="translate(770 255)"><rect width="235" height="300" rx="13" fill="#0c1719" stroke="#bec3be"/><text x="18" y="32" font-size="11" font-weight="700" fill="#85aaa5">01 / IDLE</text><path d="M20 230 C75 195 120 172 200 122" fill="none" stroke="#d8efc9" stroke-width="4"/><circle cx="112" cy="176" r="13" fill="#102123" stroke="#d8efc9" stroke-width="3"/><text x="18" y="274" font-size="9" fill="#a8b8b4">world first / no forced prompt</text></g>
<g transform="translate(1025 255)"><rect width="235" height="300" rx="13" fill="#0c1719" stroke="#bec3be"/><text x="18" y="32" font-size="11" font-weight="700" fill="#85aaa5">02 / SCOUT</text><path d="M20 230 C75 195 120 172 200 122" fill="none" stroke="#d8efc9" stroke-width="4"/><circle cx="112" cy="176" r="21" fill="#1d3937" stroke="#d8efc9" stroke-width="3"/><text x="18" y="274" font-size="9" fill="#a8b8b4">preview only / reversible by leave</text></g>
<g transform="translate(1280 255)"><rect width="235" height="300" rx="13" fill="#0c1719" stroke="#bec3be"/><text x="18" y="32" font-size="11" font-weight="700" fill="#85aaa5">03 / COMMIT</text><path d="M20 230 C75 195 120 172 200 122" fill="none" stroke="#d8efc9" stroke-width="4" opacity=".6"/><circle cx="112" cy="176" r="21" fill="#d8efc9" stroke="#fff" stroke-width="3"/><circle cx="54" cy="210" r="10" fill="#102123" stroke="#d8efc9" stroke-opacity=".5"/><circle cx="184" cy="132" r="10" fill="#102123" stroke="#d8efc9" stroke-opacity=".5"/><text x="18" y="274" font-size="9" fill="#a8b8b4">one relation owns primary attention</text></g>
<g transform="translate(1535 255)"><rect width="205" height="300" rx="13" fill="#0c1719" stroke="#bec3be"/><text x="18" y="32" font-size="11" font-weight="700" fill="#85aaa5">04 / REVEAL</text><circle cx="52" cy="154" r="18" fill="#d8efc9" stroke="#fff" stroke-width="3"/><path d="M70 154 H112" stroke="#d8efc9"/><rect x="112" y="93" width="76" height="122" rx="9" fill="#132426" stroke="#54716c"/><text x="123" y="118" font-size="9" font-weight="700" fill="#fff">RELATION</text><text x="123" y="139" font-size="8" fill="#a8b8b4">explanation</text><text x="18" y="274" font-size="9" fill="#a8b8b4">panel stays world-anchored</text></g>
<path d="M1005 405 H1020" stroke="#55716c" stroke-width="2"/><path d="M1260 405 H1275" stroke="#55716c" stroke-width="2"/><path d="M1515 405 H1530" stroke="#55716c" stroke-width="2"/>
<path d="M1635 585 C1500 650 1260 650 1130 585" fill="none" stroke="#7a9b95" stroke-width="2" stroke-dasharray="8 7"/><text x="1345" y="670" font-size="10" fill="#5c6f69">RETREAT / ESC</text>
<path d="M1130 585 C1010 700 915 700 835 585" fill="none" stroke="#7a9b95" stroke-width="2" stroke-dasharray="8 7"/><text x="895" y="720" font-size="10" fill="#5c6f69">RETURN / RESET</text>
<rect x="790" y="760" width="910" height="142" rx="11" fill="#f8f7f3" stroke="#d0cdc5"/>
<text x="812" y="790" font-size="11" font-weight="700" fill="#35564f">BEHAVIOR CONTRACT</text>
<text x="812" y="818" font-size="10" fill="#555">SCOUT = preview without commitment · COMMIT = persistent selection · REVEAL = explanation after intent</text>
<text x="812" y="842" font-size="10" fill="#555">RETREAT = step back one state · RETURN = clear selected relation and restore route-first baseline</text>
<text x="812" y="866" font-size="10" fill="#7a5148">Hard fail: effects animate, but no reversible state / selected relation / return path survives.</text>
</g>
<line x1="88" y1="978" x2="1718" y2="978" stroke="#d2cfc7"/><text x="88" y="1014" font-family="Arial" font-size="12" font-weight="700">RULE /</text><text x="145" y="1014" font-family="Arial" font-size="12" fill="#333">Exploration behavior = user intent + state memory + world anchor + reversible retreat. Glow/fade are optional render mechanisms, not the grammar itself.</text>
<text x="88" y="1044" font-family="Arial" font-size="10" fill="#777">Synthetic training relation only · Browser runtime HOLD in current environment · no C04 route / geometry / safety / user-comprehension claim.</text>
</svg>