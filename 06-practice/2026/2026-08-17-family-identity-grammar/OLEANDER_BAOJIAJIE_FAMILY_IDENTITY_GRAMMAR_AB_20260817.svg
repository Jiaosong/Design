<text x="72" y="54" class="m">OLEANDER / BAOJIAJIE / FAMILY IDENTITY TRAINING</text>
<text x="72" y="100" class="h1">系列识别来自共同语法，不是共同模板</text>
<text x="72" y="132" class="b">MIT Media Lab identity → Baojiajie 100×100 mm retail jump-card family calibration</text>
