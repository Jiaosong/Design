<text x="96" y="248" class="b">同一底层网格扩展到 23 个研究组；固定身份与差异化 glyph 同时成立。</text>
<text x="96" y="276" class="s">Pentagram: 2014 identity; same 7×7 grid extended from the Lab mark to 23 research groups.</text>
<text x="930" y="216" class="m">TRANSFER RULE</text>
<text x="930" y="248" class="b">先锁少量不可变关系，再允许 SKU 自己变化。</text>
<text x="930" y="276" class="s">同一版式 ≠ 系列；每张都重新发明 ≠ 系列。</text>
