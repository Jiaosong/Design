<text x="108" y="674" class="s">不同网格 / 不同标题位置 / 不同信息密度 / 不同品牌蓝角色。</text><text x="108" y="704" class="s">统一圆角或字体只能得到组件一致，不能得到家族识别。</text><text x="108" y="760" class="s">FAILURE：遮住产品名后，三张看不出属于同一系统。</text>
