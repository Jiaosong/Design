<line x1="96" y1="960" x2="1824" y2="960" stroke="#BDB6A8" stroke-width="2"/><text x="96" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="300" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">For every lifecycle claim, prove the minimum sufficient context and a locked baseline pair; severity must survive when crop and exposure are held constant.</text><text x="96" y="1045" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Synthetic CMF evidence study only. Does not prove physical stain chemistry, scratch depth, wet friction, PU ageing rate, service life, manufacturing or approval.</text>
