ont-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">0</text><line x1="1050.0" y1="292" x2="1050.0" y2="720" stroke="#e4e4e1" stroke-width="1"/><text x="1050.0" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">10</text><line x1="1145.0" y1="292" x2="1145.0" y2="720" stroke="#e4e4e1" stroke-width="1"/><text x="1145.0" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">20</text><line x1="1240.0" y1="292" x2="1240.0" y2="720" stroke="#e4e4e1" stroke-width="1"/><text x="1240.0" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">30</text><line x1="1335.0" y1="292" x2="1335.0" y2="720" stroke="#e4e4e1" stroke-width="1"/><text x="1335.0" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">40</text><line x1="1430.0" y1="292" x2="1430.0" y2="720" stroke="#e4e4e1" stroke-width="1"/><text x="1430.0" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">50</text><text x="1430" y="250" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">walking time / min</text><text x="800" y="325" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111">SEG A</text><text x="800" y="348" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">● SOURCE-GROUNDED</text><text x="800" y="367" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#777">MEDIUM confidence</text><line x1="1069.0" y1="320" x2="1202.0" y2="320" stroke="#777" stroke-width="9" stroke-linecap="round"/><circle cx="1126.0" cy="320" r="8" fill="#111"/><text x="1214.0" y="325" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">18 [12–26]</text><text x="800" y="430" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111">SEG B</text><text x="800" y="453" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">◆ INFERRED</text><text x="800" y="472" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#777">MEDIUM-LOW confidence</text><line x1="1135.5" y1="425" x2="1325.5" y2="425" stroke="#777" stroke-width="9" stroke-linecap="round" stroke-dasharray="11 6"/><circle cx="1211.5" cy="425" r="8" fill="#111"/><text x="1337.5" y="430" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">27 [19–39]</text><text x="800" y="535" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111">SEG C</text><text x="800" y="558" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">△ ASSUMPTION</text><text x="800" y="577" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#777">LOW confidence</text><line x1="1040.5" y1="530" x2="1183.0" y2="530" stroke="#777" stroke-width="9" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="1097.5" cy="530" r="8" fill="#111"/><text x="1195.0" y="535" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">15 [9–24]</text><text x="800" y="640" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#111">SEG D</text><text x="800" y="663" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">● SOURCE-GROUNDED</text><text x="800" y="682" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#777">MEDIUM confidence</text><line x1="1192.5" y1="635" x2="1411.0" y2="635" stroke="#777" stroke-width="9" stroke-linecap="round"/><circle cx="1278.0" cy="635" r="8" fill="#111"/><text x="1423.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">34 [25–48]</text><text x="955" y="760" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">● source-grounded   ◆ inferred   △ assumption</text><text x="955" y="782" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#777">line style reinforces source class; it does not encode probability.</text><line x1="90" y1="825" x2="1510" y2="825" stroke="#d0d0cc"/><text x="90" y="868" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111">C / TRANSFER RULE</text><text x="90" y="900" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333">RECOMMENDED VALUE ≠ MEASURED VALUE. Use a range when uncertainty could change a decision or comparison.</text><text x="90" y="930" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#666">Evidence class, confidence, unit and FIELD correction state stay adjacent to the visual. Do not hide them in a distant note.</text></svg>