<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f5f3ee"/><rect x="50" y="42" width="1500" height="916" rx="20" fill="#fff" stroke="#222" stroke-width="2"/><text x="90" y="105" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111">OLEANDER / UNCERTAINTY-FIRST SCENARIO CHART CALIBRATION</text><text x="90" y="140" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#666">CALIBRATION DATA — NOT PROJECT DATA · walking-time estimates · minutes · FIELD OPEN</text><text x="90" y="205" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111">A / SINGLE-VALUE FIRST — REJECT</text><text x="90" y="232" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#777">A provisional estimate must not read like a measured scalar.</text><line x1="110" y1="700.0" x2="700" y2="700.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="705.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">0</text><line x1="110" y1="618.0" x2="700" y2="618.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="623.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">10</text><line x1="110" y1="536.0" x2="700" y2="536.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="541.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">20</text><line x1="110" y1="454.0" x2="700" y2="454.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="459.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">30</text><line x1="110" y1="372.0" x2="700" y2="372.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="377.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777">40</text><line x1="110" y1="290.0" x2="700" y2="290.0" stroke="#e4e4e1" stroke-width="1"/><text x="92" y="295.0" text-anchor="en