<text x="862" y="778" class="small">同样的信息被推到边缘，并通过短 relation line 指向景观。</text>
<text x="862" y="808" class="small">第一视觉仍然是完整的山体、水面与开敞方向，而不是 UI 模块。</text>
<line x1="72" y1="890" x2="1528" y2="890" class="line"/>
<text x="72" y="924" class="meta">TRANSFER RULE</text>
<text x="220" y="924" class="body">先定义不可占用的 Primary Recognition Field，再允许解释层进入；“有留白”不等于“主景被保护”。</text>
<text x="72" y="960" class="small">C04 boundary: VISUAL COMPOSITION STUDY ONLY / NOT SITE GEOMETRY / NTS / FIELD OPEN / no new route, platform, railing or structure proposed.</text>
<text x="72" y="986" class="small">STATIC EXPORT EVIDENCE. Exact official R06 pixels are not embedded here; this tests overlay hierarchy only and cannot replace source-locked landscape review.</text>
