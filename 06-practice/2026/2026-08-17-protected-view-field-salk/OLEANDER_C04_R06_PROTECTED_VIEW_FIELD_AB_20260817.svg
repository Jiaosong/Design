<text x="72" y="56" class="meta">OLEANDER / C04 R06 / ARCHITECTURAL COMPOSITION TRANSFER</text>
<text x="72" y="102" class="h1">主景不是“剩余背景”，而是必须被保护的视觉场</text>
<text x="72" y="136" class="body">Salk Institute central plaza → R06 Landscape First / Relation Reveal composition study</text>
<line x1="72" y1="160" x2="1528" y2="160" class="line"/>
<rect x="72" y="184" width="1456" height="112" rx="18" fill="#E8E5DD"/>
<text x="96" y="216" class="meta">VISIBLE FACT — SALK INSTITUTE</text>
<text x="96" y="250" class="body">两翼镜像体量围合一块大尺度铺装中庭；中心细水渠把空场的方向推向太平洋。</text>
<text x="96" y="280" class="small">Official Salk: mirror-image structures flank a grand travertine courtyard.</text>
<text x="908" y="216" class="meta">DESIGN INFERENCE</text>
<text x="908" y="250" class="body">真正有力的“空”需要边界、方向与中心关系共同保护。</text>
<text x="908" y="280" class="small">Transfer: frame the view; do not occupy its recognition field.</text>
