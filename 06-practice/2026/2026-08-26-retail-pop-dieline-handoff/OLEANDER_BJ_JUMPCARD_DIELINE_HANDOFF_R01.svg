<text x="47" y="35" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#003DA7">100</text>
<text x="36" y="55" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="10" font-weight="700" fill="#003DA7">天不发硬</text>
<text x="37" y="70" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="6.5" fill="#303A37">欧科棉黑科技</text>
<rect x="24" y="84" width="40" height="48" rx="4" fill="#E3DDD2" stroke="#999083" stroke-width=".8"/>
<text x="29" y="108" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="5" fill="#666">LOCKED PORTRAIT</text>
<rect x="73" y="91" width="40" height="20" rx="3" fill="#E3DDD2" stroke="#999083" stroke-width=".8"/>
<text x="79" y="103" font-family="Arial,sans-serif" font-size="5" fill="#666">LOCKED LOGO</text>
<rect x="73" y="120" width="40" height="26" rx="3" fill="#D4E2F5"/>
<text x="78" y="135" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="5.5" fill="#174A8B">PRODUCT SLOT</text>
</g>
<text x="708" y="785" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#315D57">ONE BOLD MOVE · 100 不是“贴在卡上”，而是决定上缘 silhouette。</text>
<text x="708" y="812" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">人物 / Logo 只占 locked slot；刀线冲突时改版式，不改母版资产。</text>
<rect x="708" y="846" width="474" height="48" rx="12" fill="#F8F4EC"/>
<text x="728" y="868" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#4F5855">Finished envelope: 140×180 mm · prototype BLEED 3 mm · SAFE 5 mm</text><text x="728" y="886" font-family="Arial,sans-serif" font-size="11.5" fill="#69706D">Supplier / printer confirmation required before production.</text>
<rect x="1260" y="218" width="572" height="724" rx="24" fill="#E0DBD0" stroke="#BDB6A8"/>
<text x="1294" y="266" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">PRODUCTION LAYER SEPARATION</text>
<text x="1294" y="300" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">视觉稿与结构稿在同一个 editable SVG 中分层，不把刀线烘焙进 Artwork。</text>
