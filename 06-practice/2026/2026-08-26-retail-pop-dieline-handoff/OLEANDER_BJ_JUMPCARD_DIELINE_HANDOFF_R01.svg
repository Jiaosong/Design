<text x="1380" y="814" font-size="14" fill="#4F5855">SAFE · critical copy/logo/portrait stay inside</text>
<rect x="1310" y="842" width="55" height="20" fill="#E3DDD2" stroke="#999083"/>
<text x="1380" y="858" font-size="14" fill="#4F5855">LOCKED ASSET SLOT · source bytes replace placeholder</text>
</g>
<text x="1294" y="900" font-family="Arial,sans-serif" font-size="12" fill="#59615F">CUT / BLEED / SAFE / ARTWORK / ASSET-SLOT stay independently editable.</text>
<line x1="88" y1="972" x2="1832" y2="972" stroke="#BDB6A8" stroke-width="2"/>
<text x="88" y="1012" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">SKILL TEST</text>
<text x="244" y="1012" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#59615F">Hide ARTWORK → CUT must still describe the intended silhouette. Hide CUT → the marketing hierarchy must still read. Neither layer may be the other layer's crutch.</text>
<text x="88" y="1047" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">Prototype parameters only. Final material, substrate thickness, die tolerance, spring/adhesive construction, bleed and safe-zone values require supplier proof/sample approval.</text>
