<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F3F0E8"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#5D6461">OLEANDER SKILL TRAINING / RETAIL POP / DIE-CUT HANDOFF</text>
<text x="88" y="126" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#17211E">异形轮廓必须同时服务营销识别与刀模可生产性</text>
<text x="88" y="166" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#68706C">BAOJIAJIE jump-card application · artwork slots only · logo/portrait remain locked source assets · prototype cut 140×180 mm</text>
<rect x="88" y="218" width="548" height="724" rx="24" fill="#E0DBD0" stroke="#BDB6A8"/>
<text x="122" y="266" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#914F3D">A / REJECT · DECORATIVE CLOUD DIE</text>
<text x="122" y="300" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">轮廓只是“不规则”；100、人物和 Logo 与刀模没有结构关系。</text>
<g transform="translate(176,342)">
<path d="M80 30 C110 -8 162 4 176 36 C212 14 255 30 260 64 C303 66 324 102 300 132 C335 158 319 201 282 204 C286 247 245 265 214 241 C190 278 140 270 126 236 C92 258 51 238 58 202 C20 198 7 157 36 135 C3 103 27 59 64 61 C56 48 62 38 80 30Z" fill="#F8F4EC" stroke="#914F3D" stroke-width="3" stroke-dasharray="8 7"/>
<text x="85" y="104" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#173A72">100</text>
<text x="78" y="136" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="23" font-weight="700" fill="#173A72">天不发硬</text>
<rect x="70" y="155" width="166" height="48" rx="10" fill="#D8D3C7"/>
<text x="103" y="185" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#5B625F">人物 / LOGO</text>
</g>
<text x="122" y="710" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#7D4A3A">FAIL · 窄颈与尖凹角随机出现；安全区不可预测；</text>
<text x="122" y="737" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#7D4A3A">文字凸出只是视觉错觉，不能直接转成结构轮廓。</text>
<rect x="122" y="786" width="474" height="108" rx="14" fill="#F8F4EC"/>
<text x="144" y="817" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7D4A3A">PRODUCTION RISK</text>
<text x="144" y="843" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#59615F">CUT 线无法从视觉逻辑推导；品牌资产可能被切线侵入；</text>
<text x="144" y="868" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#59615F">供应商只能重新解释刀模，设计意图在 handoff 处丢失。</text>
<rect x="674" y="218" width="548" height="724" rx="24" fill="#E0DBD0" stroke="#BDB6A8"/>
<text x="708" y="266" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">B / KEEP CANDIDATE · STRUCTURAL CLAIM SILHOUETTE</text>
<text x="708" y="300" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">同一卖点；只改变“轮廓如何承担识别”。100 成为顶部结构 crest。</text>
<g transform="translate(778,350) scale(2.22)">
<path d="M 10,176 L 8,170 L 8,150 L 3,142 L 6,129 L 11,118 L 10,105 L 6,92 L 8,78 L 5,64 L 8,49 L 10,36 L 10,22 L 16,10 L 34,7 L 44,9 L 48,2 L 56,-5 L 65,-8 L 74,-8 L 83,-5 L 91,2 L 96,9 L 106,7 L 124,10 L 130,22 L 130,36 L 132,49 L 135,64 L 132,78 L 134,92 L 130,105 L 131,118 L 136,129 L 139,142 L 132,150 L 132,170 L 130,176 Z" transform="translate(0,8)" fill="#F8F4EC" stroke="#315D57" stroke-width="1.5"/>
