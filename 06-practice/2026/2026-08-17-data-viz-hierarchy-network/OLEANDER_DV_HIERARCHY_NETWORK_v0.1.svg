    <text x="1634" y="642" class="label2">盐水女神峰</text>
    <circle cx="1498" cy="742" r="19" class="nodeR"/>
    <text x="1498" y="742" class="nodeText">R12</text>
    <text x="1460" y="780" class="label2">廪君峰</text>
    <circle cx="1368" cy="720" r="24" class="nodeRet"/>
    <text x="1368" y="720" class="nodeTextInv">R13</text>
    <text x="1258" y="770" class="label" fill="#B35B43">一线天 · CLOSURE / RETURN</text>
    <circle cx="1308" cy="566" r="10" fill="#F3F0E8" stroke="#9AA19D" stroke-width="1.5"/>
    <text x="1308" y="566" class="nodeText" style="font-size:11px">C</text>
    <circle cx="1506" cy="580" r="10" fill="#F3F0E8" stroke="#9AA19D" stroke-width="1.5"/>
    <text x="1506" y="580" class="nodeText" style="font-size:11px">C</text>
    <circle cx="1540" cy="688" r="10" fill="#F3F0E8" stroke="#9AA19D" stroke-width="1.5"/>
    <text x="1540" y="688" class="nodeText" style="font-size:11px">C</text>
    <rect x="1032" y="796" width="236" height="38" rx="19" fill="#4C9693"/>
    <text x="1150" y="821" fill="#F3F0E8" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.0px">SOURCE-TRACED RELATION</text>
    <rect x="1280" y="796" width="244" height="38" rx="19" fill="#F3F0E8" stroke="#8F9793" stroke-width="1.5"/>
    <text x="1402" y="821" class="meta" text-anchor="middle" style="font-size:13px">DIAGRAMMATIC PLACEHOLDER</text>
    <rect x="1536" y="796" width="206" height="38" rx="19" fill="#F3F0E8" stroke="#B35B43" stroke-width="1.5"/>
    <text x="1639" y="821" fill="#B35B43" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.0px">FIELD / SURVEY OPEN</text>
  </g>
  <g id="evidence-strip">
    <line x1="64" y1="964" x2="1856" y2="964" class="hair2"/>
    <text x="64" y="1000" class="cap">EVIDENCE</text>
    <text x="64" y="1032" class="eBody">双第一方导览支持：清江分隔 + 跨江索道 + 南岸分支 / 回环 topology。</text>
    <line x1="702" y1="984" x2="702" y2="1040" class="hair"/>
    <text x="736" y="1000" class="cap">SPATIAL FINDING</text>
    <text x="736" y="1032" class="eBody">路线首先是一张关系网络，不是 13 个点的线性完成序列。</text>
    <line x1="1328" y1="984" x2="1328" y2="1040" class="hair"/>
    <text x="1362" y="1000" class="cap">DESIGN CONSEQUENCE</text>
    <text x="1362" y="1032" class="eBody">阅读可跳过 / 重排 / 关闭；Route / Service / Return 保持完整。</text>
  </g>
  <text x="1856" y="1062" class="meta" text-anchor="end">FIELD OBSERVED=0 · FIELD MEASURED=0 · G1F HOLD · NO_PROMOTION</text>
</svg>
