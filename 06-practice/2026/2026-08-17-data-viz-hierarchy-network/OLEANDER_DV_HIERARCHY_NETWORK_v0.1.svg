    <path d="M1368 720 C1286 720 1220 676 1202 620 C1182 558 1206 514 1246 468 C1204 447 1188 411 1184 362" class="return" marker-end="url(#arrowRust)"/>
    <text x="1236" y="650" class="eTitle" fill="#B35B43">RETURN SPINE</text>
    <text x="1236" y="676" class="eBody">branch junctions → cable return</text>
