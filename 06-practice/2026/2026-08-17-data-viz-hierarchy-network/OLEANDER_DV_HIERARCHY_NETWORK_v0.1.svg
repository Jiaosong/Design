    <text x="829" y="565" class="label2" text-anchor="middle">云坛口 / 服务</text>
    <line x1="829" y1="512" x2="842" y2="440" class="leader"/>
    <rect x="842" y="366" width="96" height="70" rx="14" class="nodeA"/>
