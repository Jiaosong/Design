    <marker id="arrowRust" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B35B43"/></marker>
    <marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#14211F"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1080"/>
  <line x1="64" y1="56" x2="1856" y2="56" class="hair"/>
  <text x="64" y="92" class="cap">OLEANDER · DATA VIZ HIERARCHY LAB / TRANSFER VARIANT</text>
  <text x="1856" y="92" class="meta" text-anchor="end">REVIEW PENDING · RELATIONAL / NTS</text>
  <g id="narrative">
    <text x="70" y="188" class="cap">ROUTE AUTHORITY</text>
    <text x="70" y="264" class="title">两岸—索道—</text>
    <text x="70" y="342" class="title">峰林网络</text>
    <text x="70" y="408" class="subtitle">Route / Service / Return 先读，</text>
    <text x="70" y="448" class="subtitle">可选阅读随后进入。</text>
    <line x1="70" y1="506" x2="520" y2="506" class="hair2"/>
    <text x="70" y="548" class="cap">3-SECOND FIRST READ</text>
    <circle cx="83" cy="592" r="8" class="ink"/>
    <text x="110" y="600" class="label">主干 = 到达 / 越江 / 步行 / 回程</text>
    <text x="110" y="630" class="label2">连续粗线；不由阅读节点控制。</text>
    <circle cx="83" cy="682" r="8" class="teal"/>
    <text x="110" y="690" class="label">内容 = 可选打开 / 跳过 / 关闭</text>
    <text x="110" y="720" class="label2">小节点 + 细支线；保持可见但不抢路线。</text>
    <circle cx="83" cy="772" r="8" class="rust"/>
    <text x="110" y="780" class="label">Return = 始终可识别</text>
    <text x="110" y="810" class="label2">独立回程脊柱；不伪装为唯一游览顺序。</text>
    <rect x="70" y="858" width="500" height="68" rx="34" fill="#14211F"/>
    <text x="320" y="899" fill="#F3F0E8" text-anchor="middle" style="font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:700;letter-spacing:1.1px">NETWORK &gt; LINEAR · RETURN REMAINS COMPLETE</text>
  </g>
