<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style><![CDATA[
      .bg{fill:#F3F0E8}.ink{fill:#14211F}.muted{fill:#67726E}.teal{fill:#4C9693}.rust{fill:#B35B43}.hair{stroke:#C9C9C1;stroke-width:1}.hair2{stroke:#AEB4B0;stroke-width:1.5}
      .route{fill:none;stroke:#14211F;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .branch{fill:none;stroke:#5F6A66;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .cond{fill:none;stroke:#4C9693;stroke-width:4;stroke-dasharray:14 12;stroke-linecap:round}
      .return{fill:none;stroke:#B35B43;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .leader{fill:none;stroke:#808986;stroke-width:1.5}
      .nodeA{fill:#F3F0E8;stroke:#14211F;stroke-width:3}
      .nodeR{fill:#F3F0E8;stroke:#69736F;stroke-width:2}
      .nodeRet{fill:#B35B43;stroke:#B35B43;stroke-width:2}
      .cap{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;fill:#5F6A66}
      .meta{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:16px;font-weight:500;letter-spacing:1px;fill:#67726E}
      .small{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:18px;font-weight:500;fill:#67726E}
      .label{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:20px;font-weight:650;fill:#14211F}
      .label2{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:17px;font-weight:500;fill:#67726E}
      .title{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:72px;font-weight:760;letter-spacing:-2px;fill:#14211F}
      .subtitle{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:30px;font-weight:620;fill:#14211F}
      .bigNum{font-family:Arial,sans-serif;font-size:40px;font-weight:700;fill:#14211F}
      .zone{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;fill:#14211F}
      .eTitle{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:19px;font-weight:700;fill:#14211F}
      .eBody{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:17px;font-weight:500;fill:#5F6A66}
      .nodeText{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:700;fill:#14211F;text-anchor:middle;dominant-baseline:middle}
      .nodeTextInv{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:14px;font-weight:700;fill:#F3F0E8;text-anchor:middle;dominant-baseline:middle}
