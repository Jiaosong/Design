<text x="118" y="842" font-family="Arial" font-size="12" fill="#666">Four equal rectangles create four competing “mains”.</text>
<text x="118" y="866" font-family="Arial" font-size="12" fill="#666">Technical proof is visible, but the landscape is no longer first-read.</text>
