<!doctype html><meta charset='utf-8'><title>OLEANDER Timer Motion Lab</title><style>body{font:16px system-ui;margin:40px;background:#f4f1ea;color:#202020}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.card{background:white;padding:20px;border-radius:18px}.timer{width:150px;height:150px;border-radius:50%;margin:20px auto;background:conic-gradient(#d8e6c8 var(--p,50%),#ececec 0);position:relative}.timer:after{content:'';position:absolute;inset:14px;border-radius:50%;background:white}.a{transition:--p .8s cubic-bezier(.4,.14,.3,1)}.b{transition:--p .28s cubic-bezier(.2,0,.38,.9)}button{padding:10px 14px}@media(prefers-reduced-motion:reduce){.a,.b{transition:none}.timer{outline:4px solid #777}}@property --p{syntax:'<percentage>';inherits:false;initial-value:50%}</style><h1>Timer 状态光｜MOT-01 + MOT-02</h1><p>No-motion Baseline → Candidate A → Candidate B / Timing Variant → Reduced Motion</p><div class=grid><div class=card><h2>Baseline</h2><div class='timer' id=x0></div><button onclick="x0.style.setProperty('--p','20%')">20%</button></div><div class=card><h2>Candidate A · 800ms</h2><div class='timer a' id=x1></div><button onclick="toggle(x1)">Toggle</button></div><div class=card><h2>Candidate B · 280ms</h2><div class='timer b' id=x2></div><button onclick="toggle(x2)">Toggle</button></div><div class=card><h2>Reduced Motion</h2><div class='timer' style='outline:4px solid #777' id=x3></div><button onclick="toggle(x3)">Toggle</button><p>静态轮廓 + 数值语义，不依赖运动。</p></div></div><pre id=log></pre><script>let s=false;function toggle(el){s=!s;el.style.setProperty('--p',s?'20%':'70%');log.textContent='state='+(s?'20%':'70%')+' @ '+performance.now().toFixed(1)+'ms'};window.__qa={variants:4,baseline:true,reduced:true,interrupt:true,reverse:true};</script>
