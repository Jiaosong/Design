<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F2EFE7"/><text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / DESIGN → VALIDATION HANDOFF</text><text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">交接不是把尺寸发出去；要把“为什么必须验证”一起交出去</text><text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic adjustable clamp · design intent only · dimensions are test variables, not engineering approval</text><rect x="88" y="210" width="1744" height="112" rx="18" fill="#DED9CD" stroke="#BDB6A8"/><text x="118" y="244" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#8B5D46">DESIGN QUESTION</text><text x="118" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#29332F">夹持件需要在不遮挡手指抓握区的前提下，容纳不同直径的杆件；设计阶段只确定关系，不自证夹紧力、公差或材料安全。</text><text x="118" y="304" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#59615F">E: hand clearance + variable rod diameter · I: one fixed jaw span may fail · A: 24–32 mm test range · D: adjustable jaw with protected finger zone</text><rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="120" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · DIMENSION-ONLY HANDOFF</text><text x="120" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">“请验证 28 mm”——没有说明行为、变量、失败条件或回传对象。</text><g transform="translate(154,486)"><rect x="0" y="56" width="398" height="54" rx="27" fill="#D8D4CB" stroke="#59615F" stroke-width="3"/><path d="M118 18 H178 V76 H118 Z M238 18 H298 V76 H238 Z" fill="#B9B4A9" stroke="#59615F" stroke-width="3"/><circle cx="208" cy="47" r="28" fill="#F2EFE7" stroke="#8B5D46" stroke-width="3"/><line x1="180" y1="5" x2="236" y2="5" stroke="#914F3D" stroke-width="2"/><line x1="180" y1="-4" x2="180" y2="14" stroke="#914F3D" stroke-width="2"/><line x1="236" y1="-4" x2="236" y2="14" stroke="#914F3D" stroke-width="2"/><text x="188" y="-10" font-family="Arial,sans-serif" font-size="13" fill="#914F3D">28 mm</text></g><rect x="120" y="650" width="486" height="116" rx="12" fill="#F7F3EA"/><text x="140" y="680" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#914F3D">VALIDATOR CAN ONLY ANSWER</text><text x="140" y="706" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">“28 mm 能不能做？”</text><text x="140" y="732" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">即使 PASS，也不知道是否保住手指区、适配范围或原设计关系。</text><text x="120" y="812" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">DELETE 28 mm → handoff 几乎没有剩余设计信息。</text><rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="718" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · RELATION + TEST VARIABLE HANDOFF</text><text x="718" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">设计锁定不变量；验证拥有测试变量。回传结果必须改变同一个设计对象。</text><g transform="translate(748,480)"><rect x="0" y="64" width="472" height="54" rx="27" fill="#D8D4CB" stroke="#59615F" stroke-width="3"/><path d="M126 18 H184 V84 H126 Z M288 18 H346 V84 H288 Z" fill="#B9B4A9" stroke="#59615F" stroke-width="3"/><circle cx="236" cy="52" r="28" fill="#F2EFE7" stroke="#315D57" stroke-width="3"/><path d="M184 30 H288" stroke="#315D57" stroke-width="3" stroke-dasharray="7 5"/><path d="M184 30 l12 -7 v14 z M288 30 l-12 -7 v14 z" fill="#315D57"/><rect x="356" y="48" width="92" height="86" rx="22" fill="none" stroke="#8B5D46" stroke-width="2" stroke-dasharray="7 5"/><text x="362" y="151" font-family="Arial,sans-serif" font-size="10" fill="#8B5D46">FINGER ZONE</text></g><rect x="718" y="650" width="548" height="154" rx="12" fill="#F7F3EA"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5"><text x="738" y="678" font-weight="700" fill="#315D57">LOCKED RELATION</text><text x="866" y="678" fill="#59615F">jaw adjusts without entering finger zone</text><text x="738" y="704" font-weight="700" fill="#315D57">TEST VARIABLE</text><text x="866" y="704" fill="#59615F">rod Ø 24 / 28 / 32 mm (synthetic range)</text><text x="738" y="730" font-weight="700" fill="#315D57">FAIL IF</text><text x="866" y="730" fill="#59615F">interference / no closure / grip zone invasion</text><text x="738" y="756" font-weight="700" fill="#315D57">RETURN</text><text x="866" y="756" fill="#59615F">PASS/REVISE + measured conflict → same master</text><text x="738" y="782" font-weight="700" fill="#315D57">HOLD</text><text x="866" y="782" fill="#59615F">force / tolerance / material / safety not self-certified</text></g><text x="718" y="834" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">ADVERSE ATTACK → Ø32 + hand zone simultaneously.</text><text x="718" y="854" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">Validation tests the relation, not one isolated number.</text><rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="1380" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · PREMATURE ENGINEERING</text><text x="1380" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">设计端把材料、力、公差、螺纹全部“定死”，看似完整却越权。</text><g font-family="Noto Sans CJK SC,Arial,sans-serif"><rect x="1382" y="486" width="418" height="248" rx="14" fill="#F7F3EA"/><text x="1404" y="520" font-size="12" font-weight="700">DESIGN HANDOFF</text><text x="1404" y="550" font-size="12" fill="#59615F">6061-T6 · M6×1.0 · ±0.05 mm</text><text x="1404" y="580" font-size="12" fill="#59615F">clamp force = 420 N</text><text x="1404" y="610" font-size="12" fill="#59615F">wall = 2.2 mm · torque = 5.5 N·m</text><text x="1404" y="650" font-size="12" fill="#7D4A3A">没有 authority / calculation / supplier evidence。</text><text x="1404" y="680" font-size="12" fill="#7D4A3A">技术数字掩盖了真正需要验证的关系。</text></g><text x="1380" y="780" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">NUMBER-OFF TEST → 删除工程数字后，设计意图反而变得不清楚。</text><text x="1380" y="812" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">REPAIR → 技术 owner 决定 proof 方法；设计 owner 只锁行为与不变量。</text><line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">HANDOFF TEST</text><text x="278" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Delete provisional numbers: can VALIDATION still tell what relation must survive, what variable to attack, what counts as failure, and where the result must return?</text><text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no force, material, tolerance, thread, manufacturing, safety or engineering approval is established by this training artifact.</text></svg>