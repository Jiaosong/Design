<text x="24" y="278" class="s" fill="#fff">TRACE / FIELD · SERVICE · REASSURANCE</text>
</g>

<!-- OFF -->
<g transform="translate(1205 220)">
<rect width="315" height="300" rx="14" fill="#6b8780"/>
<path d="M0 220 L66 158 L122 214 L192 142 L252 212 L315 160 V300 H0Z" fill="#4b6963"/>
