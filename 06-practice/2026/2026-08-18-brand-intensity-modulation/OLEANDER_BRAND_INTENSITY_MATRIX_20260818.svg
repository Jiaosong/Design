</g>

<rect x="80" y="565" width="1440" height="168" rx="12" fill="#f7f6f2" stroke="#d2cfc7"/>
<text x="104" y="600" class="k">ROLE CONTRACT</text>
<text x="104" y="635" font-size="13" font-weight="700">FULL</text><text x="170" y="635" class="m">identity-led / communication is the task</text>
<text x="104" y="666" font-size="13" font-weight="700">LIGHT</text><text x="170" y="666" class="m">task-led / identity remains visible but subordinate</text>
<text x="790" y="635" font-size="13" font-weight="700">TRACE</text><text x="862" y="635" class="m">reassurance/service-led / minimal recognisable token</text>
<text x="790" y="666" font-size="13" font-weight="700">OFF</text><text x="862" y="666" class="m">landscape/body/safety/technical attention dominates</text>
<text x="104" y="707" class="s">Consistency comes from stable type, proportion, token geometry, rhythm, material logic and tone — not constant logo loudness.</text>

<line x1="80" y1="800" x2="1520" y2="800" stroke="#d2cfc7"/>
<text x="80" y="842" class="k">DESIGN CRIT</text>
<text x="80" y="876" class="m">REJECT: same lockup / scale / contrast / frequency everywhere. KEEP: medium hierarchy changes while identity grammar remains coherent.</text>
<text x="80" y="910" class="s">TRAINING ONLY / NOT OFFICIAL QINGJIANG LOGO ARTWORK / NO TRADEMARK OR PROJECT BRAND DESIGN PROMOTION.</text>
</svg>