<path d="M58 76 L88 52 L118 76 L148 52 L178 76" fill="none" stroke="#ded8ce" stroke-width="3"/>
<text x="28" y="132" class="c" fill="#fff">清江石书</text>
<text x="28" y="158" class="s" fill="#eef2ef">QINGJIANG STONE BOOK</text>
<text x="24" y="278" class="s" fill="#fff">FULL / COVER · OPENING · COMMUNICATION</text>
</g>

<!-- LIGHT -->
<g transform="translate(455 220)">
