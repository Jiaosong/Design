<style>text{font-family:Arial,sans-serif;fill:#18201d}.h{font-size:28px;font-weight:700}.m{font-size:13px;fill:#68706c}.k{font-size:12px;font-weight:700;letter-spacing:1px;fill:#53635f}.c{font-family:'Noto Serif CJK SC',serif;font-size:30px;font-weight:700}.s{font-size:11px;fill:#5f6864}</style>
<text x="80" y="92" class="h">OLEANDER / BRAND INTENSITY MODULATION</text>
<text x="80" y="126" class="m">FULL · LIGHT · TRACE · OFF / one identity grammar, four attention regimes</text>
<text x="80" y="180" class="k">C04 TRANSFER / MEDIUM STRENGTH FOLLOWS ATTENTION TASK</text>

<!-- FULL -->
<g transform="translate(80 220)">
<rect width="340" height="300" rx="14" fill="#385653"/>
<path d="M0 236 C66 195 130 245 198 204 S285 208 340 170" fill="none" stroke="#83b7b4" stroke-width="46"/>
