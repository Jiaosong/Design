<rect x="24" y="84" width="292" height="62" rx="8" fill="#fff" fill-opacity=".9"/>
<text x="40" y="110" font-size="11" font-weight="700">ROUTE / RETURN FIRST</text>
<text x="40" y="132" font-size="10" fill="#68706c">Identity confirms context; task owns first-read.</text>
<text x="24" y="278" class="s">LIGHT / APP · MAP · CONTENT</text>
</g>

