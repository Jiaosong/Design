<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / SERVICE SYSTEM → SPATIAL CONSEQUENCE</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">服务流程不是后台图；关键状态必须改变空间邻接、门槛与流线</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic equipment-library service · NTS · no real capacity / hygiene / staffing / accessibility claim</text>
<rect x="88" y="208" width="1744" height="116" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="242" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text>
<text x="116" y="270" font-size="14" fill="#29332F">归还物品必须先检查，才能重新进入可借库存。</text>
<text x="116" y="296" font-size="12" fill="#59615F">synthetic process relation</text>
<text x="530" y="242" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text>
<text x="530" y="270" font-size="14" fill="#29332F">归还与借取共用同一服务点，会把“待检查”和“已确认”混在一起。</text>
<text x="1040" y="242" font-size="12" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text>
<text x="1040" y="270" font-size="14" fill="#29332F">高峰同时归还 + 借取；发现损坏物品。</text>
<text x="1460" y="242" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text>
<text x="1460" y="270" font-size="14" fill="#29332F">把 triage 前置；待检/异常与 clean stock 分区。</text>
</g>
<rect x="88" y="352" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · SINGLE SERVICE COUNTER</text>
<text x="120" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">借取、归还、检查都压在同一柜台；流程存在，空间不承认状态差异。</text>
<text x="120" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / LABEL-OFF TEST</text>
