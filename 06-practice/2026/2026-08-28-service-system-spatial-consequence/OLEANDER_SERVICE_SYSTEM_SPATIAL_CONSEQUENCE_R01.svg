<text x="718" y="768" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">PEAK ATTACK → pickup 与 return 在入口后即分离，检查不占用借取路径。</text>
<text x="718" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">TRIAGE DELETION → 删除前置 triage 后，异常品再次获得进入 clean stock 的路径。</text>
<rect x="718" y="830" width="548" height="46" rx="10" fill="#F7F3EA"/>
<text x="738" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">CONSEQUENCE · service truth changes adjacency, threshold and path ownership.</text>
