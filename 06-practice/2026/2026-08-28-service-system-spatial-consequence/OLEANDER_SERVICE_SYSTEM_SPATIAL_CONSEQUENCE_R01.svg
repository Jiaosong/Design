<text x="718" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · TRIAGE → VERIFY → CLEAN STOCK</text>
<text x="718" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">状态关系直接生成空间序列；借取绕过待检区，异常物品不穿越 clean stock。</text>
