<text x="1380" y="768" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">SIGNAGE-OFF → 一切回到 A；服务逻辑没有进入空间。</text>
<text x="1380" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">STAFF-CROSSING → 检查动作仍在用户主路径上。</text>
<rect x="1380" y="830" width="420" height="46" rx="10" fill="#F7F3EA"/>
<text x="1400" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">REPAIR · move the state boundary, not only the sign.</text>
