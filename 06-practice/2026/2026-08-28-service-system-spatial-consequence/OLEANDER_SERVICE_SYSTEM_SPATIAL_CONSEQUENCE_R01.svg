<text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text>
<text x="290" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Remove labels and service prose: if “returned / unchecked / verified clean” states cannot still be inferred from adjacency and path ownership, the system has not become spatial design.</text>
<text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no real hygiene protocol, staffing model, inventory rule, queue capacity, accessibility, safety or architecture is proven.</text>
