<text x="120" y="768" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">PEAK ATTACK → 两股用户流与员工检查同时占用同一前台。</text>
<text x="120" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">DAMAGED ITEM → 异常物品没有空间状态，只能靠口头/标签区分。</text>
<rect x="120" y="830" width="484" height="46" rx="10" fill="#F7F3EA"/>
<text x="140" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">ROOT · service states exist in prose, not in adjacency.</text>
