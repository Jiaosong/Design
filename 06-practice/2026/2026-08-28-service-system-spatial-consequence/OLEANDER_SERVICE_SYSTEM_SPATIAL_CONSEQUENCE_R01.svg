<text x="1380" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · SIGNAGE-ONLY SPLIT</text>
<text x="1380" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">增加“借取 / 归还”标识，但柜台、库存和检查邻接完全不变。</text>
