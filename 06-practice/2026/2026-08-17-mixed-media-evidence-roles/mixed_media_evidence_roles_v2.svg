<text x="92" y="1002" font-family="Arial" font-size="13" font-weight="700">ROLE RULE /</text>
<text x="188" y="1002" font-family="Arial" font-size="13" fill="#333">Landscape proves experience; model proves relation; node proves support. A derivative must not silently replace its authority source.</text>
