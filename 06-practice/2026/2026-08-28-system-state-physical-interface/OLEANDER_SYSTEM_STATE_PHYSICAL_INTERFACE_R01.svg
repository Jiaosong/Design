<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / SYSTEM STATE → PHYSICAL INTERFACE CONSEQUENCE</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">状态不能只换灯色；它必须改变“能否插入、能否取出、能否误操作”</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic shared-tool dock · NTS · no real mechanism / electrical / safety / accessibility validation</text>
<rect x="88" y="210" width="1744" height="112" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="244" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text><text x="116" y="272" font-size="14" fill="#29332F">归还未检、已验证可借、异常隔离是三种不同 service truth。</text>
<text x="520" y="244" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text><text x="520" y="272" font-size="14" fill="#29332F">若三种状态共用同一 dock affordance，用户会把“亮灯”误当作唯一规则。</text>
<text x="1080" y="244" font-size="12" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text><text x="1080" y="272" font-size="14" fill="#29332F">低光 / 色弱 / 断电 / 忙碌时误插异常工具。</text>
<text x="1490" y="244" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1490" y="272" font-size="14" fill="#29332F">把状态翻译成不同插入/取出路径与机械许可。</text>
</g>
<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · SAME DOCK, DIFFERENT LED</text>
<text x="120" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">三个槽口完全相同；状态只靠绿/黄/红灯解释。</text>
<g transform="translate(140,482)"><rect x="0" y="0" width="430" height="218" rx="28" fill="#E6E2D9" stroke="#5D6662" stroke-width="3"/>
<rect x="34" y="58" width="96" height="112" rx="16" fill="#F7F3EA" stroke="#646C68" stroke-width="3"/><rect x="167" y="58" width="96" height="112" rx="16" fill="#F7F3EA" stroke="#646C68" stroke-width="3"/><rect x="300" y="58" width="96" height="112" rx="16" fill="#F7F3EA" stroke="#646C68" stroke-width="3"/>
<circle cx="82" cy="34" r="12" fill="#A7BBA4"/><circle cx="215" cy="34" r="12" fill="#C7A454"/><circle cx="348" cy="34" r="12" fill="#B36A5A"/>
<path d="M58 92 H106 V154 H58 Z M191 92 H239 V154 H191 Z M324 92 H372 V154 H324 Z" fill="#C8C3B9" stroke="#6A716D" stroke-width="2"/></g>
<text x="120" y="742" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">COLOR-OFF → 三种状态完全同义。</text><text x="120" y="770" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">POWER-OFF → 用户仍可把任何工具插进任何槽。</text><text x="120" y="798" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">MISDOCK → 异常工具可直接进入“READY”槽。</text>
<rect x="120" y="832" width="484" height="46" rx="10" fill="#F7F3EA"/><text x="140" y="860" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">ROOT · status display replaced interaction permission.</text>
<rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="718" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · STATE-BOUND MECHANICAL PERMISSION</text>
<text x="718" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">Return、Ready、Quarantine 用不同入口/锁止/取出逻辑；灯色只做补充。</text>
<g transform="translate(734,474)"><rect x="0" y="0" width="516" height="238" rx="28" fill="#E6E2D9" stroke="#5D6662" stroke-width="3"/>
<rect x="28" y="54" width="132" height="140" rx="18" fill="#F7F3EA" stroke="#8B5D46" stroke-width="3"/><path d="M48 84 H140 L125 104 H63 Z" fill="#D9D3C8" stroke="#6B726E" stroke-width="2"/><path d="M62 132 H126" stroke="#8B5D46" stroke-width="4"/><path d="M126 132 l-12 -8 v16 z" fill="#8B5D46"/><rect x="63" y="148" width="62" height="26" rx="8" fill="#D9D3C8"/><text x="54" y="36" font-family="Arial,sans-serif" font-size="10.5" fill="#8B5D46">RETURN IN</text>
<rect x="192" y="54" width="132" height="140" rx="18" fill="#F7F3EA" stroke="#315D57" stroke-width="3"/><path d="M215 92 H301 V166 H215 Z" fill="#D9D3C8" stroke="#6B726E" stroke-width="2"/><rect x="236" y="68" width="44" height="12" rx="6" fill="#315D57"/><path d="M236 130 H280" stroke="#315D57" stroke-width="4"/><path d="M236 130 l12 -8 v16 z" fill="#315D57"/><text x="212" y="36" font-family="Arial,sans-serif" font-size="10.5" fill="#315D57">VERIFIED OUT</text>
<rect x="356" y="54" width="132" height="140" rx="18" fill="#F7F3EA" stroke="#914F3D" stroke-width="3"/><path d="M379 92 H465 V166 H379 Z" fill="#D9D3C8" stroke="#6B726E" stroke-width="2"/><rect x="394" y="112" width="56" height="30" rx="6" fill="#6F7773"/><path d="M397 115 L447 139 M447 115 L397 139" stroke="#F7F3EA" stroke-width="3"/><text x="382" y="36" font-family="Arial,sans-serif" font-size="10.5" fill="#914F3D">QUARANTINE</text>
<rect x="170" y="62" width="6" height="124" rx="3" fill="#B8B1A5"/><rect x="334" y="62" width="6" height="124" rx="3" fill="#B8B1A5"/><text x="166" y="214" font-family="Arial,sans-serif" font-size="8.5" fill="#69716D">SEPARATE PERMISSION ZONES</text></g>
<text x="718" y="742" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">COLOR-OFF → 入口形态、箭头与锁止仍区分三种许可。</text><text x="718" y="770" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">POWER-OFF → READY 取出需独立 unlock；QUARANTINE 仍不可用户取出。</text><text x="718" y="798" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">MISDOCK → Return intake 的单向 mouth 不等于 release cradle。</text>
<rect x="718" y="832" width="548" height="46" rx="10" fill="#F7F3EA"/><text x="738" y="860" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">CONSEQUENCE · truth state changes physical affordance and permission.</text>
<rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1380" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · SCREEN-GUIDED UNIVERSAL SLOT</text>
<text x="1380" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">一个万能槽 + 屏幕提示；逻辑清楚，但物理层仍允许错误动作。</text>
<g transform="translate(1390,482)"><rect x="0" y="0" width="390" height="218" rx="28" fill="#E6E2D9" stroke="#5D6662" stroke-width="3"/><rect x="34" y="42" width="132" height="134" rx="18" fill="#F7F3EA" stroke="#646C68" stroke-width="3"/><path d="M58 82 H142 V156 H58 Z" fill="#D9D3C8" stroke="#6B726E" stroke-width="2"/><rect x="198" y="42" width="154" height="92" rx="12" fill="#26312E"/><text x="218" y="72" font-family="Arial,sans-serif" font-size="10.5" fill="#fff">STATE:</text><text x="218" y="98" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#F4CC67">RETURN / CHECK</text><text x="218" y="121" font-family="Arial,sans-serif" font-size="10.5" fill="#fff">Follow screen instruction</text></g>
<text x="1380" y="742" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">SCREEN-OFF → universal slot 没有状态差异。</text><text x="1380" y="770" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">RUSH ATTACK → 用户可以在阅读提示前完成错误插入。</text><text x="1380" y="798" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">REPAIR → screen 可解释，但必须由物理 permission 先阻断错误动作。</text>
<rect x="1380" y="832" width="420" height="46" rx="10" fill="#F7F3EA"/><text x="1400" y="860" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">displayed state ≠ enforced state.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="290" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Turn off color and screens: can the physical interface still prevent “unchecked/damaged” from behaving like “verified ready”?</text>
<text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no real lock mechanism, sensor, force, electrical safety, durability, accessibility, maintenance or manufacturing is validated.</text>
</svg>