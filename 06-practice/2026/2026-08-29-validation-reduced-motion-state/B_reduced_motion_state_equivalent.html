<!doctype html><meta charset="utf-8"><title>Reduced Motion State Equivalence</title><style>body{font-family:sans-serif;margin:40px}.panel{width:220px;height:80px;background:#ddd;transform:translateX(-40px);animation:enter 300ms forwards}@keyframes enter{to{transform:translateX(0)}}@media (prefers-reduced-motion: reduce){.panel{animation:none;transform:none}}</style><button id="go">Start</button><div id="status" aria-live="polite">idle</div><div id="panel" class="panel" hidden>Ready panel</div><script>const go=document.querySelector('#go'), panel=document.querySelector('#panel'), status=document.querySelector('#status');
function commitReady(){ status.textContent='ready'; }
go.addEventListener('click',()=>{panel.hidden=false; status.textContent='loading'; panel.classList.remove('panel'); void panel.offsetWidth; panel.classList.add('panel'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; if(reduce){commitReady();} else {panel.addEventListener('animationend',commitReady,{once:true});}});</script>
