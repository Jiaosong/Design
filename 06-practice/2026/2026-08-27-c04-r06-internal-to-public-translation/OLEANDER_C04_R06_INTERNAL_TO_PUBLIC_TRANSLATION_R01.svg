<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F1EEE6"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#5B625F">OLEANDER DESIGN / C04 R06 / INTERNAL → PUBLIC TRANSLATION</text>
<text x="88" y="126" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">把“设计过程语言”还原成游客真正遇到的对象、动作和关系</text>
<text x="88" y="166" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#68706D">Current authority: Landscape First · SEE → STOP → RECOVER → READ · R06 spatial geometry not reopened · FIELD OPEN</text>
<rect x="88" y="212" width="1744" height="116" rx="18" fill="#DDD8CC" stroke="#BDB6A8"/>
<text x="118" y="246" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="700" fill="#2F3A36">SOURCE / CURRENT DECISIONS</text>
<text x="118" y="278" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#4F5855">真实景观第一阅读 · 人先停下再读 · 解释可选 · R06 Body/Audience 保留 · 实景图槽仍服从 Current source ownership</text>
<text x="118" y="304" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#707773">Evidence: CH12 Current Material / Decision: public page may restructure language, but may not invent a new R06 location, platform geometry or site-photo claim.</text>
<rect x="88" y="354" width="826" height="594" rx="24" fill="#DDD8CC" stroke="#BDB6A8"/>
<text x="122" y="400" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#914F3D">A / REJECT · INTERNAL PROCESS EXPOSED</text>
<text x="122" y="432" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">方法、状态与工作流成为第一视觉；项目名换掉后仍能套在任何“体验设计”上。</text>
<rect x="122" y="466" width="758" height="354" rx="16" fill="#F7F3EA"/>
<text x="152" y="516" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#66706C">CH12-P03 / R06 LANDSCAPE FIRST / EXPERIENCE SYSTEM</text>
<text x="152" y="566" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#27312E">基于游客行为与空间关系分析，</text>
<text x="152" y="606" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#27312E">构建分层的沉浸式阅读体验。</text>
<text x="152" y="654" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">通过 Landscape First → Relation Reveal → Optional Deep Read 的系统性路径，</text>
<text x="152" y="682" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">让用户在不同阅读深度之间自由切换，并形成更完整的场景叙事。</text>
<rect x="152" y="724" width="226" height="44" rx="11" fill="#D6D0C5"/>
<text x="176" y="752" font-family="Arial,sans-serif" font-size="12" fill="#4F5855">EVIDENCE / INFERENCE / DECISION</text>
<rect x="398" y="724" width="214" height="44" rx="11" fill="#D6D0C5"/>
<text x="435" y="752" font-family="Arial,sans-serif" font-size="12" fill="#4F5855">S0 / S1 / S2 · G3 · HOLD</text>
<text x="122" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#7D4A3A">Project Specificity Swap Test = FAIL · “清江 / R06”删掉后仍是通用体验项目文案。</text>
<text x="122" y="888" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#7D4A3A">First read = 方法名，而不是河谷、停留和观看关系。</text>
<rect x="946" y="354" width="886" height="594" rx="24" fill="#DDD8CC" stroke="#BDB6A8"/>
<text x="980" y="400" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">B / KEEP CANDIDATE · OBJECT → ACTION → RELATION</text>
<text x="980" y="432" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">内部证据不删除；对外只留下游客需要理解的对象、动作、条件和结果。</text>
<rect x="980" y="466" width="818" height="354" rx="16" fill="#CFC8BB"/>
<path d="M980 696 C1105 548 1220 546 1318 612 C1410 672 1512 566 1600 540 C1680 518 1740 548 1798 520 L1798 820 L980 820 Z" fill="#AFA99D"/>
<path d="M980 742 C1122 680 1252 690 1378 734 C1492 775 1640 754 1798 704 L1798 820 L980 820 Z" fill="#8E9E96"/>
<path d="M1000 772 C1145 732 1284 742 1416 778 C1540 812 1670 798 1782 760" fill="none" stroke="#5C9498" stroke-width="34" stroke-linecap="round"/>
<path d="M1030 670 C1175 596 1300 606 1410 640 C1516 673 1626 650 1745 594" fill="none" stroke="#EAE4D8" stroke-width="10" stroke-linecap="round"/>
<circle cx="1450" cy="646" r="15" fill="#8B5D46"/>
<rect x="1010" y="488" width="484" height="164" rx="16" fill="#F7F3EA" opacity=".94"/>
<text x="1036" y="526" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" letter-spacing="1.5" fill="#59615F">清江 · 河谷观察</text>
<text x="1036" y="568" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#27312E">停下来，看清江在两岸峰体之间</text>
<text x="1036" y="606" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#27312E">向前延伸。</text>
<text x="1036" y="638" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#4F5855">先看水面、峰体和脚下路径。愿意继续读时，再展开解释。</text>
<rect x="980" y="842" width="818" height="72" rx="14" fill="#F7F3EA"/>
<text x="1004" y="870" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" font-weight="700" fill="#315D57">OBSERVED RELATION → DESIGN CONSEQUENCE</text>
<text x="1004" y="897" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#59615F">景观是第一阅读 → 页面先给完整景观；解释可选 → 说明进入次级层；身体恢复先于深读 → 不把长说明压在第一屏。</text>
<line x1="88" y1="984" x2="1832" y2="984" stroke="#BDB6A8" stroke-width="2"/>
<text x="88" y="1024" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#18211F">TRANSFER RULE</text>
<text x="250" y="1024" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Public page keeps evidence boundaries, but internal method/status language stays backstage unless it changes what the visitor must understand or do.</text>
</svg>