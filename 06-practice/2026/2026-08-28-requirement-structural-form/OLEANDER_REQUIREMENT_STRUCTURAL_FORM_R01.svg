<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / REQUIREMENT → STRUCTURAL FORM</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">“可折叠”不是造型特征；折叠状态必须保留一条可信的受力与锁止关系</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic carry-handle study · NTS · conceptual load path only · no engineering / force / fatigue validation</text>
<rect x="88" y="208" width="1744" height="116" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="116" y="242" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text><text x="116" y="270" font-size="14" fill="#29332F">手柄需要收纳变薄，同时在展开时承担向上的提拉。</text><text x="512" y="242" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text><text x="512" y="270" font-size="14" fill="#29332F">若折叠只改变外形、不改变支撑/锁止关系，展开状态可能只有“看起来可提”。</text><text x="1082" y="242" font-size="12" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text><text x="1082" y="270" font-size="14" fill="#29332F">单侧提拉 / 未完全展开 / 锁止缺失。</text><text x="1490" y="242" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1490" y="270" font-size="14" fill="#29332F">先画 load path + stop，再决定壳体造型。</text></g>
<rect x="88" y="352" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="120" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · FOLDING AS SILHOUETTE</text><text x="120" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">两个转轴让手柄“能折”，但展开后没有明确 stop / compression seat。</text>
<g transform="translate(138,486)"><rect x="20" y="142" width="410" height="74" rx="28" fill="#E7E3DA" stroke="#5D6662" stroke-width="3"/><circle cx="92" cy="142" r="15" fill="#F7F3EA" stroke="#914F3D" stroke-width="3"/><circle cx="358" cy="142" r="15" fill="#F7F3EA" stroke="#914F3D" stroke-width="3"/><path d="M92 142 L160 54 H290 L358 142" fill="none" stroke="#777E7A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 28 V82" stroke="#914F3D" stroke-width="5"/><path d="M225 82 l-9 -14 h18 z" fill="#914F3D"/><text x="248" y="45" font-family="Arial,sans-serif" font-size="10.5" fill="#914F3D">LOAD</text><path d="M92 142 L72 176 M358 142 L378 176" stroke="#914F3D" stroke-width="3" stroke-dasharray="6 5"/></g>
<text x="120" y="744" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">LOCK-DELETION → 图形几乎不变，说明 lock 从未真正进入 form logic。</text><text x="120" y="772" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">ONE-SIDE LOAD → 受力只能通过 pivot “猜测”传递。</text><rect x="120" y="824" width="484" height="52" rx="10" fill="#F7F3EA"/><text x="140" y="855" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">ROOT · motion geometry exists; support geometry does not.</text>
<rect x="686" y="352" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="718" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · PIVOT + STOP + SEAT</text><text x="718" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">转轴负责运动；stop 决定展开角；seat 把提拉关系落到壳体支撑区。</text>
<g transform="translate(732,474)"><rect x="16" y="158" width="492" height="76" rx="28" fill="#E7E3DA" stroke="#5D6662" stroke-width="3"/><path d="M70 158 h64 l-18 28 H88 Z M390 158 h64 l-18 28 H408 Z" fill="#CFC9BD" stroke="#315D57" stroke-width="2.5"/><circle cx="108" cy="150" r="16" fill="#F7F3EA" stroke="#315D57" stroke-width="3"/><circle cx="416" cy="150" r="16" fill="#F7F3EA" stroke="#315D57" stroke-width="3"/><path d="M108 150 L180 50 H344 L416 150" fill="none" stroke="#737B76" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 142 l22 12 -14 22 -22 -12 z M398 142 l-22 12 14 22 22 -12 z" fill="#315D57"/><path d="M262 22 V54" stroke="#8B5D46" stroke-width="5"/><path d="M262 54 l-9 -14 h18 z" fill="#8B5D46"/><path d="M180 62 C160 90 142 122 120 154" fill="none" stroke="#8B5D46" stroke-width="3.5" stroke-dasharray="7 5"/><path d="M344 62 C364 90 382 122 404 154" fill="none" stroke="#8B5D46" stroke-width="3.5" stroke-dasharray="7 5"/><path d="M116 182 V218 M408 182 V218" stroke="#8B5D46" stroke-width="3.5" stroke-dasharray="7 5"/><text x="276" y="35" font-family="Arial,sans-serif" font-size="10.5" fill="#8B5D46">CONCEPTUAL LOAD PATH</text></g>
<text x="718" y="744" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">LOCK-DELETION → 删除 stop 后，展开角与 seat 接触关系立即失去。</text><text x="718" y="772" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">ONE-SIDE LOAD → 非对称风险可见，需交给 Validation 做真实结构证明。</text><rect x="718" y="824" width="548" height="52" rx="10" fill="#F7F3EA"/><text x="738" y="855" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">FORM PROOF · motion role and support role are visibly different.</text>
<rect x="1348" y="352" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="1380" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · OVERBUILT BRIDGE</text><text x="1380" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">支撑关系清楚，但为了“看起来稳”加入连续厚桥，破坏折叠与握持。</text><g transform="translate(1390,494)"><rect x="10" y="142" width="390" height="74" rx="28" fill="#E7E3DA" stroke="#5D6662" stroke-width="3"/><path d="M78 142 L142 62 H268 L332 142" fill="none" stroke="#737B76" stroke-width="22" stroke-linecap="round"/><rect x="90" y="106" width="230" height="62" rx="20" fill="#8D9690" stroke="#59615F" stroke-width="3"/><circle cx="78" cy="142" r="15" fill="#F7F3EA" stroke="#315D57" stroke-width="3"/><circle cx="332" cy="142" r="15" fill="#F7F3EA" stroke="#315D57" stroke-width="3"/></g><text x="1380" y="744" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">FOLD ATTACK → 连续桥阻断收纳。</text><text x="1380" y="772" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">GRIP DELETION → 支撑构件侵入手部净空。</text><rect x="1380" y="824" width="420" height="52" rx="10" fill="#F7F3EA"/><text x="1400" y="855" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">REPAIR · prove support without cancelling the requirement.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="290" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Delete the lock/stop geometry: if the expanded load relationship still looks equally “resolved,” the structure was never part of the design reasoning.</text><text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · conceptual load path only. Hinge stress, pin size, material, fatigue, pinch safety, force, tolerance and manufacturing require VALIDATION.</text></svg>