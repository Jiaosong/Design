<text x="860" y="794" class="s">Figure count is unchanged, but each body now connects to route, sightline or service interface.</text>
<line x1="72" y1="878" x2="1528" y2="878" stroke="#BDC2BC"/>
<text x="72" y="912" class="m">HUMAN-SCALE EVIDENCE GATE</text>
<text x="72" y="946" class="b">If hiding the figures removes only size perception, the figures are under-performing. They should also carry action, flow, pause or maintenance evidence.</text>
<text x="72" y="980" class="s">RELATIONAL TRAINING / NOT SITE GEOMETRY / NTS / FIELD OPEN. No new C04 dimensions, route or structural claim.</text>
