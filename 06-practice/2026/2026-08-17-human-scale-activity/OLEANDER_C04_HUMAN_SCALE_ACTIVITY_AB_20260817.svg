<text x="72" y="54" class="m">OLEANDER / C04 / TECHNICAL DRAWING TRAINING</text>
<text x="72" y="100" class="h1">Human figures must explain use, not only scale</text>
<text x="72" y="132" class="b">Lina Bo Bardi / SESC Pompeia sections → C04 section communication transfer</text>
<line x1="72" y1="158" x2="1528" y2="158" stroke="#BDC2BC"/>
<rect x="72" y="184" width="1456" height="108" rx="18" fill="#E8E5DD"/>
<text x="96" y="216" class="m">VISIBLE FACT — SESC POMPEIA / 1977 DRAWINGS</text>
<text x="96" y="248" class="b">Original sections and interior perspectives place people on ramps, platforms and activity spaces.</text>
<text x="96" y="276" class="s">Instituto Bardi archive lists multiple 1977 sections, interior perspectives and a flow diagram.</text>
<text x="930" y="216" class="m">TRANSFER RULE</text>
<text x="930" y="248" class="b">A scale figure should carry body-action-space evidence first.</text>
<text x="930" y="276" class="s">A standing silhouette that explains no action is weak evidence even when its height is correct.</text>
<text x="84" y="344" class="m">A — SCALE STICKERS / REVISE</text>
<rect x="72" y="366" width="700" height="466" rx="24" class="p"/>
<text x="102" y="405" class="h2">Correct scale, no behavioral information</text>
<path d="M118 710 L235 710 L310 620 L450 620 L530 520 L700 520" class="surf"/>
<path d="M118 715 L118 770 L700 770 L700 525" class="cut"/>
<path d="M325 744 C380 720 430 735 500 720 C560 708 620 720 690 704 L690 766 L325 766Z" class="water"/>
