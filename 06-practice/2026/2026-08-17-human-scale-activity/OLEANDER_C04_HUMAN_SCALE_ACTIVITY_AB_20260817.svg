</g>
<text x="102" y="794" class="s">Looks professional, but the figures explain neither movement, stopping, viewing nor maintenance.</text>
<text x="842" y="344" class="m">B — ACTIVITY-BEARING SCALE / PROPOSED</text>
<rect x="830" y="366" width="698" height="466" rx="24" class="p"/>
<text x="860" y="405" class="h2">Same geometry; figures carry MOVE / OBSERVE / MAINTAIN</text>
