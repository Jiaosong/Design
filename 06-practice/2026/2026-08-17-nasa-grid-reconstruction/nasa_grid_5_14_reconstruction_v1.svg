<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="1478" viewBox="0 0 1048 1478">
<rect width="1048" height="1478" fill="#ffffff"/>
<g font-family="Nimbus Sans, Helvetica, Arial, sans-serif" fill="#111111">
  <text x="46" y="86" font-size="18" font-weight="700">The Grid—What it is</text>
  <text x="365" y="84" font-size="17"><tspan x="365" dy="0">A grid is a predetermined understruc-</tspan><tspan x="365" dy="20">ture which the designer can employ</tspan><tspan x="365" dy="20">to give a publication cohesive style</tspan><tspan x="365" dy="20">and character. It is a great organizer</tspan><tspan x="365" dy="20">of material and as such will save</tspan><tspan x="365" dy="20">countless man hours in execution. It</tspan><tspan x="365" dy="20">will also help bring continuity to var-</tspan><tspan x="365" dy="20">ious diverse publications.</tspan></text>
  <text x="687" y="84" font-size="17"><tspan x="687" dy="0">There are a multitude of grids which</tspan><tspan x="687" dy="20">can be developed and used by the</tspan><tspan x="687" dy="20">designer. In the illustration below we</tspan><tspan x="687" dy="20">explore the rudiments of a grid and</tspan><tspan x="687" dy="20">its application to a hypothetical pub-</tspan><tspan x="687" dy="20">lication.</tspan></text>
  <text x="46" y="405" font-size="17"><tspan x="46" dy="0">1. Starting with the overall size of the</tspan><tspan x="46" dy="20">publication, a designer analyzes the</tspan><tspan x="46" dy="20">type of information, photographs, cap-</tspan><tspan x="46" dy="20">tions, etc. which are required.</tspan></text>
  <text x="46" y="758" font-size="17"><tspan x="46" dy="0">2. The grid is applied to the double-</tspan><tspan x="46" dy="20">spread—it will determine all margins,</tspan><tspan x="46" dy="20">gutters, folio placement, etc. In this</tspan><tspan x="46" dy="20">case a 2-column grid is demonstrated.</tspan></text>
  <text x="46" y="1110" font-size="17"><tspan x="46" dy="0">3. The designer can now begin to</tspan><tspan x="46" dy="20">block in the various elements such as</tspan><tspan x="46" dy="20">headlines, columns of text typogra-</tspan><tspan x="46" dy="20">phy, photographs, captions and folios.</tspan><tspan x="46" dy="20">This approach can be applied to the</tspan><tspan x="46" dy="20">entire publication, including its cover.</tspan><tspan x="46" dy="20">(Folio placement should always be</tspan><tspan x="46" dy="20">in the outside margins.)</tspan></text>
</g>
