<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="70" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#5B625F">OLEANDER TRAINING / DESIGN PROCESS / CAUSAL RELATION SPINE</text>
<text x="88" y="126" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="47" font-weight="700" fill="#18211F">证据不是卡片集合：Finding 必须改变一个明确的 Design Lever</text>
<text x="88" y="168" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">Synthetic site-service threshold · TRAINING INPUT ONLY · NTS · no project / field truth claimed</text>
<rect x="88" y="220" width="566" height="690" rx="24" fill="#DED9CD" stroke="#BDB6A8" stroke-width="2"/>
<text x="122" y="268" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#934F3D">A / REJECT · EQUAL-CARD GRAMMAR</text>
<text x="122" y="302" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">Evidence、Finding、Consequence 全部做成等权卡片；箭头表示“有关”，但不证明依赖。</text>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<rect x="122" y="350" width="218" height="118" rx="15" fill="#F7F3EA"/><text x="142" y="380" font-size="12" font-weight="700" fill="#315D57">E1 · MOVEMENT</text><text x="142" y="410" font-size="14" fill="#29332F">通行线穿过入口阈值</text><text x="142" y="438" font-size="12" fill="#69706D">TRAINING SYNTHETIC</text>
<rect x="366" y="350" width="218" height="118" rx="15" fill="#F7F3EA"/><text x="386" y="380" font-size="12" font-weight="700" fill="#315D57">E2 · DWELL</text><text x="386" y="410" font-size="14" fill="#29332F">阅读需要停留</text><text x="386" y="438" font-size="12" fill="#69706D">TRAINING SYNTHETIC</text>
<rect x="122" y="502" width="218" height="118" rx="15" fill="#F7F3EA"/><text x="142" y="532" font-size="12" font-weight="700" fill="#315D57">E3 · RETURN</text><text x="142" y="562" font-size="14" fill="#29332F">回程必须连续可见</text><text x="142" y="590" font-size="12" fill="#69706D">DESIGN CONSTRAINT</text>
<rect x="366" y="502" width="218" height="118" rx="15" fill="#F7F3EA"/><text x="386" y="532" font-size="12" font-weight="700" fill="#8A5F45">F · FINDING</text><text x="386" y="562" font-size="14" fill="#29332F">阈值存在冲突</text><text x="386" y="590" font-size="12" fill="#69706D">但冲突发生在哪？</text>
<rect x="244" y="670" width="218" height="118" rx="15" fill="#F7F3EA" stroke="#934F3D" stroke-width="2"/><text x="264" y="700" font-size="12" font-weight="700" fill="#934F3D">D · CONSEQUENCE</text><text x="264" y="730" font-size="14" fill="#29332F">增加一个停留节点</text><text x="264" y="758" font-size="12" fill="#69706D">位置 / 方向 / 关系不确定</text>
<path d="M230 468 C250 510 300 535 366 555" fill="none" stroke="#999083" stroke-width="2"/><path d="M475 468 C475 485 475 490 475 502" fill="none" stroke="#999083" stroke-width="2"/><path d="M340 561 C355 561 360 561 366 561" fill="none" stroke="#999083" stroke-width="2"/><path d="M475 620 C470 650 440 670 410 690" fill="none" stroke="#999083" stroke-width="2"/><path d="M230 620 C235 655 275 680 305 695" fill="none" stroke="#999083" stroke-width="2"/>
</g>
<rect x="122" y="818" width="462" height="58" rx="12" fill="#F7F3EA"/><text x="142" y="843" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">FAIL · 删除 E2 后 D 仍然“看起来成立” → 因果链其实是排版关系。</text><text x="142" y="863" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#69706D">equal cards flatten dependency into co-occurrence.</text>
<rect x="690" y="220" width="744" height="690" rx="24" fill="#DED9CD" stroke="#BDB6A8" stroke-width="2"/>
<text x="724" y="268" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">B / KEEP CANDIDATE · CAUSAL RELATION SPINE</text><text x="724" y="302" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#59615F">先画对象与关系，再把 Evidence 挂到关系上；Finding 指向可被改变的 Design Lever。</text>
<rect x="724" y="342" width="676" height="420" rx="18" fill="#F7F3EA"/><text x="746" y="373" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#4F5855">SYNTHETIC THRESHOLD / RELATION DIAGRAM</text>
<path d="M770 600 C870 510 960 505 1050 558 C1130 607 1230 592 1350 490" fill="none" stroke="#5C9498" stroke-width="28" stroke-linecap="round"/><path d="M770 600 C870 510 960 505 1050 558 C1130 607 1230 592 1350 490" fill="none" stroke="#F7F3EA" stroke-width="4" stroke-dasharray="10 9"/>
<rect x="1004" y="480" width="112" height="170" rx="20" fill="#E2DDD1" stroke="#6A726E" stroke-width="2"/><text x="1022" y="509" font-family="Arial,sans-serif" font-size="11" fill="#59615F">THRESHOLD</text>
<circle cx="1060" cy="548" r="54" fill="#C68E52" opacity=".25" stroke="#9A653E" stroke-width="3"/><text x="1022" y="552" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#6C493A">停留需求</text><text x="1017" y="571" font-family="Arial,sans-serif" font-size="10.5" fill="#6C493A">DWELL</text>
<path d="M785 680 C905 650 1020 670 1135 700 C1230 726 1305 715 1370 680" fill="none" stroke="#4F5855" stroke-width="4" stroke-dasharray="10 8"/><text x="790" y="714" font-family="Arial,sans-serif" font-size="11" fill="#4F5855">RETURN CONTINUITY</text>
<circle cx="930" cy="520" r="18" fill="#315D57"/><text x="921" y="526" font-family="Arial" font-size="13" fill="#fff">E1</text><line x1="930" y1="500" x2="884" y2="432" stroke="#315D57" stroke-width="2"/><text x="770" y="416" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">E1 · 通行穿过阈值</text>
<circle cx="1060" cy="548" r="18" fill="#9A653E"/><text x="1051" y="554" font-family="Arial" font-size="13" fill="#fff">E2</text><line x1="1080" y1="535" x2="1160" y2="430" stroke="#9A653E" stroke-width="2"/><text x="1166" y="416" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">E2 · 阅读需要停留</text>
<circle cx="1190" cy="711" r="18" fill="#4F5855"/><text x="1181" y="717" font-family="Arial" font-size="13" fill="#fff">E3</text>
<path d="M1058 604 C1080 625 1108 635 1136 636" fill="none" stroke="#934F3D" stroke-width="3"/><rect x="1138" y="610" width="218" height="72" rx="14" fill="#F2E5DD" stroke="#934F3D" stroke-width="2"/><text x="1156" y="637" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#934F3D">FINDING</text><text x="1156" y="661" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#29332F">停留与通行占用同一阈值</text>
<path d="M1084 548 C1130 525 1170 512 1218 512" fill="none" stroke="#315D57" stroke-width="4"/><rect x="1218" y="466" width="150" height="92" rx="18" fill="#DFEAE5" stroke="#315D57" stroke-width="3"/><text x="1238" y="494" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315D57">DESIGN LEVER</text><text x="1238" y="518" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#29332F">侧向停留湾</text><text x="1238" y="540" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11" fill="#59615F">不切断 Return spine</text>
<rect x="746" y="784" width="632" height="92" rx="12" fill="#F7F3EA"/><text x="766" y="810" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315D57">CAUSAL SPINE</text><text x="766" y="836" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#29332F">E1 + E2 → “共享阈值冲突” → 改变停留位置，而不是改变主通行 / Return。</text><text x="766" y="860" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#69706D">E3 作为约束控制 consequence：任何停留修正都不能截断回程连续性。</text>
<rect x="1470" y="220" width="362" height="690" rx="24" fill="#DED9CD" stroke="#BDB6A8" stroke-width="2"/><text x="1504" y="268" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">C / ATTACK + RETEST</text><text x="1504" y="302" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">不是“看起来合理”就算通过。</text>
<rect x="1504" y="350" width="294" height="208" rx="16" fill="#F7F3EA"/><text x="1526" y="382" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#934F3D">ATTACK 01 · DELETE E2</text><text x="1526" y="412" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#29332F">假设没有停留需求。</text><path d="M1540 474 H1758" stroke="#5C9498" stroke-width="18" stroke-linecap="round"/><circle cx="1648" cy="474" r="18" fill="#315D57"/><text x="1639" y="480" font-family="Arial" font-size="12" fill="#fff">E1</text><line x1="1534" y1="514" x2="1762" y2="514" stroke="#BDB6A8" stroke-width="2"/><text x="1526" y="540" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">RETEST → Finding 撤销；停留湾 = HOLD。</text>
<rect x="1504" y="584" width="294" height="246" rx="16" fill="#F7F3EA"/><text x="1526" y="616" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#934F3D">ATTACK 02 · RETURN BLOCKED</text><text x="1526" y="646" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#29332F">不利条件：原 Return spine 不可用。</text><path d="M1534 714 C1600 690 1660 704 1730 726" fill="none" stroke="#4F5855" stroke-width="4" stroke-dasharray="9 7"/><line x1="1630" y1="687" x2="1668" y2="735" stroke="#934F3D" stroke-width="5"/><line x1="1668" y1="687" x2="1630" y2="735" stroke="#934F3D" stroke-width="5"/><text x="1526" y="770" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#934F3D">RETEST → 原 consequence 不得继续 SELECT。</text><text x="1526" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">先恢复/替代 Return，再重算停留关系。</text><text x="1504" y="872" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#69706D">PASS 条件：删除输入会撤销依赖它的结论；</text><text x="1504" y="892" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#69706D">不利条件会改变 Design Lever，而不是只改说明文字。</text>
<line x1="88" y1="962" x2="1832" y2="962" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="286" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#59615F">DELETE ONE CRITICAL EVIDENCE OR BREAK ONE CONSTRAINT → DOES THE FINDING / CONSEQUENCE CHANGE AT THE SAME CAUSAL LINK?</text><text x="88" y="1046" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">Training only. Synthetic inputs demonstrate dependency logic, not site research, field observation, technical dimensions, accessibility, service capacity or project approval.</text>
</svg>