<text x="964" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#315D57">KEEP CANDIDATE / ROLE-PAIRED TYPOGRAPHY</text>
<text x="964" y="309" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">主语言负责第一阅读；伴随语言保留同一语义，但不复制视觉重量。功能词保持短、稳定、不可误断。</text>
