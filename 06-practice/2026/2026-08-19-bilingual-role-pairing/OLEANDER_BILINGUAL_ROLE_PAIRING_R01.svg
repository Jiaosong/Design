<text x="96" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text>
<text x="300" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">Remove either language in turn: semantic identity must survive; restore both and the companion language must not create a second first-read hierarchy.</text>
<text x="96" y="1045" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Chinese-primary training case only. Equal-language public-service contexts require a different authority decision and must not mechanically demote either language.</text>
