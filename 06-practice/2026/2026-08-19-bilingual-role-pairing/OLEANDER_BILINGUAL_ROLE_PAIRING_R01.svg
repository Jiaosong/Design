<text x="96" y="130" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="48" font-weight="700" fill="#18211F">双语不是两套同权标题；先锁语义角色，再校正字面重量</text>
<text x="96" y="172" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#69706D">C04 Visual Reading inspired · Chinese-primary research prototype · vector text · training-only</text>
