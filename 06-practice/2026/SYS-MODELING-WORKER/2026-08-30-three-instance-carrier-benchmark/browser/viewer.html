import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202328);const camera=new THREE.PerspectiveCamera(42,1,.01,100);camera.position.set(0,-10,9);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(720,720,false);document.body.appendChild(renderer.domElement);const gl=renderer.getContext();const material=new THREE.MeshBasicMaterial({color:0xb7bcc4});
let active=null;
const base=new THREE.BoxGeometry(.10,.10,.10);base.computeBoundingBox();
function geometryBytes(g){let n=0;for(const a of Object.values(g.attributes))n+=a.array.byteLength;if(g.index)n+=g.index.array.byteLength;return n;}
function positions(count){const side=Math.ceil(Math.sqrt(count)),span=7.2,step=side>1?span/(side-1):0,arr=[];for(let i=0;i<count;i++){const x=i%side,y=Math.floor(i/side);arr.push([(x-(side-1)/2)*step,(y-(side-1)/2)*step,0]);}return arr;}
function disposeActive(){if(!active)return;scene.remove(active.root);if(active.ownedGeometry)active.ownedGeometry.dispose();active=null;renderer.renderLists.dispose();}
function makeNaive(count){const root=new THREE.Group();const ps=positions(count);for(const p of ps){const m=new THREE.Mesh(base,material);m.position.set(...p);root.add(m);}return {root,ownedGeometry:null,carrier:'NAIVE_MESHES',objectCount:count,instanceMatrixBytes:0,geometryBufferBytes:geometryBytes(base),explicitTransformBytesEstimate:count*16*8};}
function makeInstanced(count){const ps=positions(count);const mesh=new THREE.InstancedMesh(base,material,count);const mx=new THREE.Matrix4();for(let i=0;i<count;i++){mx.makeTranslation(...ps[i]);mesh.setMatrixAt(i,mx);}mesh.instanceMatrix.needsUpdate=true;return {root:mesh,ownedGeometry:null,carrier:'INSTANCED_MESH',objectCount:1,instanceCount:count,instanceMatrixBytes:mesh.instanceMatrix.array.byteLength,geometryBufferBytes:geometryBytes(base),explicitTransformBytesEstimate:mesh.instanceMatrix.array.byteLength};}
function makeFlattened(count){const src=base.index?base:base.toNonIndexed();const pos=src.getAttribute('position'),idx=src.index;const ps=positions(count);const vertsPer=pos.count,indexPer=idx?idx.count:pos.count;const P=new Float32Array(vertsPer*count*3);const useUint32=vertsPer*count>65535;const I=useUint32?new Uint32Array(indexPer*count):new Uint16Array(indexPer*count);for(let c=0;c<count;c++){const off=ps[c];for(let v=0;v<vertsPer;v++){const j=(c*vertsPer+v)*3;P[j]=pos.getX(v)+off[0];P[j+1]=pos.getY(v)+off[1];P[j+2]=pos.getZ(v)+off[2];}for(let k=0;k<indexPer;k++)I[c*indexPer+k]=(idx?idx.getX(k):k)+c*vertsPer;}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setIndex(new THREE.BufferAttribute(I,1));g.computeBoundingSphere();const mesh=new THREE.Mesh(g,material);return {root:mesh,ownedGeometry:g,carrier:'FLATTENED_MESH',objectCount:1,instanceCount:0,instanceMatrixBytes:0,geometryBufferBytes:geometryBytes(g),explicitTransformBytesEstimate:0};}
function median(xs){const a=[...xs].sort((x,y)=>x-y);return a[Math.floor(a.length/2)];}
async function run(carrier,count){disposeActive();const t0=performance.now();const made=carrier==='NAIVE_MESHES'?makeNaive(count):carrier==='INSTANCED_MESH'?makeInstanced(count):makeFlattened(count);const buildMs=performance.now()-t0;active=made;scene.add(made.root);scene.updateMatrixWorld(true);renderer.info.reset();for(let i=0;i<4;i++){renderer.render(scene,camera);gl.finish();}const samples=[];for(let i=0;i<11;i++){const s=performance.now();renderer.render(scene,camera);gl.finish();samples.push(performance.now()-s);}const info={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,points:renderer.info.render.points,lines:renderer.info.render.lines,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures};return {carrier,count,buildMs,renderSamplesMs:samples,renderMedianMs:median(samples),rendererInfo:info,geometryBufferBytes:made.geometryBufferBytes,instanceMatrixBytes:made.instanceMatrixBytes,explicitTransformBytesEstimate:made.explicitTransformBytesEstimate,objectCount:made.objectCount,instanceCount:made.instanceCount||0};}
