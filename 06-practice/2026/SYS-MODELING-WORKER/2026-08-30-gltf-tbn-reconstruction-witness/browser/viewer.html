<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLEANDER Numeric TBN Witness</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202328}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x202328); const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.01,100); camera.position.set(0,-4.2,3.2); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,1.3)); const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(4,-4,6); scene.add(key);
const rt={ready:false,error:null,threeRevision:THREE.REVISION,objects:{},webgl:{}}; window.__OLEANDER_TBN_RUNTIME__=rt;
function readVec3(attr,i){return [attr.getX(i),attr.getY(i),attr.getZ(i)]}
new GLTFLoader().load('./assets/TBN_RECONSTRUCTION_WITNESS.glb',gltf=>{
 scene.add(gltf.scene); gltf.scene.updateMatrixWorld(true);
 gltf.scene.traverse(o=>{
  if(!o.isMesh||!['TBN_STANDARD','TBN_MIRRORED'].includes(o.name))return;
  const n=o.geometry.attributes.normal, t=o.geometry.attributes.tangent; const uv=o.geometry.attributes.uv;
  const normals=[],tangents=[],signs=[];
  if(n)for(let i=0;i<n.count;i++)normals.push(readVec3(n,i));
  if(t)for(let i=0;i<t.count;i++){tangents.push(readVec3(t,i));signs.push(t.getW(i));}
  rt.objects[o.name]={normalPresent:!!n,tangentPresent:!!t,uvPresent:!!uv,vertexCount:o.geometry.attributes.position?.count||0,normals,tangents,tangentW:signs,material:{type:o.material?.type||null,normalMap:!!o.material?.normalMap,normalMapName:o.material?.normalMap?.name||null}};
 });
 const gl=renderer.getContext(); rt.webgl={version:gl.getParameter(gl.VERSION),vendor:gl.getParameter(gl.VENDOR),renderer:gl.getParameter(gl.RENDERER)}; renderer.render(scene,camera); rt.ready=true;
},undefined,e=>rt.error=String(e?.message||e));
</script></body></html>
