<text x="88" y="102" font-family="Arial" font-size="30" font-weight="700" fill="#111">OLEANDER / MATERIAL IDENTITY CALIBRATION</text>
<text x="88" y="138" font-family="Arial" font-size="14" fill="#666">V3 · RESPONSE + SCALE + EDGE · REPRESENTATIONAL, NOT A PBR RENDER OR MEASURED SAMPLE</text>
<text x="88" y="200" font-family="Arial" font-size="18" font-weight="700">C / MATERIAL IDENTITY — KEEP FOR TRAINING</text>
<text x="88" y="226" font-family="Arial" font-size="12" fill="#777">Texture is reduced from “pattern” to surface variation; material distinction must remain legible even after color is removed.</text>
