<line x1="88" y1="946" x2="1712" y2="946" stroke="#d0cec7"/><text x="88" y="986" font-family="Arial" font-size="13" font-weight="700">TRANSFER RULE /</text><text x="210" y="986" font-family="Arial" font-size="13" fill="#333">Material identity = coherent surface response + plausible texture scale + edge behavior; color and labels remain secondary evidence.</text>
<text x="88" y="1022" font-family="Arial" font-size="12" fill="#777">PBR categories referenced from glTF 2.0 metallic-roughness. This SVG is a calibration diagram, not physical material validation.</text>
