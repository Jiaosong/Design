<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / BAOJIAJIE JUMP CARD / CLAIM → FORM</text>
<text x="88" y="126" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">“自带两档 / 使用久一点”不是两行大字，而是两种不同的形态职责</text>
<text x="88" y="166" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">Current task input · logo/portrait source locked · no AI image · vector-only training master · production geometry requires Validation</text>
<rect x="88" y="205" width="1744" height="74" rx="16" fill="#E0DBD0"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13"><text x="112" y="232" font-weight="700" fill="#27312E">EVIDENCE</text><text x="112" y="257" fill="#59615F">主传播文字：自带两档 / 使用久一点；产品为耐用吸水胶棉拖把；人物次要；Logo 锁定。</text><text x="650" y="232" font-weight="700" fill="#27312E">INFERENCE</text><text x="650" y="257" fill="#59615F">“两档”更像离散状态；“久一点”更像连续时间/延展，应避免同一种视觉语法。</text><text x="1270" y="232" font-weight="700" fill="#27312E">DECISION QUESTION</text><text x="1270" y="257" fill="#59615F">跳跳卡外形如何同时表达“2 个状态”与“持续更久”，又不变成图标堆？</text></g>
<rect x="88" y="310" width="520" height="610" rx="24" fill="#DDD8CC" stroke="#BDB6A8"/><text x="122" y="356" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#914F3D">OPTION A / 双翼标签</text><text x="122" y="388" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">把“两档”直接变成左右两个凸耳；“使用久一点”仍是正文。</text>
<g transform="translate(202,432)"><path d="M70 0 H230 Q255 0 258 26 L265 84 L316 70 L330 118 L274 137 L280 310 Q280 340 250 340 H50 Q20 340 20 310 L26 137 L-30 118 L-16 70 L35 84 L42 26 Q45 0 70 0Z" fill="#F8F4EC" stroke="#914F3D" stroke-width="3"/><rect x="65" y="24" width="170" height="42" rx="10" fill="#E5E0D5"/><text x="90" y="51" font-family="Arial,sans-serif" font-size="11" fill="#666">LOCKED LOGO SLOT</text><text x="64" y="112" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="800" fill="#003DA7">自带两档</text><text x="64" y="154" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#D61160">使用久一点</text><rect x="72" y="185" width="156" height="88" rx="12" fill="#E6E1D6"/><text x="108" y="232" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="10" fill="#666">人物 / 产品</text><text x="-12" y="112" font-family="Arial,sans-serif" font-size="10" fill="#914F3D">档1</text><text x="286" y="112" font-family="Arial,sans-serif" font-size="10" fill="#914F3D">档2</text></g>
<text x="122" y="818" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">CRIT：两档被理解成“两边各一个标签”，与真实操作状态关系太弱。</text><text x="122" y="844" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">问题根因：把数字 2 直接翻译成两个装饰物，而不是状态序列。</text><text x="122" y="882" font-family="Arial,sans-serif" font-size="12" fill="#7D4A3A">REJECT FOR FORM LOGIC</text>
<rect x="638" y="310" width="520" height="610" rx="24" fill="#DDD8CC" stroke="#BDB6A8"/><text x="672" y="356" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">OPTION B / 双档阶梯脊</text><text x="672" y="388" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">“两档”进入左侧两级阶梯；“久一点”进入竖向延展脊。</text>
<g transform="translate(760,427)"><path d="M40 18 H214 Q240 18 246 44 L258 90 L300 90 L300 148 L266 148 L274 318 Q276 346 246 346 H58 Q28 346 28 316 L35 170 H0 V118 H38 L40 18Z" fill="#F8F4EC" stroke="#315D57" stroke-width="3"/><rect x="0" y="95" width="44" height="48" rx="8" fill="#003DA7"/><rect x="0" y="151" width="44" height="48" rx="8" fill="#6F92D0"/><text x="13" y="125" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">1</text><text x="13" y="181" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">2</text><rect x="247" y="148" width="24" height="156" rx="12" fill="#D61160"/><path d="M259 303 l-8 -14 h16 z" fill="#D61160"/><rect x="64" y="42" width="154" height="38" rx="9" fill="#E5E0D5"/><text x="85" y="67" font-family="Arial,sans-serif" font-size="10.5" fill="#666">LOCKED LOGO SLOT</text><text x="66" y="123" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="32" font-weight="800" fill="#003DA7">自带两档</text><text x="66" y="164" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#D61160">使用久一点</text><text x="67" y="191" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11" fill="#59615F">七彩高弹棉 · 耐用吸水胶棉拖把</text><rect x="72" y="218" width="144" height="82" rx="12" fill="#E6E1D6"/><text x="105" y="261" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="10" fill="#666">人物 / 产品</text></g>
<text x="672" y="818" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">优点：离散状态与连续耐用感使用两种正交形态，逻辑更接近文案。</text><text x="672" y="844" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">CRIT：右侧红色“时间脊”太像装饰箭头，抢过主标题；外轮廓也偏僵硬。</text><text x="672" y="882" font-family="Arial,sans-serif" font-size="12" fill="#7D4A3A">REVISE</text>
<rect x="1188" y="310" width="644" height="610" rx="24" fill="#DDD8CC" stroke="#BDB6A8"/><text x="1222" y="356" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#315D57">REPAIR / 两档切口 + 延展底座</text><text x="1222" y="388" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">把“连续时间”从红箭头改成整体下延比例；只保留两级状态切口。</text>
<g transform="translate(1355,418)"><path d="M46 12 H222 Q250 12 254 40 L260 88 H298 L298 137 H266 L276 350 Q278 382 246 382 H58 Q26 382 28 350 L38 194 H0 V145 H40 L46 12Z" fill="#F8F4EC" stroke="#315D57" stroke-width="3"/><line x1="40" y1="103" x2="58" y2="103" stroke="#6F92D0" stroke-width="3"/><line x1="38" y1="157" x2="58" y2="157" stroke="#003DA7" stroke-width="3"/><text x="62" y="107" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="7" fill="#6F92D0">1档</text><text x="62" y="161" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="7" fill="#003DA7">2档</text><rect x="74" y="34" width="154" height="38" rx="9" fill="#E5E0D5"/><text x="95" y="59" font-family="Arial,sans-serif" font-size="10.5" fill="#666">LOCKED LOGO SLOT</text><text x="72" y="116" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="800" fill="#003DA7">自带两档</text><text x="72" y="161" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="800" fill="#D61160">使用久一点</text><line x1="72" y1="174" x2="224" y2="174" stroke="#D61160" stroke-width="4"/><text x="72" y="198" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11" fill="#59615F">七彩高弹棉 · 耐用吸水胶棉拖把</text><rect x="76" y="226" width="144" height="94" rx="12" fill="#E6E1D6"/><text x="108" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="10" fill="#666">人物 / 产品</text><text x="74" y="349" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="10.5" fill="#69706D">宝家洁新一代拖把</text></g>
<text x="1222" y="818" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">RETEST：删掉“1/2 按钮”后，两级切口仍能承担状态；长比例承担持续。</text><text x="1222" y="844" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">按钮感被移除；人物和 Logo 仍是锁定 slot，不借假资产撑完成度。</text><text x="1222" y="882" font-family="Arial,sans-serif" font-size="12" fill="#315D57">SELECTED DESIGN DIRECTION · TECHNICAL VALIDATION HOLD</text>
<line x1="88" y1="964" x2="1832" y2="964" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">TRANSFER RULE</text><text x="260" y="1004" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#59615F">When one claim contains discrete states + continuous benefit, encode them with orthogonal form roles before styling; reject literal decoration that merely counts the number.</text><text x="88" y="1043" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">Validation Handoff required for final dieline, safe zone, minimum neck/radius, substrate, spring/adhesive construction, printer/vendor tolerance and locked-asset binding.</text>
</svg>