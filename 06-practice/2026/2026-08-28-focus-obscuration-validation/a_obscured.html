<style>
*{box-sizing:border-box} body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#fafafa;color:#111}
header{position:fixed;z-index:10;top:0;left:0;right:0;height:96px;background:#111;color:#fff;padding:20px 24px}
main{padding:20px 24px 1200px}
button{min-height:44px;padding:10px 16px} button:focus-visible{outline:4px solid #0a66ff;outline-offset:3px}

</style>

<main><button id="target">Primary action</button><div class="spacer"></div><button>Later action</button></main>
