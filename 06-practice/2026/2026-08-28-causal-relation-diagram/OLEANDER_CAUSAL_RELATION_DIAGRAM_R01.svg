<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f2efe7"/><text x="88" y="72" font-family="Arial,sans-serif" font-size="22" fill="#59615f">OLEANDER DESIGN PROCESS / CAUSAL RELATION DIAGRAM</text><text x="88" y="128" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#18211f">Evidence must visibly change the design, not merely fill a card.</text><rect x="88" y="220" width="812" height="700" rx="24" fill="#ded9cd"/><text x="124" y="270" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#914f3d">A / REJECT — EQUAL-CARD ANALYSIS</text><rect x="130" y="365" width="330" height="190" rx="18" fill="#f7f3ea"/><rect x="490" y="365" width="330" height="190" rx="18" fill="#f7f3ea"/><rect x="130" y="585" width="330" height="190" rx="18" fill="#f7f3ea"/><rect x="490" y="585" width="330" height="190" rx="18" fill="#f7f3ea"/><text x="156" y="430" font-family="Arial,sans-serif" font-size="17">EVIDENCE</text><text x="516" y="430" font-family="Arial,sans-serif" font-size="17">INFERENCE</text><text x="156" y="650" font-family="Arial,sans-serif" font-size="17">ASSUMPTION</text><text x="516" y="650" font-family="Arial,sans-serif" font-size="17">DECISION</text><text x="124" y="835" font-family="Arial,sans-serif" font-size="14" fill="#7d4a3a">DELETE TEST: remove headings and causal direction disappears.</text><rect x="940" y="220" width="892" height="700" rx="24" fill="#ded9cd"/><text x="976" y="270" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#315d57">B / KEEP CANDIDATE — CAUSAL SPINE + SPATIAL CONSEQUENCE</text><line x1="1000" y1="424" x2="1738" y2="424" stroke="#8b5d46" stroke-width="3"/><circle cx="1050" cy="424" r="7" fill="#8b5d46"/><circle cx="1280" cy="424" r="7" fill="#8b5d46"/><circle cx="1510" cy="424" r="7" fill="#8b5d46"/><circle cx="1738" cy="424" r="7" fill="#315d57"/><text x="1000" y="462" font-family="Arial,sans-serif" font-size="12">OBSERVED RELATION</text><text x="1198" y="462" font-family="Arial,sans-serif" font-size="12">INFERENCE</text><text x="1416" y="462" font-family="Arial,sans-serif" font-size="12">ADVERSE CONDITION</text><text x="1650" y="462" font-family="Arial,sans-serif" font-size="12">DESIGN CONSEQUENCE</text><path d="M1010 700 C1110 645 1200 648 1290 688 C1380 728 1480 720 1590 660 C1660 622 1730 630 1790 654" fill="none" stroke="#d9d3c7" stroke-width="46" stroke-linecap="round"/><path d="M1378 716 C1425 770 1480 790 1540 802" fill="none" stroke="#d9d3c7" stroke-width="34" stroke-linecap="round"/><circle cx="1380" cy="712" r="18" fill="#f7f3ea" stroke="#8b5d46" stroke-width="4"/><circle cx="1282" cy="687" r="22" fill="#315d57"/><line x1="1282" y1="650" x2="1282" y2="542" stroke="#315d57" stroke-width="2"/><text x="1300" y="570" font-family="Arial,sans-serif" font-size="13" fill="#315d57">DESIGN CHANGE BEFORE FORK</text><rect x="990" y="824" width="792" height="58" rx="12" fill="#f7f3ea"/><text x="1012" y="850" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315d57">ATTACK / DELETE ASSUMPTION</text><text x="1012" y="870" font-family="Arial,sans-serif" font-size="12" fill="#59615f">If adverse-condition evidence is weak, keep the consequence as a reversible test — not field truth.</text><line x1="88" y1="968" x2="1832" y2="968" stroke="#bdb6a8" stroke-width="2"/><text x="88" y="1008" font-family="Arial,sans-serif" font-size="18" fill="#18211f">PROMOTION TEST: delete titles and strategy prose; observed relation + actual design change must remain visible.</text><text x="88" y="1047" font-family="Arial,sans-serif" font-size="13" fill="#747b78">Synthetic practice only. No project, field, capacity, crowd-flow or engineering claim.</text></svg>