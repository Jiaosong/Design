<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OLEANDER Dynamic Relational Field Prototype</title>
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Arial,sans-serif;color:#111}
main{height:100%;display:grid;grid-template-rows:1fr auto;place-items:center}
svg{width:min(78vmin,720px);height:min(78vmin,720px)}
footer{padding:18px 24px 26px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
line{stroke:#111;stroke-linecap:round}
</style>
</head>
<body><main><svg id="mark" viewBox="0 0 512 512" aria-label="OLEANDER relational field motion prototype"></svg>
<footer>Provisional dynamic identity carrier · exercise-only hypothetical parameters · 2026-08-06</footer></main>
<script>
const N=7, margin=.18, falloff=.26, amplitude=.095, pad=70, size=512;
const svg=document.getElementById('mark');
const points=[]; const edges=[];
for(let r=0;r<N;r++){for(let c=0;c<N;c++){points.push([margin+(1-2*margin)*c/(N-1),margin+(1-2*margin)*r/(N-1)]);let i=r*N+c;if(c<N-1)edges.push([i,i+1]);if(r<N-1)edges.push([i,i+N]);}}
const lines=edges.map(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');svg.appendChild(l);return l;});
function render(ms){
 const t=(ms%2400)/2400; const phase=.5-.5*Math.cos(2*Math.PI*t);
 const attrs=[[.36+.035*Math.sin(2*Math.PI*t),.47,1],[.69,.55+.025*Math.cos(2*Math.PI*t),-.85]];
 let raw=points.map(p=>attrs.reduce((sum,a)=>{const dx=p[0]-a[0],dy=p[1]-a[1];return sum+a[2]*Math.exp(-(dx*dx+dy*dy)/(2*falloff*falloff));},0));
 const maxAbs=Math.max(...raw.map(v=>Math.abs(v)))||1; const inf=raw.map(v=>v/maxAbs);
 const p=points.map((q,i)=>{let y=q[1]+amplitude*phase*inf[i];let x=q[0]+amplitude*phase*.35*Math.sin(Math.PI*y)*inf[i];return [pad+x*(size-2*pad),pad+y*(size-2*pad)];});
 edges.forEach((e,k)=>{const a=p[e[0]],b=p[e[1]],s=(Math.abs(inf[e[0]])+Math.abs(inf[e[1]]))/2;const l=lines[k];l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke-width',2+3.2*s);});
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script></body></html>
