<text x="70" y="52" class="m">OLEANDER / C04 PROJECT ARCHITECTURE v3.0 / EDITORIAL RHYTHM TRAINING</text>
<text x="70" y="98" class="h1">Page-type difference must become visual rhythm</text>
<text x="70" y="130" class="b">Irma Boom / SHV Think Book → C04 page-type rhythm calibration</text>
<line x1="70" y1="154" x2="1730" y2="154" stroke="#C2C5C0"/>
<rect x="70" y="178" width="1660" height="110" rx="18" class="soft"/>
<text x="94" y="210" class="m">VISIBLE FACT — SHV THINK BOOK 1996–1896</text>
<text x="94" y="242" class="b">2,136 pages; reverse chronology; no page numbers, contents or index.</text>
<text x="94" y="270" class="s">MoMA: nonlinear reading; typography, layout, materials and printing all participate in the book experience.</text>
<text x="1010" y="210" class="m">TRANSFER RULE</text>
<text x="1010" y="242" class="b">Different page roles must create different visual speeds.</text>
<text x="1010" y="270" class="s">Change dominant mass, density, whitespace and reading time—not only the label.</text>
<text x="80" y="342" class="m">A — ONE TEMPLATE FOR EVERY PAGE / REVISE</text>
<text x="80" y="372" class="h2">Eight page roles collapse into one repeated composition</text>
