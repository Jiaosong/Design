<text x="80" y="692" class="s">Internally clean, but cross-page reading has no fast / slow / pause / proof contrast; page role survives only as metadata.</text>
<text x="80" y="748" class="m">B — PAGE ROLE BECOMES VISUAL TEMPO / PROPOSED</text>
<text x="80" y="778" class="h2">The same content architecture gains rhythm through mass, density and whitespace</text>
