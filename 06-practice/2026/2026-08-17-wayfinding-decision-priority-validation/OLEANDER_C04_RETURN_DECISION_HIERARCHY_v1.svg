<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#F2F0EA"/>
<style>
text{font-family:"Noto Sans CJK SC","Noto Sans SC","Arial",sans-serif;fill:#19201E}
.meta{font-size:16px;letter-spacing:1.2px;fill:#666D69}.h1{font-size:38px;font-weight:750}.h2{font-size:25px;font-weight:700}
.body{font-size:20px}.small{font-size:15px;fill:#68706C}.inv{fill:#FFFDF8}.line{stroke:#B9BDB8;stroke-width:1}
.panel{fill:#FFFDF8;stroke:#D5D2CA;stroke-width:1.5}
</style>
<text x="72" y="54" class="meta">OLEANDER / C04 / RETURN CLOSURE / WAYFINDING VALIDATION</text>
<text x="72" y="100" class="h1">决策优先级必须变成视觉优先级</text>
<text x="72" y="132" class="body">Existing Munich 1972 candidate × second case Schiphol → C04 project migration</text>
<line x1="72" y1="158" x2="1528" y2="158" class="line"/>
<rect x="72" y="184" width="1456" height="110" rx="18" fill="#E8E5DD"/>
<text x="96" y="216" class="meta">SECOND CASE — SCHIPHOL / MIJKSENAAR</text>
<text x="96" y="250" class="body">右信息 · 正确方式 · 正确时机；orientation / navigation / experience 形成连续系统。</text>
<text x="96" y="278" class="small">Transfer only: no Schiphol yellow, typeface, pictograms or trade dress copied.</text>
<text x="890" y="216" class="meta">C04 CURRENT AUTHORITY</text>
<text x="890" y="250" class="body">SERVICE / RETURN &gt; ROUTE &gt; OBSERVATION &gt; EXPLANATION</text>
<text x="890" y="278" class="small">FIELD OBSERVED=0 / FIELD MEASURED=0 / direction &amp; distance remain OPEN.</text>

<text x="84" y="348" class="meta">A — EQUAL-WEIGHT / REVISE</text>
<rect x="72" y="370" width="698" height="455" rx="24" class="panel"/>
<text x="100" y="410" class="h2">同一节点：三个信息带近似等权</text>
<rect x="108" y="450" width="626" height="86" rx="14" fill="#244A46"/>
<text x="136" y="487" class="small inv">SERVICE / RETURN</text><text x="136" y="517" class="h2 inv">返回 / RETURN</text>
<rect x="108" y="552" width="626" height="86" rx="14" fill="#A87944"/>
<text x="136" y="589" class="small inv">ROUTE</text><text x="136" y="619" class="h2 inv">继续当前路线</text>
<rect x="108" y="654" width="626" height="86" rx="14" fill="#546E69"/>
<text x="136" y="691" class="small inv">OPTIONAL READING</text><text x="136" y="721" class="h2 inv">十三印 · 继续阅读</text>
<text x="108" y="785" class="small">问题：系统一致，但 1 秒 first-read 仍需要比较三个同权动作。</text>

<text x="842" y="348" class="meta">B — DECISION-PRIORITY / PROPOSED C04 SUPPORT</text>
<rect x="830" y="370" width="698" height="455" rx="24" class="panel"/>
<text x="858" y="410" class="h2">同一信息集：先锁定 RETURN，再保留全部内容</text>
<rect x="866" y="450" width="626" height="132" rx="16" fill="#244A46"/>
<text x="896" y="487" class="small inv">SERVICE / RETURN · PRIMARY</text>
<text x="896" y="531" style="font-size:34px;font-weight:780;fill:#FFFDF8">返回 / RETURN</text>
<text x="896" y="559" class="small inv">当前状态必须先确认；方向 / 时间仍待现场或运营数据。</text>
<text x="866" y="621" class="meta">ROUTE · SECONDARY</text><text x="866" y="654" class="h2">继续当前路线</text>
<line x1="866" y1="674" x2="1492" y2="674" class="line"/>
<text x="866" y="714" class="meta">OPTIONAL READING · TERTIARY</text><text x="866" y="747" class="body">十三印 · 继续阅读 →</text>
<text x="866" y="785" class="small">不删信息；只改变 position / area / whitespace / type weight。</text>

<line x1="72" y1="858" x2="1528" y2="858" class="line"/>
<text x="72" y="892" class="meta">STATE OVERRIDE TEST</text>
<rect x="72" y="910" width="330" height="56" rx="10" fill="#244A46"/><text x="92" y="945" class="body inv">NORMAL · 返回可用</text>
<rect x="420" y="910" width="330" height="56" rx="10" fill="#857A66"/><text x="440" y="945" class="body inv">DEGRADED · 先看替代路径</text>
<rect x="768" y="910" width="330" height="56" rx="10" fill="#67463F"/><text x="788" y="945" class="body inv">CLOSED · 停止正常路线</text>
<rect x="1116" y="910" width="412" height="56" rx="10" fill="#3D4340"/><text x="1136" y="945" class="body inv">UNKNOWN · 先到服务点确认，不画成开放</text>
<text x="72" y="990" class="small">RELATIONAL / NTS / FIELD OPEN / NOT A SITE SIGN LOCATION. Tests hierarchy only; does not prove route geometry, distance, operation, safety, accessibility or implementation.</text>
</svg>