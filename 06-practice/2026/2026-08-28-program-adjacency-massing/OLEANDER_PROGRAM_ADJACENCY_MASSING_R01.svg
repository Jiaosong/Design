<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / PROGRAM → ADJACENCY → MASSING</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">体量不是先做“造型”再塞房间；Program relation 必须留下空间痕迹</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic makerspace · NTS · no code / egress / acoustic / structural / area validation</text>

<!-- E/I/A/D -->
<rect x="88" y="208" width="1744" height="118" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="242" font-size="11.5" font-weight="700" fill="#8B5D46">EVIDENCE / PROGRAM</text>
<text x="116" y="268" font-size="12.5" fill="#29332F">Workshop 高噪/粉尘；Loading 要直达。</text>
<text x="116" y="291" font-size="12.5" fill="#29332F">Quiet 需隔离；Public 先到 Commons。</text>
<text x="570" y="242" font-size="11.5" font-weight="700" fill="#7D654B">INFERENCE</text>
<text x="570" y="268" font-size="12.5" fill="#29332F">统一外壳再分房，会隐藏冲突邻接。</text>
<text x="570" y="291" font-size="12.5" fill="#59615F">form-first risks program drift</text>
<text x="1000" y="242" font-size="11.5" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text>
<text x="1000" y="268" font-size="12.5" fill="#29332F">Delivery 与 public 同时发生；</text>
<text x="1000" y="291" font-size="12.5" fill="#29332F">Workshop 处于高噪作业状态。</text>
<text x="1430" y="242" font-size="11.5" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text>
<text x="1430" y="268" font-size="12.5" fill="#29332F">分开 noisy/service 与 quiet/public；</text>
<text x="1430" y="291" font-size="12.5" fill="#29332F">Commons 只在需要处连接。</text>
</g>

<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · SCULPTURAL MONOLITH</text>
<text x="120" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">先固定一个连续外壳，再平均切房间；program conflict 只靠内部门解决。</text>
<text x="120" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / LABEL-OFF</text>
<rect x="132" y="480" width="464" height="236" rx="18" fill="#F7F3EA"/>
<path d="M168 528 Q364 450 560 528 V674 Q364 748 168 674 Z" fill="#D3CEC3" stroke="#666E69" stroke-width="3"/>
<line x1="298" y1="500" x2="298" y2="698" stroke="#8D8579" stroke-width="2"/>
<line x1="430" y1="490" x2="430" y2="704" stroke="#8D8579" stroke-width="2"/>
<line x1="168" y1="604" x2="560" y2="604" stroke="#8D8579" stroke-width="2"/>
<path d="M188 642 C250 614 318 610 384 610 C450 610 506 588 548 546" fill="none" stroke="#315D57" stroke-width="5"/>
<path d="M548 664 C486 640 430 618 372 598 C308 576 246 554 186 540" fill="none" stroke="#8B5D46" stroke-width="5"/>
<circle cx="372" cy="606" r="28" fill="none" stroke="#914F3D" stroke-width="3"/>
<text x="320" y="742" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#914F3D">delivery / public movement overlap</text>
<text x="120" y="782" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">NOISE ATTACK → Quiet 与 Workshop 只隔一面普通内部墙。</text>
<text x="120" y="810" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">FACADE-OFF → “好看的壳”不再提供任何 program 解释。</text>
<rect x="120" y="842" width="484" height="36" rx="9" fill="#F7F3EA"/>
<text x="140" y="865" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#7D4A3A">ROOT · form commitment happened before relationship allocation.</text>

<rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="718" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · TWO BARS + COMMONS HINGE</text>
<text x="718" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">noisy/service bar 与 quiet/public bar 分离；Commons 只在需要的位置连接。</text>
<text x="718" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / PROGRAM RELATION FIRST</text>
<rect x="730" y="480" width="536" height="236" rx="18" fill="#F7F3EA"/>
<rect x="756" y="514" width="188" height="166" rx="14" fill="#C9C4B9" stroke="#6E7672" stroke-width="3"/>
<rect x="1046" y="514" width="188" height="166" rx="14" fill="#D9D5CC" stroke="#6E7672" stroke-width="3"/>
<rect x="944" y="558" width="102" height="78" rx="16" fill="#E6E2D8" stroke="#315D57" stroke-width="3"/>
<rect x="756" y="486" width="112" height="24" rx="8" fill="#B69B78"/>
<rect x="1046" y="514" width="38" height="166" fill="#C4D2CC" opacity=".7"/>
<path d="M780 492 V536 H846" fill="none" stroke="#8B5D46" stroke-width="5"/>
<path d="M1210 704 V656 H1100 C1058 656 1038 618 1028 598" fill="none" stroke="#315D57" stroke-width="5"/>
<path d="M944 598 H900" fill="none" stroke="#69716D" stroke-width="2.5" stroke-dasharray="5 5"/>
<path d="M1046 598 H1086" fill="none" stroke="#69716D" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="778" y="550" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">WORKSHOP</text>
<text x="774" y="578" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">+ LOADING</text>
<text x="958" y="604" font-family="Arial,sans-serif" font-size="10.5" fill="#315D57">COMMONS</text>
<text x="1090" y="550" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">QUIET</text>
<text x="1090" y="578" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">+ PUBLIC</text>
<text x="718" y="748" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#315D57">SECTION / SERVICE EDGE → COMMONS → QUIET EDGE</text>
<line x1="744" y1="830" x2="1242" y2="830" stroke="#6E7672" stroke-width="3"/>
<rect x="770" y="770" width="154" height="60" fill="#C9C4B9" stroke="#6E7672" stroke-width="2"/>
<rect x="958" y="792" width="72" height="38" fill="#E6E2D8" stroke="#315D57" stroke-width="2"/>
<rect x="1066" y="754" width="150" height="76" fill="#D9D5CC" stroke="#6E7672" stroke-width="2"/>
<text x="718" y="870" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#315D57">DELIVERY ATTACK → loading reaches Workshop without crossing Public Entry.</text>

<rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1380" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · COURTYARD RING</text>
<text x="1380" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">共享庭院很强，但所有 program 都依赖同一环廊；service 与 public 仍有交叉。</text>
<text x="1380" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / FLOW ATTACK</text>
<rect x="1392" y="480" width="408" height="236" rx="18" fill="#F7F3EA"/>
<path d="M1430 514 H1760 V682 H1430 Z M1508 556 H1682 V640 H1508 Z" fill="#D4CFC4" fill-rule="evenodd" stroke="#6E7672" stroke-width="3"/>
<path d="M1450 704 V662 H1532" fill="none" stroke="#315D57" stroke-width="5"/>
<path d="M1768 530 H1712 V582" fill="none" stroke="#8B5D46" stroke-width="5"/>
<circle cx="1600" cy="614" r="26" fill="none" stroke="#8A6941" stroke-width="3"/>
<text x="1544" y="742" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#8A6941">shared ring = shared conflict carrier</text>
<text x="1380" y="782" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">SERVICE ATTACK → loading movement enters the common ring before Workshop.</text>
<text x="1380" y="810" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">REPAIR → viable if service circulation is externally separated.</text>
<rect x="1380" y="842" width="420" height="36" rx="9" fill="#F7F3EA"/>
<text x="1400" y="865" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">Courtyard quality does not override adjacency conflict.</text>

<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/>
<text x="88" y="986" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#18211F">PROGRAM→MASSING TEST</text>
<text x="88" y="1012" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14.5" fill="#59615F">Remove facade styling and room names: required adjacency / separation / flow should remain visible in massing and circulation.</text>
<text x="88" y="1044" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no dimensions, area schedule, acoustic rating, code, egress, accessibility, structure, cost or project brief is validated.</text>
</svg>