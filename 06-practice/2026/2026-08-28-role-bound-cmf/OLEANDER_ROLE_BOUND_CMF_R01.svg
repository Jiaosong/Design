<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / ROLE-BOUND CMF</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">颜色与表面不是统一“高级感”；每个 CMF 决策必须回答部件角色</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic hand-tool body · grip / moving control / protected shell · training-only · no material or wet-friction validation</text>
<rect x="88" y="210" width="1744" height="112" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="244" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text><text x="116" y="272" font-size="14" fill="#29332F">握持区、移动控制区、保护外壳承担不同接触与操作角色。</text>
<text x="532" y="244" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text><text x="532" y="272" font-size="14" fill="#29332F">同一 finish 会抹平角色差异，或让错误区域承担抓握/操作暗示。</text>
<text x="1080" y="244" font-size="12" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text><text x="1080" y="272" font-size="14" fill="#29332F">湿手套 / 污染 / 低光 / 反复清洁。</text>
<text x="1486" y="244" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1486" y="272" font-size="14" fill="#29332F">先分配 surface role，再选择色彩与质感。</text></g>
<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="122" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · ONE PREMIUM FINISH</text>
<text x="122" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">全机同一深色高光；视觉统一，但接触角色全部被抹平。</text>
<g transform="translate(142,500)"><rect x="0" y="36" width="430" height="96" rx="48" fill="#333936" stroke="#111815" stroke-width="3"/><rect x="145" y="28" width="112" height="112" rx="24" fill="#333936" stroke="#111815" stroke-width="3"/><rect x="390" y="48" width="76" height="72" rx="28" fill="#333936" stroke="#111815" stroke-width="3"/><path d="M28 57 C110 38 280 44 400 58" fill="none" stroke="#8A918D" stroke-width="7" opacity=".65"/></g>
<text x="122" y="690" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">WET ATTACK → grip/control/shell 都呈现同一滑亮表面语义。</text><text x="122" y="718" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">DELETION → 去掉标签后，无法判断哪里握、哪里动。</text><rect x="122" y="766" width="480" height="82" rx="12" fill="#F7F3EA"/><text x="142" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#914F3D">ROOT CAUSE</text><text x="142" y="822" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">visual consistency replaced role consistency.</text>
<rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="718" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · ROLE-BOUND CMF</text><text x="718" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">Grip 先解决接触；Control 先解决动作识别；Shell 先解决保护与清洁。</text>
<g transform="translate(742,492)"><rect x="0" y="40" width="170" height="94" rx="46" fill="#A9B0A8" stroke="#5B625E" stroke-width="3"/><g stroke="#727A75" stroke-width="5"><line x1="28" y1="54" x2="28" y2="120"/><line x1="52" y1="52" x2="52" y2="122"/><line x1="76" y1="52" x2="76" y2="122"/><line x1="100" y1="52" x2="100" y2="122"/><line x1="124" y1="54" x2="124" y2="120"/></g><rect x="160" y="28" width="120" height="118" rx="26" fill="#D4D0C8" stroke="#5B625E" stroke-width="3"/><path d="M182 84 H258" stroke="#315D57" stroke-width="4"/><path d="M182 84 l12 -9 v18 z M258 84 l-12 -9 v18 z" fill="#315D57"/><circle cx="176" cy="84" r="6" fill="#315D57"/><circle cx="264" cy="84" r="6" fill="#315D57"/><rect x="270" y="40" width="220" height="94" rx="44" fill="#E8E5DE" stroke="#5B625E" stroke-width="3"/><path d="M298 62 C350 48 430 50 466 64" fill="none" stroke="#C8C3B8" stroke-width="4"/></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="748" y="660" font-size="12" font-weight="700" fill="#315D57">GRIP</text><text x="748" y="681" font-size="11.3" fill="#59615F">粗尺度肋纹 / 低反射</text><text x="748" y="699" font-size="11.3" fill="#59615F">触觉优先</text><text x="914" y="660" font-size="12" font-weight="700" fill="#315D57">CONTROL</text><text x="914" y="681" font-size="11.3" fill="#59615F">bounded contrast</text><text x="914" y="699" font-size="11.3" fill="#59615F">动作优先</text><text x="1112" y="660" font-size="12" font-weight="700" fill="#315D57">SHELL</text><text x="1112" y="681" font-size="11.3" fill="#59615F">平整 / 易清洁</text><text x="1112" y="699" font-size="11.3" fill="#59615F">不借用 grip 语义</text></g>
<text x="718" y="734" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">COLOR-OFF → 角色仍由 form + surface rhythm 区分。</text><text x="718" y="762" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">CONTAMINATION ATTACK → shell 保持低纹理，不制造“脏污阴影=抓握区”。</text><rect x="718" y="800" width="548" height="62" rx="12" fill="#F7F3EA"/><text x="738" y="828" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#315D57">CMF AFTER FORM PROOF</text><text x="738" y="850" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">Finish reinforces role; it does not create the role.</text>
<rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1380" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · MAXIMUM CONTRAST</text><text x="1380" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">每个零件都被强调，功能差异反而变成视觉竞争。</text>
<g transform="translate(1388,506)"><rect x="0" y="36" width="135" height="94" rx="46" fill="#232C29" stroke="#111815" stroke-width="3"/><rect x="126" y="26" width="110" height="114" rx="24" fill="#F0B43C" stroke="#704D12" stroke-width="3"/><rect x="226" y="36" width="172" height="94" rx="44" fill="#C14458" stroke="#742436" stroke-width="3"/><g stroke="#fff" stroke-width="4"><line x1="26" y1="52" x2="26" y2="116"/><line x1="52" y1="50" x2="52" y2="118"/><line x1="78" y1="50" x2="78" y2="118"/></g><path d="M148 82 H212" stroke="#30230F" stroke-width="4"/><path d="M148 82 l11 -8 v16 z M212 82 l-11 -8 v16 z" fill="#30230F"/></g>
<text x="1380" y="690" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">LOW-LIGHT → 色彩对比下降后，shell 仍抢视觉权重。</text><text x="1380" y="718" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">ROLE-OFF → 每个部件都像“主要交互点”。</text><rect x="1380" y="766" width="420" height="82" rx="12" fill="#F7F3EA"/><text x="1400" y="796" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#8A6941">REPAIR</text><text x="1400" y="822" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#59615F">visual emphasis must follow functional priority, not part count.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="290" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Remove hue and labels: grip, control and shell must still read as different roles; restore CMF and the visual emphasis must follow the same role hierarchy.</text><text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · real material, wet friction, stain resistance, cleaning chemistry, durability, manufacturing and ergonomics remain VALIDATION HOLD.</text>
</svg>