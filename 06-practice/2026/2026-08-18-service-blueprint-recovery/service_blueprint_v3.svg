<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3e5f59"/></marker><marker id="rec" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f786f"/></marker></defs><rect width="1800" height="1120" fill="#efede7"/><rect x="44" y="40" width="1712" height="1038" rx="18" fill="#fff" stroke="#d3d0c8"/><text x="82" y="102" font-family="Arial" font-size="29" font-weight="700">OLEANDER / SERVICE BLUEPRINT RECOVERY CALIBRATION</text><text x="82" y="137" font-family="Arial" font-size="13" fill="#666">C04 RETURN / NO-PHONE / OPERATOR-OPEN TRAINING · NO SLA CLAIM</text><text x="82" y="194" font-family="Arial" font-size="17" font-weight="700">C / STAGE-BOUND FAILURE + RECOVERY — KEEP FOR TRAINING</text><text x="82" y="220" font-family="Arial" font-size="12" fill="#777">Failures are injected at the stage where they occur; recovery is bound to visible action, backstage confirmation and owner interface.</text><rect x="190" y="255" width="288" height="44" fill="#edf1ee" stroke="#d4d1ca"/><text x="202" y="282" font-family="Arial" font-size="10" font-weight="700" fill="#40514d">01 / RETURN WINDOW</text><rect x="486" y="255" width="288" height="44" fill="#edf1ee" stroke="#d4d1ca"/><text x="498" y="282" font-family="Arial" font-size="10" font-weight="700" fill="#40514d">02 / DETECT</text><rect x="782" y="255" width="288" height="44" fill="#edf1ee" stroke="#d4d1ca"/><text x="794" y="282" font-family="Arial" font-size="10" font-weight="700" fill="#40514d">03 / INFORM</text><rect x="1078" y="255" width="288" height="44" fill="#edf1ee" stroke="#d4d1ca"/><text x="1090" y="282" font-family="Arial" font-size="10" font-weight="700" fill="#40514d">04 / HANDOFF</text><rect x="1374" y="255" width="288" height="44" fill="#edf1ee" stroke="#d4d1ca"/><text x="1386" y="282" font-family="Arial" font-size="10" font-weight="700" fill="#40514d">05 / RECOVER / EXIT</text><text x="82" y="331" font-family="Arial" font-size="10" font-weight="700" fill="#53625e">VISITOR</text><line x1="82" y1="424" x2="1680" y2="424" stroke="#e0ddd5"/><text x="82" y="456" font-family="Arial" font-size="10" font-weight="700" fill="#53625e">FRONTSTAGE</text><line x1="82" y1="549" x2="1680" y2="549" stroke="#e0ddd5"/><text x="82" y="581" font-family="Arial" font-size="10" font-weight="700" fill="#53625e">BACKSTAGE</text><line x1="82" y1="674" x2="1680" y2="674" stroke="#e0ddd5"/><text x="82" y="706" font-family="Arial" font-size="10" font-weight="700" fill="#53625e">SUPPORT / OWNER</text><line x1="82" y1="799" x2="1680" y2="799" stroke="#e0ddd5"/><text x="82" y="831" font-family="Arial" font-size="10" font-weight="700" fill="#7a5148">FAILURE / RECOVERY</text><line x1="82" y1="924" x2="1680" y2="924" stroke="#e0ddd5"/><g><rect x="200" y="319" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="200" y="319" width="6" height="62" rx="3" fill="#315b61"/><text x="216" y="343" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">CHECK RETURN</text><text x="216" y="362" font-family="Arial" font-size="9" fill="#555">paper / sign / service</text></g><g><rect x="496" y="319" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="496" y="319" width="6" height="62" rx="3" fill="#315b61"/><text x="512" y="343" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">NOTICE CHANGE</text><text x="512" y="362" font-family="Arial" font-size="9" fill="#555">needs trustworthy state</text></g><g><rect x="792" y="319" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="792" y="319" width="6" height="62" rx="3" fill="#315b61"/><text x="808" y="343" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">UNDERSTAND CHOICE</text><text x="808" y="362" font-family="Arial" font-size="9" fill="#555">continue / pause / return</text></g><g><rect x="1088" y="319" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1088" y="319" width="6" height="62" rx="3" fill="#315b61"/><text x="1104" y="343" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">FOLLOW HANDOFF</text><text x="1104" y="362" font-family="Arial" font-size="9" fill="#555">staff / physical route</text></g><g><rect x="1384" y="319" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1384" y="319" width="6" height="62" rx="3" fill="#315b61"/><text x="1400" y="343" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">COMPLETE RETURN</text><text x="1400" y="362" font-family="Arial" font-size="9" fill="#555">or exit optional content</text></g><g><rect x="200" y="444" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="200" y="444" width="6" height="62" rx="3" fill="#4d6e68"/><text x="216" y="468" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">SERVICE CUE</text><text x="216" y="487" font-family="Arial" font-size="9" fill="#555">RETURN remains visible</text></g><g><rect x="496" y="444" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="496" y="444" width="6" height="62" rx="3" fill="#4d6e68"/><text x="512" y="468" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">STATE MESSAGE</text><text x="512" y="487" font-family="Arial" font-size="9" fill="#555">known / unknown / closed</text></g><g><rect x="792" y="444" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="792" y="444" width="6" height="62" rx="3" fill="#4d6e68"/><text x="808" y="468" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">PLAIN ACTION</text><text x="808" y="487" font-family="Arial" font-size="9" fill="#555">what to do now</text></g><g><rect x="1088" y="444" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1088" y="444" width="6" height="62" rx="3" fill="#4d6e68"/><text x="1104" y="468" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">HUMAN SUPPORT</text><text x="1104" y="487" font-family="Arial" font-size="9" fill="#555">staff / paper / signage</text></g><g><rect x="1384" y="444" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1384" y="444" width="6" height="62" rx="3" fill="#4d6e68"/><text x="1400" y="468" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">CONFIRMATION</text><text x="1400" y="487" font-family="Arial" font-size="9" fill="#555">return path stays legible</text></g><g><rect x="200" y="569" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="200" y="569" width="6" height="62" rx="3" fill="#6c7874"/><text x="216" y="593" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">MONITOR WINDOW</text><text x="216" y="612" font-family="Arial" font-size="9" fill="#555">schedule / condition input</text></g><g><rect x="496" y="569" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="496" y="569" width="6" height="62" rx="3" fill="#6c7874"/><text x="512" y="593" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">CONFIRM STATE</text><text x="512" y="612" font-family="Arial" font-size="9" fill="#555">operator verification</text></g><g><rect x="792" y="569" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="792" y="569" width="6" height="62" rx="3" fill="#6c7874"/><text x="808" y="593" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">PUBLISH UPDATE</text><text x="808" y="612" font-family="Arial" font-size="9" fill="#555">one canonical state</text></g><g><rect x="1088" y="569" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1088" y="569" width="6" height="62" rx="3" fill="#6c7874"/><text x="1104" y="593" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">MANUAL TAKEOVER</text><text x="1104" y="612" font-family="Arial" font-size="9" fill="#555">resolve mismatch / outage</text></g><g><rect x="1384" y="569" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1384" y="569" width="6" height="62" rx="3" fill="#6c7874"/><text x="1400" y="593" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">CLOSE LOOP</text><text x="1400" y="612" font-family="Arial" font-size="9" fill="#555">record outcome / update</text></g><g><rect x="200" y="694" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="200" y="694" width="6" height="62" rx="3" fill="#8b8174"/><text x="216" y="718" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">RULES</text><text x="216" y="737" font-family="Arial" font-size="9" fill="#555">return / service policy</text></g><g><rect x="496" y="694" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="496" y="694" width="6" height="62" rx="3" fill="#8b8174"/><text x="512" y="718" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">DATA SOURCE</text><text x="512" y="737" font-family="Arial" font-size="9" fill="#555">operator input / device</text></g><g><rect x="792" y="694" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="792" y="694" width="6" height="62" rx="3" fill="#8b8174"/><text x="808" y="718" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">OWNERSHIP</text><text x="808" y="737" font-family="Arial" font-size="9" fill="#555">update owner = OPEN</text></g><g><rect x="1088" y="694" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1088" y="694" width="6" height="62" rx="3" fill="#8b8174"/><text x="1104" y="718" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">CAPACITY</text><text x="1104" y="737" font-family="Arial" font-size="9" fill="#555">staff / transport = OPEN</text></g><g><rect x="1384" y="694" width="266" height="62" rx="8" fill="#fff" stroke="#c9c6be"/><rect x="1384" y="694" width="6" height="62" rx="3" fill="#8b8174"/><text x="1400" y="718" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">FEEDBACK</text><text x="1400" y="737" font-family="Arial" font-size="9" fill="#555">incident learning</text></g><path d="M240 399 H1604" stroke="#3e5f59" stroke-width="4" fill="none" marker-end="url(#arr)"/><g><rect x="200" y="819" width="266" height="70" rx="8" fill="#fffaf8" stroke="#c9c6be"/><rect x="200" y="819" width="6" height="70" rx="3" fill="#8a554c"/><text x="216" y="843" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">FATIGUE</text><text x="216" y="862" font-family="Arial" font-size="9" fill="#555">pause before return</text></g><text x="216" y="879" font-family="Arial" font-size="8" fill="#777">optional content OFF</text><g><rect x="496" y="819" width="266" height="70" rx="8" fill="#fffaf8" stroke="#c9c6be"/><rect x="496" y="819" width="6" height="70" rx="3" fill="#8a554c"/><text x="512" y="843" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">NO NETWORK</text><text x="512" y="862" font-family="Arial" font-size="9" fill="#555">physical cue + staff</text></g><text x="512" y="879" font-family="Arial" font-size="8" fill="#777">digital suspends</text><g><rect x="792" y="819" width="266" height="70" rx="8" fill="#fffaf8" stroke="#c9c6be"/><rect x="792" y="819" width="6" height="70" rx="3" fill="#8a554c"/><text x="808" y="843" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">UNKNOWN STATE</text><text x="808" y="862" font-family="Arial" font-size="9" fill="#555">do not imply open</text></g><text x="808" y="879" font-family="Arial" font-size="8" fill="#777">manual confirm</text><g><rect x="1088" y="819" width="266" height="70" rx="8" fill="#fffaf8" stroke="#c9c6be"/><rect x="1088" y="819" width="6" height="70" rx="3" fill="#8a554c"/><text x="1104" y="843" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">MISSED HANDOFF</text><text x="1104" y="862" font-family="Arial" font-size="9" fill="#555">inform + redirect</text></g><text x="1104" y="879" font-family="Arial" font-size="8" fill="#777">owner / capacity TBD</text><g><rect x="1384" y="819" width="266" height="70" rx="8" fill="#fffaf8" stroke="#c9c6be"/><rect x="1384" y="819" width="6" height="70" rx="3" fill="#8a554c"/><text x="1400" y="843" font-family="Arial" font-size="10" font-weight="700" fill="#1d2523">RECOVER</text><text x="1400" y="862" font-family="Arial" font-size="9" fill="#555">return / exit safely</text></g><text x="1400" y="879" font-family="Arial" font-size="8" fill="#777">record + learn</text><path d="M629 631 V809" stroke="#9a5f55" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M925 631 V809" stroke="#9a5f55" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M1221 631 V809" stroke="#9a5f55" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M696 901 H1554" stroke="#4f786f" stroke-width="2" fill="none" marker-end="url(#rec)"/><text x="830" y="919" font-family="Arial" font-size="8" font-weight="700" fill="#4f786f">INFORM → MANUAL SUPPORT → RETURN / EXIT</text><rect x="190" y="931" width="1480" height="46" rx="8" fill="#f8f7f3" stroke="#d3d0c8"/><text x="208" y="950" font-family="Arial" font-size="9" font-weight="700" fill="#365e57">CAUSALITY CONTRACT</text><text x="208" y="967" font-family="Arial" font-size="9" fill="#555">Actor/task → frontstage state → backstage confirmation → support/owner → failure injection → recovery → feedback. OPEN owner/capacity stays OPEN; no invented SLA.</text><line x1="82" y1="1010" x2="1680" y2="1010" stroke="#d4d1ca"/><text x="82" y="1042" font-family="Arial" font-size="10" fill="#777">SOURCE / C04 v0.2 CH09-P06 + FW-SERVICE-DESIGN-001 · FIELD OBSERVED=0 · FIELD MEASURED=0 · G1F HOLD · NO_PROMOTION · NTS.</text></svg>