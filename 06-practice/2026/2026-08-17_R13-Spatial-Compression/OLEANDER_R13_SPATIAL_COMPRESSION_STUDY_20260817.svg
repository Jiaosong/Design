<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f3f1eb"/>
<style>
text{font-family:"Noto Sans CJK SC","Noto Sans SC","Arial",sans-serif;fill:#171a18}
.meta{font-size:17px;letter-spacing:1.3px;fill:#666b67}
.h1{font-size:42px;font-weight:720}
.h2{font-size:26px;font-weight:700}
.body{font-size:20px}
.small{font-size:15px;fill:#686d69}
.rule{stroke:#afb3ae;stroke-width:1}
