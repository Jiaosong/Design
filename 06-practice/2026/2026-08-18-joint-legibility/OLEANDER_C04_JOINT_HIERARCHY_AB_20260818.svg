<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'>
<rect width='1600' height='1000' fill='#F3F1EA'/>
<style>
text{font-family:Arial,sans-serif;fill:#18201D}.m{font-size:16px;fill:#69706C}.h1{font-size:38px;font-weight:700}.h2{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:14px;fill:#69706C}
.p{fill:#FFFDF8;stroke:#D6D3CB;stroke-width:1.5}.pa{fill:#D8D4C8}.pb{fill:#AEB5AD}.pc{fill:#6A716D}.primary{stroke:#252B29;stroke-width:8}.secondary{stroke:#69706C;stroke-width:3}.tertiary{stroke:#A9AEA8;stroke-width:1.5}.void{fill:#F3F1EA}.accent{fill:#9D7447}
</style>
<text x='72' y='54' class='m'>OLEANDER / C04 R06 / TECHNICAL DETAIL TRAINING</text>
<text x='72' y='100' class='h1'>Joint hierarchy must come from relationships, not black outlines everywhere</text>
<text x='72' y='132' class='b'>Carlo Scarpa / Castelvecchio → R06 detail-communication transfer</text>
<line x1='72' y1='158' x2='1528' y2='158' stroke='#BDC2BC'/>
<rect x='72' y='184' width='1456' height='108' rx='18' fill='#E8E5DD'/>
<text x='96' y='216' class='m'>VISIBLE FACT — CASTELVECCHIO</text>
<text x='96' y='248' class='b'>Masonry, concrete, metal and timber remain visibly distinct at interfaces.</text>
<text x='96' y='276' class='s'>Official Scarpa Archive preserves restoration/display drawings and construction records; this is a transfer study, not a copied detail.</text>
<text x='930' y='216' class='m'>TRANSFER RULE</text>
<text x='930' y='248' class='b'>Define component identity and the joint before emphasizing lineweight.</text>
<text x='930' y='276' class='s'>Joint / reveal / setback / termination → then annotation hierarchy.</text>
<text x='84' y='344' class='m'>A — OUTLINE-EVERYTHING / REVISE</text>
<rect x='72' y='366' width='700' height='468' rx='24' class='p'/>
<text x='102' y='405' class='h2'>Everything is outlined; the interface itself is not legible</text>
<rect x='132' y='474' width='430' height='78' class='pa' stroke='#252B29' stroke-width='5'/>
<rect x='132' y='552' width='430' height='72' class='pb' stroke='#252B29' stroke-width='5'/>
<rect x='132' y='624' width='430' height='92' class='pc' stroke='#252B29' stroke-width='5'/>
<rect x='562' y='502' width='76' height='214' fill='#C0B8AA' stroke='#252B29' stroke-width='5'/>
<rect x='540' y='532' width='22' height='42' class='accent' stroke='#252B29' stroke-width='5'/>
<rect x='540' y='646' width='22' height='42' class='accent' stroke='#252B29' stroke-width='5'/>
<g stroke='#252B29' stroke-width='3'>
<line x1='170' y1='474' x2='170' y2='716'/><line x1='246' y1='474' x2='246' y2='716'/><line x1='322' y1='474' x2='322' y2='716'/><line x1='398' y1='474' x2='398' y2='716'/><line x1='474' y1='474' x2='474' y2='716'/>
</g>
<text x='132' y='764' class='s'>Primary member / secondary layer / pad / termination / background all compete with the same black edge.</text>
<text x='132' y='792' class='s'>Near-read contains many lines, but the critical interface is still ambiguous.</text>
<text x='842' y='344' class='m'>B — JOINT-FIRST HIERARCHY / PROPOSED</text>
<rect x='830' y='366' width='698' height='468' rx='24' class='p'/>
<text x='860' y='405' class='h2'>Component identities first; key joints become visible</text>
<rect x='890' y='474' width='412' height='72' class='pa'/>
<line x1='890' y1='474' x2='1302' y2='474' class='primary'/><line x1='890' y1='546' x2='1302' y2='546' class='primary'/>
<rect x='890' y='546' width='412' height='12' class='void'/>
<text x='1018' y='540' class='s'>REVEAL</text>
<rect x='890' y='558' width='412' height='58' class='pb'/>
<line x1='890' y1='558' x2='1302' y2='558' class='secondary'/><line x1='890' y1='616' x2='1302' y2='616' class='secondary'/>
<rect x='890' y='616' width='412' height='16' class='void'/>
<rect x='890' y='632' width='412' height='84' class='pc'/>
<line x1='890' y1='632' x2='1302' y2='632' class='secondary'/>
<rect x='1326' y='500' width='64' height='216' fill='#C0B8AA'/>
<line x1='1326' y1='500' x2='1326' y2='716' class='primary'/><line x1='1390' y1='500' x2='1390' y2='716' class='primary'/>
<rect x='1302' y='528' width='24' height='34' class='accent'/><rect x='1302' y='650' width='24' height='34' class='accent'/>
<line x1='1302' y1='528' x2='1326' y2='528' class='secondary'/><line x1='1302' y1='562' x2='1326' y2='562' class='secondary'/>
<line x1='1302' y1='650' x2='1326' y2='650' class='secondary'/><line x1='1302' y1='684' x2='1326' y2='684' class='secondary'/>
<rect x='1294' y='474' width='8' height='242' fill='#3A403D'/>
<text x='1168' y='742' class='s'>termination shadow line</text>
<text x='890' y='792' class='s'>The goal is not fewer lines; each line now has a job: CUT / JOINT / EDGE / NOTE.</text>
<line x1='72' y1='878' x2='1528' y2='878' stroke='#BDC2BC'/>
<text x='72' y='912' class='m'>JOINT LEGIBILITY GATE</text>
<text x='72' y='946' class='b'>In grayscale, can reveal, setback, termination and line hierarchy still tell what is primary, attached and critical?</text>
<text x='72' y='980' class='s'>RELATIONAL TRAINING / NOT RELEASE DETAIL / NO NEW C04 DIMENSIONS / NTS / FIELD OPEN / R06 DESIGN REMAINS FROZEN.</text>
</svg>