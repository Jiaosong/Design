<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><rect width="1800" height="1080" fill="#efede7"/><rect x="42" y="40" width="1716" height="1000" rx="18" fill="#fff" stroke="#d4d1ca"/><text x="88" y="104" font-family="Arial" font-size="29" font-weight="700">OLEANDER / ROUTE STATE SEMANTICS CALIBRATION</text><text x="88" y="140" font-family="Arial" font-size="13" fill="#666">SAME ROUTE · SAME TOPOLOGY · STATE ENCODING ONLY</text><text x="88" y="202" font-family="Arial" font-size="17" font-weight="700">A / COLOR-ONLY STATE — REJECT</text><text x="88" y="228" font-family="Arial" font-size="12" fill="#777">Four operational states differ mainly by hue; grayscale collapses their meaning.</text><rect x="88" y="260" width="760" height="635" fill="#f8f8f5" stroke="#d0cec7"/><path d="M88 705 C240 590 350 660 485 535 S720 580 850 440" fill="none" stroke="#dfe6e2" stroke-width="90" stroke-linecap="round"/><path d="M130 650 C260 585 350 610 445 535" fill="none" stroke="#42a86b" stroke-width="14"/><path d="M445 535 C560 490 645 520 700 460" fill="none" stroke="#d6a23a" stroke-width="14"/><path d="M700 460 C755 420 790 400 820 375" fill="none" stroke="#cb4b4b" stroke-width="14"/><path d="M820 375 C830 366 840 356 850 346" fill="none" stroke="#7d7d86" stroke-width="14"/><g font-family="Arial" font-size="11"><circle cx="130" cy="650" r="12" fill="#42a86b"/><text x="150" y="655">NORMAL</text><circle cx="445" cy="535" r="12" fill="#d6a23a"/><text x="465" y="540">DEGRADED</text><circle cx="700" cy="460" r="12" fill="#cb4b4b"/><text x="720" y="465">CLOSED</text><circle cx="820" cy="375" r="12" fill="#7d7d86"/><text x="840" y="380">UNKNOWN</text></g><text x="118" y="850" font-family="Arial" font-size="11" fill="#666">Failure: hue carries almost all meaning; CLOSED and UNKNOWN weaken under grayscale / low-attention reading.</text><text x="936" y="202" font-family="Arial" font-size="17" font-weight="700">B / MULTI-CHANNEL STATE — KEEP</text><text x="936" y="228" font-family="Arial" font-size="12" fill="#777">Color is redundant. Stroke pattern, marker form and endpoint treatment carry state meaning too.</text><rect x="936" y="260" width="776" height="635" fill="#f8f8f5" stroke="#d0cec7"/><path d="M936 705 C1088 590 1198 660 1333 535 S1568 580 1698 440" fill="none" stroke="#dfe6e2" stroke-width="90" stroke-linecap="round"/><path d="M978 650 C1090 590 1180 610 1275 535" fill="none" stroke="#3e8b61" stroke-width="14"/><path d="M1275 535 C1388 490 1470 520 1525 460" fill="none" stroke="#9b7a38" stroke-width="14" stroke-dasharray="22 10"/><path d="M1525 460 C1580 420 1620 400 1650 375" fill="none" stroke="#9b4444" stroke-width="14" stroke-dasharray="4 12"/><path d="M1650 375 C1665 365 1680 352 1698 338" fill="none" stroke="#62676f" stroke-width="7" stroke-dasharray="1 13" opacity=".48"/><circle cx="978" cy="650" r="13" fill="#fff" stroke="#2e5c46" stroke-width="5"/><rect x="1263" y="523" width="24" height="24" rx="5" fill="#fff" stroke="#7f642d" stroke-width="5"/><g transform="translate(1525 460)"><circle r="16" fill="#fff" stroke="#783838" stroke-width="5"/><path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#783838" stroke-width="4"/></g><g transform="translate(1650 375)"><circle r="15" fill="#fff" stroke="#555b62" stroke-width="4" stroke-dasharray="3 4"/><text x="-4" y="5" font-family="Arial" font-size="14" font-weight="700" fill="#555b62">?</text></g><line x1="1662" y1="350" x2="1637" y2="400" stroke="#783838" stroke-width="5"/><text x="1610" y="422" font-family="Arial" font-size="10" font-weight="700" fill="#783838">NO FORWARD ROUTE</text><g font-family="Arial"><text x="1010" y="655" font-size="11" font-weight="700">NORMAL</text><text x="1010" y="674" font-size="10" fill="#666">solid / circle</text><text x="1305" y="540" font-size="11" font-weight="700">DEGRADED</text><text x="1305" y="559" font-size="10" fill="#666">long dash / square</text><text x="1548" y="446" font-size="11" font-weight="700">CLOSED</text><text x="1548" y="465" font-size="10" fill="#666">broken / X / hard stop</text><text x="1565" y="310" font-size="11" font-weight="700">UNKNOWN</text><text x="1565" y="329" font-size="10" fill="#666">uncertain / do not assume open</text></g><text x="966" y="850" font-family="Arial" font-size="11" fill="#666">Topology is unchanged. State semantics alter interpretation, not route geometry.</text><line x1="88" y1="952" x2="1712" y2="952" stroke="#d3d0c8"/><text x="88" y="992" font-family="Arial" font-size="13" font-weight="700">TRANSFER RULE /</text><text x="210" y="992" font-family="Arial" font-size="13" fill="#333">Operational state must survive without hue: pair color with pattern, marker form, text and endpoint behavior; UNKNOWN must never look safely open.</text></svg>