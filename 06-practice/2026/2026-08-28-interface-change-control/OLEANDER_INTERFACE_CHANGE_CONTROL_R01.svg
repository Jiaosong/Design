<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / DESIGN ↔ VALIDATION INTERFACE CHANGE CONTROL</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">验证发现约束时，不能静默改设计；必须把“改什么、影响什么、谁批准”送回同一对象</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic folding interface · training-only · external calibration: NASA requirements/interface management · no engineering approval claimed</text>
<rect x="88" y="208" width="1744" height="116" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="116" y="242" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text><text x="116" y="270" font-size="14" fill="#29332F">设计要求：折叠后外缘齐平；转轴位置保持用户抓握净空。</text><text x="520" y="242" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text><text x="520" y="270" font-size="14" fill="#29332F">验证若发现轴位不可实现，调整轴位会同时改变齐平关系与抓握净空。</text><text x="1086" y="242" font-size="12" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text><text x="1086" y="270" font-size="14" fill="#29332F">验证方提出轴心 +8 mm 才能满足其技术约束。</text><text x="1492" y="242" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1492" y="270" font-size="14" fill="#29332F">变更必须返回 Design Owner 处置；不得由验证方静默吸收。</text></g>
<rect x="88" y="352" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · SILENT VALIDATOR EDIT</text><text x="120" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">验证方为了让结构成立，直接把轴心向右移动；PASS 了技术检查，却改掉设计关系。</text>
<g transform="translate(138,486)"><rect x="0" y="0" width="430" height="220" rx="16" fill="#F7F3EA"/><text x="20" y="30" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">DESIGN MASTER</text><path d="M50 128 H184 V70 H270 V128 H378" fill="none" stroke="#6B736F" stroke-width="18" stroke-linejoin="round"/><circle cx="227" cy="128" r="13" fill="#315D57"/><line x1="227" y1="92" x2="227" y2="166" stroke="#315D57" stroke-width="2" stroke-dasharray="6 5"/><text x="194" y="188" font-family="Arial,sans-serif" font-size="10.5" fill="#315D57">PIVOT P0</text><text x="24" y="208" font-family="Arial,sans-serif" font-size="10" fill="#59615F">I1 flush edge · I2 grip clearance</text></g>
<path d="M360 718 V752" stroke="#914F3D" stroke-width="3"/><path d="M360 752 l-8 -12 h16 z" fill="#914F3D"/><rect x="176" y="764" width="370" height="78" rx="12" fill="#F7F3EA" stroke="#914F3D" stroke-width="2"/><text x="198" y="792" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" font-weight="700" fill="#914F3D">VALIDATION OUTPUT · “P0 + 8 mm”</text><text x="198" y="818" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">直接改 master → 标记 PASS；没有 impacted invariant / change authority。</text><text x="120" y="876" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">ROOT · validation result became unauthorized design authorship.</text>
<rect x="686" y="352" width="636" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="718" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · TRACEABLE INTERFACE CHANGE REQUEST</text><text x="718" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">验证方拥有“发现问题与提出证据”的权力；设计方拥有“改变设计 invariant”的处置权。</text>
<rect x="718" y="472" width="250" height="116" rx="14" fill="#F7F3EA"/><text x="738" y="500" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315D57">DESIGN HANDOFF</text><text x="738" y="526" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">REQ R1 · folded edge flush</text><text x="738" y="548" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">INV I1 · edge relation</text><text x="738" y="570" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">INV I2 · grip clearance</text>
<rect x="1040" y="472" width="250" height="116" rx="14" fill="#F7F3EA"/><text x="1060" y="500" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#8A6941">VALIDATION FINDING</text><text x="1060" y="526" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">F1 · P0 infeasible under test constraint</text><text x="1060" y="548" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">PROPOSAL · P0 + 8 mm</text><text x="1060" y="570" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">EVIDENCE · validator-owned</text>
<path d="M968 530 H1040" stroke="#69716D" stroke-width="3"/><path d="M1040 530 l-10 -7 v14 z" fill="#69716D"/>
<rect x="886" y="626" width="276" height="134" rx="14" fill="#F7F3EA" stroke="#315D57" stroke-width="2"/><text x="906" y="654" font-family="Arial,sans-serif" font-size="10.6" font-weight="700" fill="#315D57">INTERFACE CHANGE REQUEST · CR-01</text><text x="906" y="680" font-family="Arial,sans-serif" font-size="10.2" fill="#59615F">SOURCE: F1 / proposed P0 + 8 mm</text><text x="906" y="702" font-family="Arial,sans-serif" font-size="10.2" fill="#59615F">IMPACT: I1 + I2 / requirement R1</text><text x="906" y="724" font-family="Arial,sans-serif" font-size="10.2" fill="#59615F">AUTHORITY: DESIGN OWNER</text><text x="906" y="746" font-family="Arial,sans-serif" font-size="10.2" fill="#59615F">RETURN: ACCEPT / REJECT / ALT / HOLD</text>
<rect x="718" y="638" width="144" height="102" rx="12" fill="#F7F3EA" stroke="#315D57" stroke-width="2"/><text x="736" y="664" font-family="Arial,sans-serif" font-size="9.8" font-weight="700" fill="#315D57">DESIGN DISPOSITION</text><text x="736" y="688" font-family="Arial,sans-serif" font-size="9.4" fill="#59615F">approve / reject / alt</text><text x="736" y="710" font-family="Arial,sans-serif" font-size="9.4" fill="#59615F">issue revised master</text><text x="736" y="732" font-family="Arial,sans-serif" font-size="9.4" fill="#59615F">or retain HOLD</text>
<path d="M1164 588 V610 C1164 620 1154 632 1144 640" fill="none" stroke="#8A6941" stroke-width="3"/><path d="M886 692 H862" fill="none" stroke="#315D57" stroke-width="3"/><path d="M862 692 l10 -7 v14 z" fill="#315D57"/><path d="M790 638 V606 C790 594 780 588 770 588" fill="none" stroke="#315D57" stroke-width="3"/><path d="M770 588 l10 -7 v14 z" fill="#315D57"/>
<text x="718" y="804" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#315D57">PARTIAL PASS ATTACK → 若 I1 可保、I2 失败，返回必须定位到 exact invariant，而不是整对象“REVISE”。</text><text x="718" y="832" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#315D57">AUTHORITY ATTACK → validator 可建议 alternative；不能无授权更新 design master。</text><rect x="718" y="850" width="572" height="30" rx="9" fill="#F7F3EA"/><text x="738" y="870" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">bidirectional trace: R1 ↔ I1/I2 ↔ F1 ↔ CR-01 ↔ disposition ↔ revised master</text>
<rect x="1354" y="352" width="478" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="1386" y="396" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · FROZEN DESIGN, NO FEEDBACK</text><text x="1386" y="426" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">把 invariant 理解成“不可讨论”；验证只能 PASS/HOLD，无法提出有证据的替代。</text>
<rect x="1386" y="486" width="414" height="92" rx="14" fill="#F7F3EA"/><text x="1408" y="516" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315D57">DESIGN</text><text x="1408" y="542" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">P0 locked · no change request allowed</text><path d="M1590 578 V634" stroke="#8A6941" stroke-width="3"/><rect x="1386" y="634" width="414" height="92" rx="14" fill="#F7F3EA"/><text x="1408" y="664" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#8A6941">VALIDATION</text><text x="1408" y="690" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">constraint conflict → HOLD forever</text>
<text x="1386" y="770" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#8A6941">CONFLICT ATTACK → 技术证据存在，但没有合法路径反馈进设计。</text><text x="1386" y="798" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.5" fill="#8A6941">REPAIR → invariant 可受控修改；不能被静默修改，也不能被永久冻结。</text><rect x="1386" y="840" width="414" height="42" rx="10" fill="#F7F3EA"/><text x="1406" y="866" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">control change authority, not discussion itself.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="290" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">When validation proposes a design-changing constraint, can you trace requirement → invariant → finding → change request → authorized disposition without silently changing the master?</text><text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · this controls design/validation authorship and traceability only; it does not prove the validator method, dimensions, structure, safety, field truth or engineering approval.</text>
</svg>