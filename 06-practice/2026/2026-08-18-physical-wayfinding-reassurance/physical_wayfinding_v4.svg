<line x1="88" y1="952" x2="1712" y2="952" stroke="#d3d0c8"/><text x="88" y="992" font-family="Arial" font-size="13" font-weight="700">TRANSFER RULE /</text><text x="210" y="992" font-family="Arial" font-size="13" fill="#333">Physical wayfinding should answer the smallest necessary question at the exact place it arises. Reassurance is not another interpretive board.</text><text x="88" y="1028" font-family="Arial" font-size="11" fill="#777">Calibration only. Exact mounting height, dimensions, materials, foundations, tactile content and code compliance require project-specific verification.</text></svg>