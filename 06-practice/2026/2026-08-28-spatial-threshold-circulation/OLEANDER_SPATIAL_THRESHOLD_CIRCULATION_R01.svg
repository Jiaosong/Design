<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / SPATIAL THRESHOLD + CIRCULATION</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">门槛不是“做一个入口造型”；它必须把行为判断发生的时间和位置提前</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic NTS circulation study · no site / egress / accessibility / crowd-capacity claim</text>
<rect x="88" y="212" width="1744" height="110" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="118" y="246" font-size="12" font-weight="700" fill="#8B5D46">EVIDENCE</text><text x="118" y="274" font-size="14" fill="#29332F">两条流线在同一开口前才出现分叉。</text>
<text x="510" y="246" font-size="12" font-weight="700" fill="#7D654B">INFERENCE</text><text x="510" y="274" font-size="14" fill="#29332F">使用者必须接近冲突点后才判断方向。</text>
<text x="968" y="246" font-size="12" font-weight="700" fill="#7D654B">ASSUMPTION / ATTACK</text><text x="968" y="274" font-size="14" fill="#29332F">对向流出现时，晚判断会增加交叉与回头。</text>
<text x="1450" y="246" font-size="12" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text><text x="1450" y="274" font-size="14" fill="#29332F">把选择门槛前移，并让空间形态先分流。</text></g>
<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="122" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · FLUSH GATE</text><text x="122" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">入口很完整，但选择发生在门内；形式没有改变决策时序。</text><text x="122" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / SIGNAGE OFF</text>
<path d="M150 610 H340" stroke="#D5CFC3" stroke-width="46" stroke-linecap="round"/><path d="M340 610 C410 610 450 552 520 522" stroke="#D5CFC3" stroke-width="46" fill="none" stroke-linecap="round"/><path d="M340 610 C410 610 450 668 520 700" stroke="#D5CFC3" stroke-width="46" fill="none" stroke-linecap="round"/><rect x="326" y="518" width="28" height="188" fill="#7A817D"/><rect x="370" y="518" width="28" height="188" fill="#7A817D"/>
<path d="M150 602 H326 C375 602 420 555 500 532" stroke="#8B5D46" stroke-width="5" fill="none" marker-end="url(#arr)"/><path d="M500 690 C430 670 390 623 326 623 H160" stroke="#315D57" stroke-width="5" fill="none"/><circle cx="345" cy="611" r="30" fill="none" stroke="#914F3D" stroke-width="3"/><text x="292" y="753" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#914F3D">冲突点 = 选择点</text><text x="122" y="790" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION</text><line x1="140" y1="850" x2="558" y2="850" stroke="#6D7571" stroke-width="3"/><rect x="318" y="788" width="26" height="62" fill="#7A817D"/><rect x="382" y="788" width="26" height="62" fill="#7A817D"/><text x="122" y="880" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">DELETE SIGNAGE → 空间仍不提示左右选择。</text>
<rect x="686" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="720" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · STAGED THRESHOLD</text><text x="720" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">压缩发生在分叉前；墙体和开口提前暴露两个去向，先分流再通过。</text><text x="720" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / SIGNAGE OFF</text>
<path d="M748 610 H870" stroke="#D5CFC3" stroke-width="46" stroke-linecap="round"/><path d="M870 610 C925 588 960 540 1068 516" stroke="#D5CFC3" stroke-width="42" fill="none" stroke-linecap="round"/><path d="M870 610 C925 632 960 680 1068 704" stroke="#D5CFC3" stroke-width="42" fill="none" stroke-linecap="round"/><path d="M854 522 L920 552" stroke="#7A817D" stroke-width="20" stroke-linecap="round"/><path d="M854 698 L920 668" stroke="#7A817D" stroke-width="20" stroke-linecap="round"/><path d="M750 598 H840 C884 592 922 548 1040 522" stroke="#8B5D46" stroke-width="5" fill="none"/><path d="M1040 698 C922 672 884 628 840 622 H750" stroke="#315D57" stroke-width="5" fill="none"/><line x1="842" y1="568" x2="842" y2="654" stroke="#315D57" stroke-width="2" stroke-dasharray="7 5"/><text x="782" y="752" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">选择点前移，冲突点被拆开</text><text x="720" y="782" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION / COMPRESSION → RELEASE</text><line x1="738" y1="850" x2="1156" y2="850" stroke="#6D7571" stroke-width="3"/><path d="M760 806 H836 L866 824 H926 L970 792 H1128" fill="none" stroke="#707874" stroke-width="12" stroke-linejoin="round"/><line x1="866" y1="824" x2="866" y2="850" stroke="#A59E91" stroke-width="2" stroke-dasharray="5 5"/><line x1="926" y1="824" x2="926" y2="850" stroke="#A59E91" stroke-width="2" stroke-dasharray="5 5"/><text x="842" y="842" font-family="Arial,sans-serif" font-size="9.5" fill="#315D57">COMPRESS</text><text x="978" y="808" font-family="Arial,sans-serif" font-size="9.5" fill="#315D57">RELEASE</text><text x="720" y="880" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#315D57">OPPOSING-FLOW ATTACK → 两条路径在门槛前已分离。</text>
<rect x="1284" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/><text x="1318" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · MONUMENTAL CENTER GATE</text><text x="1318" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">识别很强，但把两股流先汇聚到“主门”，反而放大晚分流。</text><text x="1318" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">PLAN / LANDMARK ATTACK</text><path d="M1345 610 H1510" stroke="#D5CFC3" stroke-width="46" stroke-linecap="round"/><path d="M1510 610 C1570 610 1608 552 1760 514" stroke="#D5CFC3" stroke-width="46" fill="none" stroke-linecap="round"/><path d="M1510 610 C1570 610 1608 668 1760 706" stroke="#D5CFC3" stroke-width="46" fill="none" stroke-linecap="round"/><path d="M1458 518 Q1510 452 1562 518 V700 H1458 Z" fill="#B6B0A4" stroke="#707874" stroke-width="3"/><rect x="1482" y="548" width="56" height="152" fill="#F2EFE7"/><path d="M1348 598 H1490 C1550 590 1605 548 1736 520" stroke="#8B5D46" stroke-width="5" fill="none"/><path d="M1736 700 C1605 672 1550 630 1490 622 H1348" stroke="#315D57" stroke-width="5" fill="none"/><circle cx="1510" cy="610" r="32" fill="none" stroke="#8A6941" stroke-width="3"/><text x="1452" y="752" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#8A6941">Landmark 强，行为时序仍晚</text><text x="1318" y="790" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION / HERO PORTAL</text><line x1="1336" y1="850" x2="1754" y2="850" stroke="#6D7571" stroke-width="3"/><path d="M1456 850 V770 Q1510 710 1564 770 V850" fill="#B6B0A4" stroke="#707874" stroke-width="2"/><text x="1318" y="880" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#8A6941">REPAIR → landmark 可保留，但必须让选择先于汇聚发生。</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#8B5D46"/></marker></defs>
<line x1="88" y1="952" x2="1832" y2="952" stroke="#BDB6A8" stroke-width="2"/><text x="88" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">ROOT CAUSE / REPAIR</text><text x="330" y="992" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">threshold prominence ≠ decision sequencing · repair = move the behavioral decision upstream, then use massing/section to make that choice legible without signage.</text><text x="88" y="1034" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no exit width, crowd simulation, fire egress, accessibility dimension, structure, field observation or project geometry is proven.</text></svg>