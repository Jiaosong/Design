<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="130" y="892" font-size="14" fill="#7D4A3B">Invalid repair: draw a fake river / add a Relation Mark that implies one.</text><text x="724" y="892" font-size="14" fill="#4F5A56">Repair path 1: keep media authority; narrow the observation claim.</text><text x="1318" y="892" font-size="14" fill="#4F5A56">Repair path 2: keep claim; replace with source-bound media that shows it.</text></g>
<line x1="96" y1="966" x2="1824" y2="966" stroke="#BDB6A8" stroke-width="2"/><text x="96" y="1008" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="300" y="1008" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">Every noun, relation and action demanded by the prompt must be directly perceivable or explicitly marked as inference/unknown.</text><text x="96" y="1047" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Overlay cannot manufacture missing evidence. Prompt repair and media replacement are valid; evidence invention is not.</text>
