<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="96" y="76" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="23" letter-spacing="3" fill="#59615F">OLEANDER TRAINING / PRODUCT CMF / INTERACTION CUE ESCALATION</text>
<text x="96" y="132" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="48" font-weight="700" fill="#18211F">动作语义先由几何与触觉建立；颜色只能最后加权</text>
<text x="96" y="174" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#69706D">XJ01-inspired synthetic sleeve/head control study · training-only · no production geometry or physical validation claimed</text>
<rect x="96" y="226" width="790" height="686" rx="24" fill="#DDD8CC" stroke="#BDB6A8" stroke-width="2"/>
<text x="132" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#904F3D">REJECT / HUE-FIRST SIGNAL</text>
<text x="132" y="309" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">同一圆筒几何，只用亮色圈区分“滑动 / 拧压 / 释放”；视觉显眼，但动作方向没有被物体本身编码。</text>
<g transform="translate(178,390)"><rect x="0" y="0" width="575" height="118" rx="59" fill="#E7E4DD" stroke="#6E7773" stroke-width="3"/><rect x="235" y="0" width="96" height="118" fill="#D96B3F"/><line x1="331" y1="12" x2="331" y2="106" stroke="#6E7773" stroke-width="2"/><text x="230" y="153" font-family="Arial,sans-serif" font-size="14" fill="#7D4A3A">orange ring = ? slide / rotate / press / release</text></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><rect x="154" y="622" width="672" height="54" rx="10" fill="#F7F3EA"/><text x="176" y="654" font-size="15" fill="#7D4A3A">FAIL 1 · hue disappears → action cue disappears</text><rect x="154" y="692" width="672" height="54" rx="10" fill="#F7F3EA"/><text x="176" y="724" font-size="15" fill="#7D4A3A">FAIL 2 · local value boundary improves part distinction, not action semantics</text><rect x="154" y="762" width="672" height="54" rx="10" fill="#F7F3EA"/><text x="176" y="794" font-size="15" fill="#7D4A3A">FAIL 3 · rendering polish can make ambiguity look intentional</text></g>
<text x="132" y="864" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#7D4A3A">Hue / gloss / contrast is a salience amplifier, not a substitute for discoverable interaction structure.</text>
<rect x="934" y="226" width="890" height="686" rx="24" fill="#DDD8CC" stroke="#BDB6A8" stroke-width="2"/>
<text x="970" y="274" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#315D57">KEEP CANDIDATE / CUE ESCALATION LADDER</text>
<text x="970" y="309" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Geometry/state feedback → tactile/surface → marking → value → hue/chroma.</text>
<line x1="1010" y1="374" x2="1750" y2="374" stroke="#8D948F" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="13" fill="#56605C"><text x="994" y="352">1 GEOMETRY</text><text x="1150" y="352">2 TACTILE</text><text x="1292" y="352">3 MARK</text><text x="1438" y="352">4 VALUE</text><text x="1580" y="352">5 HUE</text></g><circle cx="1045" cy="374" r="7" fill="#315D57"/><circle cx="1195" cy="374" r="7" fill="#315D57"/><circle cx="1335" cy="374" r="7" fill="#315D57"/><circle cx="1480" cy="374" r="7" fill="#315D57"/><circle cx="1620" cy="374" r="7" fill="#8D6542"/>
<g transform="translate(1035,438)"><rect x="0" y="0" width="650" height="132" rx="66" fill="#E7E4DD" stroke="#59625E" stroke-width="3"/><rect x="236" y="-6" width="132" height="144" rx="30" fill="#D8D5CE" stroke="#59625E" stroke-width="3"/><g stroke="#7B817D" stroke-width="5"><line x1="257" y1="18" x2="257" y2="114"/><line x1="278" y1="18" x2="278" y2="114"/><line x1="299" y1="18" x2="299" y2="114"/><line x1="320" y1="18" x2="320" y2="114"/><line x1="341" y1="18" x2="341" y2="114"/></g><path d="M205 66 H160" stroke="#315D57" stroke-width="4"/><path d="M160 66 l14 -10 v20 z" fill="#315D57"/><path d="M399 66 H444" stroke="#315D57" stroke-width="4"/><path d="M444 66 l-14 -10 v20 z" fill="#315D57"/><circle cx="218" cy="66" r="6" fill="#315D57"/><circle cx="386" cy="66" r="6" fill="#315D57"/><path d="M284 -26 h36" stroke="#59625E" stroke-width="3"/><text x="272" y="-38" font-family="Arial,sans-serif" font-size="12" fill="#59625E">SLIDE</text><rect x="236" y="111" width="132" height="27" rx="12" fill="#8D6542" opacity=".82"/><text x="467" y="71" font-family="Arial,sans-serif" font-size="13" fill="#59625E">direction is still legible with hue removed</text></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><rect x="972" y="640" width="806" height="48" rx="10" fill="#F7F3EA"/><text x="994" y="670" font-size="14" fill="#315D57">COLOR-OFF · remove hue/chroma → slide direction and active sleeve remain discoverable</text><rect x="972" y="704" width="806" height="48" rx="10" fill="#F7F3EA"/><text x="994" y="734" font-size="14" fill="#315D57">MARK-OFF · remove “SLIDE” text → ribs + travel channel + detents still suggest motion</text><rect x="972" y="768" width="806" height="48" rx="10" fill="#F7F3EA"/><text x="994" y="798" font-size="14" fill="#315D57">SURFACE-OFF · remove texture → geometry/state feedback remains the primary carrier</text></g>
<text x="970" y="854" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#315D57">Physical validation still required: grip comfort, wet slip, actuation force, direction errors,</text><text x="970" y="878" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#315D57">learnability and mechanism mapping.</text>
<line x1="96" y1="962" x2="1824" y2="962" stroke="#BDB6A8" stroke-width="2"/><text x="96" y="1005" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#18211F">PROMOTION TEST</text><text x="300" y="1005" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#59615F">Remove hue, marking and texture in that order: the intended action must remain inferable from geometry/state feedback before any CMF signal is credited.</text><text x="96" y="1046" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#747B78">Synthetic interaction study only. Does not modify XJ01 geometry authority or prove production materials, wet-hand usability, force, durability or manufacturing.</text>
</svg>