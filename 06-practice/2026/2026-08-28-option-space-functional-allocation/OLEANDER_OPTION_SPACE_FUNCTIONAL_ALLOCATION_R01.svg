<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / OPTION SPACE + FUNCTIONAL ALLOCATION</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">真正的方案比较先改变功能分配；不是给同一个概念换三种外壳</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic portable task-light · exercise criteria only · no electrical / thermal / optical / manufacturing validation</text>
<rect x="88" y="208" width="1744" height="118" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="242" font-size="12" font-weight="700" fill="#8B5D46">DESIGN QUESTION</text>
<text x="116" y="270" font-size="14" fill="#29332F">一盏便携任务灯如何同时承担：携带、独立站立、定向照明、收纳时保护发光面？</text>
<text x="116" y="298" font-size="12" fill="#59615F">EXERCISE CRITERIA · one-hand carry · freestanding · aim range · lens protection · mechanism clarity · no numeric weighting</text>
</g>
<rect x="88" y="354" width="420" height="546" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="398" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · ONE CONCEPT, THREE SKINS</text>
<text x="120" y="428" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">结构完全相同，只改颜色、圆角和纹理；没有扩大 design space。</text>
<g transform="translate(128,485)">
<g><rect x="0" y="20" width="86" height="212" rx="38" fill="#E4E0D7" stroke="#5D6662" stroke-width="3"/><circle cx="43" cy="58" r="26" fill="#9AB4AE"/><rect x="17" y="184" width="52" height="26" rx="13" fill="#B8B1A5"/></g>
<g transform="translate(112,0)"><rect x="0" y="20" width="86" height="212" rx="22" fill="#343A37" stroke="#171D1B" stroke-width="3"/><circle cx="43" cy="58" r="26" fill="#E9B759"/><rect x="17" y="184" width="52" height="26" rx="7" fill="#737B76"/></g>
<g transform="translate(224,0)"><rect x="0" y="20" width="86" height="212" rx="42" fill="#DAD8D0" stroke="#5D6662" stroke-width="3"/><circle cx="43" cy="58" r="26" fill="#C86872"/><g stroke="#8C918D" stroke-width="3"><line x1="18" y1="116" x2="68" y2="116"/><line x1="18" y1="128" x2="68" y2="128"/><line x1="18" y1="140" x2="68" y2="140"/></g><rect x="17" y="184" width="52" height="26" rx="13" fill="#B8B1A5"/></g>
</g>
<text x="120" y="760" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">SURFACE-OFF → 三个方案合并为一个 mechanism。</text>
<text x="120" y="786" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.3" fill="#7D4A3A">FUNCTION-ALLOCATION TEST</text><text x="120" y="807" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12.3" fill="#7D4A3A">carry / stand / aim / protect 均未重新分配。</text>
<rect x="120" y="830" width="356" height="42" rx="10" fill="#F7F3EA"/>
<text x="140" y="856" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="12" fill="#7D4A3A">ROOT · variation happened after the architecture was already fixed.</text>
<rect x="536" y="354" width="404" height="546" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="568" y="398" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / PIVOT HEAD + U-FRAME</text>
<text x="568" y="428" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">U-frame 承担 carry + stand；pivot head 承担 aim。</text>
<g transform="translate(620,486)"><path d="M0 174 V70 Q0 28 42 28 H128 Q170 28 170 70 V174" fill="none" stroke="#6E7773" stroke-width="18" stroke-linecap="round"/><circle cx="84" cy="92" r="52" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><circle cx="84" cy="92" r="30" fill="#F7E4AE" stroke="#A99157" stroke-width="2"/><circle cx="84" cy="92" r="8" fill="#315D57"/><line x1="84" y1="92" x2="126" y2="62" stroke="#315D57" stroke-width="4"/><line x1="-14" y1="183" x2="184" y2="183" stroke="#5D6662" stroke-width="6" stroke-linecap="round"/></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F"><text x="568" y="742">CARRY → frame top</text><text x="568" y="765">STAND → same frame becomes base</text><text x="568" y="788">AIM → pivot head</text><text x="568" y="811">PROTECT → head nests inside frame envelope</text></g>
<rect x="568" y="834" width="340" height="38" rx="10" fill="#F7F3EA"/><text x="586" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#315D57">ADVERSE · table edge still leaves a stable two-point frame contact.</text>
<rect x="968" y="354" width="404" height="546" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1000" y="398" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">C / SLIDING HEAD + WEIGHTED BASE</text>
<text x="1000" y="428" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">base 专职 stand；rail/slider 负责 aim；handle 专职 carry。</text>
<g transform="translate(1056,486)"><rect x="62" y="4" width="30" height="184" rx="15" fill="#707874"/><rect x="30" y="30" width="94" height="58" rx="20" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><circle cx="48" cy="59" r="18" fill="#F7E4AE" stroke="#A99157" stroke-width="2"/><rect x="40" y="188" width="76" height="24" rx="12" fill="#5E6662"/><path d="M48 -14 H106 Q122 -14 122 2" fill="none" stroke="#5E6662" stroke-width="10" stroke-linecap="round"/><path d="M112 28 V88" stroke="#315D57" stroke-width="3"/><path d="M112 28 l-7 10 h14 z M112 88 l-7 -10 h14 z" fill="#315D57"/></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F"><text x="1000" y="742">CARRY → dedicated handle</text><text x="1000" y="765">STAND → weighted base</text><text x="1000" y="788">AIM → vertical slide + head orientation</text><text x="1000" y="811">PROTECT → head parks against rail / body</text></g>
<rect x="1000" y="834" width="340" height="38" rx="10" fill="#F7F3EA"/><text x="1018" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#315D57">ATTACK · remove handle → carry function degrades independently.</text>
<rect x="1400" y="354" width="432" height="546" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1432" y="398" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">D / REVISE · CLIP ARM</text>
<text x="1432" y="428" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">clip 承担 carry + attach；aim 强，但 freestanding 被牺牲。</text>
<g transform="translate(1494,484)"><path d="M58 36 C30 36 16 52 16 76 V170" fill="none" stroke="#6E7773" stroke-width="18" stroke-linecap="round"/><circle cx="58" cy="36" r="36" fill="#E5E1D8" stroke="#5D6662" stroke-width="3"/><circle cx="58" cy="36" r="19" fill="#F7E4AE" stroke="#A99157" stroke-width="2"/><path d="M0 172 H84 L68 202 H16 Z" fill="#737B76" stroke="#515955" stroke-width="3"/><path d="M18 202 H66" stroke="#315D57" stroke-width="4"/></g>
<g font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F"><text x="1432" y="742">CARRY → clip body</text><text x="1432" y="765">ATTACH → clip</text><text x="1432" y="788">AIM → flexible / articulated arm</text><text x="1432" y="811">FREESTAND → PARTIAL / unsupported</text></g>
<rect x="1432" y="834" width="368" height="38" rx="10" fill="#F7F3EA"/><text x="1450" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#8A6941">DECISION · viable only if freestanding is relaxed by authority.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/>
<text x="88" y="990" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="700" fill="#18211F">OPTION-SPACE TEST</text>
<text x="302" y="990" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" fill="#59615F">Hide styling and names: surviving options must still differ in functional allocation or architecture; otherwise they are variants, not alternatives.</text>
<text x="88" y="1032" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">Selection remains HOLD: no weighted score, optical output, thermal, electrical, stability, mechanism, cost or manufacturing evidence is claimed.</text>
</svg>