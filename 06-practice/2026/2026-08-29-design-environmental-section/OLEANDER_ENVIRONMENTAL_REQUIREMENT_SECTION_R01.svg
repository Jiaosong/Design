<path d="M774 590 H1008" stroke="#555D59" stroke-width="14" stroke-linecap="round"/>
<path d="M1032 548 H1200" stroke="#6E7672" stroke-width="5" stroke-dasharray="7 5"/>
<text x="718" y="760" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">DIRECT-SUN ATTACK → shading can change without opening archive to daylight.</text>
<text x="718" y="788" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#315D57">ARCHIVE-DOOR ATTACK → transfer is local; archive remains a bounded protected volume.</text>
<rect x="718" y="830" width="548" height="46" rx="10" fill="#F7F3EA"/>
<text x="738" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#315D57">CONSEQUENCE · environmental requirement changes vertical allocation + threshold.</text>
<rect x="1348" y="350" width="484" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="1380" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#8A6941">C / REVISE · ARCHIVE CORE + ROOFLIGHT</text>
<text x="1380" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">archive 在核心区，但共享 rooflight 仍把 daylight 带到 archive access zone。</text>
<text x="1380" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION / ACCESS-OPEN ATTACK</text>
<rect x="1392" y="480" width="408" height="244" rx="16" fill="#F7F3EA"/>
