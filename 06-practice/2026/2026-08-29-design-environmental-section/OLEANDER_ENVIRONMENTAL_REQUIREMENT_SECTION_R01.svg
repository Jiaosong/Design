<text x="1524" y="644" font-family="Arial,sans-serif" font-size="10.5" fill="#424A47">ARCHIVE CORE</text>
<text x="1450" y="676" font-family="Arial,sans-serif" font-size="9.5" fill="#59615F">READ</text>
<text x="1704" y="676" font-family="Arial,sans-serif" font-size="9.5" fill="#59615F">READ</text>
<text x="1380" y="762" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">ACCESS-OPEN → shared rooflight reaches the archive threshold.</text>
<text x="1380" y="790" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#8A6941">REPAIR → decouple rooflight from archive access / add opaque buffer.</text>
<rect x="1380" y="830" width="420" height="46" rx="10" fill="#F7F3EA"/>
<text x="1400" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#59615F">centrality does not equal environmental separation.</text>
<line x1="88" y1="950" x2="1832" y2="950" stroke="#BDB6A8" stroke-width="2"/>
<text x="88" y="986" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#18211F">SECTIONAL CONSEQUENCE TEST</text>
<text x="88" y="1012" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14.5" fill="#59615F">Remove labels and daylight-color arrows: protected vs daylight-seeking zones should still be legible in vertical allocation, envelope openness and transfer threshold.</text>
<text x="88" y="1044" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#747B78">BOUNDARY · no lux target, daylight simulation, conservation approval, envelope performance, structure, code or real archive brief is proven.</text>
</svg>