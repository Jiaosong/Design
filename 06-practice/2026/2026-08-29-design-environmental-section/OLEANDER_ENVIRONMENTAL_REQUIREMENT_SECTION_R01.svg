<text x="194" y="666" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">READING</text>
<text x="404" y="666" font-family="Arial,sans-serif" font-size="10.5" fill="#59615F">ARCHIVE</text>
<text x="120" y="762" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">DIRECT-SUN ATTACK → archive 与 reading 同时暴露。</text>
<text x="120" y="790" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#7D4A3A">CURTAIN DELETION → 环境逻辑立即消失。</text>
<rect x="120" y="830" width="484" height="46" rx="10" fill="#F7F3EA"/>
<text x="140" y="858" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.5" fill="#7D4A3A">ROOT · one envelope strategy was asked to solve opposite conditions.</text>
<rect x="686" y="350" width="612" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="718" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#315D57">B / KEEP · DAYLIGHT READING + PROTECTED ARCHIVE</text>
<text x="718" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">upper/perimeter reading 接收受控 daylight；archive 位于低光保护体量。</text>
<text x="718" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION / ENVIRONMENTAL ZONING</text>
<rect x="730" y="480" width="536" height="244" rx="16" fill="#F7F3EA"/>
<line x1="754" y1="690" x2="1242" y2="690" stroke="#626A66" stroke-width="3"/>
