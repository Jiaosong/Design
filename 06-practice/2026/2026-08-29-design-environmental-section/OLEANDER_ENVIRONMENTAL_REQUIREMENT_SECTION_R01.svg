<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2EFE7"/>
<text x="88" y="72" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#59615F">OLEANDER DESIGN PROCESS / ENVIRONMENTAL REQUIREMENT → SECTION</text>
<text x="88" y="128" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="46" font-weight="700" fill="#18211F">光环境不能只停在“加窗/遮阳”；它必须改变剖面中的空间分配</text>
<text x="88" y="170" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17" fill="#69706D">synthetic archive + reading room · NTS · no illuminance / energy / conservation certification</text>
<rect x="88" y="208" width="1744" height="118" rx="18" fill="#DED9CD" stroke="#BDB6A8"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif">
<text x="116" y="242" font-size="11.5" font-weight="700" fill="#8B5D46">EXTERNAL EVIDENCE</text>
<text x="116" y="268" font-size="11.7" fill="#29332F">Occupied space: admit daylight with glare/direct-beam control.</text>
<text x="116" y="291" font-size="11.7" fill="#29332F">Museum storage: reduce damaging light exposure.</text>
<text x="612" y="242" font-size="11.5" font-weight="700" fill="#7D654B">INFERENCE</text>
<text x="612" y="268" font-size="11.7" fill="#29332F">reading 与 archive 的环境目标不同，</text>
<text x="612" y="291" font-size="11.7" fill="#29332F">不能共享同一 envelope/daylight strategy。</text>
<text x="1090" y="242" font-size="11.5" font-weight="700" fill="#7D654B">ADVERSE CONDITION</text>
<text x="1090" y="268" font-size="12.5" fill="#29332F">强直射 / glare；archive access 时门开启；</text>
<text x="1090" y="291" font-size="12.5" fill="#29332F">阅读区仍需要可用的自然光。</text>
<text x="1490" y="242" font-size="11.5" font-weight="700" fill="#315D57">DESIGN CONSEQUENCE</text>
<text x="1490" y="268" font-size="12.5" fill="#29332F">把 daylight-seeking 与 light-protected</text>
<text x="1490" y="291" font-size="12.5" fill="#29332F">空间在剖面中分开，并设置受控 transfer。</text>
</g>
<rect x="88" y="350" width="548" height="548" rx="22" fill="#DED9CD" stroke="#BDB6A8"/>
<text x="120" y="394" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#914F3D">A / REJECT · ONE DAYLIGHT ATRIUM</text>
<text x="120" y="424" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#59615F">reading 与 archive 都向同一玻璃顶开放；环境差异只靠帘/标签解释。</text>
<text x="120" y="462" font-family="Arial,sans-serif" font-size="11" fill="#59615F">SECTION / LABEL-OFF</text>
<rect x="132" y="480" width="464" height="244" rx="16" fill="#F7F3EA"/>
