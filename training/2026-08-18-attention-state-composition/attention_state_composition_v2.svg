eight="365" rx="14" fill="#102224"/><path d="M0 215 L35 125 L70 200 L105 92 L145 205 L180 110 L215 195 L250 130 L250 365 L0 365 Z" fill="#365a55"/><path d="M0 250 C60 220 120 300 250 235 L250 365 L0 365 Z" fill="#7ea7a3" opacity=".78"/><text x="15" y="35" font-family="Arial" font-size="9" font-weight="700" fill="#a9bbb7">S0 / LANDSCAPE + BODY</text><text x="15" y="72" font-family="Arial" font-size="22" font-weight="700" fill="#f2f4ef">LANDSCAPE FIRST</text><circle cx="122" cy="208" r="6" fill="#d8efc9"/><text x="135" y="212" font-family="Arial" font-size="8" fill="#f2f4ef">route</text><rect x="185" y="315" width="50" height="28" rx="14" fill="#142c2e" stroke="#78958f"/><text x="210" y="333" text-anchor="middle" font-family="Arial" font-size="7" fill="#f2f4ef">RETURN</text></g><g transform="translate(1170 175)"><rect width="250" height="365" rx="14" fill="#102224"/><path d="M0 215 L35 125 L70 200 L105 92 L145 205 L180 110 L215 195 L250 130 L250 365 L0 365 Z" fill="#365a55"/><path d="M0 250 C60 220 120 300 250 235 L250 365 L0 365 Z" fill="#7ea7a3" opacity=".78"/><text x="15" y="35" font-family="Arial" font-size="9" font-weight="700" fill="#a9bbb7">S1 / PROMPT</text><circle cx="122" cy="208" r="12" fill="none" stroke="#d8efc9" stroke-width="2"/><circle cx="122" cy="208" r="4" fill="#d8efc9"/><rect x="20" y="255" width="180" height="58" rx="10" fill="#142c2e" stroke="#6e8a85"/><text x="32" y="280" font-family="Arial" font-size="10" font-weight="700" fill="#f2f4ef">LOOK AGAIN</text><text x="32" y="299" font-family="Arial" font-size="8" fill="#a9bbb7">optional prompt</text><rect x="185" y="315" width="50" height="28" rx="14" fill="#142c2e" stroke="#78958f"/><text x="210" y="333" text-anchor="middle" font-family="Arial" font-size="7" fill="#f2f4ef">RETURN</text></g><g transform="translate(1440 175)"><rect width="290" height="365" rx="14" fill="#102224"/><path d="M0 215 L40 125 L82 200 L122 92 L165 205 L205 110 L250 195 L290 130 L290 365 L0 365 Z" fill="#365a55"/><path d="M0 250 C70 220 140 300 290 235 L290 365 L0 365 Z" fill="#7ea7a3" opacity=".78"/><text x="15" y="35" font-family="Arial" font-size="9" font-weight="700" fill="#a9bbb7">S2 / REVEAL</text><rect x="15" y="205" width="215" height="118" rx="12" fill="#f5f3ed"/><text x="28" y="232" font-family="Arial" font-size="12" font-weight="700" fill="#17201f">R06 / VALLEY OBSERVATION</text><text x="28" y="258" font-family="Arial" font-size="8" fill="#4d5552">relation + evidence after intent</text><text x="28" y="282" font-family="Arial" font-size="8" fill="#6d746f">SOURCE-GROUNDED / FIELD OPEN</text><rect x="225" y="315" width="50" height="28" rx="14" fill="#142c2e" stroke="#78958f"/><text x="250" y="333" text-anchor="middle" font-family="Arial" font-size="7" fill="#f2f4ef">RETURN</text></g><line x1="70" y1="595" x2="1730" y2="595" stroke="#d0cdc5"/><text x="70" y="635" font-family="Arial" font-size="14" font-weight="700" fill="#151a19">STATE CONTRACT</text><text x="70" y="675" font-family="Arial" font-size="11" fill="#444">S0 / LANDSCAPE + BODY</text><text x="300" y="675" font-family="Arial" font-size="11" fill="#666">World owns attention. Route continuity + Return survive. Explanation stays absent.</text><text x="70" y="713" font-family="Arial" font-size="11" fill="#444">S1 / PROMPT</text><text x="300" y="713" font-family="Arial" font-size="11" fill="#666">One optional cue may rise. It cannot block route, landscape or recovery.</text><text x="70" y="751" font-family="Arial" font-size="11" fill="#444">S2 / REVEAL</text><text x="300" y="751" font-family="Arial" font-size="11" fill="#666">Explanation may become primary only after intent. Evidence boundary and retreat remain adjacent.</text><rect x="70" y="805" width="1660" height="190" rx="14" fill="#fff" stroke="#cbc8c0"/><text x="96" y="842" font-family="Arial" font-size="12" font-weight="700" fill="#355e57">TRANSFER RULE</text><text x="96" y="875" font-family="Arial" font-size="15" font-weight="700" fill="#151a19">ATTENTION OWNER → SUPPORT LAYERS → SUPPRESSED LAYERS → RECOVERY → EVIDENCE BOUNDARY</text><text x="96" y="911" font-family="Arial" font-size="11" fill="#555">Do not solve density by deleting information. Reallocate when and where it becomes visually primary.</text><text x="96" y="944" font-family="Arial" font-size="10" fill="#777">Training proxy only · not a Qingjiang site image · no geometry / route / FIELD / implementation authority changed.</text><text x="96" y="972" font-family="Arial" font-size="10" fill="#777">FIELD OBSERVED=0 · FIELD MEASURED=0 · G1F HOLD · NO_PROMOTION</text></svg>