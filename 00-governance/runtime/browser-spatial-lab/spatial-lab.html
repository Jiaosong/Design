<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLEANDER Browser Spatial Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#ececec}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:340px 1fr;min-height:100vh}.panel{background:#fff;padding:16px;border-right:1px solid #ccc;overflow:auto}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100vh}.row{display:grid;grid-template-columns:1fr 86px;gap:8px;align-items:center;margin:8px 0}label{font-size:12px;font-weight:600}input,button,textarea,select{width:100%;padding:7px;border:1px solid #bbb;background:#fff}textarea{min-height:220px;font:11px/1.4 ui-monospace,monospace}button{cursor:pointer}.note{font-size:11px;line-height:1.45;color:#555}.status{font:11px/1.4 ui-monospace,monospace;background:#f4f4f4;padding:8px;margin-top:10px;white-space:pre-wrap}@media(max-width:800px){body{grid-template-columns:1fr}.stage canvas{height:70vh}.panel{border-right:0;border-bottom:1px solid #ccc}}</style></head>
<body><aside class="panel"><h2>OLEANDER Spatial Lab</h2><p class="note">Parametric concept massing / camera / scale readback. Network-loaded pinned Three.js runtime. Not BIM/CAD/Class-A/engineering proof.</p><div class="row"><label>Camera preset</label><select id="camera"><option value="perspective">Perspective</option><option value="front">Front</option><option value="top">Top</option><option value="axon">Axon</option></select></div><label><input id="wire" type="checkbox" style="width:auto"> Wireframe</label> <label><input id="grid" type="checkbox" checked style="width:auto"> Grid</label><label><input id="shadow" type="checkbox" checked style="width:auto"> Shadows</label><h3>Scene JSON</h3><textarea id="scene">{
  "units":"m",
  "objects":[
    {"id":"ground","type":"box","size":[20,0.4,12],"position":[0,-0.2,0],"color":"#c9c5bb"},
    {"id":"mass-a","type":"box","size":[5,3,8],"position":[-3,1.5,0],"color":"#d7d1c5"},
    {"id":"mass-b","type":"box","size":[3,5,4],"position":[2.5,2.5,1.5],"color":"#b8b0a3"},
    {"id":"column","type":"cylinder","size":[0.45,0.45,4],"position":[0,2,-3],"color":"#8f8a82"}
  ]
}</textarea><button id="apply">Apply Scene</button><button id="export">Export Scene JSON</button><div id="status" class="status">READY</div></aside><main class="stage" id="stage"></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0xe7e5df);const cam=new THREE.PerspectiveCamera(45,1,.1,500);cam.position.set(16,12,18);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;stage.appendChild(r.domElement);const controls=new OrbitControls(cam,r.domElement);controls.target.set(0,2,0);controls.enableDamping=true;const hemi=new THREE.HemisphereLight(0xffffff,0x777777,2.2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(10,18,8);sun.castShadow=true;scene.add(sun);let grid=new THREE.GridHelper(40,40,0x777777,0xb5b5b5);scene.add(grid);const root=new THREE.Group();scene.add(root);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();r.setSize(w,h,false)}addEventListener('resize',resize);resize();
function geoFor(o){if(o.type==='cylinder')return new THREE.CylinderGeometry(o.size?.[0]||1,o.size?.[1]||1,o.size?.[2]||2,32);return new THREE.BoxGeometry(...(o.size||[1,1,1]));}
function build(){while(root.children.length){const n=root.children.pop();n.geometry?.dispose();n.material?.dispose()}try{const data=JSON.parse($('scene').value);for(const o of data.objects||[]){const mat=new THREE.MeshStandardMaterial({color:o.color||'#cccccc',roughness:.8,metalness:0,wireframe:$('wire').checked});const m=new THREE.Mesh(geoFor(o),mat);m.name=o.id||o.type;m.position.fromArray(o.position||[0,0,0]);m.rotation.set(...(o.rotation||[0,0,0]));m.castShadow=true;m.receiveShadow=true;root.add(m)}$('status').textContent=`SCENE OK\nobjects=${root.children.length}\nunits=${data.units||'unspecified'}`}catch(e){$('status').textContent='SCENE ERROR\n'+e.message}}
function preset(){const v=$('camera').value;if(v==='front')cam.position.set(0,4,22);if(v==='top')cam.position.set(.01,28,.01);if(v==='axon')cam.position.set(18,16,18);if(v==='perspective')cam.position.set(16,12,18);controls.target.set(0,2,0);controls.update()}
$('apply').onclick=build;$('wire').onchange=build;$('grid').onchange=()=>grid.visible=$('grid').checked;$('shadow').onchange=()=>r.shadowMap.enabled=$('shadow').checked;$('camera').onchange=preset;$('export').onclick=()=>{const blob=new Blob([$('scene').value],{type:'application/json'});const a=document.createElement('a');a.download='oleander-spatial-scene.json';a.href=URL.createObjectURL(blob);a.click()};build();preset();
(function loop(){requestAnimationFrame(loop);controls.update();r.render(scene,cam)})();
</script></body></html>
