<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLEANDER Browser Spatial Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#ececec}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:340px 1fr;min-height:100vh}.panel{background:#fff;padding:16px;border-right:1px solid #ccc;overflow:auto}.stage{position:relative;min-width:0;background:#e7e5df}.stage canvas{display:block;width:100%;height:100vh}.row{display:grid;grid-template-columns:1fr 86px;gap:8px;align-items:center;margin:8px 0}label{font-size:12px;font-weight:600}input,button,textarea,select{width:100%;padding:7px;border:1px solid #bbb;background:#fff}textarea{min-height:220px;font:11px/1.4 ui-monospace,monospace}button{cursor:pointer}.note{font-size:11px;line-height:1.45;color:#555}.status{font:11px/1.4 ui-monospace,monospace;background:#f4f4f4;padding:8px;margin-top:10px;white-space:pre-wrap}@media(max-width:800px){body{grid-template-columns:1fr}.stage canvas{height:70vh}.panel{border-right:0;border-bottom:1px solid #ccc}}</style></head>
<body><aside class="panel"><h2>OLEANDER Spatial Lab</h2><p class="note">Zero-dependency parametric concept massing / camera / scale readback. Native Canvas projection; not BIM/CAD/Class-A/engineering proof.</p><div class="row"><label>Camera preset</label><select id="camera"><option value="perspective">Perspective</option><option value="front">Front</option><option value="top">Top</option><option value="axon">Axon</option></select></div><div class="row"><label>Yaw °</label><input id="yaw" type="number" value="38"></div><div class="row"><label>Pitch °</label><input id="pitch" type="number" value="-24"></div><div class="row"><label>Distance</label><input id="distance" type="number" value="28" min="4" max="100"></div><label><input id="wire" type="checkbox" style="width:auto"> Wireframe</label> <label><input id="grid" type="checkbox" checked style="width:auto"> Grid</label><h3>Scene JSON</h3><textarea id="scene">{
  "units":"m",
  "objects":[
    {"id":"ground","type":"box","size":[20,0.4,12],"position":[0,-0.2,0],"color":"#c9c5bb"},
    {"id":"mass-a","type":"box","size":[5,3,8],"position":[-3,1.5,0],"color":"#d7d1c5"},
    {"id":"mass-b","type":"box","size":[3,5,4],"position":[2.5,2.5,1.5],"color":"#b8b0a3"},
    {"id":"column","type":"cylinder","size":[0.7,4,12],"position":[0,2,-3],"color":"#8f8a82"}
  ]
}</textarea><button id="apply">Apply Scene</button><button id="export">Export Scene JSON</button><div id="status" class="status">READY</div></aside><main class="stage" id="stage"><canvas id="canvas"></canvas></main>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('canvas'),ctx=canvas.getContext('2d');let data={objects:[]};
function rad(d){return d*Math.PI/180}function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]}function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]}function rotZ(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]}function add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function objectPoint(p,o){const r=o.rotation||[0,0,0];p=rotX(p,rad(r[0]||0));p=rotY(p,rad(r[1]||0));p=rotZ(p,rad(r[2]||0));return add(p,o.position||[0,0,0])}
function cameraPoint(p){p=rotY(p,rad(+$('yaw').value));p=rotX(p,rad(+$('pitch').value));return[p[0],p[1],p[2]+(+$('distance').value)]}
function proj(p){const q=cameraPoint(p),f=Math.min(canvas.width,canvas.height)*0.92,z=Math.max(.4,q[2]);return[canvas.width/2+q[0]*f/z,canvas.height/2-q[1]*f/z,q[2]]}
function box(o){const s=o.size||[1,1,1],x=s[0]/2,y=s[1]/2,z=s[2]/2,v=[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]].map(p=>objectPoint(p,o));const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]];return faces.map((idx,i)=>({pts:idx.map(n=>v[n]),color:o.color||'#ccc',shade:[.78,1,.86,1.06,.94,.7][i]}))}
function cylinder(o){const s=o.size||[1,2,12],r=s[0],h=s[1],n=Math.max(6,Math.round(s[2]||12)),top=[],bot=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;top.push(objectPoint([Math.cos(a)*r,h/2,Math.sin(a)*r],o));bot.push(objectPoint([Math.cos(a)*r,-h/2,Math.sin(a)*r],o))}const fs=[{pts:top,color:o.color||'#aaa',shade:1.08},{pts:[...bot].reverse(),color:o.color||'#aaa',shade:.72}];for(let i=0;i<n;i++)fs.push({pts:[bot[i],bot[(i+1)%n],top[(i+1)%n],top[i]],color:o.color||'#aaa',shade:.82+(i%4)*.06});return fs}
function tint(hex,k){const m=hex.match(/[0-9a-f]{2}/gi);if(!m)return hex;return'#'+m.map(v=>Math.max(0,Math.min(255,Math.round(parseInt(v,16)*k))).toString(16).padStart(2,'0')).join('')}
function line3(a,b,color='#aaa',w=1){const p=proj(a),q=proj(b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function drawGrid(){if(!$('grid').checked)return;for(let i=-20;i<=20;i++){line3([i,0,-20],[i,0,20],i===0?'#888':'#c7c7c2',i===0?1.4:.7);line3([-20,0,i],[20,0,i],i===0?'#888':'#c7c7c2',i===0?1.4:.7)}}
function draw(){resize();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e7e5df';ctx.fillRect(0,0,canvas.width,canvas.height);drawGrid();let faces=[];for(const o of data.objects||[])faces.push(...(o.type==='cylinder'?cylinder(o):box(o)));faces=faces.map(f=>{const ps=f.pts.map(proj);return{...f,ps,depth:ps.reduce((a,p)=>a+p[2],0)/ps.length}}).sort((a,b)=>b.depth-a.depth);for(const f of faces){ctx.beginPath();f.ps.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(!$('wire').checked){ctx.fillStyle=tint(f.color,f.shade);ctx.fill()}ctx.strokeStyle='#333';ctx.globalAlpha=$('wire').checked?.95:.42;ctx.lineWidth=$('wire').checked?1.3:.7;ctx.stroke();ctx.globalAlpha=1} }
function resize(){const d=Math.min(devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}}
function build(){try{data=JSON.parse($('scene').value);$('status').textContent=`SCENE OK\nobjects=${(data.objects||[]).length}\nunits=${data.units||'unspecified'}\nengine=NATIVE_CANVAS_3D_PROJECTION`;draw()}catch(e){$('status').textContent='SCENE ERROR\n'+e.message}}
function preset(){const v=$('camera').value;if(v==='front'){$('yaw').value=0;$('pitch').value=0;$('distance').value=30}if(v==='top'){$('yaw').value=0;$('pitch').value=-89;$('distance').value=34}if(v==='axon'){$('yaw').value=45;$('pitch').value=-35;$('distance').value=30}if(v==='perspective'){$('yaw').value=38;$('pitch').value=-24;$('distance').value=28}draw()}
['yaw','pitch','distance','wire','grid'].forEach(id=>$(id).addEventListener('input',draw));$('camera').onchange=preset;$('apply').onclick=build;$('export').onclick=()=>{const b=new Blob([$('scene').value],{type:'application/json'});const a=document.createElement('a');a.download='oleander-spatial-scene.json';a.href=URL.createObjectURL(b);a.click()};addEventListener('resize',draw);let drag=false,lx=0,ly=0;canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;$('yaw').value=(+$('yaw').value)+(e.clientX-lx)*.35;$('pitch').value=Math.max(-89,Math.min(89,(+$('pitch').value)+(e.clientY-ly)*.25));lx=e.clientX;ly=e.clientY;draw()};canvas.onpointerup=()=>drag=false;build();
</script></body></html>
