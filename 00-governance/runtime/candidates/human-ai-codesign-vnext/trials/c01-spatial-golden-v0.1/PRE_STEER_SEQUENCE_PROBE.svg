<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="900" fill="#f7f7f4"/>
  <style>
    text{font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;fill:#18202b}
    .t{font-size:30px;font-weight:700}.st{font-size:15px;fill:#596273}.h{font-size:20px;font-weight:700}.b{font-size:14px;fill:#434c58}.s{font-size:12px;fill:#6d7580}.lane{fill:#fff;stroke:#ced4dc;stroke-width:1.6}.step{fill:#f7faf8;stroke:#aeb9b3;stroke-width:1.4}.warn{fill:#fff6ee;stroke:#d5a36a;stroke-width:1.4}.off{fill:#eef0f3;stroke:#9da7b2;stroke-width:1.4}.inv{fill:#f3f0fb;stroke:#9b8bc8;stroke-width:1.4}
  </style>
  <text x="65" y="58" class="t">C01 · PRE-STEER OPERATING-SEQUENCE PROBE</text>
  <text x="65" y="88" class="st">Continuation intent only · human design steer still pending. NON_METRIC · no host selection · no ADD-07 authority.</text>

  <rect x="65" y="120" width="1470" height="76" rx="16" class="inv"/>
  <text x="90" y="150" class="h">LOCKED ACROSS ALL PARENTS</text>
  <text x="90" y="178" class="b">resident continuity clear · performer / tool / observer / service-reset distinct · H01 mobile/distributed · OFF_RETURN complete · no fixed stage · no measured geometry</text>

  <g transform="translate(65,225)">
    <rect width="1470" height="200" rx="20" class="lane"/>
    <text x="26" y="42" class="h">A · EDGE DOCK — operating-sequence probe</text>
    <text x="26" y="68" class="b">Single support edge remains the parent mechanism. Pre-steer probe exposes when congestion occurs.</text>
    <g transform="translate(430,78)">
      <rect width="220" height="112" rx="14" class="off"/><text x="110" y="32" text-anchor="middle" class="b">01 / OFF</text><text x="110" y="60" text-anchor="middle" class="s">edge closed</text><text x="110" y="82" text-anchor="middle" class="s">ordinary use restored</text>
      <path d="M220 56 L255 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="260" width="220" height="112" rx="14" class="step"/><text x="370" y="32" text-anchor="middle" class="b">02 / SETUP</text><text x="370" y="60" text-anchor="middle" class="s">tool leaves dock</text><text x="370" y="82" text-anchor="middle" class="s">borrowed field opens</text>
      <path d="M480 56 L515 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="520" width="220" height="112" rx="14" class="step"/><text x="630" y="32" text-anchor="middle" class="b">03 / ACTIVE</text><text x="630" y="60" text-anchor="middle" class="s">performer + observer</text><text x="630" y="82" text-anchor="middle" class="s">resident line stays clear</text>
      <path d="M740 56 L775 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="780" width="220" height="112" rx="14" class="warn"/><text x="890" y="32" text-anchor="middle" class="b">04 / RESET → OFF</text><text x="890" y="60" text-anchor="middle" class="s">tool + reset share edge</text><text x="890" y="82" text-anchor="middle" class="s">SENSITIVE: congestion</text>
    </g>
  </g>

  <g transform="translate(65,445)">
    <rect width="1470" height="200" rx="20" class="lane"/>
    <text x="26" y="42" class="h">B · SPLIT SUPPORT — operating-sequence probe</text>
    <text x="26" y="68" class="b">Tool and reset remain separated. Pre-steer probe exposes the dependency on two eligible support interfaces.</text>
    <g transform="translate(430,78)">
      <rect width="220" height="112" rx="14" class="off"/><text x="110" y="32" text-anchor="middle" class="b">01 / OFF</text><text x="110" y="60" text-anchor="middle" class="s">both edges close</text><text x="110" y="82" text-anchor="middle" class="s">center ordinary</text>
      <path d="M220 56 L255 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="260" width="220" height="112" rx="14" class="warn"/><text x="370" y="32" text-anchor="middle" class="b">02 / SETUP</text><text x="370" y="60" text-anchor="middle" class="s">two support edges needed</text><text x="370" y="82" text-anchor="middle" class="s">SENSITIVE: eligibility</text>
      <path d="M480 56 L515 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="520" width="220" height="112" rx="14" class="step"/><text x="630" y="32" text-anchor="middle" class="b">03 / ACTIVE</text><text x="630" y="60" text-anchor="middle" class="s">performer centered</text><text x="630" y="82" text-anchor="middle" class="s">tool/reset separated</text>
      <path d="M740 56 L775 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="780" width="220" height="112" rx="14" class="step"/><text x="890" y="32" text-anchor="middle" class="b">04 / RESET → OFF</text><text x="890" y="60" text-anchor="middle" class="s">return conflict reduced</text><text x="890" y="82" text-anchor="middle" class="s">both edges close</text>
    </g>
  </g>

  <g transform="translate(65,665)">
    <rect width="1470" height="200" rx="20" class="lane"/>
    <text x="26" y="42" class="h">C · ZERO-STAGE KIT — operating-sequence probe</text>
    <text x="26" y="68" class="b">No fixed stage remains. Pre-steer probe exposes repeated setup/reset labor as the sensitive burden.</text>
    <g transform="translate(430,78)">
      <rect width="220" height="112" rx="14" class="off"/><text x="110" y="32" text-anchor="middle" class="b">01 / OFF</text><text x="110" y="60" text-anchor="middle" class="s">kit absent</text><text x="110" y="82" text-anchor="middle" class="s">field fully returned</text>
      <path d="M220 56 L255 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="260" width="220" height="112" rx="14" class="warn"/><text x="370" y="32" text-anchor="middle" class="b">02 / SETUP</text><text x="370" y="60" text-anchor="middle" class="s">kit arrives + reset point opens</text><text x="370" y="82" text-anchor="middle" class="s">SENSITIVE: labor</text>
      <path d="M480 56 L515 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="520" width="220" height="112" rx="14" class="step"/><text x="630" y="32" text-anchor="middle" class="b">03 / ACTIVE</text><text x="630" y="60" text-anchor="middle" class="s">temporary field only</text><text x="630" y="82" text-anchor="middle" class="s">observer remains edge</text>
      <path d="M740 56 L775 56" stroke="#5f6874" stroke-width="2" marker-end="url(#a)"/>
      <rect x="780" width="220" height="112" rx="14" class="warn"/><text x="890" y="32" text-anchor="middle" class="b">04 / RESET → OFF</text><text x="890" y="60" text-anchor="middle" class="s">check / return / remove kit</text><text x="890" y="82" text-anchor="middle" class="s">SENSITIVE: labor again</text>
    </g>
  </g>

  <text x="65" y="915" class="h">The next consequential human choice is now narrower:</text>
  <text x="65" y="947" class="b">Which unresolved burden is acceptable enough to investigate next — A congestion, B two-interface eligibility, or C repeated setup/reset labor? This board does not choose for the human.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#5f6874"/></marker></defs>
</svg>
