<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#f7f7f4"/>
  <style>text{font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;fill:#18202b}.t{font-size:28px;font-weight:700}.s{font-size:14px;fill:#596273}.l{font-size:16px;font-weight:650}.n{font-size:13px;fill:#5f6874}</style>
  <text x="60" y="58" class="t">C · ZERO-STAGE KIT / 无舞台移动套件</text>
  <text x="60" y="86" class="s">ASSUMED_RELATION_TEST · NON_METRIC · NOT HOST SELECTION</text>
  <rect x="60" y="125" width="980" height="515" rx="24" fill="#fff" stroke="#ccd2d9" stroke-width="2"/>

  <rect x="105" y="285" width="150" height="135" rx="22" fill="#eaf1f7" stroke="#86a4bd" stroke-width="2"/>
  <text x="180" y="330" text-anchor="middle" class="l">MOBILE KIT</text>
  <text x="180" y="358" text-anchor="middle" class="n">tool + markers</text>
  <text x="180" y="382" text-anchor="middle" class="n">returns after use</text>
  <rect x="105" y="445" width="150" height="74" rx="16" fill="#f2ece5" stroke="#b79b78" stroke-width="2"/>
  <text x="180" y="475" text-anchor="middle" class="l">RESET</text>
  <text x="180" y="498" text-anchor="middle" class="n">service / check / return</text>

  <path d="M275 350 L375 350" stroke="#586270" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <rect x="375" y="190" width="470" height="325" rx="48" fill="#f4f7f1" stroke="#94a88f" stroke-width="2" stroke-dasharray="12 10"/>
  <text x="610" y="235" text-anchor="middle" class="l">TEMPORARY BORROWED FIELD</text>
  <text x="610" y="260" text-anchor="middle" class="n">no dedicated stage / no fixed host object</text>
  <ellipse cx="610" cy="360" rx="108" ry="70" fill="#d9ecd9" stroke="#6d9a74" stroke-width="2"/>
  <text x="610" y="367" text-anchor="middle" class="l">PERFORMER</text>
  <path d="M430 470 C515 530 705 530 790 470" fill="none" stroke="#d6a25f" stroke-width="26" stroke-linecap="round" opacity=".35"/>
  <text x="610" y="520" text-anchor="middle" class="l">OBSERVER · TEMPORARY</text>

  <path d="M305 565 L920 565" stroke="#775bba" stroke-width="34" stroke-linecap="round" opacity=".28"/>
  <text x="612" y="573" text-anchor="middle" class="l">RESIDENT CONTINUITY · ALWAYS CLEAR</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#586270"/></marker></defs>
  <text x="60" y="692" class="s">OFF_RETURN: reset closes, mobile kit leaves, borrowed field returns fully; no public-space identity remains on site.</text>
</svg>
