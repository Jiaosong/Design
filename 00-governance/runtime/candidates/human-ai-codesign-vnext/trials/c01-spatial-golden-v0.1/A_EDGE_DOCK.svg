  <rect x="60" y="125" width="980" height="515" rx="24" fill="#fff" stroke="#ccd2d9" stroke-width="2"/>
  <rect x="95" y="155" width="160" height="455" rx="16" fill="#eaf1f7" stroke="#86a4bd" stroke-width="2"/>
