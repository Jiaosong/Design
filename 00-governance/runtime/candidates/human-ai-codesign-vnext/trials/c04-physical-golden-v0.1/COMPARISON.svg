<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .bg{fill:#f4f0e5}.paper{fill:#fbf9f3;stroke:#c9c7bc;stroke-width:1.4}.ink{fill:#17332c}.muted{fill:#687870}.q{fill:#548b7e}.r{fill:#a54539}.wood{fill:#a98655}.steel{fill:#29433b}.pad{fill:#7c8e86}.accent{fill:#d8ddd7;stroke:#29433b;stroke-width:2}.line{fill:none;stroke:#17332c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#7f8c85;stroke-width:1.3}.dash{fill:none;stroke:#a54539;stroke-width:2;stroke-dasharray:8 7}.t1{font:700 40px 'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif}.t2{font:700 22px 'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif}.txt{font:400 14px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}.sm{font:400 12px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif}.xs{font:700 10px 'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif;letter-spacing:1.1px}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text x="60" y="60" class="xs q">C04 P02 / PHYSICAL CO-DESIGN GOLDEN TRIAL v0.1</text>
  <text x="60" y="116" class="t1 ink">同一身体关系，三种可逆夹持与维护机制</text>
  <text x="60" y="153" class="txt muted">比较的是 attachment / service / cleaning / replacement 机制，不是造型风格，也不是结构承载方案。</text>
  <text x="60" y="188" class="xs r">NTS · FIELD OPEN · NO STRUCTURAL ADEQUACY · NO INSTALLATION AUTHORITY · NO DESIGN KEEP</text>
  <line x1="60" y1="214" x2="1540" y2="214" class="thin"/>

  <g transform="translate(60 255)">
    <rect width="460" height="520" rx="22" class="paper"/>
    <text x="24" y="38" class="xs q">A / TWIN SADDLE PODS</text><text x="24" y="78" class="t2 ink">两个局部夹持 pod</text>
    <rect x="70" y="150" width="20" height="190" class="steel"/><rect x="360" y="150" width="20" height="190" class="steel"/><rect x="70" y="160" width="310" height="18" class="steel"/>
    <rect x="130" y="210" width="190" height="48" rx="10" class="wood"/><rect x="142" y="258" width="166" height="10" rx="5" class="pad"/>
    <path d="M152 268v48h42v-48M266 268v48h42v-48" class="line"/><circle cx="173" cy="297" r="9" class="r"/><circle cx="287" cy="297" r="9" class="r"/>
    <text x="24" y="382" class="xs r">+ LOCAL REPLACEABILITY</text><text x="24" y="408" class="sm muted">局部坏局部换；开放背面更利清洁。</text>
    <text x="24" y="452" class="xs r">− MORE POINT INTERFACES</text><text x="24" y="478" class="sm muted">零件与点接口更多；不代表更强承载。</text>
  </g>
  <g transform="translate(570 255)">
    <rect width="460" height="520" rx="22" class="paper"/>
    <text x="24" y="38" class="xs q">B / SERVICE BRIDGE</text><text x="24" y="78" class="t2 ink">一块后侧可拆 service bridge</text>
    <rect x="70" y="150" width="20" height="190" class="steel"/><rect x="360" y="150" width="20" height="190" class="steel"/><rect x="70" y="160" width="310" height="18" class="steel"/>
    <rect x="130" y="210" width="190" height="48" rx="10" class="wood"/><rect x="142" y="258" width="166" height="10" rx="5" class="pad"/><rect x="142" y="280" width="166" height="52" rx="8" class="accent"/>
    <path d="M165 280v-22h30v22M255 280v-22h30v22" class="line"/>
    <path d="M155 296h140M155 318h140" class="dash"/><circle cx="162" cy="306" r="8" class="r"/><circle cx="288" cy="306" r="8" class="r"/>
    <text x="24" y="382" class="xs r">+ ASSEMBLY READABILITY</text><text x="24" y="408" class="sm muted">两接口与检修关系集中在一个主件。</text>
    <text x="24" y="452" class="xs r">− BROAD CONTACT ZONE</text><text x="24" y="478" class="sm muted">背面更重；清洁/排水设计要求更高。</text>
  </g>
  <g transform="translate(1080 255)">
    <rect width="460" height="520" rx="22" class="paper"/>
    <text x="24" y="38" class="xs q">C / SPLIT POST COLLARS</text><text x="24" y="78" class="t2 ink">两根立柱上的分体 collar</text>
    <rect x="72" y="150" width="24" height="190" class="steel"/><rect x="350" y="150" width="24" height="190" class="steel"/><rect x="72" y="160" width="302" height="18" class="steel"/>
    <rect x="62" y="214" width="44" height="72" rx="17" class="accent"/><rect x="340" y="214" width="44" height="72" rx="17" class="accent"/><path d="M106 250h75M340 250h-55" class="line"/>
    <rect x="180" y="218" width="106" height="48" rx="9" class="wood"/><rect x="186" y="266" width="94" height="9" rx="4" class="pad"/>
    <text x="24" y="382" class="xs r">+ CLEAR SERVICE POINTS</text><text x="24" y="408" class="sm muted">两处拆装点清楚，不需要连续背板。</text>
    <text x="24" y="452" class="xs r">− HIGHEST SITE DEPENDENCY</text><text x="24" y="478" class="sm muted">立柱间距与托臂投影可能直接否决。</text>
  </g>

  <g transform="translate(60 815)">
    <rect width="1480" height="125" rx="18" class="paper"/>
    <text x="24" y="34" class="xs r">LOCKED ACROSS A / B / C</text>
    <text x="24" y="68" class="txt ink">双脚落地短时半倚 · 无落地支腿 · 可逆连接 · 缓冲/紧固件可维护 · 通行优先 · 清洁/排水明确</text>
    <text x="24" y="98" class="sm muted">现有栏杆承载、几何、许可、边缘安全、湿滑与净宽全部未验证。三案都可能被现场证据直接否决。</text>
  </g>
</svg>
