<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLEANDER Technical SVG Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#ececec}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:320px 1fr;min-height:100vh}.panel{background:#fff;padding:16px;border-right:1px solid #ccc}.stage{display:grid;place-items:center;padding:24px}.sheet{background:#fff;box-shadow:0 8px 30px #0002;max-width:100%;max-height:90vh}.row{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:8px 0}label{font-size:12px;font-weight:600}input,button,select{width:100%;padding:7px;border:1px solid #bbb;background:#fff}button{cursor:pointer}.note{font-size:11px;line-height:1.45;color:#555}.status{font:11px/1.4 ui-monospace,monospace;background:#f4f4f4;padding:8px;margin-top:10px;white-space:pre-wrap}@media(max-width:760px){body{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #ccc}}</style></head>
<body><aside class="panel"><h2>OLEANDER Technical SVG Lab</h2><p class="note">Editable vector preflight for concept technical drawings, packaging and Retail POP. Working bleed/safe values are not supplier proof.</p><div class="row"><label>Width mm</label><input id="w" type="number" value="140"></div><div class="row"><label>Height mm</label><input id="h" type="number" value="180"></div><div class="row"><label>Bleed mm</label><input id="bleed" type="number" value="3"></div><div class="row"><label>Safe mm</label><input id="safe" type="number" value="5"></div><div class="row"><label>Corner radius</label><input id="radius" type="number" value="8"></div><label><input id="cut" type="checkbox" checked style="width:auto"> CUT</label> <label><input id="bld" type="checkbox" checked style="width:auto"> BLEED</label> <label><input id="sfe" type="checkbox" checked style="width:auto"> SAFE</label> <label><input id="dim" type="checkbox" checked style="width:auto"> DIMENSIONS</label><div style="height:12px"></div><button id="export">Export SVG</button><div id="status" class="status">READY</div></aside><main class="stage"><svg id="svg" class="sheet" xmlns="http://www.w3.org/2000/svg"></svg></main>
<script>
const $=id=>document.getElementById(id),svg=$('svg');['w','h','bleed','safe','radius','cut','bld','sfe','dim'].forEach(id=>$(id).addEventListener('input',draw));
function draw(){const w=+$('w').value,h=+$('h').value,b=+$('bleed').value,s=+$('safe').value,r=+$('radius').value,pad=24;const vw=w+2*b+pad*2,vh=h+2*b+pad*2;svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);svg.setAttribute('width',Math.min(900,vw*3));svg.setAttribute('height',Math.min(900,vh*3));const x=pad+b,y=pad+b;const bleed=`<rect x="${x-b}" y="${y-b}" width="${w+2*b}" height="${h+2*b}" rx="${r+b}" fill="none" stroke="#1f6feb" stroke-width="0.6" stroke-dasharray="3 2"/>`;const cut=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fafafa" stroke="#d22" stroke-width="0.8"/>`;const safe=`<rect x="${x+s}" y="${y+s}" width="${Math.max(0,w-2*s)}" height="${Math.max(0,h-2*s)}" rx="${Math.max(0,r-s/2)}" fill="none" stroke="#188038" stroke-width="0.5" stroke-dasharray="2 2"/>`;const art=`<g id="ARTWORK"><text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700">ARTWORK AREA</text><text x="${x+w/2}" y="${y+h/2+11}" text-anchor="middle" font-family="Arial,sans-serif" font-size="4">Replace with project vector artwork</text></g>`;const dims=`<g id="DIMENSIONS" font-family="Arial,sans-serif" font-size="4" fill="#111" stroke="#111" stroke-width="0.35"><line x1="${x}" y1="${y-9}" x2="${x+w}" y2="${y-9}"/><line x1="${x}" y1="${y-12}" x2="${x}" y2="${y-6}"/><line x1="${x+w}" y1="${y-12}" x2="${x+w}" y2="${y-6}"/><text x="${x+w/2}" y="${y-11}" text-anchor="middle" stroke="none">${w} mm</text><line x1="${x-9}" y1="${y}" x2="${x-9}" y2="${y+h}"/><line x1="${x-12}" y1="${y}" x2="${x-6}" y2="${y}"/><line x1="${x-12}" y1="${y+h}" x2="${x-6}" y2="${y+h}"/><text x="${x-11}" y="${y+h/2}" text-anchor="middle" transform="rotate(-90 ${x-11} ${y+h/2})" stroke="none">${h} mm</text></g>`;svg.innerHTML=`<rect width="100%" height="100%" fill="#eee"/><g id="BLEED">${$('bld').checked?bleed:''}</g><g id="CUT">${$('cut').checked?cut:''}</g><g id="SAFE">${$('sfe').checked?safe:''}</g>${art}${$('dim').checked?dims:''}<text x="${pad}" y="${vh-8}" font-family="Arial,sans-serif" font-size="3.5">CONCEPT / NTS unless project scale authority says otherwise · BLEED ${b} mm WORKING · SAFE ${s} mm WORKING · VENDOR CONFIRM</text>`;$('status').textContent=`SIZE ${w}×${h} mm\nBLEED ${b} mm WORKING\nSAFE ${s} mm WORKING\nCUT=${$('cut').checked}\nVENDOR_CONFIRM=OPEN`;}
$('export').onclick=()=>{draw();const xml='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(svg);const b=new Blob([xml],{type:'image/svg+xml'});const a=document.createElement('a');a.download='oleander-technical-master.svg';a.href=URL.createObjectURL(b);a.click()};draw();
</script></body></html>
